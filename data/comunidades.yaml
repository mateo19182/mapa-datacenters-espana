# Nombres canónicos de comunidad autónoma y sus variantes.
#
# Distintos investigadores y distintas fuentes oficiales usan denominaciones
# diferentes para la misma comunidad («Comunitat Valenciana» y «Comunidad
# Valenciana», «Navarra» y «Comunidad Foral de Navarra»). Sin unificarlas, los
# cruces entre la capa de centros de datos y la capa eléctrica fallan en
# silencio: una subestación deja de aparecer en la ficha de su región.
#
# Se elige la forma más usada en castellano; las oficiales completas quedan
# como variantes.

