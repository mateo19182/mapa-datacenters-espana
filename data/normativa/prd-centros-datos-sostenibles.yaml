actores:
  - nombre: "Ministerio para la Transición Ecológica y el Reto Demográfico"
    rol: promotor
    postura: favorable
    voz: "Sara Aagesen, vicepresidenta tercera"
    resumen: >-
      Departamento que recibe las alegaciones, a través de la Dirección General de Política
      Energética y Minas. Defiende que la norma evita que el consumo de los centros de datos
      encarezca la electricidad al resto.
    cita: >-
      Los Ministerios para la Transición Ecológica y el Reto Demográfico, Economía, Comercio y
      Empresa, y Transformación Digital y Función Pública avanzan en un desarrollo ordenado y
      eficiente de los centros de datos.
    fuentes: [src-miteco-prensa]
  - nombre: "Ministerio para la Transformación Digital y de la Función Pública"
    rol: competente
    postura: favorable
    resumen: >-
      Recibe las declaraciones responsables de soberanía digital y ejerce su control posterior.
    cita: >-
      La entidad operadora presentará ante el Ministerio para la Transformación Digital y de la
      Función Pública una declaración responsable en la que manifieste que cumple los requisitos de
      soberanía digital.
    fuentes: [src-prd]
  - nombre: "Ministerio de Economía, Comercio y Empresa"
    rol: promotor
    postura: favorable
    resumen: "Tercer departamento proponente del texto."
    cita: "El proyecto ha sido desarrollado por los Ministerios para la Transición Ecológica y el Reto
      Demográfico; Economía, Comercio y Empresa; y Transformación Digital y Función Pública."
    fuentes: [src-europapress]
  - nombre: "Spain DC (Asociación Española de Centros de Datos)"
    rol: alegante
    postura: contraria
    voz: "Emilio Díaz, presidente; Begoña Villacís, directora ejecutiva"
    resumen: >-
      Presentará alegaciones y pide cambios sustanciales, ampliación del plazo de audiencia y una
      mesa técnica. Cifra en un 80 %-90 % la nueva inversión en riesgo y sostiene que España pasaría
      a tener el marco más restrictivo de la Unión Europea. Comparte, en cambio, el objetivo de
      combatir la especulación con los permisos.
    cita: >-
      Las reglas pueden cambiar, pero cambiar de forma estructural las condiciones de esas
      inversiones y conceder apenas seis meses para adaptarse plantea un problema muy serio de
      seguridad jurídica y proporcionalidad.
    fuentes: [src-expansion, src-eleconomista, src-ejeprime]
  - nombre: "Templus"
    rol: alegante
    postura: contraria
    voz: "Nacho Velilla, consejero delegado"
    resumen: "Operador con varios emplazamientos en el registro; anuncia alegaciones propias."
    cita: >-
      Habría que preguntarse a quién beneficia realmente este decreto y por qué el Gobierno deja al
      sector en España a los pies de los caballos, en clara desventaja competitiva con nuestros
      vecinos europeos.
    fuentes: [src-cincodias]
  - nombre: "Gobierno de Aragón"
    rol: alegante
    postura: contraria
    voz: "Eva Valle, consejera de Economía, Competitividad y Empleo"
    resumen: >-
      Alegará ante los tres ministerios. Denuncia inseguridad jurídica para los proyectos en
      tramitación y el plazo de ocho días para alegar. Mantiene, aun así, el calendario de sus
      declaraciones de interés general.
    cita: >-
      Este proyecto es especialmente dañino para la comunidad de Aragón y parece diseñado para
      hundir el programa de inversiones en nuestro territorio.
    fuentes: [src-periodico-aragon, src-eldiario-aragon]
  - nombre: "Junta de Extremadura"
    rol: alegante
    postura: contraria
    voz: "Mercedes Morán, consejera de Industria, Energía, Ciencia y Territorio"
    resumen: >-
      Alega contra el reparto competencial: que sean tres ministerios los que valoren la madurez de
      los proyectos deja fuera a las comunidades autónomas.
    cita: >-
      No decimos que no se regule, lo que decimos es que para regularse tendrá que contar con los
      territorios, tendrá que contar con las comunidades autónomas.
    fuentes: [src-extremadura]
  - nombre: "Delegación del Gobierno en Aragón"
    rol: destinatario
    postura: favorable
    voz: "Fernando Beltrán, delegado del Gobierno"
    resumen: "Defiende la norma frente al Ejecutivo autonómico."
    cita: >-
      Esta norma busca que el gran consumo de electricidad de los centros de datos no cause un
      incremento en la factura de la luz de todos los aragoneses y aragonesas.
    fuentes: [src-eldiario-aragon]
  - nombre: "Comisión Nacional de los Mercados y la Competencia"
    rol: supervisor
    postura: critica
    resumen: >-
      Respalda ordenar el despliegue. Recomienda flexibilizar la adicionalidad, la correlación
      horaria y la adaptación de proyectos avanzados; reconocer almacenamiento y gestión de demanda;
      revisar PUE y WUE y aclarar competencias y recargos. Son recomendaciones, pendientes del texto
      definitivo.
    cita: >-
      introducir mayor flexibilidad temporal en la aplicación de los requisitos
    fuentes: [src-prd, src-cnmc-informe]
afecta:
  - tipo: registro
    ref: null
    como: >-
      El borrador distingue los requisitos de acceso para centros de al menos 1 MW no conectados a
      su entrada en vigor y la información pública desde 500 kW de potencia TI. No basta el estado
      del emplazamiento en el registro para determinar qué obligaciones le corresponderían.
    fuentes: [ src-prd ]
  - tipo: proyecto
    ref: acs-alcala-de-henares-campus
    como: >-
      Proyecto en construcción sin conexión acreditada: entraría en el plazo de seis meses para
      acreditar requisitos so pena de caducidad de los permisos.
    fuentes: [src-prd]
  - tipo: proyecto
    ref: acs-la-puebla-de-alfinden-centro-datos
    como: >-
      Proyecto en tramitación con capacidad concedida en Peñaflor: quedaría sujeto a los requisitos
      antes de que se resuelva su acceso.
    fuentes: [src-prd]
  - tipo: region
    ref: "Aragón"
    como: >-
      Diez promotores esperaban su declaración de interés general cuando salió el borrador; el
      Gobierno autonómico mantiene el calendario y confía en que se adapten.
    fuentes: [src-heraldo]
  - tipo: region
    ref: "Extremadura"
    como: >-
      La Junta sitúa Río Caya y el proyecto de Merlin en Navalmoral entre los más avanzados y teme
      que la valoración estatal de madurez decida su suministro.
    fuentes: [src-extremadura]
