id: prd-centros-datos-sostenibles
titulo: "Proyecto de Real Decreto de sostenibilidad, resiliencia y soberanía digital de los centros de datos"
titulo_oficial: "Proyecto de Real Decreto por el que se regulan los requisitos de sostenibilidad energética, medioambiental y de resiliencia y soberanía digital aplicables a los centros de datos"
ambito: estatal
rango: proyecto_real_decreto
estado: audiencia_publica
estado_detalle: >-
  Borrador en audiencia e información pública por la vía de urgencia entre el 27 de
  agosto y el 4 de septiembre de 2026: ocho días naturales. No está aprobado, no está
  en vigor y su texto puede cambiar entero. Un borrador anterior, de agosto de 2025,
  ya pasó por audiencia pública con otro contenido.
boletin: null
referencia: null
url_oficial: "https://www.miteco.gob.es/es/energia/participacion/2026/detalle-participacion-publica-k-851.html"
fecha_aprobacion: null
fecha_publicacion: null
materias: [acceso_a_red, renovables, eficiencia, agua, soberania_digital, transparencia]
resumen: >-
  Condiciona el permiso de acceso a la red de todo centro de datos de 1 MW o más al
  cumplimiento de tres bloques de requisitos: soberanía digital, eficiencia energética e
  hídrica de clase «A» europea, y cobertura renovable con adicionalidad y correlación
  horaria. Quien incumpla paga recargos sobre peajes y cargos, y puede perder los
  permisos.
por_que_importa: >-
  Es la norma que decide qué parte del pipeline anunciado llega a existir. Se aplica a
  las solicitudes aún no resueltas y a los proyectos con permiso otorgado que todavía no
  se han conectado —es decir, a casi todo lo que este registro clasifica como anunciado,
  en tramitación o en construcción— y les da tres o seis meses para acreditar requisitos
  que no existían cuando se diseñaron.
obligaciones:
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Presentar ante el Ministerio para la Transformación Digital y de la Función Pública
      una declaración responsable de cumplimiento de los requisitos de soberanía digital:
      establecimiento en la Unión Europea, permanencia en ella de los datos, metadatos y
      registros bajo su control, control y trazabilidad del soporte desde terceros países,
      supervisión de subcontratistas directos y medidas frente a accesos requeridos por
      autoridades de terceros países. Sin acreditar esa presentación, el gestor de red no
      puede firmar el contrato ATR.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Antes de la puesta en explotación; y en la propia solicitud de acceso, como compromiso"
    fuentes: [src-prd]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Acreditar niveles de eficiencia energética e hídrica de clase «A» de la etiqueta
      europea. Hasta que ese etiquetado se aplique —previsto para agosto de 2027— rigen
      un PUE máximo de 1,15 y un WUE máximo de 0,1, calculados según el anexo III del
      Reglamento Delegado (UE) 2024/1364. Estar en clase «B» o peor dos años seguidos es
      incumplimiento grave.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Con la solicitud de acceso y, después, cada año antes del 15 de octubre"
    fuentes: [src-prd]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Cubrir el 80 % de su consumo total con autoconsumo o con contratos de compra de
      electricidad renovable a plazo de instalaciones ubicadas en España, cuya acta de
      puesta en servicio no sea anterior en más de dieciocho meses a la entrada en
      funcionamiento del centro. Es el requisito de adicionalidad.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Verificación anual por el gestor de red"
    fuentes: [src-prd, src-miteco-prensa]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Garantizar que la energía consumida en cada hora está respaldada al menos en un
      80 % por electricidad renovable generada en esa misma hora. Es el requisito de
      correlación horaria.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Verificación mensual a efectos de recargos"
    fuentes: [src-prd, src-miteco-prensa]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Remitir cada año, antes del 15 de mayo, a la Dirección General de Planificación y
      Coordinación Energética la información y los indicadores de los anexos I y II del
      Reglamento Delegado (UE) 2024/1364, que se publicarán en el portal del MITECO.
    umbral: "≥ 500 kW de potencia de tecnología de la información"
    plazo: "Anual, antes del 15 de mayo"
    fuentes: [src-prd]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Comunicar si tiene en cuenta las mejores prácticas del código de conducta europeo
      sobre eficiencia energética de los centros de datos y de qué manera; y justificarlo
      cuando no las aplique.
    umbral: "≥ 1 MW de potencia de tecnología de la información"
    plazo: "Anual, antes del 15 de mayo"
    fuentes: [src-prd, src-miteco-prensa]
  - quien: "Proyectos con permisos otorgados y no conectados a la red"
    que: >-
      Acreditar el cumplimiento de todos los requisitos o los permisos de acceso y
      conexión caducan, con ejecución de las garantías depositadas. Cabe renunciar sin
      ejecución de garantías dentro del mismo plazo.
    umbral: null
    plazo: "Seis meses desde la entrada en vigor"
    fuentes: [src-prd, src-ejeprime]
  - quien: "Solicitudes de acceso presentadas y no resueltas favorablemente"
    que: "Acreditar los requisitos o la solicitud se deniega, previo requerimiento de subsanación y audiencia."
    umbral: null
    plazo: "Tres meses desde la entrada en vigor"
    fuentes: [src-prd]
