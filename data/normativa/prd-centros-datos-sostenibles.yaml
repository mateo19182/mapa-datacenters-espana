incertidumbres:
  - campo: estado
    descripcion: >-
      No se ha localizado texto definitivo aprobado a 17 de octubre. El 80 %, los dieciocho meses y
      los plazos de tres y seis meses siguen siendo propuestas del borrador. El informe de la CNMC
      no las modifica por sí mismo. Los plazos de adaptación empezarían con la eventual entrada en
      vigor, prevista en el borrador a los veinte días de publicarse.
    fuentes:
      - src-prd
      - src-cnmc-expediente
      - src-consejo-20261013
      - src-boe-sumario-20261017
  - campo: obligaciones
    descripcion: >-
      El umbral general de 1 MW es de acceso e incluye grupos de centros en una misma ubicación y
      titularidad que lo alcancen agregadamente. El de información de 500 kW es de potencia TI. Se
      excluyen los centros destinados exclusivamente a defensa, protección civil y seguridad
      pública. Ningún umbral permite convertir MW de acceso en MW TI.
    fuentes: [ src-prd ]
  - campo: actores
    descripcion: >-
      Las cifras de inversión en riesgo —entre el 80 % y el 90 % de la nueva inversión, 66.900
      millones acumulados 2026-2030— proceden de la patronal del sector y de su propio informe
      anual. Son estimaciones de parte interesada en la tramitación, no un dato contrastado.
    fuentes: [src-eleconomista, src-ejeprime]
  - campo: contexto_red
    descripcion: El informe de la CNMC recoge unos 12 GW concedidos, 27 GW en tramitación y más de 32 GW
      denegados para centros de datos, y renuncias de 1,6 GW anteriores al cierre del informe. Son
      agregados de acceso, no carga IT ni cancelaciones de emplazamientos identificados; no se
      asignan a fichas ni se restan automáticamente del CSV de REE.
    fuentes:
      - src-cnmc-informe
