incertidumbres:
  - campo: estado
    descripcion: >-
      El texto está en audiencia pública, no aprobado. Todas las cifras de esta ficha
      —el 80 %, los dieciocho meses, el PUE de 1,15, los plazos de tres y seis meses—
      son las del borrador de 27 de agosto de 2026 y pueden cambiar antes de su
      aprobación. La disposición adicional tercera permite además modificar por
      resolución varios de esos umbrales una vez en vigor.
    fuentes: [src-prd]
  - campo: obligaciones
    descripcion: >-
      El umbral de 1 MW se expresa en potencia de acceso y el de 500 kW en potencia de
      tecnología de la información. Son dos magnitudes distintas y la norma no las
      convierte una en otra: un mismo centro puede estar dentro de una obligación y
      fuera de la otra.
    fuentes: [src-prd]
  - campo: actores
    descripcion: >-
      Las cifras de inversión en riesgo —entre el 80 % y el 90 % de la nueva inversión,
      66.900 millones acumulados 2026-2030— proceden de la patronal del sector y de su
      propio informe anual. Son estimaciones de parte interesada en la tramitación, no
      un dato contrastado.
    fuentes: [src-eleconomista, src-ejeprime]
