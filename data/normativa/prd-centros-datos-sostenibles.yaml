id: prd-centros-datos-sostenibles
titulo: "Proyecto de Real Decreto de sostenibilidad, resiliencia y soberanía digital de los centros
  de datos"
titulo_oficial: "Proyecto de Real Decreto por el que se regulan los requisitos de sostenibilidad
  energética, medioambiental y de resiliencia y soberanía digital aplicables a los centros de datos"
ambito: estatal
rango: proyecto_real_decreto
estado: en_tramitacion
estado_detalle: >-
  Audiencia cerrada el 10 de septiembre de 2026 a las 17:00, tras la ampliación acordada el día 2.
  El Pleno de la CNMC emitió su informe el 22 de septiembre. La revisión de MITECO, CNMC, Moncloa y
  BOE a 17 de octubre no ha localizado aprobación ni publicación de un texto definitivo. El Plan
  IA360 anunciaba su aprobación en octubre; es una previsión política, no una entrada en vigor. Los
  requisitos registrados corresponden al borrador de agosto.
boletin: null
referencia: null
url_oficial: "https://www.miteco.gob.es/es/energia/participacion/2026/detalle-participacion-publica-k-851.html"
fecha_aprobacion: null
fecha_publicacion: null
materias: [acceso_a_red, renovables, eficiencia, agua, soberania_digital, transparencia]
resumen: >-
  El borrador condicionaría el permiso de acceso a la red de los centros de datos de 1 MW o más a
  requisitos de soberanía digital, eficiencia energética e hídrica y cobertura renovable con
  adicionalidad y correlación horaria. Prevé recargos y pérdida de permisos. La CNMC respalda
  ordenar el despliegue, pero recomienda ajustar los requisitos y su aplicación transitoria. No hay
  un texto definitivo aprobado identificado.
por_que_importa: >-
  El texto que finalmente se apruebe podría condicionar proyectos con permiso de acceso todavía sin
  conexión y solicitudes pendientes. Los porcentajes renovables, los plazos de adaptación y las
  reglas de eficiencia del borrador siguen sujetos a revisión. El informe de la CNMC es una
  aportación consultiva, no una modificación ya incorporada ni una norma vigente.
obligaciones:
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Presentar ante el Ministerio para la Transformación Digital y de la Función Pública una
      declaración responsable de cumplimiento de los requisitos de soberanía digital:
      establecimiento en la Unión Europea, permanencia en ella de los datos, metadatos y registros
      bajo su control, control y trazabilidad del soporte desde terceros países, supervisión de
      subcontratistas directos y medidas frente a accesos requeridos por autoridades de terceros
      países. Sin acreditar esa presentación, el gestor de red no puede firmar el contrato ATR.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Antes de la puesta en explotación; y en la propia solicitud de acceso, como compromiso"
    fuentes: [src-prd]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Acreditar eficiencia energética e hídrica de clase A de la etiqueta europea. Hasta que se
      aplique ese etiquetado, el borrador usaría PUE máximo de 1,15 y WUE máximo de 0,1, calculados
      según el anexo III de 2024/1364. Dos años consecutivos en clase B o inferior constituirían
      incumplimiento grave.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Con la solicitud de acceso y, después, cada año antes del 15 de octubre"
    fuentes: [ src-prd ]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Fuera de la vía alternativa del artículo 7, cubrir el 80 % del consumo total con autoconsumo o
      contratos de compra de electricidad renovable a plazo de instalaciones en España. Su puesta en
      servicio no podría preceder en más de dieciocho meses al funcionamiento del centro o al primer
      uso de esa energía.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Verificación anual por el gestor de red"
    fuentes: [ src-prd, src-miteco-prensa ]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Fuera de la vía alternativa del artículo 7, acreditar que al menos el 80 % de la energía
      consumida en cada hora procede de electricidad renovable generada en esa misma hora.
    umbral: "≥ 1 MW de potencia de acceso"
    plazo: "Verificación mensual a efectos de recargos"
    fuentes: [ src-prd, src-miteco-prensa ]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Remitir cada año, antes del 15 de mayo, a la Dirección General de Planificación y Coordinación
      Energética la información y los indicadores de los anexos I y II del Reglamento Delegado (UE)
      2024/1364, que se publicarán en el portal del MITECO.
    umbral: "≥ 500 kW de potencia de tecnología de la información"
    plazo: "Anual, antes del 15 de mayo"
    fuentes: [src-prd]
  - quien: "Entidad operadora o titular de un centro de datos"
    que: >-
      Comunicar si tiene en cuenta las mejores prácticas del código de conducta europeo sobre
      eficiencia energética de los centros de datos y de qué manera; y justificarlo cuando no las
      aplique.
    umbral: "≥ 1 MW de potencia de tecnología de la información"
    plazo: "Anual, antes del 15 de mayo"
    fuentes: [src-prd, src-miteco-prensa]
  - quien: "Proyectos con permisos otorgados y no conectados a la red"
    que: >-
      Acreditar el cumplimiento de todos los requisitos o los permisos de acceso y conexión caducan,
      con ejecución de las garantías depositadas. Cabe renunciar sin ejecución de garantías dentro
      del mismo plazo.
    umbral: null
    plazo: "Seis meses desde la entrada en vigor"
    fuentes: [src-prd, src-ejeprime]
  - quien: "Solicitudes de acceso presentadas y no resueltas favorablemente"
    que: "Acreditar los requisitos o la solicitud se deniega, previo requerimiento de subsanación y
      audiencia."
    umbral: null
    plazo: "Tres meses desde la entrada en vigor"
    fuentes: [src-prd]
  - quien: Solicitantes de acceso que se acojan al artículo 7 del borrador
    que: Considerar cumplidos los requisitos renovables cuando la cuota nacional de generación renovable
      del año n−2 haya superado el 90 %, con el régimen de mantenimiento y cese previsto en el
      artículo. El permiso quedaría condicionado a un máximo anual de horas de consumo. Sin la
      resolución anual que publique cuota y horas, la cuota se consideraría inferior al 90 %.
    umbral: ≥ 1 MW de potencia de acceso; vía alternativa a adicionalidad y correlación horaria
    plazo: Si llega a aprobarse; resolución de cuota y horas al menos dos meses antes del año n
    fuentes:
      - src-prd
