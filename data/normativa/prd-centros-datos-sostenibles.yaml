incertidumbres:
  - campo: estado
    descripcion: >-
      La audiencia está cerrada y el proyecto continúa en tramitación, sin texto definitivo aprobado
      identificado a 14 de octubre. El 80 %, los dieciocho meses y los plazos de tres y seis meses
      son propuestas del borrador. No se han sustituido por las recomendaciones de la CNMC.
    fuentes: [src-prd, src-cnmc-expediente, src-consejo-20261013]
  - campo: obligaciones
    descripcion: >-
      El umbral de 1 MW se expresa en potencia de acceso y el de 500 kW en potencia de tecnología de
      la información. Son dos magnitudes distintas y la norma no las convierte una en otra: un mismo
      centro puede estar dentro de una obligación y fuera de la otra.
    fuentes: [src-prd]
  - campo: actores
    descripcion: >-
      Las cifras de inversión en riesgo —entre el 80 % y el 90 % de la nueva inversión, 66.900
      millones acumulados 2026-2030— proceden de la patronal del sector y de su propio informe
      anual. Son estimaciones de parte interesada en la tramitación, no un dato contrastado.
    fuentes: [src-eleconomista, src-ejeprime]
  - campo: contexto_red
    descripcion: El informe de la CNMC recoge unos 12 GW concedidos, 27 GW en tramitación y más de 32 GW
      denegados para centros de datos, y renuncias de 1,6 GW anteriores al cierre del informe. Son
      agregados de acceso, no carga IT ni cancelaciones de emplazamientos identificados; no se
      asignan a fichas ni se restan automáticamente del CSV de REE.
    fuentes:
      - src-cnmc-informe
