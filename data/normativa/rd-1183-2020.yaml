id: rd-1183-2020
titulo: "Real Decreto 1183/2020, de acceso y conexión a las redes eléctricas"
titulo_oficial: "Real Decreto 1183/2020, de 29 de diciembre, de acceso y conexión a las redes de transporte y distribución de energía eléctrica"
ambito: estatal
rango: real_decreto
estado: en_vigor
estado_detalle: >-
  En vigor y modificado varias veces. El RDL 8/2023 le añadió los concursos de capacidad
  de demanda (arts. 20 bis a 20 quáter) y el régimen de garantías del art. 23 bis; ese
  artículo 23 bis quedó derogado el 22 de marzo de 2026 por el RDL 7/2026.
boletin: BOE
referencia: "BOE-A-2020-17278"
url_oficial: "https://www.boe.es/buscar/act.php?id=BOE-A-2020-17278"
fecha_aprobacion: "2020-12-29"
fecha_publicacion: "2020-12-30"
materias: [acceso_a_red]
resumen: >-
  El marco general de los dos permisos que hacen falta para enchufar un consumo grande a
  la red: acceso, que dice si el sistema puede suministrar esa potencia en ese punto, y
  conexión, que dice si físicamente cabe. Fija la prelación temporal como criterio de
  reparto y regula los concursos cuando en un nudo no caben todos.
por_que_importa: >-
  Es la norma bajo la que se han pedido y otorgado los permisos de acceso de casi todo el
  registro. Los MW de conexión que figuran en las fichas son los de este procedimiento, y
  no son ni MW IT ni potencia instalada.
obligaciones:
  - quien: "Promotor de una instalación de demanda"
    que: >-
      Obtener permiso de acceso y permiso de conexión antes de conectarse. El criterio
      general de reparto es la prelación temporal desde la admisión a trámite de la
      solicitud completa.
    umbral: null
    plazo: null
    fuentes: [src-boe-rd1183]
  - quien: "Gestor de la red de distribución"
    que: >-
      Solicitar informe de aceptabilidad al gestor de la red de transporte cuando la
      petición pueda afectar aguas arriba, y denegar el acceso si ese informe es
      desfavorable.
    umbral: null
    plazo: null
    fuentes: [src-boe-circular]
hitos:
  - fecha: "2020-12-30"
    hito: "Publicación en el BOE"
    fuentes: [src-boe-rd1183]
  - fecha: "2023-12-27"
    hito: >-
      El RDL 8/2023 introduce los concursos de capacidad de demanda y el régimen de
      garantías del artículo 23 bis
    fuentes: [src-boe-rdl7]
  - fecha: "2026-03-22"
    hito: "El RDL 7/2026 deroga el artículo 23 bis y sustituye los avales por la prestación por reserva de capacidad"
    fuentes: [src-boe-rdl7]
actores:
  - nombre: "Red Eléctrica de España"
    rol: competente
    postura: sin_constar
    resumen: "Gestor de la red de transporte: concede acceso y conexión en los nudos de 400 y 220 kV."
    fuentes: [src-ree-csv]
  - nombre: "Comisión Nacional de los Mercados y la Competencia"
    rol: supervisor
    postura: sin_constar
    resumen: "Resuelve los conflictos de acceso y fija la metodología mediante circular."
    fuentes: [src-boe-circular]
afecta:
  - tipo: registro
    ref: null
    como: >-
      Define qué significan los MW de conexión que este registro guarda en un campo aparte
      de los MW IT.
    fuentes: [src-boe-rd1183]
relacionadas: [rdl-7-2026, rdl-18-2026, circular-1-2024-cnmc, prd-centros-datos-sostenibles]
