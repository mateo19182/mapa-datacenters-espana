  - fecha: "2026-06-29"
    hito: "Aprobado en Consejo de Ministros"
    fuentes: [src-boe-rdl18]
  - fecha: "2026-07-01"
    hito: "Entrada en vigor"
    fuentes: [src-boe-rdl18]
