id: rdl-18-2026
titulo: "Real Decreto-ley 18/2026, de ajuste del Plan Integral de Respuesta a la Crisis en Oriente Medio"
titulo_oficial: "Real Decreto-ley 18/2026, de 29 de junio, por el que se adoptan determinadas medidas en el marco del Plan Integral de Respuesta a la Crisis en Oriente Medio"
ambito: estatal
rango: real_decreto_ley
estado: en_vigor
estado_detalle: "En vigor desde el 1 de julio de 2026 y convalidado por el Congreso el 23 de julio de 2026."
boletin: BOE
referencia: "BOE-A-2026-14112"
url_oficial: "https://www.boe.es/eli/es/rdl/2026/06/29/18/con"
fecha_aprobacion: "2026-06-29"
fecha_publicacion: "2026-06-30"
fecha_entrada_vigor: "2026-07-01"
materias: [acceso_a_red, energia]
resumen: >-
  Retoca el RDL 7/2026 tres meses después de su entrada en vigor: endurece el umbral de
  impago que hace caducar automáticamente un permiso de acceso —del 10 % anual al 10 %
  trimestral— y aclara que el plazo de cuatro años para formalizar el contrato de acceso
  se cuenta desde el 22 de marzo de 2026, no desde que se obtuvo el permiso.
por_que_importa: >-
  Afecta a la mecánica por la que un permiso de acceso muere. La aclaración del plazo de
  cuatro años da aire a los permisos antiguos que arrastra el registro; el cambio a
  cómputo trimestral acorta el margen de un promotor que deje de pagar la prestación.
obligaciones:
  - quien: "Titular de un permiso de acceso de demanda sujeto a la prestación por reserva de capacidad"
    que: >-
      Mantenerse al corriente de pago: un impago superior al 10 % de la cuantía trimestral,
      acumulando lo debido desde el inicio, provoca la caducidad automática del permiso de
      acceso y conexión y la pérdida del derecho a devolución de lo ya pagado.
    umbral: "> 10 % de la cuantía de un trimestre natural"
    plazo: "Trimestral"
    fuentes: [src-boe-rdl18, src-gap]
  - quien: "Titular de permisos de demanda anteriores al RDL 7/2026 sin contrato de acceso firmado"
    que: "Formalizar el contrato técnico de acceso dentro de un plazo de cuatro años."
    umbral: null
    plazo: "Cuatro años desde el 22 de marzo de 2026"
    fuentes: [src-gap, src-oc]
