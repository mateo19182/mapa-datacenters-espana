    titulo: "El Real Decreto-ley 18/2026, de 29 de junio: cambios en el marco regulatorio del sector energético"
    editor: "Osborne Clarke"
    tipo: otro
    fecha_publicacion: "2026-07-02"
    fecha_consulta: "2026-09-01"
    cita: >-
      Proyectos con permisos obtenidos años atrás no ven acortado su plazo por el tiempo ya
      transcurrido, sino que disponen de cuatro años completos contados desde el 22 de
