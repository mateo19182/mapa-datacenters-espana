    ref: null
    como: >-
      Cambia cuándo caduca un permiso de acceso de demanda, que es el dato que separa en
      este registro un proyecto vivo de uno que solo conserva un anuncio.
    fuentes: [src-oc]
relacionadas: [rdl-7-2026, rd-1183-2020]
