fuentes:
  - id: src-boe-rdl18
    url: "https://www.boe.es/eli/es/rdl/2026/06/29/18/con"
    titulo: "Real Decreto-ley 18/2026, de 29 de junio, por el que se adoptan determinadas medidas en el marco del Plan Integral de Respuesta a la Crisis en Oriente Medio"
    editor: "BOE"
    tipo: oficial
    fecha_publicacion: "2026-06-30"
    fecha_consulta: "2026-09-01"
    cita: >-
      Se procederá a la caducidad automática de dichos permisos cuando el incumplimiento
      del pago sea, en un trimestre natural, superior al 10 por ciento de la cuantía que se
      deba abonar en dicho trimestre.
  - id: src-gap
    url: "https://ga-p.com/wp-content/uploads/2026/07/RDL_18_2026_Medidas_Sector_electrico.pdf"
    titulo: "Análisis del Real Decreto-ley 18/2026: medidas en el sector eléctrico"
    editor: "Gómez-Acebo & Pombo"
    tipo: otro
    fecha_publicacion: "2026-07-24"
    fecha_consulta: "2026-09-01"
    cita: >-
      La modificación se refiere al incumplimiento de pago de dicha prestación que supondrá
      la caducidad automática del permiso de acceso y conexión cuando dicho impago sea
      superior al 10% en un trimestre natural (anteriormente, el RD-L 7/2026 preveía que el
      incumplimiento de pago fuese del 10% anual).
  - id: src-oc
