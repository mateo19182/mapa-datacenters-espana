    resumen: "Convalida la norma el 23 de julio de 2026."
    cita: >-
      El 23 de julio de 2026 el Congreso de los Diputados ha acordado la convalidación del
      Real Decreto-ley 18/2026, de 29 de junio, en vigor desde el 1 de julio de 2026.
    fuentes: [src-gap]
afecta:
