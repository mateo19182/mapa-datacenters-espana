    fuentes: [src-boe]
  - fecha: "2029-01-01"
    previsto: true
    hito: "Termina la restricción transitoria del tipo 3 a posiciones de consumidor dedicadas y operadas por el transportista"
    fuentes: [src-boe]
actores:
