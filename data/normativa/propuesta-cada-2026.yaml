id: propuesta-cada-2026
titulo: "Propuesta de Reglamento europeo de desarrollo de la nube y la inteligencia artificial (CADA)"
titulo_oficial: "Propuesta de Reglamento del Parlamento Europeo y del Consejo por el que se establece un marco de medidas para reforzar el ecosistema europeo de nube e inteligencia artificial (Cloud and AI Development Act)"
ambito: europeo
rango: propuesta_reglamento_ue
estado: en_tramitacion
estado_detalle: >-
  Propuesta de la Comisión de 3 de junio de 2026, en primera lectura parlamentaria. El expediente
  2026/0138(COD) identifica las comisiones responsables conjuntas ITRE e IMCO y los ponentes
  nombrados el 24 de junio. La remisión a comisión se anunció el 17 de septiembre. A 14 de octubre
  figura pendiente de decisión de comisión; no está en vigor.
boletin: null
referencia: "COM(2026) 502"
url_oficial: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=COM%3A2026%3A502%3AFIN"
fecha_aprobacion: "2026-06-03"
fecha_publicacion: "2026-06-03"
materias: [soberania_digital, suelo, eficiencia]
resumen: >-
  Quiere triplicar la capacidad de centros de datos de la Unión en cinco a siete años.
  Obligaría a cada Estado a designar al menos una zona de aceleración de centros de datos
  con permisos facilitados, permitiría a la Comisión declarar proyectos estratégicos y
  crearía un marco de soberanía de la nube con cuatro niveles de garantía.
por_que_importa: >-
  Empuja en dirección contraria a la del borrador español: donde el real decreto de agosto
  filtra el acceso a la red, la propuesta europea acelera permisos y designa zonas. El
  borrador español cita expresamente su nivel 1 como referencia para la localización de los
  datos del sector público.
obligaciones:
  - quien: "Estados miembros"
    que: >-
      Designar al menos una zona de aceleración de centros de datos, con procedimientos
      administrativos y de permisos facilitados, y un punto único de contacto al que el
      promotor pueda pedir asistencia.
    umbral: null
    plazo: "Sin fijar: depende del texto que se apruebe"
    fuentes: [src-ep-train]
  - quien: "Proveedores de servicios de computación en nube"
    que: >-
      Someterse a autoevaluación de conformidad para el nivel 1 del esquema de garantía y a
      auditoría independiente de tercero para los niveles 2, 3 y 4.
    umbral: null
    plazo: "Sin fijar"
    fuentes: [src-ep-train]
hitos:
  - fecha: 2026-06-03
    hito: La Comisión adopta la propuesta, dentro del Tech Sovereignty Package
    fuentes:
      - src-comision
      - src-eurlex-proc
  - fecha: 2026-08-01
    hito: Circula en prensa sectorial que el reglamento entraría en vigor el 4 de agosto de 2026; el
      tren legislativo del Parlamento lo desmiente
    fuentes:
      - src-yeandel
  - fecha: 2026-06-24
    hito: Nombramiento de Diego Solier y Reinier van Lanschot como ponentes de ITRE e IMCO
    fuentes:
      - src-oeil
  - fecha: 2026-09-17
    hito: Anuncio en el Parlamento de la remisión a comisión para primera lectura
    fuentes:
      - src-oeil
actores:
  - nombre: Comisión Europea
    rol: promotor
    postura: favorable
    voz: Henna Virkkunen, vicepresidenta ejecutiva
    resumen: Autora de la propuesta, presentada junto al Chips Act 2.0 y la estrategia de código abierto.
    cita: The CADA will reinforce energy-efficient data centre capacity, while complementing the Apply
      AI strategy to boost the adoption of artificial intelligence and cloud across Europe.
    fuentes:
      - src-comision
  - nombre: Parlamento Europeo
    rol: competente
    postura: sin_constar
    resumen: Las comisiones ITRE e IMCO tramitan conjuntamente el expediente en primera lectura, con
      ponentes nombrados el 24 de junio.
    cita: Awaiting committee decision
    fuentes:
      - src-oeil
afecta:
  - tipo: registro
    ref: null
    como: >-
      Si prospera, obligaría a España a designar zonas de aceleración: emplazamientos con
      tramitación privilegiada que este registro tendría que distinguir del resto.
    fuentes: [src-ep-train]
relacionadas: [prd-centros-datos-sostenibles]
incertidumbres:
  - campo: estado
    descripcion: Se conserva la advertencia sectorial de agosto contra una supuesta entrada en vigor el
      4 de agosto. La fase entonces descrita como anunciada ha avanzado a tramitación en comisión.
      No se ha localizado adopción final; el estado actual se contrasta con el Observatorio
      Legislativo del Parlamento.
    fuentes:
      - src-ep-train
      - src-yeandel
      - src-oeil
ultima_verificacion: "2026-10-14"
