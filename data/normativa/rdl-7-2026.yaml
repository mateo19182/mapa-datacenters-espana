id: rdl-7-2026
titulo: "Real Decreto-ley 7/2026, del Plan Integral de Respuesta a la Crisis en Oriente Medio"
titulo_oficial: "Real Decreto-ley 7/2026, de 20 de marzo, por el que se aprueba el Plan Integral de Respuesta a la Crisis en Oriente Medio"
ambito: estatal
rango: real_decreto_ley
estado: en_vigor
estado_detalle: >-
  Vigente desde el 22 de marzo de 2026 y convalidado el 26 de marzo. Se acordó tramitarlo como
  proyecto de ley por urgencia, expediente 121/000091. La disolución de las Cortes rige desde el 6
  de octubre y el artículo 207 del Reglamento del Congreso dispone la caducidad de los asuntos
  pendientes, salvo competencias de la Diputación Permanente. De ambas normas se deduce la
  caducidad del proyecto de ley derivado; el decreto-ley convalidado sigue vigente.
boletin: BOE
referencia: "BOE-A-2026-6544"
url_oficial: "https://www.boe.es/buscar/act.php?id=BOE-A-2026-6544"
fecha_aprobacion: "2026-03-20"
fecha_publicacion: "2026-03-21"
fecha_entrada_vigor: "2026-03-22"
materias: [acceso_a_red, energia, renovables, transparencia]
resumen: >-
  Un decreto de crisis energética que acabó siendo la reforma de fondo del acceso a la
  red. Deroga el régimen de avales de demanda, crea una prestación mensual por reservar
  capacidad, endurece los hitos de caducidad de los permisos y ordena al Gobierno
  aprobar por real decreto los requisitos de sostenibilidad de los centros de datos.
por_que_importa: >-
  Distingue el permiso reservado del consumo efectivo: establece una prestación mensual, con
  exenciones y recuperación parcial mediante peajes al comenzar la actividad. También habilita el
  decreto específico de centros de datos, que sigue pendiente.
obligaciones:
  - quien: "Titular de un permiso de acceso de demanda en un punto de tensión igual o superior a 1 kV"
    que: >-
      Abonar mensualmente la prestación por reserva hasta la firma del contrato ATR, calculada con
      el término de potencia del peaje P1, el factor k y la capacidad otorgada. La disposición
      transitoria primera establece una exención inicial de tres meses y factores con incremento
      semestral mientras no los sustituya una resolución. El artículo 11.8 exceptúa determinados
      desarrollos urbanísticos con cesión de infraestructura.
    umbral: "≥ 1 kV"
    plazo: "Mensual, tras la exención transitoria aplicable y hasta la firma del contrato ATR"
    fuentes:
      - src-boe-rdl7
      - src-hsf
  - quien: "Gobierno (Consejo de Ministros)"
    que: >-
      Aprobar por real decreto los requisitos de sostenibilidad energética,
      medioambiental, de resiliencia y soberanía digital aplicables a los centros de
      datos que se conecten a las redes de transporte y distribución, pudiendo incluir
      adicionalidad, correlación horaria, eficiencia energética y sostenibilidad
      en el uso del agua.
    umbral: null
    plazo: "Sin plazo fijado en la norma"
    fuentes: [src-prd-cpd]
  - quien: "Operador del sistema y gestores de red"
    que: >-
      Reforzar la transparencia sobre los permisos concedidos, para que las
      administraciones y la ciudadanía conozcan el estado real de la capacidad
      disponible por nudo.
    umbral: null
    plazo: null
    fuentes: [src-boe-rdl7]
  - quien: Titulares de permisos de demanda anteriores al 22 de marzo de 2026 sin contrato de acceso
      formalizado
    que: Aportar el pago del 10 % de la inversión en las actuaciones de red. La disposición transitoria
      cuarta prevé caducidad automática si no se cumple el hito. El plazo se cuenta desde la fecha
      más tardía entre el 7 de noviembre de 2025 y la concesión del permiso.
    umbral: Permisos y actuaciones de red comprendidos en la disposición transitoria cuarta.a
    plazo: Doce meses desde la fecha más tardía; no es un vencimiento común para todos los permisos
    fuentes:
      - src-boe-rdl7
hitos:
  - fecha: "2026-03-20"
    hito: "Aprobado en Consejo de Ministros extraordinario"
    fuentes: [src-boe-rdl7, src-er]
  - fecha: "2026-03-22"
    hito: "Entrada en vigor, al día siguiente de su publicación en el BOE"
    fuentes: [src-congreso-nota]
  - fecha: "2026-03-26"
    hito: >-
      El Pleno del Congreso lo convalida (175 sí, 33 no, 141 abstenciones) y acuerda
      tramitarlo como proyecto de ley por urgencia (346 sí)
    fuentes: [src-congreso-nota, src-congreso-ds]
  - fecha: "2026-06-29"
    hito: "El RDL 18/2026 modifica su artículo 11.7 y su disposición transitoria cuarta"
    fuentes: [src-boe-rdl18]
  - fecha: "2026-08-27"
    hito: >-
      Sale a audiencia pública el real decreto de centros de datos que ordena su
      disposición adicional primera
    fuentes: [src-miteco-prensa]
  - fecha: 2026-10-06
    hito: Entra en vigor la disolución de las Cortes; el artículo 207 dispone la caducidad de asuntos
      pendientes, sin derogar el decreto-ley convalidado
    fuentes:
      - src-disolucion-2026
      - src-reglamento-congreso
  - fecha: 2026-09-18
    hito: Entra en vigor el RD 731/2026, que desarrolla la declaración de Proyectos Estratégicos de
      Inversión del artículo 29
    fuentes:
      - src-rd731
actores:
  - nombre: "Ministerio para la Transición Ecológica y el Reto Demográfico"
    rol: promotor
    postura: favorable
    resumen: "Departamento proponente de las medidas energéticas del título I."
    cita: >-
      Se maximiza el aprovechamiento de redes existentes, agilizando así la necesaria y
      urgente electrificación, al tiempo que se desincentiva la especulación y el
      acaparamiento de capacidad.
    fuentes: [src-boe-rdl7]
  - nombre: "Congreso de los Diputados"
    rol: competente
    postura: favorable
    resumen: >-
      Lo convalida con la abstención del PP y de Podemos y el voto en contra de Vox, y
      abre su tramitación como proyecto de ley.
    cita: >-
      Sometida a votación su tramitación como proyecto de ley por el procedimiento de
      urgencia, se aprueba por 346 votos a favor.
    fuentes: [src-congreso-ds]
  - nombre: "Vox"
    rol: destinatario
    postura: contraria
    resumen: "Único grupo que vota en contra de la convalidación."
    cita: >-
      El Pleno del Congreso ha convalidado este jueves, con el único voto en contra de
      Vox, la abstención del PP y Podemos, y el apoyo del resto del hemiciclo.
    fuentes: [src-er]
afecta:
  - tipo: registro
    ref: null
    como: >-
      Cambia el coste de mantener un permiso de acceso sin construir, que es la
      situación en la que está la mayor parte del pipeline anunciado del registro.
    fuentes: [src-boe-rdl7]
  - tipo: nudo
    ref: "TABERNAS 220"
    como: >-
      Red Eléctrica marca su capacidad y su posición como no otorgables por estar
      reservadas por la disposición transitoria tercera de este real decreto-ley.
    fuentes: [src-ree-csv]
relacionadas: [ prd-centros-datos-sostenibles, rdl-18-2026, rd-1183-2020, circular-1-2024-cnmc, rd-731-2026 ]
incertidumbres:
  - campo: estado
    descripcion: >-
      La caducidad de la tramitación legislativa derivada se determina por el artículo 207 y la
      disolución efectiva de las Cortes. No se ha obtenido una ficha individual del Congreso que
      confirme el asiento de cierre del expediente 121/000091; se conserva esa limitación
      documental. No afecta a la vigencia del decreto-ley convalidado.
    fuentes:
      - src-proyecto-ley-91
      - src-disolucion-2026
      - src-reglamento-congreso
ultima_verificacion: "2026-10-17"
