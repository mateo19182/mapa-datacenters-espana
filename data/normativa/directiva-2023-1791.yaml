id: directiva-2023-1791
titulo: "Directiva (UE) 2023/1791 de eficiencia energética, artículo 12"
titulo_oficial: "Directiva (UE) 2023/1791 del Parlamento Europeo y del Consejo, de 13 de septiembre de 2023, relativa a la eficiencia energética y por la que se modifica el Reglamento (UE) 2023/955 (versión refundida)"
ambito: europeo
rango: directiva_ue
estado: en_vigor
estado_detalle: >-
  En vigor desde el 10 de octubre de 2023. El artículo 12.1 fijó la publicación de información desde
  el 15 de mayo de 2024; no pospuso esa fecha a las futuras etiquetas. MITECO mantiene a 17 de
  octubre de 2026 la transposición en curso. No se ha localizado publicación definitiva del proyecto
  español de centros de datos ni del proyecto de calor residual.
boletin: DOUE
referencia: "Directiva (UE) 2023/1791"
url_oficial: "https://eur-lex.europa.eu/eli/dir/2023/1791/oj"
fecha_aprobacion: "2023-09-13"
fecha_publicacion: "2023-09-20"
materias: [eficiencia, agua, transparencia]
resumen: >-
  Obliga a los Estados a que los centros de datos de cierto tamaño publiquen cada año su
  rendimiento energético, su huella hídrica y su flexibilidad de demanda, y a promover que
  apliquen el código de conducta europeo sobre eficiencia energética de centros de datos.
por_que_importa: >-
  Distingue la publicación nacional por centro y la base de datos europea inicialmente agregada. El
  acto de etiquetado adoptado en septiembre de 2026 prevé etiquetas públicas por centro desde 2027,
  todavía pendiente de control institucional y entrada en vigor.
obligaciones:
  - quien: "Estados miembros"
    que: >-
      Exigir a propietarios y operadores la publicación anual de la información del anexo VII, salvo
      la protegida por secretos comerciales y confidencialidad. Se excluyen los centros destinados
      exclusivamente a defensa y protección civil.
    umbral: "≥ 500 kW de potencia de tecnología de la información"
    plazo: "Desde el 15 de mayo de 2024 y posteriormente cada año"
    fuentes:
      - src-boe-directiva
      - src-miteco-faq
  - quien: "Estados miembros"
    que: >-
      Impulsar que los centros de datos de su territorio tengan en cuenta las mejores prácticas del
      código de conducta europeo sobre eficiencia energética de centros de datos (artículo 12.4).
    umbral: ≥ 1 MW de potencia eléctrica demandada por los sistemas TI
    plazo: null
    fuentes:
      - src-boe-directiva
      - src-prd
