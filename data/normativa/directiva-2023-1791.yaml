    titulo: "Centros de datos: preguntas frecuentes"
    editor: "MITECO"
    tipo: oficial
    fecha_publicacion: null
    fecha_consulta: "2026-09-01"
    cita: >-
      El artículo 12 de la Directiva, el cual debe ser transpuesto a la legislación
      española, obliga a poner a disposición del público el 15 de mayo de cada año la
      información indicada en su anexo VII, excepto aquella sujeta al Derecho de la Unión y
      al nacional en materia de protección de los secretos comerciales.
