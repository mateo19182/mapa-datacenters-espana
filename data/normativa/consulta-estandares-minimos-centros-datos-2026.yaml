fecha_publicacion: null
fecha_entrada_vigor: null
materias: [eficiencia, agua, energia, medio_ambiente]
resumen: >-
  La Comisión consulta cómo establecer futuros estándares mínimos de rendimiento para centros
  de datos. El plazo termina el 14 de diciembre de 2026 y todavía no hay requisitos aplicables.
por_que_importa: >-
  Es una vía regulatoria distinta del etiquetado europeo y del borrador español. Puede afectar
  al rendimiento exigible en el futuro, pero sus umbrales y alcance siguen pendientes.
