id: consulta-estandares-minimos-centros-datos-2026
titulo: "Consulta europea sobre estándares mínimos para centros de datos"
titulo_oficial: "Consulta pública y solicitud de datos sobre el establecimiento de estándares mínimos de rendimiento para centros de datos en la Unión Europea"
ambito: europeo
rango: iniciativa_ue
estado: consulta_previa
estado_detalle: >-
  Consulta pública abierta del 21 de septiembre al 14 de diciembre de 2026. Recaba aportaciones
  para una propuesta legislativa prevista para el segundo trimestre de 2027. A 14 de octubre
  no es una propuesta articulada aprobada ni establece requisitos mínimos aplicables.
boletin: null
referencia: null
