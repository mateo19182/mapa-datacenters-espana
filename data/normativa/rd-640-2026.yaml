    ref: null
    como: >-
      Condiciona el ritmo al que se levanta la restricción real del sector, que en este
      registro no es el capital sino el acceso a red.
    fuentes: [src-boe-rd640]
relacionadas: [rd-1183-2020, rdl-7-2026]
incertidumbres:
