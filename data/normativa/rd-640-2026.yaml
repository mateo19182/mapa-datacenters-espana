    descripcion: >-
      El desglose de los 17.900 millones procede de la referencia del Consejo de Ministros
      de 28 de julio de 2026, no de un anexo tabulado del propio real decreto. La norma
      regula planes de inversión: no contiene el listado de actuaciones que financiarán.
    fuentes: [src-boe-rd640]
