  - id: src-heraldo
    url: "https://www.heraldo.es/noticias/aragon/2026/08/29/aragon-mantiene-tramitacion-prioritaria-centros-datos-pese-regulacion-estatal-10-promotores-esperan-su-piga-2047955.html"
    titulo: "Aragón mantiene la tramitación prioritaria de centros de datos pese a la regulación estatal: 10 promotores esperan su PIGA"
    editor: "Heraldo de Aragón"
    tipo: prensa_general
