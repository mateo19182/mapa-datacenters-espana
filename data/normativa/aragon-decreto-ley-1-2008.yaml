  - id: src-piga-aws
    url: "https://www.aragon.es/-/proyecto-de-interes-general-de-aragon-sobre-la-implantacion-de-centros-de-datos-en-la-comunidad-autonoma-de-aragon-a-propuesta-de-amazon-data-services-spain"
    titulo: "Proyecto de Interés General de Aragón para la implantación de centros de datos a propuesta de Amazon Data Services Spain"
    editor: "Gobierno de Aragón"
    tipo: oficial
