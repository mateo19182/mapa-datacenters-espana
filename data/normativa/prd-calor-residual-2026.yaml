id: prd-calor-residual-2026
titulo: "Proyecto de decreto de calefacción, refrigeración y calor residual"
titulo_oficial: "Proyecto de Real Decreto por el que se regulan los sistemas urbanos de calefacción y refrigeración, la evaluación y planificación de la calefacción y refrigeración y el aprovechamiento de calor residual"
ambito: estatal
rango: proyecto_real_decreto
estado: en_tramitacion
estado_detalle: >-
  La segunda audiencia se celebró del 27 de mayo al 17 de junio de 2026 y figura cerrada.
  Es un proyecto distinto del decreto de sostenibilidad de centros de datos. A 14 de octubre
  no se ha localizado un texto definitivo aprobado en el BOE. Los requisitos registrados
  corresponden al borrador publicado y no se presentan como obligaciones ya aplicables.
boletin: null
referencia: null
url_oficial: "https://www.miteco.gob.es/es/energia/participacion/2026/detalle-participacion-publica-k-831.html"
fecha_aprobacion: null
fecha_publicacion: null
fecha_entrada_vigor: null
materias: [eficiencia, energia, medio_ambiente, transparencia]
resumen: >-
  El borrador prevé evaluar y aprovechar el calor residual de determinados centros de datos,
  con excepciones por inviabilidad técnica o económica. La audiencia terminó en junio; sigue pendiente.
por_que_importa: >-
  Añade una cuestión que la potencia IT no resuelve: la recuperación de calor y la demanda
  térmica cercana. No permite atribuir una red de calor ni ahorro energético a un proyecto sin fuente.
obligaciones:
  - quien: "Titular o promotor del centro de datos"
    que: >-
      Realizar un análisis de costes y beneficios cuando se proyecte por primera vez o se renueve
      sustancialmente, considerando viabilidad, demanda local y conexión a redes térmicas u otras aplicaciones.
    umbral: "> 1 MW de potencia energética nominal total; no equivale al umbral IT ni al de acceso"
    plazo: "En el proyecto o renovación sustancial, si el texto llega a ser aplicable"
    fuentes: [src-borrador]
  - quien: "Titular o promotor del centro de datos"
    que: >-
      Garantizar el uso del calor residual u otras aplicaciones de recuperación, salvo inviabilidad
      técnica o económica acreditada mediante el análisis de costes y beneficios.
    umbral: "> 1 MW de potencia energética nominal total"
    plazo: "Según el texto que finalmente se apruebe"
    fuentes: [src-borrador]
hitos:
  - fecha: "2025-08-19"
