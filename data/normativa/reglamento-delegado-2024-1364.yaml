id: reglamento-delegado-2024-1364
titulo: "Reglamento Delegado (UE) 2024/1364, del régimen común de evaluación de centros de datos"
titulo_oficial: "Reglamento Delegado (UE) 2024/1364 de la Comisión, de 14 de marzo de 2024, relativo a la primera fase del establecimiento de un régimen de evaluación común de la Unión para centros de datos"
ambito: europeo
rango: reglamento_delegado_ue
estado: en_vigor
estado_detalle: >-
  En vigor y de aplicación directa desde el 6 de junio de 2024. Es la primera fase de información.
  La Comisión adoptó el 21 de septiembre de 2026 un acto delegado de etiquetado, C(2026) 3472 final,
  que lo modificaría. El Parlamento amplió el control el 6 de octubre; el nuevo acto no está todavía
  en vigor.
boletin: DOUE
referencia: "DOUE-L-2024-80715"
url_oficial: "https://eur-lex.europa.eu/eli/reg_del/2024/1364/oj"
fecha_aprobacion: "2024-03-14"
fecha_publicacion: "2024-05-17"
fecha_entrada_vigor: "2024-06-06"
materias: [eficiencia, agua, transparencia]
resumen: >-
  Fija qué información e indicadores debe comunicar cada centro de datos de 500 kW de
  potencia de TI o más a la base de datos europea, y con qué metodología de medición. De
  su artículo 2 sale la definición de potencia de tecnología de la información que este
  registro usa.
por_que_importa: >-
  Es la fuente de las definiciones. PUE y WUE se calculan según su anexo III. El
  borrador del real decreto español remite a este marco para sus indicadores; sigue pendiente
  de aprobación. También clasifica los
  centros por tamaño, lo que permite comparar el registro con las estadísticas europeas
  sin inventar equivalencias.
obligaciones:
  - quien: "Operadores de centros de datos notificantes"
    que: >-
      Comunicar a la base de datos europea ReportENER la información y los indicadores
      clave de rendimiento de los anexos I y II, referidos al año natural anterior. En
      España la comunicación se hace a través del sistema nacional cuando exista.
    umbral: "≥ 500 kW de potencia de tecnología de la información instalada"
    plazo: "15 de septiembre de 2024 y, después, cada 15 de mayo"
    fuentes: [src-eurlex, src-miteco-faq]
hitos:
  - fecha: 2024-05-17
    hito: Publicación en el Diario Oficial de la Unión Europea
    fuentes:
      - src-boe-doue
  - fecha: 2024-06-06
    hito: Entrada en vigor, a los veinte días de su publicación
    fuentes:
      - src-boe-doue
  - fecha: 2024-09-15
    hito: Primer plazo de comunicación, sobre el que la Comisión dio flexibilidad
    fuentes:
      - src-miteco-faq
  - fecha: 2026-09-21
    hito: La Comisión adopta C(2026) 3472 final sobre etiquetas y modificación de este reglamento; no
      entra en vigor por su sola adopción
    fuentes:
      - src-etiquetado
  - fecha: 2027-08-15
    previsto: true
    hito: Primera emisión de etiquetas prevista en C(2026) 3472, sujeta a su entrada en vigor
    fuentes:
      - src-etiquetado
actores:
  - nombre: Comisión Europea
    rol: promotor
    postura: sin_constar
    resumen: Dictó la primera fase y adoptó el acto de etiquetado de septiembre de 2026, todavía bajo
      control institucional.
    fuentes:
      - src-eurlex
      - src-procedimiento-etiquetado
  - nombre: Ministerio para la Transición Ecológica y el Reto Demográfico
    rol: competente
    postura: sin_constar
    resumen: Recibiría la comunicación española a través de la Dirección General de Planificación y
      Coordinación Energética.
    fuentes:
      - src-miteco-faq
afecta:
  - tipo: registro
    ref: null
    como: >-
      Aporta la definición de potencia de tecnología de la información y las metodologías
      de PUE y WUE con las que se leen los datos de las fichas.
    fuentes: [src-eurlex]
relacionadas:
  - directiva-2023-1791
  - prd-centros-datos-sostenibles
  - reglamento-etiquetado-centros-datos-2026
incertidumbres:
  - campo: obligaciones
    descripcion: La publicación del régimen de 2024 es agregada. El acto adoptado en septiembre prevé
      etiquetas públicas por centro y cambios de indicadores, incluida agua dulce, pero sus
      modificaciones no deben aplicarse retroactivamente como si ya estuvieran en vigor.
    fuentes:
      - src-eurlex
      - src-etiquetado
  - campo: fecha_entrada_vigor
    descripcion: La nota de prensa española de agosto asociaba el etiquetado a 2024/1364 y a agosto de
      2027. Ese reglamento ya rige desde 2024; la fecha posterior corresponde a la segunda fase. El
      acto adoptado ahora precisa el 15 de agosto de 2027 para las primeras etiquetas, condicionado
      a su entrada en vigor.
    fuentes:
      - src-miteco-prensa
      - src-boe-doue
      - src-etiquetado
