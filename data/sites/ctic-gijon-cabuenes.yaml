estado_detalle: >-
  El DataHub de CTIC documenta uso GPU para proyectos de I+D en el edificio de Cabueñes, Gijón.
  Hay suministros adjudicados con A100 y Blackwell, pero no se ha confirmado la recepción ni el
  modelo instalado de esas compras. El servicio existente y las adjudicaciones se registran por separado.
estado_fuentes: [src-datahub, src-pcap-datahub, src-ppt-arqade]
potencia: []

computo:
  - tipo: gpu
    ambito: sistema
    sistema: CTIC DataHub, servicio GPU existente
    modelo: null
    unidades: null
    tipo_unidad: acelerador
    estado: operativo
    modalidad: instalado
    fecha_dato: null
    fuentes: [src-datahub, src-pcap-datahub]
    nota: >-
      La página del servicio describe trabajos que usan GPU y modelos que siguen funcionando.
      No identifica su modelo o recuento actual; no se añade a las compras como otra flota independiente.
  - tipo: gpu
    ambito: sistema
    sistema: CTIC DataHub, suministro adjudicado CT008/2021
    modelo: NVIDIA A100 de 40 GB, configuración DGX A100 320 GB del suministro
    unidades: 8
    tipo_unidad: acelerador
    nodos: 1
    estado: desconocido
    modalidad: adquirido
    fecha_dato: null
    fuentes: [src-adjudicacion-datahub, src-ppt-datahub, src-pcap-datahub]
    nota: >-
      El expediente publicado el 2 de noviembre de 2021 figura adjudicado a Seidor Tech por
      300.000 euros más IVA. El PPT pide un DGX con ocho A100 y entrega en CTIC Cabueñes.
      No consta acta de recepción ni inventario operativo que confirme ese modelo instalado.
  - tipo: gpu
    ambito: sistema
    sistema: ARQADE y QUTE, suministro adjudicado CT004/2026
    modelo: NVIDIA RTX PRO 6000 Blackwell Server Edition de 96 GB, referencia que admite equivalentes
    unidades: 8
    tipo_unidad: acelerador
    nodos: 1
    estado: desconocido
    modalidad: adquirido
    fecha_dato: null
    fuentes: [src-adjudicacion-arqade, src-ppt-arqade]
    nota: >-
      El expediente publicado el 10 de marzo de 2026 figura adjudicado a Convergencia de
      Telecomunicaciones por 154.900 euros más IVA. El PPT usa un Supermicro AS-5126GS-TNRT2
      como referencia y admite equivalentes. Recepción y modelo efectivamente instalado sin confirmar.

enlaces_proyecto:
  - https://www.fundacionctic.org/es/infraestructuras-singulares/datahub

incertidumbres:
  - campo: computo
    descripcion: >-
      El DataHub acredita uso GPU, sin inventario por modelo. Los contratos documentan compras
      con destino físico identificado, pero no se localizaron actas de recepción. El servicio
      genérico, el DGX A100 de CT008/2021 y el servidor de CT004/2026 no se suman como tres flotas
      distintas. El contrato AI4ES CT007/2021 tiene otro alcance y no se incorpora sin inventario.
    fuentes: [src-datahub, src-adjudicacion-datahub, src-ppt-datahub, src-adjudicacion-arqade, src-ppt-arqade]
  - campo: computo.modelo
    descripcion: >-
      El modelo Blackwell y sus ocho GPU son la referencia del PPT, que admite equivalentes.
      No constituyen prueba del modelo final entregado. RTX PRO 6000 Blackwell no se sustituye
      por B200 y la simulación cuántica de QUTE no convierte el servidor GPU en una QPU.
    fuentes: [src-ppt-arqade]
  - campo: computo.fecha_dato
    descripcion: >-
      Las fechas 2 de noviembre de 2021 y 10 de marzo de 2026 corresponden a publicación de los
      procedimientos, no a adjudicación, entrega ni servicio del hardware. La carpeta 2026-02 de
      los PDF de DataHub no fecha la compra original. Las fechas del inventario quedan vacías.
    fuentes: [src-adjudicacion-datahub, src-ppt-datahub, src-adjudicacion-arqade, src-ppt-arqade]
  - campo: ubicacion
    descripcion: >-
      Los pliegos señalan el edificio CTIC de Ada Byron 39 en Cabueñes como destino del hardware.
      No se han verificado coordenadas del recinto y no se usa el centro de Gijón como ubicación.
    fuentes: [src-pcap-datahub, src-ppt-arqade]
  - campo: potencia
    descripcion: >-
      Las fuentes no publican MW IT ni acceso eléctrico concedido del centro. La refrigeración
      prevista en el suministro ARQADE no acredita por sí sola su instalación o consumo de agua actual.
    fuentes: [src-datahub, src-ppt-arqade]

