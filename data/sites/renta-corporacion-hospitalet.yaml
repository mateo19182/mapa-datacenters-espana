  ccaa: "Cataluña"
  direccion: "Carrer 42, L'Hospitalet de Llobregat"
  precision: aproximada
  fuentes: [src-1]

estado: anunciado
estado_detalle: >-
  Promoción inmobiliaria de Renta Corporación sobre suelo antes ocupado por las
  plantas químicas de BASF y STAHL: un centro de datos de 10.000 m² y tres naves
  industriales de 8.500 m² sobre rasante y 2.500 m² bajo rasante. La compra de la
  parcela y el proyecto se anunciaron en julio de 2021 y la promotora los situó
  en la Carretera del Mig de L'Hospitalet. Baxtel indica año previsto 2027.
estado_fuentes: [src-1, src-2, src-3]

potencia: []

superficie_construida_m2: 10000
superficie_parcela_m2: 16500
inversion_anunciada_eur: 14000000

incertidumbres:
  - campo: operador
    descripcion: >-
      No consta operador de centro de datos: Renta Corporación es promotora
      inmobiliaria. No se sabe si el centro se explotará o se venderá/alquilará.
    fuentes: [src-1]
  - campo: potencia
    descripcion: "No se ha publicado ninguna cifra de potencia."
    fuentes: [src-1]
  - campo: estado
    descripcion: >-
      Sin licencia ni expediente verificado. El anuncio es de julio de 2021 y no
      se ha localizado información pública posterior sobre el desarrollo, pese a
      que Baxtel sigue dando 2027 como año previsto. No puede descartarse que el
      proyecto de centro de datos se haya abandonado en favor del uso logístico.
    fuentes: [src-1, src-2, src-3]
  - campo: ubicacion
    descripcion: >-
      Baxtel sitúa la promoción en «Carrer 42»; La Vanguardia y EjePrime la
      sitúan en la Carretera del Mig, sobre la antigua planta de BASF y Stahl.
      Ambas direcciones están en L'Hospitalet de Llobregat y podrían ser frentes
      distintos de la misma parcela. No se cambia la dirección registrada.
    fuentes: [src-1, src-3]

confianza: baja
ultima_verificacion: "2026-08-31"

