    editor: "Data Center Dynamics"
    tipo: prensa_especializada
    fecha_publicacion: "2021-07-30"
    fecha_consulta: "2026-08-31"
    cita: >-
      The company has acquired a 16,500 sqm (177,600 sq ft) parcel of land in
      Hospitalet de Llobregat on which it plans to build a data center and three
      industrial warehouses. Renta will invest €14 million ($16.6m) developing
      the site, previously BASF and STAHL chemical plants ... The company will
      develop a 10,000 sq m (108,000 sq ft) data center on the land, while the
      three industrial warehouses will have a total combined area of 8,500 sq m
      (86,000 sq ft) above ground and 2,500 sq m (27,000 sq ft) below.
