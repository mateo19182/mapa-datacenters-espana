refrigeracion: "Redundancia de refrigeración N+1; free cooling y contención pasillo frío/caliente en MD3x y MD6 (fichas técnicas Equinix)."
enlaces_proyecto:
  - "https://www.equinix.com/data-centers/europe-colocation/spain-colocation/madrid-data-centers"

incertidumbres:
  - campo: potencia
    descripcion: >-
      Equinix no publica capacidad en MW de ninguna de las instalaciones del campus. El único
      valor localizado (4,8 MW para MD6) procede de un directorio comercial y no indica si es
      carga TI o potencia total.
    fuentes: [src-1, src-6]
  - campo: ubicacion
    descripcion: >-
      MD2 (Calle Valgrande 6) y MD3x/MD5/MD6 (Calle de la Pedriza 12) están en direcciones
      distintas del polígono de Alcobendas. Equinix los agrupa comercialmente como un solo
      "campus de Alcobendas", por lo que se registran en un único fichero; si se confirmara que
      MD2 es un emplazamiento independiente habría que separarlo.
    fuentes: [src-2, src-4]
  - campo: fases
    descripcion: >-
      No se ha localizado documentación pública sobre la existencia o el destino de un MD3 o un
      MD4 en Madrid. La página de centros de datos de Equinix Madrid solo lista MD1, MD2, MD6 y MD3x.
    fuentes: [src-7]

confianza: media
ultima_verificacion: "2026-08-29"

