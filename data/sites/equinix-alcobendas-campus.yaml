id: equinix-alcobendas-campus
nombre: "Equinix — Campus de Alcobendas (MD2, MD3x, MD5, MD6)"
alias:
  - "Equinix Madrid MD2"
  - "Equinix Madrid MD3x"
  - "Equinix Madrid MD5"
  - "Equinix Madrid MD6"
  - "Equinix campus de Alcobendas"
tipo: campus
operador: "Equinix"
propietario: "Equinix"
modelo: colocation

ubicacion:
  municipio: "Alcobendas"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Calle de la Pedriza 12 (MD3x, MD5, MD6) y Calle Valgrande 6 (MD2), 28108 Alcobendas"
  lat: 40.533739
  lon: -3.661545
  precision: aproximada
  fuentes: [src-1, src-2, src-3, src-7]

estado: operativo
estado_detalle: >-
  MD2 y MD6 operativos; MD3x (primer xScale de Equinix en Madrid) operativo desde 2022;
  MD5 inaugurado el 22 de mayo de 2026. Equinix presenta las instalaciones de la calle de la
  Pedriza y la calle Valgrande como un único "campus de Alcobendas".
estado_fuentes: [src-1, src-2, src-3, src-4]
fecha_puesta_en_servicio: "2026-05"

potencia:
  - tipo: no_especificado
    valor_mw: 4.8
    ambito: edificio
    edificio: "MD6"
    referencia: "MD6"
    estado_asociado: operativo
    fecha_dato: "2022-09-19"
    fuentes: [src-6, src-9]
    nota: >-
      La cifra aparece en la crónica de la inauguración de MD6 («una potencia de 4,8 MW») y en
      un directorio comercial. Ninguna de las dos dice si es carga TI o potencia total, y la
      ficha oficial de Equinix no publica potencia, así que se registra como no_especificado.
  - tipo: instalada_total
    valor_mw: 9.6
    ambito: edificio
    edificio: "MD5"
    referencia: "MD5 en configuración definitiva"
    estado_asociado: operativo
    fecha_dato: "2026-05-15"
    fuentes: [src-10]
    nota: >-
      El director general de Equinix España habla de «una potencia instalada de 9,6 megavatios
      en su configuración definitiva». Se registra como potencia instalada, no como carga TI. La
      misma fuente añade «cuatro megavatios disponibles en esta primera fase de arranque», cifra
      que no se registra aparte porque es parte de esos 9,6 MW y la fuente la escribe con letra.
  - tipo: no_especificado
    valor_mw: 30
    ambito: campus
    referencia: "Capacidad prevista del campus una vez desplegado por completo"
    estado_asociado: anunciado
    fecha_dato: "2022-09-19"
    fuentes: [src-9]
    nota: >-
      La fuente dice que «se espera que supere los 30 MW cuando esté todo completamente
      desplegado», de modo que 30 MW es un suelo y no una cifra cerrada. No indica el tipo de MW.

fases:
  - nombre: "MD2 — Calle Valgrande 6"
    estado: operativo
    superficie_m2: 5599
    fuentes: [src-2]
  - nombre: "MD3x — Calle de la Pedriza 12 (xScale)"
    estado: operativo
    fecha_puesta_en_servicio: "2022"
    fuentes: [src-3, src-8]
  - nombre: "MD5 — campus de Alcobendas"
    estado: operativo
    fecha_puesta_en_servicio: "2026-05"
    superficie_m2: 4400
    fuentes: [src-4]
    # "más de 4.400 m² de espacio de colocation"
  - nombre: "MD6 — Calle de la Pedriza 12"
    estado: operativo
    fecha_puesta_en_servicio: "2022-09"
    superficie_m2: 1500
    fuentes: [src-1, src-9]
    # "cerca de 1.500 metros cuadrados de sala técnica"

superficie_construida_m2: null
inversion_anunciada_eur: 460000000
refrigeracion: >-
  Redundancia de refrigeración N+1; free cooling y contención pasillo frío/caliente en MD3x y
  MD6 (fichas técnicas Equinix). En la inauguración de MD6 Equinix declaró un PUE de 1,17 y un
  diseño de encapsulado de aire caliente sin suelo técnico. Para MD5, concebido para densidades
  altas, la compañía describe refrigeración líquida directa con circuitos cerrados.

agua:
  circuito: cerrado
  sistema: >-
    Circuito cerrado de agua: según el director general de Equinix España en la inauguración de
    MD6, los depósitos se llenan una vez y no se vuelve a consumir agua salvo de forma
    excepcional. Para MD5 la compañía describe refrigeración líquida directa en circuito cerrado.
  origen: null
  nota: >-
    En la inauguración de MD5, Equinix declaró «un modelo de refrigeración que permite operar sin
    consumo de agua». No se registra el circuito como sin_agua porque la afirmación se refiere a
    MD5 y el campus incluye instalaciones anteriores; para MD6 el operador describe un circuito
    cerrado que se rellena de forma excepcional. No hay cifra publicada de consumo de agua ni WUE
    para ninguna instalación del campus, ni dato alguno que cubra MD2 y MD3x.
  fuentes: [src-9, src-10, src-11]
enlaces_proyecto:
  - "https://www.equinix.com/data-centers/europe-colocation/spain-colocation/madrid-data-centers"

incertidumbres:
  - campo: potencia
    descripcion: >-
      Equinix no publica en sus fichas técnicas la capacidad en MW de ninguna instalación del
      campus. Las cifras registradas proceden de declaraciones de sus directivos a la prensa
      (9,6 MW instalados en MD5, 4,8 MW en MD6, más de 30 MW para el campus completo) y de un
      directorio comercial. Ninguna de ellas se expresa como carga TI, y no hay cifra alguna
      para MD2 ni para MD3x, de modo que las cuatro instalaciones no suman una capacidad de
      campus comprobable.
    fuentes: [src-1, src-6, src-9, src-10]
  - campo: ubicacion
    descripcion: >-
      Dos fuentes de prensa sitúan mal MD1 al describir el origen del campus: la crónica de 2022
      lo ubica en Fuenlabrada y la entrevista de 2026 lo cuenta entre «sus dos centros de datos
      en Alcobendas». La ficha oficial de Equinix sitúa MD1 en la calle Isabel Colbrand de
      Madrid, y así se registra en su propio fichero.
    fuentes: [src-9, src-10]
  - campo: ubicacion
    descripcion: >-
      MD2 (Calle Valgrande 6) y MD3x/MD5/MD6 (Calle de la Pedriza 12) están en direcciones
      distintas del polígono de Alcobendas. Equinix los agrupa comercialmente como un solo
      "campus de Alcobendas", por lo que se registran en un único fichero; si se confirmara que
      MD2 es un emplazamiento independiente habría que separarlo.
    fuentes: [src-2, src-4]
  - campo: fases
    descripcion: >-
      No se ha localizado documentación pública sobre la existencia o el destino de un MD3 o un
      MD4 en Madrid. La página de centros de datos de Equinix Madrid solo lista MD1, MD2, MD6 y MD3x.
    fuentes: [src-7]

confianza: media
ultima_verificacion: "2026-08-31"

