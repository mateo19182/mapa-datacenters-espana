estado_detalle: >-
  MD2 y MD6 operativos; MD3x (primer xScale de Equinix en Madrid) operativo desde 2022;
  MD5 inaugurado el 22 de mayo de 2026. Equinix presenta las instalaciones de la calle de la
  Pedriza y la calle Valgrande como un único "campus de Alcobendas".
