    fecha_dato: "2026-07-03"
    fuentes: [src-asturcon]
    nota: >-
      El cómputo todavía no está aquí: Asturcón se instala primero en el centro de proceso de
      datos del Principado por razones de capacidad técnica, y el objetivo declarado es
      trasladarlo en una segunda fase al pozo San Jorge. Ninguna fuente publica núcleos,
      rendimiento ni aceleradores del equipo. Las fuentes describen dos armarios rack; no se
      registra una cantidad de nodos a partir de ese número.

incertidumbres:
  - campo: potencia
    descripcion: >-
      La nota del Principado de marzo de 2025 no cuantifica la potencia; el dato de 0,4 MW
      procede de prensa regional de 2024. En febrero de 2026 el consejero y el director
      de Sekuens declararon 0,7 MW ante la Junta General, también sin precisar tipo.
      Se conservan ambas previsiones fechadas, sin sumarlas.
    fuentes: [src-1, src-2, src-jgpa-20260211]
  - campo: estado
    descripcion: >-
      El estado anterior en construcción procedía de la previsión de obras para 2025,
      no de un inicio acreditado. La comparecencia de febrero de 2026 aún hablaba de
      supervisión e intención de obras. Las búsquedas posteriores no han localizado
      confirmación de inicio, terminación o apertura; esa ausencia no prueba que no existan.
    fuentes: [src-1, src-4, src-jgpa-20260211]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas corresponden al pin identificado del pozo San Jorge, no a una
      sala concreta del futuro CPD dentro del complejo minero.
    fuentes: [src-pin-pozo]

