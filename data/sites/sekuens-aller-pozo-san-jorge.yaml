estado: en_tramitacion
estado_detalle: >-
  Reconversión de los edificios del antiguo pozo minero San Jorge en un centro de
  datos que debe ser la base de la «nube asturiana». Financiado con 3 millones de
  euros del Fondo de Transición Justa. Las obras de reforma estaban previstas para
  2025 y la instalación de las primeras máquinas para 2026. Las obras se ejecutarán
  siempre en superficie y se centran en la sala de máquinas, la sala de embarque y el
  castillete; el edificio dispondrá además de oficinas para empresas de gestión del
  dato e IA. El Principado plantea replicar el modelo en otros 16 pozos inactivos y
  aprovechar el agua de las galerías subterráneas para la refrigeración. En
  septiembre de 2025 el consejero de Ciencia, Industria y Empleo declaró que quedaba
  un único trámite en la CUOTA y que la licitación de las obras podría hacerse antes
  de final de 2025. El 11 de febrero de 2026 Sekuens aún situó el proyecto en supervisión
  y anunció su intención de iniciar obras en 2026. No se ha localizado confirmación
  posterior de obras iniciadas ni de puesta en servicio.
estado_fuentes: [src-1, src-3, src-4, src-jgpa-20260211]

