inversion_anunciada_eur: 3000000
refrigeracion: >-
  Aprovechamiento del agua de las galerías mineras subterráneas, extraída mediante
  bombeo automático, para la refrigeración del centro.

agua:
  circuito: desconocido
  sistema: "Refrigeración con agua procedente de las galerías mineras subterráneas del propio pozo."
  origen: "Galerías subterráneas del antiguo pozo San Jorge, mediante bombeo automático; sin recurrir a la red de consumo"
  nota: >-
    La Nueva España, recogiendo las explicaciones del viceconsejero de Ciencia,
    indica que el complejo está conectado a un sistema de extracción de agua del
    interior de las galerías mediante bombeo automático «por lo que dispone de
    abastecimiento sin recurrir a la red de consumo». No se publica caudal, consumo
    ni WUE, ni consta si el circuito es abierto o cerrado.
  fuentes: [src-3]

