estado: en_construccion
estado_detalle: >-
  Reconversión de los edificios del antiguo pozo minero San Jorge en un centro de
  datos que debe ser la base de la «nube asturiana». Financiado con 3 millones de
  euros del Fondo de Transición Justa. Las obras de reforma estaban previstas para
  2025 y la instalación de las primeras máquinas para 2026. El Principado plantea
  replicar el modelo en otros 16 pozos inactivos y estudia refrigeración con agua
  de las galerías subterráneas.
estado_fuentes: [src-1]

