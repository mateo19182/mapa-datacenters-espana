    titulo: "Microsoft abre su primera región cloud en España para acelerar el desarrollo de la Economía de la IA"
    editor: "Microsoft"
    tipo: empresa
    fecha_consulta: "2026-08-29"
    cita: "Microsoft avanza en la construcción de centros de datos adicionales ubicados en Algete, Meco y San Sebastián de los Reyes, que se inaugurarán próximamente."
  - id: src-2
    url: "https://gestiona.comunidad.madrid/rlma_web/html/web/Descarga.icm?idDocumento=2&idLegislacion=6874"
    titulo: "N/Ref.: SEA Nº 12/23 INFORME DE IMPACTO AMBIENTAL DEL PROYECTO CENTRO DE DATOS EN C/HÉRCULES 9 Y C/ZEUS 14, EN EL POLÍGONO INDUSTRIAL “MECO R2” EN EL TÉRMINO MUNICIPAL DE MECO, PROMOVIDO POR MICROSOFT 7724 SPAIN S.L."
    editor: "Comunidad de Madrid — Consejería de Medio Ambiente, Vivienda y Agricultura"
    tipo: oficial
    fecha_publicacion: "2023-06-13"
    fecha_consulta: "2026-08-31"
    cita: "el proyecto de centro de datos situado en Calle Hércules 9 y referencia catastral 3473101VK7837S0001TE y Calle Zeus 14, y referencia catastral 3473102VK7837S0001FE, localizado en el Polígono Industrial “Meco R2” ... En la zona oeste de la parcela se construirá un Centro de Datos (también denominado MAD03), con un área de 27.445 m 2, repartidos en dos plantas (baja y primera) ... En cuanto a la superficie ocupada en los 85.938 m 2 de la parcela ... una nave (edificio Ballard o Baluarte) para alojar los equipos informáticos y redes, con 5 salas de servidores (Colos) que a su vez se dividen en 4 celdas, repartidos en dos plantas, con una capacidad informática de 48 MW (9,6 MW por Colo) ... Existirán 21 generadores de emergencia, de los cuales, 20 contarán con 3 MW de potencia eléctrica y estarán asociados a las salas de datos, mientras que uno (1) tendrá 1,12 MW de potencia eléctrica para la zona administrativa ... unos grupos electrógenos con una potencia total térmica de 154 MW para situaciones de corte de energía eléctrica ... una (1) subestación eléctrica situada en la esquina noreste del emplazamiento, que conectará, con la subestación SE MECO existente, propiedad de Iberdrola, ubicada a unos 565 m al noreste del emplazamiento. Durante el funcionamiento normal, la instalación se proveerá de electricidad a través de la conexión a una fuente de alimentación de media tensión a 20kV ... tendrá un consumo eléctrico máximo estimado anual de aproximadamente 515.789 MWh. Además, se incorporarán sistemas fotovoltaicos de 278 kW de potencia instalada, que abastecerán a parte de la demanda de la zona de oficinas. Se encuentra previsto un consumo anual de agua de 24.372,10 m 3, destinado en su mayor parte al uso en la refrigeración de los equipos. Se estima un volumen de vertido anual de purgas del sistema de refrigeración de 6.900 m 3 anuales y 2.810 m 3 anuales de aguas sanitarias."
