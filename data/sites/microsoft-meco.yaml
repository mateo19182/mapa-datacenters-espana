incertidumbres:
  - campo: potencia
    descripcion: >-
      Los 48 MW de carga TI son los del diseño presentado en el expediente ambiental de 2023.
      Microsoft no publica la capacidad de sus emplazamientos en la Comunidad de Madrid, y no
      consta si el proyecto ejecutado mantiene esa cifra ni cuánta capacidad está en servicio.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      No se ha localizado confirmación pública de la puesta en servicio. La nota de apertura de
      la región cloud sitúa el emplazamiento en construcción y el expediente ambiental es de
      2023; no hay publicación posterior sobre su ejecución.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      Las direcciones y referencias catastrales constan en el expediente ambiental, pero no se
      han publicado coordenadas, así que la geolocalización queda a nivel de municipio.
    fuentes: [src-2]

