estado: en_construccion
estado_detalle: >-
  El expediente ambiental (10-EIA-00012.2/2023, referencia interna SEA 12/23) describe un centro
  de datos denominado MAD03 sobre dos parcelas del Polígono Industrial «Meco R2» (referencias
  catastrales 3473101VK7837S0001TE y 3473102VK7837S0001FE). El edificio principal, de 27.445 m²
  en planta baja y primera, contiene la nave de servidores —Ballard o Baluarte— con cinco salas
  de servidores o colos divididas a su vez en cuatro celdas, más el área administrativa y la de
  logística. La parcela alberga además una subestación eléctrica propia en la esquina noreste,
  tramitada como proyecto independiente. El Informe de Impacto Ambiental se hizo público por
  Resolución de 13 de junio de 2023, publicada en el BOCM el 11 de julio de 2023.
estado_fuentes: [src-1, src-2, src-3]

potencia:
  - tipo: it
    valor_mw: 48
    ambito: edificio
    edificio: "Ballard (MAD03)"
    referencia: "Capacidad informática de las cinco salas de servidores del edificio"
    estado_asociado: en_construccion
    fecha_dato: "2023-06-13"
    fuentes: [src-2]
    nota: >-
      El expediente dice «una capacidad informática de 48 MW (9,6 MW por Colo)», que es carga TI.
      Los 9,6 MW por colo son la subdivisión de esa misma cifra y no se suman aparte.
  - tipo: termica_respaldo
    valor_mw: 154
    ambito: edificio
    edificio: "Ballard (MAD03)"
    referencia: "Potencia térmica total de los grupos electrógenos de emergencia"
    estado_asociado: en_construccion
    fecha_dato: "2023-06-13"
    fuentes: [src-2]
    nota: >-
      Son 21 generadores de emergencia: 20 de 3 MW eléctricos para las salas de datos y uno de
      1,12 MW para la zona administrativa. No es capacidad del centro de datos y no entra en
      ningún agregado.
  - tipo: generacion_asociada
    valor_mw: 0.278
    ambito: edificio
    referencia: "Fotovoltaica de autoconsumo sobre suelo en la propia parcela"
    estado_asociado: en_construccion
    fecha_dato: "2023-06-13"
    fuentes: [src-2]
    nota: >-
      «Sistemas fotovoltaicos de 278 kW de potencia instalada, que abastecerán a parte de la
      demanda de la zona de oficinas». Es capacidad de producir, no de consumir.

conexion_electrica:
  subestacion: "SE Meco (Iberdrola)"
  tension_kv: 20
  titular_red: "Iberdrola"
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    El suministro se hará a través de una subestación propia situada en la esquina noreste del
    emplazamiento, que conectará con la subestación SE Meco existente, propiedad de Iberdrola, a
    unos 565 m al noreste. En funcionamiento normal la instalación se alimenta a 20 kV. El
    expediente no publica MW solicitados ni concedidos en el punto de conexión.
  fuentes: [src-2]

superficie_parcela_m2: 85938
superficie_construida_m2: 27445
refrigeracion: >-
  Unidades de ventilación con enfriamiento evaporativo que usan agua como refrigerante, con seis
  tanques de hormigón exteriores de 690 m³ y tratamiento previo del agua en una planta propia.

agua:
  circuito: desconocido
  sistema: >-
    Enfriamiento evaporativo de las salas de datos con agua tratada en una planta de tratamiento
    propia y almacenada en seis tanques de hormigón exteriores. Genera purgas del circuito de
    refrigeración que se vierten a la red.
  origen: "Red de Canal de Isabel II"
  consumo_m3_ano: 24372.1
  wue_l_kwh: null
  nota: >-
    El expediente añade un vertido anual previsto de 6.900 m³ de purgas del sistema de
    refrigeración y 2.810 m³ de aguas sanitarias, y recoge que Canal de Isabel II no pudo
    calcular las demandas de agua potable y vertido al no constar las superficies edificables en
    la documentación aportada. El circuito se deja como desconocido porque la fuente describe un
    sistema evaporativo con purga sin clasificarlo como abierto ni cerrado.
  fuentes: [src-2]

enlaces_proyecto:
