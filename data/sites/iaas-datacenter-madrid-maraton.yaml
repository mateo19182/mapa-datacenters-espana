  - "Civicos Networking - IAAS (Madrid)"
tipo: edificio
operador: "IaaS Datacenter Madrid"
propietario: "Desconocido"
modelo: colocation

ubicacion:
  municipio: "Madrid"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Calle Maratón 12, 28037 Madrid (polígono de Julián Camarillo, distrito de San Blas-Canillejas)"
  lat: 40.439748
  lon: -3.624212
  precision: exacta
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Centro de datos carrier-neutral de capital español, en un edificio exento de la calle Maratón
  completamente reestructurado y ampliado entre 2021 y 2023 con alturas entre forjados de cinco
  metros. En abril de 2023 la compañía describía 2.000 m², tres salas de servidores y 200
  armarios. La ingeniería corrió a cargo de AEON Ingeniería y la climatización de Cliatec.
estado_fuentes: [src-1, src-2, src-3]
fecha_puesta_en_servicio: "2023"

potencia:
  - tipo: no_especificado
    valor_mw: 1.2
    ambito: edificio
    referencia: "Potencia declarada por el operador al abrir el edificio"
    estado_asociado: operativo
    fecha_dato: "2023-04-11"
    fuentes: [src-2, src-3, src-4]
    nota: >-
      «En términos de potencia, cuentan con 1,2MW». El operador no dice si es carga TI o potencia
      total del edificio. Un directorio sectorial repite la misma cifra como capacidad en
      servicio y le atribuye un potencial estimado de 10 MW a pleno desarrollo, estimación que no
      se registra.

superficie_construida_m2: 2000
refrigeracion: >-
  Free cooling directo e indirecto. El calor residual se reutiliza para climatizar las oficinas y
  la compañía prevé destinarlo a district heating al crecer la carga. El edificio tiene paneles
  fotovoltaicos que la compañía cifra en 40.000 W y una generación esperada de unos 600.000 kWh
  al año.

incertidumbres:
  - campo: operador
    descripcion: >-
      PeeringDB registra dos entradas en la misma dirección ("IaaS Datacenter Madrid" y
      "Civicos Networking - IAAS (MADRID)"), sin que quede claro quién explota el inmueble.
    fuentes: [src-1]
  - campo: potencia
    descripcion: >-
      La única cifra publicada, 1,2 MW, es de abril de 2023 y no está tipificada. No se ha
      localizado ninguna actualización posterior del operador.
    fuentes: [src-2, src-3]
  - campo: estado
    descripcion: >-
      En la verificación anterior la ficha quedó como desconocida por falta de fuentes. El
      reportaje de DatacenterDynamics de 2023 y la web del propio operador describen la
      instalación en servicio, así que el estado pasa a operativo; aun así, la información más
      reciente localizada es de 2023 y no se ha confirmado la situación actual.
    fuentes: [src-1, src-2, src-3]

confianza: baja
ultima_verificacion: "2026-08-31"

