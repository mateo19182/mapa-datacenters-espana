incertidumbres:
  - campo: superficie_construida_m2
    descripcion: Las notas de 2025 hablan de más de 5.000 m² construidos. El RNT de 2024 detalla 5.440
      m² construidos entre edificio principal y anexos, frente a 2.020 m² de ocupación y 3.856 m² de
      parcela. Se conservan las magnitudes publicadas sin recalcular sus redondeos.
    fuentes:
      - src-1
      - src-aau-rnt-202407
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      Febrero de 2025: «estará todo listo para finales del próximo año» (finales de
      2026). En abril de 2026, con las obras ya iniciadas, la misma cabecera lo
      retrasa a finales de 2027. Se conservan las dos previsiones; no hay acta de
      puesta en servicio.
    fuentes: [src-2, src-4]
  - campo: estado
    descripcion: >-
      No se ha localizado la resolución de la autorización ambiental única del
      expediente AAU01338: en el tablón electrónico del Gobierno Vasco solo consta el
      anuncio de información pública del proyecto técnico.
    fuentes: [src-5]
  - campo: agua
    descripcion: 76,65 m³/año es una previsión del diseño, con fecha interna 2024, previa a las obras.
      No consta consumo medido ni WUE; la cifra no sirve como medición de explotación.
    fuentes:
      - src-aau-rnt-202407
  - campo: ubicacion
    descripcion: Punto de emplazamiento del RNT, X=540212 e Y=4768404, convertido de ETRS89/UTM30 N a
      WGS84. El plano 302 del anexo 003, página 26, identifica el sistema y dibuja la parcela 7B
      sobre ortofoto. Precisión aproximada del emplazamiento, sin identificar una sala o equipo.
    fuentes:
      - src-aau-rnt-202407
