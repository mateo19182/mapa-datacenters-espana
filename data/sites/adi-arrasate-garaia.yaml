estado: en_construccion
estado_detalle: >-
  Segundo centro de ADI. Proyecto adjudicado a KREAN en febrero de 2025. La prensa
  vasca situó la finalización a finales de 2026 y, en abril de 2026, el arranque de
  obras con disponibilidad prevista en 2027. Las salas se equiparán por fases según
  comercialización.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: it
    valor_mw: 3
    ambito: edificio
    referencia: "Capacidad máxima del edificio en equipos IT, repartida en dos salas"
    estado_asociado: en_construccion
    fecha_dato: "2025-02-07"
    fuentes: [src-1]
    nota: "La fuente dice literalmente «hasta 3MW en equipos IT»."

fases:
  - nombre: "Sala 1"
    estado: en_construccion
    fuentes: [src-1]
  - nombre: "Sala 2"
    estado: anunciado
    fuentes: [src-1]

superficie_construida_m2: 5000

