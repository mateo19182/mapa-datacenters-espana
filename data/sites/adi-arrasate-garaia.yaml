id: adi-arrasate-garaia
nombre: "ADI Data Center Euskadi — Parque Tecnológico Garaia (Arrasate-Mondragón)"
alias:
  - "Segundo data center de ADI"
  - "CPD PTGaraia"
tipo: edificio
operador: "Atlantic Data Infrastructure (ADI Data Center Euskadi)"
modelo: colocation

ubicacion:
  municipio: "Arrasate/Mondragón"
  provincia: "Gipuzkoa"
  ccaa: "País Vasco"
  direccion: "Parque Tecnológico Garaia, Arrasate-Mondragón"
  lat: 43.0580
  lon: -2.4940
  precision: aproximada
  fuentes: [src-1]

estado: en_construccion
estado_detalle: >-
  Segundo centro de ADI. Proyecto adjudicado a KREAN en febrero de 2025. La prensa
  vasca situó primero la finalización a finales de 2026. En abril de 2026 Crónica
  Vasca confirmó que las obras habían arrancado en el solar del parque Garaia, con
  las licencias municipales aprobadas, los movimientos de tierra en marcha y la
  cimentación iniciada a mediados de marzo de 2026, y situó la finalización a
  finales de 2027. Las dos salas se equiparán por fases según comercialización: la
  primera arranca con 1 MW. Data Center Euskadi, S.L. tramitó ante el Gobierno Vasco
  la autorización ambiental única del centro (expediente AAU01338).
estado_fuentes: [src-1, src-2, src-4]

potencia:
  - tipo: it
    valor_mw: 3
    ambito: edificio
    referencia: "Capacidad máxima del edificio en equipos IT, repartida en dos salas"
    estado_asociado: en_construccion
    fecha_dato: "2025-02-07"
    fuentes: [src-1, src-3]
    nota: >-
      El Parque Tecnológico Garaia dice «hasta 3MW en equipos IT» y KREAN, la
      ingeniería del proyecto, «up to 3MW of IT equipment in two rooms».
  - tipo: it
    valor_mw: 1
    ambito: fase
    referencia: "Primera sala, equipamiento inicial"
    estado_asociado: en_construccion
    fecha_dato: "2026-04-07"
    fuentes: [src-4]
    nota: >-
      Crónica Vasca dice «La primera de ellas contará con 1 MW de potencia», como
      reparto de los 3 MW que las fuentes del promotor y del proyectista tipifican
      como equipos IT. La propia fuente no repite la tipificación.

fases:
  - nombre: "Sala 1 (1 MW iniciales)"
    estado: en_construccion
    fuentes: [src-1, src-4]
  - nombre: "Sala 2"
    estado: anunciado
    fuentes: [src-1]

superficie_construida_m2: 5000

enlaces_proyecto:
  - "https://www.ptgaraia.eus/es/adi-data-center-euskadi-adjudica-a-krean-el-proyecto-del-nuevo-edificio-de-centro-de-procesamiento-de-datos-en-ptgaraia/"

incertidumbres:
  - campo: superficie_construida_m2
    descripcion: "La fuente dice «más de 5.000 m² de superficie construida»; se registra el umbral."
    fuentes: [src-1]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      Febrero de 2025: «estará todo listo para finales del próximo año» (finales de
      2026). En abril de 2026, con las obras ya iniciadas, la misma cabecera lo
      retrasa a finales de 2027. Se conservan las dos previsiones; no hay acta de
      puesta en servicio.
    fuentes: [src-2, src-4]
  - campo: estado
    descripcion: >-
      No se ha localizado la resolución de la autorización ambiental única del
      expediente AAU01338: en el tablón electrónico del Gobierno Vasco solo consta el
      anuncio de información pública del proyecto técnico.
    fuentes: [src-5]

