estado: operativo
estado_detalle: >-
  Centro de proceso de datos del consorcio público que presta servicios de
  supercomputación, red (Anella Científica) y alojamiento a las universidades y
  centros de investigación catalanes. El CSUC identifica su CPD en el Edifici
  Annexus del Campus Nord, distinto de su sede social en Gran Capità 2. En 2023
  el consorcio renovó y amplió el CPD porque las instalaciones habían llegado al
  límite de su capacidad física, y sustituyó los sistemas eléctrico y de
  climatización, dentro de un proyecto financiado con 12,73 millones de euros de
  fondos REACT-EU.
estado_fuentes: [src-1, src-2, src-3]

potencia: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      No se publica potencia eléctrica ni superficie del CPD. La nota sobre la
      renovación de 2023 confirma que se cambiaron los sistemas eléctrico y de
      climatización, pero no da ninguna magnitud; el Pla General d'Activitats
      2025 dedica una ficha al CPD sin publicar cifras de potencia. La única
      partida económica localizada, «Allotjament CPD extern 60.000 €», se refiere
      a alojamiento en un centro de terceros, no a esta instalación.
    fuentes: [src-2, src-3, src-4]
  - campo: ubicacion
    descripcion: >-
      PeeringDB registra la instalación en "Gran Capita, 2 - 4 (Edifici Nexus)";
      la web del CSUC menciona el "Centre de Processament de Dades (Edifici
      Annexus)" como instalación distinta de la sede. Ambos edificios están en el
      Campus Nord de la UPC. El pie de página del web del CSUC da como dirección
      de Barcelona «Gran Capità, 2 (Edifici LEIA UPC)», un tercer nombre de
      edificio. Los tres están en el Campus Nord y no se ha podido determinar en
      cuál se aloja físicamente el CPD.
    fuentes: [src-1, src-2, src-3]

