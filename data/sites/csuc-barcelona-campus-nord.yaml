id: csuc-barcelona-campus-nord
nombre: "CSUC — Centre de Processament de Dades del Campus Nord (Barcelona)"
alias:
  - "CSUC Campus Nord"
  - "CPD Edifici Annexus"
tipo: edificio
operador: "Consorci de Serveis Universitaris de Catalunya (CSUC)"
propietario: "Consorci de Serveis Universitaris de Catalunya (CSUC)"
modelo: corporativo

ubicacion:
  municipio: "Barcelona"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Gran Capità 2-4 (Edifici Nexus), Campus Nord UPC, 08034 Barcelona"
  lat: 41.387314
  lon: 2.111883
  precision: exacta
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Centro de proceso de datos del consorcio público que presta servicios de
  supercomputación, red (Anella Científica) y alojamiento a las universidades y
  centros de investigación catalanes. El CSUC identifica su CPD en el Edifici
  Annexus del Campus Nord, distinto de su sede social en Gran Capità 2. En 2023
  el consorcio renovó y amplió el CPD porque las instalaciones habían llegado al
  límite de su capacidad física, y sustituyó los sistemas eléctrico y de
  climatización, dentro de un proyecto financiado con 12,73 millones de euros de
  fondos REACT-EU.
estado_fuentes: [src-1, src-2, src-3]

potencia: []

computo:
  - tipo: cpu_hpc
    sistema: "Pirineus III"
    modelo: "AMD Epyc 9654 a 2,4 GHz, 2 por nodo (11.136 núcleos en total)"
    unidades: 58
    tipo_unidad: nodo
    rendimiento: 427
    rendimiento_unidad: tflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-res]
    nota: >-
      Bloque de propósito general y de memoria ampliada. El CSUC cifra el rendimiento pico del
      conjunto de Pirineus III en 2,2 PFlop/s, que no es la suma de los dos bloques registrados
      aquí; se conserva sin conciliar.
  - tipo: gpu
    sistema: "Pirineus III — bloque GPU"
    modelo: "NVIDIA H100 de 80 GB HBM, 2 por nodo"
    nodos: 29
    tipo_unidad: acelerador
    rendimiento: 1.59
    rendimiento_unidad: pflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-res]
    nota: >-
      El recuento total de aceleradores queda vacío a propósito: ni la RES ni el CSUC publican
      la cifra agregada, solo 29 nodos con dos H100 cada uno. Multiplicarlas sería deducir un
      dato que ninguna fuente da.

incertidumbres:
  - campo: potencia
    descripcion: >-
      No se publica potencia eléctrica ni superficie del CPD. La nota sobre la
      renovación de 2023 confirma que se cambiaron los sistemas eléctrico y de
      climatización, pero no da ninguna magnitud; el Pla General d'Activitats
      2025 dedica una ficha al CPD sin publicar cifras de potencia. La única
      partida económica localizada, «Allotjament CPD extern 60.000 €», se refiere
      a alojamiento en un centro de terceros, no a esta instalación.
    fuentes: [src-2, src-3, src-4]
  - campo: ubicacion
    descripcion: >-
      PeeringDB registra la instalación en "Gran Capita, 2 - 4 (Edifici Nexus)";
      la web del CSUC menciona el "Centre de Processament de Dades (Edifici
      Annexus)" como instalación distinta de la sede. Ambos edificios están en el
      Campus Nord de la UPC. El pie de página del web del CSUC da como dirección
      de Barcelona «Gran Capità, 2 (Edifici LEIA UPC)», un tercer nombre de
      edificio. Los tres están en el Campus Nord y no se ha podido determinar en
      cuál se aloja físicamente el CPD.
    fuentes: [src-1, src-2, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

