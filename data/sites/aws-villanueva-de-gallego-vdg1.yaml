id: aws-villanueva-de-gallego-vdg1
nombre: "AWS Ampliación Región Aragón — Villanueva de Gállego 1 (VDG1)"
alias:
  - "VDG1"
  - "ZAZ080"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "Villanueva de Gállego"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Parque Industrial Aeronáutico de Villanueva de Gállego (Polígono de Industrias Tecnológicas de la Información, PITI)"
  lat: 41.788728
  lon: -0.842135
  precision: exacta
  fuentes: [src-1]

estado: permisos_concedidos
estado_detalle: >-
  Emplazamiento del Plan de Interés General de Aragón "Expansión de la Región AWS en
  Aragón" (aprobación inicial 4 de diciembre de 2024). INAGA formuló la declaración de
  impacto ambiental y otorgó la autorización ambiental integrada el 29 de abril de 2026.
  El Gobierno de Aragón aprobó definitivamente el 4 de mayo de 2026 el proyecto de
  edificación y urbanización interior de la parcela (Fase 1) y la subestación VDG1HV
  132/20 kV. Las obras debían iniciarse en un plazo máximo de nueve meses desde esa
  aprobación definitiva parcial.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: termica_respaldo
    valor_mw: 327
    ambito: campus
    referencia: "Potencia térmica nominal total de las instalaciones de combustión por motores diésel (MWt)"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-04-29"
    fuentes: [src-1]
    nota: >-
      Dato térmico (MWt) de los grupos electrógenos de respaldo declarado en la AAI. No es
      carga TI ni potencia de conexión a red y no debe compararse con ellas.

energia:
  - consumo_gwh_ano: 756.9
    referencia: "Recursos de energía previstos para la actividad del centro de datos «VDG1» a plena capacidad"
    fecha_dato: "2025-07-16"
    fuentes: [src-5]
    nota: >-
      La cifra figura en la declaración ambiental estratégica del PIGA, dentro del escrito de
      alegaciones de SEO/BirdLife que la resolución reproduce literalmente y que la atribuye
      a la documentación del proyecto: no la formula INAGA por su cuenta. La misma relación
      suma 10.848,2 GWh/año para los cinco emplazamientos de la ampliación.

fases:
  - nombre: "Fase 1 (totalidad del campus proyectado)"
    estado: permisos_concedidos
    superficie_m2: 34207
    fuentes: [src-1]
    nota: >-
      La Fase 1 ejecuta la totalidad de los edificios propuestos: 1 edificio de centro de
      datos de tipología A y 1 de tipología B, más caseta de seguridad, planta de
      tratamiento de agua, almacenamiento y bombeo contraincendios y caseta eléctrica FV.
      Ocupación sobre rasante 26 % (34.207,54 m²); edificabilidad 42.185,78 m².
      62 trabajadores previstos.

conexion_electrica:
  subestacion: "SE VDG1HV 132/20 kV (propia de AWS), alimentada desde la SE Villanueva de Gállego 132 kV"
  tension_kv: 132
  titular_red: "Endesa (E-Distribución) — SE Villanueva de Gállego 132 kV"
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1]
  nota: >-
    La subestación VDG1HV está formada por tres transformadores 132/20 kV de 50/65 MVA,
    un edificio de celdas GIS 132 kV y un edificio de celdas 20 kV. Se alimenta mediante
    una línea doble desde la SE Villanueva de Gállego 132 kV, propiedad de Endesa, cuya
    autorización administrativa previa y de construcción ("LSAT 132 kV SET Villanueva -
    SET parcela VdG1") se otorgó por Resolución de 27 de enero de 2026 de la Directora
    General de Energía y Minas. Presupuesto de ejecución material de la subestación:
    17.403.013,85 €. No consta potencia de acceso concedida en MW.

superficie_construida_m2: 42185
inversion_anunciada_eur: null
refrigeracion: >-
  Instalación fotovoltaica de autoconsumo sobre la parcela y tanque de tormentas bajo los
  paneles con volumen útil mínimo de 3.204 m³ exigido por la resolución ambiental.
agua:
  circuito: desconocido
  sistema: >-
    Cuatro redes hidráulicas independientes: agua potable, agua industrial de proceso,
    vertido de aguas sanitarias y vertido de aguas pluviales y de proceso. La parcela
    incorpora planta de tratamiento de agua propia y un tanque de tormentas de 3.204 m³ de
    volumen útil mínimo. En VDG1 no está prevista la recuperación ni la reutilización del
    agua pluvial recogida, por limitaciones de espacio.
  origen: >-
    Agua potable desde la red municipal de Villanueva de Gállego; agua de proceso desde tres
    nuevos pozos de agua subterránea (P1, P2 y P3) junto al pozo municipal existente, con
    una tubería nueva de 3,9 km desde la estación de bombeo. Vertido parcial al río Gállego.
  consumo_m3_ano: 56980
  nota: >-
    La estimación de 56.980 m³/año procede de la declaración ambiental estratégica del PIGA.
    El estudio de impacto ambiental de la infraestructura hidráulica exterior advierte de
    que "no se evalúan los consumos, características de vertidos, ni otros aspectos
    relacionados con la operación del centro de datos en sí". No consta WUE ni PUE
    publicados para este emplazamiento.
  fuentes: [src-3, src-4]

enlaces_proyecto:
  - "https://www.aragon.es/-/piga-aws-ampliacion"
  - "https://www.aragon.es/-/expansion-aws-aragon"

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta en ninguna fuente oficial consultada la carga TI (MW IT) ni la potencia de
      acceso a red concedida para este emplazamiento. El único valor publicado es la
      potencia térmica de los grupos electrógenos.
    fuentes: [src-1]
  - campo: agua
    descripcion: >-
      El consumo de 56.980 m³/año consta en el escrito de alegaciones de SEO/BirdLife que la
      declaración ambiental estratégica reproduce, atribuido a la documentación del
      proyecto. Ni la declaración de impacto ambiental ni la autorización ambiental
      integrada de 29 de abril de 2026 publican una cifra propia de consumo de agua para
      VDG1, y el estudio de impacto ambiental de la infraestructura hidráulica exterior
      declara expresamente que no evalúa los consumos del centro de datos.
    fuentes: [src-3, src-4]
  - campo: empleo
    descripcion: >-
      El cuadro de parámetros urbanísticos del Acuerdo de 4 de mayo de 2026 recoge los
      trabajadores previstos en la Fase 1 de VDG1, VDG2 y WQA en una tabla de tres columnas
      cuya correspondencia no se puede reconstruir de forma literal desde el texto
      publicado. No se registra por ello un valor en «empleo»; la cifra que figura en la
      nota de la fase procede de una lectura previa de esa tabla.
    fuentes: [src-1]
  - campo: ubicacion
    descripcion: >-
      La AAI sitúa VDG1 en el "Parque Industrial Aeronáutico", mientras que el análisis
      urbanístico del mismo acuerdo aplica las normas del Plan Parcial del Polígono de
      Industrias Tecnológicas de la Información (PITI). Ambas denominaciones aparecen en
      el mismo documento.
    fuentes: [src-1]

confianza: alta
ultima_verificacion: "2026-08-31"

fuentes:
  - id: src-1
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1446464010404"
    titulo: "ORDEN VFL/654/2026, de 5 de mayo, por la que se da publicidad al acuerdo de 4 de mayo de 2026 del Gobierno de Aragón, por el que se aprueba definitivamente de forma parcial el Plan de Interés General de Aragón «Ampliación Región AWS Aragón»: Proyectos de edificación y urbanización interior fase 1 y proyectos de subestaciones eléctricas"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2026-05-07"
    fecha_consulta: "2026-08-29"
    cita: "Otorgar la autorización ambiental integrada a Amazon Data Services Spain, SL [...] para el centro de almacenamiento de datos denominado VDG1 (ZAZ080) [...] coordenadas de referencia UTM ETRS89, Huso 30, X=679.304, Y=4.628.570, Z=292 [...] con una potencia térmica nominal total de 327 MWt."
  - id: src-2
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1366240321010"
    titulo: "ORDEN FOM/1517/2024, de 4 de diciembre, por la que se aprueba inicialmente el Plan de Interés General «Expansión de la Región AWS en Aragón» promovido por la mercantil Amazon Data Services Spain, SL"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2024-12-13"
    fecha_consulta: "2026-08-29"
    cita: "se aprueba inicialmente el Plan de Interés General \"Expansión de la Región AWS en Aragón\" promovido por la mercantil Amazon Data Services Spain, SL"
  - id: src-3
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1406588900808"
    titulo: "RESOLUCIÓN de 16 de julio de 2025, del Instituto Aragonés de Gestión Ambiental, por la que se formula la declaración ambiental estratégica del Plan de Interés General «Expansión Región AWS en Aragón» [...] (INAGA 500201/71H/2025/05122 y otros)"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-08-06"
    fecha_consulta: "2026-08-31"
    cita: "Respecto de las afecciones al recurso hídrico, el consumo de agua asociado a la actividad de los centros de datos se ha estimado en: VDG1: 56.980 m 3/ año; VDG2: 208.920 m 3/año; BDE: 111.880 m 3/año, WQA: 143.400 m 3/año y CAR: 204.700 m 3/año. Por lo tanto, las necesidades de agua para sistemas de refrigeración del conjunto de centros de datos ascenderían, aproximadamente, a 725.880 m 3/año"
  - id: src-4
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1419875120606"
    titulo: "RESOLUCIÓN de 6 de octubre de 2025, del Instituto Aragonés de Gestión Ambiental, por la que se formula la declaración de impacto ambiental de las infraestructuras hidráulicas exteriores que darán servicio a los nuevos centros de datos VDG1 y VDG2, en el término municipal de Villanueva de Gállego (Zaragoza) (INAGA 500201/01A/2025/05152)"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-11-11"
    fecha_consulta: "2026-08-31"
    cita: "El diseño técnico está conformado por cuatro redes hidráulicas independientes pero complementarias: suministro de agua potable, suministro de agua industrial de proceso, vertido de aguas sanitarias y vertido de aguas pluviales y de proceso. [...] Para la red de suministro de agua de proceso, se propone construir un nuevo pozo (P1) junto al pozo municipal existente (1+1) [...] Adicionalmente se propone construir dos nuevos pozos P2 y P3 (1+1) como refuerzo del abastecimiento actual [...] En VDG1 no está prevista la recuperación ni la reutilización del agua pluvial recogida por limitaciones de espacio. [...] El promotor señala que en el estudio de impacto ambiental no se evalúan los consumos, características de vertidos, ni otros aspectos relacionados con la operación del centro de datos en sí"
  - id: src-5
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1406588900808"
    titulo: "RESOLUCIÓN de 16 de julio de 2025, del Instituto Aragonés de Gestión Ambiental, por la que se formula la declaración ambiental estratégica del Plan de Interés General «Expansión Región AWS en Aragón» — recursos de energía por centro de datos"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-08-06"
    fecha_consulta: "2026-08-31"
    cita: "Los recursos de energía para la actividad a desarrollar en los centros de datos ascienden a: VDG1: 756,9 GWh/año, VDG2: 2.775 GWh/año, BDE: 1.766 GWh/año, WQA: 2.270,6 GWh/año y CAR: 3.279,7 GWh/año. Las necesidades de electricidad del conjunto de centros de datos ascenderían a 10.848,2 GWh/año."
