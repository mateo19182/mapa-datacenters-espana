  precision: exacta
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Estación de amarre de cables submarinos operada por AFR-IX telecom en régimen
  de operador independiente que alquila la infraestructura a operadores. Diseñada
  para alojar hasta ocho cables submarinos. Es la pieza a la que se conectan los
  centros de datos de Sant Adrià y la Zona Franca.
estado_fuentes: [src-2, src-3]

potencia: []

superficie_construida_m2: null
inversion_anunciada_eur: 8000000

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      The New Barcelona Post cifra la inversión en 8 millones de euros ("2
      millones más de lo previsto por el rediseño"); 22@Network Barcelona la
      cifra en 10 millones. Se registran ambas.
    fuentes: [src-2, src-3]
  - campo: potencia
    descripcion: >-
      No se ha localizado ninguna cifra de potencia eléctrica del edificio.
      Baxtel la mantiene tras muro de pago.
    fuentes: [src-4]
  - campo: superficie_construida_m2
    descripcion: >-
      Baxtel indica una sala de colocation de 400 m² en la primera planta; otras
      fuentes hablan de 380 m² de superficie de acogida. No es la superficie
      total del edificio.
    fuentes: [src-4]

