id: barcelona-cls-sant-adria
nombre: "Barcelona Cable Landing Station — Sant Adrià de Besòs"
alias:
  - "Barcelona CLS"
  - "BCLS"
tipo: edificio
operador: "AFR-IX telecom"
propietario: "AFR-IX telecom"
modelo: corporativo

ubicacion:
  municipio: "Sant Adrià de Besòs"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Carrer de Ramon Viñas 4, 08930 Sant Adrià de Besòs (entorno de las Tres Xemeneies)"
  lat: 41.427287
  lon: 2.230662
  precision: exacta
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Estación de amarre de cables submarinos operada por AFR-IX telecom en régimen
  de operador independiente que alquila la infraestructura a operadores. Diseñada
  para alojar hasta ocho cables submarinos. Es la pieza a la que se conectan los
  centros de datos de Sant Adrià y la Zona Franca. Edificio de dos plantas con
  ocho salas de sistemas submarinos de 16 racks cada una, dos Meet-Me Rooms y
  una sala de colocation en la primera planta, con topología de diseño Tier IV
  declarada.
estado_fuentes: [src-2, src-3, src-5, src-6]

potencia:
  - tipo: no_especificado
    valor_mw: 1
    ambito: edificio
    referencia: "Potencia eléctrica que el edificio está preparado para alojar"
    estado_asociado: operativo
    fecha_dato: "2022-11-29"
    fuentes: [src-6]
    nota: >-
      La compañía dice "it is prepared to house telecommunications equipment up
      to 1MWatt of electrical power". Es capacidad declarada del edificio, no
      carga TI contratada.

superficie_construida_m2: 2657
inversion_anunciada_eur: 8000000

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      The New Barcelona Post cifra la inversión en 8 millones de euros ("2
      millones más de lo previsto por el rediseño"); 22@Network Barcelona la
      cifra en 10 millones. La propia AFR-IX distingue dos magnitudes que
      explican en parte la horquilla: 7 millones de euros para la
      infraestructura y 10 millones para el proyecto global incluyendo la
      canalización desde la playa. Se conservan las tres cifras.
    fuentes: [src-2, src-3, src-6]
  - campo: potencia
    descripcion: >-
      El único valor publicado es el 1 MW que la propia AFR-IX declara como
      capacidad del edificio para alojar equipo de telecomunicaciones. No consta
      la potencia contratada ni la de acceso. Baxtel mantiene su cifra tras muro
      de pago.
    fuentes: [src-4, src-6]
  - campo: superficie_construida_m2
    descripcion: >-
      Los 2.657 m² son la dimensión total del edificio según la propia AFR-IX.
      Dentro de esa cifra conviven una sala de colocation de 400 m² en la primera
      planta y una «room for data center» de 380 m² con capacidad para 160 racks
      que la compañía menciona por separado, sin que quede claro si son el mismo
      espacio.
    fuentes: [src-4, src-5, src-6]

agua:
  circuito: sin_agua
  sistema: >-
    Free cooling directo mediante unidades CRAH con módulo de aire exterior,
    confinamiento de pasillo frío y control de humedad integrado.
  origen: null
  nota: >-
    La compañía declara «Zero water consumption» entre los atributos de
    sostenibilidad del edificio. No publica consumos residuales ni WUE.
  fuentes: [src-5]

confianza: media
