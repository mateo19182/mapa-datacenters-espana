id: arsys-logrono
nombre: "Centro de Datos de Arsys — Logroño"
alias:
  - "Data Center de Arsys en La Rioja"
  - "Centro de Datos Portalada"
  - "Arsys Logroño Data Center Portalada"
tipo: edificio
operador: "Arsys"
propietario: "Arsys Internet, S.L.U."
modelo: colocation

ubicacion:
  municipio: "Logroño"
  provincia: "La Rioja"
  ccaa: "La Rioja"
  lat: 42.4661196
  lon: -2.4396676
  precision: municipio
  fuentes: [src-aslan, src-osm]

estado: operativo
estado_detalle: >-
  Centro Portalada operativo desde 2009 y ampliado por salas de 250 m². La web de Arsys describe un
  diseño de cuatro salas y 6 MW sin tipificar. La visita de DCD del 15 de octubre de 2026 describe
  tres salas en uso y la cuarta pendiente de desarrollo. Los 6 MW no se atribuyen a capacidad
  entregada ni a carga IT. El centro cuenta con certificación Tier III y aloja la nube privada del
  Gobierno de La Rioja.
estado_fuentes:
  - src-aslan
  - src-arsys
  - src-dcm
  - src-innovacion-20261017
  - src-visita-dcd-20261015

potencia:
  - {
      tipo: no_especificado,
      valor_mw: 6,
      ambito: edificio,
      referencia: Potencia declarada para el diseño del complejo Portalada,
      estado_asociado: desconocido,
      fuentes: [ src-innovacion-20261017, src-visita-dcd-20261015 ],
      nota: Arsys no tipifica los MW ni desglosa su entrega por sala. DCD los describe como capacidad
        proyectada y sitúa la cuarta sala pendiente de desarrollo; no se computan como 6 MW
        operativos.
    }

fases:
  - nombre: "Primera sala técnica"
    estado: operativo
    fecha_puesta_en_servicio: "2009"
    fuentes: [src-arsys]
    nota: "Inaugurada en 2009 con una capacidad estimada de 5.000 servidores físicos."
  - nombre: "Segunda sala técnica (250 m²)"
    estado: operativo
    fecha_puesta_en_servicio: "2019-04"
    superficie_m2: 250
    fuentes: [src-aslan, src-arsys]
  - nombre: Tercera sala técnica
    estado: operativo
    fuentes:
      - src-visita-dcd-20261015
    nota: La visita publicada el 15 de octubre de 2026 describe la sala 3 en uso, sin fechar su puesta
      en servicio.
  - nombre: Cuarta sala técnica
    estado: anunciado
    fuentes:
      - src-innovacion-20261017
      - src-visita-dcd-20261015
    nota: Espacio reservado pendiente de desarrollo. El diseño histórico de cuatro salas contemplaba
      unos 20.000 servidores; no es un inventario operativo.
superficie_construida_m2: 6000

refrigeracion: >-
  Arsys declara climatización por agua de alto rendimiento, PUE medio anual de 1,25 y WUE inferior a
  0,16 l/kWh. DCD describe aire en circuito cerrado sin evaporación; no se resuelve la diferencia
  entre descripciones.

agua:
  circuito: desconocido
  sistema: >-
    Climatización por agua de alto rendimiento, con sistemas de refrigeración basados
    en IoT e inteligencia artificial, según la descripción publicada por la compañía.
  origen: null
  nota: >-
    La página actual de Arsys declara WUE inferior a 0,16 l/kWh, sin fecha del periodo medido. No se
    registra 0,16 como valor exacto ni se deduce un consumo anual. La visita de DCD describe aire en
    circuito cerrado sin evaporación, frente a la descripción de climatización por agua del
    operador. El circuito del agua y el consumo auxiliar siguen sin identificarse.
  fuentes:
    - src-dcm
    - src-innovacion-20261017
    - src-visita-dcd-20261015

incertidumbres:
  - campo: potencia
    descripcion: >-
      La página actual de Arsys declara 6 MW sin distinguir carga IT, potencia instalada o conexión.
      La visita de octubre los describe como capacidad proyectada, con la cuarta sala aún sin
      desarrollar. Se desconocen los MW entregados por sala y la potencia de acceso concedida.
    fuentes:
      - src-innovacion-20261017
      - src-visita-dcd-20261015
  - campo: ubicacion
    descripcion: >-
      No se ha localizado la dirección exacta. El centro se llama «Portalada», que es
      el nombre de un polígono industrial de Logroño, pero ni Arsys ni el Uptime
      Institute publican calle ni parcela; el domicilio social de la compañía (calle
      Madre de Dios 21) es su sede, no el centro de datos. Las coordenadas
      corresponden al municipio.
    fuentes: [src-osm, src-arsys]
  - campo: estado
    descripcion: >-
      Las fuentes históricas describen un diseño modular de cuatro salas y aproximadamente 20.000
      servidores. La visita publicada en octubre de 2026 identifica tres salas en uso y la cuarta
      reservada, sin fecha de activación de la tercera ni MW operativos desglosados. No se deduce
      capacidad eléctrica a partir de la ocupación ni del número de servidores.
    fuentes:
      - src-aslan
      - src-dcm
      - src-innovacion-20261017
      - src-visita-dcd-20261015

confianza: media
ultima_verificacion: "2026-10-17"

fuentes:
  - id: src-aslan
    url: "https://aslan.es/arsys-amplia-su-centro-de-datos-en-la-rioja/"
    titulo: "ARSYS amplía su Centro de Datos en La Rioja"
    editor: "Asociación @aslan"
    tipo: asociacion
    fecha_publicacion: "2019-04-12"
    fecha_consulta: "2026-08-29"
    cita: >-
      segunda sala técnica de 250 m2 que duplica la capacidad máxima actual del
      Centro de Datos [...] Con las cuatro salas técnicas operativas, la
      capacidad del Centro de Datos de Arsys se situaría en 20.000 servidores
      físicos.
  - id: src-osm
    url: "https://nominatim.openstreetmap.org/search?q=Logro%C3%B1o%2C+La+Rioja&format=json&limit=1"
    titulo: "Nominatim — Logroño, La Rioja"
    editor: "OpenStreetMap / Nominatim"
    tipo: otro
    fecha_consulta: "2026-08-29"
    cita: "Logroño, La Rioja, España — lat 42.4661196, lon -2.4396676"
  - id: src-arsys
    url: "https://www.arsys.es/blog/arsys-certificacion-tier3"
    titulo: "Arsys consigue la Certificación Tier III para su CPD de Logroño"
    editor: "Arsys Internet, S.L.U."
    tipo: empresa
    fecha_publicacion: "2020-03-09"
    fecha_consulta: "2026-08-31"
    cita: >-
      El Centro de Datos Portalada se inauguró en Logroño en 2009 con una única sala
      técnica y una capacidad estimada de 5.000 servidores físicos. Tras la
      inauguración de una segunda sala, en abril de 2019, el Centro de Datos de Arsys
      duplicó su capacidad de suelo técnico hasta los 500 m2, con capacidad para unos
      10.000 servidores físicos [...] Con todas sus salas operativas, la capacidad del
      Centro de Datos de Arsys se situaría en 20.000 servidores físicos,
      aproximadamente.
  - id: src-dcm
    url: "https://www.datacentermarket.es/news/el-cpd-principal-de-arsys-amplia-el-alcance-de-sus-tier-iii/"
    titulo: "El CPD principal de Arsys amplía el alcance de sus Tier III"
    editor: "Data Center Market"
    tipo: prensa_especializada
    fecha_publicacion: "2024-02-13"
    fecha_consulta: "2026-08-31"
    cita: >-
      Desde 2020, Arsys contaba con la certificación Tier III de Diseño para una de
      las cuatro salas de su principal centro de datos. Ahora, además de renovar su
      vigencia y ampliarla a la categoría Instalación Construida, ha extendido su
      alcance al conjunto de las instalaciones [...] El CPD se caracteriza por un
      diseño modular de cuatro salas técnicas de 250 metros cuadrados y una capacidad
      total aproximada de unos 20.000 servidores físicos [...] cuenta con suministro
      energético procedente de fuentes renovables desde 2015, climatización por agua
      de alto rendimiento y eficiencia e innovadores sistemas de refrigeración,
      basados en IoT e Inteligencia Artificial
  - id: src-innovacion-20261017
    url: https://www.arsys.es/quienes-somos/innovacion
    titulo: Innovación — Un Centro de Datos innovador en todos sus aspectos
    editor: Arsys
    tipo: empresa
    fecha_consulta: 2026-10-17
    cita: Estas instalaciones tienen 6 MW de potencia [...] un WUE (Water-Use Efficiency) por debajo de
      0,16 l/kWh
  - id: src-visita-dcd-20261015
    url: https://www.datacenterdynamics.com/es/features/viaje-al-data-center-de-arsys-en-logro%C3%B1o-evoluci%C3%B3n-t%C3%A9cnica-y-soberan%C3%ADa-desde-la-rioja/
    titulo: "Viaje al data center de Arsys en Logroño: evolución técnica y soberanía desde La Rioja"
    editor: Data Center Dynamics
    tipo: prensa_especializada
    fecha_publicacion: 2026-10-15
    fecha_consulta: 2026-10-17
    cita: el espacio reservado para la cuarta sala técnica espera su desarrollo detrás de los muros
      actuales.
