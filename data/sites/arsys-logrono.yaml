id: arsys-logrono
nombre: "Centro de Datos de Arsys — Logroño"
alias:
  - "Data Center de Arsys en La Rioja"
  - "Centro de Datos Portalada"
  - "Arsys Logroño Data Center Portalada"
tipo: edificio
operador: "Arsys"
propietario: "Arsys Internet, S.L.U."
modelo: colocation

ubicacion:
  municipio: "Logroño"
  provincia: "La Rioja"
  ccaa: "La Rioja"
  lat: 42.4661196
  lon: -2.4396676
  precision: municipio
  fuentes: [src-aslan, src-osm]

estado: operativo
estado_detalle: >-
  Centro de datos propio de Arsys en Logroño, conocido como Centro de Datos
  Portalada, en explotación y ampliado por fases mediante salas técnicas de 250 m².
  Se inauguró en 2009 con una única sala técnica y una capacidad estimada de 5.000
  servidores físicos. En abril de 2019 entró en servicio la segunda sala, duplicando
  el suelo técnico hasta 500 m² y la capacidad hasta unos 10.000 servidores. El
  diseño modular contempla cuatro salas técnicas y unos 20.000 servidores físicos a
  plena capacidad. Obtuvo en 2020 la certificación Tier III de Diseño del Uptime
  Institute para una de las cuatro salas y en 2024 la renovó, la amplió a Instalación
  Construida y extendió su alcance al conjunto de las instalaciones. Cuenta con
  suministro de fuentes renovables desde 2015 e ISO 50001. Aloja la nube privada del
  Gobierno de La Rioja.
estado_fuentes: [src-aslan, src-arsys, src-dcm]

potencia: []

fases:
  - nombre: "Primera sala técnica"
    estado: operativo
    fecha_puesta_en_servicio: "2009"
    fuentes: [src-arsys]
    nota: "Inaugurada en 2009 con una capacidad estimada de 5.000 servidores físicos."
  - nombre: "Segunda sala técnica (250 m²)"
    estado: operativo
    fecha_puesta_en_servicio: "2019-04"
    superficie_m2: 250
    fuentes: [src-aslan, src-arsys]
  - nombre: "Tercera y cuarta salas técnicas"
    estado: anunciado
    nota: >-
      Con las cuatro salas operativas la capacidad se situaría en 20.000
      servidores físicos.
    fuentes: [src-aslan]

refrigeracion: >-
  Climatización por agua de alto rendimiento con sistemas de refrigeración basados en
  IoT e inteligencia artificial. PUE objetivo declarado de 1,25.

agua:
  circuito: desconocido
  sistema: >-
    Climatización por agua de alto rendimiento, con sistemas de refrigeración basados
    en IoT e inteligencia artificial, según la descripción publicada por la compañía.
  origen: null
  nota: >-
    Arsys no publica consumo de agua, WUE ni el tipo de circuito. Se registra el
    sistema porque es de los pocos del norte que declara refrigeración por agua y no
    free cooling.
  fuentes: [src-dcm]

incertidumbres:
  - campo: potencia
    descripcion: >-
      Arsys publica superficie técnica, número de racks y servidores, pero no la
      potencia eléctrica del centro en ninguna de las fuentes consultadas, ni en su
      propio blog, ni en las fichas de certificación, ni en la cobertura
      especializada de 2024. Tampoco consta la potencia de acceso a la red.
    fuentes: [src-aslan, src-arsys, src-dcm]
  - campo: ubicacion
    descripcion: >-
      No se ha localizado la dirección exacta. El centro se llama «Portalada», que es
      el nombre de un polígono industrial de Logroño, pero ni Arsys ni el Uptime
      Institute publican calle ni parcela; el domicilio social de la compañía (calle
      Madre de Dios 21) es su sede, no el centro de datos. Las coordenadas
      corresponden al municipio.
    fuentes: [src-osm, src-arsys]
  - campo: estado
    descripcion: >-
      La descripción técnica más reciente localizada es de febrero de 2024 y sigue
      hablando de «cuatro salas técnicas de 250 metros cuadrados y una capacidad total
      aproximada de unos 20.000 servidores físicos», sin decir cuántas están en
      producción. En 2022, con motivo del contrato de la nube privada del Gobierno de
      La Rioja, la prensa especializada situaba la capacidad ampliada en 15.000
      servidores con una nueva sala técnica. No se ha verificado cuántas salas están
      hoy operativas.
    fuentes: [src-aslan, src-dcm]

confianza: media
