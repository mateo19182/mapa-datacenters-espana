id: arsys-logrono
nombre: "Centro de Datos de Arsys — Logroño"
alias:
  - "Data Center de Arsys en La Rioja"
tipo: edificio
operador: "Arsys"
propietario: "Arsys Internet, S.L.U."
modelo: colocation

ubicacion:
  municipio: "Logroño"
  provincia: "La Rioja"
  ccaa: "La Rioja"
  lat: 42.4661196
  lon: -2.4396676
  precision: municipio
  fuentes: [src-aslan, src-osm]

estado: operativo
estado_detalle: >-
  Centro de datos propio de Arsys en Logroño, en explotación y ampliado por
  fases mediante salas técnicas de 250 m². En abril de 2019 entró en servicio la
  segunda sala, duplicando la capacidad. El diseño contempla cuatro salas
  técnicas y unos 20.000 servidores físicos a plena capacidad. Aloja la nube
  privada del Gobierno de La Rioja.
estado_fuentes: [src-aslan]

potencia: []

fases:
  - nombre: "Segunda sala técnica (250 m²)"
    estado: operativo
    fecha_puesta_en_servicio: "2019-04"
    superficie_m2: 250
    fuentes: [src-aslan]
  - nombre: "Tercera y cuarta salas técnicas"
    estado: anunciado
    nota: >-
      Con las cuatro salas operativas la capacidad se situaría en 20.000
      servidores físicos.
    fuentes: [src-aslan]

refrigeracion: "PUE objetivo declarado de 1,25, con monitorización asistida por IA."

incertidumbres:
  - campo: potencia
    descripcion: >-
      Arsys publica superficie técnica, número de racks y servidores, pero no la
      potencia eléctrica del centro en ninguna de las fuentes consultadas.
    fuentes: [src-aslan]
  - campo: ubicacion
    descripcion: >-
      No se ha localizado la dirección exacta; las coordenadas corresponden al
      municipio de Logroño.
    fuentes: [src-osm]
  - campo: estado
    descripcion: >-
      La información técnica más detallada localizada es de 2019. Fuentes
      posteriores confirman que el centro sigue operativo y que se puso en
      producción una tercera sala, pero sin datos técnicos verificados.
    fuentes: [src-aslan]

confianza: media
ultima_verificacion: "2026-08-29"

