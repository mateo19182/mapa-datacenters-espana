incertidumbres:
  - campo: potencia
    descripcion: >-
      No hay ninguna cifra de potencia del centro de datos respaldada por fuente utilizable. Las
      cifras que circulan en agregadores automáticos (25 MW eléctricos, 100 MW IT, escalable a
      150 MW) proceden de una web de contenido generado que inventa además referencias
      normativas inexistentes, y no se recogen aquí.
    fuentes: [src-1]
  - campo: estado
    descripcion: >-
      No consta expediente urbanístico ni ambiental del centro de datos. Lo que está declarado
      estratégico es la planta de hidrógeno y combustibles sintéticos, no el centro de datos.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      El recinto de Sniace se reparte entre Torrelavega y Santillana del Mar. Las fuentes sitúan
      el conjunto industrial en Torrelavega, pero no precisan en qué término municipal caería el
      centro de datos. Las coordenadas son el centroide municipal de Torrelavega.
    fuentes: [src-1, src-2, src-osm]
  - campo: operador
    descripcion: >-
      RIC Energy es una promotora de energía (fotovoltaica, almacenamiento, hidrógeno y biogás),
      no un operador de centros de datos. No se ha identificado operador ni socio tecnológico.
    fuentes: [src-1, src-4]

confianza: baja
