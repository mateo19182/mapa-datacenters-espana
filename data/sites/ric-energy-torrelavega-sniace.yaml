estado: anunciado
estado_detalle: >-
  RIC Energy proyecta un centro de datos sobre parte de los cerca de 500.000 m² de los
  antiguos terrenos de Sniace, junto a su plan industrial de hidrógeno verde y combustibles
  sintéticos. El proyecto energético matriz, Besaya Green H2, fue declarado Proyecto
  Empresarial Estratégico por el Consejo de Gobierno de Cantabria el 26 de febrero de 2026 y
  se sitúa en los términos municipales de Torrelavega y Santillana del Mar. Según El Diario
  Montañés, la compañía contempla otros usos en la superficie sobrante y ya realiza gestiones
  con Viesgo y la Consejería de Industria para garantizar el punto de conexión eléctrica. El
  desarrollo depende de que concluyan los derribos y la descontaminación del recinto; la
  planta de hidrógeno no empezaría a construirse antes de 2027.
estado_fuentes: [src-1, src-2, src-3]

