id: cesga-santiago-a-sionlla
nombre: "CESGA — nuevo centro de datos de A Sionlla (Santiago de Compostela)"
alias:
  - "Nueva sede del Cesga"
  - "Centro de Supercomputación de Galicia — A Sionlla"
tipo: edificio
operador: "Centro de Supercomputación de Galicia (CESGA)"
propietario: "Xunta de Galicia / CSIC (consorcio CESGA)"
modelo: corporativo

ubicacion:
  municipio: "Santiago de Compostela"
  provincia: "A Coruña"
  ccaa: "Galicia"
  direccion: "Polígono de A Sionlla, Santiago de Compostela"
  lat: 42.9300
  lon: -8.5000
  precision: aproximada
  fuentes: [src-1]

estado: en_construccion
estado_detalle: >-
  Primer «proyecto estratégico de investigación pública» declarado por la Xunta.
  Obras iniciadas en octubre de 2025 con previsión de finalizar en verano de 2026.
  Albergará el supercomputador FinisTerrae IV, un sistema de almacenamiento y un
  ordenador cuántico de 54 cúbits de la finlandesa IQM suministrado por Telefónica.
  Fsas Technologies (Fujitsu) es el adjudicatario del equipamiento. En octubre de
  2025 se anunció que el CESGA acogerá además una fábrica europea de IA orientada
  a salud.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: it
    valor_mw: 3.2
    ambito: edificio
    referencia: "Potencia IT máxima para la que está preparado el nuevo edificio"
    estado_asociado: en_construccion
    fecha_dato: null
    fuentes: [src-3]
    nota: >-
      Dominion, autora del proyecto y constructora del edificio junto a Copasa, dice
      que «el nuevo centro está preparado para operar con potencias IT de hasta 3,2
      MW». Ni la Xunta ni el CESGA publican la cifra. La página de Dominion no lleva
      fecha, así que no consta desde cuándo es cierta: `fecha_dato` queda vacío en
      lugar de repetir la fecha de consulta, que no es lo que ese campo mide.

fases:
  - nombre: "Edificio y equipamiento (FinisTerrae IV + cuántico)"
    estado: en_construccion
    fecha_puesta_en_servicio: "2026"
    superficie_m2: 2700
    fuentes: [src-1]

superficie_parcela_m2: 9100
superficie_construida_m2: 2700
inversion_anunciada_eur: 56000000
refrigeracion: >-
  Soluciones de refrigeración líquida directa, según la empresa que redactó el
  proyecto y construye el edificio; diseño compatible con certificación Tier III.
  La nota de la Xunta habla de «sistemas de climatización de alta adecuación
  técnica» y paneles fotovoltaicos.

enlaces_proyecto:
  - "https://www.xunta.gal/es/notas-de-prensa/-/nova/015782/construccion-del-nuevo-cesga-sera-primero-proyecto-estrategico-investigacion"

computo:
  - tipo: cpu_hpc
    ambito: sistema
    sistema: "FinisTerrae III"
    modelo: "Intel Xeon Ice Lake 8352Y de 32 núcleos a 2,2 GHz (22.656 núcleos en total)"
    unidades: 354
    tipo_unidad: nodo
    rendimiento: 4
    rendimiento_unidad: pflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-computo]
    nota: >-
      Equipo Bull ATOS bullx instalado en 2021 y en producción desde 2022, repartido en 13
      armarios, con 118 TB de memoria y 5 PB de almacenamiento Lustre.
  - tipo: gpu
    sistema: "FinisTerrae III"
    modelo: "NVIDIA A100"
    unidades: 128
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-computo]
    nota: >-
      La documentación técnica del propio CESGA da otra cifra —141 A100, 157 GPU en total— para
      el mismo equipo. La discrepancia queda registrada en `incertidumbres[]` y no se resuelve.
  - tipo: gpu
    sistema: "FinisTerrae III"
    modelo: "NVIDIA T4"
    unidades: 16
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-computo]
    nota: null
  - tipo: qpu
    sistema: "Qmio"
    modelo: "QPU de cúbits superconductores tipo coaxmon, fabricada por Oxford Quantum Circuits"
    unidades: 32
    tipo_unidad: qubit
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-cuantica]
    nota: >-
      Desplegado en 2023 y abierto a investigadores en 2024. No es capacidad de centro de datos
      y no aporta ninguna cifra a `potencia[]`. Va acompañado de un sistema HPC conectado a la
      QPU y de emuladores clásicos (Qaptiva, CUNQA, Qiskit AER).
  - tipo: no_especificado
    sistema: "Superordenador de la fábrica de IA 1HealthAI"
    estado: anunciado
    fecha_dato: "2025-10-10"
    fuentes: [src-aif]
    nota: >-
      La Comisión Europea seleccionó al CESGA en octubre de 2025 para albergar la segunda AI
      Factory de España, con 82 millones de euros de dotación. Ninguna fuente publica todavía
      arquitectura, número de aceleradores ni rendimiento del superordenador que se adquirirá,
      así que el registro queda sin recuento: consta la existencia del proyecto, no su tamaño.

incertidumbres:
  - campo: computo
    descripcion: >-
      El propio CESGA publica dos recuentos incompatibles de las GPU del FinisTerrae III. La
      página de infraestructuras da «128 GPUs Nvidia A100 y 16 Nvidia T4» y 354 nodos; la
      documentación técnica del usuario y una presentación institucional dan «157 GPUs: 141
      Nvidia A100 and 16 Nvidia T4», 357 nodos y 4,36 PFlops. Se registra la primera, que es la
      página institucional del centro, y se conserva el choque sin resolver.
    fuentes: [src-computo, src-docs]
  - campo: potencia
    descripcion: >-
      Los 3,2 MW IT proceden de la ficha de proyecto de Dominion, adjudicataria de
      la obra. La nota de prensa oficial de la Xunta no publica ninguna cifra de
      potencia, de modo que el dato no está confirmado por el promotor público.
    fuentes: [src-1, src-3]
  - campo: superficie_construida_m2
    descripcion: >-
      La Xunta y El Correo Gallego dan 2.700 m² para el edificio principal; Dominion
      habla de «más de 2.400 m² construidos y más de 1.200 m² de espacio exterior
      técnico». No se sustituye el valor registrado.
    fuentes: [src-1, src-3]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 56 M€ son la inversión total; 13 M€ corresponden a la obra del edificio y
      34 M€ al equipamiento licitado. No se suman a otras cifras.
    fuentes: [src-1, src-2]

confianza: alta
ultima_verificacion: "2026-08-31"

fuentes:
  - id: src-1
    url: "https://www.xunta.gal/es/notas-de-prensa/-/nova/015782/construccion-del-nuevo-cesga-sera-primero-proyecto-estrategico-investigacion"
