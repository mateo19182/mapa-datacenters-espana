  - id: src-2
    url: "https://www.elcorreogallego.es/santiago/2026/03/03/supercomputador-cesga-xunta-multiplica-capacidad-127503141.html"
    titulo: "El Cesga multiplica por 13 su capacidad con el Finisterrae IV, un supercomputador de más de 25 millones de euros"
    editor: "El Correo Gallego"
    tipo: prensa_general
    fecha_publicacion: "2026-03-03"
    fecha_consulta: "2026-08-29"
    cita: "ordenador cuántico de 54 cúbits de la finlandesa IQM proveído por Telefónica"
  - id: src-3
    url: "https://www.dominion-global.com/es/casos-de-exito/area-de-telecomunicaciones/proyectos-tecnologicos-sistemas-comunicacion/ampliacion-del-centro-tecnologico-de-supercomputacion-de-galicia-cesga"
    titulo: "Ampliación del Centro Tecnológico de Supercomputación de Galicia (CESGA)"
    editor: "Dominion Global"
    tipo: empresa
    fecha_consulta: "2026-08-31"
    cita: >-
      Un edificio altamente tecnológico y energéticamente eficiente con más de 2.400
      m² construidos y más de 1.200 m² de espacio exterior técnico. El nuevo centro
      está preparado para operar con potencias IT de hasta 3,2 MW y para acoger
      tecnologías emergentes en supercomputación, almacenamiento masivo y
      computación cuántica [...] integramos soluciones de refrigeración líquida
      directa, cableado estructurado redundante y un sistema de gestión BMS
  - id: src-computo
    url: "https://www.cesga.es/infraestructuras/computacion/"
    titulo: "Computación — Centro de Supercomputación de Galicia"
    editor: "CESGA"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: >-
      El equipo actualmente en servicio, el FinisTerrae III fue instalado en el año 2021 y
      puesto en producción en el año 2022. Es un equipo Bull ATOS bullx distribuído en 13 racks
      o armarios y que cuenta con 354 nodos de computación, 22.656 cores Intel Xeon Ice Lake
      8352Y, 128 GPUs Nvidia A100 y 16 Nvidia T4, 118 TB de memoria y 5.000 TB de almacenamiento
      de altas prestaciones Lustre. [...] La capacidad de cómputo pico del equipo es de 4
      PetaFlops.
  - id: src-cuantica
    url: "https://www.cesga.es/infraestructuras/cuantica/"
    titulo: "Cuántica — Centro de Supercomputación de Galicia"
    editor: "CESGA"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: >-
      Un entorno de investigación en computación cuántica: QMIO. Este entorno fue desplegado en
      CESGA en 2023 y abierto a investigadores en 2024. Está compuesto por: 1. Una unidad de
      procesamiento cuántico (Quantum Processing Unit) de 32 cúbits superconductores tipo
      coaxmon.
  - id: src-aif
    url: "https://www.ciencia.gob.es/Noticias/2025/octubre/instalacion-fabrica-IA-salud-Galicia.html"
    titulo: "El Gobierno de España contribuye con 24 millones a la instalación de una fábrica de IA de salud en el Centro de Supercomputación de Galicia"
    editor: "Ministerio de Ciencia, Innovación y Universidades"
    tipo: oficial
    fecha_publicacion: "2025-10-10"
    fecha_consulta: "2026-08-31"
    cita: >-
      La Empresa Común Europea de Computación de Alto Rendimiento (EuroHPC JU) ha anunciado hoy
      que el Centro de Supercomputación de Galicia [...] albergará una nueva fábrica europea de
      inteligencia artificial (European One-Health -1Health AI), centrada en el ámbito de la
      salud. [...] Gracias a esta fábrica, se podrá adquirir un superordenador específico para
      inteligencia artificial y una plataforma de supercomputación avanzada optimizada para IA
      experimental.
  - id: src-docs
    url: "https://cesga-docs.gitlab.io/ft3-user-guide/overview.html"
    titulo: "Overview — CESGA Technical Documentation"
    editor: "CESGA"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: >-
      FinisTerrae III, with a total computing power of 4,36 PetaFLOPS, is made up of 357 nodes
      interconnected via an Infiniband HDR network. There are 714 latest generation Intel Xeon
      Ice Lake 8352Y processors with 32 cores at 2.2Ghz (22.848 cores) and 157 GPUs (141 Nvidia
      A100 and 16 Nvidia T4).
