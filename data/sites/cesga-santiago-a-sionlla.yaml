id: cesga-santiago-a-sionlla
nombre: "CESGA — nuevo centro de datos de A Sionlla (Santiago de Compostela)"
alias:
  - "Nueva sede del Cesga"
  - "Centro de Supercomputación de Galicia — A Sionlla"
tipo: edificio
operador: "Centro de Supercomputación de Galicia (CESGA)"
propietario: "Xunta de Galicia / CSIC (consorcio CESGA)"
modelo: corporativo

ubicacion:
  municipio: "Santiago de Compostela"
  provincia: "A Coruña"
  ccaa: "Galicia"
  direccion: "Polígono de A Sionlla, Santiago de Compostela"
  lat: 42.9300
  lon: -8.5000
  precision: aproximada
  fuentes: [ src-1 ]

estado: en_construccion
estado_detalle: >-
  Primer «proyecto estratégico de investigación pública» declarado por la Xunta. Obras iniciadas en
  octubre de 2025 con previsión de finalizar en verano de 2026. Albergará el supercomputador
  FinisTerrae IV, un sistema de almacenamiento y un ordenador cuántico de 54 cúbits de la finlandesa
  IQM suministrado por Telefónica. Fsas Technologies (Fujitsu) es el adjudicatario del equipamiento.
  En octubre de 2025 se anunció que el CESGA acogerá además una fábrica europea de IA orientada a
  salud. La Xunta adjudicó FinisTerrae IV y almacenamiento a Fsas el 3 de marzo de 2026. El CESGA
  presentó para el 12 de junio dos equipos IQM, Radiance de 54 cúbits y Spark de 5. La presentación
  y adjudicación no acreditan por sí solas puesta en servicio ni traslado de FinisTerrae III/Qmio al
  nuevo edificio.
estado_fuentes:
  - src-1
  - src-2
  - src-adjudicacion-ft4
  - src-presentacion-20260612

potencia:
  - tipo: it
    valor_mw: 3.2
    ambito: edificio
    referencia: "Potencia IT máxima para la que está preparado el nuevo edificio"
    estado_asociado: en_construccion
    fecha_dato: null
    fuentes: [ src-3 ]
    nota: >-
      Dominion, autora del proyecto y constructora del edificio junto a Copasa, dice que «el nuevo
      centro está preparado para operar con potencias IT de hasta 3,2 MW». Ni la Xunta ni el CESGA
      publican la cifra. La página de Dominion no lleva fecha, así que no consta desde cuándo es
      cierta: `fecha_dato` queda vacío en lugar de repetir la fecha de consulta, que no es lo que
      ese campo mide.

fases:
  - nombre: "Edificio y equipamiento (FinisTerrae IV + cuántico)"
    estado: en_construccion
    fecha_puesta_en_servicio: "2026"
    superficie_m2: 2700
    fuentes: [ src-1 ]

superficie_parcela_m2: 9100
superficie_construida_m2: 2700
inversion_anunciada_eur: 56000000
refrigeracion: >-
  Soluciones de refrigeración líquida directa, según la empresa que redactó el proyecto y construye
  el edificio; diseño compatible con certificación Tier III. La nota de la Xunta habla de «sistemas
  de climatización de alta adecuación técnica» y paneles fotovoltaicos.

enlaces_proyecto:
  - "https://www.xunta.gal/es/notas-de-prensa/-/nova/015782/construccion-del-nuevo-cesga-sera-prime\
    ro-proyecto-estrategico-investigacion"

computo:
  - tipo: no_especificado
    sistema: "Superordenador de la fábrica de IA 1HealthAI"
    estado: anunciado
    fecha_dato: "2025-10-10"
    fuentes: [ src-aif ]
    nota: >-
      La Comisión Europea seleccionó al CESGA en octubre de 2025 para albergar la segunda AI Factory
      de España, con 82 millones de euros de dotación. Ninguna fuente publica todavía arquitectura,
      número de aceleradores ni rendimiento del superordenador que se adquirirá, así que el registro
      queda sin recuento: consta la existencia del proyecto, no su tamaño.
    modalidad: previsto
  - tipo: cpu_hpc
    ambito: sistema
    sistema: FinisTerrae IV
    estado: anunciado
    modalidad: adquirido
    fecha_dato: 2026-03-17
    fuentes:
      - src-adjudicacion-ft4
      - src-contrato-ft4
    nota: >-
      Contrato CTS-2025-0021 formalizado con Fsas Technologies el 17 de marzo de 2026 por
      25.133.684,40 euros. La ficha publica modificaciones de junio de 2026, sin recepción o
      puesta en servicio confirmada. La fecha corresponde al contrato, no al inventario físico.
      No es el supercomputador separado de la futura factoría 1HealthAI.
  - tipo: qpu
    ambito: sistema
    sistema: Nuevo sistema cuántico CESGA, IQM Radiance
    modelo: IQM Radiance, cúbits superconductores
    unidades: 54
    tipo_unidad: qubit
    estado: anunciado
    modalidad: previsto
    fuentes:
      - src-presentacion-20260612
      - src-presentacion-en-20260612
    nota: Equipamiento anunciado para la nueva infraestructura del CESGA. El acto de presentación del 12
      de junio no acredita por sí solo servicio científico abierto o ubicación definitiva de los
      equipos.
  - tipo: qpu
    ambito: sistema
    sistema: Nuevo sistema cuántico CESGA, IQM Spark
    modelo: IQM Spark, equipo de formación y pruebas de algoritmos
    unidades: 5
    tipo_unidad: qubit
    estado: anunciado
    modalidad: previsto
    fuentes:
      - src-presentacion-en-20260612
    nota: Segundo equipo anunciado para formación y pruebas. No se suma a Radiance o Qmio ni se da por
      instalado sin confirmación.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Los 3,2 MW IT proceden de la ficha de proyecto de Dominion, adjudicataria de la obra. La nota
      de prensa oficial de la Xunta no publica ninguna cifra de potencia, de modo que el dato no
      está confirmado por el promotor público.
    fuentes: [ src-1, src-3 ]
  - campo: superficie_construida_m2
    descripcion: >-
      La Xunta y El Correo Gallego dan 2.700 m² para el edificio principal; Dominion habla de «más
      de 2.400 m² construidos y más de 1.200 m² de espacio exterior técnico». No se sustituye el
      valor registrado.
    fuentes: [ src-1, src-3 ]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 56 M€ son la inversión total; 13 M€ corresponden a la obra del edificio y 34 M€ al
      equipamiento licitado. No se suman a otras cifras.
    fuentes: [ src-1, src-2 ]
  - campo: computo
    descripcion: >-
      FinisTerrae III y Qmio se registran en la sede CESGA de Campus Sur, avenida de Vigo,
      su última ubicación física documentada. No se ha confirmado su traslado a A Sionlla.
      Las fichas institucionales y la guía técnica de esos sistemas no son inventarios del
      nuevo edificio. Tampoco acreditan su permanencia en Campus Sur en octubre de 2026.
    fuentes: [src-computo, src-cuantica, src-docs, src-contacto-sede, src-visita-ft3, src-jornada-qmio]
  - campo: computo
    descripcion: FinisTerrae IV y los equipos IQM anunciados para la renovación son distintos del
      proyecto 1HealthAI. Faltan confirmaciones de recepción y servicio. Los 54 y 5 cúbits son
      especificaciones de dos sistemas y no un total sumable.
    fuentes:
      - src-adjudicacion-ft4
      - src-presentacion-20260612
      - src-presentacion-en-20260612
      - src-aif

confianza: alta
ultima_verificacion: "2026-10-14"

