incertidumbres:
  - campo: potencia
    descripcion: >-
      Fuentes secundarias atribuyen al edificio «potencias IT de hasta 3,2 MW», pero
      la nota de prensa oficial de la Xunta no lo recoge y no se ha podido abrir esa
      fuente. Campo potencia omitido.
    fuentes: [src-1, src-2]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 56 M€ son la inversión total; 13 M€ corresponden a la obra del edificio y
      34 M€ al equipamiento licitado. No se suman a otras cifras.
    fuentes: [src-1, src-2]

confianza: alta
