incertidumbres:
  - campo: computo.unidades
    descripcion: >-
      El catálogo declara 13 GPU, pero enumera 3 RTX 2080 Ti, 4 Tesla V100, 4 Titan X CC6.1,
      1 GTX 1080 Ti, 2 GTX Titan X CC5.2 y 1 Tesla K20. No consta una corrección que concilie
      las lecturas. Se conserva el total publicado junto a sus partidas, sin calcular otro total.
      La versión inglesa mantiene el total de 13, pero cambia GTX 1080 Ti de una a tres y GTX
      Titan X CC5.2 de dos a tres. Ninguna versión fecha o explica esos cambios.
    fuentes: [src-infraestructura, src-infraestructura-en]
  - campo: computo.fecha_dato
    descripcion: >-
      La página describe el equipamiento como existente, pero carece de fecha del inventario y
      de instalación. La consulta de 2026 no acredita una ampliación ni fecha esas generaciones de GPU.
    fuentes: [src-infraestructura]
  - campo: ubicacion
    descripcion: >-
      El catálogo enlaza expresamente a Derio, edificio 700. Las coordenadas son la referencia
      de esa sede publicada por TECNALIA, no una posición verificada de la sala de servidores.
      El domicilio de Donostia del pie general de la web no sitúa este clúster.
    fuentes: [src-infraestructura, src-sede-derio]
  - campo: potencia
    descripcion: No constan MW IT, capacidad de acceso eléctrico ni consumo de agua de esta infraestructura.
    fuentes: [src-infraestructura]

