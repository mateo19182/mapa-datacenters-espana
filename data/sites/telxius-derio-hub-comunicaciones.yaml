id: telxius-derio-hub-comunicaciones
nombre: "Derio Communications Hub — Telxius"
alias:
  - "Hub de Comunicaciones de Derio"
  - "Telxius Derio"
tipo: edificio
operador: "Telxius (Grupo Telefónica)"
propietario: "Telxius Telecom"
modelo: colocation

ubicacion:
  municipio: "Derio"
  provincia: "Bizkaia"
  ccaa: "País Vasco"
  lat: 43.2920
  lon: -2.8760
  precision: municipio
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Hub de comunicaciones neutro de Telxius próximo a Bilbao. Es el punto al que se
  conectan los cables submarinos transatlánticos que amarran en la estación de
  Sopelana (Marea y Grace Hopper), y desde el que se ofrecen servicios de
  colocación, capacidad e IP. Grace Hopper amarró en Sopelana en septiembre de 2021.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: no_especificado
    valor_mw: 4
    ambito: edificio
    referencia: "Potencia máxima ofertada por el hub"
    fecha_dato: "2020-12-16"
    fuentes: [src-1]
    nota: >-
      La nota de Telxius dice «offering up to 4 MW of power», sin precisar si es
      carga TI o potencia instalada.

conexion_electrica:
  fuentes: []

enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      El dato de 4 MW procede de un anuncio de diciembre de 2020; no se ha localizado
      una cifra actualizada a 2026.
    fuentes: [src-1]
  - campo: ubicacion
    descripcion: >-
      Telxius no publica dirección. El hub está en Derio y la estación de amarre de
      los cables está en Sopelana, a unos 10 km; son instalaciones distintas.
    fuentes: [src-1, src-2]

confianza: media
ultima_verificacion: "2026-08-31"

