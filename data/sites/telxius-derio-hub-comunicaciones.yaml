id: telxius-derio-hub-comunicaciones
nombre: "Derio Communications Hub — Telxius"
alias:
  - "Hub de Comunicaciones de Derio"
  - "Telxius Derio"
tipo: edificio
operador: "Telxius (Grupo Telefónica)"
propietario: "Telxius Telecom"
modelo: colocation

ubicacion:
  municipio: "Derio"
  provincia: "Bizkaia"
  ccaa: "País Vasco"
  lat: 43.2920
  lon: -2.8760
  precision: municipio
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Hub de comunicaciones neutro de Telxius próximo a Bilbao. Es el punto al que se
  conectan los cables submarinos transatlánticos que amarran en la estación de
  Sopelana (Marea y Grace Hopper), y desde el que se ofrecen servicios de
  colocación, capacidad e IP. Grace Hopper amarró en Sopelana en septiembre de 2021.
  Lanzado en octubre de 2019 para canalizar la capacidad del cable Marea, es
  carrier-neutral, opera con energía 100% renovable y declara especificaciones
  Tier III. Entre los operadores conectados figuran Telefónica, Arelion, Colt
  Technology Services, EXA, Sipartech y Euskaltel. En febrero de 2024 recibió el
  premio a la Excelencia en Conectividad de los DCM Awards.
estado_fuentes: [src-1, src-2, src-3]

potencia:
  - tipo: no_especificado
    valor_mw: 4
    ambito: edificio
    referencia: "Potencia máxima ofertada por el hub"
    fecha_dato: "2020-12-16"
    fuentes: [src-1]
    nota: >-
      La nota de Telxius dice «offering up to 4 MW of power», sin precisar si es
      carga TI o potencia instalada.
  - tipo: it
    valor_mw: 2
    ambito: edificio
    referencia: "Capacidad TI del centro de datos de Derio"
    estado_asociado: operativo
    fecha_dato: "2024-02-01"
    fuentes: [src-3]
    nota: >-
      La nota de Telxius de 2024 dice «advanced colocation capabilities and 2MW of IT
      power». Es la primera cifra tipificada como carga TI del emplazamiento y no se
      compara con los 4 MW sin tipificar de 2020.

conexion_electrica:
  fuentes: []

refrigeracion: >-
  Edificio alimentado con energía 100% renovable y refrigerado por free cooling,
  según la nota de Telxius de diciembre de 2020.

enlaces_proyecto:
  - "https://telxius.com/en/our-data-centers/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      Las dos cifras publicadas por el propio operador no encajan: «up to 4 MW of
      power» en diciembre de 2020 y «2MW of IT power» en febrero de 2024. Pueden ser
      magnitudes distintas (potencia total ofertada frente a carga TI) o una
      corrección a la baja. Telxius no lo aclara y se conservan ambas, en campos de
      tipo distinto. No se ha localizado cifra posterior a 2024.
    fuentes: [src-1, src-3]
  - campo: ubicacion
    descripcion: >-
      Telxius no publica dirección. El hub está en Derio y la estación de amarre de
      los cables está en Sopelana, a unos 10 km; son instalaciones distintas.
    fuentes: [src-1, src-2]

confianza: media
ultima_verificacion: "2026-08-31"

