estado_detalle: >-
  No es un centro de datos ni una instalación de cómputo: es infraestructura de comunicaciones,
  del mismo género que las estaciones de aterraje de cable submarino ya registradas, y se
  incluye por esa analogía. La Universidade de Vigo la inauguró en abril de 2026 como la mayor
  estación óptica terrena de España para comunicaciones cuánticas vía satélite, con el nombre de
  la astrónoma ourensana Antonia Ferrín Moreiras. Se sitúa en el entorno de la Facultade de
  Filoloxía e Tradución por ser el punto del campus con menos turbulencia del canal atmosférico.
  Consiste en un telescopio de 80 centímetros de diámetro dentro de una cúpula y varios equipos
  de medida alojados en un contenedor conectado al telescopio por fibra óptica. Se destinará a
  distribución cuántica de claves criptográficas y permitirá conectar con las misiones europeas
  Eagle-I y SAGA de la Agencia Espacial Europea, en cuyo consorcio ya participa la universidad.
  Solo existe en España otra estación óptica similar, en el Instituto de Tecnologías Físicas y
  de la Información Leonardo Torres Quevedo del CSIC, de menor tamaño.
