estado: en_construccion
estado_detalle: >-
  Microsoft declaró en la apertura de su región cloud Spain Central (Comunidad de Madrid) que
  avanzaba en la construcción de centros de datos adicionales en Algete, Meco y San Sebastián de
  los Reyes, que se inaugurarían "próximamente". La región Spain Central está formada por tres
  zonas de disponibilidad con energía, refrigeración y redes independientes. El Ayuntamiento de
  Algete informó en agosto de 2023 de haber resuelto la licencia de actividad del centro,
  identificado como MAD02, y la licencia de actividad de la subestación de Iberdrola para
  Microsoft, y dejó pendientes el anexo de la licencia de actividad de la subestación de
  Microsoft y la licencia de 66 kV. El Ayuntamiento y la prensa local describen un complejo con
  dos centros de procesamiento de datos.
estado_fuentes: [src-1, src-2, src-3]

potencia: []

conexion_electrica:
  subestacion: null
  tension_kv: null
  titular_red: "Iberdrola"
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    El Ayuntamiento de Algete cita entre las licencias del proyecto una «Licencia de Actividad de
    Subestación de Iberdrola para Microsoft» ya resuelta, un «Anexo de Licencia de Actividad
    Subestación de Microsoft» pendiente y una «Licencia de 66 kw» pendiente, que por el contexto
    corresponde a una tensión de 66 kV y no a una potencia. No se publica el nombre de la
    subestación ni los MW del punto de conexión, así que la tensión se deja sin registrar.
  fuentes: [src-2]

refrigeracion: "Microsoft indica refrigeración evaporativa directa para los centros de datos de la región, con uso de agua en torno al 15% del tiempo de operación."

incertidumbres:
  - campo: potencia
    descripcion: >-
      Microsoft no publica potencia ni superficie de sus emplazamientos en la Comunidad de
      Madrid, y no se ha localizado expediente ambiental autonómico de este centro, a diferencia
      de los de Meco y San Sebastián de los Reyes. Un directorio sectorial atribuye al
      emplazamiento una estimación de 60 MW, pero es una estimación del directorio y no se
      registra como dato.
    fuentes: [src-1, src-4]
  - campo: estado
    descripcion: >-
      La última información municipal localizada es de agosto de 2023 y describe licencias en
      curso. No se ha encontrado confirmación pública posterior de la puesta en servicio.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: "No consta dirección ni parcela; la geolocalización queda a nivel de municipio."
    fuentes: [src-1]

confianza: baja
