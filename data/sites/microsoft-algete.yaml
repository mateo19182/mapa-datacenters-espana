estado: en_construccion
estado_detalle: >-
  Microsoft declaró en la apertura de su región cloud Spain Central (Comunidad de Madrid) que
  avanzaba en la construcción de centros de datos adicionales en Algete, Meco y San Sebastián de
  los Reyes, que se inaugurarían "próximamente". La región Spain Central está formada por tres
  zonas de disponibilidad con energía, refrigeración y redes independientes. El Ayuntamiento de
  Algete informó en agosto de 2023 de haber resuelto la licencia de actividad del centro,
  identificado como MAD02, y la licencia de actividad de la subestación de Iberdrola para
  Microsoft, y dejó pendientes el anexo de la licencia de actividad de la subestación de
  Microsoft y la licencia de 66 kV. El Ayuntamiento y la prensa local describen un complejo con
  dos centros de procesamiento de datos.
estado_fuentes: [ src-1, src-2, src-3, src-ms-comunidad-20260305 ]

potencia: []

conexion_electrica:
  subestacion: ST Microsoft SE Algete Datacenter 66/20 kV
  tension_kv: 66
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: Resolución de 14 de octubre de 2022, publicada el 21 de noviembre, autoriza construir la SET
    con dos transformadores de 45 MVA cada uno. No acredita explotación ni publica MW otorgados; no
    se suman los transformadores ni se convierten MVA a MW. La SET se sitúa en calle Torrecilla,
    P.I.Río de Janeiro; no se traslada su coordenada al edificio CPD.
  fuentes:
    - src-bocm-set-20221121

refrigeracion: "Microsoft indica refrigeración evaporativa directa para los centros de datos de la región, con uso de agua en torno al 15% del tiempo de operación."

incertidumbres:
  - campo: potencia
    descripcion: >-
      Microsoft no publica potencia ni superficie de sus emplazamientos en la Comunidad de
      Madrid, y no se ha localizado expediente ambiental autonómico de este centro, a diferencia
      de los de Meco y San Sebastián de los Reyes. Un directorio sectorial atribuye al
      emplazamiento una estimación de 60 MW, pero es una estimación del directorio y no se
      registra como dato.
    fuentes: [src-1, src-4]
  - campo: estado
    descripcion: La nota de apertura de la región de 2024 situaba este emplazamiento en construcción.
      Microsoft confirma en marzo 2026 la presencia de centros en Algete, Meco y San Sebastián de
      los Reyes, pero no identifica edificios o fases entregadas, fechas de recepción ni MW en
      servicio. La operación regional no se atribuye automáticamente a la totalidad del diseño de
      esta ficha.
    fuentes: [ src-1, src-2, src-ms-comunidad-20260305 ]
  - campo: ubicacion
    descripcion: El BOCM identifica la subestación del Datacenter en calle Torrecilla, polígono Río de
      Janeiro. No establece la parcela o el edificio del CPD; no se usa el punto UTM de la SET como
      coordenada de servidores.
    fuentes: [ src-1, src-bocm-set-20221121 ]

confianza: baja
ultima_verificacion: "2026-10-17"

