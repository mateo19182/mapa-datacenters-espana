estado: desconocido
estado_detalle: >-
  Instalación registrada en PeeringDB y directorios de colocation en María Tubau 8.
  Ibercom documentó su IDC de Madrid en el folleto corporativo de 2012, y el BORME sitúa
  el domicilio de Ibercom Telecom en esa calle. La cuarta planta procede del directorio.
  Estas referencias históricas no confirman la actividad ni el operador actual del centro.
estado_fuentes: [src-1, src-2, src-borme-2007, src-folleto-2012]

potencia: []

incertidumbres:
  - campo: estado
    descripcion: >-
      El folleto de 2012 acredita un IDC de Madrid, pero no confirma su continuidad en 2026.
      PeeringDB mantiene la instalación y tres redes asociadas; esa relación de catálogo no
      acredita por sí sola su operatividad actual. Se mantiene el estado desconocido.
    fuentes: [src-1, src-2, src-folleto-2012]
  - campo: operador
    descripcion: >-
      Los directorios atribuyen la instalación a Ibercom. No se ha localizado documentación
      actual del grupo que confirme quién explota este emplazamiento. El domicilio societario
      histórico no se toma como prueba de actividad del CPD.
    fuentes: [src-1, src-2, src-borme-2007]
  - campo: potencia
    descripcion: >-
      Sin potencia publicada. El folleto de 2012 describe 510 m² de IDC dentro de 1.250 m²
      que incluyen oficinas, laboratorios y zonas técnicas. No se extrapolan como superficie
      actual del edificio ni como potencia eléctrica.
    fuentes: [src-folleto-2012]
  - campo: ubicacion
    descripcion: >-
      Se conserva el punto de la instalación nominada en PeeringDB con precisión aproximada.
      No hay plano del operador que confirme la sala ni la cuarta planta indicada por el directorio.
    fuentes: [src-1, src-2, src-3]

confianza: baja
