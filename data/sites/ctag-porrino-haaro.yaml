incertidumbres:
  - campo: computo
    descripcion: >-
      La existencia de GPU está documentada, pero faltan modelo, recuento y fecha del inventario.
      La presentación del laboratorio no permite fechar la recepción del hardware.
    fuentes: [src-haaro, src-presentacion-haaro]
  - campo: estado
    descripcion: >-
      HAARO es el laboratorio presentado por CTAG con instalaciones adaptadas. El futuro Polo
      Tecnológico de Humanoides que menciona la noticia tiene otro alcance; no se registra como
      construido ni como una ampliación GPU ya entregada.
    fuentes: [src-presentacion-haaro]
  - campo: ubicacion
    descripcion: >-
      El punto corresponde al campus CTAG de A Granxa, en O Porriño, identificado en el mapa
      de Google Maps que el operador incrusta en su página de contacto para CTAG y CTAG-IDIADA,
      junto a la dirección de calle A, parcelas 249-250. Google Maps rotula ese mismo pin como
      Avenida Principal, 2. La precisión es aproximada: no identifica la sala concreta de HAARO.
      La referencia promocional a Vigo no cambia el municipio.
    fuentes: [src-presentacion-haaro, src-servicios, src-contacto, src-mapa-ctag]
  - campo: potencia
    descripcion: No constan MW IT, capacidad de acceso eléctrico ni consumo de agua del laboratorio.
    fuentes: [src-haaro, src-presentacion-haaro]

