estado_detalle: >-
  CTAG documenta GPU, servidores y almacenamiento para entrenar y simular humanoides en HAARO,
  su laboratorio de I+D de A Granxa, O Porriño. La presentación se publicó el 28 de mayo de
  2026. No constan modelo ni cantidad de GPU, ni una fecha de entrega de las tarjetas.
