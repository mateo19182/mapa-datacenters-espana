      La existencia de GPU está documentada, pero faltan modelo, recuento y fecha del inventario.
      La presentación del laboratorio no permite fechar la recepción del hardware.
    fuentes: [src-haaro, src-presentacion-haaro]
  - campo: estado
    descripcion: >-
      HAARO es el laboratorio presentado por CTAG con instalaciones adaptadas. El futuro Polo
      Tecnológico de Humanoides que menciona la noticia tiene otro alcance; no se registra como
      construido ni como una ampliación GPU ya entregada.
    fuentes: [src-presentacion-haaro]
  - campo: ubicacion
    descripcion: >-
      El laboratorio pertenece al campus CTAG de A Granxa, en O Porriño. No se han verificado
      las coordenadas ni la sala concreta. La referencia promocional a Vigo no cambia el municipio
      y no se usa un centroide para colocar el punto.
    fuentes: [src-presentacion-haaro, src-servicios]
  - campo: potencia
    descripcion: No constan MW IT, capacidad de acceso eléctrico ni consumo de agua del laboratorio.
    fuentes: [src-haaro, src-presentacion-haaro]

