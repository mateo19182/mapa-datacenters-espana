estado_detalle: >-
  Instalación registrada como facility activa en PeeringDB por Grupo Sys4net, S.L. en el
  Parque Empresarial Magalia del polígono industrial Oeste de Alcantarilla. Es una de las
  pocas instalaciones de interconexión documentadas en la Región de Murcia además de la de
  Kumo Networks en Espinardo. El operador describe doble acometida eléctrica desde centros
  de transformación independientes, grupos electrógenos N+1 de arranque automático, doble
  rama A+B protegida por UPS modulares de 300 kW, climatización InRow en configuración N+2,
  extinción por gas FM-200, anillo de fibra con tres caminos independientes y un compromiso
  de disponibilidad anual superior al 99,9 %.
estado_fuentes: [src-1, src-3]

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta potencia del centro, superficie ni número de racks. La instalación no figura
      en el directorio del Observatorio Español de Data Centers, que solo recoge tres
      registros para la Región de Murcia. La única cifra eléctrica que publica el operador
      son los «equipos UPS Vertiv modulares de 300 kW» de cada rama de distribución: es
      capacidad de respaldo ininterrumpido por rama, no carga TI ni potencia contratada del
      emplazamiento, así que no se registra en `potencia[]`.
    fuentes: [src-1, src-2, src-3]
  - campo: estado
    descripcion: >-
      PeeringDB no distingue estado operativo; se asume operativo por figurar en el
      directorio de instalaciones activas, sin confirmación independiente.
    fuentes: [src-1]

confianza: baja
