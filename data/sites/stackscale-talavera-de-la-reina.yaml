ubicacion:
  municipio: "Talavera de la Reina"
  provincia: "Toledo"
  ccaa: "Castilla-La Mancha"
  direccion: "Calle Puebla de México, 58"
  lat: 39.9569433
  lon: -4.8440534
  precision: aproximada
  fuentes: [src-aire, src-osm-calle]

estado: operativo
estado_detalle: >-
  Centro de datos de colocation inaugurado en 2022, cuya primera piedra colocó el
  presidente de Castilla-La Mancha en diciembre de 2021. Se comercializa por
  Stackscale y por Aire Cloud, ambas del Grupo Aire, como instalación carrier
  neutral con doble SAI N+1, red de N*400 Gbps, características de TIER III y más
  de 54 racks en unos 800 metros cuadrados. Conecta con Aire Networks, Lyntia,
  Avatel, Reintel y Telefónica, y con los puntos neutros AMS-IX, LINX, DE-CIX,
  Equinix y ESPANIX. Certificaciones ISO 9001, 14001, 22301, 27001, 27017 y 27018.
estado_fuentes: [src-stackscale, src-aire, src-silicon]
fecha_puesta_en_servicio: "2022"

potencia: []

fases: []

superficie_construida_m2: 800
inversion_anunciada_eur: 1300000

refrigeracion: >-
  Salas IT climatizadas con pasillos de frío y calor. La compañía declara sistemas
  N+1 tolerantes al fallo en energía, refrigeración y conectividad, y placas
  solares propias para reducir el impacto ambiental.

empleo:
  - tipo: total
    valor: 300
    referencia: "Puestos directos e indirectos previstos en la inauguración"
    fecha_dato: "2022-06-30"
    fuentes: [src-silicon]
    nota: >-
      Cifra de previsión publicada en la inauguración, sin desglosar entre directos
      e indirectos y desproporcionada frente a los 800 m2 de la instalación:
      probablemente incluya el efecto sobre clientes y economía local. No se ha
      contrastado con ningún registro laboral.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la ficha comercial de Stackscale ni la de Aire Cloud publican potencia
      eléctrica, carga TI ni potencia contratada. Solo consta que hay "más de 54
      racks" y doble SAI N+1 con autonomía de hasta 72 horas, lo que no permite
      derivar ninguna cifra de MW sin suponer una densidad por rack.
    fuentes: [src-stackscale, src-aire]
  - campo: ubicacion
    descripcion: >-
      La ficha de Aire Cloud sí publica la dirección, calle Puebla de México 58,
      pero Nominatim solo geocodifica la calle y no el número: las coordenadas son
      las del eje de la vía, no las del edificio. La ficha de Stackscale sigue
      indicando únicamente "Talavera de la Reina, Toledo".
    fuentes: [src-aire, src-stackscale, src-osm-calle]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      Las fuentes sitúan la inauguración en 2022 sin coincidir en el mes: la ficha
      comercial dice "Se inauguró en 2022", la prensa especializada fechó la
      inauguración el 30 de junio de 2022 y la nota sobre la primera piedra es de
      diciembre de 2021. Se registra el año.
    fuentes: [src-aire, src-silicon, src-dcm-piedra]
  - campo: empleo
    descripcion: >-
      Los 300 puestos "directos e indirectos" son una previsión de la inauguración
      y no se han desglosado ni verificado. No hay dato de plantilla en el
      emplazamiento.
    fuentes: [src-silicon]

