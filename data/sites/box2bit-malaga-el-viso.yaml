estado: en_tramitacion
estado_detalle: >-
  Proyecto denominado Olive Urban, promovido por Box2bit, filial de centros de datos del empresario
  Jesús Martín Buezas, fundador de Capital Energy. La Gerencia de Urbanismo del Ayuntamiento de
  Málaga lo incluyó en su Unidad Aceleradora de Proyectos por considerarlo de interés estratégico
  para la ciudad y la Junta de Gobierno Local aprobó inicialmente el estudio de detalle de la
  parcela el 6 de junio de 2025, con informes pendientes de Aviación Civil y de la administración
  hidráulica. El 29 de enero de 2026 Urbanismo dio luz verde a que siguieran los trámites tras
  aportar la promotora una garantía económica. En febrero de 2026 Box2bit refinanció 25,5 millones
  de euros con Eiffel Investment Group, extendiendo vencimientos hasta 2027 para completar sus
  proyectos de Málaga, Guadalajara y Épila. No se ha localizado licencia de obra ni constancia del
  inicio de la construcción.
estado_fuentes: [src-2, src-3, src-4, src-5, src-6]

superficie_parcela_m2: 16770
superficie_construida_m2: 15000
inversion_anunciada_eur: 279000000

