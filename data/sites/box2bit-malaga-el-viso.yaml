enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta potencia eléctrica ni carga TI en ninguna fuente, incluidos el expediente municipal
      recogido por la prensa local y las notas sectoriales. Solo se publican superficies: 15.000 m²
      totales, unos 12.770 m² de superficie TI y 2.260 m² de edificio administrativo. Campo potencia
      omitido.
    fuentes: [src-1, src-2, src-4]
  - campo: estado
    descripcion: >-
      Baxtel da el proyecto por «en construcción», pero el rastro municipal y la prensa local sitúan
      el expediente en tramitación urbanística: aprobación inicial del estudio de detalle en junio de
      2025 e impulso de los trámites en enero de 2026, sin licencia de obra acreditada. Data Center
      Dynamics habla en febrero de 2026 de refinanciar para «completar» los centros de Málaga y
      Guadalajara, formulación ambigua. Se registra en_tramitacion por ser lo que sostiene la fuente
      administrativa más reciente.
    fuentes: [src-1, src-2, src-5, src-6]
  - campo: conexion_electrica
    descripcion: >-
      Las fuentes mencionan una subestación eléctrica en la propia parcela —que podría ir soterrada—
      y una inversión de 1,4 millones de euros en mejora y adaptación de las redes eléctricas, pero
      no dan tensión, titular ni MW de conexión.
    fuentes: [src-1, src-4]
  - campo: superficie_parcela_m2
    descripcion: >-
      El estudio de detalle da 16.770,60 m² de parcela, con una edificabilidad máxima de
      21.562,05 m² que el proyecto no agota; Sur in English redondea a «17.000 m²». Se registra la
      cifra del expediente truncada a metros enteros.
    fuentes: [src-2, src-4]
  - campo: agua
    descripcion: >-
      No consta sistema de refrigeración ni consumo de agua. El expediente sí exige informe de la
      Consejería competente «en materia de aguas, sobre la afección hidráulica del sector», por la
      proximidad del arroyo de la Palma. Campo agua omitido.
    fuentes: [src-2]

confianza: baja
ultima_verificacion: "2026-08-31"

