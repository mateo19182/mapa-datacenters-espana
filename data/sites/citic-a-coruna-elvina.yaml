  - "CITIC-UDC"
  - "CPD del CITIC"
tipo: edificio
operador: "Centro de Investigación en Tecnoloxías da Información e as Comunicacións (CITIC)"
propietario: "Universidade da Coruña"
cliente_ancla: null
modelo: corporativo

ubicacion:
  municipio: "A Coruña"
  provincia: "A Coruña"
  ccaa: "Galicia"
  direccion: "Campus de Elviña s/n, 15071 A Coruña"
  lat: 43.3325834
  lon: -8.4079677
  precision: exacta
  fuentes: [src-contacto, src-osm]

estado: operativo
estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial, y con una advertencia de escala: su CPD es un centro de proceso de datos
  de laboratorio, para pruebas, pilotos, demostradores y despliegues pre-comerciales, no una
  instalación de servicio comparable con los nodos de la Red Española de Supercomputación. El
  CITIC es un centro de investigación creado en 2008 e impulsado por la Universidade da Coruña,
  integrado en la Red CIGUS y reconocido como Centro de Excelencia por la Xunta de Galicia. Ocupa
  dos edificios modulares con 3.200 m² en el Campus de Elviña. Una de sus cuatro áreas de
  investigación es la computación de altas prestaciones. En 2025 creó una Comisión de
  Infraestructuras para supervisar el CPD y reforzó su capacidad de cálculo.
estado_fuentes: [src-instalaciones, src-memoria, src-presentacion]

potencia: []

superficie_construida_m2: 3200

computo:
  - tipo: gpu
    ambito: sistema
    sistema: "CPD del CITIC"
    modelo: "NVIDIA H100 de 80 GB"
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2025"
    fuentes: [src-memoria]
    nota: >-
      La memoria de actividades de 2025 registra la adquisición sin decir cuántas unidades, así
      que el recuento queda vacío. Su finalidad declarada es reforzar la capacidad de cálculo del
      CPD en inteligencia artificial, computación de altas prestaciones y aprendizaje profundo.
  - tipo: gpu
    sistema: "CPD del CITIC — computación embebida"
    modelo: "Kits de desarrollo NVIDIA Jetson AGX Orin de 64 GB y NVIDIA Jetson AGX Thor"
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2025"
    fuentes: [src-memoria]
    nota: >-
      No son aceleradores de centro de datos: son módulos de desarrollo para inteligencia
      artificial embebida y robótica avanzada. Se registran porque la fuente los presenta como
      ampliación de las capacidades de computación de altas prestaciones del centro, y sin
      recuento porque no lo publica.

incertidumbres:
  - campo: potencia
    descripcion: >-
      El CITIC no publica potencia eléctrica, carga TI, número de racks ni superficie del CPD.
      La única magnitud del emplazamiento es la superficie construida de los dos edificios, que
      no es la de la sala técnica. Campo de potencia vacío.
    fuentes: [src-instalaciones, src-memoria]
  - campo: computo
    descripcion: >-
      Ninguna de las adquisiciones de 2025 lleva recuento en la memoria: ni las H100, ni los
      kits Jetson, ni los servidores del clúster VMware. Se registra qué hay, no cuánto.
    fuentes: [src-memoria]
  - campo: tipo
    descripcion: >-
      La ficha describe un centro de investigación con CPD propio, no un centro de datos. Entra
      en el registro por coherencia con el resto de la infraestructura de cómputo público
      fichada, y su escala es un orden de magnitud inferior a la de cualquier nodo de la RES.
    fuentes: [src-instalaciones]

confianza: baja
ultima_verificacion: "2026-08-31"

