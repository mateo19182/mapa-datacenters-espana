id: aws-el-burgo-de-ebro-bde0
nombre: "AWS Región Aragón — El Burgo de Ebro (centro existente)"
alias:
  - "BDE0"
  - "Amazon Data Services Spain — El Espartal II"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "El Burgo de Ebro"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Polígono industrial El Espartal II, calle A, parcelas 4-1 a 4-4 (la AAI de 2020 lo sitúa en C/ Sector I9)"
  lat: 41.535835
  lon: -0.684715
  precision: exacta
  fuentes: [src-1, src-3]

estado: operativo
estado_detalle: >-
  Uno de los tres centros del primer Proyecto de Interés General de Aragón de Amazon,
  con AAI de 27 de julio de 2020. INAGA modificó puntualmente esa AAI el 28 de octubre
  de 2025. En 2025 se tramitó además una evaluación de impacto ambiental simplificada por
  modificación del centro de datos. La documentación del Gobierno de Aragón de 2025 lo
  denomina "el centro de datos existente BDE0", frente al nuevo BDE del PIGA de ampliación.
estado_fuentes: [src-1, src-2, src-3, src-4]
fecha_puesta_en_servicio: "2022-11"

potencia:
  - tipo: termica_respaldo
    valor_mw: 110.4
    ambito: campus
    referencia: "Potencia eléctrica total instalada de los 46 grupos electrógenos diésel de respaldo"
    estado_asociado: operativo
    fecha_dato: "2020-07-27"
    fuentes: [src-1, src-9]
    nota: >-
      Potencia instalada de los generadores de reserva (46 x 2,4 MWe), no carga TI ni
      potencia de conexión a red.
  - tipo: termica_respaldo
    valor_mw: 107.5
    ambito: campus
    referencia: "Potencia eléctrica total generada por los grupos electrógenos tras la modificación puntual de la AAI"
    estado_asociado: operativo
    fecha_dato: "2025-10-28"
    fuentes: [src-2]
    nota: >-
      Valor revisado en la modificación de 2025 (potencia térmica total aproximada
      291,1 MWt). Sustituye al recuento de 2020 para esta instalación; se conservan ambos.

fases:
  - nombre: "Edificio A"
    estado: operativo
    fuentes: [src-1, src-2]
  - nombre: "Edificio B"
    estado: operativo
    fuentes: [src-1, src-2]

agua:
  circuito: hibrido
  sistema: >-
    Unidades de tratamiento de aire (AHU) sin consumo de agua la mayor parte del año; los
    días de más calor, paneles evaporativos con agua, con recirculación del mayor número de
    ciclos posible.
  origen: "Red municipal de abastecimiento del polígono"
  consumo_m3_ano: 36461
  nota: >-
    36.461 m³/año es el consumo total declarado en la AAI de 2020 (35.000 de climatización,
    1.460 de servicios sanitarios y limpieza y menos de 1 del sistema contra incendios). Es
    la misma cifra que declaran las AAI de Villanueva de Gállego y Huesca PLHUS del mismo
    día, con el mismo desglose. La modificación no sustancial número 2 del PIGA, de 31 de
    julio de 2024, centralizó el tratamiento de agua de los tres centros para mejorar hasta
    un 10 % la eficiencia de uso del agua; en El Burgo de Ebro creó además nuevos puntos de
    conexión en el vial oeste de la parcela por la ubicación de la nueva depuradora.
  fuentes: [src-6, src-8]

energia:
  - consumo_gwh_ano: 739.9
    referencia: "Consumo anual de electricidad de la actividad declarado en la autorización ambiental integrada de 2020"
    fecha_dato: "2020-07-27"
    fuentes: [src-10]
    nota: >-
      La resolución lo publica en MWh: 739.900 MWh/año. Las autorizaciones de los otros dos
      centros del mismo Proyecto de Interés General declaran esta misma cifra.

empleo:
  - tipo: directo
    valor: 60
    referencia: "Plantilla total prevista del centro al completar las fases de implementación (30 por edificio, tres turnos, 24 h, 365 días)"
    fecha_dato: "2020-07-27"
    fuentes: [src-7]
    nota: null

inversion_anunciada_eur: null
enlaces_proyecto:
  - "https://www.aragon.es/-/proyecto-de-interes-general-de-aragon-sobre-la-implantacion-de-centros-de-datos-en-la-comunidad-autonoma-de-aragon-a-propuesta-de-amazon-data-services-spain"

incertidumbres:
  - campo: potencia
    descripcion: >-
      La AAI de 2020 declara 110,4 MWe / 294,4 MWt de grupos electrógenos; la modificación
      puntual de 28 de octubre de 2025 declara 107,5 MWe / 291,1 MWt. Se registran ambos.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      El nuevo centro BDE del PIGA de ampliación se ubica en el polígono El Espartal III,
      a unos 1,1 km de este, y es un emplazamiento distinto con AAI propia.
    fuentes: [src-5]

confianza: alta
ultima_verificacion: "2026-08-31"

