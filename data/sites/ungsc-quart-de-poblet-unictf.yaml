id: ungsc-quart-de-poblet-unictf
nombre: "United Nations Global Service Centre — Base de Valencia (UNICTF), Quart de Poblet"
alias:
  - "UNICTF"
  - "United Nations Information Communication Technology Facility"
  - "Base de Apoyo de Naciones Unidas en Quart de Poblet"
tipo: edificio
operador: "United Nations Global Service Centre"
propietario: "Naciones Unidas"
modelo: corporativo

ubicacion:
  municipio: "Quart de Poblet"
  provincia: "Valencia"
  ccaa: "Comunitat Valenciana"
  direccion: "Avinguda Comarques del País Valencià, 2, 46930 Quart de Poblet (área de servicio del aeropuerto de València)"
  lat: 39.4827
  lon: -0.4439
  precision: municipio
  fuentes: [src-2, src-3]

estado: operativo
estado_detalle: >-
  Instalación de tecnologías de la información y comunicaciones de Naciones Unidas que
  actúa como centro tecnológico gemelo de la base de Brindisi, garantizando continuidad de
  negocio y recuperación ante desastres de los servicios digitales de la ONU. El directorio
  del Observatorio Español de Data Centers lo clasifica como público/on-premise con
  certificación Tier III, nivel que el propio UNGSC confirma para sus dos centros. El
  modelo gemelo se puso a prueba durante la DANA del 29/10/2024: los servicios alojados en
  València conmutaron automáticamente a Brindisi sin interrupción.
estado_fuentes: [src-1, src-2, src-3, src-4]

incertidumbres:
  - campo: potencia
    descripcion: >-
      No se publica potencia eléctrica ni superficie de sala. La ficha del Observatorio no
      asigna MW, y la comunicación del propio UNGSC solo publica una magnitud energética:
      que en 2025 los sistemas fotovoltaicos «de los dos emplazamientos» generaron unos
      2,26 GWh y evitaron unas 541 toneladas de CO2. La cifra es conjunta de Brindisi y
      València y no se reparte entre ambas, así que no se registra como generación asociada
      a este emplazamiento.
    fuentes: [src-2, src-4]
  - campo: ubicacion
    descripcion: >-
      La página general de bases de UNGSC sitúa la instalación en «Valencia» sin más
      precisión, pero la página específica de la base publica la dirección postal completa
      en Quart de Poblet, que coincide con el término municipal que asigna el directorio del
      Observatorio Español de Data Centers. Las coordenadas siguen siendo de nivel
      municipal: no se ha localizado la posición exacta del edificio de datos dentro del
      recinto.
    fuentes: [src-1, src-2]

confianza: media
ultima_verificacion: "2026-08-31"

fuentes:
  - id: src-1
    url: "https://www.ungsc.org/our-bases"
    titulo: "United Nations Global Service Centre | Our Bases"
    editor: "United Nations Global Service Centre"
    tipo: oficial
    fecha_consulta: "2026-08-29"
    cita: "The Base in Valencia, formally known as the United Nations Information Communication Technology Facility, UNICTF, also serves as UNGSC Brindisi's twin technology centre, an arrangement that guarantees business continuity and disaster recovery for the UN's digital technology services."
  - id: src-2
    url: "https://observatorioedc.com/directorio/"
    titulo: "Data Centers — Directorio, Observatorio Español de Data Centers"
    editor: "Observatorio Español de Data Centers"
