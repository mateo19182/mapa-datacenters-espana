  - id: src-3
    url: "https://www.ungsc.org/valencia"
    titulo: "UNGSC Base in Valencia"
    editor: "United Nations Global Service Centre"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: "Welcome to the UNGSC Base in Valencia! The Base is located at Avinguda Comarques del País Valencià, 2, 46930 Quart de Poblet, Valencia [...] The UNGSC Base in Valencia, formally known as the United Nations Information and Communications Technology Facility (UNICTF) is located in the Service Area of the Valencia Airport"
  - id: src-4
    url: "https://www.ungsc.org/news/twin-data-centres-how-ungsc-safeguards-continuity-critical-digital-services"
    titulo: "Twin Data Centres: How UNGSC Safeguards Continuity of Critical Digital Services"
    editor: "United Nations Global Service Centre"
    tipo: oficial
    fecha_publicacion: "2026-04-30"
    fecha_consulta: "2026-08-31"
    cita: "During this event, that design was tested in real conditions. Services were automatically and seamlessly failed over from Valencia to Brindisi. [...] The data centres are certified as Tier III, which means the facilities are designed so that planned maintenance can be carried out without shutting down services (\"concurrently maintainable\"). [...] In 2025, the photovoltaic systems at the two sites generated approximately 2.26 gigawatt-hours of clean electricity, avoiding around 541 metric tons of carbon dioxide emissions."
