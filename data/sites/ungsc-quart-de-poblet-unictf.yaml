id: ungsc-quart-de-poblet-unictf
nombre: "United Nations Global Service Centre — Base de Valencia (UNICTF), Quart de Poblet"
alias:
  - "UNICTF"
  - "United Nations Information Communication Technology Facility"
  - "Base de Apoyo de Naciones Unidas en Quart de Poblet"
tipo: edificio
operador: "United Nations Global Service Centre"
propietario: "Naciones Unidas"
modelo: corporativo

ubicacion:
  municipio: "Quart de Poblet"
  provincia: "Valencia"
  ccaa: "Comunitat Valenciana"
  lat: 39.4827
  lon: -0.4439
  precision: municipio
  fuentes: [src-2]

estado: operativo
estado_detalle: >-
  Instalación de tecnologías de la información y comunicaciones de Naciones Unidas que
  actúa como centro tecnológico gemelo de la base de Brindisi, garantizando continuidad de
  negocio y recuperación ante desastres de los servicios digitales de la ONU. El directorio
  del Observatorio Español de Data Centers lo clasifica como público/on-premise con
  certificación Tier III.
estado_fuentes: [src-1, src-2]

incertidumbres:
  - campo: potencia
    descripcion: >-
      No se publica potencia eléctrica ni superficie de sala. La ficha del Observatorio no
      asigna MW.
    fuentes: [src-2]
  - campo: ubicacion
    descripcion: >-
      La web oficial de UNGSC sitúa la base en «Valencia» sin más precisión; el término
      municipal exacto (Quart de Poblet) procede del directorio del Observatorio Español de
      Data Centers.
    fuentes: [src-1, src-2]

confianza: baja
ultima_verificacion: "2026-08-29"

