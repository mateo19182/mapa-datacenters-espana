refrigeracion: "Refrigeración N+1 con enfriadoras Carrier y expansión directa; sin evaporación ni adiabática."

agua:
  circuito: sin_agua
  sistema: >-
    Refrigeración N+1 con enfriadoras Carrier y expansión directa. El operador declara en su
    tabla de datos públicos que el uso de agua para refrigeración es «sin evaporación ni
    adiabática».
  origen: null
  consumo_m3_ano: null
  wue_l_kwh: null
  nota: >-
    La fuente no dice literalmente «consumo cero», sino que descarta los dos usos evaporativos
    que consumen agua. Se clasifica como sin_agua por eso, y no por una cifra medida.
  fuentes: [src-2]

