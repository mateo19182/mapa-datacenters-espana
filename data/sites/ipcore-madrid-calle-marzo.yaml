      un nombre comercial nuevo, «MAD-NE», de modo que el estado pasa a operativo.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      El operador no publica la capacidad eléctrica del edificio, solo la potencia contratable
      por armario, de 1 a 5 kW. Los 2 MW registrados vienen de un directorio sectorial y no
      indican si son carga TI o potencia total.
