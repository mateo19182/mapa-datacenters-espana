estado: desconocido
estado_detalle: >-
  Dos registros de la Asociación ESpanix en PeeringDB con dirección en Gran Vía de Hortaleza,
  «Cantabria» y «Magdalena». Ambos nombres corresponden a dos de los tres edificios del Campus
  Acciona Mesena (Magdalena, Cantabria y Pedreña), el antiguo complejo de Banesto y luego del
  Banco Santander, que es el mismo recinto en el que está el centro de datos de ESpanix de Calle
  Mesena 80. Todo apunta a que no son emplazamientos distintos sino la otra entrada del mismo
  recinto; véase `incertidumbres`. Ninguna fuente indica estado operativo propio, así que se deja
  como desconocido.
estado_fuentes: [src-1, src-2, src-3, src-4, src-5]

potencia: []

