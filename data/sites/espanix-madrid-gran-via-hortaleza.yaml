incertidumbres:
  - campo: propietario
    descripcion: >-
      Las instalaciones están registradas a nombre de la Asociación ESpanix en PeeringDB, pero no
      se ha podido determinar quién es el propietario del inmueble ni si se trata de centrales de
      un operador de telecomunicaciones que aloja nodos del punto neutro.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: "Sin datos de potencia ni superficie."
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      La ficha técnica de ESpanix describe un único centro de datos, en la calle Mesena 80, con
      «doble acceso desde la Calle Mesena y desde la Gran Vía de Hortaleza». Cabe por tanto que
      los registros «Cantabria» y «Magdalena» de PeeringDB sean el mismo edificio visto desde su
      otra entrada, y no dos emplazamientos independientes. Ninguna fuente lo confirma ni lo
      desmiente, así que el fichero se mantiene, marcado como no resuelto, en vez de fusionarlo
      con el de Mesena.
    fuentes: [src-1, src-2, src-3]

