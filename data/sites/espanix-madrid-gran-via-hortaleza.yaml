  - nombre: "Cantabria Datacenter — Gran Vía de Hortaleza 1"
    estado: desconocido
    fuentes: [src-1]
  - nombre: "Magdalena Datacenter — Gran Vía de Hortaleza 3"
    estado: desconocido
    fuentes: [src-2]

incertidumbres:
  - campo: propietario
    descripcion: >-
      Las instalaciones están registradas a nombre de la Asociación ESpanix en PeeringDB, pero no
      se ha podido determinar quién es el propietario del inmueble ni si se trata de centrales de
      un operador de telecomunicaciones que aloja nodos del punto neutro.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: "Sin datos de potencia ni superficie."
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      Duplicado con `espanix-madrid-mesena`: la documentación reunida el 31 de agosto de 2026
      indica que este fichero y el de Mesena describen el mismo emplazamiento, y que deberían ser
      uno solo. Cuatro pruebas concurrentes: (1) la propia PeeringDB agrupa los tres registros de
      la Asociación ESpanix —fac/121 «Espanix Datacenter» en Mesena 80, fac/15526 «Magdalena
      Datacenter» y fac/15527 «Cantabria Datacenter»— dentro de un único objeto de campus, el
      campus/93 «Acciona Campus»; (2) «Magdalena» y «Cantabria» son dos de los tres edificios del
      Campus Acciona Mesena —Magdalena, Cantabria y Pedreña—, un complejo único de 104.000 m² que
      recupera la antigua sede de Banesto y después del Banco Santander, con frente a la calle
      Mesena y a la Gran Vía de Hortaleza; (3) ESpanix describe su centro como un edificio dentro
      de ese campus y precisa que «el campus tiene dos entradas por dos calles que lindan con el
      recinto y cuenta con un túnel de 400 m que acerca las fibras al centro de datos», que es el
      «doble acceso desde la Calle Mesena y desde la Gran Vía de Hortaleza» de su ficha técnica;
      (4) la página de acceso de ESpanix, que enumera todos los centros donde puede conectarse su
      nodo, lista un solo centro propio, «ESpanix Datacenter, C/Mesena 80», y ninguno en Gran Vía
      de Hortaleza. El Catastro lo respalda: Mesena 80 (4200068VK4840A, «PARC III APE 16.01»),
      Gran Vía de Hortaleza 3 (4200079VK4840A «PARC IV APE16.01» y 4200080VK4840A «PARC V
      APE16.01») y Gran Vía de Hortaleza 1 (4200081VK4749G) son parcelas contiguas de la misma
      manzana catastral 42000 y de la misma unidad de planeamiento APE 16.01. Los tres puntos de
      PeeringDB distan entre sí menos de 340 m. No se fusiona ni se borra ningún fichero por
      decisión propia: la fusión queda propuesta y pendiente de decisión humana.
    fuentes: [src-1, src-2, src-3, src-4, src-5, src-6, src-7, src-8]

confianza: baja
