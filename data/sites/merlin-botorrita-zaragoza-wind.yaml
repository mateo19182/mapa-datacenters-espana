incertidumbres:
  - campo: operador
    descripcion: >-
      Los 227,4 MW de este campus son los permisos de acceso y conexión que el Acuerdo de 12
      de noviembre de 2025 había atribuido a los centros "DCM Dédalo" (81 MW en María 220 kV)
      y "DCM Blue" (146,5 MW en Los Vientos 220 kV) del proyecto "Búfalo" de Forestalia:
      MERLIN los compró a finales de febrero de 2026 y ha refundido los dos en un único
      campus en Botorrita. Ni el Acuerdo de 22 de julio de 2026 ni ninguna otra disposición
      posterior del BOA mencionan a Forestalia, "Búfalo", "DCM Dédalo" o "DCM Blue", ni
      publican la transmisión de titularidad de los permisos: la operación consta por el
      relato coincidente de la prensa económica aragonesa y por las declaraciones del propio
      consejero delegado de MERLIN, Ismael Clemente, en la presentación oficial del proyecto
      junto al presidente de Aragón. Consecuencia para este conjunto de datos: estos 227,4 MW
      y los 227,5 MW que siguen figurando en las fichas de "DCM Dédalo" y "DCM Blue" son la
      misma capacidad de red y no deben sumarse.
    fuentes: [src-4, src-6, src-7, src-8, src-9, src-10]
  - campo: potencia
    descripcion: >-
      No consta ningún acto administrativo que documente el cambio de titularidad de los
      permisos de acceso. Ni el BOA ni la CNMV publican la transmisión: MERLIN no ha
      comunicado la compra como hecho relevante y su Capital Markets Day de 10 de marzo de
      2026, cuatro días antes de que la operación se conociera por la prensa, ya incorporaba
      un "Zaragoza campus" de 150 MW IT (ZGZ-WIND 01 y 02) con el suministro eléctrico
      marcado como "Granted", pero sin nombrar el origen de esa capacidad. Para cerrar el
      punto haría falta la resolución de cambio de titular del permiso de acceso y conexión
      de Red Eléctrica en los nudos María 220 kV y Los Vientos 220 kV, o la escritura de la
      compraventa de las sociedades "Dédalo Holdco Renovables, S.L." y "Blue Holdco
      Renovables, S.L.".
    fuentes: [src-4, src-6, src-11]
  - campo: conexion_electrica
    descripcion: >-
      El Acuerdo de 22 de julio de 2026 escribe 146,4 MW para el permiso de demanda de Los
      Vientos 220 kV, mientras que el Acuerdo de 12 de noviembre de 2025 del proyecto
      "Búfalo" escribe 146,5 MW para el mismo nudo. Al tratarse del mismo permiso, la
      diferencia de 0,1 MW es una discrepancia entre las dos resoluciones, no dos permisos
      distintos. Se conservan ambas cifras en sus respectivas fichas.
    fuentes: [src-3, src-4]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas registradas son el centroide municipal de Botorrita (Wikidata).
    fuentes: [src-2]

