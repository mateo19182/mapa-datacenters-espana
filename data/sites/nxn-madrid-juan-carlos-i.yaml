estado_detalle: NxN anunció el 23 de abril de 2026 un activo existente cerca del Parque Juan Carlos
  I, de 8.500 m², con 20 millones de euros de modernización y apertura prevista en septiembre. El 17
  de octubre su web todavía combina "próxima inauguración" con lenguaje de centro operativo.
  Colliers lo da por abierto con 5 MW IT; no se ha recuperado confirmación inequívoca del operador.
  Se mantienen separados los 7,5 y 15 MW sin tipo del anuncio y sus acometidas redundantes 2N.
