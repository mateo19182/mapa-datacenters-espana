incertidumbres:
  - campo: potencia
    descripcion: La nota del 23 de abril se contradice entre 7,5 MW en su primera página y 15 MW en la
      segunda. Sus dos acometidas de 7,5 MW son redundantes 2N, no capacidad sumable. Ninguna cifra
      está tipificada como carga IT.
    fuentes:
      - src-nota
      - src-web
  - campo: ubicacion
    descripcion: No se publican calle, parcela ni coordenadas. Se conoce el entorno del Parque Juan
      Carlos I. No se identifica con otro CPD ya fichado por mera proximidad o por sus 8.500 m²; el
      propietario y el antiguo operador del activo quedan sin confirmar.
    fuentes:
      - src-nota
  - campo: estado
    descripcion: Septiembre de 2026 era una previsión de entrada en operación; la web aún anuncia
      próxima inauguración en 2026. No se interpreta que haya abierto por haber pasado la fecha ni
      por emplear lenguaje comercial de presente.
    fuentes:
      - src-nota
      - src-web
  - campo: superficie_construida_m2
    descripcion: NxN publica 8.500 m² de superficie total, sin precisar parcela, superficie construida o
      sala IT. Se conserva en el texto y no se rellena uno de esos campos por analogía.
    fuentes:
      - src-nota
  - campo: estado
    descripcion: Colliers atribuye a NxN 5 MW IT en funcionamiento. La web del operador mantiene
      "Próxima inauguración en 2026" y "Será el primer centro", junto a frases en presente. Falta
      confirmación fechada y dirección del activo; no se convierte la previsión vencida en apertura.
    fuentes:
      - src-colliers-20261008
      - src-nota
      - src-web
