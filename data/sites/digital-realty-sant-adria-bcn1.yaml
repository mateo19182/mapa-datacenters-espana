id: digital-realty-sant-adria-bcn1
nombre: "Digital Realty BCN1 — Sant Adrià de Besòs"
alias:
  - "Interxion BCN1"
  - "Digital Realty Barcelona BCN1"
tipo: edificio
operador: "Digital Realty"
propietario: "Digital Realty"
modelo: colocation

ubicacion:
  municipio: "Sant Adrià de Besòs"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Carrer d'Ifni, 26, 08930 Sant Adrià de Besòs (antigua fábrica de Henkel, junto a las Tres Xemeneies)"
  lat: 41.4293991
  lon: 2.2313856
  precision: exacta
  fuentes: [src-1, src-3]

estado: operativo
estado_detalle: >-
  Primer centro de datos de Digital Realty en Barcelona. Construcción iniciada en
  2023 sobre suelo previamente descontaminado de la antigua fábrica de Henkel.
  Apertura anunciada por la compañía el 18 de mayo de 2026. Conectado a la
  Barcelona Cable Landing Station de Sant Adrià.
estado_fuentes: [src-1, src-2]
fecha_puesta_en_servicio: "2026-05"

potencia:
  - tipo: no_especificado
    valor_mw: 14
    ambito: edificio
    referencia: "Capacidad total planificada del edificio BCN1"
    estado_asociado: operativo
    fecha_dato: "2026-05-18"
    fuentes: [src-2]
    nota: >-
      Las fuentes hablan de "14 MW of total planned capacity" / "una capacidad de
      14 MW" sin precisar si son MW TI o potencia instalada.
  - tipo: no_especificado
    valor_mw: 20
    ambito: edificio
    referencia: "Potencia tras una segunda fase de ampliación"
    estado_asociado: anunciado
    fecha_dato: "2025-09-24"
    fuentes: [src-1]
    nota: "La fuente dice '14 MW de potencia eléctrica, ampliable a 20 MW en una segunda fase'."

fases:
  - nombre: "Fase 1"
    estado: operativo
    fecha_puesta_en_servicio: "2026-05"
    fuentes: [src-2]
  - nombre: "Fase 2 (ampliación a 20 MW)"
    estado: anunciado
    fuentes: [src-1]

refrigeracion: >-
  La compañía declara consumo cero de agua y energía 100% renovable; los grupos
  electrógenos de respaldo funcionan con biodiésel HVO100.
enlaces_proyecto: []

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      La prensa local sitúa el edificio en "calle d'Ifni, 26"; el directorio
      Baxtel da "Av. del Maresme, 43", ambos en Sant Adrià de Besòs. Podrían ser
      dos frentes de la misma parcela. Se toman las coordenadas de la dirección
      de Ifni 26.
    fuentes: [src-1, src-4]
  - campo: potencia
    descripcion: >-
      Ninguna de las fuentes localizadas especifica si los 14 MW son carga TI,
      potencia de conexión o potencia instalada. No se ha localizado la
      autorización administrativa de la instalación eléctrica.
    fuentes: [src-1, src-2]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      En septiembre de 2025 la prensa local anunciaba apertura operativa "a
      finales de marzo de 2026"; la compañía comunicó la apertura el 18 de mayo
      de 2026.
    fuentes: [src-1, src-2]

confianza: alta
ultima_verificacion: "2026-08-29"

