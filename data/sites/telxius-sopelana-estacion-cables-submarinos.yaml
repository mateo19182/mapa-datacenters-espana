id: telxius-sopelana-estacion-cables-submarinos
nombre: "Estación de amarre de cables submarinos de Sopelana — Telxius"
alias:
  - "Sopelana Cable Landing Station"
  - "Estación de Sopelana"
tipo: edificio
operador: "Telxius (Grupo Telefónica)"
propietario: "Telxius Telecom"
modelo: corporativo

ubicacion:
  municipio: "Sopelana"
  provincia: "Bizkaia"
  ccaa: "País Vasco"
  lat: 43.3800
  lon: -2.9900
  precision: municipio
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Estación de amarre de cables submarinos transatlánticos próxima a Bilbao. El
  cable Grace Hopper de Google amarró aquí el 9 de septiembre de 2021; es el primer
  cable financiado por Google que llega a España y une Estados Unidos, Reino Unido
  y España con 16 pares de fibra. Desde Sopelana el tráfico se encamina al Derio
  Communications Hub de Telxius. Es también el punto de amarre del cable Marea: la
  propia Telxius describe su centro de datos de Derio como «very close to the Marea
  landing station in Sopelana». No es un centro de datos de colocación: es
  infraestructura de aterraje.
estado_fuentes: [src-1, src-2, src-3, src-4]

enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta potencia eléctrica de la estación en ninguna fuente consultada,
      incluida la página de centros de datos de Telxius, que solo publica cifras para
      Derio y Virginia Beach. Campo omitido.
    fuentes: [src-1, src-2, src-4]
  - campo: tipo
    descripcion: >-
      Inclusión discutible en un inventario de CPD: es estación de aterraje de cable
      submarino. Se incluye porque los proyectos de centros de datos de Álava y
      Bizkaia justifican su ubicación por la baja latencia con Norteamérica que
      proporcionan estos amarres.
    fuentes: [src-2, src-3]
  - campo: ubicacion
    descripcion: >-
      Telxius no publica dirección ni parcela de la estación. Coordenadas de municipio.
    fuentes: [src-1]

