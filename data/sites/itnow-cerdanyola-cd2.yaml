      es la inversión de 100 millones de euros anunciada en 2014.
    fuentes: [src-1, src-3]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 100 millones son la inversión anunciada en abril de 2014 para el
      segundo CPD; la misma fuente cifra en 200 millones la inversión acumulada
      del grupo en todo el complejo de Cerdanyola, que incluye el CD1. No se
      suman ni se confunden.
    fuentes: [src-3]
  - campo: ubicacion
    descripcion: >-
      Baxtel indica "Camí Ral, Barcelona" sin municipio; la calle corresponde al
      Centre Direccional de Cerdanyola del Vallès. Coordenadas de vial, no de
      número. La ficha de T-Systems Cerdanyola apunta a la misma calle, sin que
      se haya podido descartar que se trate de edificios contiguos distintos.
    fuentes: [src-1, src-2]

