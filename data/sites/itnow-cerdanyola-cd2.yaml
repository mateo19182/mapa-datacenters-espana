estado_detalle: >-
  Segundo centro de proceso de datos de ITnow, sociedad constituida en enero de
  2012 y rebautizada como ITnow en mayo del mismo año, que presta servicios de
  infraestructura a CaixaBank y otras sociedades del grupo 'la Caixa'. CaixaBank
  anunció en abril de 2014 una inversión de 100 millones de euros para construir
  un segundo CPD junto al sincrotrón Alba, al que trasladaría su copia de
  respaldo desde las instalaciones de HP en Sant Cugat, elevando a 200 millones
  la inversión total del grupo en el complejo de Cerdanyola. Un reportaje
  sectorial de 2025 cuenta dos CPD de Silc Inmuebles —la sociedad patrimonial de
  CaixaBank— entre los cuatro en operación del Parc de l'Alba.
