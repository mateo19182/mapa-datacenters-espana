estado_detalle: >-
  Segundo centro de datos del grupo malagueño DataRush, inaugurado el 25 de junio de 2024 e
  interconectado con el primero, situado a algo más de un kilómetro. Su apertura coincidió con
  la constitución de la marca Grupo DataRush. Presta servicios de seguridad, almacenamiento,
  alojamiento de servidores, hosting y copia de seguridad.
