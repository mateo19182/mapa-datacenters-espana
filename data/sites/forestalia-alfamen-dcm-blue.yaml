incertidumbres:
  - campo: potencia
    descripcion: >-
      El acuerdo mezcla la potencia concedida en el punto de conexión con la expresión
      "demanda IT", y a la vez fija un objetivo final de 450 MW IT muy superior. Se
      registran ambos valores sin sumarlos.
    fuentes: [src-1]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La tabla del Acuerdo titula la cifra "Inversión Capex DCM Blue" dentro de un
      apartado que describe la inversión de los tres centros de datos "con sus proyectos
      energéticos asociados", de modo que no consta qué parte corresponde al centro de datos
      y qué parte a la generación renovable vinculada.
    fuentes: [src-3]
  - campo: estado
    descripcion: >-
      Este centro de datos ya no lo promueve Forestalia. A finales de febrero de 2026,
      Forestalia vendió a MERLIN Properties los derechos de acceso y conexión de dos de los
      tres nudos del proyecto "Búfalo" —Los Vientos 220 kV, en Muel, y María 220 kV, en
      María de Huerva: 227 MW de los 300 MW iniciales—, y MERLIN los ha refundido en un solo
      campus, «Zaragoza-WIND», en Botorrita. El permiso de 146,5 MW en Los Vientos 220 kV
      que esta ficha registra es el mismo que el Acuerdo de 22 de julio de 2026 atribuye ya
      a MERLIN (que lo escribe 146,4 MW): no son dos permisos, y las dos potencias no deben
      sumarse en ningún agregado. El emplazamiento tampoco se mantiene en Alfamén: MERLIN
      lleva esa capacidad a su campus de Botorrita. Forestalia conserva la generación
      renovable asociada y suministrará la electricidad al campus.
    fuentes: [src-1, src-5, src-6, src-7, src-8, src-9, src-10]
  - campo: operador
    descripcion: >-
      No consta ningún acto administrativo que documente el cambio de titularidad. El
      Acuerdo de 12 de noviembre de 2025 que declara «DCM Blue» sigue publicado y no se ha
      encontrado en el BOA ninguna disposición posterior que lo revoque, lo modifique o
      registre la transmisión de los permisos; recíprocamente, el Acuerdo de 22 de julio de
      2026 sobre «Zaragoza-WIND» no menciona a Forestalia ni al proyecto "Búfalo". Tampoco
      hay comunicación a la CNMV de la operación. Para cerrar el punto haría falta la
      resolución de cambio de titular del permiso de acceso y conexión de Red Eléctrica en
      el nudo Los Vientos 220 kV, o la escritura de compraventa de la sociedad promotora
      "Blue Holdco Renovables, S.L.".
    fuentes: [src-1, src-5, src-6, src-11]
  - campo: ubicacion
    descripcion: >-
      No se publican coordenadas ni referencias catastrales; solo la proximidad al nudo
      «Los Vientos 220 kV». Las coordenadas registradas son el centroide municipal (Wikidata).
    fuentes: [src-1, src-2]

