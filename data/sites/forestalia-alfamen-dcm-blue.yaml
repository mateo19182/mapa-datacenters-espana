estado: cancelado
estado_detalle: >-
  Proyecto superado por la venta de sus derechos de acceso. A finales de febrero de 2026
  Forestalia vendió a MERLIN Properties los permisos de acceso y conexión de «Los Vientos 220 kV»
  y de la otra posición del proyecto «Búfalo», 227 MW de los 300 iniciales, y MERLIN los ha
  refundido en un único campus en Botorrita. El consejero delegado de MERLIN lo confirmó en
  público el 22 de julio de 2026, junto al presidente de Aragón, y añadió que Forestalia
  seguirá encargándose de la generación renovable asociada. De los tres centros de «Búfalo»
  solo DCM Data, en Magallón, sigue en manos de Forestalia.
  Alfamén se queda sin proyecto: MERLIN se lleva la capacidad de «Los Vientos» a su campus
  de Botorrita, a unos veinte kilómetros.
  Se marca cancelado, y no paralizado, porque su capacidad ya está registrada en la ficha
  «merlin-botorrita-zaragoza-wind»: mantenerlo activo haría que el conjunto contase dos veces
  los mismos megavatios. Las cifras publicadas en su día se conservan abajo como lectura
  histórica y no se suman a ningún agregado.
  Ninguna resolución administrativa recoge la transmisión: no hay acto en el BOA que revoque
  o transmita los permisos, ni resolución de cambio de titular de Red Eléctrica publicada, ni
  comunicación de la compra a la CNMV. El hecho está sostenido por la nota de la propia
  MERLIN, las declaraciones grabadas de su consejero delegado y cuatro medios independientes.
