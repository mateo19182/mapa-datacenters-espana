id: forestalia-botorrita-dcm-dedalo
nombre: "Forestalia — Centro de datos «DCM Dédalo» (Botorrita), proyecto Búfalo"
alias:
  - "DCM Dédalo"
  - "Proyecto Búfalo"
tipo: campus
operador: "Grupo Forestalia"
propietario: "Dédalo Holdco Renovables, S.L."
modelo: desconocido

ubicacion:
  municipio: "Botorrita"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Emplazamiento próximo a la subestación «María 220 kV» de Red Eléctrica de España"
  lat: 41.506728
  lon: -1.030107
  precision: municipio
  fuentes: [src-1, src-2]

estado: anunciado
estado_detalle: >-
  Uno de los tres centros de datos del proyecto "Búfalo", declarado por el Gobierno de
  Aragón el 12 de noviembre de 2025 como inversión de interés autonómico y como proyecto
  prioritario con generación renovable asociada al amparo de la Ley 5/2024 de fomento de
  comunidades energéticas y autoconsumo industrial en Aragón. El suministro procede de la
  red de transporte en la posición de «María 220 kV», asociado a instalaciones de generación
  renovable del grupo que cambian su régimen de acceso a autoconsumo con excedentes. La
  fase 1 está prevista para el primer semestre de 2028.
estado_fuentes: [src-1]

potencia:
  - tipo: conexion_red
    valor_mw: 81
    ambito: campus
    referencia: "Potencia para el suministro de energía desde la red de transporte concedida por REE en el nudo María 220 kV"
    estado_asociado: anunciado
    fecha_dato: "2025-11-12"
    fuentes: [src-1]
    nota: >-
      El acuerdo describe la suma de las tres potencias (70 + 81 + 146,5 = 297,5 MW) como
      "demanda IT suministrada por la red de transporte", pero se trata de la potencia
      concedida por REE en el punto de conexión.
  - tipo: it
    valor_mw: 275
    ambito: campus
    referencia: "Consumo eléctrico final previsto con escalabilidad"
    estado_asociado: anunciado
    fecha_dato: "2025-11-12"
    fuentes: [src-1]
    nota: >-
      "se plantea una situación final de consumo eléctrico para los tres centros de datos
      con una escalabilidad hasta 275 MW IT para el \"DCM Dédalo\"". Requiere sobredimensionar
      la generación renovable asociada.

fases:
  - nombre: "Fase 1"
    estado: anunciado
    fecha_puesta_en_servicio: "2028"
    fuentes: [src-1]
    nota: >-
      Urbanización y construcción del centro de datos, con demanda garantizada por la red de
      transporte y 81 MW de generación renovable eólica y fotovoltaica asociada en
      régimen de autoconsumo con excedentes.
  - nombre: "Fase 2"
    estado: anunciado
    fecha_puesta_en_servicio: "2029"
    fuentes: [src-1]
    nota: "Ampliación de la generación renovable asociada e integración de almacenamiento."

conexion_electrica:
  subestacion: "SE María 220 kV (Red Eléctrica de España)"
  tension_kv: 220
  titular_red: "Red Eléctrica de España"
  mw_solicitados: null
  mw_concedidos: 81
  fuentes: [src-1]
  nota: >-
    La instalación de generación renovable asociada tiene 164.80 MW de acceso y conexión en
    REE y 179.60 MW instalados. Conforme al artículo 6.9 del Real Decreto 1183/2020, el
    centro de datos puede obtener hasta el 50 % de la capacidad de acceso de la instalación
    de generación a la que se asocia, por lo que no puede conectarse sin ella.

inversion_anunciada_eur: null
enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      El acuerdo mezcla la potencia concedida en el punto de conexión con la expresión
      "demanda IT", y a la vez fija un objetivo final de 275 MW IT muy superior. Se
      registran ambos valores sin sumarlos.
    fuentes: [src-1]
  - campo: ubicacion
    descripcion: >-
      No se publican coordenadas ni referencias catastrales; solo la proximidad al nudo
      «María 220 kV». Las coordenadas registradas son el centroide municipal (Wikidata).
    fuentes: [src-1, src-2]

