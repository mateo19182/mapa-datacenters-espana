id: meta-talavera-de-la-reina-torrehierro
nombre: "Meta Data Center Campus — Talavera de la Reina (Torrehierro Fase 2)"
alias:
  - "Meta Data Center Campus"
  - "Centro de datos de Meta en Talavera"
  - "Zarza Networks (Torrehierro Fase 2)"
tipo: campus
operador: "Meta Platforms"
propietario: "Zarza Networks, S.L."
cliente_ancla: "Meta Platforms"
modelo: hyperscale

ubicacion:
  municipio: "Talavera de la Reina"
  provincia: "Toledo"
  ccaa: "Castilla-La Mancha"
  direccion: "Ámbito Torrehierro Fase 2, polígono industrial de Torrehierro"
  lat: 39.9584244
  lon: -4.933666
  precision: aproximada
  fuentes: [src-psi, src-osm]

estado: permisos_concedidos
estado_detalle: >-
  Proyecto de Singular Interés aprobado definitivamente el 22 de octubre de 2024,
  con declaración de impacto ambiental de 22 de marzo de 2024. El 21 de agosto de
  2026 el DOCM publicó la aprobación definitiva de la reparcelación urbanística y
  el 26 de agosto de 2026 la Junta otorgó la autorización definitiva, de modo que
  Meta ya puede presentar los proyectos constructivos y pedir licencia de obra al
  Ayuntamiento. Las obras no han comenzado a 29 de agosto de 2026.
estado_fuentes: [src-psi, src-eldiario-2026, src-elespanol-repar]

potencia:
  - tipo: no_especificado
    valor_mw: 248
    ambito: campus
    referencia: "Potencia instalada del campus según ficha divulgativa local"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026"
    fuentes: [src-talaveravalley]
    nota: >-
      La ficha dice "Potencia instalada: 248 MW" sin precisar si es carga TI,
      potencia de conexión o potencia instalada del conjunto. No se ha localizado
      ninguna fuente oficial ni de la compañía que confirme esta cifra.

fases:
  - nombre: "Declaración de Interés Regional (DIR)"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2022-06-20"
    nota: "Hito administrativo, no puesta en servicio."
    fuentes: [src-psi]
  - nombre: "Aprobación inicial del PSI e información pública"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2023-03-31"
    nota: "Hito administrativo, no puesta en servicio."
    fuentes: [src-psi]
  - nombre: "Declaración de Impacto Ambiental"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2024-03-22"
    nota: "Publicada en el DOCM; hito administrativo."
    fuentes: [src-psi, src-dia]
  - nombre: "Aprobación definitiva del PSI"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2024-10-22"
    nota: "Hito administrativo."
    fuentes: [src-psi]
  - nombre: "Reparcelación urbanística definitiva"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2026-08"
    nota: >-
      Publicada en el DOCM el 21 de agosto de 2026; autorización definitiva de la
      Junta el 26 de agosto de 2026. Zarza Networks debía constituir una garantía
      de 1.089.554 euros en diez días.
    fuentes: [src-elespanol-repar, src-eldiario-2026]
  - nombre: "Construcción por fases del campus"
    estado: anunciado
    nota: >-
      La nota de la DIA habla de unas obras de diez años que darían comienzo en
      los doce meses siguientes a la conclusión de los procesos administrativos.
      Una ficha divulgativa local sitúa el inicio en 2027 y la plena capacidad en
      2036.
    fuentes: [src-dia, src-talaveravalley]

conexion_electrica:
  subestacion: "SE Calera y Chozas 220 kV"
  tension_kv: 220
  titular_red: "Red Eléctrica (Redeia)"
  nota: >-
    El informe ambiental prevé una doble línea eléctrica de alta tensión que
    unirá el ámbito con la subestación proyectada en Calera y Chozas. La
    subestación de 220 kV de Redeia era "ya una realidad" en julio de 2025 y se
    presenta como esencial tanto para el centro de datos de Meta como para la
    futura línea de alta velocidad. No consta la potencia de acceso solicitada
    ni concedida.
  fuentes: [src-cmm, src-lovetalavera]

superficie_parcela_m2: 1910000
inversion_anunciada_eur: 750000000
refrigeracion: >-
  Sistema de refrigeración por aire seco. Las cifras de consumo de agua se han
  revisado a la baja varias veces: de 2,2-2,9 hm3/año iniciales a 504.500 m3/año
  en el informe ambiental y a 0,2 hm3/año (unos 200 millones de litros) en la
  documentación de 2026, con abastecimiento desde el Tajo por la red municipal.
enlaces_proyecto:
  - "https://urbanismo.castillalamancha.es/planeamiento/planeamiento-territorial/proyectos-de-singular-interes/meta-data-center-campus"

incertidumbres:
  - campo: potencia
    descripcion: >-
      No existe cifra de potencia en fuentes oficiales ni de la compañía. La
      única cifra localizada, 248 MW de "potencia instalada", procede de una
      ficha divulgativa de una asociación empresarial local y no distingue el
      tipo de MW.
    fuentes: [src-talaveravalley]
  - campo: refrigeracion
    descripcion: >-
      Las cifras de consumo de agua difieren radicalmente entre versiones del
      proyecto: 4.800 millones de litros al año en una ficha divulgativa; entre
      2,2 y 2,9 millones de metros cúbicos anuales como consumo "inicialmente
      previsto" según el informe ambiental; 504.500 m3/año en ese mismo informe;
      y 0,2 hectómetros cúbicos anuales (unos 200 millones de litros) en la
      documentación de 2026. Se conservan todas.
    fuentes: [src-talaveravalley, src-cmm, src-elespanol-ruido, src-xataka]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La Junta cifró la inversión en 750 millones de euros (685 millones para la
      construcción del centro de datos). El informe ambiental recogido por CMM
      habla de "más de mil millones de euros" y la prensa de agosto de 2026 dice
      que puede superar los 1.000 millones según el desarrollo definitivo.
    fuentes: [src-dia, src-cmm, src-eldiario-2026]
  - campo: ubicacion
    descripcion: >-
      Las fuentes describen el emplazamiento de forma incoherente: una ficha
      local lo sitúa "a 12 kilómetros al oeste del núcleo urbano" y la prensa de
      agosto de 2026 lo sitúa "a 400 metros del núcleo urbano de Gamonal". Las
      coordenadas usadas son el centroide del polígono industrial de Torrehierro
      en OpenStreetMap, no la parcela concreta.
    fuentes: [src-talaveravalley, src-elespanol-ruido, src-osm]
  - campo: superficie_parcela_m2
    descripcion: >-
      Conviven dos superficies: un ámbito global de 191 hectáreas y unas 102
      hectáreas para el núcleo principal de centros de datos, más un parque
      fluvial público de entre 50 y 60 hectáreas. Se registra el ámbito global.
    fuentes: [src-dia, src-eldiario-2026, src-elespanol-repar]

