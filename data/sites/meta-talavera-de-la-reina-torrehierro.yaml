id: meta-talavera-de-la-reina-torrehierro
nombre: "Meta Data Center Campus — Talavera de la Reina (Torrehierro Fase 2)"
alias:
  - "Meta Data Center Campus"
  - "Centro de datos de Meta en Talavera"
  - "Zarza Networks (Torrehierro Fase 2)"
  - "PSI Meta Data Center Campus (expediente PRO-SC-22-1030)"
tipo: campus
operador: "Meta Platforms"
propietario: "Zarza Networks, S.L."
cliente_ancla: "Meta Platforms"
modelo: hyperscale

ubicacion:
  municipio: "Talavera de la Reina"
  provincia: "Toledo"
  ccaa: "Castilla-La Mancha"
  direccion: "Ámbito Torrehierro Fase 2, polígono industrial de Torrehierro"
  lat: 39.9584244
  lon: -4.933666
  precision: aproximada
  fuentes: [src-psi, src-osm]

estado: permisos_concedidos
estado_detalle: >-
  Proyecto de Singular Interés aprobado definitivamente el 22 de octubre de 2024,
  con declaración de impacto ambiental de 20 de marzo de 2024 publicada en el DOCM
  el 22 de marzo. El ámbito se extiende por los términos municipales de Talavera
  de la Reina y Calera y Chozas: la subestación de conexión está proyectada en la
  parcela 35 del polígono 506 de Calera y Chozas. El 21 de agosto de 2026 el DOCM
  publicó la aprobación definitiva de la reparcelación urbanística y el 26 de
  agosto de 2026 la Junta otorgó la autorización definitiva, de modo que Meta ya
  puede presentar los proyectos constructivos y pedir licencia de obra al
  Ayuntamiento. Las obras no han comenzado a 31 de agosto de 2026.
estado_fuentes: [src-psi, src-docm-dia, src-eldiario-2026, src-elespanol-repar, src-jccm-reparcelacion]

potencia:
  - tipo: conexion_red
    valor_mw: null
    valor_mva: 240
    ambito: campus
    referencia: "Demanda máxima global prevista en la subestación propia del campus"
    estado_asociado: permisos_concedidos
    fecha_dato: "2024-03-20"
    fuentes: [src-docm-dia]
    nota: >-
      La declaración de impacto ambiental describe una subestación propia con
      cuatro transformadores de 120 MVA cada uno y "una demanda máxima global
      prevista de 240 MVA". Se registra en MVA y no se convierte a MW: haría
      falta el factor de potencia, que no se publica. No es carga TI.
  - tipo: no_especificado
    valor_mw: 248
    ambito: campus
    referencia: "Potencia instalada del campus según ficha divulgativa local"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026"
    fuentes: [src-talaveravalley]
    nota: >-
      La ficha dice "Potencia instalada: 248 MW" sin precisar si es carga TI,
      potencia de conexión o potencia instalada del conjunto. No se ha localizado
      ninguna fuente oficial ni de la compañía que confirme esta cifra.
  - tipo: termica_respaldo
    valor_mw: 12.9
    ambito: campus
    referencia: "Potencia térmica nominal total de los grupos generadores de emergencia"
    estado_asociado: permisos_concedidos
    fecha_dato: "2023-09-13"
    fuentes: [src-docm-dia]
    nota: >-
      No es capacidad del centro de datos. El promotor comunicó el 13 de
      septiembre de 2023 que el rediseño rebajaba la potencia térmica de los
      grupos de los más de 50 MW iniciales a 12,9 MW, por debajo del umbral que
      habría obligado a autorización ambiental integrada. La DIA añade que los
      generadores de reserva pasaron de nueve a tres.
  - tipo: generacion_asociada
    valor_mw: 24.3
    ambito: campus
    referencia: "Planta solar fotovoltaica del ámbito del PSI — potencia nominal total"
    estado_asociado: permisos_concedidos
    fecha_dato: "2024-03-20"
    fuentes: [src-docm-dia]
    nota: >-
      Capacidad de producir, no de consumir. La DIA da 24,3 MW de potencia
      nominal total y 31,6 MW de potencia pico sobre 526.552 m2, en la fase 4 del
      calendario. Aparte, y por exigencia del Código Técnico de la Edificación,
      se prevé una fotovoltaica in situ de 1,09 MW pico junto a la subestación.

fases:
  - nombre: "Declaración de Interés Regional (DIR)"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2022-06-20"
    nota: "Hito administrativo, no puesta en servicio."
    fuentes: [src-psi]
  - nombre: "Aprobación inicial del PSI e información pública"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2023-03-31"
    nota: "Hito administrativo, no puesta en servicio."
    fuentes: [src-psi]
  - nombre: "Declaración de Impacto Ambiental"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2024-03-22"
    nota: >-
      Resolución de 20/03/2024 de la Dirección General de Calidad Ambiental,
      publicada en el DOCM el 22 de marzo de 2024. Hito administrativo.
    fuentes: [src-psi, src-dia, src-docm-dia]
  - nombre: "Aprobación definitiva del PSI"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2024-10-22"
    nota: >-
      Acuerdo del Consejo de Gobierno de 14 de octubre de 2024, publicado en el
      DOCM nº 205 de 22 de octubre. Hito administrativo.
    fuentes: [src-psi, src-jccm-psi]
  - nombre: "Información pública en materia de expropiación forzosa"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2025-12-23"
    nota: >-
      Resolución de 05/12/2025 de la Secretaría General de la Consejería de
      Fomento, publicada en el DOCM el 23 de diciembre de 2025. Hito
      administrativo.
    fuentes: [src-docm-expropiacion]
  - nombre: "Reparcelación urbanística definitiva"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2026-08"
    nota: >-
      Aprobada definitivamente por el Gobierno regional el 11 de agosto de 2026 y
      publicada en el DOCM el 21 de agosto; autorización definitiva de la Junta el
      26 de agosto de 2026. Zarza Networks debía constituir una garantía de
      1.089.554 euros en diez días.
    fuentes: [src-jccm-reparcelacion, src-elespanol-repar, src-eldiario-2026]
  - nombre: "Fase 1 de obra — subestación interior y conexión de alta tensión"
    estado: anunciado
    nota: >-
      Según la DIA, comprende la subestación eléctrica interior del centro de
      datos, la línea de alta tensión de conexión exterior (entre 18 y 22 meses de
      ejecución) y la reposición del colector unitario de Gamonal.
    fuentes: [src-docm-dia]
  - nombre: "Fase 2 de obra — edificio de centro de datos 1 (DCB 1) y edificios auxiliares"
    estado: anunciado
    nota: >-
      Edificio DCB 1 (340 x 96 m, 32.723,79 m2, una planta, 9,115 m de altura),
      edificio de administración (ADM), edificio de apoyo a operaciones (IBOS),
      caseta de vigilancia, viales, aparcamientos, paisajismo y primera fase de
      urbanización interior.
    fuentes: [src-docm-dia]
  - nombre: "Fase 3 de obra — edificio de centro de datos 2 (DCB 2)"
    estado: anunciado
    nota: >-
      Edificio DCB 2 (288 x 96 m, 27.779,77 m2, una planta, 9,115 m de altura),
      viales, aparcamientos y paisajismo del campus.
    fuentes: [src-docm-dia]
  - nombre: "Fase 4 de obra — planta solar fotovoltaica y segunda fase de urbanización"
    estado: anunciado
    nota: >-
      Un año previsto de ejecución para la planta solar. El conjunto de las obras
      se estima en unos diez años. Una ficha divulgativa local sitúa el inicio en
      2027 y la plena capacidad en 2036.
    fuentes: [src-docm-dia, src-talaveravalley]

conexion_electrica:
  subestacion: "Subestación propia del campus (220/33 kV), conectada a la SET Calera y Chozas 220 kV de Red Eléctrica"
  tension_kv: 220
  titular_red: "Red Eléctrica (Redeia)"
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    La DIA describe una subestación propia de 18.688 m2 con cuatro
    transformadores de 120 MVA y una demanda máxima global prevista de 240 MVA,
    que recibe energía de dos líneas aéreo-subterráneas de 220 kV y suministra
    33 kV al campus. Las líneas discurren por Talavera de la Reina y Calera y
    Chozas, con unos 3.100 metros de trazado aéreo y 350 subterráneos. La SET
    Calera y Chozas 220 kV es de Red Eléctrica, ajena al procedimiento ambiental,
    y está proyectada en la parcela 35 del polígono 506 de Calera y Chozas. No
    consta la potencia de acceso solicitada ni concedida en MW.
  fuentes: [src-docm-dia, src-cmm, src-lovetalavera]

superficie_parcela_m2: 1910000
inversion_anunciada_eur: 750000000
refrigeracion: >-
  Enfriadores de aire seco. La DIA recoge que se descartó el sistema híbrido con
  almohadillas adiabáticas precisamente por minimizar la demanda de agua, y que
  el cambio de tecnología de refrigeración redujo un 80 % la demanda de agua
  respecto a la alternativa previa.

agua:
  circuito: cerrado
  sistema: >-
    Enfriadores de aire seco (alternativa 1 del estudio de impacto ambiental),
    elegidos frente a un sistema híbrido con almohadillas adiabáticas por
    minimizar la demanda de agua.
  origen: "Red municipal de abastecimiento de Talavera de la Reina; el riego del parque fluvial, de la masa de agua subterránea 030.015 Talavera"
  consumo_m3_ano: 40000
  wue_l_kwh: null
  nota: >-
    La cifra registrada es el agua potable anual que la DIA asigna al centro de
    datos. El desglose oficial es: 600 m3 anuales de agua industrial para los
    equipos de refrigeración del centro de datos (caudal pico 12 l/s); 40.000 m3
    anuales de agua potable para el centro de datos (caudal pico 10 l/s); 7.000
    m3 anuales de agua subterránea para el riego del parque fluvial; y 470.900 m3
    anuales para el resto del ámbito del PSI excluyendo el propio centro de
    datos. El total del conjunto del PSI son 511.500 m3 anuales, de los que
    504.500 son de agua potable. Los 504.500 m3/año que la prensa atribuyó al
    centro de datos son, por tanto, la demanda del ámbito urbanizado completo, no
    la del CPD. En agosto de 2026 la Junta cifró el consumo directo de la
    instalación en 0,2 hm3/año y aclaró que las estimaciones de 0,5 hm3/año
    corresponden a una reserva máxima de seguridad municipal para futuros
    equipamientos públicos, no al gasto del centro. Las aguas residuales
    industriales del centro de datos se declaran en 360 m3 anuales.
  fuentes: [src-docm-dia, src-jccm-delegado]

