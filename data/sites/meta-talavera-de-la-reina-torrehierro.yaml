incertidumbres:
  - campo: potencia
    descripcion: >-
      Sigue sin publicarse la carga TI del campus. La única magnitud eléctrica de
      fuente oficial son los 240 MVA de demanda máxima prevista en la subestación
      propia, que es potencia de acceso y no capacidad de servidor. La cifra de
      248 MW de "potencia instalada" procede de una ficha divulgativa de una
      asociación empresarial local, no distingue el tipo de MW y no está
      confirmada por ninguna fuente oficial ni de la compañía. Los 240 MVA y los
      248 MW no son la misma magnitud y no se convierten entre sí.
    fuentes: [src-talaveravalley, src-docm-dia]
  - campo: agua
    descripcion: >-
      Las cifras de consumo de agua difieren radicalmente entre versiones y entre
      ámbitos, y buena parte de la discrepancia pública nace de atribuir al centro
      de datos cifras que son del ámbito urbanizado completo. Se conservan todas:
      4.800 millones de litros al año en una ficha divulgativa; entre 2,2 y 2,9
      millones de metros cúbicos anuales como consumo "inicialmente previsto"
      según el informe ambiental; 504.500 m3/año de agua potable, que la DIA
      atribuye al conjunto del PSI y no al CPD; 40.600 m3/año para el centro de
      datos según el desglose de la DIA (40.000 potable más 600 industrial); y 0,2
      hm3/año de consumo directo según la Junta en agosto de 2026. Ninguna fuente
      concilia la cifra de 0,2 hm3/año con el desglose de la DIA.
    fuentes: [src-talaveravalley, src-cmm, src-elespanol-ruido, src-xataka, src-docm-dia, src-jccm-delegado]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La Junta cifra la inversión en 750 millones de euros y la ha mantenido desde
      octubre de 2024 hasta agosto de 2026. El informe ambiental recogido por CMM
      habla de "más de mil millones de euros" y el delegado de la Junta en
      Talavera admitió en agosto de 2026 que puede superar los 1.000 millones
      según el desarrollo definitivo de las instalaciones.
    fuentes: [src-dia, src-cmm, src-eldiario-2026, src-jccm-reparcelacion, src-jccm-delegado]
  - campo: ubicacion
    descripcion: >-
      Las fuentes describen el emplazamiento de forma incoherente: la nota de la
      Junta de octubre de 2024 lo sitúa "a unos doce kilómetros del núcleo urbano
      de Talavera de la Reina" y la de agosto de 2026 "a 400 metros del núcleo
      urbano" de Gamonal. Son referencias a núcleos distintos, pero ninguna fuente
      lo aclara. Las coordenadas usadas son el centroide del polígono industrial
      de Torrehierro en OpenStreetMap, no la parcela concreta.
    fuentes: [src-talaveravalley, src-elespanol-ruido, src-jccm-psi, src-jccm-delegado, src-osm]
  - campo: superficie_parcela_m2
    descripcion: >-
      Conviven varias superficies. El ámbito global del PSI son 191 hectáreas, de
      las cuales 175,74 son suelo urbano no consolidado industrial; 102 hectáreas
      (53,4 %) se destinan a zonas industriales y 50 hectáreas (26,2 %) a zonas
      verdes, con un parque fluvial público de entre 50 y 60 hectáreas. Se
      registra el ámbito global.
    fuentes: [src-dia, src-docm-dia, src-eldiario-2026, src-elespanol-repar, src-jccm-psi]
  - campo: empleo
    descripcion: >-
      Los 250 empleos directos y 300 de construcción son cifras del Gobierno
      regional, no de la compañía, y no se han contrastado con ningún registro
      laboral. Los 780 "empleos anuales apoyados en la región" son una magnitud
      distinta que incluye cadena de suministro y consumo inducido.
    fuentes: [src-jccm-reparcelacion, src-jccm-delegado]

