estado: cancelado
estado_detalle: >-
  Proyecto para instalar el primer gran centro de datos de la Comunitat Valenciana en el
  edificio de los Docks de la Marina de València. Impulsado inicialmente por Nethits
  Telecom Group, fue declarado de interés público por el Ayuntamiento en agosto de 2022 y
  después sacado a concurso, con tres ofertas (Sineasen/Datium, Nethits Telecom y Data
  Center Docks); en febrero de 2023 Sineasen encabezaba la valoración. El gobierno
  municipal de PP y Vox descartó después el proyecto por no querer «una granja de
  servidores» en un edificio histórico, y Nethits trasladó su inversión al polígono de Vara
  de Quart (ver `nxn-valencia-vara-de-quart-nx01`). La cancelación quedó confirmada en vía
  judicial: el 13/06/2025 el juzgado de lo Contencioso-Administrativo nº 1 de València
  desestimó el recurso de Sineasen contra la anulación del concurso, apoyándose en un
  informe de la Abogacía del Estado según el cual ceder los Docks a una empresa privada a
  cambio de un canon contradice la finalidad de utilidad pública con la que el Puerto cedió
  el inmueble al Ayuntamiento. En junio de 2026 el edificio seguía vacío y deteriorado, a la
  espera de un uso público, con el centro de datos ya expresamente descartado. La ficha
  sigue siendo, por tanto, un proyecto cancelado.
estado_fuentes: [src-2, src-3, src-4, src-5]

