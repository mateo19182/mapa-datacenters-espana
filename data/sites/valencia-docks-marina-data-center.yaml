    nota: "«El funcionamiento de todo ello requiere 16 MW de acometida eléctrica o potencia»."

superficie_construida_m2: 20000

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      Cifras muy dispares: 241 millones anunciados por el president Ximo Puig en Les Corts
      en septiembre de 2021 (240 millones según Levante-EMV en agosto de 2022); 97 millones
      en la oferta inicial de Nethits de julio de 2022; y 45, 43 y 37 millones en las tres
      ofertas del concurso de 2023. No se registra un valor único.
    fuentes: [src-1, src-3]
  - campo: operador
    descripcion: >-
      El concurso no llegó a materializarse en una explotación. Sineasen (marca Datium)
      encabezaba la valoración en febrero de 2023 con 99,11 puntos, frente a los 46,44 de
      Nethits Telecom y los 25,01 de Data Center Docks; el proyecto fue descartado por el
      Ayuntamiento y la empresa fue compensada con 24.000 euros frente a los cerca de
      115.000 que reclamaba.
    fuentes: [src-2, src-3, src-4]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas corresponden al recinto de la Marina de València, no al edificio de
      los Docks en concreto.
    fuentes: [src-1]

