estado: anunciado
estado_detalle: >-
  Scranton Enterprises, accionista mayoritario de la quebrada Iberboard Mill, conserva los
  terrenos de Alcover y proyecta reconvertir la fábrica en un centro de datos bajo la marca
  Iberdata. Su consejero delegado describe dos fases: primero asegurar el suministro eléctrico
  —negociación abierta con la eléctrica local— y después buscar un socio industrial que desarrolle
  y explote la instalación, con la construcción a dos o tres años vista. No hay proyecto
  presentado ni licencia.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: conexion_red
    valor_mw: 20
    ambito: edificio
    edificio: "Iberdata Alcover"
    referencia: "Potencia que la promotora intenta asegurar; la fuente dice «más de 20 MW»"
    estado_asociado: anunciado
    fecha_dato: "2026-02-10"
    fuentes: [src-1, src-2]
    nota: >-
      Es potencia en negociación, no concedida, y un mínimo declarado: 20 MW es además el umbral
      a partir del cual la Generalitat puede considerar el proyecto de interés estratégico, lo que
      resta valor a la cifra como dimensionamiento real de la instalación.

conexion_electrica:
  titular_red: null
  mw_solicitados: 20
  nota: >-
    La compañía declara estar «intentando asegurar más de 20 MW» con la compañía eléctrica local.
    No consta solicitud de acceso formalizada ni permiso concedido.
  fuentes: [src-1]

incertidumbres:
  - campo: potencia
    descripcion: >-
      La única cifra publicada son los «más de 20 MW» que la promotora negocia con la
      distribuidora. No hay dimensionamiento de carga TI ni proyecto técnico. Un blog sectorial
      (Kora Grup) repite «más de 20 MW» citando el mismo origen.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      La versión en español de DatacenterDynamics sitúa por error esta reconversión «en Igualada
      (Barcelona)»; la prensa económica que cita al consejero delegado y la versión inglesa del
      propio medio la ubican en Alcover (Alt Camp, Tarragona), que es donde estaba la planta de
      Iberboard Mill. Se registra Alcover y se deja constancia del error para que no se propague.
    fuentes: [src-1, src-2, src-3]
  - campo: operador
    descripcion: >-
      No hay operador: Scranton es el propietario del suelo y declara estar buscando un socio
      industrial que desarrolle y explote el centro.
    fuentes: [src-1, src-2]

confianza: baja
ultima_verificacion: "2026-08-31"

