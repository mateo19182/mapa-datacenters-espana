  - campo: estado
    descripcion: >-
      La única fuente localizada es la nota de apertura de la región (2024), que sitúa estos tres
      emplazamientos en construcción. No se ha encontrado confirmación pública posterior de su
      puesta en servicio, ni expedientes municipales accesibles.
    fuentes: [src-1]
