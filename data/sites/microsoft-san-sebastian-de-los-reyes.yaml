  municipio: "San Sebastián de los Reyes"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Avenida de Fuente Nueva 3, Polígono Industrial Sur, San Sebastián de los Reyes"
  lat: null
