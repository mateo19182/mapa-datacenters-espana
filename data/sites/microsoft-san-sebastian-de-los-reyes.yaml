estado: en_construccion
estado_detalle: >-
  El expediente ambiental (10-EIA-00035.3/2022, referencia interna SEA 35/22) describe un centro
  de datos de un solo edificio, denominado MAD04, en una parcela del Polígono Industrial Sur. El
  edificio se divide en la nave de servidores —llamada Ballard o Baluarte, con cuatro celdas—, el
  área administrativa y la de logística y almacenaje. La Comunidad de Madrid hizo público el
  Informe de Impacto Ambiental por Resolución de 28 de febrero de 2023 (BOCM de 16 de marzo de
  2023). Microsoft declaró en la apertura de su región cloud Spain Central que avanzaba en la
  construcción de centros de datos adicionales en Algete, Meco y San Sebastián de los Reyes.
estado_fuentes: [src-1, src-2, src-3]

potencia:
  - tipo: it
    valor_mw: 9.5
    ambito: edificio
    edificio: "Ballard (MAD04)"
    referencia: "Capacidad de los equipos informáticos de las 4 celdas del edificio Ballard"
    estado_asociado: en_construccion
    fecha_dato: "2023-02-28"
    fuentes: [src-2]
    nota: >-
      El expediente dice «capacidad total de potencia de equipos informáticos de 9,5 MW», que es
      carga TI.
  - tipo: instalada_total
    valor_mw: 13
    ambito: edificio
    edificio: "Ballard (MAD04)"
    referencia: "Demanda de potencia del edificio declarada en el documento ambiental"
    estado_asociado: en_construccion
    fecha_dato: "2023-02-28"
    fuentes: [src-2]
    nota: >-
      El documento la llama indistintamente «demanda de potencia de 13 MW» y «potencia instalada
      de 13 MW». No se compara con los 9,5 MW de carga TI ni se deduce un PUE de la relación.
  - tipo: termica_respaldo
    valor_mw: 7.1
    ambito: edificio
    edificio: "Ballard (MAD04)"
    referencia: "Cada uno de los 4 generadores de emergencia de las salas de datos"
    estado_asociado: en_construccion
    fecha_dato: "2023-02-28"
    fuentes: [src-2]
    nota: >-
      Cifra por unidad, no del conjunto: cada generador declara 3,5 MW eléctricos y 7,1 MW
      térmicos. No es capacidad del centro de datos y no entra en ningún agregado.

conexion_electrica:
  subestacion: null
  tension_kv: 20
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    El documento ambiental prevé el suministro desde dos subestaciones situadas fuera del
    emplazamiento, con acometidas subterráneas independientes en alta tensión a 20 kV, y cinco
    transformadores 20/0,415 kV alimentados en anillo. No nombra las subestaciones ni su titular.
  fuentes: [src-2]

superficie_parcela_m2: 24762
superficie_construida_m2: null
refrigeracion: >-
  Unidades de ventilación con enfriamiento evaporativo que usan agua como refrigerante, con dos
  tanques de hormigón en el sótano y tratamiento previo del agua, incluida descalcificación.

agua:
  circuito: desconocido
  sistema: >-
    Enfriamiento evaporativo de las salas de datos con agua tratada almacenada en dos tanques de
    hormigón en el sótano. Genera purgas del sistema de refrigeración que se vierten a la red.
  origen: "Acometida de la red pública; vertido a la red de Canal de Isabel II"
  consumo_m3_ano: 9199.2
  wue_l_kwh: null
  nota: >-
    El expediente añade un vertido anual previsto de 2.490 m³ de purgas del circuito de
    refrigeración y 394 m³ de aguas sanitarias. El circuito se deja como desconocido porque la
    fuente describe un sistema evaporativo con purga sin clasificarlo como abierto ni cerrado.
  fuentes: [src-2]

enlaces_proyecto:
  - "https://www.bocm.es/boletin/CM_Orden_BOCM/2023/03/16/BOCM-20230316-50.PDF"

incertidumbres:
  - campo: potencia
    descripcion: >-
      Las cifras proceden del documento ambiental de 2022-2023 y describen el diseño presentado
      entonces para un solo edificio. Microsoft no ha publicado la capacidad del emplazamiento en
      servicio, y no consta si el proyecto ejecutado mantiene los 9,5 MW de carga TI.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      No se ha localizado confirmación pública de la puesta en servicio. Microsoft situaba el
      emplazamiento en construcción en la nota de apertura de la región; el expediente ambiental
      es de 2023 y no hay publicación posterior sobre su ejecución.
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      La ficha está registrada como campus, pero el expediente ambiental describe un único
      edificio de centro de datos en la parcela. No consta que el emplazamiento vaya a albergar
      más edificios.
    fuentes: [src-2]
  - campo: ubicacion
    descripcion: >-
      La dirección consta en el expediente ambiental, pero no se han publicado coordenadas ni
      referencia catastral de la parcela, así que la geolocalización queda a nivel de municipio.
    fuentes: [src-2, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

