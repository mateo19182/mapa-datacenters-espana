    titulo: "Microsoft abre su primera región cloud en España para acelerar el desarrollo de la Economía de la IA"
    editor: "Microsoft"
    tipo: empresa
    fecha_consulta: "2026-08-29"
    cita: "Microsoft avanza en la construcción de centros de datos adicionales ubicados en Algete, Meco y San Sebastián de los Reyes, que se inaugurarán próximamente."
  - id: src-2
    url: "https://transparencia.ssreyes.org/documents/1678104/2103617/819305892_1462023192729.pdf/6b22353e-8d39-6f69-e668-415d0316374e?t=1697736054194"
    titulo: "35/22 INFORME DE IMPACTO AMBIENTAL DEL PROYECTO DE CENTRO DE DATOS, EN LA AVDA. FUENTE NUEVA Nº 3, EN EL TÉRMINO MUNICIPAL DE SAN SEBASTIÁN DE LOS REYES, PROMOVIDO POR MICROSOFT 7724 SPAIN S.L."
    editor: "Comunidad de Madrid — Consejería de Medio Ambiente, Vivienda y Agricultura (publicado en el portal de transparencia del Ayuntamiento de San Sebastián de los Reyes)"
    tipo: oficial
    fecha_publicacion: "2023-02-28"
    fecha_consulta: "2026-08-31"
    cita: "En la zona central de la parcela se construirá un Centro de Datos (también denominado MAD04), con un área de 7.085 m2 ... La parcela tiene una superficie de 24.762 m2 ... El edificio BALLARD dispondrá de 4 celdas destinadas a alojar equipos de informática y redes con una capacidad total de potencia de equipos informáticos de 9,5 MW. Existirán 4 generadores de emergencia para las salas de datos, cada uno con una potencia eléctrica de 3,5 MW y potencia térmica de 7,1 MW ... El suministro eléctrico se prevé desde dos subestaciones eléctricas situadas fuera del emplazamiento, con acometidas subterráneas independientes en alta tensión a 20 KV 50 Hz. El edificio tendrá una demanda de potencia de 13 MW, encontrándose previstos cinco (5) transformadores de 20/0,415 KV distribuidos por el complejo ... Las salas de datos se proveerán de un sistema de unidades de ventilación con enfriamiento evaporativo que utiliza agua como elemento refrigerante ... con una potencia instalada de 13 MW y un consumo eléctrico máximo estimado anual de aproximadamente 68.330 MWh Se encuentra previsto un consumo anual de agua de 9.199,2 m 3, destinado en su mayor parte al uso en la refrigeración de los equipos. Se estima un volumen de vertido anual de purgas del sistema de refrigeración de 2.490 m 3 anuales y 394 m 3 anuales de aguas sanitarias."
  - id: src-3
    url: "https://www.bocm.es/boletin/CM_Orden_BOCM/2023/03/16/BOCM-20230316-50.PDF"
    titulo: "RESOLUCIÓN de 28 de febrero de 2023, del Director General de Descarbonización y Transición Energética de la Consejería de Medio Ambiente, Vivienda y Agricultura, por la que se acuerda hacer público el Informe de Impacto Ambiental del proyecto de “Centro de Datos en Avenida Fuente Nueva, número 3, localizado en el polígono industrial Sur”, en el término municipal de San Sebastián de los Reyes, promovido por Microsoft 7724 Spain, S. L."
    editor: "Boletín Oficial de la Comunidad de Madrid"
    tipo: oficial
    fecha_publicacion: "2023-03-16"
    fecha_consulta: "2026-08-31"
    cita: "se acuerda hacer público el Informe de Impacto Ambiental correspondiente al proyecto de “Centro de Datos en Avenida Fuente Nueva, número 3, localizado en el polígono industrial Sur”, en el término municipal de San Sebastián de los Reyes, promovido por Microsoft 7724 Spain, S. L., con domicilio social en Paseo Club Deportivo, número 1, Parque Empresarial “La Finca”, 28223 Pozuelo de Alarcón, Madrid. (Expediente: 10-EIA-00035.3/2022)"
