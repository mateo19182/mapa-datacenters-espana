incertidumbres:
  - campo: potencia
    descripcion: >-
      elEconomista habla de «potencia» sin distinguir carga TI de potencia contratada. La
      operación de compra se comunicó como «6,5 MW» añadidos por los tres centros del lote
      (Madrid, Valencia y Lisboa), cifra que no puede desglosarse por emplazamiento. A ello
      se añade una discrepancia abierta sobre la potencia de partida: la ficha del propio
      operador publica 0,6 MW de «total power» (abril de 2026) frente al «1 MW de potencia
      actual» que también declara Templus en su nota de mayo de 2026. La página de red contiene
      otro bloque con 2,5 MW IT, sin fecha ni prueba de entrega, que no se adopta como capacidad
      operativa nueva.
    fuentes: [src-1, src-2, src-4, src-ampliacion-20260513, src-red-actual]
  - campo: estado
    descripcion: >-
      La ficha del operador marca VAL01 como «Disponible Q3 2026» y «Tier III Ready», no
      certificado, mientras que el directorio del Observatorio lo lista como operativo con
      4 MW. La nota primaria de mayo acredita la inauguración del centro existente y anuncia
      el crecimiento, sin confirmar obras ni entrega de los 4 MW. No se da por cumplido el
      plazo comercial por haber transcurrido el trimestre.
    fuentes: [src-3, src-4, src-ampliacion-20260513]

