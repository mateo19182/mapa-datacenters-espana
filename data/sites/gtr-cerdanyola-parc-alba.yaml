estado: anunciado
estado_detalle: >-
  Primera entrada de Global Technical Realty en España. Parcela de 15.000 m² en
  el Parc de l'Alba, en fase de planificación y sin calendario de desarrollo
  publicado. Baxtel indica año previsto 2027. La compañía, respaldada por el
  tercer fondo global de infraestructuras de KKR, anunció la adquisición del
  suelo el 31 de julio de 2023; la venta la asesoró JLL en nombre de DCITE,
  plataforma promovida por Nilo Partners y ADEQUA Real Estate.
estado_fuentes: [src-1, src-3, src-4]

potencia:
  - tipo: it
    valor_mw: 16
    ambito: edificio
    referencia: "Carga TI que admite la parcela según la propia compañía"
    estado_asociado: anunciado
    fecha_dato: "2023-07-31"
    fuentes: [src-3]
    nota: >-
      La nota de GTR dice "The 15,000 sq m plot has the capacity to accommodate a
      new 16MW IT load facility". Es la capacidad que admite el emplazamiento, no
      una potencia contratada ni construida.

superficie_parcela_m2: 15000

incertidumbres:
  - campo: potencia
    descripcion: >-
      Baxtel no publica potencia. Los 16 MW proceden de la nota de la propia GTR
      de julio de 2023 y describen lo que la parcela «puede acoger»; no consta
      potencia de acceso solicitada ni concedida. Un reportaje sectorial de enero
      de 2025 sigue citando 16 MW para este proyecto.
    fuentes: [src-1, src-3, src-5]
  - campo: estado
    descripcion: >-
      No se ha localizado licencia urbanística ni expediente ambiental. El último
      anuncio público de la compañía es de julio de 2023 y no se ha encontrado
      información posterior sobre el desarrollo.
    fuentes: [src-1, src-3]

