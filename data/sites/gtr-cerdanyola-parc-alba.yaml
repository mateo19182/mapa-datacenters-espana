tipo: edificio
operador: "Global Technical Realty"
propietario: "Global Technical Realty (respaldada por KKR)"
modelo: mayorista

ubicacion:
  municipio: Cerdanyola del Vallès
  provincia: Barcelona
  ccaa: Cataluña
  direccion: Parc de l'Alba, Cerdanyola del Vallès
  lat: null
  lon: null
  precision: municipio
  fuentes:
    - src-1
    - src-2
  no_derivar: true

estado: anunciado
estado_detalle: Primera entrada de Global Technical Realty en España. Parcela de 15.000 m² en el
  Parc de l'Alba, en fase de planificación y sin calendario de obra confirmado por el operador.
  Baxtel indica año previsto 2027. La compañía, respaldada por el tercer fondo global de
  infraestructuras de KKR, anunció la adquisición del suelo el 31 de julio de 2023; la venta la
  asesoró JLL en nombre de DCITE, plataforma promovida por Nilo Partners y ADEQUA Real Estate.

estado_fuentes:
  - src-1
  - src-3
  - src-4
  - src-grupovia-20250507

potencia:
  - tipo: it
    valor_mw: 16
    ambito: edificio
    referencia: "Carga TI que admite la parcela según la propia compañía"
    estado_asociado: anunciado
    fecha_dato: "2023-07-31"
    fuentes: [src-3]
    nota: >-
      La nota de GTR dice "The 15,000 sq m plot has the capacity to accommodate a
      new 16MW IT load facility". Es la capacidad que admite el emplazamiento, no
      una potencia contratada ni construida.

  - tipo: no_especificado
    valor_mw: 12
    ambito: edificio
    referencia: Capacidad prevista en la exposición de JG Ingenieros recogida por Grupo Vía
    estado_asociado: anunciado
    fecha_dato: 2025-05-07
    fuentes:
      - src-grupovia-20250507
    nota: El resumen del acto cita 12 MW para GTR Cerdanyola y previsión 2026, sin tipificar la
      magnitud. No sustituye los 16 MW IT del anuncio del operador.
superficie_parcela_m2: 15000

incertidumbres:
  - campo: potencia
    descripcion: >-
      Baxtel no publica potencia. Los 16 MW proceden de la nota de la propia GTR
      de julio de 2023 y describen lo que la parcela «puede acoger»; no consta
      potencia de acceso solicitada ni concedida. Un reportaje sectorial de enero
      de 2025 sigue citando 16 MW para este proyecto.
    fuentes: [src-1, src-3, src-5]
  - campo: estado
    descripcion: No se ha localizado licencia ni confirmación de apertura. La previsión de operación en
      2026 procede del resumen del acto de mayo de 2025; la compra corporativa de 2023 no fijaba
      calendario.
    fuentes:
      - src-1
      - src-3
      - src-grupovia-20250507
  - campo: ubicacion
    descripcion: El punto anterior correspondía al Parc de l’Alba; las fuentes del proyecto no
      identifican parcela ni pin de este edificio dentro del parque.
    fuentes:
      - src-3
confianza: media
ultima_verificacion: 2026-10-17

