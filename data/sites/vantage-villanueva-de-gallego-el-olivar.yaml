    url: "https://www.elperiodicodearagon.com/aragon/2026/07/24/vantage-reubicara-centro-datos-renunciar-zaragoza-132732543.html"
    titulo: "Vantage reubicará su centro de datos al renunciar a los suelos de Villanueva de Gállego"
    editor: "El Periódico de Aragón"
    tipo: prensa_general
    fecha_publicacion: "2026-07-24"
    fecha_consulta: "2026-08-31"
    cita: "Cambio de planes en el centro de datos que el gigante estadounidense Vantage Data Centers, aliado con una sociedad de empresarios aragoneses, proyectaba en Villanueva de Gállego con una inversión de 3.200 millones de euros. La promotora de uno de los grandes complejos tecnológicos que prometen aterrizar sobre la comunidad ha renunciado a ubicarse en una pastilla de suelo de 40 hectáreas junto a la Universidad San Jorge, en la carretera de Huesca, por lo que trabaja a contrarreloj para encontrar un nuevo emplazamiento para su infraestructura tecnológica. [...] En cualquier caso, el proyecto \"sigue adelante\", según confirman las citadas fuentes"
  - id: src-5
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1413456710909"
    titulo: "ORDEN PEJ/1264/2025, de 18 de septiembre [...] «Centro de datos del Campus Villanueva de Gállego» — eficiencia energética y materia hídrica"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-10-01"
    fecha_consulta: "2026-08-31"
    cita: "En materia hídrica, el proyecto se diseñará con métodos de refrigeración en circuito cerrado, reutilización del calor y diseños energéticamente eficientes en lugar de los tradicionales sistemas evaporativos que consumen más agua. [...] De esta forma, el consumo total de agua en el Campus Centro de datos de Villanueva de Gállego se limitará al uso humano equiparable al de una instalación industrial estándar."
  - id: src-6
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1413456710909"
    titulo: "ORDEN PEJ/1264/2025, de 18 de septiembre [...] «Centro de datos del Campus Villanueva de Gállego» — creación de puestos de trabajo"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-10-01"
    fecha_consulta: "2026-08-31"
    cita: "Teniendo en cuenta que las previsiones de inversión se estiman en 13.600.000 euros, se prevé la creación de unos 60 puestos de trabajo directos, y otros 80 indirectos durante el mismo periodo. Una vez construido, se espera que el centro de datos respalde alrededor de 520 empleos permanentes directos, pasando de 180 en los primeros años a 520 en el año 10. Esta estimación se basa en una proporción típica de la industria de 1 FTE por MW de potencia de TI y se valida con las operaciones existentes de Vantage."
