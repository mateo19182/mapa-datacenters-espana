id: nxn-valencia-vara-de-quart-nx01
nombre: "NxN Data Centers Nx01 — València (Vara de Quart)"
alias:
  - "Nx01 Valencia"
  - "NXN-VLC1"
  - "Data center de Nethits en Vara de Quart"
tipo: edificio
operador: "NxN Data Centers"
propietario: "NxN Data Centers (participada mayoritariamente por InfraRed Capital Partners desde diciembre de 2025; Nethits Telecom Group y Adequita Capital, minoritarios)"
modelo: colocation

ubicacion:
  municipio: "València"
  provincia: "Valencia"
  ccaa: "Comunitat Valenciana"
  direccion: "Polígono industrial de Vara de Quart, parcela entre las calles Tres Forques y Llanterners"
  lat: 39.4621
  lon: -0.4087
  precision: aproximada
  fuentes: [src-1]

estado: en_construccion
estado_detalle: >-
  Licencia municipal de obras y actividad concedida el 28/02/2025 por el Ayuntamiento de
  València. Primera piedra colocada el 02/02/2026 y obras iniciadas en abril de 2026.
  Apertura anunciada para marzo de 2027 (Levante-EMV) o primer semestre de 2027 (Economía 3).
  El 16/12/2025 el gestor de infraestructuras InfraRed Capital Partners adquirió la mayoría
  accionarial de NxN, plataforma constituida en 2023 como sociedad conjunta de Nethits
  Telecom Group y Adequita Capital.
estado_fuentes: [src-1, src-2, src-3, src-7]
fecha_puesta_en_servicio: "2027-03"

potencia:
  - tipo: no_especificado
    valor_mw: 5
    ambito: edificio
    referencia: "Potencia inicial del edificio Nx01"
    estado_asociado: en_construccion
    fecha_dato: "2026-04-30"
    fuentes: [src-2, src-3, src-4]
    nota: >-
      Las fuentes hablan de «5 MW de potencia» / «potencia inicial de 5 megavatios» sin
      precisar si es carga TI o potencia de conexión.
  - tipo: it
    valor_mw: 5
    ambito: edificio
    referencia: "Potencia TI del edificio Nx01"
    estado_asociado: en_construccion
    fecha_dato: "2026-02-02"
    fuentes: [src-5]
    nota: >-
      DatacenterDynamics es la única fuente que tipifica los 5 MW: «abarcará 6.500 metros
      cuadrados y 5 MW de potencia IT».
  - tipo: conexion_red
    valor_mw: 6
    ambito: edificio
    referencia: "Permisos de acceso y conexión a la red"
    estado_asociado: en_construccion
    fecha_dato: "2025-03-03"
    fuentes: [src-6]
    nota: >-
      Data Center Market: «Cuenta con permisos de acceso y conexión a la red por hasta 6MW
      de energía». Es potencia de acceso, no carga TI: no se suma a los 5 MW ni los
      sustituye.

fases:
  - nombre: "Nx01 (fase única anunciada)"
    estado: en_construccion
    fecha_puesta_en_servicio: "2027-03"
    superficie_m2: 6500
    fuentes: [src-1, src-2, src-3]

superficie_construida_m2: 6500
inversion_anunciada_eur: 60000000
refrigeracion: >-
  Consumo de agua cero según los promotores; energía 100 % renovable. Diseño híbrido
  preparado para refrigeración estándar, líquida e inmersión, y certificación BREEAM
  Excellent declarada.

agua:
  circuito: sin_agua
  sistema: >-
    Diseño híbrido de refrigeración (estándar, líquida e inmersión) con consumo de agua
    declarado nulo por el promotor.
  origen: null
  nota: >-
    «Consumo de agua cero» / «consumo de agua nulo» es una afirmación del promotor recogida
    por dos medios especializados; no hay auditoría ni cifra de WUE que la respalde.
  fuentes: [src-5, src-6]

empleo:
  - tipo: directo
    valor: 100
    referencia: "Empleos directos previstos en desarrollo y explotación"
    fecha_dato: "2026-02-02"
    fuentes: [src-5, src-6]
    nota: null
  - tipo: indirecto
    valor: 500
    referencia: "Empleos indirectos e inducidos previstos"
    fecha_dato: "2026-02-02"
    fuentes: [src-5, src-6]
    nota: "DCD: «cerca de 500 indirectos e inducidos»."

incertidumbres:
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      Levante-EMV (02/02/2026) fija la apertura en marzo de 2027; Economía 3 (30/04/2026)
      la sitúa en el primer semestre de 2027 sin concretar mes.
    fuentes: [src-2, src-3]
  - campo: potencia
    descripcion: >-
      Las fuentes generalistas dan «5 MW» sin tipo. DatacenterDynamics (02/02/2026) los
      llama «5 MW de potencia IT» y Data Center Market (03/03/2025) y El Confidencial hablan
      de «6MW de potencia» y de «permisos de acceso y conexión a la red por hasta 6MW». Se
      registran las tres lecturas por separado: 5 MW sin tipo, 5 MW IT y 6 MW de acceso. No
      se ha localizado el expediente de acceso y conexión que fije los MW concedidos.
    fuentes: [src-2, src-3, src-4, src-5, src-6]

confianza: media
ultima_verificacion: "2026-08-31"

