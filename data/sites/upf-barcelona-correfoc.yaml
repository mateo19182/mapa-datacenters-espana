incertidumbres:
  - campo: ubicacion
    descripcion: La RES sitúa el nodo en Barcelona. La dirección del servicio de la UPF en el PRBB es un
      contacto institucional y no acredita por sí sola la sala de alojamiento. Se dejan las
      coordenadas sin publicar.
    fuentes:
      - src-res
      - src-servicio
  - campo: potencia
    descripcion: Las fuentes consultadas no publican MW IT, potencia de conexión concedida ni consumo de
      agua del recinto.
    fuentes:
      - src-hardware
      - src-res
  - campo: computo
    descripcion: El inventario global de la UPF y los 24 nodos descritos por la RES tienen alcances
      distintos. No se suman. Ambas páginas carecen de fecha de corte del inventario; no se usa la
      fecha de consulta como fecha del hardware.
    fuentes:
      - src-hardware
      - src-res
