estado_detalle: Correfoc entró en operación el 1 de julio de 2026, según la UPF. Sustituye
  progresivamente a Marvin2 y ofrece particiones CPU y GPU. La universidad publica un inventario de
  57 NVIDIA L40S. El registro identifica la infraestructura de cómputo, sin atribuirle una sala
  física ni potencia eléctrica no publicadas.
