estado: en_construccion
estado_detalle: >-
  Primera piedra colocada en junio de 2026 en el parque tecnológico CITAI de Escúzar. La empresa,
  antes denominada Sierra DC, se renombró Alto Infrastructure. El campus se desarrolla en ocho fases
  independientes hasta 2029.
