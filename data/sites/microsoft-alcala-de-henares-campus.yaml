    descripcion: >-
      No consta ninguna cifra oficial de potencia. Un reportaje de prensa generalista de 2026
      atribuye al campus una horquilla estimada de 30-50 MW, pero se trata de una estimación
      periodística y no se registra como dato.
    fuentes: [src-2]
  - campo: superficie_parcela_m2
    descripcion: >-
      El mismo reportaje cita una parcela de 98.700 m² y un consumo anual de agua estimado de
      hasta 1.937 m³/año en el diseño en desarrollo; el anuncio municipal no aporta superficies.
    fuentes: [src-1, src-2]
  - campo: estado
