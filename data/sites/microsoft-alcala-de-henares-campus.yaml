    fecha_publicacion: "2025-04-30"
    fecha_consulta: "2026-08-31"
    cita: "Microsoft 7724 Spain S.L.U. planea desarrollar un Campus de Centros de Datos en una parcela de 98.693,19 m² en el polígono “Las Matillas”, en Alcalá de Henares (Madrid) ... Se prevé que el suministro de energía eléctrica necesaria para el funcionamiento del Centro de Datos que forma parte del Plan Especial se realizará mediante nuevas líneas eléctricas de suministro que conectarán dicho Centro de Datos con la subestación Nuevo Meco 220 kV perteneciente a Red Eléctrica de España, localizada en el término municipal de Meco, Comunidad de Madrid ... Dado que el trazado de estas líneas afecta a más de un término municipal, su desarrollo estará sujeto a un Plan Especial de Infraestructuras específico. En cuanto al consumo eléctrico del futuro Centro de Datos, la potencia nominal será de 57.6 MW, necesaria para el funcionamiento de los equipos de IT. La eficiencia energética del Centro de Datos, medida a través del Power Usage Effectiveness (PUE, por sus siglas en inglés) será de 1.5 ... Por tanto, el consumo total de energía del Centro de Datos es de 86.25 MW ... Con el diseño actualmente en desarrollo se estima un consumo de agua anual de hasta 1.937 m3/año, procedente un 70,4% de la red de abastecimiento y un 29.6% de la reutilización del agua de lluvia ... TABLA 4 ESTIMACIÓN DEL CONSUMO DE AGUA DE RED EN EL FUTURO CENTRO DE DATOS Uso Consumo (m3/año) Usos sanitarios 1.310 Sistema de refrigeración (humidificación) 54 TOTAL 1.364 ... TABLA 5 ESTIMACIÓN DEL USO DE AGUA DE LLUVIA EN EL FUTURO CENTRO DE DATOS Uso Consumo (m3/año) Usos sanitarios 547 Riego de zona verde ajardinada 0 Limpieza 26 TOTAL 573 ... la tecnología de refrigeración avanzada que se utilizará recicla el agua en un circuito cerrado, consumiendo una cantidad mínima de agua (asociada a la humectación)"
  - id: src-6
    url: "https://www.comunidad.madrid/transparencia/sites/default/files/regulation/documents/01_plan_especial_memoria.pdf"
    titulo: "Memoria del Plan Especial de Ordenación del solar situado en Avenida de Madrid, 15, Polígono “Las Matillas”, Alcalá de Henares"
    editor: "Microsoft 7724 Spain, S. L. U., publicado por la Comunidad de Madrid en el expediente SIA 25/139"
    tipo: oficial
    fecha_publicacion: "2025"
    fecha_consulta: "2026-08-31"
    cita: "Campus de Centros de Datos sobre un área de unos 98.693,19m2 ... el proyecto planteado propone reemplazar el sistema de enfriamiento adiabático por una solución combinada de free-cooling y enfriamiento por compresión, eliminando por completo el uso de agua de proceso ... El sistema incorporará la recuperación de aguas pluviales mediante la canalización de las cubiertas de las oficinas hacia un tanque de almacenamiento de 50 m³ ... El consumo anual de agua se prevé de hasta 1.937 m3 anuales desglosados en: • 573 m³/año para inodoros y limpieza y procedentes de la recuperación de agua de lluvia • 1.364 m³/año de agua de red para agua de boca (54 m3/año para humidificación y 1.310 m3/año lavabos y picas). Si calculamos estas estimaciones sobre las 125 personas que se prevé trabajen en el data center, el consumo medio diario estará por debajo de los 30 litros/día/persona. Adicionalmente, para la protección contra incendios del edificio, será necesario prever el llenado inicial del depósito, así como un posible llenado de 680 m³ en caso de mantenimiento o reparación del sistema ... nuevas líneas de alta tensión que lo conectarán con la subestación Nuevo Meco 220 kV, perteneciente a Red Eléctrica de España y ubicada en el municipio de Meco ... Edificabilidad 1,125 m2/m2"
