id: microsoft-alcala-de-henares-campus
nombre: "Campus de Centros de Datos de Microsoft — Alcalá de Henares"
alias:
  - "Microsoft 7724 Spain, S.L.U. — Sector 26 Las Matillas"
tipo: campus
operador: "Microsoft"
propietario: "Microsoft 7724 Spain, S.L.U."
modelo: hyperscale

ubicacion:
  municipio: "Alcalá de Henares"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Avenida de Madrid 15, Sector 26, Polígono Industrial Las Matillas, Alcalá de Henares"
  lat: null
  lon: null
  precision: aproximada
  fuentes: [src-1, src-5, src-6]

estado: en_tramitacion
estado_detalle: >-
  La Junta de Gobierno Local del Ayuntamiento de Alcalá de Henares aprobó inicialmente el 5 de
  septiembre de 2025 el Plan Especial de Ordenación del solar del Sector 26 (Polígono Industrial
  Las Matillas), promovido por Microsoft 7724 Spain, S.L.U. Tras la información pública procede
  la aprobación definitiva antes de iniciar los trámites de ejecución. El Plan Especial está
  además en evaluación ambiental estratégica en la Comunidad de Madrid con la referencia
  SIA 25/139, en fase de consulta a las administraciones afectadas desde octubre de 2025. A 30
  de abril de 2026 la prensa regional situaba el expediente todavía en tramitación
  administrativa, sin aprobación definitiva. El cambio de planeamiento era necesario porque la
  parcela seguía sujeta a una ordenación industrial de finales de los años ochenta que no
  permitía este uso.
estado_fuentes: [src-1, src-3, src-4]

potencia:
  - tipo: it
    valor_mw: 57.6
    ambito: campus
    referencia: "Potencia nominal necesaria para los equipos de TI del futuro centro de datos"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-04-30"
    fuentes: [src-5]
    nota: >-
      El análisis ambiental del Plan Especial dice «la potencia nominal será de 57.6 MW,
      necesaria para el funcionamiento de los equipos de IT». Es la primera cifra oficial de
      carga TI del proyecto. El documento escribe el decimal con punto, a la inglesa.
  - tipo: instalada_total
    valor_mw: 86.25
    ambito: campus
    referencia: "Consumo total de energía del centro de datos declarado en el análisis ambiental"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-04-30"
    fuentes: [src-5]
    nota: >-
      «Por tanto, el consumo total de energía del Centro de Datos es de 86.25 MW». La cifra la
      obtiene el propio promotor aplicando un PUE de diseño de 1,5 a los 57,6 MW de carga TI: no
      es una medida independiente, y aquí no se usa para deducir nada en sentido contrario.

conexion_electrica:
  subestacion: "Nuevo Meco 220 kV"
  tension_kv: 220
  titular_red: "Red Eléctrica de España"
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    El suministro se hará con nuevas líneas de alta tensión, subterráneas en todo su trazado, que
    conectarán el centro con la subestación Nuevo Meco 220 kV de Red Eléctrica de España, en el
    término municipal de Meco. El promotor subraya que la energía no se tomará de las redes
    locales de Alcalá de Henares. Como el trazado afecta a más de un municipio, requerirá un Plan
    Especial de Infraestructuras propio, que no consta tramitado. No se publican MW solicitados
    ni concedidos en el punto de conexión.
  fuentes: [src-5, src-6]

superficie_parcela_m2: 98693.19
refrigeracion: >-
  El proyecto sustituye el enfriamiento adiabático por una solución combinada de free cooling y
  enfriamiento por compresión, que elimina el agua de proceso; el agua se recicla en circuito
  cerrado y solo se consume para humectación de los sistemas de climatización en invierno. PUE
  de diseño de 1,5.

agua:
  circuito: cerrado
  sistema: >-
    Free cooling combinado con enfriamiento por compresión, en sustitución del enfriamiento
    adiabático, con el agua reciclada en circuito cerrado. El único consumo asociado a la
    refrigeración es la humectación de los sistemas de climatización durante los meses de
    invierno. Se recuperan las aguas pluviales de las cubiertas de oficinas en un tanque de
    50 m³ para inodoros y limpieza.
  origen: "1.364 m³/año de la red municipal y 573 m³/año de agua de lluvia recuperada"
  consumo_m3_ano: 1937
  wue_l_kwh: null
  nota: >-
    Del agua de red, 1.310 m³/año son para lavabos y picas y 54 m³/año para humidificación. A la
    protección contra incendios se le suma el llenado inicial del depósito y un posible llenado
    de 680 m³ en caso de mantenimiento, que el promotor no incluye en el consumo anual. La cifra
    corresponde al diseño en desarrollo y el propio documento advierte de que «deberá precisarse
    conforme se avance con el diseño».
  fuentes: [src-5, src-6]

empleo:
  - tipo: directo
    valor: 125
    referencia: "Personas previstas trabajando en el centro de datos, según el cálculo de consumo de agua"
    fecha_dato: "2025-04-30"
    fuentes: [src-6]
    nota: >-
      La cifra no aparece como estimación de empleo, sino como base del cálculo del consumo de
      agua por persona: «Si calculamos estas estimaciones sobre las 125 personas que se prevé
      trabajen en el data center». No hay estimación publicada de empleo de construcción.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Un reportaje de prensa generalista de 2026 atribuía al campus una horquilla estimada de
      30-50 MW. El análisis ambiental del Plan Especial, de abril de 2025, da 57,6 MW de carga TI
      y 86,25 MW de consumo total, por encima de esa horquilla. Se conserva la cifra oficial y se
      deja constancia de la estimación periodística, que no se registra como dato.
    fuentes: [src-2, src-5]
  - campo: potencia
    descripcion: >-
      Las cifras son las del diseño presentado con el Plan Especial, todavía sin aprobación
      definitiva, y no hay proyecto de ejecución ni licencia que las confirme. El propio
      documento remite la evaluación de los efectos energéticos a la evaluación ambiental del
      proyecto, aún por hacer.
    fuentes: [src-5]
  - campo: estado
    descripcion: >-
      A fecha de verificación no se ha localizado publicación de la aprobación definitiva del
      Plan Especial ni licencia de obra. El expediente de evaluación ambiental estratégica
      SIA 25/139 seguía en consulta a las administraciones afectadas.
    fuentes: [src-1, src-3, src-4]

confianza: media
ultima_verificacion: "2026-08-31"

