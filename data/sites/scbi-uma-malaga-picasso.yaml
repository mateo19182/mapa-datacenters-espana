estado: operativo
estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial. El SCBI presta soporte y recursos a la Universidad de Málaga, a la
  Plataforma Andaluza de Bioinformática (PAB) y a la Red Española de Supercomputación, y opera
  el supercomputador Picasso. La UMA arrastra tradición en supercomputación desde los años
  noventa: el primer Picasso, un SGI Origin 2000, se instaló en 1997 y se ha ido renovando
  desde entonces. El 24 % de la máquina está destinado a la RES. El centro ocupa el Edificio de
  Bioinnovación, en el Parque Tecnológico de Andalucía.
estado_fuentes: [src-res, src-scbi]

potencia: []

computo:
  - tipo: cpu_hpc
    ambito: sistema
    sistema: "Picasso"
    modelo: "Intel Xeon Gold 6230R y AMD EPYC 7H12 y 9754 (38.296 núcleos en total)"
    unidades: 344
    tipo_unidad: nodo
    rendimiento: 4.34
    rendimiento_unidad: pflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-res]
    nota: >-
      Cifra global de la máquina, con 182 TB de memoria y 885 TB de almacenamiento neto,
      interconectada con Infiniband HDR de hasta 400 Gbps.
  - tipo: gpu
    sistema: "Picasso — nodos NVIDIA DGX"
    modelo: "NVIDIA A100, 8 por nodo en 4 nodos DGX"
    nodos: 4
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-res]
    nota: >-
      La ficha del nodo da cuatro nodos DGX con ocho A100 cada uno y no publica el total, así
      que el recuento queda vacío en vez de multiplicarse.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES ni el SCBI publican potencia eléctrica, carga TI ni superficie de la sala
      técnica del Edificio de Bioinnovación. La ficha del nodo detalla nodos, núcleos, memoria,
      almacenamiento y rendimiento, pero ninguna magnitud eléctrica. Campo de potencia vacío.
    fuentes: [src-res, src-scbi]
  - campo: computo
    descripcion: >-
      La ficha del nodo en la RES contiene un error de unidad evidente al describir 24 nodos
      BULL R282-Z90 con «2048 TB of RAM», que serían gigabytes. No se registra ninguna cifra de
      memoria por nodo para no arrastrarlo.
    fuentes: [src-res]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas corresponden a la calle Severo Ochoa del Parque Tecnológico de Andalucía,
      no al portal exacto del Edificio de Bioinnovación.
    fuentes: [src-osm]

confianza: media
