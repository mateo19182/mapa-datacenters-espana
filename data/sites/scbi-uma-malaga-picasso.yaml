      No se suman B200 y A100 como si fueran el mismo modelo."

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES ni el SCBI publican potencia eléctrica, carga TI ni superficie de la sala técnica
      del Edificio de Bioinnovación. La ficha del nodo detalla nodos, núcleos, memoria,
      almacenamiento y rendimiento, pero ninguna magnitud eléctrica. Campo de potencia vacío.
    fuentes: [ src-res, src-scbi ]
  - campo: computo
    descripcion: >-
      La ficha del nodo en la RES contiene un error de unidad evidente al describir 24 nodos BULL
      R282-Z90 con «2048 TB of RAM», que serían gigabytes. No se registra ninguna cifra de memoria
      por nodo para no arrastrarlo.
    fuentes: [ src-res ]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas corresponden a la calle Severo Ochoa del Parque Tecnológico de Andalucía, no
      al portal exacto del Edificio de Bioinnovación.
    fuentes: [ src-osm ]
  - campo: computo
    descripcion: La noticia de julio acredita compra de 16 B200 y el inventario técnico vigente las
      enumera como recursos disponibles. No publica una fecha de inventario o de puesta en
      producción. La ficha RES mantiene 38.296 núcleos CPU frente a 39.320 en el SCBI; se conservan
      los alcances sin reconstruir el total por suma.
    fuentes:
      - src-ampliacion-20260710
      - src-hardware-20261014
      - src-res

