estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro de
  datos comercial. El SCBI presta soporte y recursos a la Universidad de Málaga, a la Plataforma
  Andaluza de Bioinformática (PAB) y a la Red Española de Supercomputación, y opera el
  supercomputador Picasso. La UMA arrastra tradición en supercomputación desde los años noventa: el
  primer Picasso, un SGI Origin 2000, se instaló en 1997 y se ha ido renovando desde entonces. El 24
  % de la máquina está destinado a la RES. El centro ocupa el Edificio de Bioinnovación, en el
  Parque Tecnológico de Andalucía. El inventario técnico vigente publica 32 A100 y 16 B200 como
  recursos disponibles, sin fecha de corte ni día de puesta en producción de las B200.
estado_fuentes:
