  - id: src-7
    url: "https://mediambient.gva.es/auto/planes-accion-territorial/Proyectos%20Inter%C3%A9s%20Auton%C3%B3mico%20%28PIA%29/PIA%20Monforte%20del%20Cid%20-%20El%20Lobo/Memoria%20descriptiva.pdf"
    titulo: "Data Center «El Lobo» — Memoria descriptiva"
    editor: "Preval Renewable 2, S.L. (expediente PIA publicado por la Generalitat Valenciana)"
    tipo: oficial
    fecha_publicacion: "2025"
    fecha_consulta: "2026-08-31"
    cita: "El proyecto consiste en el desarrollo de un Edge data center modular y escalable en una superficie de aproximadamente 12.587 metros cuadrados, con una capacidad inicial de 10 MWs (dividida en módulos de 2-5 MW para flexibilidad) [...] PLANTA FOTOVOLTAICA (MWp) | 44,07 | PARQUE EÓLICO(MW) | 30,00 | SISTEMA DE ALMACENAMIENTO DE ENERGÍA (MW) | 10 | SISTEMA DE CAPACIDAD DE ALMACENAMIENTO (MWh) | 40 | DEMANDA PARA AUTOCINSUMO (MW) | 10. [...] El punto de conexión del proyecto lo proporciona la compañía eléctrica I-DE Redes Eléctricas Inteligentes en la ST «Petrel» con una tensión de 66 kV. [...] se utilizarán módulos en contenedores ISO estándar (1-2 MW cada uno), con racks de alta densidad (5-15 kW/rack), sistemas UPS redundantes (N+1), y refrigeración de precisión (RowCool o free-cooling) [...] En lo relativo al agua, se implementará un sistema de refrigeración mediante aire seco, que permite una reducción aproximada del 95 % en el consumo frente a los sistemas tradicionales basados en agua. [...] el proyecto representa una inversión total estimada entre 350 y 500 millones de euros [...] Directo: Se estima la creación de entre 200 y 250 puestos de trabajo [...] Indirecto: Se proyecta la creación de entre 350 y 450 empleos adicionales [...] Inducido: Se estima la generación de entre 250 y 300 puestos de trabajo adicionales [...] Total estimado: En conjunto, el proyecto podría generar entre 800 y 1.000 empleos a lo largo de los primeros cinco años de operación."
