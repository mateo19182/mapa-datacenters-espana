id: serosense-alcarras
nombre: "Serosense — Data Center de Alcarràs (Lleida)"
alias:
  - "Primer data center de Lleida"
tipo: edificio
operador: "Eléctrica Serosense"
propietario: "Eléctrica Serosense (grupo Visalia)"
modelo: desconocido

ubicacion:
  municipio: "Alcarràs"
  provincia: "Lleida"
  ccaa: "Cataluña"
  direccion: "Terrenos junto a la N-II, dentro de la zona regable del Canal de Pinyana, a unos 8 km de Lleida"
  precision: municipio
  fuentes: [src-1, src-2]

estado: en_tramitacion
estado_detalle: >-
  Serosense adquirió los terrenos en marzo de 2026. El suelo está clasificado
  como SUDI y requiere un plan parcial de delimitación, un proyecto de
  urbanización, el proyecto de reparcelación y una modificación del POUM antes de
  poder construir. El Ayuntamiento de Alcarràs se ha manifestado a favor.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: no_especificado
    valor_mw: 10
    ambito: edificio
    referencia: "Potencia inicial estimada"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-03"
    fuentes: [src-2, src-3]
    nota: >-
      La fuente habla de 'capacitat inicial de 10 MW' sin precisar tipo. Data
      Center Dynamics repite "una potencia inicial estimada en 10 MW, ampliable
      hasta los 30 MW", también sin tipificar.
  - tipo: no_especificado
    valor_mw: 30
    ambito: edificio
    referencia: "Potencia máxima ampliable"
    estado_asociado: anunciado
    fecha_dato: "2026-03"
    fuentes: [src-2, src-3]

superficie_construida_m2: 12000

empleo:
  - tipo: directo
    valor: 80
    referencia: "Estimación para la instalación en funcionamiento"
    fecha_dato: "2026-03"
    fuentes: [src-3, src-4]
    nota: >-
      La cifra es condicional en la fuente especializada: «podría generar en
      torno a 80 empleos directos, dependiendo del grado de automatización y de
      las necesidades operativas finales».

incertidumbres:
  - campo: potencia
    descripcion: >-
      La nota de la propia empresa no publica cifras de potencia ni superficie;
      los 12.000 m² y los 10-30 MW proceden de prensa. Ninguna fuente indica si
      son MW TI o de conexión.
    fuentes: [src-1, src-2]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      No hay calendario público. La propia empresa describe la iniciativa como
      "en fase inicial".
    fuentes: [src-1]
  - campo: refrigeracion
    descripcion: >-
      La ubicación en la zona regable del Canal de Pinyana se ha señalado en
      prensa como recurso de refrigeración, pero la empresa no ha publicado el
      sistema previsto ni consumos de agua. Data Center Dynamics lo formula como
      una ventaja del emplazamiento («facilita el acceso a recursos hídricos
      necesarios para la refrigeración»), no como un sistema declarado por la
      promotora. Por eso no se abre bloque `agua`.
    fuentes: [src-1, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

fuentes:
