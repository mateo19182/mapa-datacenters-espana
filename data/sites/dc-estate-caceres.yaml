estado: anunciado
estado_detalle: >-
  Uno de los emplazamientos españoles que EdgeMode controla mediante derechos de arrendamiento
  a largo plazo a través de la sociedad conjunta con Blackberry AIF. El 1 de julio de 2026
  EdgeMode firmó con Pure Data Centres Group (Oaktree, grupo Brookfield) un term sheet no
  vinculante para venderle su participación en los emplazamientos de Córdoba, Palma, Vianos y
  Cáceres, con 60 días de exclusividad y condicionado a obtener permisos, autorizaciones
  energéticas y un contrato de arrendamiento de capacidad con un hiperescalador. Expansión
  señala que Pure DC prevé desarrollar solo dos de los cuatro, previsiblemente Cáceres y
  Vianos. No consta expediente urbanístico ni ambiental abierto en Cáceres para este proyecto.
estado_fuentes: [src-1, src-2, src-3]

potencia:
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Potencia prevista para cada uno de los cuatro emplazamientos del acuerdo con Pure DC"
    estado_asociado: anunciado
    fecha_dato: "2026-07-13"
    fuentes: [src-1]
    nota: >-
      Expansión dice «que cada instalación tenga 300 megavatios (MW) de potencia» sin precisar
      si son MW IT o de conexión. El propio term sheet valora la operación «based on a 300MW
      data centre».

superficie_parcela_m2: 1000000
inversion_anunciada_eur: null
enlaces_proyecto: []

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Solo consta el municipio. No hay dirección, parcela ni referencia catastral publicadas, ni
      expediente administrativo localizable. Las coordenadas son el centroide municipal.
    fuentes: [src-1, src-2]
  - campo: operador
    descripcion: >-
      Es un proyecto distinto del Campus Data Center CC Green que Nostrum Group (antes
      Ingenostrum) promueve en el mismo municipio, en el ecopolígono Las Capellanías (ficha
      «ingenostrum-caceres-ccgreen»). Comparten municipio y nada más: distinto promotor,
      distinto suelo y distinta tramitación.
    fuentes: [src-1]
  - campo: estado
    descripcion: >-
      Todo el respaldo documental es societario y financiero —una sociedad instrumental inscrita
      en el Registro Mercantil y un preacuerdo de compraventa no vinculante— sin ningún trámite
      administrativo abierto en Extremadura. La ficha registra un proyecto anunciado, no una
      obra en marcha.
    fuentes: [src-1, src-2, src-4]
  - campo: superficie_parcela_m2
    descripcion: >-
      La superficie de 100 hectáreas procede de Baxtel, un directorio sectorial, no de una
      fuente primaria ni de un expediente.
    fuentes: [src-3]

confianza: baja
ultima_verificacion: "2026-08-31"

