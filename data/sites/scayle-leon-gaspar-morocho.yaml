id: scayle-leon-gaspar-morocho
nombre: "SCAYLE — nueva sede del Centro de Supercomputación de Castilla y León (León)"
alias:
  - "Centro de Supercomputación de Castilla y León"
  - "Supercomputador Caléndula"
tipo: edificio
operador: "Fundación Centro de Supercomputación de Castilla y León (SCAYLE)"
propietario: "Junta de Castilla y León"
cliente_ancla: null
modelo: corporativo

ubicacion:
  municipio: "León"
  provincia: "León"
  ccaa: "Castilla y León"
  direccion: "Calle Profesor Gaspar Morocho, junto al Centro Integrado de Formación Profesional Tecnológico Industrial y al Campus de Vegazana de la Universidad de León"
  lat: 42.6341451
  lon: -5.9714151
  precision: municipio
  fuentes: [src-1, src-3, src-osm]

estado: en_construccion
estado_detalle: >-
  SCAYLE es una entidad pública creada por la Junta de Castilla y León y la Universidad de
  León que opera el supercomputador Caléndula, hoy alojado en el Campus de Vegazana. La
  construcción de una nueva sede propia en la calle Profesor Gaspar Morocho se licitó en
  diciembre de 2023 para albergar el centro de procesamiento de datos, el supercomputador y
  las oficinas de gestión. La Junta situó el final de las obras en el último trimestre de
  2025; en marzo de 2026 los trabajos estaban en fase final, centrados en los sistemas de
  refrigeración, y la migración de los servicios de Caléndula había comenzado. La previsión
  oficial es que el centro esté plenamente operativo en la nueva sede en el primer semestre de
  2027, con una migración de aproximadamente un año presupuestada en 1,8 millones de euros.
estado_fuentes: [src-1, src-2, src-3, src-4]

potencia: []

inversion_anunciada_eur: null
refrigeracion: "Uno de los frentes principales de la obra son los sistemas de refrigeración necesarios para el supercomputador."
enlaces_proyecto:
  - "https://www.scayle.es/infraestructuras/"

computo:
  - tipo: cpu_hpc
    ambito: sistema
    sistema: "Caléndula"
    modelo: "Varias arquitecturas (Intel Xeon Platinum 8462Y y 8358, AMD EPYC 9374F, NVIDIA Grace)"
    unidades: 300
    tipo_unidad: nodo
    rendimiento: 6.7
    rendimiento_unidad: pflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-manual]
    nota: >-
      Cifra global del supercomputador, con 308 TB de memoria RAM. Manda sobre la suma de las
      particiones registradas abajo. El equipo está hoy en el Campus de Vegazana y migra a esta
      sede, así que la cifra describe la máquina, no todavía el edificio.
  - tipo: gpu
    ambito: sistema
    sistema: "Caléndula"
    unidades: 181
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-scayle]
    nota: >-
      Recuento agregado que publica SCAYLE para el clúster actual, sin desglose por modelo, junto
      a 18.000 núcleos y 7 PFlop/s. Es la cifra de ámbito sistema; las particiones de abajo la
      detallan parcialmente y no se suman a ella.
  - tipo: gpu
    sistema: "Caléndula — arquitectura AMD Genoa"
    modelo: "NVIDIA H100 SXM5 de 80 GB, 4 por servidor en 35 servidores AMD EPYC 9374F"
    unidades: 140
    tipo_unidad: acelerador
    nodos: 35
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-manual]
    nota: >-
      Es el núcleo del servicio avanzado de IA del centro: soporta entrenamiento distribuido y
      cargas intensivas de inferencia de modelos de lenguaje abiertos.
  - tipo: gpu
    sistema: "Caléndula — arquitectura Intel Ice Lake"
    modelo: "NVIDIA Tesla A100 de 40 GB, 1 por servidor en 26 servidores Intel Xeon Platinum 8358"
    nodos: 26
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-manual]
    nota: >-
      El recuento total no lo publica la fuente, que solo da servidores y tarjetas por servidor.
      Este equipamiento previo se ha reorientado a formación y pruebas de concepto.
  - tipo: gpu
    sistema: "Caléndula — arquitectura Intel Cascade Lake y Broadwell"
    modelo: "NVIDIA Tesla V100: 1 por servidor en 7 servidores Cascade Lake y 8 NVLink en un servidor Broadwell"
    nodos: 8
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-manual]
    nota: "La fuente no publica el total de tarjetas V100 y aquí no se deduce."
  - tipo: cpu_hpc
    sistema: "Caléndula — arquitectura NVIDIA Grace"
    modelo: "NVIDIA Grace CPU Superchip de 144 núcleos"
    unidades: 1
    tipo_unidad: procesador
    nodos: 1
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-manual]
    nota: null

incertidumbres:
  - campo: potencia
    descripcion: >-
      SCAYLE no publica potencia eléctrica, superficie de sala técnica ni número de racks de la
      nueva sede. La página de infraestructuras describe salas IT, racks de alta densidad y
      alimentación redundante sin ninguna cifra. Campo de potencia vacío.
    fuentes: [src-5]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Las cifras publicadas del edificio no coinciden: la propia SCAYLE hablaba en diciembre de
      2023 de una inversión prevista superior a 3,6 millones de euros, leonoticias de 3,1
      millones en marzo de 2024 y la Junta de «cerca de 3 millones» en marzo de 2025. A ello se
      suman 1,8 millones para la migración. No se registra ninguna como cifra única.
    fuentes: [src-1, src-2, src-4]
  - campo: ubicacion
    descripcion: >-
      El emplazamiento registrado es la nueva sede en construcción. Mientras dure la migración,
      el equipamiento sigue en las instalaciones actuales del Campus de Vegazana, en el mismo
      municipio. Las coordenadas son el centroide municipal de León.
    fuentes: [src-3, src-osm]

confianza: media
