estado: en_construccion
estado_detalle: >-
  SCAYLE es una entidad pública creada por la Junta de Castilla y León y la Universidad de
  León que opera el supercomputador Caléndula, hoy alojado en el Campus de Vegazana. La
  construcción de una nueva sede propia en la calle Profesor Gaspar Morocho se licitó en
  diciembre de 2023 para albergar el centro de procesamiento de datos, el supercomputador y
  las oficinas de gestión. La Junta situó el final de las obras en el último trimestre de
  2025; en marzo de 2026 los trabajos estaban en fase final, centrados en los sistemas de
  refrigeración, y la migración de los servicios de Caléndula había comenzado. La previsión
  oficial es que el centro esté plenamente operativo en la nueva sede en el primer semestre de
  2027, con una migración de aproximadamente un año presupuestada en 1,8 millones de euros.
estado_fuentes: [src-1, src-2, src-3, src-4]

potencia: []

inversion_anunciada_eur: null
refrigeracion: "Uno de los frentes principales de la obra son los sistemas de refrigeración necesarios para el supercomputador."
enlaces_proyecto:
  - "https://www.scayle.es/infraestructuras/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      SCAYLE no publica potencia eléctrica, superficie de sala técnica ni número de racks de la
      nueva sede. La página de infraestructuras describe salas IT, racks de alta densidad y
      alimentación redundante sin ninguna cifra. Campo de potencia vacío.
    fuentes: [src-5]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Las cifras publicadas del edificio no coinciden: la propia SCAYLE hablaba en diciembre de
      2023 de una inversión prevista superior a 3,6 millones de euros, leonoticias de 3,1
      millones en marzo de 2024 y la Junta de «cerca de 3 millones» en marzo de 2025. A ello se
      suman 1,8 millones para la migración. No se registra ninguna como cifra única.
    fuentes: [src-1, src-2, src-4]
  - campo: ubicacion
    descripcion: >-
      El emplazamiento registrado es la nueva sede en construcción. Mientras dure la migración,
      el equipamiento sigue en las instalaciones actuales del Campus de Vegazana, en el mismo
      municipio. Las coordenadas son el centroide municipal de León.
    fuentes: [src-3, src-osm]

confianza: media
ultima_verificacion: "2026-08-31"

