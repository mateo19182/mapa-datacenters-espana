  precision: municipio
  fuentes: [src-1, src-2, src-osm]

estado: en_tramitacion
estado_detalle: >-
  El promotor, DC Estate Vianos, S.L., presentó al Gobierno de Castilla-La Mancha el documento
  inicial del proyecto y en junio de 2026 la Junta abrió el trámite de consultas previas de
  cara al estudio de impacto ambiental. El proyecto deberá superar una evaluación de impacto
  ambiental ordinaria y obtener después una autorización ambiental integrada. El diseño
  contempla dos edificios principales y generación propia con turbinas de gas natural más
  fotovoltaica en cubierta, sin conexión a la red de transporte. La plataforma Pueblos Vivos
  del Segura y Ecologistas en Acción anunciaron alegaciones y califican el proyecto de
  inviable y especulativo. En julio de 2026 EdgeMode firmó con Pure Data Centres Group
  (Oaktree/Brookfield) un term sheet no vinculante para venderle su participación en este y
  otros tres emplazamientos españoles.
estado_fuentes: [src-1, src-2, src-3]

potencia:
  - tipo: it
    valor_mw: 300
    ambito: campus
    referencia: "Potencia IT del complejo según el documento inicial presentado a la Junta"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-06"
    fuentes: [src-1]
    nota: "La fuente dice literalmente «un complejo de 300 megavatios (MW) de potencia IT»."
  - tipo: generacion_asociada
    valor_mw: 62
    ambito: campus
    referencia: "Cada una de las ocho turbinas de gas natural previstas en el emplazamiento"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-06"
    fuentes: [src-1]
    nota: >-
      La fuente da la potencia unitaria («ocho turbinas de gas natural, con unos 62 MW cada
      una») y no un total. No se multiplica ni se suma: es capacidad de generar, no del centro.
  - tipo: generacion_asociada
    valor_mw: 60
    ambito: campus
    referencia: "Instalación fotovoltaica en cubierta"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-06"
    fuentes: [src-1]
    nota: "Generación asociada al emplazamiento, no capacidad del centro de datos."
  - tipo: no_especificado
    valor_mw: 360
    ambito: campus
    referencia: Capacidad prevista por emplazamiento en el MD&A del 10-Q a 30 de junio de 2026
    estado_asociado: anunciado
    fecha_dato: 2026-06-30
    fuentes:
      - src-sec-10q-20260814
    nota: El MD&A enumera cinco arrendamientos, incluido este emplazamiento, y prevé 360 MW por sitio.
      No tipifica carga IT ni acredita capacidad entregada. Es una lectura distinta de los 300 MW
      del nombre de la sociedad y de la previsión separada de una instalación de generación de 360
      MW.
superficie_parcela_m2: 988000
superficie_construida_m2: null
inversion_anunciada_eur: null
refrigeracion: "Free-cooling por aire, descrito por el promotor como de alta eficiencia y baja demanda hídrica."
enlaces_proyecto: []

agua:
  circuito: sin_agua
  sistema: "Refrigeración free-cooling por aire exterior, sin sistemas mecánicos activos como base del diseño."
  origen: null
  nota: >-
    El documento inicial del promotor afirma que el proyecto «no se concibe como una
    instalación dependiente del agua» y restringe su uso a necesidades sanitarias, limpieza y
    requerimientos operacionales puntuales, sin prever vertidos industriales significativos. No
    aporta ninguna cifra de consumo. Es una afirmación del promotor en fase preliminar, todavía
    no verificada por el órgano ambiental.
  fuentes: [src-2]

incertidumbres:
  - campo: estado
    descripcion: >-
      El proyecto está en consultas previas, la fase más temprana de la evaluación ambiental.
      No hay estudio de impacto ambiental, ni autorización ambiental integrada, ni licencia
      urbanística. Los colectivos que se oponen señalan que no hay gasoducto de alta presión en
      la zona y que haría falta un ramal de unos 90 kilómetros para alimentar las turbinas.
    fuentes: [src-2]
  - campo: propietario
    descripcion: "La titularidad puede cambiar: el acuerdo con Pure DC es un term sheet no vinculante
      con 60 días de exclusividad, condicionado a permisos y a un contrato con un hiperescalador.
      Expansión añade que Pure DC prevé descartar dos de los cuatro emplazamientos, y que Vianos y
      Cáceres son los que espera desarrollar. La nota 1 del 10-Q a 30 de junio de 2026 establece una
      JV 50,1%/49,9% desde el 22 de enero, que sustituye el reparto histórico 75%/25%. Los activos
      documentados son participaciones en sociedades y derechos de arrendamiento, no la adquisición
      de un CPD construido."
    fuentes:
      - src-3
      - src-4
      - src-sec-jv-20260630
  - campo: superficie_parcela_m2
    descripcion: >-
      Cadena SER cifra la superficie en cerca de 988.000 m² de suelo rústico; elDiario.es habla
      de «más de un centenar de hectáreas». Se registra la cifra más precisa publicada.
    fuentes: [src-1, src-2]
  - campo: superficie_parcela_m2
    descripcion: El 10-Q describe arrendamientos de 100 hectáreas para cada sociedad, incluida Vianos.
      Es una cifra redondeada compatible con los 988.000 m² del proyecto recogidos por la prensa,
      pero no sustituye una delimitación parcelaria del documento ambiental.
    fuentes:
      - src-1
      - src-sec-jv-20260630
  - campo: potencia
    descripcion: El MD&A del 10-Q prevé 360 MW por cada uno de los cinco sitios, mientras los nombres de
      las sociedades incluyen 300 MW. No explica el cambio ni si se refiere a carga IT o potencia
      eléctrica total. Se conservan ambas lecturas y la generación separada, sin sumarlas ni
      contarlas como operativas.
    fuentes:
      - src-sec-jv-20260630
      - src-sec-10q-20260814
confianza: baja
