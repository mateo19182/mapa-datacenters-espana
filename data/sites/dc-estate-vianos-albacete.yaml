  sociedad promotora local
cliente_ancla: null
modelo: mayorista

ubicacion:
  municipio: "Vianos"
  provincia: "Albacete"
  ccaa: "Castilla-La Mancha"
  direccion: "Suelo rústico de uso agrario al borde de la N-322, en la Sierra de Alcaraz"
