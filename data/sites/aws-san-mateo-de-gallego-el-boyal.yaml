id: aws-san-mateo-de-gallego-el-boyal
nombre: "AWS Consolidación Región Aragón — San Mateo de Gállego «El Boyal»"
alias:
  - "Campus AWS San Mateo de Gállego"
  - "Sector El Boyal"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "San Mateo de Gállego"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Nuevo sector urbanístico «El Boyal», coincidente en parte con el sector urbanizable «El Saboyal», a 1,2 km al sureste del casco urbano"
  lat: 41.831366
  lon: -0.766154
  precision: municipio
  fuentes: [src-1, src-2]

estado: anunciado
estado_detalle: >-
  Uno de los tres campus del "Plan para la consolidación de la Región AWS en Aragón",
  declarado inversión de interés autonómico con interés general de Aragón por Acuerdo del
  Gobierno de Aragón de 25 de marzo de 2026. El plan se materializará mediante un Plan de
  Interés General de Aragón todavía no aprobado inicialmente a la fecha de verificación.
  La Dirección General de Energía y Minas informó favorablemente la fase 1 de San Mateo de
  Gállego, condicionando la fase 2 a la existencia de capacidad eléctrica.
estado_fuentes: [src-1]

potencia: []

fases:
  - nombre: "Fase 1"
    estado: anunciado
    fuentes: [src-1]
    nota: >-
      Informe favorable de la Dirección General de Energía y Minas de 6 de marzo de 2026
      para la fase 1; la fase 2 queda condicionada a la existencia de capacidad eléctrica.
  - nombre: "Fase 2"
    estado: anunciado
    fuentes: [src-1]

conexion_electrica:
  subestacion: "SE Peñaflor (dos estaciones de medida en el término municipal de Villamayor de Gállego)"
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1]
  nota: >-
    "Se proyectan dos estaciones de medida conectadas a la SET Peñaflor para dar servicio a
    la actuación en San Mateo de Gállego, que se localizan en el término municipal
    Villamayor de Gállego": una ocupa 4,9 ha y la otra 6,4 ha. No consta tensión ni potencia
    de acceso.

superficie_parcela_m2: 2941300
inversion_anunciada_eur: null
enlaces_proyecto: []

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Las coordenadas registradas son el centroide municipal de San Mateo de Gállego
      (Wikidata); el ámbito real se sitúa a 1,2 km al sureste del casco urbano.
    fuentes: [src-2]
  - campo: potencia
    descripcion: >-
      El Acuerdo no publica ninguna cifra de potencia por emplazamiento. Solo consta un
      informe favorable condicionado de la Dirección General de Energía y Minas.
    fuentes: [src-1]

  - campo: empleo
    descripcion: >-
      El Acuerdo de 25 de marzo de 2026 no publica ninguna cifra de empleo ni de inversión
      por emplazamiento. Las únicas cifras que da son del conjunto de la inversión de AWS:
      33.700 millones de euros en la Región de AWS en España durante 2026-2035, una media
      anual de 29.900 empleos a tiempo completo en España de los que unos 13.400 estarían en
      Aragón, y 6.700 empleos anuales directos en España (4.200 en Aragón). No se registran
      en «empleo» ni en «inversion_anunciada_eur» porque atribuirlas a este emplazamiento
      —uno de los once de AWS en Aragón— multiplicaría la misma cifra por cada ficha.
    fuentes: [src-3]
  - campo: agua
    descripcion: >-
      Ninguna fuente publica consumo de agua, sistema de refrigeración ni origen del recurso
      para este emplazamiento. El Acuerdo se limita a mencionar que el plan comprende "las
      conexiones externas para infraestructuras de agua y energía". El expediente ambiental
      todavía no se ha tramitado.
    fuentes: [src-3]

confianza: media
ultima_verificacion: "2026-08-31"

fuentes:
