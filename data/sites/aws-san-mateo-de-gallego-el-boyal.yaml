    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1442795570404"
    titulo: "ORDEN PEJ/523/2026, de 7 de abril, por la que se da publicidad al Acuerdo de 25 de marzo de 2026, del Gobierno de Aragón, por el que se declara como inversión de interés autonómico con interés general de Aragón del «Plan para la consolidación de la Región AWS en Aragón», promovido por Amazon Data Services Spain SL, para la implantación de tres campus de centros de datos en los municipios de Huesca, La Puebla de Híjar y Azaila (Teruel) y San Mateo de Gállego (Zaragoza)"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
