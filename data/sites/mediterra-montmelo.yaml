id: mediterra-montmelo
nombre: "Mediterra DataCenters BCN01 — Montmeló"
alias:
  - "Mediterra Barcelona"
  - "Mediterra BCN01"
tipo: edificio
operador: "Mediterra DataCenters"
propietario: "Mediterra DataCenters (respaldada por DWS Infrastructure)"
modelo: mayorista

ubicacion:
  municipio: "Montmeló"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  precision: municipio
  fuentes: [src-1, src-3]

estado: en_construccion
estado_detalle: >-
  Instalación de 9.700 m² con diseño modular orientado a cargas de IA y HPC de alta densidad. La
  compañía italiana anunció la compra de los terrenos el 17 de febrero de 2026 y declaró tener ya
  las aprobaciones necesarias. Baxtel y la propia compañía sitúan la puesta en servicio en el
  segundo semestre de 2027. El BOP de 29 de septiembre de 2026 publica el acuerdo municipal de 28 de
  julio para una concesión de subsuelo de la conexión eléctrica. El acuerdo queda sometido a 30 días
  hábiles de información pública y solo devendrá definitivo si no hay alegaciones; no es un acta de
  obra del CPD ni una apertura.
estado_fuentes: [ src-1, src-2, src-3, src-4, src-bop-concesion-20260929 ]

potencia:
  - tipo: conexion_red
    valor_mw: 12
    ambito: edificio
    referencia: "Conexión eléctrica asegurada en el emplazamiento"
    estado_asociado: en_construccion
    fecha_dato: "2026-02-18"
    fuentes: [src-2]
    nota: >-
      La fuente dice "a 12MW electrical connection, of which 8MW will be
      allocated to IT capacity".
  - tipo: it
    valor_mw: 8
    ambito: edificio
    referencia: "Capacidad TI prevista"
    estado_asociado: en_construccion
    fecha_dato: "2026-02-18"
    fuentes: [src-2]
    nota: >-
      Misma fuente: de los 12 MW de conexión, 8 MW se destinan a capacidad TI.
      La ficha de producto de la propia compañía llama a esos 8 MW "Installed
      electricity", entregados en bloques de 1,3 MW.
  - tipo: no_especificado
    valor_mw: 8
    ambito: edificio
    referencia: "«Installed electricity» según la ficha de producto de Mediterra"
    estado_asociado: en_construccion
    fecha_dato: "2026-02-16"
    fuentes: [src-3]
    nota: >-
      La compañía escribe "Installed electricity 8 MW delivered in 1.3 MW
      blocks". Es la misma cifra que el registro anterior con otra etiqueta, no
      capacidad adicional; se conserva porque las dos fuentes la tipifican
      distinto.

conexion_electrica:
  mw_concedidos: null
  nota: Prensa especializada describe el emplazamiento como asegurado con una conexión eléctrica de 12
    MW. No consta la subestación, la tensión ni el titular de la red. La concesión municipal cita la
    subestación de Montmeló y el cruce del río Congost por el puente de la calle Tres Creus. No
    publica tensión, MW ni permiso de acceso y no resuelve los 12 MW que solo cita la prensa. La
    expresión comercial «secured connection» no permite acreditar por sí sola un permiso
    administrativo otorgado; los 12 MW quedan como lectura documental, sin rellenar mw_concedidos.
  fuentes: [ src-2, src-bop-concesion-20260929 ]
  subestacion: Subestación de Montmeló, según el expediente de ocupación de subsuelo

superficie_construida_m2: 9700
refrigeracion: >-
  Refrigeración líquida con circuito cerrado de bajo consumo de agua, energía
  renovable, grupos de respaldo con HVO100 y sistema de exportación de calor
  residual a servicios públicos locales. La compañía describe un circuito cerrado
  con refrigerante que no se expulsa ni se repone.

agua:
  circuito: sin_agua
  sistema: >-
    Circuito cerrado con refrigerante que, según la compañía, elimina el consumo
    de agua; compatible además con refrigeración líquida para alta densidad.
  origen: null
  nota: "No se publican consumos de agua auxiliar ni WUE."
  fuentes: [src-2, src-3]

incertidumbres:
  - campo: potencia
    descripcion: >-
      Data Center Dynamics presenta los 8 MW como capacidad TI dentro de una
      conexión de 12 MW; la ficha de producto de Mediterra los presenta como
      "Installed electricity" y no menciona los 12 MW. No se ha podido
      determinar cuál de las dos etiquetas es la correcta.
    fuentes: [src-2, src-3]
  - campo: ubicacion
    descripcion: La concesión de subsuelo identifica los tramos de conexión entre la subestación de
      Montmeló, el puente de Tres Creus y el centro de recepción y medida, pero no identifica la
      parcela del edificio CPD. Se mantienen coordenadas de municipio, hasta localizar un plano o un
      pin del centro físico.
    fuentes: [ src-1, src-4, src-bop-concesion-20260929 ]

confianza: media
