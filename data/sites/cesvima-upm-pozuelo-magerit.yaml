incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES ni CeSViMa publican potencia eléctrica, carga TI ni superficie de la sala
      técnica. Campo de potencia vacío.
    fuentes: [src-res, src-cesvima-magerit]
  - campo: computo
    descripcion: >-
      Las dos fuentes discrepan sobre la misma máquina. CeSViMa publica 5.024 núcleos y 575,80
      TFLOPS de Rpeak; la ficha del nodo en la RES, 120 nodos con 5.184 núcleos y 370,5 TFlop/s
      de pico. La diferencia de rendimiento no se explica por el porcentaje cedido a la red, que
      la propia ficha da aparte. Se registra la cifra del centro y se conserva el choque.
    fuentes: [src-res, src-cesvima-magerit]

