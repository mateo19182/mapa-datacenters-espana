estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial. CeSViMa se creó a finales de 2004 en el Campus de Montegancedo de la
  Universidad Politécnica de Madrid para atender las necesidades de cálculo intensivo de la
  universidad, y opera el supercomputador Magerit. Fue uno de los nodos fundadores de la Red
  Española de Supercomputación en 2007, la abandonó en diciembre de 2018 tras más de una década
  y volvió a incorporarse en abril de 2026, aportando 370,5 TFlop/s a las convocatorias
  competitivas de la red. El 38,72 % de la máquina se destina a la RES.
estado_fuentes: [src-res, src-cesvima-magerit]
