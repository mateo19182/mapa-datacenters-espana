incertidumbres:
  - campo: potencia
    descripcion: >-
      DataRush no publica potencia, superficie de sala técnica ni número de racks de ninguno de
      sus centros. Baxtel mantiene los campos de potencia y superficie ocultos tras registro.
    fuentes: [src-2]
  - campo: ubicacion
    descripcion: >-
      La calle procede de directorios sectoriales (Baxtel y datacenters.com), no de la compañía.
      Las coordenadas registradas son el centroide municipal de Málaga.
    fuentes: [src-2, src-4, src-osm]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      No consta la fecha exacta. En junio de 2024 la compañía hablaba de «más de una década en
      operación» y de doce años de trayectoria del grupo, lo que situaría la apertura en torno a
      2012-2014.
    fuentes: [src-1]

confianza: baja
