estado: operativo
estado_detalle: >-
  Primer centro de datos propio del grupo malagueño DataRush. En junio de 2024, cuando la
  compañía inauguró su segundo centro en la misma ciudad, describía este como en operación
  desde hacía más de diez años y conectado con el nuevo. Es una instalación neutral de
  colocation orientada a alojamiento de servidores, hosting, virtualización y copia de
  seguridad para pymes.
estado_fuentes: [src-1, src-2, src-3]

