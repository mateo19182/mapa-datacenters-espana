id: adi-abanto-zierbena-data-center-euskadi
nombre: "ADI Data Center Euskadi — Abanto-Zierbena"
alias:
  - "Atlantic Data Infrastructure (ADI)"
  - "Data Center Euskadi (DCE)"
  - "ADI Abanto"
tipo: edificio
operador: "Atlantic Data Infrastructure (ADI Data Center Euskadi)"
propietario: "Atlantic Data Infrastructure, S.A."
modelo: colocation

ubicacion:
  municipio: "Abanto y Ciérvana-Abanto Zierbena"
  provincia: "Bizkaia"
  ccaa: "País Vasco"
  direccion: "Campus Ezkerraldea-Meatzaldea del Parque Científico y Tecnológico de Bizkaia (entorno del Energy Intelligence Center), Abanto-Zierbena"
  lat: 43.3130
  lon: -3.0770
  precision: aproximada
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Primera piedra el 6 de noviembre de 2023 con presencia del Lehendakari. En
  noviembre de 2024 la prensa económica vasca situaba la entrada en funcionamiento
  en marzo de 2025. Es el primero de los dos centros del proyecto ADI; el segundo
  se construye en Arrasate (ficha adi-arrasate-garaia). En enero de 2026 la prensa
  económica vasca lo describe como «centro de datos activo en Abanto con una
  capacidad de 2MW». El Gobierno Vasco concedió a Data Center Euskadi, S.L. la
  autorización ambiental única (expediente AAU01497), solicitada el 13 de octubre de
  2025, que describe el inmueble como centro de datos de colocación con planta
  primera destinada a espacio IT y equipos de climatización en cubierta.
estado_fuentes: [src-1, src-2, src-4, src-5, src-6]

potencia:
  - tipo: no_especificado
    valor_mw: 2
    ambito: edificio
    referencia: "Capacidad del centro de datos activo en Abanto"
    estado_asociado: operativo
    fecha_dato: "2026-01-10"
    fuentes: [src-4]
    nota: >-
      La fuente dice «un centro de datos activo en Abanto con una capacidad de 2MW»,
      sin precisar si es carga TI, potencia instalada o potencia de conexión. El
      Parque Tecnológico Garaia y Crónica Vasca coinciden en la misma cifra, también
      sin tipificarla. La autorización ambiental única no publica ninguna potencia
      eléctrica del centro.
  - tipo: termica_respaldo
    valor_mw: 4.56
    ambito: edificio
    referencia: "Cada uno de los cuatro grupos electrógenos de emergencia"
    estado_asociado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-5]
    nota: >-
      La autorización ambiental única cataloga cuatro focos (G1 a G4) como
      instalaciones de combustión mediana de 4,56 MWt de potencia térmica nominal
      cada uno. Es potencia de respaldo declarada en el expediente ambiental, no
      capacidad del centro de datos.

superficie_parcela_m2: 11013.91
superficie_construida_m2: 4369.52
inversion_anunciada_eur: 25000000

agua:
  circuito: desconocido
  sistema: >-
    La autorización ambiental única solo describe que los equipos de climatización se
    sitúan en la planta cubierta del edificio; no identifica la tecnología ni si el
    circuito consume agua.
  origen: "Red municipal; saneamiento separativo de pluviales y sanitarias"
  nota: >-
    La autorización ambiental única indica que la actividad consume agua de la red
    municipal y produce vertidos de aguas sanitarias y de limpieza, pero no cifra el
    consumo ni describe el sistema de refrigeración, más allá de situar los equipos
    de climatización en la planta cubierta.
  fuentes: [src-5]

empleo:
  - tipo: directo
    valor: 30
    referencia: "Puestos creados por el centro de Abanto"
    fecha_dato: "2026-04"
    fuentes: [src-7]
    nota: null

enlaces_proyecto:
  - "https://www.euskadi.eus/gobierno-vasco/-/noticia/2023/el-lehendakari-asiste-colocacion-primera-piedra-adi-data-center-gran-centro-datos-zona-atlantica/"
  - "https://www.euskadi.eus/contenidos/anuncio_tablon/inf_3516842/es_def/adjuntos/AAU01497_SOL_2025_001_RES.pdf"

incertidumbres:
  - campo: potencia
    descripcion: >-
      El único dato localizado es «2MW» de capacidad activa (Crónica Vasca, enero de
      2026), sin tipo. Ni el Gobierno Vasco ni la sociedad publican carga TI ni
      potencia de conexión.
    fuentes: [src-1, src-4]
  - campo: estado
    descripcion: >-
      No se ha localizado nota oficial de inauguración ni de puesta en servicio. La
      última fecha documentada es la previsión de marzo de 2025.
    fuentes: [src-2]
  - campo: propietario
    descripcion: >-
      Accionariado cambiante. En diciembre de 2024 el Parque Tecnológico Garaia
      publicó la composición completa de Data Center Euskadi, S.L.: Gobierno Vasco,
      Teknei, Dominion, Euskaltel, Gertek, Kutxabank, Iberdrola, MONDRAGON, Seed
      Capital Bizkaia y Seed Gipuzkoa. No se ha localizado el reparto de porcentajes.
    fuentes: [src-2, src-6]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 25 M€ corresponden al primer centro (Abanto-Zierbena) según Crónica Vasca.
      Ese mismo grupo de fuentes menciona 4,5 M€ de subvenciones públicas vascas
      (Gauzatu e Indartu) que no se suman a la inversión privada.
    fuentes: [src-2, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

