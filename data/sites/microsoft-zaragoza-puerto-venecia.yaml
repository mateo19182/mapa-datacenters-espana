id: microsoft-zaragoza-puerto-venecia
nombre: "Microsoft Región Aragón — Campus Zaragoza (Área 88/3, Puerto Venecia)"
alias:
  - "Nuevo Campus de Centros de Datos Microsoft Zaragoza"
  - "PIGA Región MSFT — ámbito Zaragoza"
tipo: campus
operador: "Microsoft"
propietario: "Microsoft 7724 Spain, S.L.U."
modelo: hyperscale

ubicacion:
  municipio: "Zaragoza"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Nuevo sector delimitado sobre suelo urbanizable no delimitado del Área 88/3 del PGOU de Zaragoza, contiguo al sector SUZ 88/3-1 «Puerto Venecia»"
  lat: 41.65
  lon: -0.883333
  precision: municipio
  fuentes: [src-1, src-4]

estado: en_tramitacion
estado_detalle: >-
  Declarado inversión de interés autonómico con interés general de Aragón el 28 de febrero
  de 2025. Integrado en el PIGA "Implantación de la Región Microsoft en Aragón", aprobado
  inicialmente el 14 de noviembre de 2025 y modificado el 24 de julio de 2026 para
  incorporar el estudio de impacto ambiental del proyecto de urbanización.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: conexion_red
    valor_mw: 50
    ambito: campus
    referencia: "Potencia de acceso a red asegurada para la primera fase"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-11-19"
    fuentes: [src-3, src-7]
    nota: "Dato de prensa; no confirmado por fuente oficial."
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Objetivo de potencia por planta en segunda fase"
    estado_asociado: anunciado
    fecha_dato: "2025-11-19"
    fuentes: [src-3, src-7]
    nota: "Dato de prensa, sin precisar tipo de potencia."

fases:
  - nombre: "Fase 1"
    estado: en_tramitacion
    fuentes: [src-3]

conexion_electrica:
  subestacion: "Subestación propia en el campus (132 kV, previsto paso a 220 kV en segunda fase); dos conexiones a la subestación de Torrero-Valdeconsejo"
  tension_kv: 132
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1, src-3]
  nota: >-
    El PIGA describe la conexión de infraestructura eléctrica exterior de alta tensión en
    dos tramos dentro del término municipal de Zaragoza: uno subterráneo de 1.715 m y otro
    aéreo de unos 16 m.

superficie_parcela_m2: 552700
inversion_anunciada_eur: 1443329286
refrigeracion: >-
  Refrigeración líquida recirculada en circuito cerrado, sin torres de evaporación.

agua:
  circuito: cerrado
  sistema: >-
    Refrigeración líquida recirculada en circuito cerrado que enfría directamente los chips.
    Según la compañía, no depende de torres de evaporación ni de aportes continuos de agua:
    "una vez que el sistema se llena durante la construcción, el agua circula de manera
    continua entre los servidores y los equipos de refrigeración sin necesidad de suministro
    adicional". El agua de lluvia de las cubiertas se recoge para usos no potables.
  origen: null
  nota: >-
    La documentación del PIGA cifra en 3.975 m³/año la demanda industrial a plena capacidad a partir del segundo año de operación y en 27.717 m³ el llenado inicial del circuito el primer año, pero lo hace para los TRES campus de Microsoft en Aragón conjuntamente. No se registra consumo por emplazamiento porque repartir esa cifra exigiría una clave de reparto que no consta. El Acuerdo de declaración de interés autonómico recoge además el compromiso corporativo de "Impacto positivo en Agua (Water positive)" para 2030.
  fuentes: [src-5]

energia:
  - consumo_gwh_ano: 3100
    referencia: "Consumo eléctrico máximo anual previsto para el campus de Zaragoza (Área 88/3, Puerto Venecia)"
    fecha_dato: "2025-11-19"
    fuentes: [src-8]
    nota: >-
      Cifra de la documentación del PIGA conocida a través de prensa. Es un máximo, no una
      previsión central: la fuente subraya que el campus por sí solo podría requerir más
      energía que toda la ciudad de Zaragoza, cuyo consumo en 2023 fue de 3.004 GWh. Sumada
      a las de La Muela (3.700 GWh/año) y Villamayor de Gállego (3.777 GWh/año), la misma
      fuente da más de 10.500 GWh/año para los tres campus.

empleo:
  - tipo: construccion
    valor: 2000
    referencia: "Extremo superior de la horquilla de trabajadores necesarios para completar el desarrollo del campus (entre 1.000 y 2.000, con una media anual aproximada de 300-400)"
    fecha_dato: "2025-03-24"
    fuentes: [src-6]
    nota: >-
      La memoria da una horquilla de 1.000 a 2.000 trabajadores; se registra el extremo
      superior y se advierte del rango en lugar de promediarlo. La media anual estimada es de
      300 a 400 empleos.
  - tipo: directo
    valor: 300
    referencia: "Empleos fijos previstos en la fase operativa del campus"
    fecha_dato: "2025-03-24"
    fuentes: [src-6]
    nota: "La memoria dice «hasta 300», es decir, un techo, no una previsión central."
enlaces_proyecto:
  - "https://www.aragon.es/-/piga-microsoft"

incertidumbres:
  - campo: superficie_parcela_m2
    descripcion: >-
      El PIGA distingue 55,27 ha de sector y 43,11 ha de parcela neta de uso productivo del
      campus. Se registra la superficie del sector.
    fuentes: [src-1]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Suma de los dos conceptos que el PIGA desglosa para Zaragoza (1.421.466.768,40 € de
      obras en el campus y 21.862.517,82 € de urbanización).
    fuentes: [src-1]
  - campo: agua
    descripcion: >-
      La única cifra publicada de consumo de agua —3.975 m³/año a plena capacidad y
      27.717 m³ de llenado inicial— es conjunta para los tres campus de Microsoft en Aragón
      y llega a través de prensa, que la atribuye a la documentación del PIGA. No se ha
      localizado en abierto el estudio de impacto ambiental de cada campus, sometido a
      información pública en agosto de 2026, que debería dar el desglose por emplazamiento.
    fuentes: [src-5]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas registradas son el centroide municipal de Zaragoza; el ámbito real
      está junto a Puerto Venecia, en el sur de la ciudad.
    fuentes: [src-4]

  - campo: energia
    descripcion: >-
      Las dos magnitudes eléctricas de esta ficha no pueden ser ciertas a la vez. Un consumo de
      3.100 GWh/año exige una potencia media sostenida de 354 MW durante las 8.760 horas del
      año (3100 GWh ÷ 8.760 h), por encima del techo de 300 MW que la propia ficha registra para
      el campus, y muy por encima de los 50 MW asegurados. La contradicción se agrava con la
      salvedad que acompaña a los 300 MW en la documentación del PIGA: «no se prevé que todos los
      edificios funcionen simultáneamente a esa capacidad», lo que sitúa la potencia media por
      debajo de 300 MW, no en 354.

      Las dos cifras están transcritas correctamente y se atribuyen a la misma documentación del
      PIGA a través de prensa, de modo que la incoherencia está en la fuente y no en el registro. No
      se corrige ninguna de las dos ni se deriva una tercera: falta el documento original —el
      estudio de impacto ambiental por emplazamiento, en información pública desde agosto de 2026—
      para saber si el desajuste viene de un techo de potencia mayor que el publicado, de un consumo
      que corresponde a un alcance distinto, o de un error de la propia memoria.
    fuentes: [src-8, src-3, src-piga-hoyaragon]

confianza: media
