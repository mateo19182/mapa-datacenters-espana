incertidumbres:
  - campo: estado
    descripcion: >-
      Los tres artículos que sostienen esta ficha están tras muro de pago y solo han podido
      leerse título, subtítulo y primer párrafo. De ahí se desprende que la cesión fue revocada y
      luego cuestionada por el TAN, pero no si Acciona mantiene el proyecto en otra parcela.
    fuentes: [src-1, src-2, src-3]
  - campo: potencia
    descripcion: "No hay ninguna cifra de potencia, superficie construida ni inversión publicada."
    fuentes: [src-1]
  - campo: operador
    descripcion: >-
      Acciona aparece como solicitante de la cesión del suelo. No consta que vaya a operar la
      instalación ni quién sería el cliente.
    fuentes: [src-1, src-3]
  - campo: superficie_parcela_m2
    descripcion: >-
      Los 13.000 m² son la superficie de la parcela municipal objeto de la cesión revocada, no
      necesariamente la del proyecto.
    fuentes: [src-2]

