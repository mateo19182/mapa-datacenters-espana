estado: paralizado
estado_detalle: >-
  En noviembre de 2025 Diario de Navarra reveló que Acciona planteaba un centro de datos en una
  parcela de propiedad municipal de la Ciudad del Transporte de Pamplona, en el término del
  Valle de Elorz. La cesión temporal de esa parcela, de más de 13.000 m², la había acordado
  directamente el entonces alcalde en octubre y noviembre de 2025, primero a nombre de Acciona
  y después a otro nombre. En diciembre de 2025 el Ayuntamiento se desdijo de la cesión, y en
  junio de 2026 el Tribunal Administrativo de Navarra la cuestionó. El proyecto se registra
  como paralizado: sin suelo asegurado, sin expediente urbanístico ni ambiental y sin cifras
  técnicas publicadas.
estado_fuentes: [src-1, src-2, src-3]

