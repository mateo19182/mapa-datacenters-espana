id: merlin-barcelona-zona-franca
nombre: "MERLIN Edged Barcelona — Parc Logístic de la Zona Franca"
alias:
  - "Data Center Barcelona (MERLIN Properties)"
  - "MERLIN Edged BCN-01"
  - "CoreWeave Barcelona"
tipo: edificio
operador: "MERLIN Edged"
propietario: "MERLIN Properties SOCIMI"
cliente_ancla: "CoreWeave"
modelo: mayorista

ubicacion:
  municipio: "Barcelona"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Calle 25, nº6, Parc Logístic de la Zona Franca, 08040 Barcelona"
  lat: 41.3412624
  lon: 2.1287874
  precision: aproximada
  fuentes: [ src-1, src-4 ]

estado: operativo
estado_detalle: >-
  Centro inaugurado el 13 de mayo de 2025, con 15 MW IT según MERLIN y 22 MW de capacidad eléctrica
  total según CoreWeave. El anuncio prevé 10.224 H200 y una ampliación Blackwell en 2026. La
  documentación vigente de CoreWeave confirma servicio H200 en Barcelona, sin inventario completo
  por edificio.
estado_fuentes:
  - src-2
  - src-5
  - src-regiones-20261014
fecha_puesta_en_servicio: "2025-05"

potencia:
  - tipo: it
    valor_mw: 15
    ambito: edificio
    referencia: "Capacidad IT del centro declarada por MERLIN en la inauguración"
    estado_asociado: operativo
    fecha_dato: "2025-05-13"
    fuentes:
      - src-2
    nota: >-
      La página vigente de MERLIN especifica 15 MW IT. Son la carga IT de este edificio, no
      capacidad adicional a sus 22 MW eléctricos totales.
  - tipo: instalada_total
    valor_mw: 22
    ambito: edificio
    referencia: "Capacidad eléctrica total del edificio"
    estado_asociado: operativo
    fecha_dato: "2025-05-13"
    fuentes: [ src-3, src-5, src-6 ]
    nota: >-
      La fuente dice 'capacidad eléctrica total de 22 megavatios'. La agencia EFE la recoge como
      "una capacidad eléctrica de 22 megavatios" y la nota de CoreWeave habla de "The 22 MW
      facility".

fases:
  - nombre: "Puesta en servicio inicial (CoreWeave H200)"
    estado: operativo
    fecha_puesta_en_servicio: "2025-05"
    fuentes: [ src-2 ]
  - nombre: "Ampliación con supercomputador Blackwell"
    estado: anunciado
    fuentes: [ src-2 ]

inversion_anunciada_eur: 198000000
refrigeracion: >-
  Consumo nulo de agua según la propiedad; PUE declarado de 1,15 frente a la media europea de 1,46.

agua:
  circuito: sin_agua
  sistema: >-
    Diseño de MERLIN Edged con consumo cero de agua para la refrigeración, según la propiedad y el
    cliente ancla.
  origen: null
  nota: "No se publica ningún consumo residual ni WUE numérico."
  fuentes: [ src-5 ]

empleo:
  - tipo: no_especificado
    valor: 60
    referencia: "Profesionales que emplea el centro en el momento de la inauguración"
    fecha_dato: "2025-05-13"
    fuentes: [ src-6 ]
    nota: >-
      La agencia EFE dice "emplea a 60 profesionales" sin distinguir empleo directo de subcontratado.
enlaces_proyecto:
  - "https://www.merlinproperties.com/activos/data-center-barcelona/"

computo:
  - tipo: gpu
    ambito: sistema
    sistema: "Clúster de IA de CoreWeave en Barcelona (fase 1)"
    operador_computo: "CoreWeave"
    modelo: "NVIDIA H200 Tensor Core, con interconexión InfiniBand"
    unidades: 10224
    tipo_unidad: acelerador
    estado: anunciado
    fecha_dato: "2025-05-13"
    fuentes: [ src-2, src-5 ]
    nota: >-
      MERLIN y CoreWeave anuncian que el centro albergará 10.224 H200. No se ha localizado
      confirmación del despliegue completo. CoreWeave sí ofrece H200 en su zona general EU-SOUTH-03B
      de Barcelona, sin identificar inmueble ni cantidad; esto no verifica el inventario total
      anunciado. Blackwell sigue anunciado sin recuento ni puesta en servicio del edificio
      acreditada.
    modalidad: previsto

incertidumbres:
  - campo: potencia
    descripcion: >-
      La página vigente de MERLIN tipifica 15 MW como IT; CoreWeave mantiene 22 MW para la
      instalación completa. Los 24 MW de anuncios anteriores quedan sin reconciliar. La inauguración
      no acredita por sí sola entrega completa del inventario de 10.224 GPU.
    fuentes:
      - src-2
      - src-3
      - src-5
  - campo: cliente_ancla
    descripcion: >-
      Según prensa económica CoreWeave tenía arrendado el 68% de la capacidad total en el momento de
      la inauguración; no consta quién ocupa el resto.
    fuentes: [ src-3 ]
  - campo: computo
    descripcion: La documentación de servicio confirma H200 disponibles en Barcelona, pero no publica un
      recuento ni vincula las zonas EU-SOUTH-01A/03B con este edificio. Se conserva 10.224 como
      previsión, sin convertir disponibilidad regional en inventario físico por emplazamiento.
    fuentes:
      - src-2
      - src-5
      - src-regiones-20261014

confianza: alta
ultima_verificacion: "2026-10-14"

