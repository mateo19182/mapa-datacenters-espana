id: merlin-barcelona-zona-franca
nombre: "MERLIN Edged Barcelona — Parc Logístic de la Zona Franca"
alias:
  - "Data Center Barcelona (MERLIN Properties)"
  - "MERLIN Edged BCN-01"
  - "CoreWeave Barcelona"
tipo: edificio
operador: "MERLIN Edged"
propietario: "MERLIN Properties SOCIMI"
cliente_ancla: "CoreWeave"
modelo: mayorista

ubicacion:
  municipio: "Barcelona"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Calle 25, nº6, Parc Logístic de la Zona Franca, 08040 Barcelona"
  lat: 41.3412624
  lon: 2.1287874
  precision: aproximada
  fuentes: [src-1, src-4]

estado: operativo
estado_detalle: >-
  Inaugurado el 13 de mayo de 2025 por el alcalde de Barcelona. Alberga el
  clúster de IA de CoreWeave con 10.224 GPU NVIDIA H200. La propiedad anunció
  ampliación con un supercomputador Blackwell en 2026.
estado_fuentes: [src-2, src-3]
fecha_puesta_en_servicio: "2025-05"

potencia:
  - tipo: no_especificado
    valor_mw: 15
    ambito: edificio
    referencia: "Potencia del centro de datos en el momento de la inauguración"
    estado_asociado: operativo
    fecha_dato: "2025-05-13"
    fuentes: [src-2, src-5]
    nota: >-
      La nota de MERLIN dice literalmente "una potencia de 15 MW" sin precisar si
      es carga TI. Una nota de prensa de la propia compañía recogida por prensa
      generalista la califica como "15 MW IT". La nota de CoreWeave habla de "The
      15MW site".
  - tipo: instalada_total
    valor_mw: 22
    ambito: edificio
    referencia: "Capacidad eléctrica total del edificio"
    estado_asociado: operativo
    fecha_dato: "2025-05-13"
    fuentes: [src-3, src-5, src-6]
    nota: >-
      La fuente dice 'capacidad eléctrica total de 22 megavatios'. La agencia EFE
      la recoge como "una capacidad eléctrica de 22 megavatios" y la nota de
      CoreWeave habla de "The 22 MW facility".

fases:
  - nombre: "Puesta en servicio inicial (CoreWeave H200)"
    estado: operativo
    fecha_puesta_en_servicio: "2025-05"
    fuentes: [src-2]
  - nombre: "Ampliación con supercomputador Blackwell"
    estado: anunciado
    fuentes: [src-2]

inversion_anunciada_eur: 198000000
refrigeracion: >-
  Consumo nulo de agua según la propiedad; PUE declarado de 1,15 frente a la
  media europea de 1,46.

agua:
  circuito: sin_agua
  sistema: >-
    Diseño de MERLIN Edged con consumo cero de agua para la refrigeración, según
    la propiedad y el cliente ancla.
  origen: null
  nota: "No se publica ningún consumo residual ni WUE numérico."
  fuentes: [src-5]

empleo:
  - tipo: no_especificado
    valor: 60
    referencia: "Profesionales que emplea el centro en el momento de la inauguración"
    fecha_dato: "2025-05-13"
    fuentes: [src-6]
    nota: >-
      La agencia EFE dice "emplea a 60 profesionales" sin distinguir empleo
      directo de subcontratado.
enlaces_proyecto:
  - "https://www.merlinproperties.com/activos/data-center-barcelona/"

computo:
  - tipo: gpu
    ambito: sistema
    sistema: "Clúster de IA de CoreWeave en Barcelona (fase 1)"
    operador_computo: "CoreWeave"
    modelo: "NVIDIA H200 Tensor Core, con interconexión InfiniBand"
    unidades: 10224
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-05-21"
    fuentes: [src-2, src-5]
    nota: >-
      El hardware no es del operador del centro: MERLIN Edged aporta el inmueble y los 15 MW, y
      CoreWeave despliega y opera los aceleradores como inquilino. Es el mayor recuento de GPU
      documentado en un centro de datos comercial en España. Para una segunda fase se anuncian
      aceleradores Blackwell, sin cifra ni fecha firme.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Coexisten tres cifras en fuentes de la propia compañía y prensa: 15 MW
      (potencia del centro a la inauguración), 22 MW (capacidad eléctrica total)
      y 24 MW (cifra que circuló en la fase de anuncio del proyecto). No se han
      podido reconciliar ni se sabe con certeza cuáles son MW TI.
    fuentes: [src-2, src-3]
  - campo: cliente_ancla
    descripcion: >-
      Según prensa económica CoreWeave tenía arrendado el 68% de la capacidad
      total en el momento de la inauguración; no consta quién ocupa el resto.
    fuentes: [src-3]

confianza: alta
ultima_verificacion: "2026-08-31"

