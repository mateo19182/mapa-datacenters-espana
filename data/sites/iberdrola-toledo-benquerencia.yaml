estado: anunciado
estado_detalle: >-
  Iberdrola mantiene el plan de un centro de procesamiento de datos en el
  polígono industrial de Toledo pese al rechazo del MITECO a la fotovoltaica FV
  Aceca (347,51 MW, 531 hectáreas) que debía dar soporte energético a la
  operación. Según El Español, a 19 de agosto de 2026 "el plan sigue plenamente
  vigente" y la compañía busca reubicar los paneles.
estado_fuentes: [src-elespanol]

potencia: []

fases: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta ninguna cifra de potencia para el CPD de Toledo capital. Los 144
      MW de capacidad y 230 MW de conexión asegurada que circulan en prensa
      corresponden al proyecto "Madrid Sur" de la joint venture Echelon
      Iberdrola Digital Infra, no a este emplazamiento.
    fuentes: [src-elespanol, src-elespanol-jv]
  - campo: ubicacion
    descripcion: >-
      Un blog financiero sitúa uno de los dos centros de la joint venture
      Echelon Iberdrola Digital Infra en "Aceca (Madrid)", cuando la central de
      Aceca está en Villaseca de la Sagra (Toledo). No se ha podido confirmar si
      "Madrid Sur" y el CPD de Toledo capital son el mismo proyecto, proyectos
      distintos o si alguno se ubica en Villaseca de la Sagra.
    fuentes: [src-rankia, src-elespanol, src-elespanol-jv]
  - campo: estado
    descripcion: >-
      No se ha localizado expediente urbanístico, ambiental ni de acceso a red
      para este emplazamiento. La única fuente es una información periodística.
    fuentes: [src-elespanol]

confianza: baja
