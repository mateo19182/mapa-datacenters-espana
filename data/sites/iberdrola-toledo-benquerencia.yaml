estado: anunciado
estado_detalle: >-
  Iberdrola mantiene el plan de un centro de procesamiento de datos en el polígono
  industrial de Toledo pese al rechazo del MITECO a la fotovoltaica FV Aceca
  (347,51 MW nominales, 726.180 módulos, 531 hectáreas en Toledo, Mocejón y
  Almonacid) que debía dar soporte energético a la operación. La Dirección General
  de Calidad y Evaluación Ambiental emitió declaración de impacto ambiental
  desfavorable en agosto de 2026 por impacto "crítico e incompatible" sobre
  avifauna protegida —águila imperial ibérica, sisón común y cernícalo primilla—;
  además, al no obtener las autorizaciones en plazo, Red Eléctrica comunicó a
  finales de junio de 2026 la caducidad del permiso de acceso y conexión de la
  fotovoltaica. Iberdrola ha manifestado su "total disconformidad". Según El
  Español, a 19 de agosto de 2026 "el plan sigue plenamente vigente": la compañía
  busca reubicar los paneles y sostiene que el nudo de Aceca conserva sus derechos
  de evacuación por el ciclo combinado.
estado_fuentes: [src-elespanol, src-elmundo]

potencia:
  - tipo: generacion_asociada
    valor_mw: 347.51
    ambito: campus
    referencia: "Potencia nominal de la fotovoltaica FV Aceca, prevista para dar soporte energético al CPD"
    estado_asociado: cancelado
    fecha_dato: "2026-08-18"
    fuentes: [src-elespanol, src-elmundo]
    nota: >-
      No es capacidad del centro de datos y no entra en ningún agregado: es la
      potencia de una planta de generación que la prensa vincula a este proyecto y
      que el MITECO ha rechazado. Se registra porque es la única cifra de MW
      publicada en relación con este emplazamiento. El vínculo entre la
      fotovoltaica y el CPD es periodístico, no documental.

fases: []

conexion_electrica:
  subestacion: "Nudo de Aceca (central de ciclo combinado de Villaseca de la Sagra)"
  tension_kv: null
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    Fuentes oficiales de Iberdrola sostienen que "la central térmica de ciclo
    combinado de Iberdrola permanece como alternativa para un acceso a la red
    híbrido entre tecnologías, ciclo combinado y fotovoltaica". El permiso de
    acceso y conexión de la fotovoltaica FV Aceca caducó a finales de junio de
    2026. No consta ninguna solicitud ni concesión de acceso para el propio centro
    de datos, ni el nudo al que se conectaría.
  fuentes: [src-elespanol, src-elmundo]

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta ninguna cifra de potencia para el CPD de Toledo capital: ni carga
      TI, ni potencia de conexión, ni potencia instalada. Los 144 MW de capacidad y
      230 MW de conexión asegurada que circulan en prensa corresponden al proyecto
      "Madrid Sur" de la sociedad conjunta Echelon Iberdrola Digital Infra, no a
      este emplazamiento. Los 347,51 MW registrados son de la fotovoltaica
      rechazada, no del centro de datos.
    fuentes: [src-elespanol, src-elespanol-jv, src-elmundo]
  - campo: ubicacion
    descripcion: >-
      Persiste la confusión entre este emplazamiento y el proyecto "Madrid Sur" de
      la sociedad conjunta. El Español distingue con claridad los dos: sitúa este
      CPD "en los terrenos de la antigua Standard Eléctrica, en la calle Río Jarama
      del polígono industrial toledano" y describe Madrid Sur como "el primer hito
      de esta sociedad". Pero Cinco Días sitúa Madrid Sur "en terrenos de la
      central de ciclo combinado de Aceca", en Villaseca de la Sagra, y El Mundo
      describe toda la estrategia como de centros de datos "al sur de Madrid",
      "con la frontera entre Madrid y Castilla-La Mancha como zona prioritaria".
      Son dos puntos distintos de la misma provincia y las fuentes los tratan como
      partes de un mismo plan, sin aclarar si el CPD de Toledo capital forma parte
      de la sociedad conjunta con Echelon o es un desarrollo propio de Iberdrola.
      Un blog financiero añade ruido situando "Aceca" en Madrid.
    fuentes: [src-rankia, src-elespanol, src-elespanol-jv, src-cincodias, src-elmundo]
  - campo: estado
    descripcion: >-
      No se ha localizado expediente urbanístico, ambiental ni de acceso a red para
      este emplazamiento. Las únicas fuentes son informaciones periodísticas
      basadas en declaraciones de la compañía; no hay comunicación corporativa
      propia sobre el CPD de Toledo capital.
    fuentes: [src-elespanol, src-elmundo]

confianza: baja
