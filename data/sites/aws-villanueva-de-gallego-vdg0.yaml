    cita: "Centralizar las instalaciones de gestión del agua de refrigeración en cada uno de los tres emplazamientos de los centros de datos (Villanueva de Gállego, PLHUS Huesca y El Burgo de Ebro) y aumentar la eficiencia y robustez del sistema para lograr una mejora de hasta el 10% en la eficiencia del uso del agua en los tres centros de datos de Amazon en Aragón. [...] La instalación no impondrá una carga adicional a la red local de agua en términos de demanda instantánea o consumo anual, ni un aumento de cantidad de agua vertida a la red."
  - id: src-9
