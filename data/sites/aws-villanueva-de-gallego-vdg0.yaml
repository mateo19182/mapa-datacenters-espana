id: aws-villanueva-de-gallego-vdg0
nombre: "AWS Región Aragón — Villanueva de Gállego (centro existente)"
alias:
  - "VDG"
  - "Amazon Data Services Spain — Villanueva de Gállego"
  - "Centro de datos existente VDG"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "Villanueva de Gállego"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Carretera A-1102 a Castejón de Valdejasa, km 2, polígono Aeronáutico, nave 2 (Parque Industrial Aeronáutico)"
  lat: 41.796047
  lon: -0.845777
  precision: exacta
  fuentes: [src-1, src-4]

estado: operativo
estado_detalle: >-
  Uno de los tres centros de datos del primer Proyecto de Interés General de Aragón de
  Amazon (Villanueva de Gállego, Huesca y El Burgo de Ebro), aprobado definitivamente el
  30 de julio de 2020. La Región AWS Europe (Spain) / eu-south-2 abrió el 15 de noviembre
  de 2022. En 2025 la sociedad tramitó ante INAGA una modificación del centro de datos
  (evaluación de impacto ambiental simplificada). Documentos del Gobierno de Aragón de 2025
  lo citan como "el centro de datos existente VDG", diferenciándolo de los nuevos VDG1 y VDG2.
estado_fuentes: [src-1, src-2, src-4]
fecha_puesta_en_servicio: "2022-11"

potencia:
  - tipo: termica_respaldo
    valor_mw: 110.4
    ambito: campus
    referencia: "Potencia eléctrica total instalada de los 46 grupos electrógenos diésel de respaldo"
    estado_asociado: operativo
    fecha_dato: "2020-07-27"
    fuentes: [src-1]
    nota: >-
      La resolución no da carga TI ni potencia de conexión a red. El dato es la potencia
      eléctrica instalada del conjunto de generadores de reserva (46 x 2,4 MWe), no la
      capacidad TI del centro. No comparar con MW IT.

fases:
  - nombre: "Edificio A"
    estado: operativo
    fuentes: [src-1]
  - nombre: "Edificio B"
    estado: operativo
    fuentes: [src-1]

superficie_parcela_m2: null
inversion_anunciada_eur: null
refrigeracion: "La AAI de 2020 fija una demanda media diaria máxima de agua de 405 m³ en los meses de verano."
enlaces_proyecto:
  - "https://www.aragon.es/-/proyecto-de-interes-general-de-aragon-sobre-la-implantacion-de-centros-de-datos-en-la-comunidad-autonoma-de-aragon-a-propuesta-de-amazon-data-services-spain"

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      El nuevo centro AWS VDG1 (expediente INAGA 2024/12129) se sitúa también en el
      "Parque Industrial Aeronáutico de Villanueva de Gállego", a unos 900 m de este
      emplazamiento, y con coordenadas distintas. Son instalaciones y expedientes
      ambientales separados, pero el riesgo de confusión entre ambos es alto.
    fuentes: [src-1, src-3]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      La fecha 2022-11 corresponde a la apertura de la Región AWS Europe (Spain), no a una
      fecha de puesta en servicio publicada para este edificio concreto.
    fuentes: [src-2]

confianza: alta
ultima_verificacion: "2026-08-29"

