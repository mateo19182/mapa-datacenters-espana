id: aws-villanueva-de-gallego-vdg0
nombre: "AWS Región Aragón — Villanueva de Gállego (centro existente)"
alias:
  - "VDG"
  - "Amazon Data Services Spain — Villanueva de Gállego"
  - "Centro de datos existente VDG"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "Villanueva de Gállego"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Carretera A-1102 a Castejón de Valdejasa, km 2, polígono Aeronáutico, nave 2 (Parque Industrial Aeronáutico)"
  lat: 41.796047
  lon: -0.845777
  precision: exacta
  fuentes: [src-1, src-4]

estado: operativo
estado_detalle: >-
  Uno de los tres centros de datos del primer Proyecto de Interés General de Aragón de
  Amazon (Villanueva de Gállego, Huesca y El Burgo de Ebro), aprobado definitivamente el
  30 de julio de 2020. La Región AWS Europe (Spain) / eu-south-2 abrió el 15 de noviembre
  de 2022. En 2025 la sociedad tramitó ante INAGA una modificación del centro de datos
  (evaluación de impacto ambiental simplificada). Documentos del Gobierno de Aragón de 2025
  lo citan como "el centro de datos existente VDG", diferenciándolo de los nuevos VDG1 y VDG2.
estado_fuentes: [src-1, src-2, src-4]
fecha_puesta_en_servicio: "2022-11"

potencia:
  - tipo: termica_respaldo
    valor_mw: 110.4
    ambito: campus
    referencia: "Potencia eléctrica total instalada de los 46 grupos electrógenos diésel de respaldo"
    estado_asociado: operativo
    fecha_dato: "2020-07-27"
    fuentes: [src-1, src-9]
    nota: >-
      La resolución no da carga TI ni potencia de conexión a red. El dato es la potencia
      eléctrica instalada del conjunto de generadores de reserva (46 x 2,4 MWe), no la
      capacidad TI del centro. No comparar con MW IT.

fases:
  - nombre: "Edificio A"
    estado: operativo
    fuentes: [src-1]
  - nombre: "Edificio B"
    estado: operativo
    fuentes: [src-1]

superficie_parcela_m2: null
inversion_anunciada_eur: null
refrigeracion: "La AAI de 2020 fija una demanda media diaria máxima de agua de 405 m³ en los meses de verano."
agua:
  circuito: hibrido
  sistema: >-
    Unidades de tratamiento de aire (AHU) sin consumo de agua la mayor parte del año; los
    días de más calor, paneles evaporativos que sí consumen agua, con recirculación del
    mayor número de ciclos posible y tratamiento previo para reducir la dureza.
  origen: "Red municipal de abastecimiento del polígono"
  consumo_m3_ano: 36461
  consumo_m3_dia: 405
  nota: >-
    Las dos cifras proceden de la misma resolución y no miden lo mismo: 36.461 m³/año es el
    consumo total anual declarado (35.000 de climatización, 1.460 de servicios sanitarios y
    limpieza y menos de 1 del sistema contra incendios); 405 m³ es la demanda media diaria
    máxima en los meses de verano. No se convierte una en otra. La modificación no
    sustancial número 2 del PIGA, aprobada el 31 de julio de 2024, centralizó el tratamiento
    de agua de los tres centros para mejorar hasta un 10 % la eficiencia de uso del agua sin
    aumentar la demanda instantánea ni el consumo anual.
  fuentes: [src-5, src-8]

energia:
  - consumo_gwh_ano: 739.9
    referencia: "Consumo anual de electricidad de la actividad declarado en la autorización ambiental integrada de 2020"
    fecha_dato: "2020-07-27"
    fuentes: [src-10]
    nota: >-
      La resolución lo publica en MWh: 739.900 MWh/año. Las autorizaciones de los otros dos
      centros del mismo Proyecto de Interés General declaran esta misma cifra.

empleo:
  - tipo: directo
    valor: 60
    referencia: "Plantilla total prevista del centro al completar las fases de implementación (30 por edificio, tres turnos, 24 h, 365 días)"
    fecha_dato: "2020-07-27"
    fuentes: [src-6]
    nota: null

enlaces_proyecto:
  - "https://www.aragon.es/-/proyecto-de-interes-general-de-aragon-sobre-la-implantacion-de-centros-de-datos-en-la-comunidad-autonoma-de-aragon-a-propuesta-de-amazon-data-services-spain"

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      El nuevo centro AWS VDG1 (expediente INAGA 2024/12129) se sitúa también en el
      "Parque Industrial Aeronáutico de Villanueva de Gállego", a unos 900 m de este
      emplazamiento, y con coordenadas distintas. Son instalaciones y expedientes
      ambientales separados, pero el riesgo de confusión entre ambos es alto.
    fuentes: [src-1, src-3]
  - campo: agua
    descripcion: >-
      La propia resolución recoge dos lecturas incompatibles de la demanda de agua. En su
      descripción de la instalación fija una demanda media diaria máxima de 405 m³ en verano
      y un consumo total de 36.461 m³/año. En cambio, el informe del Ingeniero Industrial
      del Ayuntamiento de Villanueva de Gállego de 10 de febrero de 2020, reproducido en la
      misma resolución, dice que las condiciones de suministro solicitadas en el proyecto
      eran de 1.143 m³ de consumo medio diario y 2.675 m³ de consumo máximo diario, y
      concluye que "difícilmente se alcanzará la suficiencia de la red de suministro de agua
      potable". Se registran las cifras de la descripción de la instalación y se deja
      constancia de las del informe municipal.
    fuentes: [src-5, src-7]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      La fecha 2022-11 corresponde a la apertura de la Región AWS Europe (Spain), no a una
      fecha de puesta en servicio publicada para este edificio concreto.
    fuentes: [src-2]

confianza: alta
ultima_verificacion: "2026-08-31"

