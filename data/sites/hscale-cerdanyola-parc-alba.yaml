estado: en_construccion
estado_detalle: >-
  Campus BCN1 en el Parc de l’Alba, iniciado bajo la marca AQ Compute. El operador actual confirma
  10 MW en construcción y prevé disponibilidad en el cuarto trimestre de 2026. Su inventario
  distingue 50 MW IT planificados para el campus y 80 MVA de potencia disponible. No hay
  confirmación de puesta en servicio. Se conservan las previsiones iniciales de 15 MW para el primer
  edificio y 60 MW para el campus, así como el objetivo de 2025, como antecedentes discrepantes.
estado_fuentes:
  - src-accio
  - src-cerdanyola
  - src-hscale-bcn1-20261017
  - src-hscale-inventario-20261017

potencia:
  - tipo: no_especificado
    valor_mw: 60
    ambito: campus
    referencia: "Objetivo histórico de capacidad total del campus"
    estado_asociado: anunciado
    fuentes: [src-accio, src-cerdanyola]
    nota: >-
      ACCIÓ habla de «IT capacity of 60MW» para el campus terminado. Al proceder de una agencia
      de promoción y no del operador, no se ha tipificado como carga TI. El Ayuntamiento de
      Cerdanyola da la misma cifra sin calificarla: «una potència de 60 MW».
  - tipo: no_especificado
    valor_mw: 15
    ambito: fase
    referencia: "Previsión inicial del primer edificio"
    estado_asociado: anunciado
    fuentes: [src-accio]
    nota: La previsión inicial era de 15 MW. La página actual del operador identifica 10 MW en
      construcción, sin confirmar entrega de los 15 MW ni explicar el cambio de alcance.
  - tipo: no_especificado
    valor_mw: 80
    ambito: campus
    referencia: "Objetivo de potencia en negociación en el momento de la primera piedra"
    estado_asociado: anunciado
    fecha_dato: "2024-06-27"
    fuentes: [src-cerdanyola]
    nota: >-
      El Ayuntamiento escribe «amb una potència de 60 MW (s'està treballant perquè siguin 80
      MW)». Es un objetivo declarado, no una capacidad confirmada.
  - tipo: it
    valor_mw: 50
    ambito: campus
    referencia: BCN1, carga IT planificada según el operador actual
    estado_asociado: anunciado
    fuentes:
      - src-hscale-inventario-20261017
    nota: Capacidad final planificada. No equivale a MW operativos ni a los 10 MW que la ficha describe
      en construcción; inventario sin fecha editorial.
  - tipo: no_especificado
    valor_mw: 10
    ambito: fase
    referencia: BCN1, capacidad en construcción según el operador actual
    estado_asociado: en_construccion
    fuentes:
      - src-hscale-bcn1-20261017
    nota: La frase 10MW under construction no tipifica estos 10 MW. No se convierte en carga IT por el
      contexto de los 50 MW finales.
  - tipo: conexion_red
    valor_mw: null
    valor_mva: 80
    ambito: campus
    referencia: Potencia aparente comercialmente disponible según HSCALE
    estado_asociado: desconocido
    fuentes:
      - src-hscale-inventario-20261017
    nota: El operador publica 80MVA POWER AVAILABLE. No se convierte a MW ni acredita una resolución de
      acceso; no se trata como potencia energizada.

fases:
  - nombre: "Fase 1 (primer edificio)"
    estado: en_construccion
    superficie_m2: 43000
    nota: "Primera piedra el 27 de junio de 2024. La ficha actual prevé Q4 de 2026; sustituye el
      objetivo inicial de 2025, sin recepción ni servicio acreditados."
    fuentes:
      - src-accio
      - src-cerdanyola
      - src-hscale-bcn1-20261017
    fecha_puesta_en_servicio: "2026"

refrigeracion: >-
  Agua refrigerada con freecooling e infraestructura preparada para refrigeración líquida;
  densidades de rack declaradas de 11 a 130 kW y PUE objetivo de 1,2. ACCIÓ añadía principios de
  diseño Tier III y suministro 100 % renovable.

inversion_anunciada_eur: 600000000

empleo:
  - tipo: directo
    valor: 300
    referencia: "Previsión para el campus AQ-BCN1"
    fecha_dato: "2024-06"
    fuentes: [src-cerdanyola]
    nota: null
  - tipo: indirecto
    valor: 1500
    referencia: "Previsión para el campus AQ-BCN1"
    fecha_dato: "2024-06"
    fuentes: [src-cerdanyola]
    nota: null

incertidumbres:
  - campo: identidad
    descripcion: >-
      Este emplazamiento aparecía en las fuentes como dos proyectos distintos, «AQ Compute
      AQ-BCN1» y «hscale BCN1». Son el mismo activo: AQ Compute, del grupo Aquila, pasó a operar
      como hscale tras la entrada de Bain Capital. Comparten emplazamiento, código de edificio y
      linaje societario, de modo que se registran como una sola ficha para no duplicar capacidad.
    fuentes: [src-accio, src-baxtel]
  - campo: potencia
    descripcion: >-
      ACCIÓ atribuía al diseño inicial 60 MW IT y 15 MW al primer edificio; las cifras históricas se
      conservan. El operador actual publica 50 MW IT planificados, 10 MW en obra sin tipificar y 80
      MVA disponibles. Son lecturas y ámbitos distintos; no se suman ni se convierten MVA a MW.
    fuentes:
      - src-accio
      - src-cerdanyola
      - src-hscale-bcn1-20261017
      - src-hscale-inventario-20261017
  - campo: superficie
    descripcion: >-
      Los 43.000 m² se atribuyen al «primer edificio», lo que encaja mal con una fase de 15 MW;
      podría referirse a la parcela y no a la superficie construida. El Ayuntamiento de
      Cerdanyola, en cambio, dice que el campus «ocuparà una superfície de 7.000 metres
      quadrats». Las dos cifras se conservan sin elegir.
    fuentes: [src-accio, src-cerdanyola]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 600 millones de euros proceden del Ayuntamiento de Cerdanyola en junio de 2024 y
      duplican los 300 millones que se manejaban en el anuncio inicial del proyecto. No se ha
      localizado confirmación de la cifra por parte del operador.
    fuentes: [src-cerdanyola]
  - campo: estado
    descripcion: >-
      La previsión inicial de ACCIÓ era 2025. La ficha actual del operador confirma obra y objetivo
      de disponibilidad Q4 de 2026, sin anuncio de apertura localizado. Consultar una página en
      octubre no acredita una entrega en ese trimestre.
    fuentes:
      - src-accio
      - src-hscale-bcn1-20261017
  - campo: ubicacion
    descripcion: >-
      Las coordenadas son el centroide del Parc de l'Alba según Nominatim, no la parcela concreta.
    fuentes: [src-nominatim]

confianza: media
ultima_verificacion: "2026-10-17"

