estado_detalle: >-
  Anunciado en agosto de 2026 al formalizar Acciona la compra del 50% de Ignis
  Data Epta. El centro de datos irá acompañado de una planta fotovoltaica
  adyacente destinada a cubrir su consumo eléctrico. No se ha hecho público el
  municipio, la potencia ni el calendario.
