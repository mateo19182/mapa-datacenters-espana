incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Las fuentes solo dicen "la provincia de Segovia"; no se concreta municipio
      ni emplazamiento, por lo que el registro no lleva coordenadas.
    fuentes: [src-cloud]
  - campo: potencia
    descripcion: >-
      No se ha comunicado la potencia del complejo. Los 2 GW que cita la prensa
      corresponden a la ambición global de Acciona en centros de datos, no a
      este emplazamiento, y no deben atribuirse a Segovia.
    fuentes: [src-pvmag, src-cloud]

