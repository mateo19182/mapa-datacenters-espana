    editor: "IGNIS"
    tipo: empresa
    fecha_publicacion: "2026-08-07"
    fecha_consulta: "2026-08-31"
    cita: >-
      IGNIS y Acciona están impulsando conjuntamente un proyecto de centro de datos
      en Segovia y una planta fotovoltaica adyacente para cubrir su consumo
