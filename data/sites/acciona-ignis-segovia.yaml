estado: anunciado
estado_detalle: >-
  Anunciado el 7 de agosto de 2026 al formalizar Acciona la compra del 50% de
  Ignis Data Epta, S.L., sociedad creada en 2024 y dependiente de Ignis P2X, el
  vehículo de centros de datos de IGNIS participado por el fondo KKR. La
  tramitación de los permisos de acceso y conexión se hizo previamente a través de
  dos sociedades de IGNIS. El centro de datos irá acompañado de una planta
  fotovoltaica adyacente destinada a cubrir su consumo eléctrico. No se ha hecho
  público el municipio, la potencia, la inversión ni el calendario, y no se ha
  localizado ningún expediente ambiental ni urbanístico en la Junta de Castilla y
  León que corresponda al proyecto.
estado_fuentes: [src-pvmag, src-cloud, src-ignis, src-eleconomista]

potencia: []

fases: []

conexion_electrica:
  subestacion: null
  tension_kv: null
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    IGNIS confirma que "la tramitación de los permisos de acceso y conexión se
    realizó a través de dos sociedades de IGNIS", pero no publica el nudo, la
    tensión ni los MW solicitados o concedidos. No se ha localizado ninguna
    resolución de acceso ni conflicto ante la CNMC que permita identificarlos.
  fuentes: [src-ignis]

inversion_anunciada_eur: null

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Las fuentes solo dicen "la provincia de Segovia"; ni la nota de IGNIS ni la
      cobertura posterior concretan municipio o emplazamiento, por lo que el
      registro no lleva coordenadas.
    fuentes: [src-cloud, src-ignis]
  - campo: potencia
    descripcion: >-
      No se ha comunicado la potencia del complejo ni la de la fotovoltaica
      adyacente. Los 2 GW que cita la prensa corresponden a la ambición global de
      Acciona en centros de datos, no a este emplazamiento, y no deben atribuirse a
      Segovia. Los 312 millones de euros que El Economista atribuye a Acciona son
      el total invertido por la compañía en esta actividad en España según su
      presentación a la CNMV, tampoco de este proyecto.
    fuentes: [src-pvmag, src-cloud, src-eleconomista]
  - campo: propietario
    descripcion: >-
      Conviene no confundir este proyecto con otro promotor distinto en la misma
      provincia: en agosto de 2026 se conoció que Iberdrola había constituido la
      sociedad CPD4Green Segovia, sin relación societaria alguna con Ignis Data
      Epta ni con Acciona, y sin que conste que vaya a desarrollar allí un centro
      de datos.
    fuentes: [src-abc-sociedades]

confianza: baja
ultima_verificacion: "2026-08-31"

