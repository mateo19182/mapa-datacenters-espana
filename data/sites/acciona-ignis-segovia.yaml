    fecha_publicacion: "2026-08-07"
    fecha_consulta: "2026-08-31"
    cita: >-
      La compañía presidida por José Manuel Entrecanales ha adquirido una
      participación del 50% en el 'data center' Epta de Ignis P2X, plataforma
