  - id: src-eleconomista
    url: "https://www.eleconomista.es/infraestructuras-servicios/noticias/14006487/08/26/acciona-se-alia-con-ignis-para-acelerar-en-data-centers-y-desarrollar-2gw.html"
    titulo: "Acciona se alía con Ignis y KKR para acelerar en 'data centers' y desarrollar 2GW"
