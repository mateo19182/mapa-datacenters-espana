estado_detalle: >-
  Novagrid Hub fue la única licitadora del lote de suelo público de Pimesa en la ampliación
  de Elche Parque Empresarial (siete parcelas, 102.351 m² brutos). Preadjudicación el
  09/01/2026 por 3,6 millones de euros. El desarrollo depende de que culmine la
  reparcelación del sector E-49, aprobada por el consejo de Pimesa el 16/07/2026 y pendiente
  de exposición pública; las obras de urbanización del sector se licitan por 37,5 millones
  con adjudicación esperada en el primer trimestre de 2027. Novagrid asume la urbanización
  de su suelo. La sociedad se constituyó el 30/07/2025 en Pozuelo de Alarcón con un capital
  social de 4.002 euros y objeto social de «promoción, desarrollo, implantación,
  intermediación, construcción, operación y compraventa de centros de procesos de datos»;
  sus accionistas son Boxleo TIC (patrimonial de Tino Fernández, presidente de Altia),
  Roberna Inversiones e Ivcus Holding, administrada por Martín Costa, operating partner de
  Macquarie.
estado_fuentes: [src-1, src-2, src-3, src-4]

