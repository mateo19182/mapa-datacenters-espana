incertidumbres:
  - campo: potencia
    descripcion: >-
      Ninguna fuente publica potencia eléctrica ni superficie construida. Solo consta que
      «requerirá de un gran suministro eléctrico» y que la subestación propia del proyecto
      podría alimentar al resto del sector, según el gerente de Pimesa.
    fuentes: [src-3]
  - campo: operador
    descripcion: >-
      Economía Digital (16/04/2026) aporta el accionariado y el objeto social, pero sigue sin
      constar si Novagrid Hub operará el centro o solo lo promoverá. La sociedad tiene
      capital social de 4.002 euros, de modo que la financiación del proyecto no procederá
      de recursos propios.
    fuentes: [src-1, src-3, src-4]
  - campo: precio_suelo
    descripcion: >-
      La oferta se publicó primero como 2,9 millones de euros (05/12/2025) y después como
      3,6 millones en la clasificación de ofertas (13/01/2026). Economía Digital resuelve la
      aparente contradicción: la oferta fue de 2,99 millones más IVA, «lo que elevará el
      importe total por encima de los 3,6 millones de euros». No es una inversión del
      proyecto sino el precio del suelo.
    fuentes: [src-1, src-2, src-4]

confianza: baja
ultima_verificacion: "2026-08-31"

