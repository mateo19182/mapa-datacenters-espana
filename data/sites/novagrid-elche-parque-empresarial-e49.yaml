estado: anunciado
estado_detalle: >-
  Novagrid Hub fue la única licitadora del lote de suelo público de Pimesa en la ampliación
  de Elche Parque Empresarial (siete parcelas, 102.351 m² brutos). Preadjudicación el
  09/01/2026 por 3,6 millones de euros. El desarrollo depende de que culmine la
  reparcelación del sector E-49, aprobada por el consejo de Pimesa el 16/07/2026 y pendiente
  de exposición pública; las obras de urbanización del sector se licitan por 37,5 millones
  con adjudicación esperada en el primer trimestre de 2027. Novagrid asume la urbanización
  de su suelo.
estado_fuentes: [src-1, src-2, src-3]

conexion_electrica:
  subestacion: "Subestación eléctrica propia prevista por el promotor dentro del sector E-49"
  fuentes: [src-3]

superficie_parcela_m2: 102351

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ninguna fuente publica potencia eléctrica ni superficie construida. Solo consta que
      «requerirá de un gran suministro eléctrico» y que la subestación propia del proyecto
      podría alimentar al resto del sector, según el gerente de Pimesa.
    fuentes: [src-3]
  - campo: operador
    descripcion: >-
      Las fuentes describen a Novagrid Hub como «dedicada a centros de gestión de datos» sin
      aportar más información societaria. No consta si operará el centro o solo lo
      promoverá («compañía encargada de construir el inmueble»).
    fuentes: [src-1, src-3]
  - campo: precio_suelo
    descripcion: >-
      La oferta se publicó primero como 2,9 millones de euros (precio de tasación,
      05/12/2025) y después como 3,6 millones en la clasificación de ofertas (13/01/2026).
      No es una inversión del proyecto sino el precio del suelo.
    fuentes: [src-1, src-2]

confianza: baja
ultima_verificacion: "2026-08-29"

