estado_detalle: >-
  Proyecto heredado de KIO Networks España, cuya compra completó El Corte Inglés en
  noviembre de 2024. En junio de 2026 el centro estaba «plenamente operativo», había
  superado las pruebas para la certificación Tier IV y se inició su comercialización.
