id: kumo-paterna-tactica
nombre: "Kumo Networks — Paterna (Parque Empresarial Táctica)"
alias:
  - "Data center de El Corte Inglés en Paterna"
  - "KIO Networks Paterna"
tipo: edificio
operador: "Kumo Networks"
propietario: "El Corte Inglés"
modelo: colocation

ubicacion:
  municipio: "Paterna"
  provincia: "Valencia"
  ccaa: "Comunitat Valenciana"
  direccion: "Carrer del Corretger 31-33, Parque Empresarial Táctica, Paterna"
  lat: 39.515955
  lon: -0.4486038
  precision: aproximada
  no_derivar: true
  fuentes: [src-centros-actual, src-diseno-valencia, src-mapa-valencia]

estado: operativo
estado_detalle: >-
  Centro de Kumo Networks, filial de El Corte Inglés, inaugurado en junio de 2026 según
  el operador. La prensa publica 1.000 m² de salas IT, 2,4 MW totales y 1 MW para servidores.
  Uptime Institute registra certificaciones Tier IV de diseño y de instalaciones para el
  centro de Valencia. La carta de diseño de la fase I limita su alcance a 954 kW IT;
  esa cifra no se toma como comprobación de la capacidad actualmente construida.
estado_fuentes: [src-1, src-4, src-centros-actual, src-diseno-valencia, src-uptime-valencia]
fecha_puesta_en_servicio: "2026-06"

potencia:
  - tipo: instalada_total
    valor_mw: 2.4
    ambito: edificio
    referencia: "Potencia del edificio"
    estado_asociado: operativo
    fecha_dato: "2026-06-12"
    fuentes: [src-1, src-2, src-3]
  - tipo: it
    valor_mw: 1
    ambito: edificio
    referencia: "Potencia destinada a servidores"
    estado_asociado: operativo
    fecha_dato: "2026-06-12"
    fuentes: [src-1, src-2]
    nota: "«una potencia de 2,4 MW, de los que 1 MW corresponden a servidores»."
  - tipo: it
    valor_mw: 0.954
    ambito: fase
    referencia: "Fase I, límite de carga IT del diseño certificado Tier IV"
    estado_asociado: anunciado
    fecha_dato: "2025-12-03"
    fuentes: [src-diseno-valencia]
    nota: >-
      El certificado limita el diseño a 954 kW IT y no acredita el entorno construido.
      Se conserva como capacidad de diseño, separada del 1 MW publicado por la prensa.

fases:
  - nombre: "Edificio Paterna"
    estado: operativo
    fecha_puesta_en_servicio: "2026-06"
    fuentes: [src-1, src-2]

superficie_construida_m2: null
inversion_anunciada_eur: 50000000
refrigeracion: >-
  Sistema de refrigeración alojado en el sótano del edificio: refrigeración por CO2 como
  refrigerante natural —sin gases fluorados— apoyada en 71 pozos de geotermia, con dos
  depósitos de CO2 de 9.000 litros cada uno y diez bombas (dos por circuito).

agua:
  circuito: cerrado
  sistema: >-
    Agua en circuito cerrado para enfriar el CO2, con apoyo geotérmico de 71 pozos y
    sin torres de evaporación.
  origen: null
  nota: >-
    El operador explica su declaración de «cero insumo» como un llenado inicial del
    circuito, sin reposición periódica por evaporación. El sistema contiene agua; no
    hay volumen de llenado, consumo medido ni WUE publicados en las fuentes revisadas.
  fuentes: [src-4, src-6, src-agua-circuito]

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      Economía Digital atribuye la cifra a «algunas estimaciones» («alrededor de 50 millones
      de euros»); Murcia Plaza (2024) hablaba de «una inversión de más de 50 millones»; Cinco
      Días (12/06/2026) la sitúa «por encima de los 52 millones de euros, según ha detallado
      la propia Kumo durante distintas fases de la construcción». Se conserva la cifra
      registrada y se anota la discrepancia en lugar de sustituirla.
    fuentes: [src-1, src-2, src-4]
  - campo: estado
    descripcion: >-
      El registro de Uptime confirma Tier IV de diseño y de instalaciones para CAMPUS DATA
      CENTER SEDE Valencia. La vista consultada no publica la fecha de emisión ni la carga IT
      certificada en obra. Los 954 kW proceden únicamente de la carta de diseño de la fase I.
    fuentes: [src-uptime-valencia, src-diseno-valencia]
  - campo: potencia
    descripcion: >-
      La prensa redondea la carga para servidores a 1 MW. El diseño certificado de la fase I
      se limita a 954 kW IT. Difieren en fecha, ámbito y respaldo documental; no se suman ni
      se toma el certificado de diseño como medida de la capacidad actualmente construida.
    fuentes: [src-1, src-diseno-valencia]
  - campo: superficie_construida_m2
    descripcion: >-
      Los 1.000 m² publicados corresponden a salas IT. El complejo también incorpora oficinas,
      por lo que esa cifra no se registra como superficie construida del edificio.
    fuentes: [src-1, src-4]
  - campo: refrigeracion
    descripcion: >-
      El certificado LEED Platino que enlaza actualmente el operador identifica KIO Networks
      Murcia, abril de 2015. No acredita esa certificación para Paterna. Tampoco se ha localizado
      prueba de una red de calefacción de distrito en servicio vinculada a este edificio.
    fuentes: [src-5, src-certificaciones, src-leed-murcia]
  - campo: ubicacion
    descripcion: >-
      La carta de certificación de diseño indica Corretger 31; Maps y el contacto del operador
      indican el 33. El punto corresponde al centro de datos nombrado en Maps, con precisión
      aproximada, sin identificar una sala ni resolver la numeración del conjunto.
    fuentes: [src-certificaciones, src-diseno-valencia, src-mapa-valencia]

confianza: media
