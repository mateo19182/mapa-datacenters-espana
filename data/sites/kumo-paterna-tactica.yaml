      Economía Digital atribuye la cifra a «algunas estimaciones» («alrededor de 50 millones
      de euros»); Murcia Plaza (2024) hablaba de «una inversión de más de 50 millones». No
      hay cifra confirmada por la compañía.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      A junio de 2026 el centro había superado las pruebas de certificación Tier IV pero no
      consta la fecha de emisión del certificado por el Uptime Institute.
    fuentes: [src-1, src-3]

