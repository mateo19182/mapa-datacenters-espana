  direccion: "Parque Empresarial de Táctica, Paterna"
  lat: 39.5191
  lon: -0.4571
  precision: aproximada
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Proyecto heredado de KIO Networks España, cuya compra completó El Corte Inglés en
  noviembre de 2024. En junio de 2026 el centro estaba «plenamente operativo», había
  superado las pruebas para la certificación Tier IV y se inició su comercialización tras
  cerca de tres años de obra. Cinco Días lo describe como el que triplica la capacidad de
  Kumo y sitúa la inversión «por encima de los 52 millones de euros».
estado_fuentes: [src-1, src-4]
fecha_puesta_en_servicio: "2026-06"

potencia:
  - tipo: instalada_total
    valor_mw: 2.4
    ambito: edificio
    referencia: "Potencia del edificio"
    estado_asociado: operativo
    fecha_dato: "2026-06-12"
    fuentes: [src-1, src-2, src-3]
  - tipo: it
    valor_mw: 1
    ambito: edificio
    referencia: "Potencia destinada a servidores"
    estado_asociado: operativo
    fecha_dato: "2026-06-12"
    fuentes: [src-1, src-2]
    nota: "«una potencia de 2,4 MW, de los que 1 MW corresponden a servidores»."

fases:
  - nombre: "Edificio Paterna"
    estado: operativo
    fecha_puesta_en_servicio: "2026-06"
    superficie_m2: 1000
    fuentes: [src-1, src-2]

superficie_construida_m2: 1000
inversion_anunciada_eur: 50000000
refrigeracion: >-
  Sistema de refrigeración alojado en el sótano del edificio: refrigeración por CO2 como
  refrigerante natural —sin gases fluorados— apoyada en 71 pozos de geotermia, con dos
  depósitos de CO2 de 9.000 litros cada uno y diez bombas (dos por circuito). El operador
  declara reaprovechamiento del calor residual para calefacción de distrito y certificación
  LEED Platino del edificio.

agua:
  circuito: sin_agua
  sistema: >-
    Refrigeración por CO2 con refrigerantes naturales y apoyo geotérmico (71 pozos), sin
    torres de evaporación.
  origen: null
  nota: >-
    El operador declara «un insumo cero de agua en el DC de Valencia»; Cinco Días describe
    el uso del CO2 como forma de «limitar el consumo de agua». No hay cifra auditada ni WUE
    publicado, y las dos formulaciones (cero frente a limitado) no son idénticas.
  fuentes: [src-4, src-5, src-6]

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      Economía Digital atribuye la cifra a «algunas estimaciones» («alrededor de 50 millones
      de euros»); Murcia Plaza (2024) hablaba de «una inversión de más de 50 millones»; Cinco
      Días (12/06/2026) la sitúa «por encima de los 52 millones de euros, según ha detallado
      la propia Kumo durante distintas fases de la construcción». Se conserva la cifra
      registrada y se anota la discrepancia en lugar de sustituirla.
    fuentes: [src-1, src-2, src-4]
  - campo: estado
    descripcion: >-
      A junio de 2026 el centro había superado las pruebas de certificación Tier IV pero no
      consta la fecha de emisión del certificado por el Uptime Institute.
    fuentes: [src-1, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

