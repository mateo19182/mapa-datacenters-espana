id: ibm-euskadi-donostia-computacion-cuantica
nombre: "Centro de Computación Cuántica IBM-Euskadi — edificio Ikerbasque (Donostia-San Sebastián)"
alias:
  - "IBM Quantum System Two Donostia"
  - "IBM-Euskadi Quantum Computational Center"
  - "IBM_BasqueCountry"
tipo: edificio
operador: "IBM"
propietario: "Fundación Ikerbasque (Gobierno Vasco)"
modelo: corporativo

ubicacion:
  municipio: "Donostia-San Sebastián"
  provincia: "Gipuzkoa"
  ccaa: "País Vasco"
  direccion: >-
    Edificio de Ikerbasque, avenida Tolosa, anexo al edificio Korta, campus de Ibaeta,
    Donostia-San Sebastián.
  lat: null
  lon: null
  precision: desconocida
  fuentes: [src-1, src-4]

estado: operativo
estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo pública, no como centro
  de datos convencional: la carga dominante es un criostato de dilución y el sistema opera en el
  orden de los kilovatios, no de los megavatios. No debe leerse como capacidad de cómputo
  comparable con la de los demás emplazamientos del registro.
  El Gobierno Vasco e IBM inauguraron la instalación el 14 de octubre de 2025. Es el primer IBM
  Quantum System Two operativo de Europa y el tercero del mundo, con un procesador IBM Quantum
  Heron de 156 cúbits. Ocupa una sala de 110 m² en la planta baja de un edificio de Ikerbasque de
  cinco plantas y 6.000 m² construidos, levantado en el campus de Ibaeta; los sistemas de
  refrigeración están en la planta inferior. Forma parte de la estrategia vasca de computación
  cuántica BasQ / IKUR 2030. En 2027 el mismo edificio debe alojar además Hyperion, un
  supercomputador convencional del DIPC, lo que cambiará la naturaleza del emplazamiento.
estado_fuentes: [src-1, src-2, src-3, src-4]
fecha_puesta_en_servicio: "2025-10-14"

potencia: []

fases:
  - nombre: "Sala del IBM Quantum System Two"
    estado: operativo
    fecha_puesta_en_servicio: "2025-10-14"
    superficie_m2: 110
    fuentes: [src-3]
    nota: >-
      Sala de la planta baja, visible desde la calle. No es una sala de racks: aloja la
      plataforma criogénica del sistema cuántico.

superficie_construida_m2: 6000

refrigeracion: >-
  Criostato de dilución. Los sistemas de refrigeración se disponen en la planta inferior del
  edificio y operan a temperaturas cercanas al cero absoluto, en torno a -273 °C.

agua:
  circuito: desconocido
  sistema: null
  origen: null
  nota: >-
    Ninguna fuente describe el circuito de refrigeración por agua del edificio ni publica
    consumo. No se declara `sin_agua` porque nadie lo afirma: la refrigeración criogénica del
    sistema cuántico no dice nada sobre el agua que consuma el edificio que lo aloja.
  fuentes: [src-3]

inversion_anunciada_eur: null

enlaces_proyecto:
