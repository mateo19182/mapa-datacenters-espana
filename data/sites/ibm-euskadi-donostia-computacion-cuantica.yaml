computo:
  - tipo: qpu
    ambito: sistema
    sistema: "IBM Quantum System Two (IBM_BasqueCountry)"
    operador_computo: "IBM"
    modelo: "Procesador IBM Quantum Heron, cúbits superconductores"
    unidades: 156
    tipo_unidad: qubit
    estado: operativo
    fecha_dato: "2025-10-14"
    fuentes: [src-1, src-ibm]
    nota: >-
      Primer IBM Quantum System Two operativo de Europa y tercero del mundo. No es capacidad de
      centro de datos: el sistema opera en el orden de los kilovatios y no aporta ninguna cifra
      a `potencia[]`. Está diseñado para escalar e integrar varios procesadores en el futuro.

incertidumbres:
  - campo: potencia
    descripcion: >-
      No hay ninguna magnitud eléctrica publicada de esta instalación: ni MW IT, ni potencia de
      conexión, ni potencia instalada, ni consumo anual. IBM tampoco publica especificaciones
      eléctricas del modelo System Two. Lo único que consta es el orden de magnitud, en boca del
      viceconsejero de Universidades e Investigación: el ordenador «consume energía en
      kilowatios, no en megawatios». Las cifras que circulan —unos 30 kW, o decenas de kW— son
      del modelo genérico o de otros fabricantes, no de esta unidad, y por eso no se registran.
      `potencia` queda vacío, como en las fichas del BSC, el CSUC, el IFCA y SCAYLE, que tampoco
      publican ninguna.
    fuentes: [src-2]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Las cifras publicadas son del programa, no del emplazamiento, y no deben atribuirse a él:
      más de 50 millones en el acuerdo inicial entre IBM e Ikerbasque de marzo de 2023, más de
      120 millones para la estrategia BasQ completa, y 153 millones hasta 2028 según la prensa,
      de los que 25 los aporta la Diputación de Gipuzkoa. El edificio que aloja el sistema costó
      12 millones, según el Gobierno Vasco, pero es un edificio de investigación entero y no una
      instalación de cómputo. El campo queda vacío.
    fuentes: [src-3, src-4]
  - campo: superficie_construida_m2
    descripcion: >-
      Los 6.000 m² son el edificio de Ikerbasque completo, cinco plantas de laboratorios y
      despachos con cerca de 1.100 m² por planta. Al sistema cuántico le corresponden los 110 m²
      de su sala, registrados como fase. No son magnitudes comparables.
    fuentes: [src-3, src-4]
  - campo: tipo
    descripcion: >-
      No es un centro de datos en el sentido del resto del conjunto y no debe agregarse con
      ellos. Se registra siguiendo la regla del esquema para instalaciones de cómputo cuántico:
      tiene sala técnica propia y emplazamiento identificable con fuente pública, así que recibe
      ficha; las instalaciones cuánticas alojadas dentro de un emplazamiento ya fichado, como
      MareNostrum Ona y EuroQCS-Spain en el BSC o el equipo de IQM en el CESGA, se anotan en el
      `estado_detalle` de su anfitrión y no generan registro nuevo.
    fuentes: [src-1]
  - campo: operador
    descripcion: >-
      El reparto exacto entre IBM y la Fundación Ikerbasque no se publica. El sistema es de IBM y
      el centro se llama IBM-Euskadi; el edificio lo promovió el Departamento de Educación del
      Gobierno Vasco a través de Ikerbasque. No hubo licitación pública del ordenador: la
      adquisición se articuló como acuerdo directo entre Ikerbasque e IBM, firmado en marzo de
      2023.
    fuentes: [src-1, src-4]

