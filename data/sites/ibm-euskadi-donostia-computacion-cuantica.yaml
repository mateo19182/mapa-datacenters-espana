    titulo: "The Basque Government and IBM Inaugurate Europe's first IBM Quantum System Two in Donostia-San Sebastián"
    editor: "IBM"
    tipo: empresa
    fecha_publicacion: "2025-10-14"
    fecha_consulta: "2026-08-31"
    cita: >-
      This IBM Quantum System Two installation is only the second such deployment outside the
      US. It is powered by a 156-qubit IBM Quantum Heron processor, one of the best performing
      quantum processors developed by the company, to date. Designed to be scalable and
      integrate multiple processors in the future, this system marks a technological milestone
      by enabling the execution of utility-scale algorithms.
