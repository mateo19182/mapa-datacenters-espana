id: adam-cerdanyola-parc-alba
nombre: "Adam Parc de l'Alba — Cerdanyola del Vallès"
alias:
  - "Adam BCN3"
  - "Adam: Cerdanyola 2"
tipo: edificio
operador: "Adam"
propietario: "Adam"
modelo: colocation

ubicacion:
  municipio: "Cerdanyola del Vallès"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Parc de l'Alba (entorno del Sincrotró ALBA), Cerdanyola del Vallès"
  lat: 41.485618
  lon: 2.1076426
  precision: aproximada
  fuentes: [src-1, src-alba]

estado: en_construccion
estado_detalle: >-
  Cuarto centro de datos del grupo Adam (tercero en Cataluña). El acto de
  colocación de la primera piedra se celebró el 11 de noviembre de 2025 con el
  conseller d'Empresa i Treball y el alcalde de Cerdanyola. La compañía prevé
  entrada en servicio en 2027 con una primera fase de cuatro salas. Adam Ecotech
  pasó a manos de CVC DIF, que acordó comprar el 100 % del capital a Ogic
  Informática el 31 de octubre de 2024.
estado_fuentes: [src-1, src-2, src-3, src-5]

potencia:
  - tipo: no_especificado
    valor_mw: 8
    ambito: edificio
    referencia: "Potencia instalada prevista del edificio completo"
    estado_asociado: en_construccion
    fecha_dato: "2025-10"
    fuentes: [src-2]
    nota: "La fuente habla de '8 MW de potencia instalada' con certificación Tier III."
  - tipo: instalada_total
    valor_mw: 8
    ambito: edificio
    referencia: "Potencia instalada del edificio según el Ayuntamiento de Cerdanyola"
    estado_asociado: en_construccion
    fecha_dato: "2025-11-12"
    fuentes: [src-3]
    nota: >-
      La nota municipal dice «una potència instal·lada de 8 MW», lo que tipifica
      la cifra que la prensa daba sin calificar. Es la misma magnitud que el
      registro anterior, no una capacidad adicional.
  - tipo: no_especificado
    valor_mw: 4
    ambito: fase
    referencia: "Primera fase, cuatro salas"
    estado_asociado: en_construccion
    fecha_dato: "2025-10"
    fuentes: [src-2]

fases:
  - nombre: "Fase 1 (4 salas)"
    estado: en_construccion
    fecha_puesta_en_servicio: "2027"
    fuentes: [src-2]

superficie_construida_m2: 7500
refrigeracion: >-
  Paneles fotovoltaicos en cubierta, sistemas de refrigeración de alta eficiencia
  y suministro eléctrico 100% renovable, según la compañía. El director general
  de Adam declaró en la primera piedra que la instalación funcionará «sense
  consum d'aigua».

agua:
  circuito: sin_agua
  sistema: "Mecanismos avanzados de refrigeración que, según la compañía, no emplean agua."
  origen: null
  nota: >-
    Declaración del director general de Adam en el acto de la primera piedra,
    recogida por el Ayuntamiento de Cerdanyola. No se publica sistema concreto ni
    consumo de agua auxiliar.
  fuentes: [src-3, src-4]

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Las coordenadas son el centroide del Parc de l'Alba según Nominatim, no la
      parcela concreta del proyecto. Precisión aproximada.
    fuentes: [src-alba]
  - campo: potencia
    descripcion: >-
      La web de Adam indica 5 MW para la fase 1 mientras que la prensa
      especializada habla de 4 MW en la primera fase. Se registran ambos
      contextos; se toma 4 MW de la prensa y se deja constancia del 5 MW de la
      ficha web. Ninguna fuente precisa si son MW TI o potencia instalada.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      Baxtel sitúa este proyecto en Carrer dels Artesans (Parc Tecnològic del
      Vallès), junto al centro PTV existente, mientras que la compañía y la
      prensa lo sitúan en el Parc de l'Alba. No se ha localizado dirección
      postal exacta ni coordenadas de fuente.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      La ficha databa la primera piedra en octubre de 2025 siguiendo a la prensa
      especializada, que publicó el anuncio del proyecto el 3 y el 7 de octubre.
      El Ayuntamiento de Cerdanyola y la propia Adam sitúan el acto el 11 de
      noviembre de 2025. Se conservan ambas fechas.
    fuentes: [src-2, src-3]
  - campo: propietario
    descripcion: >-
      El campo `propietario` registra «Adam», anterior a la compra del 100 % de
      Adam Ecotech por CVC DIF acordada el 31 de octubre de 2024. No se
      sobrescribe: queda anotado para que una persona decida cómo nombrar al
      titular.
    fuentes: [src-5]

confianza: media
ultima_verificacion: "2026-08-31"

