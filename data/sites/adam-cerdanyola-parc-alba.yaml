id: adam-cerdanyola-parc-alba
nombre: "Adam Parc de l'Alba — Cerdanyola del Vallès"
alias:
  - "Adam BCN3"
  - "Adam: Cerdanyola 2"
tipo: edificio
operador: "Adam"
propietario: "Adam Ecotech, integrada en CVC DIF"
modelo: colocation

ubicacion:
  municipio: "Cerdanyola del Vallès"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Parc de l'Alba (entorno del Sincrotró ALBA), Cerdanyola del Vallès"
  lat: 41.485618
  lon: 2.1076426
  precision: aproximada
  fuentes: [src-1, src-alba]

estado: en_construccion
estado_detalle: >-
  Cuarto centro de datos del grupo Adam (tercero en Cataluña). El acto de colocación de la primera
  piedra se celebró el 11 de noviembre de 2025 con el conseller d'Empresa i Treball y el alcalde de
  Cerdanyola. La compañía prevé entrada en servicio en 2027 con una primera fase de cuatro salas.
  Adam Ecotech pasó a manos de CVC DIF, que acordó comprar el 100 % del capital a Ogic Informática
  el 31 de octubre de 2024. La web actual confirma construcción, ocho salas y 5 MW eléctricos
  contratados para la fase 1; difiere del anuncio inicial de cuatro salas y 4 MW. No consta nueva
  apertura. La cronología corporativa consultada en octubre de 2026 anuncia la inauguración para
  2026, frente a la previsión municipal de 2027. Ninguna confirma una apertura ya realizada.
estado_fuentes: [ src-1, src-2, src-3, src-5, src-adam-historia-20261017 ]

potencia:
  - tipo: no_especificado
    valor_mw: 8
    ambito: edificio
    referencia: "Potencia instalada prevista del edificio completo"
    estado_asociado: en_construccion
    fecha_dato: "2025-10"
    fuentes: [src-2]
    nota: "La fuente habla de '8 MW de potencia instalada' con certificación Tier III."
  - tipo: instalada_total
    valor_mw: 8
    ambito: edificio
    referencia: "Potencia instalada del edificio según el Ayuntamiento de Cerdanyola"
    estado_asociado: en_construccion
    fecha_dato: "2025-11-12"
    fuentes: [src-3]
    nota: >-
      La nota municipal dice «una potència instal·lada de 8 MW», lo que tipifica
      la cifra que la prensa daba sin calificar. Es la misma magnitud que el
      registro anterior, no una capacidad adicional.
  - tipo: no_especificado
    valor_mw: 4
    ambito: fase
    referencia: "Primera fase, cuatro salas"
    estado_asociado: en_construccion
    fecha_dato: "2025-10"
    fuentes: [src-2]
  - tipo: conexion_red
    valor_mw: 5
    ambito: fase
    referencia: Potencia eléctrica contratada para la fase 1
    estado_asociado: en_construccion
    fuentes:
      - src-1
    nota: La web actual dice 5 MW of electrical power already contracted for Phase 1. No es carga IT ni
      entrega energizada; no consta fecha editorial o resolución de acceso.

fases:
  - nombre: "Fase 1 (4 salas)"
    estado: en_construccion
    fecha_puesta_en_servicio: "2027"
    fuentes: [src-2]

superficie_construida_m2: 7500
refrigeracion: >-
  Paneles fotovoltaicos en cubierta, sistemas de refrigeración de alta eficiencia
  y suministro eléctrico 100% renovable, según la compañía. El director general
  de Adam declaró en la primera piedra que la instalación funcionará «sense
  consum d'aigua».

agua:
  circuito: sin_agua
  sistema: "Mecanismos avanzados de refrigeración que, según la compañía, no emplean agua."
  origen: null
  nota: >-
    Declaración del director general de Adam en el acto de la primera piedra,
    recogida por el Ayuntamiento de Cerdanyola. No se publica sistema concreto ni
    consumo de agua auxiliar.
  fuentes: [src-3, src-4]

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Las coordenadas son el centroide del Parc de l'Alba según Nominatim, no la
      parcela concreta del proyecto. Precisión aproximada.
    fuentes: [src-alba]
  - campo: potencia
    descripcion: >-
      La ficha actual de Adam da 5 MW eléctricos contratados para la fase 1 y ocho salas, frente a
      cuatro salas y 4 MW publicados en el anuncio inicial. El Ayuntamiento tipifica 8 MW instalados
      para el edificio completo. Se conservan los alcances y las previsiones; los 5 MW contratados
      no acreditan puesta en servicio ni carga IT.
    fuentes:
      - src-1
      - src-2
      - src-3
  - campo: ubicacion
    descripcion: >-
      Baxtel sitúa este proyecto en Carrer dels Artesans (Parc Tecnològic del
      Vallès), junto al centro PTV existente, mientras que la compañía y la
      prensa lo sitúan en el Parc de l'Alba. No se ha localizado dirección
      postal exacta ni coordenadas de fuente.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      La ficha databa la primera piedra en octubre de 2025 siguiendo a la prensa
      especializada, que publicó el anuncio del proyecto el 3 y el 7 de octubre.
      El Ayuntamiento de Cerdanyola y la propia Adam sitúan el acto el 11 de
      noviembre de 2025. Se conservan ambas fechas.
    fuentes: [src-2, src-3]
  - campo: propietario
    descripcion: Adam confirma que fue adquirido por CVC DIF en 2024. Es una adquisición de la empresa
      operadora; la fuente no identifica por separado la titularidad registral del inmueble de Parc
      de l’Alba.
    fuentes: [ src-5, src-adam-historia-20261017 ]
  - campo: fecha_puesta_en_servicio
    descripcion: El Ayuntamiento anunció en noviembre de 2025 una inauguración en 2027. La cronología de
      Adam, sin fecha de publicación, anuncia «2026 (Próximamente)». Se conservan ambas previsiones;
      no consta puesta en servicio.
    fuentes: [ src-3, src-adam-historia-20261017 ]

confianza: media
