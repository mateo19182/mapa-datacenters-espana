estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial. El CCC-UAM da soporte centralizado de computación al campus de la
  Universidad Autónoma de Madrid, que junto con diez centros del CSIC situados en el mismo
  campus y dos institutos IMDEA forma el Campus de Excelencia Internacional UAM+CSIC. Además de
  sus propios sistemas, el centro presta servicios de alojamiento de equipos de cómputo de
  terceros y de almacenamiento como servicio, lo que lo acerca en función —aunque no en escala—
  a un centro de datos de colocación académico. Es el nodo Cibeles de la RES, con el 100 % de
  Cibeles 3 y el 50 % de Cibeles 4 destinados a la red.
estado_fuentes: [src-res, src-uam]

