incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES ni la UAM publican potencia eléctrica, carga TI, número de racks ni superficie
      de la sala del CCC. El centro ofrece alojamiento de equipos de terceros sin publicar
      ninguna magnitud de la instalación que lo permite. Campo de potencia vacío.
    fuentes: [src-res, src-uam]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas corresponden al campus de Cantoblanco de la UAM, no al edificio concreto
      del Centro de Computación Científica, que ninguna fuente consultada identifica.
    fuentes: [src-mincyt, src-osm]

