    url: "https://www.elperiodicodearagon.com/aragon/2026/03/14/merlin-levantara-gran-centro-datos-127939373.html"
    titulo: "Merlin se queda con dos tercios del macroproyecto de centros de datos de Forestalia en medio del terremoto judicial y levantará su campus en Muel"
    editor: "El Periódico de Aragón"
    tipo: prensa_general
    fecha_publicacion: "2026-03-14"
    fecha_consulta: "2026-08-31"
    cita: "Merlin ha asumido 227 megavatios (MW) de acceso y conexión a la red eléctrica, de los 300 MW con los que contaba inicialmente el proyecto. Esta capacidad corresponde a dos de los tres nudos eléctricos sobre los que se articulaba la iniciativa: Los Vientos, ubicado en el término municipal de Muel, y María, en María de Huerva. De esta forma, la inmobiliaria liderada por Ismael Clemente se queda con dos de los tres centros de datos que Forestalia pretendía desarrollar dentro de este proyecto, mientras que el tercero —vinculado al nudo de Magallón— queda por ahora fuera de la operación."
  - id: src-6
    url: "https://www.hoyaragon.es/economia/forestalia-merlin-properties-centro-datos/20260825115657143286.html"
    titulo: "De estar en manos de Forestalia a ejecutarse la opción Merlin: la historia del centro de datos que promete no gastar agua"
    editor: "Hoy Aragón"
    tipo: prensa_general
    fecha_publicacion: "2026-08-25"
    fecha_consulta: "2026-08-31"
    cita: "El pasado marzo, en un contexto de investigación judicial abierta sobre la compañía —de la que ninguno de los implicados ha sido acusado ni condenado—, Forestalia vendió a Merlin dos tercios de la capacidad eléctrica del proyecto, correspondientes a Botorrita y a un segundo emplazamiento en Muel, quedándose únicamente con el centro de Magallón. [...] Merlin ha unificado toda esa capacidad en un solo campus de 28,8 hectáreas en el Polígono Industrial San Antonio"
