id: forestalia-magallon-dcm-data
nombre: "Forestalia — Centro de datos «DCM Data» (Magallón), proyecto Búfalo"
alias:
  - "DCM Data"
  - "Proyecto Búfalo"
tipo: campus
operador: "Grupo Forestalia"
propietario: "Energía Inagotable de Kaysa, S.L."
modelo: desconocido

ubicacion:
  municipio: "Magallón"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Emplazamiento próximo a la subestación «Magallón 220 kV» de Red Eléctrica de España"
  lat: 41.832608
  lon: -1.460934
  precision: municipio
  fuentes: [src-1, src-2]

estado: anunciado
estado_detalle: >-
  Uno de los tres centros de datos del proyecto "Búfalo", declarado por el Gobierno de
  Aragón el 12 de noviembre de 2025 como inversión de interés autonómico y como proyecto
  prioritario con generación renovable asociada al amparo de la Ley 5/2024 de fomento de
  comunidades energéticas y autoconsumo industrial en Aragón. El suministro procede de la
  red de transporte en la posición de «Magallón 220 kV», asociado a instalaciones de generación
  renovable del grupo que cambian su régimen de acceso a autoconsumo con excedentes. La
  fase 1 está prevista para el primer semestre de 2028.
estado_fuentes: [src-1]

potencia:
  - tipo: conexion_red
    valor_mw: 70
    ambito: campus
    referencia: "Potencia para el suministro de energía desde la red de transporte concedida por REE en el nudo Magallón 220 kV"
    estado_asociado: anunciado
    fecha_dato: "2025-11-12"
    fuentes: [src-1]
    nota: >-
      El acuerdo describe la suma de las tres potencias (70 + 81 + 146,5 = 297,5 MW) como
      "demanda IT suministrada por la red de transporte", pero se trata de la potencia
      concedida por REE en el punto de conexión.
  - tipo: it
    valor_mw: 275
    ambito: campus
    referencia: "Consumo eléctrico final previsto con escalabilidad"
    estado_asociado: anunciado
    fecha_dato: "2025-11-12"
    fuentes: [src-1, src-4]
    nota: >-
      "se plantea una situación final de consumo eléctrico para los tres centros de datos
      con una escalabilidad hasta 275 MW IT para el \"DCM Data\"". Requiere sobredimensionar
      la generación renovable asociada.

fases:
  - nombre: "Fase 1"
    estado: anunciado
    fecha_puesta_en_servicio: "2028"
    fuentes: [src-1]
    nota: >-
      Urbanización y construcción del centro de datos, con demanda garantizada por la red de
      transporte y 70 MW de generación renovable eólica y fotovoltaica asociada en
      régimen de autoconsumo con excedentes.
  - nombre: "Fase 2"
    estado: anunciado
    fecha_puesta_en_servicio: "2029"
    fuentes: [src-1]
    nota: "Ampliación de la generación renovable asociada e integración de almacenamiento."

conexion_electrica:
  subestacion: "SE Magallón 220 kV (Red Eléctrica de España)"
  tension_kv: 220
  titular_red: "Red Eléctrica de España"
  mw_solicitados: null
  mw_concedidos: 70
  fuentes: [src-1]
  nota: >-
    La instalación de generación renovable asociada tiene 143.5 MW de acceso y conexión en
    REE y 154.12 MW instalados. Conforme al artículo 6.9 del Real Decreto 1183/2020, el
    centro de datos puede obtener hasta el 50 % de la capacidad de acceso de la instalación
    de generación a la que se asocia, por lo que no puede conectarse sin ella.

empleo:
  - tipo: construccion
    valor: 9625
    referencia: "Empleo previsto en fase de construcción para «DCM Data», a razón de 35 empleos directos, indirectos e inducidos por MW IT sobre 275 MW IT"
    fecha_dato: "2025-11-12"
    fuentes: [src-4]
    nota: >-
      Cifra derivada de una ratio por MW IT aplicada al objetivo final de escalabilidad, no
      de un plan de plantilla.
  - tipo: total
    valor: 825
    referencia: "Empleo previsto en fase de explotación para «DCM Data», a razón de 3 empleos directos, indirectos e inducidos por MW IT"
    fecha_dato: "2025-11-12"
    fuentes: [src-4]
    nota: >-
      Cifra derivada de una ratio por MW IT aplicada al objetivo final de escalabilidad, no
      de un plan de plantilla.

inversion_anunciada_eur: 3307774000
enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      El acuerdo mezcla la potencia concedida en el punto de conexión con la expresión
      "demanda IT", y a la vez fija un objetivo final de 275 MW IT muy superior. Se
      registran ambos valores sin sumarlos.
    fuentes: [src-1]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La tabla del Acuerdo titula la cifra "Inversión Capex DCM Data" dentro de un
      apartado que describe la inversión de los tres centros de datos "con sus proyectos
      energéticos asociados", de modo que no consta qué parte corresponde al centro de datos
      y qué parte a la generación renovable vinculada.
    fuentes: [src-3]
  - campo: estado
    descripcion: >-
      Es el único de los tres centros del proyecto "Búfalo" que sigue en manos de Forestalia.
      A finales de febrero de 2026 el grupo vendió a MERLIN Properties los derechos de acceso
      y conexión de los otros dos nudos —María 220 kV y Los Vientos 220 kV, 227 MW de los
      300 MW iniciales—, que MERLIN ha refundido en su campus «Zaragoza-WIND» de Botorrita;
      el nudo de Magallón quedó fuera de la operación. Fuentes del sector citadas por la
      prensa consideran probable que este activo acabe también en manos de MERLIN, que no lo
      ha confirmado. Los 70 MW de esta ficha son, por tanto, la única potencia del proyecto
      "Búfalo" que no está duplicada con la del campus de MERLIN.
    fuentes: [src-5, src-6, src-7]
  - campo: ubicacion
    descripcion: >-
      No se publican coordenadas ni referencias catastrales; solo la proximidad al nudo
      «Magallón 220 kV». Las coordenadas registradas son el centroide municipal (Wikidata).
    fuentes: [src-1, src-2]

