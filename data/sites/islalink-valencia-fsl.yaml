    cita: "Esta infraestructura, en funcionamiento desde hace más de 25 años, permite conectar las Islas Baleares con la Península a través de un triple cable de fibra óptica submarina [...] La compañía opera seis Centros de Datos propios, cuatro de ellos en España (Madrid, Valencia, Mallorca e Ibiza), además de otros dos ubicados en Italia y Grecia. [...] La instalación visitada en Valencia, conocida también como Cable Landing Station (CLS), cumple con los estándares más exigentes del sector en materia de disponibilidad de conectividad, suministro eléctrico, climatización y control de acceso."
