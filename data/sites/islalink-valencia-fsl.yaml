estado_detalle: >-
  Instalación de IslaLink (sociedad BalaLink S.A.U.) en València, registrada como
  facility activa en PeeringDB y como data center de colocation operativo en el directorio
  del Observatorio Español de Data Centers. La instalación es la estación de aterraje
  (Cable Landing Station) del sistema submarino que enlaza la península con las Islas
  Baleares, en la Fuente de San Luis, y lleva más de 25 años en funcionamiento; sobre ella
  el operador presta colocation y housing. IslaLink opera seis centros de datos propios,
  cuatro en España (Madrid, Valencia, Mallorca e Ibiza) y dos en Italia y Grecia. Según el
  Colegio Oficial de la Ingeniería Informática de la Comunitat Valenciana, la instalación
  mantuvo el servicio durante la DANA de octubre de 2024 y el apagón de 2025 y no ha
  sufrido ningún «paso por cero» desde su inauguración.
estado_fuentes: [src-1, src-2, src-3]

incertidumbres:
  - campo: potencia
    descripcion: >-
      No se ha localizado ninguna cifra de potencia, superficie ni número de racks: ni el
      operador ni el reportaje de la visita institucional de junio de 2026 publican MW. Lo
      que sí queda documentado es la naturaleza de la instalación: es la Cable Landing
      Station del cable a Baleares, no un data center independiente del punto de aterraje.
    fuentes: [src-1, src-2, src-3]

