    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      Los 40 MW aparecen como «critical power» en 2024 y como «Critical IT Load» en la ficha de
      producto de 2025. Se registran las dos lecturas de la misma unidad, que no se suman.
    fuentes: [src-1, src-2]

