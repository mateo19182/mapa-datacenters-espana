estado_detalle: >-
  Prime anunció en mayo de 2024 la compra de 7,6 acres en Alcobendas para un único edificio de
  unos 26.000 m². La ficha de la compañía mantiene el emplazamiento en estado «Development» y
  declara que se desarrollará según la demanda del cliente. No se ha localizado licencia de obra
  ni anuncio de inicio de obras.
