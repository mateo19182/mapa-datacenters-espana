estado: permisos_concedidos
estado_detalle: >-
  Declarado Proyecto Industrial Estratéxico (PIE) por Acuerdo del Consello de la
  Xunta de 9 de septiembre de 2024. Sometido a información pública mediante anuncio
  de 17 de enero de 2025 de la Secretaría General de Industria y Desarrollo
  Energético, sin alegaciones. La Subdirección General de Evaluación Ambiental
  concluyó el 26 de noviembre de 2024 que el proyecto no está incluido en el ámbito
  de la Ley 21/2013 de evaluación ambiental ni sometido a autorización ambiental
  integrada. El Consello de la Xunta aprobó el proyecto industrial estratégico el
  26 de enero de 2026 (resolución publicada en el DOG de 16 de febrero de 2026). El
  proyecto aprobado corresponde a la etapa 1 de la fase 1. Es el primer gran centro
  de proceso de datos de Galicia.
estado_fuentes: [src-1, src-2, src-3]

