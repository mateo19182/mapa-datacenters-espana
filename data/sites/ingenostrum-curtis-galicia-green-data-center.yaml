incertidumbres:
  - campo: potencia
    descripcion: >-
      El anuncio del DOG describe el edificio con tres salas IT pero no publica la
      potencia. El informe oficial del PIE sí desglosa 5 MW por edificio y una
      implantación inicial de 2 MW, pero sin decir si son MW de carga TI. Quienes
      tipifican la cifra como «MW IT» son SpainDC y DataCenterDynamics, no el
      expediente.
    fuentes: [src-1, src-3, src-4, src-5]
  - campo: fases
    descripcion: >-
      El informe del PIE se contradice consigo mismo en la unidad física: el objeto
      del proyecto es «un edificio que se divide en 3 salas IT diferentes, con una
      superficie por sala aproximadamente de 1667 m2», pero el desglose por fases
      habla de un segundo y un tercer «edificio destinado a Data Center de 5MW».
      No se ha podido determinar si el complejo final será un edificio con tres
      salas o tres edificios.
    fuentes: [src-3]
  - campo: superficie_parcela_m2
    descripcion: >-
      Los 29.659,69 m² corresponden a las parcelas B5 y B6, que ocupa el centro de
      datos. Las parcelas B8 y B9, donde se implanta la subestación, suman otros
      10.495,64 m². DataCenterDynamics habla de «una superficie superior a 40.000
      metros cuadrados» para las cuatro parcelas. No se suman aquí.
    fuentes: [src-3, src-5]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Las cifras publicadas no son comparables entre sí. El informe oficial del PIE
      da un presupuesto de 36.908.062,50 € solo para la etapa 1 de la fase 1 (2 MW),
      más 2.685.148,25 € de la subestación y 492.720,72 € de las líneas de 15 y
      66 kV. DataCenterDynamics habla de un presupuesto global superior a 50
      millones con una primera etapa de 37 millones. SpainDC, en cambio, atribuye al
      proyecto «una inversión de 150 millones de euros». No se sustituye el valor
      registrado.
    fuentes: [src-3, src-4, src-5]
  - campo: propietario
    descripcion: >-
      El proyecto nació impulsado por Ingenostrum en el marco de la alianza
      público-privada Impulsa Galicia. En mayo de 2026 la prensa gallega informó de
      la compra de Ingenostrum por el grupo australiano IREN; no se ha podido abrir
      una fuente primaria que lo confirme, por lo que no se registra el cambio.
    fuentes: [src-1]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      El anuncio de la Xunta no fija fecha; el plazo «comenzará a contar desde el
      momento en el que se disponga de todos los permisos necesarios». Titulares de
      enero de 2026 hablan de retraso del encendido a finales de 2027.
    fuentes: [src-2]

confianza: alta
ultima_verificacion: "2026-08-31"

