id: tillion-villamayor-de-gallego
nombre: "Tillion Aragón — Campus de centros de datos (Villamayor de Gállego)"
alias:
  - "Proyecto Tillion Aragón"
  - "Maquina Solar (denominación anterior de la promotora)"
tipo: campus
operador: "Tillion Aragón, S.L. (Grupo Azora)"
propietario: "Tillion Aragón, S.L."
modelo: mayorista

ubicacion:
  municipio: "Villamayor de Gállego"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Sector delimitado por la carretera A-129 y el Camino de la Carbonera"
  lat: 41.685556
  lon: -0.773889
  precision: municipio
  fuentes: [src-1, src-3]

estado: en_tramitacion
estado_detalle: >-
  Declarado inversión de interés autonómico con interés general de Aragón el 13 de marzo de
  2025 (entonces promovido por Maquina Solar, S.L., hoy Tillion Aragón, S.L.). La promotora
  presentó la documentación del PIGA el 21 de febrero de 2026 y el Plan se aprobó
  inicialmente por Orden de 24 de junio, sometiéndose a información y participación pública
  junto con su documentación ambiental. INAGA tramitó en febrero de 2026 las consultas
  previas para el documento de alcance del estudio ambiental estratégico.
estado_fuentes: [src-1, src-2, src-4]

potencia:
  - tipo: no_especificado
    valor_mw: 75
    ambito: edificio
    referencia: "Capacidad de cada uno de los cuatro edificios de centro de datos"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-02-21"
    fuentes: [src-1]
    nota: >-
      "Cada edificio tendrá una capacidad de 75 MW". La memoria no precisa si se refiere a
      carga TI o a potencia eléctrica total.
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Potencia eléctrica total del campus"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-02-21"
    fuentes: [src-1]
    nota: >-
      "Potencia eléctrica total del campus: 300 MW". El mismo documento habla de "una
      demanda total de 300 MW".
  - tipo: conexion_red
    valor_mw: 150
    ambito: campus
    referencia: "Potencia de suministro ya asegurada"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-02-21"
    fuentes: [src-1]
    nota: >-
      "el proyecto prevé una demanda total de 300 MW, de los cuales ya se encuentran
      asegurados 150 MW, con ampliación solicitada hasta completar el total".

fases:
  - nombre: "Etapa 1"
    estado: en_tramitacion
    superficie_m2: 520000
    fuentes: [src-1]
    nota: "Aproximadamente 52 ha; edificios DC-1 y DC-2."
  - nombre: "Etapa 2"
    estado: anunciado
    superficie_m2: 280000
    fuentes: [src-1]
    nota: "Aproximadamente 28 ha; edificios DC-3 y DC-4."

conexion_electrica:
  subestacion: "SET CPD Tillion 400/66/20 kV en el propio campus, alimentada desde la SE Peñaflor 400 kV"
  tension_kv: 400
  titular_red: "Red Eléctrica de España — SE Peñaflor 400 kV"
  mw_solicitados: 300
  mw_concedidos: 150
  fuentes: [src-1, src-2]
  nota: >-
    "El suministro se realizará en alta tensión (400 kV) desde la Subestación de Peñaflor,
    conectando con una subestación propia situada dentro del ámbito del campus". El PIGA
    incluye además cuatro líneas subterráneas de alta tensión de 66 kV y cuatro
    subestaciones 66/11 kV, una por edificio.

superficie_parcela_m2: 799073
superficie_construida_m2: 300000
inversion_anunciada_eur: 2360000000
refrigeracion: >-
  Refrigeración por aire. La ordenación orienta las cuatro unidades de edificación de
  noroeste a sureste, alineadas con el viento dominante, para favorecer la ventilación
  natural y la evacuación del aire caliente de los sistemas de refrigeración.

agua:
  circuito: desconocido
  sistema: >-
    Refrigeración por aire según la documentación ambiental del PIGA. La promotora afirma que
    "la instalación minimiza el consumo de agua".
  origen: "Conexión exterior de abastecimiento de agua potable incluida en el PIGA"
  consumo_m3_ano: 6066
  nota: >-
    Cifra tomada del estudio de impacto ambiental publicado en julio de 2026 y difundida por
    prensa; no se ha localizado el documento ambiental original en abierto. La memoria del
    PIGA de febrero de 2026 no cuantifica el consumo de agua. La misma fuente atribuye al
    proyecto un consumo eléctrico de 2.628 GWh al año una vez completadas las dos fases.
  fuentes: [src-5]

energia:
  - consumo_gwh_ano: 2628
    referencia: "Consumo eléctrico anual del campus una vez completadas las dos fases previstas"
    fecha_dato: "2026-07-08"
    fuentes: [src-5]
    nota: >-
      Cifra de la documentación ambiental del PIGA publicada en julio de 2026, conocida a
      través de prensa; no se ha podido leer el documento original. La segunda fase queda
      condicionada a disponer de la capacidad eléctrica necesaria, de modo que es un techo,
      no una previsión firme.

empleo:
  - tipo: total
    valor: 1308
    referencia: "Media anual de empleos durante la vida útil del proyecto, incluidos directos, indirectos e inducidos"
    fecha_dato: "2026-02-21"
    fuentes: [src-6]
    nota: >-
      La memoria eleva la cifra a 1.773 en el escenario en que el campus alcanza los 300 MW.
      No desglosa cuántos son de obra y cuántos de explotación.
enlaces_proyecto:
  - "https://www.aragon.es/-/piga-tillion-aragon"

incertidumbres:
  - campo: potencia
    descripcion: >-
      La memoria del PIGA usa "capacidad" y "potencia eléctrica total" sin distinguir carga
      TI de potencia de conexión, por lo que los 75 MW por edificio y los 300 MW del campus
      se registran como no especificados. Solo los 150 MW asegurados pueden clasificarse con
      seguridad como potencia de acceso a la red.
    fuentes: [src-1]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La cifra de 2.360 millones procede de la documentación ambiental del PIGA publicada en
      julio de 2026, difundida por prensa. Anuncios anteriores de la promotora y de la
      prensa hablaron de 1.100 millones en una primera fase y hasta 1.950 o 2.000 millones
      con la ampliación. No se ha podido leer el documento ambiental original para
      contrastar la cifra.
    fuentes: [src-5]
  - campo: agua
    descripcion: >-
      La memoria del PIGA no cuantifica el consumo de agua; los 6.066 m³/año proceden del
      estudio de impacto ambiental a través de prensa. No consta el sistema concreto de
      refrigeración ni el origen del agua de proceso.
    fuentes: [src-1, src-5]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas registradas son el centroide municipal de Villamayor de Gállego
      (Wikidata). En el mismo municipio se proyecta también el campus de Microsoft y las
      estaciones de medida de AWS y de ACS, todos ellos emplazamientos distintos.
    fuentes: [src-3]

confianza: alta
ultima_verificacion: "2026-08-31"

