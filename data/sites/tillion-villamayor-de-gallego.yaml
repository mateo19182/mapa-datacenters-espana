refrigeracion: >-
  Circuito cerrado de agua enfriada compartido por refrigeración directa al chip mediante
  CDU y refrigeración por aire mediante HCU. Enfriadoras sin sistemas evaporativos o
  adiabáticos de rechazo de calor; la climatización sí contempla humectación. Pico de
  PUE de diseño 1,5, no rendimiento medido.

agua:
  circuito: cerrado
  sistema: >-
    Agua enfriada en circuito cerrado para CDU y HCU. Los equipos de tratamiento de aire
    emplean agua osmotizada para humectación. La memoria prevé riego con aguas pluviales.
  origen: "Abastecimiento municipal de agua potable; captación de pluviales para riego"
  consumo_m3_ano: 6066.36
  wue_l_kwh: 0.01
  nota: >-
    Previsión del proyecto básico de solicitud de AAI de mayo de 2026, no consumo medido:
    4.511,40 m³/año sanitarios y de limpieza, menos de 1 m³ para PCI y 1.554,96 m³ de
    humectación; tabla total 6.066,36 m³/año. El WUE 0,01 es un objetivo de diseño cuya
    base no se concilia expresamente con el consumo eléctrico anual del mismo documento.
  fuentes: [src-aai-202605]

