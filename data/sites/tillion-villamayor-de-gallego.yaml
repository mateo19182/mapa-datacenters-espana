    titulo: "Azora y Blackstone: dos centros de datos absorberán casi el 70% de la electricidad que consume hoy Aragón"
    editor: "elDiario.es Aragón"
    tipo: prensa_general
    fecha_publicacion: "2026-07-08"
    fecha_consulta: "2026-08-31"
    cita: "El proyecto de Azora, denominado Tillion Aragón, prevé una inversión de 2.360 millones de euros para levantar cuatro edificios de centros de datos en Villamayor de Gállego. La documentación ambiental estima un consumo de 2.628 GWh anuales una vez completadas las dos fases previstas [...] Tanto Blackstone como Azora recurrirán a sistemas de refrigeración por aire, una tecnología que reduce notablemente las necesidades hídricas frente a otros modelos. El proyecto de Calatorao estima un consumo anual de 4.782 metros cúbicos de agua y el de Villamayor, 6.066 metros cúbicos."
