    editor: "Gobierno de Aragón"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: "Se estima la creación de una media de 1.308 empleos anuales durante la vida útil del Proyecto (1.773 en el caso de 300 MW). Se crearán puestos de trabajo en las distintas etapas de construcción y operación."
