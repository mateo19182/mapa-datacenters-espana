incertidumbres:
  - campo: potencia
    descripcion: >-
      La memoria urbanística denomina 300 MW a la potencia eléctrica total y demanda del campus,
      sin tipo TI. El proyecto de solicitud de AAI de mayo de 2026 sí llama 150 MW IT a la primera
      fase y 300 MW IT al conjunto. En sus apartados técnicos, sin embargo, describe 72 MWe IT por
      edificio y 108 MWe de carga total por edificio, con 432 MWe totales de red. Se conservan las
      magnitudes y la contradicción; no se equiparan demanda de red y carga TI ni se fuerza una
      suma única de edificios. Los 150 MW de suministro asegurado son una declaración de la
      promotora, sin permiso de acceso localizado.
    fuentes: [src-1, src-aai-202605, src-7, src-8]
  - campo: inversion_anunciada_eur
    descripcion: >-
      El estudio económico-financiero de mayo de 2026 cifra el PEC sin IVA en
      2.359.916.340,83 euros y el resumen da costes totales de 2.360.215.606,37 euros.
      Se conserva la cifra redondeada anunciada de 2.360 millones. No es gasto ya ejecutado.
    fuentes: [src-economico-202605, src-5]
  - campo: energia
    descripcion: >-
      Los 2.628 GWh/año coinciden con 300 MW sostenidos 8.760 horas, pero esa coincidencia
      no demuestra el método de cálculo. El documento primario los llama consumo medio anual
      estimado y distingue 432 MWe de potencia total de red, además de las lecturas TI descritas
      arriba. No se deriva un PUE medido ni se corrige la cifra mediante una regla aritmética.
    fuentes: [src-aai-202605]
  - campo: agua
    descripcion: >-
      El proyecto de AAI publica consumo y circuito, con agua para humectación, además del
      circuito cerrado de refrigeración. Sus cifras de WUE, energía y agua son previsiones
      de diseño; no se ha localizado una conciliación explícita de sus denominadores ni una
      medición de explotación.
    fuentes: [src-aai-202605]
  - campo: ubicacion
    descripcion: >-
      Se retira el centroide municipal de Villamayor de Gállego que figuraba como coordenada
      del campus. No se ha recuperado un pin identificado de la parcela. En el mismo municipio
      se proyectan otros campus de Microsoft, AWS y ACS, que son emplazamientos distintos.
    fuentes: [src-1, src-3]

