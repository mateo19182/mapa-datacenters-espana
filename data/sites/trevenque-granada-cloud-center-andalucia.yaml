incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni Trevenque ni la prensa publican potencia eléctrica del centro. La única magnitud de
      capacidad difundida es el número de servidores físicos alojables (más de 5.000), que no es
      convertible a MW. Campo de potencia vacío.
    fuentes: [src-2, src-4]
  - campo: operador
    descripcion: >-
      El cruce por compañías que originó esta pista atribuía un centro de datos en Granada a
      Vodafone bajo el nombre «Cloud Center Andalucía». Son cosas distintas: Cloud Center
      Andalucía es la marca del centro de datos del Grupo Trevenque, empresa granadina sin
      relación societaria con Vodafone. No se ha localizado ningún centro de datos de Vodafone en
      Granada.
    fuentes: [src-1, src-2]
  - campo: superficie_construida_m2
    descripcion: >-
      Los «más de 1.000 m²» son de 2015 y no se ha localizado una cifra actualizada. Se registra
      como suelo mínimo conocido.
    fuentes: [src-2]
  - campo: ubicacion
    descripcion: >-
      La dirección procede de la guía sectorial de Data Center Market. Una nota de la propia
      Trevenque de 2020 sitúa las instalaciones «en el noroeste de Granada capital», mientras que
      el Parque Empresarial Cortijo del Conde está al sur de la ciudad. Las coordenadas
      registradas son el centroide municipal, no la nave.
    fuentes: [src-1, src-3, src-osm]

confianza: baja
ultima_verificacion: "2026-08-31"

