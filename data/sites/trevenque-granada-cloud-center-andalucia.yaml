incertidumbres:
  - campo: potencia
    descripcion: >-
      No se publica potencia eléctrica del centro. El catálogo actual describe capacidad para
      100 racks y 3.000 servidores, distinta de los más de 5.000 servidores de las noticias
      históricas. Son capacidades de alojamiento, no inventario instalado ni MW.
    fuentes: [src-2, src-4, src-housing-20261017]
  - campo: operador
    descripcion: >-
      El cruce por compañías que originó esta pista atribuía un centro de datos en Granada a
      Vodafone bajo el nombre «Cloud Center Andalucía». Son cosas distintas: Cloud Center
      Andalucía es la marca del centro de datos del Grupo Trevenque, empresa granadina sin
      relación societaria con Vodafone. No se ha localizado ningún centro de datos de Vodafone en
      Granada.
    fuentes: [src-1, src-2]
  - campo: superficie_construida_m2
    descripcion: >-
      El operador publica más de 1.000 m² entre nave, centro de datos y salas técnicas. Es un
      límite inferior con ese ámbito, no una superficie construida exacta de 1.000 m².
    fuentes: [src-2, src-housing-20261017]
  - campo: computo
    descripcion: >-
      El despliegue de HPE Private Cloud AI queda vinculado al centro propio de Granada, pero no
      se publican modelo, número de GPU o fecha de instalación. El día de la entrevista no se
      registra como puesta en servicio del hardware.
    fuentes: [src-hpe-20260922]

confianza: baja
ultima_verificacion: "2026-10-17"

