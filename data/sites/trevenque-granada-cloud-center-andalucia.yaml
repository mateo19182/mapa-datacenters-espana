estado: operativo
estado_detalle: >-
  Centro de datos neutral operado por el Grupo Trevenque, en funcionamiento desde noviembre de
  2012. En 2015 se describía como el mayor centro de datos de Andalucía por capacidad, con más
  de 1.000 m² y sitio para más de 5.000 servidores físicos, catorce operarios en el centro y
  clientes en dieciséis países. En junio de 2020 instaló placas solares en la cubierta que
  cubren en torno al 25 % de la energía que consume.
