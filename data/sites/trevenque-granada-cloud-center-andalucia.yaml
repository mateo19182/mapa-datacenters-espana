estado_detalle: >-
  Centro de datos neutral de Grupo Trevenque, antes denominado Cloud Center Andalucía,
  operativo desde noviembre de 2012. El operador identifica su nave en Pago de Cambea 13 y
  publica capacidad para 100 racks y 3.000 servidores físicos. La entrevista de septiembre de
  2026 con sus responsables y HPE describe el despliegue físico de HPE Private Cloud AI en
  este centro de Granada, sin modelos ni recuento de GPU.
estado_fuentes: [src-2, src-3, src-4, src-sedes-20261017, src-housing-20261017, src-hpe-20260922]
