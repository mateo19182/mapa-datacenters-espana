estado: en_tramitacion
estado_detalle: El BOCYL de 16 de septiembre de 2026 inicia la tramitación del Proyecto Regional y
  su información pública, con evaluación ambiental ordinaria. Prevé 200 MW IT en cinco edificios y
  funcionamiento aislado de la red, con solar, baterías y motores. No acredita aprobación
  definitiva, AAI concedida ni obras iniciadas.

