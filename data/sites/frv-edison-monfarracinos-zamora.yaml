    fecha_dato: 2026-09-11
    fuentes:
      - src-bocyl-20260916
      - src-basico-r04
    nota: El BOCYL tipifica expresamente 200 MW IT. Es capacidad de proyecto en tramitación, sin
      instalación o servicio acreditados.

fases: []

conexion_electrica:
  subestacion: null
  tension_kv: null
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: El proyecto define operación off-grid, aislada de la red nacional, con 1.625 MWp
    fotovoltaicos, baterías de 4.817 MWh y motores duales. Las líneas propias de 220 kV alimentan la
    microrred del proyecto; no acreditan permiso de acceso a REE. El resumen de AAI distingue
    1.163,969 MWt térmicos y 548,688 MW eléctricos de motores, con 24 motores duales y cinco grupos
    diésel de emergencia. Los MWt se conservan en la descripción y quedan fuera de las lecturas MW
    del CPD.
  fuentes:
    - src-basico-r04
    - src-bocyl-20260916

refrigeracion: Agua glicolada en circuitos cerrados, enfriadoras aire-agua con free cooling y
  distribución mediante aire y CDU para refrigeración líquida. Los motores tienen circuitos cerrados
  propios. Son características de diseño, sin rendimiento medido.

agua:
  circuito: cerrado
  sistema: Circuitos cerrados de agua glicolada para el CPD y motores; redes independientes de agua
    potable y no potable para otros usos.
  origen: Redes potable y no potable del polígono, con reutilización de pluviales para riego y limpieza.
  consumo_m3_ano: null
  consumo_m3_dia: null
  wue_l_kwh: null
  nota: El resumen de AAI de julio da 6.281,65 m³/año potables y 11.911,6 m³/año no potables para CPD
    y planta de energía. La memoria separa para el CPD 5.022,4 m³/año potables y 3.997,4 no
    potables; estos últimos incluyen reutilización de lluvia. No se reduce ese desglose a un consumo
    único del CPD ni a captación neta. Son previsiones de diseño, sin medición de explotación.
  fuentes:
    - src-rnt-aai-202607
    - src-basico-r04

inversion_anunciada_eur: null

incertidumbres:
  - campo: potencia
    descripcion: Los 200 MW IT ya tienen fuente oficial. Faltan resolución de aprobación y permisos
      energéticos individualizados; las potencias térmica, eléctrica de motores y solar corresponden
      a sistemas distintos y no se suman como capacidad del CPD.
    fuentes:
      - src-bocyl-20260916
      - src-rnt-aai-202607
  - campo: energia
    descripcion: La tabla mensual de la memoria suma y publica 2.255 GWh/año de demanda y 664 GWh/año de
      motores, mientras otros pasajes escriben 2.255.489 kWh/año y 664 MWh/año. La discrepancia de
      unidades requiere aclaración del redactor; no se corrige con un factor supuesto ni se publica
      un único consumo eléctrico anual.
    fuentes:
      - src-basico-r04
      - src-rnt-aai-202607
  - campo: operador
    descripcion: Edison Next Spain y FRV-X Renewable promueven el proyecto. El operador o cliente de los
      edificios continúa sin identificar.
    fuentes:
      - src-bocyl-20260916
  - campo: inversion_anunciada_eur
    descripcion: El presupuesto de ejecución de la memoria básica distingue coste total, margen y precio
      de venta, y su alcance no permite equipararlo sin más a la inversión del conjunto con parque
      solar. No se registra una cifra única de inversión anunciada del campus.
    fuentes:
      - src-basico-r04
  - campo: agua
    descripcion: Se han resuelto el periodo anual y el desglose primario. La cifra periodística de 1,36
      millones de litros diarios no coincide con ese balance y no se adopta sin explicar alcance o
      revisión. El uso no potable incluye lluvia reutilizada, por lo que tampoco equivale a
      captación externa.
    fuentes:
      - src-rnt-aai-202607
      - src-basico-r04
      - src-laopinion
  - campo: empleo
    descripcion: La memoria calcula 430 personas para edificios independientes o 372 con gestión
      unificada, más personal de la planta energética. Son escenarios de diseño, no empleo creado ni
      una única previsión cerrada.
    fuentes:
      - src-basico-r04
  - campo: ubicacion
    descripcion: La memoria regional identifica dos parcelas previstas del polígono. Se retira el
      centroide municipal; falta un pin nominal o coordenada inequívoca del emplazamiento en un
      plano, sin atribuir al CPD parcelas de la fotovoltaica.
    fuentes:
      - src-proyecto-regional-202609
  - campo: estado
    descripcion: La resolución de septiembre inicia el procedimiento, no declara el proyecto
      definitivamente aprobado. La PNL de octubre pide acceso documental y aclarar la relación con
      el trámite de AAI. No se acredita concesión ambiental o inicio efectivo de obras.
    fuentes:
      - src-bocyl-20260916
      - src-cortes-pnl-20261008

