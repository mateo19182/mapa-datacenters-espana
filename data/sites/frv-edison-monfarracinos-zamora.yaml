id: frv-edison-monfarracinos-zamora
nombre: "Data Center Hiperescalar IA Zamora — Monfarracinos (polígono Zamora Norte)"
alias:
  - "Megacentro de datos de Monfarracinos"
  - "Data Center Hiperescalar IA Zamora"
tipo: campus
operador: null
propietario: "FRV-X Renewable, S.L.U. y Edison Next Spain, S.L.U."
modelo: hyperscale

ubicacion:
  municipio: "Monfarracinos"
  provincia: "Zamora"
  ccaa: "Castilla y León"
  direccion: "Polígono Zamora Norte"
  lat: 41.5526221
  lon: -5.7064267
  precision: municipio
  fuentes: [src-elespanol, src-osm]

estado: en_tramitacion
estado_detalle: >-
  En información pública durante agosto de 2026, con plazo de alegaciones hasta
  el 16 de septiembre de 2026, en el procedimiento de Autorización Ambiental
  Integrada ante la Consejería de Agricultura, Ganadería, Medio Rural y Política
  Ambiental de la Junta de Castilla y León. El proyecto ha generado oposición
  vecinal y política: Ecologistas Zamora presentó alegaciones pidiendo la
  denegación de la autorización el 23 de agosto de 2026 y el PSOE reclamó
  transparencia el 25 de agosto. La vicepresidenta segunda de la Junta declaró el
  29 de agosto de 2026 que la llegada del proyecto aún no está confirmada. El
  polígono Zamora Norte que lo acogería es una promoción pública de la Junta con
  18 millones de euros de inversión.
estado_fuentes: [src-elespanol, src-zamoranews, src-laopinion, src-ecologistas]

potencia:
  - tipo: it
    valor_mw: 200
    ambito: campus
    referencia: "Potencia prevista del centro de datos según el expediente"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08-08"
    fuentes: [src-zamoranews]
    nota: >-
      La cifra procede del análisis del expediente de Autorización Ambiental
      Integrada realizado por Ecologistas Zamora y recogido por la prensa local,
      que la enuncia como "potencia prevista es de 200 MW IT". No la han publicado
      ni las promotoras ni la administración, y no se ha podido leer directamente
      en el expediente.
  - tipo: generacion_asociada
    valor_mw: 1160
    ambito: campus
    referencia: "Potencia térmica de la central de generación asociada (1,16 GWt)"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08"
    fuentes: [src-elespanol, src-zamoranews]
    nota: >-
      Es potencia TÉRMICA de la planta de generación asociada, alimentada con gas
      natural, no potencia eléctrica ni carga TI. No debe compararse con los MW de
      otros emplazamientos ni con los 200 MW IT del propio centro. Según el
      análisis del expediente, la combustión aportaría unos 664 GWh anuales de
      electricidad al centro de datos, consumiendo 141,5 millones de metros
      cúbicos de gas natural al año en 8.760 horas de funcionamiento.

fases: []

conexion_electrica:
  subestacion: null
  tension_kv: null
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    El proyecto se plantea con generación propia de gas natural en el
    emplazamiento, con gasoducto de alta presión, almacenamiento de gasóleo,
    planta fotovoltaica y un sistema de baterías de litio de 4.817 MWh de
    capacidad. No consta punto de conexión a la red de transporte ni potencia de
    acceso solicitada o concedida.
  fuentes: [src-zamoranews]

refrigeracion: >-
  Refrigeración mayoritariamente por ventilación accionada eléctricamente, según
  el análisis del expediente, con consumo de agua adicional declarado.

agua:
  circuito: desconocido
  sistema: >-
    Según el análisis del expediente hecho por Ecologistas Zamora, buena parte de
    la refrigeración se realizaría mediante sistemas de ventilación accionados
    eléctricamente, pero el proyecto contempla igualmente consumo de agua.
  origen: "Acuíferos de la zona; la Confederación Hidrográfica del Duero ha advertido de que el proyecto puede llevar al límite sus reservas"
  consumo_m3_ano: null
  consumo_m3_dia: null
  wue_l_kwh: null
  nota: >-
    No se registra ninguna cifra porque las publicadas no son conciliables ni
    llevan periodo declarado. Las del expediente recogidas por El Español son
    6.281,65 metros cúbicos de agua potable y 11.911,6 de no potable, sin indicar
    si son diarios, mensuales o anuales. La formación Zamora Decide cifró el 20 de
    agosto de 2026 el consumo en 1,36 millones de litros diarios, equivalente al
    de una población de 50.000 habitantes, cerca de los 60.000 de la capital
    zamorana. No se convierte de litros al día a metros cúbicos al año.
  fuentes: [src-elespanol, src-laopinion]

inversion_anunciada_eur: null

incertidumbres:
  - campo: potencia
    descripcion: >-
      Los 200 MW IT proceden de un análisis del expediente hecho por una
      organización ecologista opuesta al proyecto y difundido por la prensa local;
      ni las promotoras ni la Junta han publicado la carga TI. Se registra porque
      es la única cifra de capacidad publicada y porque su origen es la lectura de
      un expediente administrativo, pero no está confirmada por la fuente
      primaria. La otra magnitud publicada, 1,16 GWt, es potencia térmica de la
      central asociada y no es equiparable.
    fuentes: [src-zamoranews, src-elespanol]
  - campo: potencia
    descripcion: >-
      Las fuentes discrepan sobre el parque de motores. El Español habla de 24
      motores de gas natural y 25 motores diésel; Ecologistas Zamora, tras analizar
      el expediente, describe 29 motores de combustión, de los que 24 funcionarían
      con gas natural y otros cinco con diésel. Ambas coinciden en 24 chimeneas de
      30 metros. No se ha podido resolver.
    fuentes: [src-elespanol, src-zamoranews]
  - campo: operador
    descripcion: >-
      Las promotoras del expediente son FRV-X Renewable, S.L.U. y Edison Next
      Spain, S.L.U.; no consta quién explotaría el centro de datos.
    fuentes: [src-elespanol]
  - campo: inversion_anunciada_eur
    descripcion: "La inversión se describe como \"varios millones de euros\", sin cifra exacta anunciada."
    fuentes: [src-elespanol]
  - campo: agua
    descripcion: >-
      Las cifras de agua no cuadran entre sí y ninguna es directamente comparable.
      Las declaradas en el expediente y recogidas por El Español son 6.281,65 m3
      potables y 11.911,6 m3 no potables, sin indicar periodo. La prensa local
      publicó el 20 de agosto de 2026, citando a Zamora Decide, un consumo de 1,36
      millones de litros al día. Si ese caudal fuese anual, quedaría dos órdenes
      de magnitud por encima de las cifras del expediente, así que o se refieren a
      cosas distintas o alguna es errónea. Se deja abierta y no se registra
      ninguna en el campo numérico.
    fuentes: [src-elespanol, src-laopinion]
  - campo: empleo
    descripcion: >-
      La prensa local habla de "cientos de empleos directos" y las promotoras no
      han publicado ninguna cifra. No se registra empleo.
    fuentes: [src-laopinion-empleo]

