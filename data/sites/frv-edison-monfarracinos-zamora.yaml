modelo: hyperscale

ubicacion:
  municipio: "Monfarracinos"
  provincia: "Zamora"
  ccaa: "Castilla y León"
  direccion: "Polígono Zamora Norte"
  lat: 41.5526221
  lon: -5.7064267
  precision: municipio
  fuentes: [src-elespanol, src-osm]

estado: en_tramitacion
estado_detalle: >-
  En información pública durante agosto de 2026, con plazo de alegaciones hasta
  el 16 de septiembre de 2026. El proyecto ha generado oposición vecinal y
  política; el PSOE reclamó transparencia el 25 de agosto de 2026.
estado_fuentes: [src-elespanol]

potencia:
  - tipo: no_especificado
    valor_mw: 1160
    ambito: campus
    referencia: "Potencia térmica de la central de generación asociada (1,16 GWt)"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08"
    fuentes: [src-elespanol]
    nota: >-
      Es potencia TÉRMICA de la planta de generación asociada (24 motores de gas
      natural y 25 motores diésel), no potencia eléctrica ni carga TI. No debe
      compararse con los MW de otros emplazamientos.

fases: []

refrigeracion: >-
  Consumo declarado de 6.281,65 metros cúbicos de agua potable y 11.911,6 de no
  potable.

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta la carga TI ni la potencia eléctrica del centro de datos. La
      única magnitud publicada es la potencia térmica de la central asociada
      (1,16 GWt), que no es equiparable.
    fuentes: [src-elespanol]
  - campo: operador
    descripcion: >-
      Las promotoras del expediente son FRV-X Renewable, S.L.U. y Edison Next
      Spain, S.L.U.; no consta quién explotaría el centro de datos.
    fuentes: [src-elespanol]
  - campo: inversion_anunciada_eur
    descripcion: "La inversión se describe como \"varios millones de euros\", sin cifra exacta anunciada."
    fuentes: [src-elespanol]
  - campo: refrigeracion
    descripcion: >-
      Las cifras de agua no cuadran entre sí. Las declaradas en el expediente y
      recogidas por El Español son 6.281,65 m3 potables y 11.911,6 m3 no potables
      (sin indicar periodo). La prensa local de Zamora publicó el 20 de agosto de
      2026 un consumo de 1,36 millones de litros al día, equivalente a unos
      496.000 m3 al año, cifra que no se ha podido verificar por no ser accesible
      la fuente. Se deja abierta.
    fuentes: [src-elespanol]

confianza: media
