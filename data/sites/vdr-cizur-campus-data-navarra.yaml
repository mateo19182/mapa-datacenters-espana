    url: "https://www.noticiasdenavarra.com/economia/2025/06/23/campus-data-navarra-mayor-centro-9794846.html"
    titulo: "Campus Data Navarra: el mayor centro de datos del norte promete 2.600 empleos"
    editor: "Diario de Noticias de Navarra"
    tipo: prensa_general
    fecha_publicacion: "2025-06-23"
    fecha_consulta: "2026-08-31"
    cita: >-
      Su puesta en servicio sería en 2029 / El proyecto consta de cuatro edificios que
      ocuparían una superficie de 200.000 m2 y requeriría una capacidad total de 300MW
      de potencia eléctrica [...] supondría la creación de un total de 2.600 empleos
      de calidad directos e indirectos durante su fase de construcción y operación,
      según estimaciones del sector [...] En la primera fase, y con el fin de
      optimizar el suministro de energía, se construirá un edificio de varias plantas
      con salas técnicas que permitirán albergar un centro de datos de 50 MW de
      potencia eléctrica de capacidad total. En las siguientes fases, se ejecutarían
      tres edificios similares con una capacidad de 100 MW de potencia eléctrica cada
      uno. Cuando esté en pleno funcionamiento, en 2029, requerirá una potencia
      eléctrica de 300 MW [...] También se está solicitando el acceso y conexión a la
      potencia final desde una nueva posición 220 KV en la subestación de Orkoien a
      tres kilómetros del Campus Data Navarra, pendientes de ser incluidos y
      posteriormente concedidos en el marco de la nueva planificación eléctrica
      2025-2030.
  - id: src-dcd
    url: "https://www.datacenterdynamics.com/en/news/300mw-data-center-campus-planned-outside-pamplona-spain/"
    titulo: "300MW data center campus planned outside Pamplona, Spain"
    editor: "DataCenterDynamics"
    tipo: prensa_especializada
    fecha_publicacion: "2025-06-24"
    fecha_consulta: "2026-08-31"
    cita: >-
      Spanish construction firm VDR Group and Colliers have filed to develop a campus
      on the Gazólaz industrial estate in Cendea de Cizur, Navarre. The four buildings
      will reportedly total 200,000 sqm [...] Planning approval for this project is
      expected to arrive between late 2025 and early 2026. The €3.3 billion ($3.83bn)
      project will be developed in phases from 2027 through to 2029 and offer 300MW at
      full build-out [...] Further details, including an intended end user, are yet to
      be shared.
