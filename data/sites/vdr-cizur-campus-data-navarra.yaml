incertidumbres:
  - campo: potencia
    descripcion: >-
      Fuentes secundarias describen un reparto de una primera fase de 50 MW y
      tres edificios adicionales de 100 MW cada uno (total 350 MW), que no cuadra
      con los 300 MW de capacidad instalada de la nota del diseñador técnico. No
      se ha podido resolver.
    fuentes: [src-sener]
  - campo: conexion_electrica
    descripcion: >-
      Se cita el acceso a una subestación de 220 kV en Orkoien como ventaja del
      emplazamiento, pero no se ha podido verificar en fuente primaria ni consta
      potencia de acceso solicitada o concedida.
    fuentes: [src-sener]
  - campo: estado
    descripcion: >-
      La aprobación del planeamiento se esperaba entre finales de 2025 y
      principios de 2026; no se ha localizado la resolución.
    fuentes: [src-sener]

confianza: baja
ultima_verificacion: "2026-08-29"

