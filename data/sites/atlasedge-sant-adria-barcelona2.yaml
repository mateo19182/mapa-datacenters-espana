incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Resuelta la contradicción entre directorios. Baxtel situaba este proyecto
      en "Carrer de Ramon Viñas, Barcelona" —calle de Sant Adrià de Besòs donde
      está la Barcelona Cable Landing Station—, mientras que Inflect y OCOLO lo
      situaban en Sant Joan Despí. Manda la propia AtlasEdge, que en su ficha de
      Barcelona publica "BCN002 (Planned) — Carrer de la Industria, 2B, 08970
      Sant Joan Despi". El Catastro confirma que esa dirección corresponde a una
      única parcela sin edificar de 17.896 m² (referencia 2199401DF2729G), cifra
      que encaja con los "18.000 metros cuadrados" de la nota de prensa. La
      distancia en línea recta entre esa parcela (41,3659 / 2,0685) y el centro
      anterior de Carrer de l'Acer (parcela catastral 8079203DF2787G, 41,3494 /
      2,1394) es de 6,2 km: los "6 km" que declara la nota. Hasta Carrer de
      Ramon Viñas, en Sant Adrià, habría 11,5 km. Se corrigen el municipio, la
      dirección y las coordenadas. El `id` conserva la forma antigua
      («sant-adria») porque el esquema prohíbe renombrar identificadores.
    fuentes: [src-1, src-3, src-4, src-6, src-7, src-8]
  - campo: ubicacion
    descripcion: >-
      La nota de AtlasEdge dice que la parcela está "strategically located close
      to the Barcelona Cable Landing Station", pero la BCLS está en Carrer de
      Ramon Viñas 4, Sant Adrià de Besòs (41,4273 / 2,2307), a unos 15 km de la
      parcela de Sant Joan Despí. La frase parece una referencia comercial al
      área metropolitana, no una indicación de proximidad física; fue
      probablemente el origen de la geolocalización errónea de Baxtel. No se ha
      localizado ninguna otra estación de amarre en el entorno de Sant Joan
      Despí que explique la frase.
    fuentes: [src-2, src-3, src-4]
  - campo: potencia
    descripcion: >-
      La nota de la propia AtlasEdge confirma los 10 MW para 2027 y un techo de
      24 MW, pero no tipifica ninguna de las dos cifras ni concreta la potencia
      de acceso ya asegurada.
    fuentes: [src-1, src-3]
  - campo: estado
    descripcion: >-
      El proyecto sigue en manos de AtlasEdge tras la venta de nueve centros
      europeos a Templus, completada el 5 de mayo de 2026: la página de
      localizaciones de AtlasEdge, consultada el 31 de agosto de 2026, ya no
      lista ningún centro suyo en operación en Barcelona —el de Carrer de
      l'Acer, BCN001, pasó a Templus— y mantiene BCN002 como su único
      emplazamiento de Barcelona, en el apartado «Planned». La nota de cierre de
      la venta sigue citando Barcelona entre los mercados en los que la compañía
      concentra su inversión. Lo que no consta es un calendario de obra ni
      licencia municipal de Sant Joan Despí.
    fuentes: [src-4, src-5, src-9]
  - campo: superficie_parcela_m2
    descripcion: >-
      La nota de prensa habla de una parcela de 18.000 m²; el Catastro da 17.896
      m² para la parcela 2199401DF2729G. Se conserva la cifra de la compañía y
      se deja constancia de la medición catastral.
    fuentes: [src-3, src-7]

confianza: media
