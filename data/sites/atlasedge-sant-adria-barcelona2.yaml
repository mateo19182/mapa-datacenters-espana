estado: anunciado
estado_detalle: >-
  Segunda instalación de AtlasEdge en el área de Barcelona, sobre una parcela de
  18.000 m² a unos 6 km de su centro anterior (el de Carrer de l'Acer, vendido a
  Templus). El suministro eléctrico está "asegurado y previsto para 2027". La
  adquisición del suelo la anunció la propia AtlasEdge el 18 de julio de 2024,
  con la potencia inicial ya asegurada. La compañía publica la dirección exacta
  en su web —Carrer de la Indústria 2B, 08970 Sant Joan Despí— y clasifica el
  proyecto como «Planned»: la parcela sigue figurando en el Catastro como suelo
  sin edificar.
estado_fuentes: [src-3, src-4, src-5, src-6]

potencia:
  - tipo: no_especificado
    valor_mw: 10
    ambito: edificio
    referencia: "Capacidad que la compañía prevé entregar en 2027"
    estado_asociado: anunciado
    fecha_dato: "2024-07-18"
    fuentes: [src-3, src-1]
    nota: >-
      La nota de la propia AtlasEdge dice "the new facility will deliver 10MW by
      2027", sin precisar si es carga TI o potencia de acceso. El listado de
      mercado de Baxtel repite la misma cifra.
  - tipo: no_especificado
    valor_mw: 24
    ambito: edificio
    referencia: "Capacidad máxima a la que la compañía prevé poder ampliar"
    estado_asociado: anunciado
    fecha_dato: "2024-07-18"
    fuentes: [src-3]
    nota: >-
      La nota dice "with the potential to increase this to 24MW". Es un techo
      declarado, no capacidad contratada.

