  - campo: potencia
    descripcion: >-
      No hay fuente primaria de la compañía que confirme los 10 MW ni su tipo.
    fuentes: [src-1]
  - campo: estado
    descripcion: >-
      Fuente única. Tampoco está claro si el proyecto sigue en manos de AtlasEdge
      tras la venta de su cartera europea a Templus en diciembre de 2025.
    fuentes: [src-1]

