id: atlasedge-sant-adria-barcelona2
nombre: "AtlasEdge Barcelona 2 — Carrer de Ramon Viñas (Sant Adrià de Besòs)"
alias:
  - "AtlasEdge Barcelona 2"
tipo: edificio
operador: "AtlasEdge Data Centres"
propietario: "AtlasEdge Data Centres"
modelo: colocation

ubicacion:
  municipio: "Sant Adrià de Besòs"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Carrer de Ramon Viñas, Sant Adrià de Besòs"
  precision: aproximada
  fuentes: [src-1]

estado: en_construccion
estado_detalle: >-
  Segunda instalación de AtlasEdge en el área de Barcelona, sobre una parcela de
  18.000 m² a unos 6 km de su centro anterior (el de Carrer de l'Acer, vendido a
  Templus en diciembre de 2025). El suministro eléctrico está "asegurado y
  previsto para 2027". Está en la misma calle que la Barcelona Cable Landing
  Station. La adquisición del suelo la anunció la propia AtlasEdge el 18 de julio
  de 2024, con la potencia inicial ya asegurada.
estado_fuentes: [src-1, src-3]

potencia:
  - tipo: no_especificado
    valor_mw: 10
    ambito: edificio
    referencia: "Capacidad indicada en el directorio"
    estado_asociado: en_construccion
    fuentes: [src-1, src-3]
    nota: >-
      El listado de mercado de Baxtel muestra 10 MW para esta instalación; la
      nota de la propia AtlasEdge lo confirma —"the new facility will deliver
      10MW by 2027"— sin precisar si es carga TI o potencia de acceso.
  - tipo: no_especificado
    valor_mw: 24
    ambito: edificio
    referencia: "Capacidad máxima a la que la compañía prevé poder ampliar"
    estado_asociado: anunciado
    fecha_dato: "2024-07-18"
    fuentes: [src-3]
    nota: >-
      La nota dice "with the potential to increase this to 24MW". Es un techo
      declarado, no capacidad contratada.

superficie_parcela_m2: 18000

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Baxtel indica "Carrer de Ramon Viñas, Barcelona"; esa calle está en Sant
      Adrià de Besòs (CP 08930) según PeeringDB. Se corrige el municipio y se
      deja constancia.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      La nota de la propia AtlasEdge confirma los 10 MW para 2027 y un techo de
      24 MW, pero no tipifica ninguna de las dos cifras ni concreta la potencia
      de acceso ya asegurada.
    fuentes: [src-1, src-3]
  - campo: estado
    descripcion: >-
      No está claro si el proyecto sigue en manos de AtlasEdge tras la venta de
      nueve centros europeos a Templus en diciembre de 2025. La propia AtlasEdge
      describe esa operación como una venta de activos seleccionados «para
      centrarse en emplazamientos escalables y de alto crecimiento», categoría en
      la que encajaría este proyecto, pero ninguna fuente lo dice expresamente.
    fuentes: [src-1, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

