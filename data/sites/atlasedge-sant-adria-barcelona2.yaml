estado_detalle: >-
  Segunda instalación de AtlasEdge en el área de Barcelona, sobre una parcela de
  18.000 m² a unos 6 km de su centro anterior (el de Carrer de l'Acer, vendido a
  Templus en diciembre de 2025). El suministro eléctrico está "asegurado y
  previsto para 2027". Está en la misma calle que la Barcelona Cable Landing
  Station.
