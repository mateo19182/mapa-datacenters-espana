    nota: "\"phased expansion capabilities from 3 MW to 79 MW of IT load\"."
  - tipo: no_especificado
    valor_mw: 2
    ambito: fase
    referencia: "Primera fase de MAD-1 en el momento de la inauguración"
    estado_asociado: operativo
    fecha_dato: "2025-03-26"
    fuentes: [src-2]
    nota: "Prensa especializada: \"la primera fase contará con 2 MW y comenzará a operar el próximo mes de julio\". Contradice los 3 MW de la ficha corporativa."
  - tipo: no_especificado
    valor_mw: 130
    ambito: campus
    referencia: "Capacidad potencial del campus según la venta de Xdata Properties a Iron Mountain"
    estado_asociado: anunciado
    fecha_dato: "2022-11-04"
    fuentes: [src-4]
    nota: "\"aspira a superar los 130 MW de potencia en su campus de San Fernando de Henares\" (2022). No coincide con los 79 MW que Iron Mountain publica hoy."

