incertidumbres:
  - campo: potencia
    descripcion: >-
      Los MW por edificio publicados por Iron Mountain (MAD-2 a MAD-5 con 10 MW cada uno y
      MAD-6/7/8 con "36 MW each") suman muy por encima de los 79 MW declarados para el campus.
      Lo más probable es que los 36 MW sean el conjunto de los tres últimos edificios, pero la
      fuente dice "each" y no se corrige aquí.
    fuentes: [src-1]
  - campo: potencia
    descripcion: >-
      La ficha corporativa habla de 3 MW operativos en MAD-1 y la prensa especializada de una
      primera fase de 2 MW. Además, la operación de compra en 2022 hablaba de más de 130 MW
      potenciales frente a los 79 MW actuales.
    fuentes: [src-1, src-2, src-4]
  - campo: estado
    descripcion: >-
      La ficha corporativa fecha MAD-2/MAD-3 en 2027 y el resto en 2029-2030, mientras que un
      artículo de opinión del director general de Iron Mountain para EMEA (julio de 2025) afirma
      que los dos siguientes edificios entran en servicio en 2026 y el resto del campus se
      adelanta de 2029 a 2027. La actualización de abril de 2026 sitúa MAD-2 en el cuarto
      trimestre de 2026 y MAD-3 en el primero de 2027.
    fuentes: [src-1, src-5, src-6]
  - campo: estado
    descripcion: >-
      La Comunidad de Madrid data en 2027 el conjunto de los 79 MW y de las ocho instalaciones,
      mientras que el folleto de la compañía fecha el campus completo en 2030. Las dos fechas
      conviven sin que ninguna fuente explique la diferencia.
    fuentes: [src-1, src-7]

confianza: media
