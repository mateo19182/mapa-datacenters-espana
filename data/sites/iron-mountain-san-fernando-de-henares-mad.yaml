id: iron-mountain-san-fernando-de-henares-mad
nombre: "Iron Mountain Data Centers — Campus de San Fernando de Henares (MAD-1 a MAD-8)"
alias:
  - "Iron Mountain MAD-1"
  - "Xdata Properties"
  - "Campus del Parque de San Fernando"
tipo: campus
