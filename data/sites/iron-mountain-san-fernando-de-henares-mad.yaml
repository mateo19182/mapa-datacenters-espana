estado: parcialmente_operativo
estado_detalle: >-
  MAD-1 está operativo con 3 MW IT. Las especificaciones actuales del operador sitúan MAD-2, de 10
  MW IT, en el tercer trimestre de 2027 y MAD-3, de otros 10 MW IT, en el cuarto. Sustituyen las
  previsiones de entrega de 2026 y comienzos de 2027 recogidas en prensa. MAD-2 y MAD-3 comparten un
  edificio de 20 MW; no se suma este total a sus dos partes. El campus completo sigue siendo un
  desarrollo por fases de 79 MW IT, con entregas posteriores previstas en 2029 y 2030. No consta una
  nueva puesta en servicio de MAD-2 o MAD-3.
