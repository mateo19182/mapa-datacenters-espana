    cita: "El consejero de Digitalización, Miguel López-Valverde, ha visitado este lunes las obras del nuevo Centro de Procesamiento de Datos (CPD) que la empresa Iron Mountain Data Centers construye en San Fernando de Henares. Este complejo tecnológico ha sido seleccionado para formar parte de la candidatura española que aspira a albergar una de las futuras Gigafactorías de Inteligencia Artificial promovidas por la Unión Europea ... El complejo forma parte de un plan estratégico de expansión de Iron Mountain que prevé alcanzar 79 megavatios de potencia tecnológica en 2027, distribuidos en ocho instalaciones interconectadas dentro de la región."
