incertidumbres:
  - campo: fecha_puesta_en_servicio
    descripcion: La previsión de julio de 2025 no acredita la fecha efectiva de apertura de MAD-1.
      Las fuentes posteriores confirman operación y 3 MW IT, sin fechar el inicio del servicio.
    fuentes: [src-2, src-6, src-campana-20261017]
  - campo: potencia
    descripcion: >-
      Una lectura anterior de la ficha corporativa atribuía 36 MW each a MAD-6/7/8, incompatible con
      un campus de 79 MW si se sumara literalmente. Se conserva el antecedente sin corregirlo por
      cálculo; el calendario actual remite MAD-4 a MAD-8 a 2029 y 2030, sin sumar capacidad de esas
      etapas a los 20 MW de MAD-2/MAD-3.
    fuentes: [src-1]
  - campo: potencia
    descripcion: >-
      La noticia de marzo de 2025 preveía una primera fase de 2 MW y entrada en julio. El operador
      publica ahora 3 MW IT en MAD-1; no se suman ni se presenta la previsión inicial como capacidad
      actual. La compra de 2022 describía más de 130 MW potenciales, frente a los 79 MW IT del plan
      actual.
    fuentes: [src-1, src-2, src-4]
  - campo: estado
    descripcion: >-
      Los calendarios previos de la ficha corporativa y de declaraciones en prensa no coincidían: en
      julio de 2025 se adelantaban las dos siguientes entregas a 2026 y el resto a 2027; en abril de
      2026 MAD-2 se preveía para Q4 de 2026 y MAD-3 para Q1 de 2027. Las páginas actuales del
      operador los sitúan en Q3 y Q4 de 2027. Se conservan los antecedentes sin tratarlos como
      fechas cumplidas.
    fuentes:
      - src-1
      - src-5
      - src-6
      - src-mad2-20261017
      - src-mad3-20261017
  - campo: estado
    descripcion: >-
      Una noticia de la visita institucional de marzo de 2026 situaba los 79 MW y ocho instalaciones
      en 2027, frente al folleto corporativo que mantenía el horizonte completo en 2030. Las páginas
      actuales continúan fechando MAD-4 a MAD-8 en 2029 y 2030; no se identifica el campus completo
      como entregado en 2027.
    fuentes:
      - src-7
      - src-campana-20261017
  - campo: fases
    descripcion: Las páginas actuales consultadas el 17 de octubre sitúan MAD-2 en Q3 de 2027 y MAD-3 en
      Q4 de 2027. Se conservan como antecedentes las previsiones de prensa de abril de 2026, Q4 de
      2026 y Q1 de 2027, y los calendarios anteriores del campus. Los resultados indexados del
      buscador aún devolvían Q1/Q2 de 2027 y no reflejaban el texto servido en la consulta.
    fuentes:
      - src-mad2-20261017
      - src-mad3-20261017
      - src-campana-20261017
      - src-6

