    fecha_dato: "2026-04-22"
    fuentes: [src-6]
    nota: >-
      La compañía habla de «10 MW adicionales» sin decir si son carga TI, aunque la capacidad del
      campus la publica como IT. Se registra sin tipificar.
  - tipo: no_especificado
    valor_mw: 10
    ambito: fase
    referencia: "MAD-3, capacidad prevista en el primer trimestre de 2027"
    estado_asociado: en_construccion
    fecha_dato: "2026-04-22"
    fuentes: [src-6]
    nota: "Misma salvedad que MAD-2: la fuente no dice de qué tipo de MW se trata."
  - tipo: no_especificado
    valor_mw: 130
    ambito: campus
    referencia: "Capacidad potencial del campus según la venta de Xdata Properties a Iron Mountain"
    estado_asociado: anunciado
    fecha_dato: "2022-11-04"
    fuentes: [src-4]
    nota: "\"aspira a superar los 130 MW de potencia en su campus de San Fernando de Henares\" (2022). No coincide con los 79 MW que Iron Mountain publica hoy."

