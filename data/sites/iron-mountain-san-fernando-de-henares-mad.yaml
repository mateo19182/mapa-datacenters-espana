estado: parcialmente_operativo
estado_detalle: >-
  MAD-1 (4.000 m²) inaugurado el 25 de marzo de 2025, con entrada en operación de la primera fase
  en julio de 2025. Restantes edificios en desarrollo: MAD-2 y MAD-3 previstos para 2027, MAD-4 y
  MAD-5 para 2029 y MAD-6/7/8 para 2030 según la ficha corporativa; la compañía declaró en 2025
  haber adelantado a 2027 la entrega del resto del campus. Permisos de potencia asegurados para
  los 79 MW completos. En abril de 2026 Iron Mountain concretó el calendario: MAD-2 aportará
  10 MW en el cuarto trimestre de 2026 y MAD-3 otros 10 MW en el primer trimestre de 2027, los
  20 MW que la compañía declara en construcción. En marzo de 2026 el consejero de Digitalización
  de la Comunidad de Madrid visitó las obras y el complejo figura en la candidatura española a
  albergar una de las Gigafactorías de Inteligencia Artificial de la Unión Europea.
estado_fuentes: [src-1, src-2, src-4, src-6, src-7]
fecha_puesta_en_servicio: "2025-07"

