estado: en_construccion
estado_detalle: >-
  Nueva sede del centro de proceso de datos de la Gerencia de Informática de la Seguridad
  Social, que se traslada desde Madrid a Soria dentro del plan de deslocalización de
  infraestructuras públicas. El Ayuntamiento de Soria cedió una parcela de 37.000 m² en Los
  Royales; el Consejo de Ministros autorizó el contrato en noviembre de 2022 y las obras se
  formalizaron en 2023 con la UTE de Grupo Cobra e Itercon, financiadas con fondos del Plan de
  Recuperación, Transformación y Resiliencia. En mayo de 2026 la ejecución alcanzaba el 82 %,
  con los trabajos centrados en urbanización, viales internos, fachada y cubierta. El plazo
  inicial de 24 meses se ha superado y la puesta en marcha sigue sin fecha. El edificio tendrá
  tres plantas, un sótano y 117 plazas de aparcamiento. La elección de Soria se justificó por
  el clima —temperatura media anual en torno a 11 ºC, apta para free-cooling— y por la
  disponibilidad de energía renovable en la provincia.
estado_fuentes: [src-1, src-2, src-3]

