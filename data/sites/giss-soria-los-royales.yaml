incertidumbres:
  - campo: potencia
    descripcion: >-
      No hay ninguna cifra de potencia publicada en fuente primaria. El directorio del
      Observatorio ECD atribuye 6 MW a esta instalación, pero no ha sido posible contrastarlo ni
      con el expediente de contratación ni con la documentación del ministerio, así que el campo
      queda vacío en lugar de registrar una cifra sin respaldo.
    fuentes: [src-1]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Circulan tres cifras distintas: 73 millones autorizados por el Consejo de Ministros en
      noviembre de 2022, 86 millones de adjudicación en julio de 2023 y 88,47 millones de
      presupuesto base de licitación con impuestos incluidos, más dos modificados posteriores de
      211.070 euros y 2,97 millones. Se registra el presupuesto base de licitación y se dejan
      las demás aquí.
    fuentes: [src-1, src-4]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      El plazo inicial era de 24 meses desde 2023 y la finalización se anunció primero para
      diciembre de 2025 y luego para el verano de 2026. A mayo de 2026 la obra estaba al 82 % y
      la puesta en marcha seguía sin fecha.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      Consta el barrio (Los Royales, sector SUR-D9) pero no la dirección postal. Las coordenadas
      son el centroide municipal de Soria.
    fuentes: [src-3, src-osm]

