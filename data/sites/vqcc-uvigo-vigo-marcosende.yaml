estado: operativo
estado_detalle: >-
  Se incluye en el mapa como instalación de cómputo cuántico, con la advertencia que la regla
  del esquema exige: no es un centro de datos, su carga no se mide en megavatios y no aporta
  ninguna cifra a `potencia[]`. El VQCC es el centro de comunicaciones cuánticas de la
  Universidade de Vigo, adscrito al centro de investigación atlanTTic y financiado con
  7.689.349 euros dentro de los Planes Complementarios en Comunicaciones Cuánticas. El 15 de
  enero de 2026 la UVigo y el CESGA firmaron el convenio del Quantum Optical Computing Lab, un
  laboratorio compartido de computación cuántica óptica con 2,4 millones de inversión y un
  modelo de gobernanza conjunta, cofinanciado por el PERTE Chip y la Consellería de Ciencia. En
  marzo de 2026 el Consorcio de la Zona Franca de Vigo y la UVigo crearon además una cátedra de
  Computación de Óptica Cuántica dotada con 240.000 euros anuales para consolidar ese
  laboratorio. A 31 de agosto de 2026 el procesador no existe: el objetivo declarado es
  desarrollarlo en un plazo de tres a cinco años.
estado_fuentes: [src-vqcc, src-uvigo, src-boe, src-atlanttic]

potencia: []

computo:
  - tipo: qpu
    ambito: sistema
    sistema: "Quantum Optical Computing Lab"
    operador_computo: "atlanTTic (Universidade de Vigo) y CESGA, en gobernanza compartida"
    modelo: "Procesador cuántico óptico de tecnología fotónica; máquina de Ising coherente óptica"
    tipo_unidad: qubit
    estado: anunciado
    fecha_dato: "2026-01-15"
    fuentes: [src-vqcc, src-uvigo]
    nota: >-
      Sin recuento: el procesador está por desarrollar, no instalado, y ninguna fuente publica
      un número de cúbits objetivo. El laboratorio se decantó por tecnología fotónica frente a
      superconductores, iones atrapados o átomos neutros, entre otras razones porque el resto de
      laboratorios experimentales del VQCC también son fotónicos. Duración inicial de cuatro
      años, prorrogable.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ninguna fuente publica consumo ni potencia eléctrica del VQCC ni del laboratorio de
      computación óptica. Como en el resto de instalaciones cuánticas del registro, el campo de
      potencia queda vacío y el orden de magnitud no se estima.
    fuentes: [src-vqcc]
  - campo: computo
    descripcion: >-
      El registro documenta un laboratorio en construcción, no una máquina en servicio. La nota
      de la propia UVigo de enero de 2026 dice que el VQCC «acollerá proximamente» el
      laboratorio, y el objetivo del procesador se sitúa a tres o cinco años vista. Si el
      procesador llega a existir, el recuento de cúbits se registrará entonces.
    fuentes: [src-vqcc, src-uvigo]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas son las de la Estrada de Marcosende, dirección de contacto publicada por
      el VQCC, y no las del edificio concreto dentro del campus. En 2021 se anunció que el
      laboratorio cuántico de la UVigo se instalaría en el antiguo centro informático de
      Caixanova de la calle López Mora, hoy propiedad de la Zona Franca y en obras como VgoTIC
      Global HUB; las fuentes de 2026 sitúan la actividad en el campus. No consta cuál será la
      sede definitiva.
    fuentes: [src-vqcc-contacto, src-osm]

