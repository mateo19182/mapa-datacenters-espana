id: vdpc-sagunto-barracuda
nombre: "Estación de aterraje Barracuda y data center — Sagunto"
alias:
  - "Proyecto Barracuda Sagunto"
  - "CLS Sagunto VDPC"
tipo: edificio
operador: "Valencia Digital Port Connect"
propietario: "Valencia Digital Port Connect"
modelo: colocation

ubicacion:
  municipio: "Sagunt / Sagunto"
  provincia: "Valencia"
  ccaa: "Comunitat Valenciana"
  lat: 39.6793
  lon: -0.2786
  precision: municipio
  fuentes: [src-1, src-2]

estado: en_tramitacion
estado_detalle: >-
  Emplazamiento anunciado el 29/05/2025: Sagunto acogerá la estación de aterraje del cable
  submarino Barracuda y un data center multipropósito. Plazo de ejecución de tres años e
  inicio de operaciones previsto para principios de 2028. En enero de 2026 el promotor
  cerró el acuerdo con Sparkle para el aterraje en Génova. Sustituye al emplazamiento
  previo del puerto de Alicante. El proyecto ha entrado en tramitación administrativa: en
  enero de 2026 la Demarcación de Costas tramitaba la ocupación de dominio público
  marítimo-terrestre y el 01/04/2026 el BOE publicó la apertura de información pública de
  la concesión demanial solicitada por Valencia Digital Port Connect, S.L. a la Autoridad
  Portuaria de Valencia, por 410 metros lineales de terrenos junto al Muelle Norte I y
  2.614 metros lineales de aguas exteriores, a treinta años.
estado_fuentes: [src-1, src-2, src-3, src-4, src-5]
fecha_puesta_en_servicio: "2028"

potencia:
  - tipo: no_especificado
    valor_mw: 10
    ambito: edificio
    referencia: "Potencia eléctrica inicial del data center («10 MW pico»)"
    estado_asociado: anunciado
    fecha_dato: "2025-05-29"
    fuentes: [src-1, src-2]
    nota: >-
      Las fuentes dicen literalmente «una potencia eléctrica de 10 MW pico», sin precisar
      si se refiere a carga TI o a potencia de conexión. La nota del propio promotor lo
      formula como «peak electrical power of 10 MW».

fases:
  - nombre: "Estación de aterraje de cables (CLS)"
    estado: anunciado
    superficie_m2: 4600
    fuentes: [src-1, src-2]
  - nombre: "Data center multipropósito"
    estado: anunciado
    fuentes: [src-1, src-2, src-6]

inversion_anunciada_eur: 100000000
refrigeracion: null
enlaces_proyecto:
  - "https://www.valenciaport.com/concursoautorizacion/solicitud-de-otorgamiento-de-concesion-administrativa-formulada-por-valencia-digital-port-connect-s-l/"

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Las fuentes periodísticas sitúan la instalación en el término municipal de Sagunto sin
      dirección ni parcela. El anuncio del BOE concreta la ocupación de dominio público
      portuario junto al Muelle Norte I del puerto de Sagunto, pero se refiere al cable, no
      al edificio del data center, cuya parcela sigue sin constar. Las coordenadas siguen
      siendo de nivel municipal.
    fuentes: [src-1, src-2, src-4]
  - campo: potencia
    descripcion: >-
      «10 MW pico» es una expresión ambigua; no se ha localizado ni el permiso de acceso y
      conexión ni el desglose entre carga TI y potencia contratada. Además, la cifra cambió
      de escala en tres meses: en febrero de 2025, cuando el aterraje se anunciaba en
      «Valencia», el diario Información describía el mismo data center como «dotado
      inicialmente con una potencia eléctrica de 1,5 MW y un ratio de eficiencia en el uso
      de la energía inferior a 1,25 (PUE)», la misma cifra que se había atribuido al
      proyecto abandonado del puerto de Alicante. No se registra ese 1,5 MW en `potencia[]`
      porque corresponde a un emplazamiento distinto del actual.
    fuentes: [src-1, src-2, src-6]
  - campo: superficie
    descripcion: >-
      Los 4.600 m² son de la estación de aterraje: «The submarine cable landing station will
      occupy a 4,600-square-meter facility». Levante-EMV (25/01/2026) atribuye esa misma
      superficie al «centro de datos multipropósito». No consta superficie propia del data
      center.
    fuentes: [src-1, src-5, src-6]

confianza: media
ultima_verificacion: "2026-08-31"

