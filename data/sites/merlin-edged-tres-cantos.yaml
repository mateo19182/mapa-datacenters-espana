estado: en_construccion
estado_detalle: >-
  Emplazamiento incluido en la Fase II del Plan MEGA de MERLIN Properties. En su informe de
  resultados del primer semestre de 2026 la compañía sitúa las obras de Madrid-Tres Cantos en
  marcha, junto a las de Lisboa y Madrid-Getafe II.
estado_fuentes: [src-1]

potencia: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      MERLIN publica la capacidad de la Fase II del Plan MEGA como un agregado de 254 MW IT que
      reparte entre Bilbao-Arasur 01 y 02, Lisboa, Madrid-Getafe II y Madrid-Tres Cantos, y solo
      desglosa las tres primeras. No consta ninguna cifra atribuible a Tres Cantos, y deducirla
      por resta sería inventarla.
    fuentes: [src-1]
  - campo: ubicacion
    descripcion: >-
      No consta dirección, parcela ni licencia municipal. El Ayuntamiento de Tres Cantos anunció
      en mayo de 2026 que prepara un Plan Especial de Data Centers, sin identificar proyectos.
    fuentes: [src-1, src-2]

confianza: media
ultima_verificacion: "2026-08-31"

fuentes:
  - id: src-1
