    titulo: "MERLIN incrementa ingresos y EBITDA un 11.7% gracias a la división de Data Centers, que alcanza 160 MW alquilados"
    editor: "MERLIN Properties"
    tipo: empresa
    fecha_publicacion: "2026-07-28"
    fecha_consulta: "2026-08-31"
    cita: >-
      En la Fase II (254 MW IT), la comercialización continúa superando previsiones. Bilbao-Arasur
      02 (48 MW) se alquiló por completo doce meses antes de su entrega y Bilbao-Arasur 01 (48 MW)
      ha sido arrendado dieciocho meses antes de su puesta en operación. Asimismo, avanzan las
      obras en Lisboa (80 MW), Madrid-Getafe II y Madrid-Tres Cantos.
  - id: src-2
