estado: en_tramitacion
estado_detalle: >-
  Anunciado el 2 de abril de 2025 por el Gobierno de La Rioja. Financiado con
  14,5 millones de euros de fondos europeos MRR-Next Generation. Se ubica en el
  antiguo recinto ferial de Albelda de Iregua, sede del parque científico-tecnológico
  TECHRIOJA y del Centro Nacional de las Industrias del Español. La licitación se
  preveía para finales del primer semestre de 2025 y la ejecución para junio de 2026.
  En mayo de 2026 el portavoz del Gobierno riojano declaró en el Parlamento que la
  parte comprometida con los fondos europeos es «un espacio», no la construcción de
  un centro de datos, y que «la infraestructura tecnológica de la Inteligencia
  Artificial de su espacio de datos está preparada para funcionar en junio», con
  fecha límite de los fondos el 30 de junio de 2026. En enero de 2026 se adjudicó a
  Telefónica Soluciones, por 2.541.000 euros, el contrato de suministros y servicios
  para la incubadora de proyectos de IA y tecnologías del lenguaje, cuyo Centro del
  Dato se sitúa en Albelda. No se ha localizado confirmación de que la parte
  constructiva del centro de datos se haya licitado ni ejecutado.
