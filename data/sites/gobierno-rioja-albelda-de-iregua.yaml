incertidumbres:
  - campo: potencia
    descripcion: "No consta ninguna cifra de potencia eléctrica ni de carga TI."
    fuentes: [src-eldiario]
  - campo: estado
    descripcion: >-
      La previsión era tener el centro ejecutado en junio de 2026. Lo que el Gobierno
      de La Rioja afirmó en mayo de 2026 es que estaría lista «la infraestructura
      tecnológica de la Inteligencia Artificial de su espacio de datos», y su
      argumento para no devolver fondos es precisamente que el convenio obliga a
      contar con «un espacio» y no dice nada de construir un centro de datos. No
      queda claro si el emplazamiento sigue siendo un proyecto de centro de datos
      físico, y no se ha localizado confirmación de puesta en servicio a agosto de
      2026.
    fuentes: [src-eldiario, src-ep]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Se manejan cifras distintas: 14,5 millones (elDiario.es, abril de 2025), 14
      millones (comparecencia parlamentaria de mayo de 2026, y la oposición eleva a
      21 millones el importe de fondos europeos en riesgo). No se sustituye el valor
      registrado.
    fuentes: [src-eldiario, src-ep]

