estado: ampliacion_en_construccion
estado_detalle: >-
  Instalación construida en 2020 e incorporada a la red de Templus, que la inauguró en noviembre de
  2024 como su primer emplazamiento en Andalucía. En 2024 se amplió con una nueva sala, CPD3, de
  40 racks. El 9 de abril de 2026 la compañía anunció, en una visita del alcalde de Málaga, una
  nueva ampliación con una cuarta sala de operaciones para pasar de 2 a 3 MW en 2027, triplicar el
  número de empresas alojadas de unas 100 a más de 300 e incorporar refrigeración líquida para
  densidades de 40 a 50 kW por rack.
estado_fuentes: [src-3, src-4, src-6, src-7]
fecha_puesta_en_servicio: "2024-11"

potencia:
  - tipo: no_especificado
    valor_mw: 2.8
    ambito: edificio
    referencia: "«Potencia total» declarada por el operador en la ficha de MAL01"
    estado_asociado: operativo
    fecha_dato: "2026-08-29"
    fuentes: [src-1, src-6]
    nota: "La ficha del operador dice «potencia total» sin precisar si es carga TI o potencia contratada."
  - tipo: no_especificado
    valor_mw: 2.6
    ambito: edificio
    referencia: "Potencia de MAL01 en el listado de la red europea de Templus"
    estado_asociado: operativo
    fecha_dato: "2026-08-29"
    fuentes: [src-2]
    nota: "Cifra discrepante respecto a la ficha individual del mismo operador."
  - tipo: no_especificado
    valor_mw: 3
    ambito: edificio
    referencia: "Capacidad prevista en 2027 tras la ampliación iniciada en abril de 2026"
    estado_asociado: ampliacion_en_construccion
    fecha_dato: "2026-04-16"
    fuentes: [src-6, src-7]
    nota: >-
      «prevé elevar su capacidad hasta los 3 MW en 2027». La fuente tampoco tipifica la magnitud, y
      describe la cifra vigente en la web del operador como «2,8 MW de utility power».

fases:
  - nombre: "CPD3"
    estado: operativo
    fecha_puesta_en_servicio: "2024"
    fuentes: [src-3]
  - nombre: "Cuarta sala de operaciones (ampliación a 3 MW)"
    estado: ampliacion_en_construccion
    fecha_puesta_en_servicio: "2027"
    fuentes: [src-6]

superficie_construida_m2: 2200
inversion_anunciada_eur: 15000000
refrigeracion: >-
  Refrigeración líquida incorporada en la ampliación de 2026, que según el responsable de Templus en
  Andalucía permite gestionar más de 40-50 kW por rack.
enlaces_proyecto:
  - "https://templus.com/data-centers/malaga-mal01/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      El propio operador publica dos cifras distintas: 2,8 MW en la ficha de MAL01 y 2,6 MW en la
      tabla de su red europea. Ninguna especifica el tipo de potencia; Revista Cloud describe los
      2,8 MW de la web corporativa como «utility power», es decir, potencia de suministro, pero es
      una caracterización de la prensa y no del operador. La ampliación anunciada apunta a 3 MW en
      2027. Se registran las tres lecturas.
    fuentes: [src-1, src-2, src-6]
  - campo: superficie_construida_m2
    descripcion: >-
      Baxtel cifra en 2.200 m² la superficie total de la instalación tras la ampliación de CPD3,
      mientras que Revista Cloud describe la ampliación de 2026 como un paso «de 400 a 700 metros
      cuadrados» y la web corporativa habla de 600 metros IT disponibles. Son magnitudes distintas
      (superficie total frente a superficie TI) y no se han podido conciliar.
    fuentes: [src-3, src-6]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 15 millones de euros que Baxtel atribuye a la ampliación de CPD3 no están confirmados por
      fuente del operador ni por prensa española. No se ha publicado el importe de la ampliación
      anunciada en 2026.
    fuentes: [src-3, src-6]
  - campo: agua
    descripcion: >-
      Ninguna fuente describe el circuito de refrigeración ni publica consumo de agua, tampoco tras
      el anuncio de refrigeración líquida. Campo agua omitido.
    fuentes: [src-6]

