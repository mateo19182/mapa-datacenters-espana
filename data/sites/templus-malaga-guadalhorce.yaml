id: templus-malaga-guadalhorce
nombre: "Templus MAL01 — Málaga, Polígono Guadalhorce"
alias:
  - "MAL01"
  - "Templus Málaga"
tipo: edificio
operador: "Templus"
modelo: colocation

ubicacion:
  municipio: "Málaga"
  provincia: "Málaga"
  ccaa: "Andalucía"
  direccion: "Calle Eduardo Queipo de Llano Caballero 59, Polígono Industrial Guadalhorce, Málaga"
