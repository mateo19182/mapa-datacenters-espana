  lon: -4.474589
  precision: aproximada
  fuentes: [src-3, src-5, src-pin-mal01]

estado: ampliacion_en_construccion
estado_detalle: >-
  Instalación construida en 2020 e incorporada a la red de Templus, que la inauguró en noviembre de
  2024 como su primer emplazamiento en Andalucía. En 2024 se amplió con una nueva sala, CPD3, de
  40 racks. El 9 de abril de 2026 la compañía anunció, en una visita del alcalde de Málaga, una
  nueva ampliación con una cuarta sala de operaciones para pasar de 2 a 3 MW en 2027, triplicar el
  número de empresas alojadas de unas 100 a más de 300 e incorporar refrigeración líquida para
  densidades de 40 a 50 kW por rack.
estado_fuentes: [src-3, src-4, src-6, src-7, src-ampliacion-20260409]
fecha_puesta_en_servicio: "2024-11"

potencia:
  - tipo: no_especificado
    valor_mw: 2
    ambito: edificio
    referencia: "Potencia de partida declarada en la nota de ampliación de abril de 2026"
    estado_asociado: operativo
    fecha_dato: "2026-04-09"
    fuentes: [src-ampliacion-20260409]
  - tipo: instalada_total
    valor_mw: 2.8
    ambito: edificio
    referencia: "«Total power» comercial de MAL01, sin fecha de entrega"
    estado_asociado: desconocido
    fecha_dato: "2026-08-29"
    fuentes: [src-1, src-6]
    nota: "Potencia total de la ficha comercial; no es MW TI ni permiso de acceso. La nota de abril de 2026 declaraba 2 MW de partida, sin tipo."
  - tipo: it
    valor_mw: 2.6
    ambito: edificio
    referencia: "Potencia IT de MAL01 en un bloque de la página de red, sin fecha de entrega"
    estado_asociado: desconocido
    fecha_dato: "2026-10-17"
    fuentes: [src-2]
    nota: "Otro bloque de esa misma página y la ficha individual publican 2,8 MW de Total power. No se confunden los tipos ni se da por entregada la cifra IT."
  - tipo: no_especificado
    valor_mw: 3
    ambito: edificio
    referencia: "Capacidad total objetivo en 2027 tras la ampliación iniciada en abril de 2026"
    estado_asociado: en_construccion
    fecha_dato: "2026-04-16"
    fuentes: [src-6, src-7, src-ampliacion-20260409]
    nota: >-
      «prevé elevar su capacidad hasta los 3 MW en 2027». La fuente tampoco tipifica la magnitud, y
      describe la cifra vigente en la web del operador como «2,8 MW de utility power».
      Los 3 MW son el objetivo completo tras la obra, incluidos los 2 MW existentes; no
      son 3 MW adicionales y no se suman a la capacidad operativa.

fases:
  - nombre: "CPD3"
    estado: operativo
    fecha_puesta_en_servicio: "2024"
    fuentes: [src-3]
  - nombre: "Cuarta sala de operaciones (ampliación a 3 MW)"
    estado: ampliacion_en_construccion
    fecha_puesta_en_servicio: "2027"
    fuentes: [src-6]

superficie_construida_m2: 2200
inversion_anunciada_eur: 15000000
refrigeracion: >-
  Circuito de agua cerrado según Templus. La ampliación iniciada en 2026 prevé incorporar
  refrigeración líquida para densidades de 40-50 kW por rack; no se ha localizado confirmación
  de su entrega.

agua:
  circuito: cerrado
  sistema: "Circuito de agua cerrado declarado por el operador; ampliación con refrigeración líquida prevista."
  nota: "La nota de abril de 2026 no publica consumo ni WUE; no se extrapola su promesa de ahorro a consumo cero de toda la instalación."
  fuentes: [src-ampliacion-20260409]
enlaces_proyecto:
  - "https://templus.com/data-centers/malaga-mal01/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      La ficha individual y un bloque de la página de red publican 2,8 MW de potencia total;
      otro bloque rotula 2,6 MW como potencia IT. La nota primaria de abril daba 2 MW de partida
      y 3 MW previstos en 2027, sin precisar tipo. Las cifras comerciales carecen de fecha de
      entrega y no se asignan como capacidad operativa nueva.
    fuentes: [src-1, src-2, src-6]
  - campo: superficie_construida_m2
    descripcion: >-
      Baxtel cifra en 2.200 m² la superficie total de la instalación tras la ampliación de CPD3,
      mientras que Revista Cloud describe la ampliación de 2026 como un paso «de 400 a 700 metros
      cuadrados». La ficha actual del operador publica 400 m² IT; los 600 m² TI que recogía
      prensa son una observación anterior. Son magnitudes distintas
      (superficie total frente a superficie TI) y no se han podido conciliar.
    fuentes: [src-3, src-6]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 15 millones de euros que Baxtel atribuye a la ampliación de CPD3 no están confirmados por
      fuente del operador ni por prensa española. No se ha publicado el importe de la ampliación
      anunciada en 2026.
    fuentes: [src-3, src-6]
  - campo: agua
    descripcion: >-
      La nota primaria sí describe un circuito de agua cerrado, pero no publica consumo ni
      WUE y presenta la refrigeración líquida como parte de la ampliación futura.
    fuentes: [src-ampliacion-20260409]

