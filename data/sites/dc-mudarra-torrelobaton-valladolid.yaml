id: dc-mudarra-torrelobaton-valladolid
nombre: "DC Mudarra — Torrelobatón (Valladolid)"
alias:
  - "Centro de Proceso de Datos San Lorenzo"
  - "CPD San Lorenzo"
  - "Macrocentro de datos de Torrelobatón"
  - "Proyecto de centro de datos de Vapat en Valladolid"
tipo: campus
operador: "DC Mudarra"
propietario: "Grupo Vapat"
modelo: desconocido

ubicacion:
  municipio: "Torrelobatón"
  provincia: "Valladolid"
  ccaa: "Castilla y León"
  direccion: Finca San Lorenzo, polígono 38, parcelas 5002, 5003 y 5004; parcela de 117,83 ha a
    segregar en Torrelobatón
  lat: 41.6490374
  lon: -5.0250798
  precision: municipio
  fuentes:
    - src-jcyl
    - src-bebeez
    - src-osm
    - src-aai-202604
estado: en_tramitacion
estado_detalle: >-
  El proyecto tramita autorización ambiental y evaluación de impacto ambiental
  ante la Junta de Castilla y León con el nombre oficial «Centro de Proceso de
  Datos San Lorenzo» (expediente 013-26-AAVA). La información pública se anunció
  en el BOCYL nº 140 de 22 de julio de 2026, con plazo de alegaciones hasta el 2
  de septiembre de 2026. Vapat constituyó las sociedades promotoras en febrero de
  2026. El proyecto ha generado oposición vecinal organizada en un municipio de
  unos 400 habitantes.
estado_fuentes: [src-jcyl, src-bebeez, src-ti, src-dv]

potencia:
  - tipo: it
    valor_mw: 160
    ambito: campus
    referencia: "Potencia informática neta del campus a pleno desarrollo"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08"
    fuentes:
      - src-bebeez
      - src-ti
      - src-dv
      - src-ec
      - src-resumen-aai-202604
    nota: >-
      Las fuentes hablan de "up to 160MW of IT capacity" y de "una potencia
      informática (IT) neta de 160 megavatios", repartida en dos edificios de
      ocho salas de 10 MW cada una, es decir 80 MW por edificio. Los promotores
      advierten de que el proyecto podría no completarse en su integridad.
  - tipo: termica_respaldo
    valor_mw: 786.82
    ambito: campus
    referencia: "Potencia térmica total del parque de grupos electrógenos de emergencia y equipos auxiliares"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08-08"
    fuentes:
      - src-dv
      - src-ti
      - src-resumen-aai-202604
    nota: >-
      No es capacidad del centro de datos. Corresponde a 96 grupos electrógenos de
      emergencia de 8,16 MW de potencia térmica cada uno más otros equipos
      auxiliares. No se compara ni se suma con los 160 MW IT.
  - tipo: instalada_total
    valor_mw: 231.24966
    ambito: campus
    referencia: Previsión de potencia total máxima de las dos fases, tabla 20 de la solicitud de AAI
    estado_asociado: en_tramitacion
    fecha_dato: 2026-04
    fuentes:
      - src-aai-202604
    nota: El documento da 231.249,66 kWe totales. Es un máximo de diseño, no capacidad instalada o
      energizada comprobada. No es la carga IT de 160 MW ni el permiso de acceso.
fases:
  - nombre: "Fase 1 — primer edificio de ocho salas IT"
    estado: en_tramitacion
    superficie_m2: 141189.64
    nota: >-
      Superficie de desarrollo de la primera fase. Incluye el primer edificio de
      centro de datos (24.771 m2 de edificación), una balsa de acumulación de
      7.200 m2 y la balsa final de 32.700 m2, que estará lista en esta fase.
    fuentes:
      - src-dv
      - src-aai-202604
  - nombre: "Fase 2 — segundo edificio de ocho salas IT"
    estado: en_tramitacion
    superficie_m2: 97928.71
    nota: Superficie total de desarrollo de la fase II según la tabla 7 de la AAI. El primer edificio y
      el segundo se plantean con hasta ocho salas de 10 MW IT cada uno.
    fuentes:
      - src-dv
      - src-aai-202604
conexion_electrica:
  subestacion: SET CPD San Lorenzo 30/220 kV, línea subterránea 220 kV y ampliación de la SET San
    Lorenzo existente
  tension_kv: 220
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: El emplazamiento se sitúa junto a los parques eólicos San Lorenzo de Vapat y cerca de la
    subestación eléctrica de La Mudarra, descrita como punto estratégico de la red de la zona; la
    ubicación se eligió por la proximidad de infraestructura eléctrica con capacidad suficiente. El
    CPD contará además con una subestación eléctrica anexa. La demanda eléctrica estimada a plena
    capacidad es de 2.025,6 GWh al año, que es energía y no potencia. No consta la potencia de
    acceso solicitada ni concedida. La solicitud de AAI prevé dos transformadores de 142 MVA y una
    línea subterránea de 220 kV. Son instalaciones proyectadas, sin prueba de acceso concedido; no
    se convierten MVA a MW.
  fuentes:
    - src-bebeez
    - src-dv
    - src-ec
    - src-aai-202604
superficie_construida_m2: 49543

refrigeracion: >-
  Circuitos sellados y sistema de vertido cero según la promotora, con patios
  mecánicos exteriores para los equipos de refrigeración y balsas de acumulación
  que garantizan la reserva de agua.

agua:
  circuito: cerrado
  sistema: >-
    Circuitos sellados con recirculación y vertido cero, según la promotora, con
    balsas de acumulación de 7.200 m2 en cada fase y una balsa final de 32.700 m2.
  origen: Aprovisionamiento inicial mediante camiones cisterna y tanques; la parcela no dispone de red
    de abastecimiento
  consumo_m3_ano: 5996
  consumo_m3_dia: null
  wue_l_kwh: null
  nota: La tabla 19 de la AAI fija 5.996 m³/año para las dos fases, incluidos 2.044 m³ administrativos
    y 3.916 m³ de tratamiento de aire. Añade llenados iniciales de 1.040 m³ de refrigeración y 400
    m³ contra incendios, realizados una sola vez, que no se suman al anual. La ausencia de vertido
    industrial no equivale a ausencia de consumo.
  fuentes:
    - src-ti
    - src-ec
    - src-aai-202604
inversion_anunciada_eur: null

empleo:
  - tipo: directo
    valor: 140
    referencia: "Empleo del complejo si se ejecuta completo"
    fecha_dato: "2026-08"
    fuentes: [src-dv, src-ec, src-dcd]
    nota: >-
      Las fuentes lo describen indistintamente como "140 puestos de trabajo",
      "140 trabajadores" y "140 empleos directos". No consta empleo de
      construcción.

incertidumbres:
  - campo: superficie_parcela_m2
    descripcion: La AAI distingue 238,71 ha de parcelas catastrales actuales, 117,83 ha para la parcela
      a segregar y 239.118,35 m² de superficies del complejo, tabla 7. Se registra la parcela de
      117,83 ha. La prensa había mezclado esos ámbitos y transcrito incorrectamente la superficie de
      fase II.
    fuentes:
      - src-bebeez
      - src-ec
      - src-dv
      - src-aai-202604
  - campo: potencia
    descripcion: El resumen oficial distingue 96 grupos de 8,16 MWt, dos de 1,32 MWt y dos de 0,52 MWt,
      con 786,82 MWt totales. Esto explica los 100 grupos totales frente a 96 principales que
      confundía la prensa. La potencia térmica de respaldo no se suma a la potencia IT ni a la
      previsión eléctrica total.
    fuentes:
      - src-ti
      - src-dv
      - src-ec
      - src-resumen-aai-202604
  - campo: inversion_anunciada_eur
    descripcion: >-
      La inversión se cita como una horquilla de 1.600 a 2.000 millones de euros
      ("más de 1.600 millones", "algunas fuentes elevan la inversión hasta rozar
      los 2.000", "no menos de 1.600-2.000 millones"); no se registra cifra única.
    fuentes: [src-bebeez, src-dv, src-ec]
  - campo: ubicacion
    descripcion: El expediente identifica la finca San Lorenzo y las parcelas 5002,5003 y 5004 del
      polígono 38 de Torrelobatón, con 117,83 ha a segregar. Las coordenadas conservadas son una
      referencia municipal. Falta contrastar un punto del edificio o de la parcela en el plano
      georreferenciado antes de sustituirlas.
    fuentes:
      - src-jcyl
      - src-osm
      - src-aai-202604
confianza: media
ultima_verificacion: 2026-10-17
