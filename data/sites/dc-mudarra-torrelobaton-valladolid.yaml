  - id: src-ti
    url: "https://www.tercerainformacion.es/articulo/actualidad/06/08/2026/iu-valladolid-muestra-preocupacion-por-el-impacto-ambiental-y-el-consumo-de-recursos-hidricos-del-macrocentro-de-datos-proyectado-en-torrelobaton/"
    titulo: "IU Valladolid muestra preocupación por el impacto ambiental y el consumo de recursos hídricos del macrocentro de datos proyectado en Torrelobatón"
    editor: "Tercera Información"
    tipo: prensa_general
