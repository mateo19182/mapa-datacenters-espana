id: merlin-edged-navalmoral-de-la-mata
nombre: "MERLIN-Edged Navalmoral de la Mata — Expacio Navalmoral"
alias:
  - "Campus de centros de datos de IA de Navalmoral"
  - "Merlin Edge Navalmoral"
tipo: campus
operador: "MERLIN Edged"
propietario: "MERLIN Properties SOCIMI / Edged Energy"
modelo: mayorista

ubicacion:
  municipio: "Navalmoral de la Mata"
  provincia: "Cáceres"
  ccaa: "Extremadura"
  direccion: "Parcela I-64 del Parque Industrial Norte de Extremadura (Expacio Navalmoral), acceso desde la A-5"
  lat: 39.9130138
  lon: -5.5173522
  precision: aproximada
  fuentes: [src-cope, src-osm, src-pex-aai]

estado: en_tramitacion
estado_detalle: >-
  Protocolo con la Junta de Extremadura firmado el 14 de enero de 2025.
  Información pública de la autorización ambiental integrada y del estudio de impacto ambiental
  abierta el 22 de mayo de 2026 (DOE núm. 96, anuncio de 19 de mayo, expediente AAI25/032).
  Declarado Proyecto Empresarial de Interés Autonómico (PREMIA) el 12 de mayo de 2026. En el
  trámite de información pública Adenex presentó alegaciones pidiendo que se deniegue la
  autorización. El 28 de agosto de 2026 la consejera de Industria afirmó que el proyecto
  «prácticamente tiene la autorización ambiental favorable» tras atender un requerimiento de
  protección civil, y que el siguiente paso es la respuesta eléctrica del Ministerio. La promotora
  esperaba la licencia de obras para septiembre de 2026 y anunciaba el inicio inmediato de la
  primera fase. La documentación ambiental describe dos edificios, 16 salas técnicas de 12 MW IT,
  104 generadores diésel de emergencia, 48 depósitos de gasóleo de 120 m³ y 144 equipos de
  refrigeración en cubierta.
estado_fuentes: [src-merlin, src-cope, src-eldiario-premia, src-brains, src-pex-aai, src-doe-sumario, src-hoy, src-cincodias]

potencia:
  - tipo: it
    valor_mw: 1000
    ambito: campus
    referencia: "Capacidad TI del campus a pleno desarrollo (8-10 edificios de 100 MW TI)"
    estado_asociado: anunciado
    fecha_dato: "2025-01-14"
    fuentes: [src-merlin, src-edged]
    nota: >-
      La nota de la compañía habla de "1GW de capacidad IT en cada emplazamiento"
      y de "8 y 10 edificios con 100MW de capacidad IT cada uno".
  - tipo: it
    valor_mw: 20
    ambito: fase
    referencia: "Primera fase equipada"
    estado_asociado: anunciado
    fecha_dato: "2026-08"
    fuentes: [src-brains, src-cincodias]
    nota: >-
      "20 megavatios (MW) de capacidad destinada a tecnología de la información
      (TI)", en un edificio preparado para alcanzar los 100 MW.
  - tipo: it
    valor_mw: 12
    ambito: edificio
    edificio: "Sala técnica tipo (16 iguales)"
    referencia: "Cada una de las 16 salas técnicas descritas en la autorización ambiental integrada"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-05-22"
    fuentes: [src-pex-aai]
    nota: >-
      Es el único dato del expediente ambiental tipificado como MW IT. No se multiplica por 16 para
      derivar la capacidad del campus: la propia documentación publica por separado una demanda
      crítica de 192 MW.
  - tipo: no_especificado
    valor_mw: 288
    ambito: campus
    referencia: "Demanda energética total declarada en la autorización ambiental integrada"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-05-22"
    fuentes: [src-cope, src-pex-aai]
    nota: >-
      El anuncio de información pública cita 288 MW de demanda total y 192 MW de
      demanda crítica funcionando 8.760 horas al año, sin calificarlos como TI ni
      como potencia de acceso.
  - tipo: no_especificado
    valor_mw: 1400
    ambito: campus
    referencia: "Capacidad total pretendida a largo plazo (200 MW en una primera etapa y 1,2 GW adicionales)"
    estado_asociado: anunciado
    fecha_dato: "2026-08-10"
    fuentes: [src-cincodias]
    nota: >-
      Cinco Días atribuye a fuentes de la empresa la intención de alcanzar 1,4 GW con 14.000 millones
      de inversión a largo plazo, frente al 1 GW de capacidad IT que anunció la compañía en enero de
      2025. La fuente no califica los 1,4 GW como MW IT, aunque en el mismo artículo mide el resto de
      la cartera de Merlin en «MW de potencia IT».
  - tipo: conexion_red
    valor_mw: 29
    ambito: campus
    referencia: "Potencia eléctrica ya asegurada"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08"
    fuentes: [src-brains, src-cincodias]
    nota: "La fuente dice que la compañía tiene asegurados \"29 MW de potencia eléctrica\"."

fases:
  - nombre: "Fase 1 — primer edificio (20 MW TI equipados, preparado para 100 MW)"
    estado: anunciado
    nota: >-
      Inversión inicial de unos 400 millones de euros; inicio de obras previsto
      para otoño de 2026 tras la licencia.
    fuentes: [src-brains, src-cincodias]
  - nombre: "Campus completo (8-10 edificios de 100 MW TI)"
    estado: anunciado
    fuentes: [src-merlin]

conexion_electrica:
  subestacion: "SE Arañuelo 400 kV"
  tension_kv: 400
  titular_red: "Redeia"
  mw_concedidos: 29
  nota: >-
    La compañía sitúa el campus junto a la subestación Arañuelo 400 kV de Redeia
    y menciona fibra oscura desde Lisboa. A agosto de 2026 solo consta asegurada
    una potencia de 29 MW, suficiente para equipar unos 20 MW de capacidad TI; la compañía declaró
    ocupar la primera posición en un concurso de capacidad eléctrica en marcha y decidió construir
    el edificio sin esperar a que se concediera el resto.
  fuentes: [src-merlin, src-brains, src-cincodias]

superficie_parcela_m2: 206753
inversion_anunciada_eur: 1600000000
refrigeracion: >-
  Sistema modular de Edged Energy sin consumo de agua, con densidades de hasta
  70 kW por rack y PUE declarado de 1,15.

agua:
  circuito: sin_agua
  sistema: "Sistema ThermalWorks de Edged Energy, declarado sin consumo de agua para refrigeración."
  origen: null
  nota: >-
    Adenex sostiene en sus alegaciones que el expediente presenta el complejo como de consumo neto
    de agua nulo mientras la documentación incorpora consumos para servicios sanitarios y
    humectación de salas. No se ha publicado ninguna cifra de consumo.
  fuentes: [src-edged, src-adenex]

empleo:
  - tipo: no_especificado
    valor: 250
    referencia: "Empleos previstos según la información pública del expediente ambiental"
    fecha_dato: "2026-05-22"
    fuentes: [src-pex-aai, src-cope]
    nota: "Las fuentes no distinguen entre empleo directo e indirecto."

incertidumbres:
  - campo: potencia
    descripcion: >-
      Conviven cifras heterogéneas y no sumables: 1 GW de capacidad TI del campus
      (compañía, enero 2025), 1,4 GW como objetivo a largo plazo (fuentes de la empresa citadas por
      Cinco Días, agosto 2026), 288 MW de demanda total y 192 MW de demanda crítica repartida en 16
      salas técnicas de 12 MW IT (expediente ambiental, mayo 2026), 200 MW de primer tramo y 1,2 GW
      de ampliación posterior según prensa, y solo 29 MW de potencia eléctrica
      efectivamente asegurada en agosto de 2026.
    fuentes: [src-merlin, src-cope, src-brains, src-cincodias, src-pex-aai]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La información pública de la AAI cita 1.600 millones de euros, cifra que
      coincide con la declaración PREMIA; la prensa habla además de 400 millones
      para la primera fase, de 2.000 millones para los dos primeros edificios y de 14.000 millones
      para el desarrollo completo de 1,4 GW. No se sustituye la cifra registrada.
    fuentes: [src-cope, src-eldiario-premia, src-brains, src-cincodias]
  - campo: conexion_electrica
    descripcion: >-
      En junio de 2026 la Junta de Extremadura situó públicamente en Red
      Eléctrica el escollo para el suministro del campus. No se ha podido abrir
      la fuente original de esa información. En agosto de 2026 la consejera de Industria situaba la
      decisión sobre la potencia adicional en los ministerios competentes.
    fuentes: [src-brains, src-hoy]
  - campo: refrigeracion
    descripcion: >-
      La densidad por rack difiere según la fuente: la nota de MERLIN habla de hasta 70 kW por rack
      y la de Edged Energy, para los mismos dos campus extremeños, de hasta 200 kW por rack.
    fuentes: [src-merlin, src-edged]

