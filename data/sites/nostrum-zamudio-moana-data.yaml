    fecha_dato: "2026-06-03"
    fuentes: [src-1, src-2]
    nota: >-
      El Correo la describe como «potencia eléctrica de 30 MW» y Crónica Vasca como
      «30 MW de capacidad»; un titular posterior habla de «capacidad TI». Al no ser
      unívoco, se registra como no especificado.

fases:
