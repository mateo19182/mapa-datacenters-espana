      resumen) y como «capacidad TI» (titular de Crónica Vasca de enero de 2026). No se
      ha localizado el expediente del BOPV para dirimirlo.
    fuentes: [src-1, src-2]
  - campo: superficie_parcela_m2
    descripcion: "La fuente dice «ocupará unas dos hectáreas»; se registra el equivalente aproximado."
    fuentes: [src-1]
  - campo: operador
    descripcion: >-
      Moana Data, S.L. es la sociedad vehículo; el grupo promotor es la sevillana
      Nostrum (Nostrum Data Centers), que anunció seis proyectos en España.
    fuentes: [src-1, src-2]

