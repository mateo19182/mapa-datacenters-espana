  - id: src-3
    url: "https://www.euskadi.eus/y22-bopv/es/bopv2/datos/2026/05/2602178a.shtml"
    titulo: "RESOLUCIÓN de 13 de marzo de 2026, del viceconsejero de Medio Ambiente, por la que se formula declaración de impacto ambiental y se concede autorización ambiental integrada a la instalación de centro de procesamiento de datos promovida por Moana Data, S.L., en el Parque Tecnológico de Zamudio"
    editor: "Boletín Oficial del País Vasco (Gobierno Vasco)"
    tipo: oficial
    fecha_publicacion: "2026-05-22"
    fecha_consulta: "2026-08-31"
    cita: >-
      La empresa se asienta ocupando una superficie total de unos 21.423,72 m2,
      correspondiendo 5.726,5 m2 a superficie construida en la que se incluyen sus
      tres fases, y 9.725,08 m2 a superficie pavimentada [...] La planta dispone de
      un consumo total estimado de energía eléctrica para 278.805 MWh, y gasoil para
      un consumo estándar (Pruebas) de unos 119.388 litros/año [...] El agua
      consumida en las instalaciones proviene de red municipal que se estima un
      consumo de 850 m3/año [...] Se dispone de 16 focos de emisión no sistemáticos a
      la atmósfera provenientes de 16 generadores de emergencia de CPD [...] 15
      generadores dispondrán de una potencia térmica nominal de 7,465 MWh. 1
      generador dispondrá de una potencia térmica nominal de 1,818 Mwh.
