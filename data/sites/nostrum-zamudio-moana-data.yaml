id: nostrum-zamudio-moana-data
nombre: "Moana Data (Grupo Nostrum) — CPD del Parque Tecnológico de Zamudio"
alias:
  - "Moana Data Zamudio"
  - "Nostrum Data Centers Zamudio"
tipo: edificio
operador: "Moana Data, S.L. (Grupo Nostrum)"
propietario: "Moana Data, S.L."
modelo: mayorista

ubicacion:
  municipio: "Zamudio"
  provincia: "Bizkaia"
  ccaa: "País Vasco"
  direccion: "Polígono 1001, parcela 20011, subparcela 01, dentro de la parcela SZI-3B del Sector Aresti, Zamudio (Parque Tecnológico)"
  lat: 43.2860
  lon: -2.8650
  precision: aproximada
  fuentes: [src-1]

estado: permisos_concedidos
estado_detalle: >-
  Moana Data, S.L. solicitó la autorización ambiental integrada y la declaración de
  impacto ambiental el 3 de junio de 2025. El trámite de información pública se abrió
  el 14 de noviembre de 2025 y se cerró sin alegaciones. El viceconsejero de Medio
  Ambiente resolvió el 13 de marzo de 2026 y la resolución se publicó en el BOPV
  n.º 95 de 22 de mayo de 2026. La instalación queda encuadrada en la categoría 1.1
  del anexo I.A de la Ley 10/2021, «instalaciones de combustión con una potencia
  térmica nominal total igual o superior a 50MW», por la suma de sus grupos
  electrógenos de emergencia. El promotor prevé iniciar obras en 2026 y poner en
  servicio la primera fase hacia abril de 2028.
estado_fuentes: [src-1, src-2, src-3]

potencia:
  - tipo: no_especificado
    valor_mw: 30
    ambito: campus
    referencia: "Capacidad total prevista de la instalación (tres fases de 10 MW)"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-06-03"
    fuentes: [src-1, src-2]
    nota: >-
      El Correo la describe como «potencia eléctrica de 30 MW» y Crónica Vasca como
      «30 MW de capacidad»; un titular posterior habla de «capacidad TI». Al no ser
      unívoco, se registra como no especificado. La autorización ambiental integrada
      no publica ninguna cifra de potencia eléctrica del centro.
  - tipo: termica_respaldo
    valor_mw: 7.465
    ambito: edificio
    referencia: "Cada uno de los quince grupos electrógenos de emergencia mayores"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-03-13"
    fuentes: [src-3]
    nota: >-
      La AAI autoriza dieciséis focos de emisión de otros tantos grupos electrógenos
      de emergencia: quince de 7,465 MW térmicos nominales y uno de 1,818 MW. Es
      potencia de respaldo declarada en la autorización ambiental, no capacidad del
      centro de datos, y no se suma con nada.
  - tipo: termica_respaldo
    valor_mw: 1.818
    ambito: edificio
    referencia: "Decimosexto grupo electrógeno de emergencia"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-03-13"
    fuentes: [src-3]
    nota: "Potencia térmica nominal del generador menor, según la AAI."

fases:
  - nombre: "Fase 1 (10 MW)"
    estado: permisos_concedidos
    fecha_puesta_en_servicio: "2028-04"
    fuentes: [src-1, src-2]
  - nombre: "Fase 2 (10 MW)"
    estado: anunciado
    fuentes: [src-1, src-2]
  - nombre: "Fase 3 (10 MW)"
    estado: anunciado
    fuentes: [src-1, src-2]

superficie_parcela_m2: 20000
superficie_construida_m2: 5726.5

agua:
  circuito: desconocido
  sistema: null
  origen: "Red municipal; vertido de aguas sanitarias y pluviales al colector general del Consorcio de Aguas Bilbao Bizkaia"
  consumo_m3_ano: 850
  nota: >-
    La autorización ambiental integrada estima 850 m³/año de agua de red municipal y
    no describe el sistema de refrigeración, más allá de exigir el cumplimiento del
    documento de mejores técnicas disponibles para sistemas de refrigeración. Un
    consumo de ese orden es compatible con un circuito sin reposición significativa,
    pero la resolución no lo afirma y aquí no se deduce.
  fuentes: [src-3]

enlaces_proyecto:
  - "https://www.euskadi.eus/y22-bopv/es/bopv2/datos/2026/05/2602178a.pdf"

incertidumbres:
  - campo: potencia
    descripcion: >-
      Fuentes distintas describen los 30 MW como «potencia eléctrica» (El Correo, vía
      resumen) y como «capacidad TI» (titular de Crónica Vasca de enero de 2026). No se
      ha localizado el expediente del BOPV para dirimirlo.
    fuentes: [src-1, src-2]
  - campo: superficie_parcela_m2
    descripcion: >-
      El valor registrado (20.000 m²) procede de «ocupará unas dos hectáreas». La
      autorización ambiental integrada, posterior y más precisa, dice que «la empresa
      se asienta ocupando una superficie total de unos 21.423,72 m2». No se sustituye
      el valor registrado; se dejan ambos.
    fuentes: [src-1, src-3]
  - campo: otros
    descripcion: >-
      La AAI estima un consumo total de energía eléctrica de 278.805 MWh y un consumo
      de gasóleo de unos 119.388 litros al año en pruebas, con 254.500 litros
      adicionales en caso de 24 horas de interrupción de la red. Son magnitudes de
      energía y combustible, no de potencia, y no se registran en potencia[].
    fuentes: [src-3]
  - campo: operador
    descripcion: >-
      Moana Data, S.L. es la sociedad vehículo; el grupo promotor es la sevillana
      Nostrum (Nostrum Data Centers), que anunció seis proyectos en España.
    fuentes: [src-1, src-2]

confianza: alta
ultima_verificacion: "2026-08-31"

