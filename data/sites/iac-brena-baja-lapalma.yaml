estado: operativo
estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial. Es el nodo canario de la Red Española de Supercomputación y el
  decimocuarto de sus nodos: hasta septiembre de 2026 quedaba fuera del registro por la regla
  de alcance peninsular, que se cambió precisamente al ver lo que excluía. El supercomputador
  LaPalma está en el Centro de Astrofísica en La Palma, sede del IAC en la isla, que aloja
  también las oficinas del Gran Telescopio CANARIAS y de la colaboración MAGIC. Su instalación
  responde a una decisión estratégica: apoyar la actividad observacional del Observatorio del
  Roque de los Muchachos y reforzar las telecomunicaciones de la isla. La máquina está
  conectada con la sede del IAC en Tenerife por cable submarino a 10 Gbit/s. El 50 % de su
  capacidad se destina a la RES, y el nodo presta además servicio de datos.
estado_fuentes: [src-res, src-iac-super]

potencia: []

refrigeracion: >-
  La sala dispone de sistemas alternativos de suministro eléctrico y de frío, con funciones
  avanzadas de climatización, seguridad, monitorización y protección contra incendios. El
  supercomputador se mantiene a 24 °C. El suelo técnico resiste 2.000 kg por metro cuadrado.

computo:
  - tipo: cpu_hpc
    ambito: sistema
    sistema: "LaPalma"
    modelo: "Intel Xeon Platinum 8160 a 2,1 GHz, 2 por nodo (13.824 núcleos)"
    unidades: 288
    tipo_unidad: nodo
    rendimiento: 929
    rendimiento_unidad: tflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-09-01"
    fuentes: [src-res]
    nota: >-
      Configuración idéntica a Tirant 4 (Universitat de València): es hardware de la generación
      de MareNostrum 4 repartido entre nodos de la RES, y el propio IAC lo describe como «parte
      de los antiguos equipos» del supercomputador del BSC. Almacenamiento de 2 PB en Lustre e
      interconexión OmniPath de 100 Gbps, más 900 TB del nodo de datos.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES ni el IAC publican potencia eléctrica, carga TI ni superficie de la sala. El IAC
      describe la sala con detalle inusual —capacidad de carga del suelo técnico, temperatura de
      consigna, redundancia eléctrica y de frío— y no da ninguna cifra en vatios. Campo de
      potencia vacío.
    fuentes: [src-res, src-iac-super]
  - campo: computo
    descripcion: >-
      La ficha del nodo en la RES da «Main memory 27 648 TB», cifra imposible que corresponde a
      27,648 TB leídos con separador decimal español; es el mismo error que arrastra la ficha de
      Tirant, que describe la misma máquina. No se registra memoria. Las páginas del IAC
      discrepan además sobre el tamaño de la red: una dice que LaPalma es «uno de los siete
      nodos» de la RES y otra «uno de los catorce». La cifra vigente es catorce.
    fuentes: [src-res, src-iac-sede, src-iac-super]
  - campo: ubicacion
    descripcion: >-
      Nominatim no resuelve la Cuesta de San José ni el Centro de Astrofísica. Las coordenadas
      son el centroide del municipio de Breña Baja, no la ubicación del edificio.
    fuentes: [src-osm]

confianza: media
