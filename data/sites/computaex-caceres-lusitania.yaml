estado: operativo
estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial. La Fundación COMPUTAEX gestiona desde 2009 el Centro de Supercomputación
  de Extremadura, que aloja el supercomputador LUSITANIA. Desde principios de 2020 opera
  LUSITANIA III, financiado con fondos FEDER gestionados por la Junta de Extremadura. En julio
  de 2026 la fundación amplió la capacidad de almacenamiento con una nueva infraestructura
  Lustre de alto rendimiento. El 50 % de la máquina se destina a la RES. Es el único nodo de la
  RES en Extremadura y el único emplazamiento del registro en la provincia de Cáceres que no es
  un proyecto de centro de datos comercial.
estado_fuentes: [src-res, src-computaex]

potencia: []

computo:
  - tipo: cpu_hpc
    ambito: sistema
    sistema: "LUSITANIA III"
    modelo: "Intel Xeon Platinum 8160 a 2,1 GHz, 2 por nodo (6.912 núcleos)"
    unidades: 144
    tipo_unidad: nodo
    rendimiento: 464.5
    rendimiento_unidad: tflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-res]
    nota: >-
      COMPUTAEX cifra la capacidad de LUSITANIA III en 313 TFlops, distinta de la que publica la
      ficha del nodo. La discrepancia queda en `incertidumbres[]`. La configuración es idéntica
      a la de Mequinenza, Cibeles 4 y Tirant 4: hardware de la generación de MareNostrum 4
      repartido entre nodos de la RES.

incertidumbres:
  - campo: computo
    descripcion: >-
      Las dos fuentes discrepan sobre la misma máquina. COMPUTAEX afirma que LUSITANIA III
      «alcanza una capacidad de cómputo de 313 TFlops»; la ficha del nodo en la RES da 464,5
      TFlop/s de pico para 144 nodos. Se registra la de la RES, que detalla la configuración, y
      se conserva el choque. La misma ficha da además «420 PB Lustre» de almacenamiento, cifra
      inverosímil que no se registra.
    fuentes: [src-res, src-computaex]
  - campo: potencia
    descripcion: >-
      Ni la RES ni COMPUTAEX publican potencia eléctrica, carga TI ni superficie de la sala.
      Campo de potencia vacío.
    fuentes: [src-res, src-computaex]
  - campo: ubicacion
    descripcion: >-
      La dirección oficial es un punto kilométrico de la N-521, la carretera de Cáceres a
      Trujillo, que Nominatim no resuelve. Las coordenadas son el centroide del municipio de
      Cáceres, no la ubicación del edificio.
    fuentes: [src-osm]

