propietario: "BBVA"
modelo: corporativo

ubicacion:
  municipio: "Tres Cantos"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  lat: null
  lon: null
  precision: municipio
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  CPD de 20.000 m² construido anexo a un centro anterior de BBVA en el mismo complejo de Tres
  Cantos; el Uptime Institute lo registra como «Complejo Tecnologico Tres Cantos - CPD II». BBVA
  anunció el arranque de sus operaciones el 6 de marzo de 2012 y lo presentó como el primer CPD
  de Europa y el cuarto del mundo con doble certificación Tier IV en diseño y construcción. En
  2014 obtuvo además el Tier IV Gold de sostenibilidad operativa, y lo renovó en abril de 2025
  con la puntuación más alta que ha recibido el complejo. La certificación se revisa cada tres
  años mediante auditoría.
estado_fuentes: [src-1, src-2, src-3, src-4]
fecha_puesta_en_servicio: "2011"

potencia:
  - tipo: generacion_asociada
    valor_mw: 0.46
    ambito: edificio
    referencia: "Planta solar fotovoltaica on site para autoconsumo del CPD"
    estado_asociado: operativo
    fecha_dato: "2025-04-23"
    fuentes: [src-3]
    nota: >-
      «una planta solar fotovoltaica 'on site' con la que se generan hasta 460 KW destinados
      exclusivamente para autoconsumo en el CPD». Es capacidad de generar, no de consumir, y no
      entra en ningún agregado de capacidad del centro.

superficie_construida_m2: 20000
refrigeracion: >-
  Más de treinta medidas de ahorro energético implantadas en los últimos años, entre ellas el
  cerramiento de pasillos fríos en los armarios, que BBVA cifra en más de 800 MWh de ahorro en su
  primer año, y la optimización de las consignas de funcionamiento.

incertidumbres:
  - campo: potencia
    descripcion: >-
      BBVA no publica ninguna cifra de potencia eléctrica del CPD: los únicos datos energéticos
      que da son el ahorro obtenido con el cerramiento de pasillos fríos y la potencia de la
      planta fotovoltaica de autoconsumo.
    fuentes: [src-1, src-3]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      La prensa especializada data el arranque del CPD en 2011, mientras que BBVA anunció el
      «arranque de las operaciones» el 6 de marzo de 2012 y una crónica de la inauguración
      precisa que el centro no operaba entonces al 100%, algo previsto para 2014 tras el trasvase
      de la infraestructura anterior. Se conserva la fecha registrada y se deja constancia de las
      otras dos lecturas.
    fuentes: [src-1, src-2, src-4]
  - campo: tipo
    descripcion: >-
      El CPD se construyó anexo a otro centro de datos que BBVA ya tenía en Tres Cantos, y el
      Uptime Institute lo identifica como «CPD II» del mismo complejo tecnológico. La ficha
      describe únicamente el edificio nuevo; el anterior no se ha podido caracterizar ni se sabe
      si sigue en servicio.
    fuentes: [src-2, src-4, src-5]
  - campo: ubicacion
    descripcion: "No consta dirección concreta; la geolocalización queda a nivel de municipio."
    fuentes: [src-1]

confianza: media
ultima_verificacion: "2026-08-31"

