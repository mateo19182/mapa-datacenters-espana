id: edgemode-torrecampo-green-dc
nombre: "Green DC Torrecampo — EdgeMode"
alias:
  - "EdgeMode Torrecampo"
  - "DC Estate Torrecampo"
  - "Palma (denominación del emplazamiento en el term sheet de Pure Data Centres Group)"
  - "Palma del Río (topónimo que le atribuye la prensa; las parcelas están en Torrecampo)"
tipo: campus
operador: "EdgeMode"
propietario: "DC Estate Torrecampo, S.L., filial de DC Estate Solutions Cayman Limited (EdgeMode 50,1 % — Blackberry AIF 49,9 %). El suelo es de particulares y está arrendado."
modelo: mayorista

ubicacion:
  municipio: "Torrecampo"
  provincia: "Córdoba"
  ccaa: "Andalucía"
  direccion: >-
    Nueve fincas rústicas de los polígonos 3, 4 y 5 de Torrecampo, en los parajes Dehesa Vieja,
    Navarodes, Tierra Abajo, Dehesilla de Cascarr y Laguna de Cobos, unos 4 km al norte del casco
    urbano. Referencias catastrales 14062A003000230000DF, 14062A004000080000DJ,
    14062A005000140000DD, 14062A005000160000DI, 14062A005000190000DS, 14062A005000270000DA,
    14062A005000390000DM, 14062A005000420000DM y 14062A005000430000DO.
  lat: 38.494901
  lon: -4.687446
  precision: aproximada
  fuentes: [src-3, src-7]

estado: anunciado
estado_detalle: >-
  Segundo emplazamiento andaluz del porfolio español que EdgeMode adquirió a Blackberry AIF.
  pv-tech sitúa el ready-to-build del conjunto en el primer trimestre de 2026 y el arranque
  comercial escalonado desde 2027. El suelo se controla mediante un contrato de arrendamiento
  firmado el 3 de marzo de 2025 entre los propietarios y NGE Spain Solia Renewables, S.L., que
  describe el proyecto como «un centro de datos de tipo IV y una planta solar fotovoltaica» y
  condiciona su continuidad a obtener el punto de suministro y un informe de compatibilidad
  urbanística favorable. El arrendamiento se cedió a Blackberry AIF el 25 de marzo de 2025 y de
  esta a DC Estate Torrecampo, S.L. el 10 de octubre de 2025. El emplazamiento sí figura entre los
  cuatro que EdgeMode preacordó vender a Pure Data Centres Group el 1 de julio de 2026, pero con el
  nombre «Palma»; ver incertidumbres. A 30 de agosto de 2026 seguía sin obras, sin permisos y sin
  punto de conexión.
estado_fuentes: [src-1, src-2, src-3, src-4, src-5, src-7, src-10]

potencia:
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Capacidad atribuida al emplazamiento de Torrecampo"
    estado_asociado: anunciado
    fecha_dato: "2026-08-14"
    fuentes: [src-10, src-2, src-5]
    nota: >-
      El propio EdgeMode nombra la sociedad vehículo «DC Estate Torrecampo SL 300 MW» en sus cuentas
      trimestrales ante la SEC, sin decir de qué tipo de MW habla. El Conciso y Economía Digital
      repiten la misma cifra. El term sheet de Pure Data Centres, en cambio, atribuye 1,5 GW
      conjuntos a Córdoba y «Palma», cifra que no encaja con los 300 MW por sociedad.
  - tipo: generacion_asociada
    valor_mw: 360
    ambito: campus
    referencia: "Pilas de combustible de óxido sólido desplegables en cada uno de los cinco emplazamientos"
    estado_asociado: anunciado
    fecha_dato: "2026-07-14"
    fuentes: [src-4]
    nota: >-
      «Up to 360MW of fuel cell capacity could be deployed at each of the five sites». Es capacidad
      de generación con gas natural, no capacidad del centro de datos, y no entra en ningún agregado.

superficie_parcela_m2: 1194335

enlaces_proyecto: []

incertidumbres:
  - campo: nombre
    descripcion: >-
      Expansión y Data Center Dynamics sitúan «Palma del Río (Córdoba)» entre los cuatro suelos que
      EdgeMode preacordó vender a Pure Data Centres Group. Ese topónimo no consta en ningún
      documento primario: el Form 8-K de 1 de julio de 2026, el term sheet y la carta de
      exclusividad dicen solo «Palma», y una búsqueda a texto completo en EDGAR devuelve cero
      resultados para «Palma del Rio» en todo el archivo. En Palma del Río tampoco hay expediente
      urbanístico ni ambiental de centro de datos: el BOJA solo registra allí plantas fotovoltaicas
      y la ampliación de la subestación de 132/66 kV. Los cinco arrendamientos españoles de EdgeMode
      están íntegramente identificados por referencia catastral y ninguna parcela cae en Palma del
      Río: Córdoba capital, Cáceres y Casar de Cáceres, Vianos y Alcaraz, Mora y Villamuelas, y
      Torrecampo. De las cinco sociedades vehículo, Malpica (Mora, Toledo) estaba bajo exclusividad
      de 60 días con otro comprador —Spark AI Foundry— desde el 24 de junio de 2026, una semana
      antes del term sheet de Pure. Descartadas Córdoba, Vianos, Cáceres y Malpica, el cuarto suelo
      del preacuerdo solo puede ser Torrecampo. La identificación es por eliminación: no se ha
      localizado ningún documento que diga literalmente que «Palma» es Torrecampo. Por eso el
      emplazamiento no se desdobla en dos fichas, que contarían dos veces los mismos 300 MW, y
      «Palma» y «Palma del Río» quedan registrados como alias.
    fuentes: [src-7, src-8, src-9, src-10, src-11, src-12]
  - campo: potencia
    descripcion: >-
      No hay una cifra de potencia medida ni un tipo declarado. El nombre de la sociedad vehículo
      («DC Estate Torrecampo SL 300 MW») es lo más parecido a una fuente primaria, y no dice si son
      MW de carga TI, de conexión o instalados. El contrato de arrendamiento no cifra la potencia
      del centro ni de la planta fotovoltaica («de una capacidad determinada»). El term sheet de
      Pure DC habla de 1,5 GW combinados para Córdoba y «Palma», y una segunda adenda a la empresa
      conjunta, de 23 de marzo de 2026, elevó la capacidad del conjunto español a 4.350 MW: las
      cifras del promotor se revisan al alza sin explicar el reparto.
    fuentes: [src-3, src-8, src-10]
  - campo: ubicacion
    descripcion: >-
      La transcripción del contrato de arrendamiento publicada en EDGAR está degradada por el
      reconocimiento óptico y algunas referencias catastrales aparecen corrompidas (por ejemplo
      «14O62A00500019£XXI0DS»). Las nueve se han reconstruido y comprobado una a una contra el
      servicio de consulta del Catastro, que las sitúa todas en el término de Torrecampo (Córdoba).
      La superficie arrendada de 119,4335 ha del encabezado de la tabla coincide con la suma de las
      nueve parcelas. Las coordenadas son el centroide de esas parcelas ponderado por superficie, no
      la ubicación del edificio, que no consta. Dos de las fincas —parcelas 27 y 42 del polígono
      5— seguían pendientes de inscribir a nombre de los propietarios en la fecha del contrato.
    fuentes: [src-3, src-12]
  - campo: estado
    descripcion: >-
      No se ha localizado ficha de proyecto, licencia ni solicitud de acceso a red para Torrecampo.
      El contrato de arrendamiento de marzo de 2025 se firma con el punto de suministro y el informe
      de compatibilidad urbanística aún por solicitar, y prevé la resolución automática si no se
      obtienen en plazo. Torrecampo tampoco aparece en la lista del suministro asegurado de 1,5 GW
      que EdgeMode difundió en diciembre de 2025, donde figuran Córdoba, Vianos, Alcaraz y Toledo.
    fuentes: [src-3, src-6]

