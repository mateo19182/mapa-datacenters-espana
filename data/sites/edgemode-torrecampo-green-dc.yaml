id: edgemode-torrecampo-green-dc
nombre: "Green DC Torrecampo — EdgeMode"
alias:
  - "EdgeMode Torrecampo"
  - "DC Estate Torrecampo"
tipo: campus
operador: "EdgeMode"
propietario: "Sociedad conjunta EdgeMode (75%) — Blackberry AIF (25%)"
modelo: mayorista

ubicacion:
  municipio: "Torrecampo"
  provincia: "Córdoba"
  ccaa: "Andalucía"
  direccion: "Fincas rústicas de los polígonos 3, 4 y 5 de Torrecampo (entre ellas las parcelas 27 y 42 del polígono 5)"
  lat: 38.4525
  lon: -4.6878
  precision: municipio
  fuentes: [src-1, src-2, src-3]

estado: anunciado
estado_detalle: >-
  Segundo emplazamiento andaluz del porfolio español de cinco campus que EdgeMode adquirió a
  Blackberry AIF. pv-tech sitúa el ready-to-build del conjunto en el primer trimestre de 2026 y el
  arranque comercial escalonado desde 2027. El suelo se controla mediante un contrato de
  arrendamiento firmado el 3 de marzo de 2025 entre los propietarios y NGE Spain Solia Renewables,
  S.L., que describe el proyecto como «un centro de datos de tipo IV y una planta solar
  fotovoltaica» y condiciona su continuidad a obtener el punto de suministro y un informe de
  compatibilidad urbanística favorable. Torrecampo no figura entre los cuatro emplazamientos que
  EdgeMode acordó vender a Pure Data Centres Group en julio de 2026, donde aparece en su lugar Palma
  del Río. A 30 de agosto de 2026 seguía sin obras, sin permisos y sin punto de conexión.
estado_fuentes: [src-1, src-2, src-3, src-4, src-5]

potencia:
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Capacidad atribuida al campus de Torrecampo dentro del porfolio de 1,5 GW"
    estado_asociado: anunciado
    fecha_dato: "2026-08-30"
    fuentes: [src-2, src-5]
    nota: >-
      El Conciso dice «Córdoba y Torrecampo, dotadas con 300 MW cada una» sin especificar el tipo
      de MW; Economía Digital repite la cifra el 30 de agosto de 2026.
  - tipo: generacion_asociada
    valor_mw: 360
    ambito: campus
    referencia: "Pilas de combustible de óxido sólido desplegables en cada uno de los cinco emplazamientos"
    estado_asociado: anunciado
    fecha_dato: "2026-07-14"
    fuentes: [src-4]
    nota: >-
      «Up to 360MW of fuel cell capacity could be deployed at each of the five sites». Es capacidad
      de generación con gas natural, no capacidad del centro de datos, y no entra en ningún agregado.

enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      Cifra derivada del reparto del objetivo agregado de 1,5 GW entre cinco campus. Sin fuente
      específica para Torrecampo ni tipo de MW. El contrato de arrendamiento del suelo, que es la
      única fuente primaria localizada, no cifra la potencia del centro ni de la planta fotovoltaica
      («de una capacidad determinada»).
    fuentes: [src-1, src-2, src-3]
  - campo: ubicacion
    descripcion: >-
      El contrato de arrendamiento identifica nueve fincas rústicas en los polígonos 3, 4 y 5 del
      término municipal de Torrecampo, dos de ellas —parcelas 27 y 42 del polígono 5— pendientes de
      regularizar a nombre de los propietarios. La transcripción del documento está degradada por el
      reconocimiento óptico y no permite reproducir con seguridad las referencias catastrales ni la
      superficie total arrendada. Sin dirección postal ni parcela publicada por la promotora;
      coordenadas de municipio.
    fuentes: [src-1, src-2, src-3]
  - campo: estado
    descripcion: >-
      A diferencia de Córdoba, no se ha localizado ficha de proyecto ni referencia a licencias o
      conexión a red para Torrecampo. El contrato de arrendamiento de marzo de 2025 se firma con el
      punto de suministro y el informe de compatibilidad urbanística aún por solicitar, y prevé la
      resolución automática si no se obtienen en plazo. Torrecampo desaparece además de las dos
      listas más recientes del porfolio: la del suministro asegurado de 1,5 GW (diciembre de 2025) y
      la de la venta a Pure DC (julio de 2026), en la que figura Palma del Río. Sigue apareciendo, en
      cambio, en la prensa económica andaluza de agosto de 2026.
    fuentes: [src-3, src-4, src-5, src-6]
  - campo: operador
    descripcion: >-
      El arrendatario del suelo es NGE Spain Solia Renewables, S.L., sociedad con domicilio en
      Sevilla, no EdgeMode ni Blackberry AIF. El contrato permite la cesión de la posición
      contractual a terceros. No se ha localizado documento que acredite esa cesión.
    fuentes: [src-3]

confianza: baja
ultima_verificacion: "2026-08-31"

