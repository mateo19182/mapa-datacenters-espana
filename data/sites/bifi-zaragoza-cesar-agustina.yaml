      Configuración idéntica a las particiones que recibieron Lusitania, Cibeles 4 y Tirant 4:
      es hardware de la generación de MareNostrum 4 repartido entre nodos de la RES.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES ni el BIFI publican potencia eléctrica, carga TI ni superficie del Laboratorio
      de Supercomputación. Campo de potencia vacío.
    fuentes: [src-res, src-bifi]
  - campo: computo
    descripcion: >-
      La página de equipamiento del propio BIFI sigue describiendo como nodo aragonés de la RES
      a Caesaraugusta, «un superordenador con 3.072 núcleos y 25 TFLOPs», mientras que la ficha
      del nodo en la RES describe Agustina y Mequinenza, muy superiores. La página del BIFI está
      desactualizada; se registra la de la RES y se conserva la discrepancia.
    fuentes: [src-res, src-bifi]

