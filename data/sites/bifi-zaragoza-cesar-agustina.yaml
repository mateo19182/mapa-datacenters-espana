estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial. El BIFI aloja el Centro de Supercomputación de Aragón (CESAR), que tiene
  dos sedes: el Laboratorio de Supercomputación (LSC), que es el centro de proceso de datos del
  Edificio I+D del Campus Río Ebro, y el Laboratorio de Innovación Abierta del edificio Etopía,
  de actividad ciudadana. El cómputo registrado aquí está en el LSC. El BIFI opera además las
  máquinas dedicadas JANUS I y JANUS II, de cálculo en ciencia de materiales, y más de 10.000
  núcleos de computación voluntaria del proyecto Ibercivis. Es el nodo aragonés de la RES, con
  un 36 % de Agustina y un 50 % de Mequinenza destinados a la red.
estado_fuentes: [src-res, src-bifi]

potencia: []

