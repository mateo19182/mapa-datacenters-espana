estado: operativo
estado_detalle: >-
  Edificio operativo desde la etapa Colt y AtlasEdge, adquirido por Templus en diciembre de 2025. La
  nota primaria del 26 de mayo de 2026 lo integra con el antiguo Cellnex en un campus comercial y le
  atribuye 4 MW sin tipificar. La ficha individual actual mantiene 8 MW bajo Total power y el
  inventario de centros operativos publica 5,7 MW IT para Barcelona 02. Se conservan las tres
  lecturas separadas.
estado_fuentes: [ src-2, src-3, src-5, src-6, src-nota-campus, src-inventario-it ]
fecha_puesta_en_servicio: "2001"

potencia:
  - tipo: no_especificado
    valor_mw: 4
    ambito: edificio
    referencia: "Potencia del edificio adquirido a AtlasEdge"
    estado_asociado: operativo
    fecha_dato: "2026-05-26"
    fuentes: [ src-3, src-nota-campus ]
    nota: >-
      La nota primaria de Templus del 26 de mayo confirma 4 MW para el activo comprado a AtlasEdge,
      sin precisar tipo de MW. No se equipara a los 8 MW de Total power ni a los 5,7 MW IT que el
      operador publica actualmente.
  - tipo: no_especificado
    valor_mw: 8
    ambito: edificio
    referencia: "«Total power» del edificio según la ficha de producto de Templus"
    estado_asociado: operativo
    fecha_dato: "2026-04-27"
    fuentes: [src-5]
    nota: >-
      La web de Templus publica "Total power 8 MW" y "Superficie IT 2.100 m²"
      para BCN02, el doble de los 4 MW que le atribuye la prensa especializada.
      Se conservan las dos lecturas.
  - tipo: no_especificado
    valor_mw: 6
    ambito: edificio
    referencia: "Potencia del edificio en el momento de su compra por Principal Real Estate"
    estado_asociado: operativo
    fecha_dato: "2022-08-24"
    fuentes: [src-6]
    nota: >-
      La operación describe "a 6MW, 10,500 square meter data center in Barcelona"
      arrendado a AtlasEdge hasta agosto de 2033, con imágenes que corresponden a
      la antigua instalación de Colt DCS en Carrer de l'Acer 5.
  - tipo: it
    valor_mw: 5.7
    ambito: edificio
    referencia: Potencia IT de Barcelona 02 en el inventario de centros operativos
    estado_asociado: operativo
    fuentes:
      - src-inventario-it
    nota: Cifra expresamente rotulada Potencia IT en el bloque inferior del inventario del operador. La
      misma página conserva otros valores en sus tarjetas Total power. No se equiparan ni se deduce
      un PUE. La página no publica fecha del dato ni fecha de ampliación.

superficie_construida_m2: 2160

refrigeracion: >-
  La ficha técnica de Colt (2019) describía densidades de 1.000 W/m² en la sala
  Acero 1 y 1.500 W/m² en Acero 2, UPS N+N y generadores N+1 por sala.

incertidumbres:
  - campo: potencia
    descripcion: >-
      La ficha técnica de Colt de 2019 anunciaba "Powered by 6MVA" / "Total power
      provision of 6MVA". Es potencia aparente (MVA), no MW, y no se convierte.
      Además es un dato de 2019 anterior a los cambios de propiedad. La ficha
      posterior de AtlasEdge para el mismo edificio (BCN001) rebaja esa cifra a
      "Powered by 4.8 MVA". En total hay cuatro lecturas distintas del mismo
      inmueble —4 MW, 8 MW, 6 MW y 4,8/6 MVA— y ninguna fuente explica la
      diferencia.
    fuentes: [src-2, src-4, src-5, src-6, src-7]
  - campo: superficie_construida_m2
    descripcion: >-
      Baxtel y la ficha de Colt dan 2.160 m² de superficie construida; Templus
      publica 2.100 m² de «Superficie IT»; la operación de Principal Real Estate
      habla de un edificio de 10.500 m². No se ha determinado si describen
      perímetros distintos del mismo inmueble.
    fuentes: [src-2, src-5, src-6]
  - campo: propietario
    descripcion: >-
      La ficha registra a Templus como propietario. El inmueble fue comprado en
      2022 por el Principal European Data Centre Fund I y arrendado al operador;
      un portavoz de AtlasEdge precisó entonces que la venta la hizo el
      arrendador anterior y no AtlasEdge. No se ha localizado documento posterior
      que aclare si Templus adquirió el edificio o solo el negocio y el
      arrendamiento.
    fuentes: [src-3, src-6]
  - campo: operador
    descripcion: >-
      Baxtel todavía lista el activo como AtlasEdge; la venta a Templus se cerró
      en diciembre de 2025 y el campus se presentó en mayo de 2026.
    fuentes: [src-2, src-3]
  - campo: potencia
    descripcion: El inventario actual de Templus etiqueta 5,7 MW como potencia IT de este edificio. Sus
      fichas individuales y tarjetas Total power publican otra magnitud; la nota de mayo da un
      reparto de 6 y 4 MW sin tipificar. No se igualan esas lecturas ni se considera que los 7 MW IT
      adicionales de plataforma publicados por Colliers correspondan íntegros a un edificio.
    fuentes:
      - src-inventario-it
      - src-5
      - src-nota-campus
      - src-colliers-20261008
  - campo: ubicacion
    descripcion: El registro nominal de PeeringDB enlaza el pin de Google Maps de este edificio y
      confirma la dirección. Se conserva el punto con precisión aproximada, sin atribuirlo a una
      sala o al conjunto del campus comercial.
    fuentes:
      - src-peering-mapa

