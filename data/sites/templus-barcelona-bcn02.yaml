    fuentes: [src-5]
    nota: >-
      La web de Templus publica "Total power 8 MW" y "Superficie IT 2.100 m²"
      para BCN02, el doble de los 4 MW que le atribuye la prensa especializada.
      Se conservan las dos lecturas.
  - tipo: no_especificado
    valor_mw: 6
    ambito: edificio
    referencia: "Potencia del edificio en el momento de su compra por Principal Real Estate"
    estado_asociado: operativo
    fecha_dato: "2022-08-24"
    fuentes: [src-6]
    nota: >-
      La operación describe "a 6MW, 10,500 square meter data center in Barcelona"
      arrendado a AtlasEdge hasta agosto de 2033, con imágenes que corresponden a
      la antigua instalación de Colt DCS en Carrer de l'Acer 5.

superficie_construida_m2: 2160

refrigeracion: >-
  La ficha técnica de Colt (2019) describía densidades de 1.000 W/m² en la sala
  Acero 1 y 1.500 W/m² en Acero 2, UPS N+N y generadores N+1 por sala.

incertidumbres:
  - campo: potencia
    descripcion: >-
      La ficha técnica de Colt de 2019 anunciaba "Powered by 6MVA" / "Total power
      provision of 6MVA". Es potencia aparente (MVA), no MW, y no se convierte.
      Además es un dato de 2019 anterior a los cambios de propiedad. La ficha
      posterior de AtlasEdge para el mismo edificio (BCN001) rebaja esa cifra a
      "Powered by 4.8 MVA". En total hay cuatro lecturas distintas del mismo
      inmueble —4 MW, 8 MW, 6 MW y 4,8/6 MVA— y ninguna fuente explica la
      diferencia.
    fuentes: [src-2, src-4, src-5, src-6, src-7]
  - campo: superficie_construida_m2
    descripcion: >-
      Baxtel y la ficha de Colt dan 2.160 m² de superficie construida; Templus
      publica 2.100 m² de «Superficie IT»; la operación de Principal Real Estate
      habla de un edificio de 10.500 m². No se ha determinado si describen
      perímetros distintos del mismo inmueble.
    fuentes: [src-2, src-5, src-6]
  - campo: propietario
    descripcion: >-
      La ficha registra a Templus como propietario. El inmueble fue comprado en
      2022 por el Principal European Data Centre Fund I y arrendado al operador;
      un portavoz de AtlasEdge precisó entonces que la venta la hizo el
      arrendador anterior y no AtlasEdge. No se ha localizado documento posterior
      que aclare si Templus adquirió el edificio o solo el negocio y el
      arrendamiento.
    fuentes: [src-3, src-6]
  - campo: operador
    descripcion: >-
      Baxtel todavía lista el activo como AtlasEdge; la venta a Templus se cerró
      en diciembre de 2025 y el campus se presentó en mayo de 2026.
    fuentes: [src-2, src-3]

