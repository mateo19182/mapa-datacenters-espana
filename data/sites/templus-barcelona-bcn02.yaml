estado: operativo
estado_detalle: >-
  Edificio en servicio desde 2001 como "Barcelona Steel" (salas Acero 1 y Acero
  2), explotado por Colt Data Centre Services y después por AtlasEdge. En
  diciembre de 2025 AtlasEdge vendió nueve centros europeos a Templus, incluido
  este. Desde mayo de 2026 se comercializa junto a BCN01 como campus de 10 MW. El
  inmueble fue adquirido en agosto de 2022 por el Principal European Data Centre
  Fund I por 22,6 millones de euros, con arrendamiento a AtlasEdge hasta agosto
  de 2033.
estado_fuentes: [src-2, src-3, src-5, src-6]
fecha_puesta_en_servicio: "2001"

