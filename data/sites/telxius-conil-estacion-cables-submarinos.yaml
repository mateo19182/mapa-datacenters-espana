estado: operativo
estado_detalle: >-
  Estación de amarre de cables submarinos alojada en un búnker de hormigón armado de la guerra fría
  construido en los años sesenta y enterrado a unos 15 metros. Opera como estación de aterraje desde
  los años setenta («CONIL CS») y alberga además un Centro de Operaciones de Red de Telxius desde el
  que se supervisan las estaciones de amarre de Estepona, Canarias, Palma de Mallorca, norte de
  África y los servicios de Telxius en América. NO es un centro de datos de colocation: es una
  estación de aterraje con sala técnica y NOC.
estado_fuentes: [src-1, src-2]

conexion_electrica:
  fuentes: []

enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta potencia eléctrica de la instalación en ninguna fuente abierta consultada.
      Campo potencia omitido.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      Las fuentes sitúan la estación cerca del paraje de Los Burreño y de las playas de El Roqueo y
      Fuente del Gallo, pero no publican dirección ni parcela. Coordenadas de municipio.
    fuentes: [src-2]
  - campo: operador
    descripcion: >-
      El blog de Canal Sur atribuye la instalación a Telefónica; el Ayuntamiento de Conil describe
      el Centro de Operaciones de Red como de Telxius, filial de Telefónica. Se registran ambos.
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      Inclusión discutible en un inventario de centros de datos: es infraestructura de aterraje y
      supervisión de cable submarino, no un CPD comercial. Se incluye por su papel de puerta de
      entrada de tráfico hacia África y América.
    fuentes: [src-1, src-2, src-3]

