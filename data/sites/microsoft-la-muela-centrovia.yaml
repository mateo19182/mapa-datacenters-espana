    fecha_consulta: "2026-08-29"
    cita: "El centro más importante será el de La Muela, a 23 kilómetros de Zaragoza, con 146 hectáreas, la mitad de toda la infraestructura, y se ha previsto un consumo eléctrico máximo anual de unos 3.700 GWh/año."
