id: microsoft-la-muela-centrovia
nombre: "Microsoft Región Aragón — Campus La Muela (Centrovía)"
alias:
  - "Nuevo Campus de Centros de Datos Microsoft La Muela"
  - "PIGA Región MSFT — ámbito La Muela"
tipo: campus
operador: "Microsoft"
propietario: "Microsoft 7724 Spain, S.L.U."
modelo: hyperscale

ubicacion:
  municipio: "La Muela"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Sector urbanizable Fase 5 del polígono Centrovía (SUZ PCV-F5), PGOU de La Muela"
  lat: 41.580833
  lon: -1.116111
  precision: municipio
  fuentes: [src-1, src-4]

estado: en_tramitacion
estado_detalle: >-
  Declarado inversión de interés autonómico con interés general de Aragón el 20 de diciembre de
  2023. El Plan de Interés General de Aragón "Implantación de la Región Microsoft en Aragón" se
  aprobó inicialmente por Orden FOM/1520/2025, de 14 de noviembre, y se modificó por Orden
  VFL/1111/2026, de 24 de julio, para incorporar el estudio de impacto ambiental de los proyectos de
  urbanización, sometido a nueva información pública. El expediente se remitió a INAGA el 24 de
  febrero de 2026. La documentación de urbanización de julio 2026 describe seis edificios de 57,6 MW
  y 345,6 MW por emplazamiento, sin tipificar. El procedimiento sigue siendo de aprobación inicial e
  información pública; no se ha localizado autorización ambiental definitiva ni inicio de obra del
  CPD. La Orden VFL/1410/2026, de 28 de septiembre, vuelve a modificar la aprobación inicial para
  incorporar el EsIA de urbanización de La Muela.
estado_fuentes: [ src-1, src-2, src-esia-urbanizacion-202607, src-piga-actual-20261017 ]

potencia:
  - tipo: conexion_red
    valor_mw: 50
    ambito: campus
    referencia: "Potencia de acceso a red asegurada para la primera fase"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-11-19"
    fuentes: [src-3]
    nota: >-
      Dato de prensa: "Microsoft solo dispone de la energía autorizada para esa primera
      fase, con 50 MW en cada ubicación". No confirmado por fuente oficial.
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: Objetivo histórico de segunda fase publicado en prensa en noviembre 2025
    estado_asociado: anunciado
    fecha_dato: "2025-11-19"
    fuentes: [src-3]
    nota: La prensa indica que "el resto, hasta 300 MW por planta, está previsto para una segunda fase"
      y que la compañía ha solicitado al Ministerio conexión para otros 300 MW. No se precisa si es
      carga TI o potencia de acceso. La documentación ambiental de urbanización de julio 2026
      publica posteriormente 345,6 MW sin tipificar; no son cifras adicionales.
  - tipo: no_especificado
    valor_mw: 345.6
    ambito: campus
    referencia: Capacidad prevista del emplazamiento en el EsIA de urbanización
    estado_asociado: en_tramitacion
    fecha_dato: 2026-07
    fuentes:
      - src-esia-urbanizacion-202607
    nota: PDF, página 53. Seis edificios de 57,6 MW. El párrafo no etiqueta los MW como carga IT,
      potencia total o permiso de acceso; no se asigna una tipificación por analogía ni se considera
      capacidad construida.

fases:
  - nombre: "Fase 1"
    estado: en_tramitacion
    fuentes: [src-3]
    nota: "La prensa sitúa el inicio de obras en 2026 y la puesta en marcha de la primera fase en 2030."

conexion_electrica:
  subestacion: Suministro del campus proyectado mediante línea independiente de 220 kV; red auxiliar
    de urbanización desde Centrovía 132/15 kV
  tension_kv: 220
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  fuentes:
    - src-1
    - src-5
    - src-esia-urbanizacion-202607
  nota: El PIGA prevé una conexión de infraestructura eléctrica exterior de alta tensión subterránea
    con dos líneas de 8.420 m y 8.355 m que discurren por los términos municipales de La Muela y
    Zaragoza. Según la prensa, cada campus tendrá subestación propia a 132 kV, con actualización a
    220 kV en una segunda fase que requerirá modificar el PIGA, y dos conexiones a la subestación de
    Plaza. El EsIA de urbanización de julio 2026 aclara que la parcela EI-TIC del campus se
    suministrará mediante una línea 220 kV independiente, fuera del alcance del documento y con Es
    IA propio. La alimentación de urbanización desde Centrovía 132/15 kV no es la potencia de acceso
    del CPD.

superficie_parcela_m2: 1461200
inversion_anunciada_eur: 2179843352
refrigeracion: >-
  Refrigeración líquida recirculada en circuito cerrado, sin torres de evaporación.

agua:
  circuito: cerrado
  sistema: >-
    Refrigeración líquida recirculada en circuito cerrado que enfría directamente los chips.
    Según la compañía, no depende de torres de evaporación ni de aportes continuos de agua:
    "una vez que el sistema se llena durante la construcción, el agua circula de manera
    continua entre los servidores y los equipos de refrigeración sin necesidad de suministro
    adicional". El agua de lluvia de las cubiertas se recoge para usos no potables.
  origen: null
  nota: La documentación del PIGA cifra en 3.975 m³/año la demanda industrial a plena capacidad a
    partir del segundo año de operación y en 27.717 m³ el llenado inicial del circuito el primer
    año, pero lo hace para los TRES campus de Microsoft en Aragón conjuntamente. No se registra
    consumo por emplazamiento porque repartir esa cifra exigiría una clave de reparto que no consta.
    El Acuerdo de declaración de interés autonómico recoge además el compromiso corporativo de
    "Impacto positivo en Agua (Water positive)" para 2030. El EsIA de urbanización localizado en
    octubre 2026 no permite interpretar el riego de viarios o el consumo de obra como consumo
    operativo del CPD.
  fuentes:
    - src-6
    - src-esia-urbanizacion-202607

energia:
  - consumo_gwh_ano: 3700
    referencia: "Consumo eléctrico máximo anual previsto para el campus de La Muela"
    fecha_dato: "2025-11-19"
    fuentes: [src-5]
    nota: >-
      Cifra de la documentación del PIGA conocida a través de prensa. Es un máximo, no una
      previsión central. Sumada a las de Villamayor de Gállego (3.777 GWh/año) y Zaragoza
      (3.100 GWh/año), la misma fuente da más de 10.500 GWh/año para los tres campus.

empleo:
  - tipo: construccion
    valor: 2000
    referencia: "Extremo superior de la horquilla de trabajadores necesarios para completar el desarrollo del campus (entre 1.000 y 2.000, con una media anual aproximada de 300-400)"
    fecha_dato: "2024-01-09"
    fuentes: [src-7]
    nota: >-
      La memoria da una horquilla de 1.000 a 2.000 trabajadores; se registra el extremo
      superior y se advierte del rango en lugar de promediarlo. La media anual estimada es de
      300 a 400 empleos.
  - tipo: directo
    valor: 300
    referencia: "Empleos fijos previstos en la fase operativa del campus"
    fecha_dato: "2024-01-09"
    fuentes: [src-7]
    nota: "La memoria dice «hasta 300», es decir, un techo, no una previsión central."
enlaces_proyecto:
  - "https://www.aragon.es/-/piga-microsoft"
  - "https://www.aragon.es/-/microsoft-eia"

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      La cifra registrada es la suma de los dos conceptos que el PIGA desglosa para La Muela
      (2.129.170.173,12 € de obras en el campus y 50.673.179,56 € de urbanización e
      infraestructuras exteriores). La prensa cita 2.179 millones para La Muela.
    fuentes: [src-1]
  - campo: potencia
    descripcion: El EsIA de urbanización de julio 2026 publica 345,6 MW previstos, sin tipificación.
      Sustituye como objetivo documental más reciente a los 300 MW de prensa de 2025. Los 50 MW de
      acceso de la primera fase siguen siendo una afirmación de prensa, sin resolución de acceso
      contrastada.
    fuentes:
      - src-1
      - src-3
      - src-5
      - src-esia-urbanizacion-202607
  - campo: agua
    descripcion: Se ha localizado y leído el EsIA de urbanización de este campus. Describe redes y
      consumos de obra o zonas verdes; no publica un consumo operativo integral del CPD que permita
      repartir los 3.975 m³/año industriales y 27.717 m³ de llenado inicial citados por la prensa
      para los tres campus. No se asigna una fracción a este emplazamiento.
    fuentes:
      - src-6
      - src-esia-urbanizacion-202607
  - campo: ubicacion
    descripcion: >-
      Las coordenadas registradas son el centroide municipal de La Muela (Wikidata), no la
      posición del sector Centrovía Fase 5.
    fuentes: [src-4]
  - campo: energia
    descripcion: Las cifras anuales de energía proceden de prensa que cita el PIGA. El EsIA localizado
      corresponde a urbanización exterior y no concilia esos consumos con la capacidad del CPD. Al
      no estar tipificados los MW, no se deduce una potencia media ni se afirma una imposibilidad
      física entre ámbitos que pueden ser distintos.
    fuentes:
      - src-5
      - src-3
      - src-piga-hoyaragon
      - src-esia-urbanizacion-202607

