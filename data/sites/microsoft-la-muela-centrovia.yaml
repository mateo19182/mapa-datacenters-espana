    fecha_publicacion: "2025-11-14"
    fecha_consulta: "2026-08-31"
    cita: "La compañía asegura que sus tres campus de infraestructuras tecnológicas, que se levantarán en La Muela, Villamayor de Gállego y Zaragoza, funcionarán con un sistema de refrigeración líquida en circuito cerrado [...] La demanda industrial de sus instalaciones a plena capacidad a partir del segundo año de operación será de 3.975 metros cúbicos [...] El único momento en el que se requiere una cantidad significativa de agua es el inicial. En concreto, 27.717 m³ el primer año, destinados exclusivamente al llenado del circuito cerrado, según la información facilitada desde la empresa."
  - id: src-7
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1311667640606"
    titulo: "ORDEN EEI/1979/2023, de 28 de diciembre, por la que se da publicidad al Acuerdo de 20 de diciembre de 2023, del Gobierno de Aragón, por el que se declara como inversión de interés autonómico con interés general el proyecto «Nuevo Campus de Centros de Datos Microsoft» en la Fase 5 del Polígono «Centro Vía» del término municipal de La Muela (Zaragoza) — empleo"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2024-01-09"
    fecha_consulta: "2026-08-31"
    cita: "Durante la fase de construcción, además de los futuros empleos directos creados, estimamos que se necesitarán entre 1.000 y 2.000 trabajadores (una media anual aproximada de 300-400 empleos) para completar el desarrollo del Campus en su totalidad. La construcción de la totalidad del campus requerirá aproximadamente unos 12 millones de horas trabajadas. [...] Una vez concluida la fase de construcción, se espera poder generar hasta 300 empleos fijos en la fase operativa del Campus."
