  municipio: "Barbate"
  provincia: "Cádiz"
  ccaa: "Andalucía"
  direccion: "Zahara de los Atunes, Barbate"
  lat: 36.1370
  lon: -5.8470
  precision: aproximada
  fuentes: [src-1, src-2]

estado: desconocido
estado_detalle: >-
  Zahara figura como punto de aterraje español del sistema de cable submarino Medusa, junto a
  Manilva y Barcelona. El operador informa de que el despliegue de los aterrajes pendientes continúa
  a lo largo de 2026, pero no publica el estado concreto de la estación de Zahara. Es un punto de
  aterraje de cable submarino, no un centro de datos de colocation.
estado_fuentes: [src-1]

enlaces_proyecto:
  - "https://medusascs.com/"

incertidumbres:
  - campo: estado
    descripcion: >-
      No hay fuente que confirme si la estación de aterraje de Zahara está construida, en obras o
      solo prevista. Se deja como desconocido.
    fuentes: [src-1]
  - campo: potencia
    descripcion: "No consta potencia eléctrica. Campo omitido."
    fuentes: [src-1]
  - campo: ubicacion
    descripcion: >-
      Medusa cita el aterraje como «Zahara»; prensa regional y Xataka Móvil lo asocian a Zahara de
      los Atunes, núcleo del término municipal de Barbate. Algunas fuentes lo llaman «Atlanterra».
      No hay dirección ni parcela publicadas.
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      Inclusión discutible en un inventario de centros de datos: es un punto de aterraje de cable
      submarino. Se incluye por su papel en la conectividad Europa–África.
    fuentes: [src-1, src-2]

confianza: baja
ultima_verificacion: "2026-08-29"

