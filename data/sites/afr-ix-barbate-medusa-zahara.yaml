estado: desconocido
estado_detalle: >-
  Zahara figura como punto de aterraje español del sistema de cable submarino Medusa, junto a
  Manilva y Barcelona. El primer aterrizaje del sistema fue el de Marsella, en octubre de 2025, y el
  operador situó el despliegue de los aterrajes restantes «a lo largo de 2026»; la primera fase en
  servicio (Marsella, Bizerta y Nador) no incluye Zahara. El directorio GeoCables da el sistema por
  disponible para servicio en 2026. No se publica el estado concreto de la estación de Zahara. Es un
  punto de aterraje de cable submarino, no un centro de datos de colocation.
estado_fuentes: [src-1, src-3, src-4]

enlaces_proyecto:
  - "https://medusascs.com/"

incertidumbres:
  - campo: estado
    descripcion: >-
      No hay fuente que confirme si la estación de aterraje de Zahara está construida, en obras o
      solo prevista. Lo único acreditado es que en octubre de 2025 aún no había aterrizado el cable
      —el primer aterrizaje fue Marsella— y que el despliegue restante se anunció para 2026. Se deja
      como desconocido.
    fuentes: [src-1, src-3, src-4]
  - campo: potencia
    descripcion: "No consta potencia eléctrica. Campo omitido."
    fuentes: [src-1]
  - campo: ubicacion
    descripcion: >-
      Medusa cita el aterraje como «Zahara»; prensa regional y Xataka Móvil lo asocian a Zahara de
      los Atunes, núcleo del término municipal de Barbate. Algunas fuentes lo llaman «Atlanterra».
      No hay dirección ni parcela publicadas.
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      Inclusión discutible en un inventario de centros de datos: es un punto de aterraje de cable
      submarino. Se incluye por su papel en la conectividad Europa–África.
    fuentes: [src-1, src-2]

confianza: baja
ultima_verificacion: "2026-08-31"

