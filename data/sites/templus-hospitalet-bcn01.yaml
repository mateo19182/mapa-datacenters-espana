id: templus-hospitalet-bcn01
nombre: "Templus BCN01 — L'Hospitalet de Llobregat (ex Cellnex)"
alias:
  - "Templus DC Barcelona BCN01"
  - "Cellnex Barcelona"
tipo: edificio
operador: "Templus Data Centers"
propietario: "Templus Data Centers"
modelo: colocation

ubicacion:
  municipio: "L'Hospitalet de Llobregat"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Carrer de Pablo Iglesias 56, 08908 L'Hospitalet de Llobregat"
  lat: 41.34862
  lon: 2.129779
  precision: aproximada
  fuentes: [ src-1, src-peering-mapa ]

estado: operativo
estado_detalle: >-
  Centro adquirido a Cellnex en febrero de 2025. La nota de Templus del 26 de mayo de 2026 confirma
  la inauguración del campus comercial y 6 MW sin tipificar en este activo, frente a 4 MW en el
  comprado a AtlasEdge. El inventario actual publica 2,25 MW IT para Barcelona 01; su ficha
  individual mantiene 2,5 MW bajo Total power. No se fuerza equivalencia entre ambas magnitudes ni
  con los 6 MW de la nota.
estado_fuentes: [ src-2, src-4, src-5, src-nota-campus, src-inventario-it ]

potencia:
  - tipo: no_especificado
    valor_mw: 1.7
    ambito: edificio
    referencia: "Potencia previa a la ampliación de Templus"
    estado_asociado: operativo
    fecha_dato: "2025-02"
    fuentes: [src-2]
  - tipo: no_especificado
    valor_mw: 6
    ambito: edificio
    referencia: "Potencia tras la ampliación"
    estado_asociado: operativo
    fecha_dato: "2026-05-26"
    fuentes: [ src-2, src-nota-campus ]
    nota: >-
      La nota primaria de Templus del 26 de mayo confirma la ampliación a 6 MW del activo adquirido
      a Cellnex, sin precisar tipo de MW. El inventario actual distingue una cifra IT menor, de otro
      alcance publicado.
  - tipo: no_especificado
    valor_mw: 2.5
    ambito: edificio
    referencia: "«Total power» del edificio según la ficha de producto de Templus"
    estado_asociado: operativo
    fecha_dato: "2026-04-27"
    fuentes: [src-4]
    nota: >-
      La web de Templus publica "Total power 2.5 MW" y "Superficie IT 700 m²"
      para BCN01, cifra muy inferior a los 6 MW que la prensa especializada
      atribuye al centro comprado a Cellnex. Se conservan las dos.
  - tipo: it
    valor_mw: 2.25
    ambito: edificio
    referencia: Potencia IT de Barcelona 01 en el inventario de centros operativos
    estado_asociado: operativo
    fuentes:
      - src-inventario-it
    nota: Cifra expresamente rotulada Potencia IT en el bloque inferior del inventario del operador. La
      misma página conserva otros valores en sus tarjetas Total power. No se equiparan ni se deduce
      un PUE. La página no publica fecha del dato ni fecha de ampliación.

refrigeracion: >-
  Templus declara estándar Tier III, energía 100% renovable y refrigeración
  líquida para cargas de alta densidad en el campus. Para BCN01 describe además
  un sistema de «District Heating & Cooling» y una planta fotovoltaica propia.

agua:
  circuito: sin_agua
  sistema: >-
    Refrigeración líquida para alta densidad que, según el operador, permite
    soportar esas cargas sin consumo de agua; BCN01 emplea además un sistema de
    District Heating & Cooling.
  origen: null
  nota: >-
    La afirmación de «sin consumo de agua» la hace Templus para el conjunto del
    campus, no específicamente para este edificio, y no va acompañada de ninguna
    cifra ni de WUE. El District Heating & Cooling implica un intercambio con una
    red urbana cuyo circuito no se detalla.
  fuentes: [src-4, src-5]

incertidumbres:
  - campo: potencia
    descripcion: >-
      La nota primaria de Templus confirma 6 MW para el activo adquirido a Cellnex y 4 MW para el
      procedente de AtlasEdge, sin usar códigos BCN01/BCN02. La atribución sigue la identidad y
      dirección de cada inmueble; no se reparte el total del campus por proporción.
    fuentes: [ src-2, src-3, src-nota-campus ]
  - campo: ubicacion
    descripcion: >-
      Data Center Market y Data Center Dynamics sitúan los dos edificios del
      campus en L'Hospitalet de Llobregat; Europa Press, Revista Cloud y Diario
      TI lo sitúan en la Zona Franca de Barcelona. PeeringDB da BCN01 en
      L'Hospitalet (08908) y BCN02 en Barcelona (08038).
    fuentes: [src-1, src-2, src-5]
  - campo: potencia
    descripcion: >-
      La propia Templus publica 2,5 MW de Total power para BCN01 y 8 MW para BCN02, mientras su nota
      de mayo distribuye 6 MW y 4 MW entre los activos adquiridos a Cellnex y AtlasEdge. El
      inventario actual añade cifras explícitas de IT distintas. La discrepancia entre las cifras
      sin tipificar sigue abierta; no se deduce cuál de ellas equivale a la carga IT.
    fuentes: [ src-2, src-4, src-nota-campus, src-inventario-it ]
  - campo: potencia
    descripcion: El inventario actual de Templus etiqueta 2,25 MW como potencia IT de este edificio. Sus
      fichas individuales y tarjetas Total power publican otra magnitud; la nota de mayo da un
      reparto de 6 y 4 MW sin tipificar. No se igualan esas lecturas ni se considera que los 7 MW IT
      adicionales de plataforma publicados por Colliers correspondan íntegros a un edificio.
    fuentes:
      - src-inventario-it
      - src-4
      - src-nota-campus
      - src-colliers-20261008
  - campo: ubicacion
    descripcion: El registro nominal de PeeringDB enlaza el pin de Google Maps de este edificio y
      confirma la dirección. Se conserva el punto con precisión aproximada, sin atribuirlo a una
      sala o al conjunto del campus comercial.
    fuentes:
      - src-peering-mapa

