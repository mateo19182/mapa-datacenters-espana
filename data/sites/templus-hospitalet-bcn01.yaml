  direccion: "Carrer de Pablo Iglesias 56, 08908 L'Hospitalet de Llobregat"
  lat: 41.34862
  lon: 2.129779
  precision: exacta
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Comprado por Templus a Cellnex en febrero de 2025 y ampliado de 1,7 a 6 MW.
  El campus formado por BCN01 y BCN02 se inauguró el 26 o 27 de mayo de 2026 con
  presencia de la directora general de Infraestructures Digitals de la
  Generalitat, y se comercializa como una única plataforma de 10 MW. La ficha de
  producto de Templus atribuye a BCN01 700 m² de superficie TI, 2,5 MW de
  potencia total y densidades de 4 a 15 kW por rack.
estado_fuentes: [src-2, src-4, src-5]

potencia:
  - tipo: no_especificado
    valor_mw: 1.7
    ambito: edificio
    referencia: "Potencia previa a la ampliación de Templus"
    estado_asociado: operativo
    fecha_dato: "2025-02"
    fuentes: [src-2]
  - tipo: no_especificado
    valor_mw: 6
    ambito: edificio
    referencia: "Potencia tras la ampliación"
    estado_asociado: operativo
    fecha_dato: "2026-05-28"
    fuentes: [src-2]
    nota: >-
      La fuente dice "cuya potencia se ha ampliado de 1,7 a 6 MW" sin precisar
      tipo de potencia.
  - tipo: no_especificado
    valor_mw: 2.5
    ambito: edificio
    referencia: "«Total power» del edificio según la ficha de producto de Templus"
    estado_asociado: operativo
    fecha_dato: "2026-04-27"
    fuentes: [src-4]
    nota: >-
      La web de Templus publica "Total power 2.5 MW" y "Superficie IT 700 m²"
      para BCN01, cifra muy inferior a los 6 MW que la prensa especializada
      atribuye al centro comprado a Cellnex. Se conservan las dos.

refrigeracion: >-
  Templus declara estándar Tier III, energía 100% renovable y refrigeración
  líquida para cargas de alta densidad en el campus. Para BCN01 describe además
  un sistema de «District Heating & Cooling» y una planta fotovoltaica propia.

agua:
  circuito: sin_agua
  sistema: >-
    Refrigeración líquida para alta densidad que, según el operador, permite
    soportar esas cargas sin consumo de agua; BCN01 emplea además un sistema de
    District Heating & Cooling.
  origen: null
  nota: >-
    La afirmación de «sin consumo de agua» la hace Templus para el conjunto del
    campus, no específicamente para este edificio, y no va acompañada de ninguna
    cifra ni de WUE. El District Heating & Cooling implica un intercambio con una
    red urbana cuyo circuito no se detalla.
  fuentes: [src-4, src-5]

incertidumbres:
  - campo: potencia
    descripcion: >-
      La fuente atribuye 6 MW al "centro comprado a Cellnex" y 4 MW al "adquirido
      a AtlasEdge", pero no nombra los edificios BCN01/BCN02. La asignación aquí
      se apoya en que el activo de AtlasEdge en Barcelona es el antiguo "Colt
      Barcelona / Barcelona Steel" de Carrer de l'Acer, que corresponde a BCN02.
    fuentes: [src-2, src-3]
  - campo: ubicacion
    descripcion: >-
      Data Center Market y Data Center Dynamics sitúan los dos edificios del
      campus en L'Hospitalet de Llobregat; Europa Press, Revista Cloud y Diario
      TI lo sitúan en la Zona Franca de Barcelona. PeeringDB da BCN01 en
      L'Hospitalet (08908) y BCN02 en Barcelona (08038).
    fuentes: [src-1, src-2, src-5]
  - campo: potencia
    descripcion: >-
      Las cifras de la propia Templus (2,5 MW en BCN01 y 8 MW en BCN02, total
      10,5 MW) no cuadran con las de la prensa especializada (6 MW y 4 MW, total
      10 MW), aunque los campus totales sean casi iguales. Podría tratarse de un
      reparto distinto entre los dos edificios o de magnitudes distintas. No se
      ha resuelto.
    fuentes: [src-2, src-4]

