refrigeracion: >-
  Templus declara estándar Tier III, energía 100% renovable y refrigeración
  líquida para cargas de alta densidad en el campus.

incertidumbres:
  - campo: potencia
    descripcion: >-
      La fuente atribuye 6 MW al "centro comprado a Cellnex" y 4 MW al "adquirido
      a AtlasEdge", pero no nombra los edificios BCN01/BCN02. La asignación aquí
      se apoya en que el activo de AtlasEdge en Barcelona es el antiguo "Colt
      Barcelona / Barcelona Steel" de Carrer de l'Acer, que corresponde a BCN02.
    fuentes: [src-2, src-3]
  - campo: ubicacion
    descripcion: >-
      Data Center Market sitúa los dos edificios del campus en L'Hospitalet de
      Llobregat; DCD y otras cabeceras lo sitúan en la Zona Franca de Barcelona.
      PeeringDB da BCN01 en L'Hospitalet (08908) y BCN02 en Barcelona (08038).
    fuentes: [src-1, src-2]

