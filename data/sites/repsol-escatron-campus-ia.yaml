  fuentes: [src-2, src-3, src-osm]

estado: anunciado
estado_detalle: >-
  Repsol registró en diciembre de 2024 la solicitud para desarrollar el proyecto en los
  terrenos colindantes a su central de ciclo combinado de Escatrón, adquirida en 2018. En
  febrero de 2025 Red Eléctrica le otorgó 402 MW de autoconsumo. Repsol ha declarado que no
  será el promotor del centro de datos, sino el socio energético: la instalación la
  desarrollaría un tercero todavía no identificado públicamente. En octubre de 2025 Repsol y
  Forestalia anunciaron la hibridación de la central con quince parques eólicos para dar
  soporte al futuro centro, y en julio de 2026 Repsol comprometió 11,8 millones de euros en la
  infraestructura eléctrica que conectará esos parques con el campus. No hay proyecto
  constructivo, promotor ni calendario publicados.
estado_fuentes: [src-1, src-2, src-3, src-4]

potencia:
  - tipo: conexion_red
    valor_mw: 402
    ambito: campus
    referencia: "Autoconsumo de energía renovable otorgado por Red Eléctrica de España"
    estado_asociado: anunciado
    fecha_dato: "2025-02-20"
    fuentes: [src-1, src-2, src-3]
    nota: >-
      Es la potencia concedida en el punto de conexión bajo régimen de autoconsumo, no la carga
      TI del centro. Las primeras informaciones de enero de 2025 hablaban de «algo más de 400
      MW»; 402 MW es la cifra que da la propia Repsol tras la autorización.
  - tipo: generacion_asociada
    valor_mw: 818
    ambito: campus
    referencia: "Central de ciclo combinado de Repsol en Escatrón, que da soporte al proyecto"
    estado_asociado: operativo
    fecha_dato: "2025-10-16"
    fuentes: [src-1]
    nota: "Capacidad de generar, no de consumir. No es capacidad del centro de datos."
  - tipo: generacion_asociada
    valor_mw: 805
    ambito: campus
    referencia: "Quince parques eólicos adquiridos a Forestalia que se hibridan con la central"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-10-16"
    fuentes: [src-1]
    nota: >-
      Capacidad instalada conjunta de los parques, en tramitación y con DIA favorable. No es
      capacidad del centro de datos.

conexion_electrica:
  subestacion: "Subestación de la central de ciclo combinado de Escatrón"
  tension_kv: null
  titular_red: "Red Eléctrica de España"
  mw_solicitados: 402
  mw_concedidos: 402
  fuentes: [src-1, src-2, src-4]
  nota: >-
    Repsol prevé duplicar la subestación de la que dispone la central para acoger la
    hibridación con las renovables que abastecerán al centro tecnológico, con una inversión de
    11,8 millones de euros anunciada en julio de 2026.

inversion_anunciada_eur: null
enlaces_proyecto: []

incertidumbres:
  - campo: operador
    descripcion: >-
      No hay operador del centro de datos identificado. Repsol dice expresamente que no será el
      promotor principal, sino el socio energético, y que la inversión la haría el tercero que
      entre en el proyecto. Desde febrero de 2025 no se ha publicado quién es ese socio.
    fuentes: [src-2, src-1]
  - campo: potencia
    descripcion: >-
      La única cifra publicada, 402 MW, es potencia de acceso en autoconsumo. No consta ninguna
      cifra de carga TI ni de superficie de sala técnica.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      En Escatrón hay dos proyectos de centro de datos distintos junto a dos centrales de ciclo
      combinado distintas: este, junto al ciclo combinado de 818 MW de Repsol, y el de
      DayOne/IGNIS, junto a la planta «Peaker» de 285 MW (ficha «dayone-escatron-peaker»). No
      son el mismo emplazamiento y sus potencias no se suman.
    fuentes: [src-1, src-5]

confianza: media
