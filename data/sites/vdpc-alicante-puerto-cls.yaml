incertidumbres:
  - campo: estado
    descripcion: >-
      Ninguna fuente declara formalmente cancelado el expediente portuario de la Autoridad
      Portuaria de Alicante; la conclusión se apoya en que elEconomista (29/05/2025) afirma
      que el cable «no se conectará desde Alicante [...] ni desde Valencia», en que el
      diario Información (05/02/2025) da la operación por perdida para la ciudad, y en que
      el BOE de 01/04/2026 recoge la solicitud de concesión de VDPC en el puerto de Sagunto
      y ninguna en el de Alicante.
    fuentes: [src-1, src-2, src-3]

confianza: baja
