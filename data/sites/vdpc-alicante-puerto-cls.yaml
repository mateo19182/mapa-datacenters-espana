    tipo: prensa_general
    fecha_publicacion: "2025-05-29"
    fecha_consulta: "2026-08-29"
    cita: "El proyecto de cable submarino Barracuda que conectará la costa mediterránea española con las grandes autopistas de datos internacionales no se conectará desde Alicante, como se anunció hace varios años, ni desde Valencia."
  - id: src-3
    url: "https://www.informacion.es/economia/2025/02/05/alicante-pierde-tren-cableado-submarino-114023295.html"
    titulo: "Alicante pierde el tren del cableado submarino frente a un estratégico proyecto Valencia-Génova"
    editor: "Información"
    tipo: prensa_general
    fecha_publicacion: "2025-02-05"
    fecha_consulta: "2026-08-31"
    cita: "El anuncio supone que Alicante pierde una oportunidad tecnológica y de empleo, pues la propuesta que se barajó en primera instancia, y a la que se le denominó Alicante CLS, incluía un \"Data Center\" en el puerto alicantino, lo que suponía 200 empleos en la fase inicial de construcción y una posterior plantilla estable de 25 personas."
