    referencia: "Empleos en la fase inicial de construcción del proyecto Alicante CLS (no ejecutado)"
    fecha_dato: "2025-02-05"
    fuentes: [src-3]
    nota: "Cifra de un proyecto abandonado; se conserva como registro de lo que se prometió."
  - tipo: directo
    valor: 25
