estado_detalle: >-
  CPD corporativo de la administración autonómica en un inmueble de dos plantas en
  el recinto del antiguo Hospital Militar de Valladolid. El proyecto, de 9,93
  millones de euros, preveía siete meses de obra y entrada en operación en julio
  de 2015. En enero de 2018 la Junta dio por culminado el traslado de sus centros
  de proceso de datos dispersos a esta sede única, liberando 1.200 metros
  cuadrados de suelo para otros usos e incrementando un 130 % la capacidad de
  computación. En 2023 daba servicio a 2.335 centros —735 administrativos y 1.600
  educativos— y a más de 35.000 empleados públicos, con un archivo digital de 1,9
  petabytes de capacidad inicial y un coste de mantenimiento de 1,5 millones de
  euros al año.
estado_fuentes: [src-dcm, src-esmartcity, src-elespanol]

