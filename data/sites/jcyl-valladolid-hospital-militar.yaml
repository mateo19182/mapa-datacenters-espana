  nota: >-
    La Junta describe "dos subestaciones eléctricas independientes que permiten
    mantener el suministro en caso de que falle" y dos grupos electrógenos con
    autonomía de más de 48 horas prorrogable indefinidamente. No nombra las
    subestaciones ni publica potencia contratada, tensión ni MW.
  fuentes: [src-elespanol]

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta la potencia eléctrica ni la carga TI del centro en ninguna de las
      fuentes consultadas, pese a que varias describen con detalle sus sistemas de
      continuidad eléctrica. Sí consta una reducción de la factura energética de
      940.000 euros anuales frente a los centros dispersos que sustituyó, que es un
      dato de coste y no de potencia.
    fuentes: [src-dcm, src-elespanol, src-esmartcity]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      Las fuentes no coinciden y no se registra fecha. El proyecto de 2014 preveía
      la entrada en operación en julio de 2015; un reportaje de enero de 2018 dice
      que el CPD entró en funcionamiento "dos años" antes, lo que apuntaría a 2016;
      y otra información de 2018 afirma que "ofrece desde 2015 un ahorro de 2,5
      millones anuales". Lo que sí está fechado con precisión es la culminación del
      traslado de los centros dispersos, en enero de 2018.
    fuentes: [src-dcm, src-esmartcity]
  - campo: superficie_construida_m2
    descripcion: >-
      Conviven dos superficies muy próximas y no se sustituye la registrada: la
      descripción del proyecto de 2014 habla de "en torno a 750 metros cuadrados" y
      el reportaje de 2023, ya con el centro en marcha, de "una superficie total
      construida de 760 metros cuadrados en dos plantas" y de "casi 800 metros
      cuadrados" en la entradilla del mismo texto.
    fuentes: [src-dcm, src-elespanol]
  - campo: propietario
    descripcion: >-
      Las fuentes discrepan sobre cuántos centros de proceso de datos se
      consolidaron aquí: esmartcity habla del traslado de "los seis centros de
      procesos de datos" y El Español de "la unión de los cinco que la Junta tenía
      disgregados por diferentes edificios".
    fuentes: [src-esmartcity, src-elespanol]
  - campo: estado
    descripcion: >-
      La fuente más reciente localizada sobre esta instalación es de febrero de
      2023. En septiembre de 2024 la Junta licitó y anunció una remodelación de un
      millón de euros, pero referida al CPD de respaldo, que puede no ser este
      inmueble. No se ha localizado ninguna fuente de 2025 o 2026 que documente la
      situación y la capacidad actuales.
    fuentes: [src-elespanol]

confianza: baja
