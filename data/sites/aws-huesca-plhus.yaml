id: aws-huesca-plhus
nombre: "AWS Región Aragón — Huesca PLHUS (centro existente)"
alias:
  - "Amazon Data Services Spain — Plataforma Logística de Huesca"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "Huesca"
  provincia: "Huesca"
  ccaa: "Aragón"
  direccion: "Ronda de Valdabra, 23, Plataforma Logístico-Industrial de Huesca (PLHUS). La AAI de 2020 lo sitúa en C/ Lienas."
  lat: 42.10389
  lon: -0.452046
  precision: exacta
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Tercero de los centros del primer Proyecto de Interés General de Aragón de Amazon
  (AAI de 27 de julio de 2020). En 2025 se tramitó ante INAGA una evaluación de impacto
  ambiental simplificada por modificación del centro de datos.
estado_fuentes: [src-1, src-2, src-3]
fecha_puesta_en_servicio: "2022-11"

potencia:
  - tipo: termica_respaldo
    valor_mw: 110.4
    ambito: campus
    referencia: "Potencia eléctrica total instalada de los 46 grupos electrógenos diésel de respaldo"
    estado_asociado: operativo
    fecha_dato: "2020-07-27"
    fuentes: [src-1, src-7]
    nota: >-
      Potencia instalada de los generadores de reserva (46 x 2,4 MWe; 294,4 MWt), no carga
      TI ni potencia de conexión a red.

fases:
  - nombre: "Edificio A"
    estado: operativo
    fuentes: [src-1]
  - nombre: "Edificio B"
    estado: operativo
    fuentes: [src-1]

agua:
  circuito: hibrido
  sistema: >-
    Unidades de tratamiento de aire (AHU) sin consumo de agua la mayor parte del año; los
    días de más calor, paneles evaporativos con agua, con recirculación del mayor número de
    ciclos posible.
  origen: "Red municipal de abastecimiento del polígono"
  consumo_m3_ano: 36461
  nota: >-
    36.461 m³/año es el consumo total declarado en la AAI de 2020 (35.000 de climatización,
    1.460 de servicios sanitarios y limpieza y menos de 1 del sistema contra incendios). Es
    la misma cifra que declaran las AAI de Villanueva de Gállego y El Burgo de Ebro del
    mismo día, con el mismo desglose. La modificación no sustancial número 2 del PIGA, de 31
    de julio de 2024, centralizó el tratamiento de agua de los tres centros para mejorar
    hasta un 10 % la eficiencia de uso del agua; en PLHUS Huesca las acometidas de agua
    potable y de aguas residuales industriales se mantuvieron sin cambios.
  fuentes: [src-4, src-6]

energia:
  - consumo_gwh_ano: 739.9
    referencia: "Consumo anual de electricidad de la actividad declarado en la autorización ambiental integrada de 2020"
    fecha_dato: "2020-07-27"
    fuentes: [src-8]
    nota: >-
      La resolución lo publica en MWh: 739.900 MWh/año. Las autorizaciones de los otros dos
      centros del mismo Proyecto de Interés General declaran esta misma cifra.

empleo:
  - tipo: directo
    valor: 60
    referencia: "Plantilla total prevista del centro al completar las fases de implementación (30 por edificio, tres turnos, 24 h, 365 días)"
    fecha_dato: "2020-07-27"
    fuentes: [src-5]
    nota: null

enlaces_proyecto:
  - "https://www.aragon.es/-/proyecto-de-interes-general-de-aragon-sobre-la-implantacion-de-centros-de-datos-en-la-comunidad-autonoma-de-aragon-a-propuesta-de-amazon-data-services-spain"

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      La AAI de 2020 da como dirección "Plataforma Logística de Huesca C/ Lienas"; el
      anuncio de INAGA de 2025 da "Ronda de Valdabra, 23 (PLHUS)". Se conservan ambas.
    fuentes: [src-1, src-2]

confianza: alta
ultima_verificacion: "2026-08-31"

fuentes:
  - id: src-1
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1125625724545"
    titulo: "RESOLUCIÓN de 27 de julio de 2020, del Instituto Aragonés de Gestión Ambiental [...] centro de almacenamiento de datos a ubicar en La Plataforma Logística de Huesca Sur (PLHUS), en el término municipal de Huesca (INAGA 500301/02/2019/12452)"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2020-08-07"
    fecha_consulta: "2026-08-29"
    cita: "ubicado en la Plataforma Logística de Huesca C/ Lienas coordenadas UTM ETRS89, Huso 30, X=710679, Y=4664453, Z=446"
  - id: src-2
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1385126660909"
    titulo: "ANUNCIO del Instituto Aragonés de Gestión Ambiental [...] modificación de centro de datos [...] ubicado en Ronda de Valdabra, 23 (Plataforma Logística Huesca Sur -PLHUS-) (INAGA 500301/01/2025/00120)"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-03-25"
    fecha_consulta: "2026-08-29"
    cita: "proyecto de modificación de centro de datos, ubicado en Ronda de Valdabra, 23 (Plataforma Logística Huesca Sur -PLHUS-), del término municipal de Huesca"
  - id: src-3
    url: "https://aws.amazon.com/blogs/aws/now-open-aws-region-in-spain"
    titulo: "Now Open — AWS Region in Spain"
    editor: "Amazon Web Services"
    tipo: empresa
    fecha_publicacion: "2022-11-15"
    fecha_consulta: "2026-08-29"
    cita: "The AWS Europe (Spain) Region has three Availability Zones (AZ) that you can use to reliably spread your applications across multiple data centers."
  - id: src-4
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1125625724545"
    titulo: "RESOLUCIÓN de 27 de julio de 2020, del Instituto Aragonés de Gestión Ambiental [...] Plataforma Logística de Huesca Sur (PLHUS), Huesca (INAGA 500301/02/2019/12452) — consumo de agua y sistema de climatización"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2020-08-07"
    fecha_consulta: "2026-08-31"
    cita: "Se prevé un consumo de agua total de 36.461 m³/año dividido en 35.000 m³/año para equipos de climatización, 1.460 m³/año para servicios sanitarios y lim pieza y menos de 1 m³/año para los sistemas de protección contra incendios. [...] El abastecimiento de agua se realizará desde la red municipal que abastece al polígono. [...] El sistema de climatización trabaja la mayor parte del año mediante unidades de trata miento de aire (AHU) sin consumo de agua, sin embargo, los días de más calor del año tra baja mediante paneles evaporativos con agua."
  - id: src-5
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1125625724545"
    titulo: "RESOLUCIÓN de 27 de julio de 2020, del Instituto Aragonés de Gestión Ambiental [...] PLHUS, Huesca (INAGA 500301/02/2019/12452) — régimen de funcionamiento y personal"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2020-08-07"
    fecha_consulta: "2026-08-31"
    cita: "El régimen de funcionamiento del centro está previsto que vaya aumentando con el avance de las fases de implementación hasta alcanzar un total de 60 trabajadores (30 por edificio) que se distribuirán en tres turnos de trabajo, durante 24 horas al día y 365 días al año."
  - id: src-6
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1346904080606"
    titulo: "ORDEN FOM/902/2024, de 31 de julio, por la que se aprueba la modificación no sustancial número 2 del Proyecto de Interés General de Aragón para la implantación de tres centros de datos en la Comunidad Autónoma de Aragón promovido por Amazon Data Services Spain, SL"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2024-08-09"
    fecha_consulta: "2026-08-31"
    cita: "Centralizar las instalaciones de gestión del agua de refrigeración en cada uno de los tres emplazamientos de los centros de datos (Villanueva de Gállego, PLHUS Huesca y El Burgo de Ebro) y aumentar la eficiencia y robustez del sistema para lograr una mejora de hasta el 10% en la eficiencia del uso del agua en los tres centros de datos de Amazon en Aragón. [...] En Villanueva de Gállego y PLHUS Huesca, las acometidas de agua potable y de aguas residuales industriales se mantienen sin cambios."
  - id: src-7
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1125625724545"
    titulo: "RESOLUCIÓN de 27 de julio de 2020, del Instituto Aragonés de Gestión Ambiental [...] PLHUS, Huesca (INAGA 500301/02/2019/12452) — grupos electrógenos de reserva"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2020-08-07"
    fecha_consulta: "2026-08-31"
    cita: "Los generadores de reserva son un total de 46 grupos electrógenos, 27 en el edifico A y 19 en el B. Cada generador con tará con una potencia eléctrica de 2,4 MWe siendo capaces de generar 6,4 MWt (energía térmica) cada uno de manera que la potencia eléctrica total instalada es de 110,4 MWe siendo la potencia térmica total aproximada de 294,4 MWt."
  - id: src-8
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1125625724545"
    titulo: "RESOLUCIÓN de 27 de julio de 2020, del Instituto Aragonés de Gestión Ambiental [...] PLHUS, Huesca (INAGA 500301/02/2019/12452) — consumo de electricidad"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2020-08-07"
    fecha_consulta: "2026-08-31"
    cita: "Electricidad. El consumo anual de electricidad para el desarrollo de la actividad es de 739.900 MWh."
