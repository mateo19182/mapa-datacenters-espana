id: go-energy-trigueros-tron
nombre: "Campus TRON — Go Energy, Trigueros (Huelva)"
alias:
  - "Project TRON"
  - "Campus IA Verde hyperscale de Huelva"
tipo: campus
operador: "Go Energy"
propietario: "Go Energy"
modelo: hyperscale

ubicacion:
  municipio: "Trigueros"
  provincia: "Huelva"
  ccaa: "Andalucía"
  direccion: "Finca de ganadería Millares (Los Millares)"
  lat: 37.3855
  lon: -6.8412
  precision: municipio
  fuentes: [src-1, src-2, src-4]

estado: en_tramitacion
estado_detalle: >-
  Proyecto declarado de interés general y carácter supramunicipal. En febrero de 2026 contaba con
  informe de compatibilidad urbanística y estaba en fase de ingeniería, con TSK seleccionada para
  el diseño y la construcción. Inicio de operaciones anunciado para 2028.
estado_fuentes: [src-2, src-4]

potencia:
  - tipo: no_especificado
    valor_mw: 200
    ambito: campus
    referencia: "Capacidad anunciada del campus TRON"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-12-05"
    fuentes: [src-1, src-2, src-3, src-4]
    nota: >-
      Las fuentes dicen «200 MW» sin especificar si es carga TI, potencia de conexión o potencia
      instalada. No se convierte ni se compara con MW IT.
  - tipo: no_especificado
    valor_mw: 133
    ambito: campus
    referencia: "Capacidad atribuida al proyecto por El Conciso"
    estado_asociado: anunciado
    fecha_dato: "2026-01-01"
    fuentes: [src-5]
    nota: "Cifra discrepante respecto a los 200 MW de las demás fuentes. Ver incertidumbres."

conexion_electrica:
  fuentes: []

inversion_anunciada_eur: 1500000000
enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      TSK, pv magazine, El Periódico de la Energía y Huelva24 cifran el campus en 200 MW.
      El Conciso lo cifra en 133 MW. Ninguna fuente especifica el tipo de MW. No resuelto.
    fuentes: [src-1, src-2, src-3, src-4, src-5]
  - campo: ubicacion
    descripcion: >-
      El proyecto se describe unas veces como situado en Trigueros (finca Millares) y otras como
      repartido entre San Juan del Puerto, Trigueros y Gibraleón. Las plantas de hidrógeno
      (100 MW, San Juan del Puerto) y de amoníaco (70 MW, Gibraleón) son instalaciones distintas
      del centro de datos y no se suman a su potencia. Se registra Trigueros como municipio del
      campus por ser el que citan las fuentes que hablan de la finca y de la tramitación urbanística.
    fuentes: [src-1, src-2, src-3, src-4]
  - campo: estado
    descripcion: >-
      Huelva24 sitúa el inicio de la construcción de la primera fase en 2028; TSK, pv magazine y
      El Periódico de la Energía sitúan en 2028 el inicio de operaciones. Contradicción sin resolver.
    fuentes: [src-1, src-2, src-3, src-4]
  - campo: conexion_electrica
    descripcion: >-
      No se ha localizado punto de conexión, subestación ni expediente de acceso a red. Las fuentes
      solo indican que el campus «funcionará exclusivamente con energía renovable» ligada al hub de
      hidrógeno y amoníaco de Go Energy.
    fuentes: [src-2, src-3]

confianza: media
ultima_verificacion: "2026-08-29"

