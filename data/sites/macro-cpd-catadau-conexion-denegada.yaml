    titulo: "Un macro centro de datos busca espacio en Valencia tras tumbarle Red Eléctrica la conexión en Catadau"
    editor: "Valencia Plaza"
    tipo: prensa_general
    fecha_publicacion: "2026-05-05"
    fecha_consulta: "2026-08-29"
    cita: "Un gran centro de datos rastrea suelo y conexión eléctrica en la provincia de Valencia tras tumbar Red Eléctrica su solicitud de conectarse al nudo de Catadau con una petición de potencia de 25 megavatios. La negativa a este proyecto es una de las seis que el operador ha rechazado en tan sólo dos meses por la elevada saturación de la red"
