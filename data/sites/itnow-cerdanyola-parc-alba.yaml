estado: operativo
estado_detalle: >-
  Centro de proceso de datos corporativo del grupo 'la Caixa'/CaixaBank operado
  por ITnow, sociedad constituida en enero de 2012. Baxtel fecha la construcción
  del edificio en 2011 y no registra crecimiento de potencia desde 2022;
  Expansión, en abril de 2014, se refería a él como «el CPD inaugurado en 2012».
  Un reportaje sectorial de 2025 cuenta dos CPD de Silc Inmuebles —la sociedad
  patrimonial de CaixaBank— entre los cuatro en operación del Parc de l'Alba.
estado_fuentes: [src-1, src-4, src-5]
fecha_puesta_en_servicio: "2011"

potencia: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      La potencia no es pública; Baxtel la mantiene tras muro de pago. No se
      registra ningún valor.
    fuentes: [src-1]
  - campo: operador
    descripcion: >-
      Baxtel lista además una instalación "Kyndryl: Barcelona" en el Parc de
      l'Alba (parcela PC10601, códigos ESBARCRD / ES1). Dado que Kyndryl es
      copropietaria de ITnow y ambas fichas se sitúan en el Parc de l'Alba, es
      probable que se refieran al mismo emplazamiento. No se crea un registro
      separado para evitar doble conteo. En contra de esa lectura, el inventario
      de 30Virtual enumera cuatro CPD distintos en operación en el parque
      —T-Systems, Silc Inmuebles 1, Silc Inmuebles 2 y Kyndryl—, lo que
      sugeriría que el de Kyndryl es un cuarto edificio separado de los dos de
      ITnow/Silc. La duda queda abierta.
    fuentes: [src-1, src-3, src-5]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      Baxtel fecha la construcción en 2011 y la ficha registra esa fecha;
      Expansión habla del «CPD inaugurado en 2012». Se conservan ambas.
    fuentes: [src-1, src-4]
  - campo: ubicacion
    descripcion: >-
      Un directorio de colocation da un número de portal concreto, «Carrer de
      Creu Casas i Sicart, 85, 08290 Cerdanyola del Vallès», que no se ha podido
      contrastar con fuente primaria. Las coordenadas registradas siguen siendo
      de vial.
    fuentes: [src-2, src-6]
  - campo: ubicacion
    descripcion: >-
      Coordenadas obtenidas por geocodificación de la calle, no del número.
    fuentes: [src-2]

confianza: baja
