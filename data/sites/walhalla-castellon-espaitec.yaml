id: walhalla-castellon-espaitec
nombre: "Walhalla Cloud — Castelló de la Plana (Espaitec, UJI)"
alias:
  - "Walhalla Data Center"
tipo: edificio
operador: "Walhalla Cloud"
propietario: "Walhalla Cloud"
modelo: colocation

ubicacion:
  municipio: "Castelló de la Plana / Castellón de la Plana"
  provincia: "Castellón"
  ccaa: "Comunitat Valenciana"
  direccion: "Parque científico, tecnológico y empresarial Espaitec, Universitat Jaume I"
  lat: 39.9943
  lon: -0.0714
  precision: aproximada
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Data center certificado Tier IV por el Uptime Institute, en servicio desde
  aproximadamente 2011. En 2022 se activó una sala adicional de 300 kW (ampliable a
  600 kW). En julio de 2023 la ocupación declarada era del 60 %. Entre mayo y junio de 2026
  el operador ejecutó una ampliación de sus sistemas de emergencia —nuevos grupos
  electrógenos y mayor capacidad de depósitos de combustible en superficie— para alcanzar
  72 horas de autonomía sin recarga externa, frente al mínimo de 12 horas que exige el
  Uptime Institute, manteniendo la certificación Tier IV y el ENS de nivel Alto.
estado_fuentes: [src-1, src-2, src-4]

potencia:
  - tipo: no_especificado
    valor_mw: 2
    ambito: edificio
    referencia: "Potencia del data center"
    estado_asociado: operativo
    fecha_dato: "2023-07-17"
    fuentes: [src-1, src-3]
    nota: "DCD: «Este data center cuenta con hasta 2MW de potencia», sin especificar tipo."

fases:
  - nombre: "Sala adicional activada en 2022"
    estado: operativo
    fecha_puesta_en_servicio: "2022"
    fuentes: [src-1]

refrigeracion: >-
  PUE declarado 1,15; free-cooling durante unas 6.000 h al año; encapsulamiento del aire
  caliente dentro del propio rack, sin suelo técnico.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Los 2 MW proceden de un reportaje de julio de 2023; no se ha localizado dato
      posterior ni desglose entre carga TI y potencia contratada. La sala añadida en 2022
      se describe como «de 300kW (que podría llegar a los 600kW)», sin aclarar si está
      incluida en los 2 MW. La cobertura de la ampliación de grupos electrógenos de 2026 no
      publica ni la potencia de los nuevos grupos ni el volumen de combustible almacenado.
    fuentes: [src-1, src-4]

confianza: media
ultima_verificacion: "2026-08-31"

