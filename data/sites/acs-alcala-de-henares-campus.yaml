id: acs-alcala-de-henares-campus
nombre: "Alcalá Data Center Campus — ACS Digital & Energy"
alias:
  - "ACS Alcalá Data Center Campus"
  - "Iridium / Arcano Alcalá de Henares"
tipo: campus
operador: "ACS Digital & Energy"
propietario: "Grupo ACS (a través de Iridium) y Arcano Partners"
modelo: mayorista

ubicacion:
  municipio: "Alcalá de Henares"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Polígono Industrial El Encín, A-2, parcela 29T, 28805 Alcalá de Henares"
  lat: 40.506628
  lon: -3.32168
  precision: aproximada
  fuentes: [src-3, src-4]

estado: en_construccion
estado_detalle: >-
  Suelo adquirido en noviembre de 2023 por Grupo ACS a través de Iridium y Arcano, con 6,7
  hectáreas y 50 MW de suministro eléctrico garantizado. Dragados figura como constructor del
  campus, concebido para superar los 100 MW IT con desarrollo por fases.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: it
    valor_mw: 100
    ambito: campus
    referencia: "Capacidad total objetivo del campus"
    estado_asociado: anunciado
    fecha_dato: "2026-08-29"
    fuentes: [src-2]
    nota: "\"concebido para alcanzar una capacidad total superior a 100 MW IT\"."
  - tipo: conexion_red
    valor_mw: 50
    ambito: campus
    referencia: "Suministro eléctrico garantizado en la parcela adquirida"
    estado_asociado: permisos_concedidos
    fecha_dato: "2023-11-15"
    fuentes: [src-1]
    nota: "\"6,7 hectares of land and 50MW of guaranteed energy supply\"."

superficie_parcela_m2: 67160
inversion_anunciada_eur: null

incertidumbres:
  - campo: estado
    descripcion: >-
      ACS anunció en 2023 que el centro entraría en operación en 2025 y que el proyecto se
      desarrollaría a lo largo de cinco años. No se ha localizado confirmación pública de la
      puesta en servicio ni del grado de avance a 2026.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      Coexisten dos magnitudes de naturaleza distinta y no comparables: 50 MW de suministro
      garantizado en la compra del suelo y más de 100 MW IT como capacidad objetivo del campus.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      Ni ACS ni Dragados ni el asesor de la venta publican la dirección: hablan del «corredor del
      Henares» y de un «complejo de campus MAD1». La dirección registrada, polígono industrial El
      Encín, parcela 29T junto a la A-2, procede de dos directorios sectoriales que pueden
      compartir origen, así que no está confirmada por el promotor. Las coordenadas son el
      centroide del polígono industrial, no de la parcela.
    fuentes: [src-2, src-3, src-4, src-5]

confianza: media
