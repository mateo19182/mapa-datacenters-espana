    referencia: "Capacidad del centro adquirido a Banc Sabadell"
    estado_asociado: parcialmente_operativo
    fecha_dato: "2026-02-15"
    fuentes: [src-1, src-2]
    nota: "Las fuentes dicen «un centro de datos de 10 MW» sin precisar el tipo de MW."

incertidumbres:
  - campo: nombre
    descripcion: >-
      El directorio del Observatorio EDC identifica este emplazamiento como «Oxigen ODC2 — Sant
      Fruitós de Bages, 8 MW». Las fuentes de la propia compañía y la prensa sitúan ODC2 en el
      distrito 22@ de Barcelona y describen el de Sant Fruitós como el tercer centro del operador,
      con 10 MW. No se adopta aquí el código ODC2 ni la cifra de 8 MW.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      El anuncio de febrero hablaba de completar la puesta en producción en el primer semestre.
      En abril el consejero delegado describió dos fases, la primera prevista para junio, y
      situó los 20 MW conjuntos al cierre de 2026. El agregado comercial no acredita entrega
      completa de los 10 MW de Sant Fruitós y no hay confirmación posterior de ambas fases.
    fuentes: [src-1, src-2, src-3, src-oneconomia-20260407]
  - campo: ubicacion
    descripcion: "No consta dirección ni parcela; solo el municipio."
    fuentes: [src-1, src-2]

confianza: media
