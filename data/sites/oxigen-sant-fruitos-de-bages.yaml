estado: parcialmente_operativo
estado_detalle: >-
  Centro de datos comprado por Oxigen DC a Banc Sabadell y anunciado en febrero de 2026. La
  compañía declaró inicialmente que completaría la puesta en producción en el primer semestre
  de 2026. En abril su consejero delegado situó una primera fase en junio y la capacidad conjunta
  de 20 MW a finales de 2026. No se ha localizado confirmación del cierre de ambas fases.
estado_fuentes: [src-1, src-2, src-3, src-oneconomia-20260407]

