estado: parcialmente_operativo
estado_detalle: >-
  Centro de datos comprado por Oxigen DC a Banc Sabadell y anunciado en febrero de 2026. La
  compañía declaró que la puesta en producción se completaría durante el primer semestre de 2026 y
  que la operación duplicaba su capacidad operativa hasta los 20 MW. No se ha localizado
  confirmación posterior de que la puesta en producción esté terminada.
