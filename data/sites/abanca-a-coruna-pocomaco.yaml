id: abanca-a-coruna-pocomaco
nombre: "ABANCA — centro de proceso de datos de Pocomaco (A Coruña)"
alias:
  - "CPD principal de ABANCA"
tipo: edificio
operador: "ABANCA"
propietario: "ABANCA"
modelo: corporativo

ubicacion:
  municipio: "A Coruña"
  provincia: "A Coruña"
  ccaa: "Galicia"
  direccion: "Polígono de POCOMACO, A Coruña"
  lat: 43.3430
  lon: -8.4120
  precision: aproximada
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Edificio que aloja el principal centro de proceso de datos de ABANCA. En abril de
  2026 el banco completó una transformación integral del inmueble (1.600 m²) en algo
  más de seis meses y sin interrumpir el servicio, elevando su capacidad un 20% hasta
  140 puestos de trabajo destinados a Operaciones TI y Ciberseguridad. La reforma
  documentada afecta a las áreas de trabajo del edificio, no a las salas técnicas. El
  CPD da servicio a más de 250.000 dispositivos en España, Portugal y otros nueve
  países, y ABANCA opera un segundo CPD en su sede de A Coruña que funciona en
  paralelo y replica cada operación.
estado_fuentes: [src-1, src-2, src-3]

superficie_construida_m2: 1600

enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      ABANCA no publica potencia, superficie de sala técnica ni número de racks del
      CPD, ni en su nota de prensa ni en la cobertura especializada de la reforma de
      2026. Campo potencia omitido.
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      Los 140 puestos de trabajo son capacidad de plazas de oficina en el edificio
      tras la reforma, no una cifra de empleo del centro de datos. Por eso no se
      registran en el campo empleo.
    fuentes: [src-1, src-2]
  - campo: superficie_construida_m2
    descripcion: >-
      Los 1.600 m² son la superficie objeto de la reforma, no necesariamente la
      superficie total del edificio ni la del CPD.
    fuentes: [src-1]
  - campo: tipo
    descripcion: >-
      Es un CPD corporativo bancario, no una instalación comercializada. Se incluye
      por ser la principal infraestructura de datos privada documentada en A Coruña.
    fuentes: [src-1]

confianza: baja
ultima_verificacion: "2026-08-31"

