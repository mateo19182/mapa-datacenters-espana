estado_detalle: >-
  Edificio que aloja el principal centro de proceso de datos de ABANCA. En abril de
  2026 el banco completó una transformación integral del inmueble (1.600 m²) en algo
  más de seis meses, elevando su capacidad un 20% hasta 140 puestos de trabajo. La
  reforma documentada afecta a las áreas de trabajo del edificio, no a las salas técnicas.
