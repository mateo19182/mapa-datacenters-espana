estado_detalle: >-
  Acuerdo entre Solaria y la japonesa Data Section anunciado en septiembre de
  2024 para reutilizar las antiguas salas blancas de Solaria en Puertollano. No
  se ha localizado documentación posterior que confirme el inicio de obras ni la
  puesta en servicio.
