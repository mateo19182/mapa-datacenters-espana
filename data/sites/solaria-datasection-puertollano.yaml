id: solaria-datasection-puertollano
nombre: "Centro de datos de Solaria - Puertollano, La Nava II"
alias:
  - "Data center de IA de Puertollano"
  - "Solaria Data Center Puertollano"
  - Centro de datos de IA de Solaria y Data Section — Puertollano
tipo: edificio
operador: null
propietario: "Solaria Energía y Medio Ambiente"
modelo: hyperscale

ubicacion:
  municipio: "Puertollano"
  provincia: "Ciudad Real"
  ccaa: "Castilla-La Mancha"
  direccion: "Instalaciones industriales de Solaria en el polígono La Nava — antiguas salas blancas de
    fabricación de células fotovoltaicas"
  lat: 38.6852161
  lon: -4.1111749
  precision: municipio
  fuentes: [src-eldiario, src-solaria, src-osm]

estado: en_tramitacion
estado_detalle: >-
  El acuerdo con Datasection de septiembre de 2024 para reutilizar las salas blancas quedó
  paralizado según la información de enero de 2026. El Ayuntamiento anunció el 21 de septiembre de
  2026 una nueva propuesta de Solaria en sus instalaciones de La Nava y el Pleno manifestó por
  unanimidad su conformidad el 24 de septiembre al proyecto de 40 MW en La Nava II. La nota
  municipal cita una superficie aproximada de 41.456 m², una inversión de 150 millones de euros y 90
  empleos directos durante la operación. El anuncio previo situaba el posible inicio de actividad a
  finales de 2027 y mencionaba una segunda fase de 100 MW. La conformidad municipal no acredita por
  sí sola autorización ambiental integrada concedida ni inicio de obras. No consta el operador de
  esta nueva propuesta ni un contrato con Alibaba.
estado_fuentes: [src-eldiario, src-solaria, src-ser, src-ayto-20260921, src-ayto-20260924]

potencia:
  - tipo: no_especificado
    valor_mw: 200
    ambito: edificio
    referencia: "Suministro máximo previsto en el acuerdo con Datasection"
    estado_asociado: paralizado
    fecha_dato: "2024-09-17"
    fuentes: [src-solaria]
    nota: >-
      La nota de la propia Solaria dice "El acuerdo prevé la consecución de un suministro de hasta
      200 MW de energía". Es un suministro comprometido por el propio generador, no un permiso de
      acceso a la red ni una carga TI declarada, así que no se tipifica.
  - tipo: no_especificado
    valor_mw: 40
    ambito: edificio
    referencia: "Potencia de la primera fase, que ocuparía la totalidad de las salas blancas"
    estado_asociado: paralizado
    fecha_dato: "2024-09"
    fuentes: [src-solaria, src-eldiario]
    nota: >-
      Solaria dice "En una primera fase contará con 40 MW de potencia y ocupará la totalidad de la
      superficie de las salas blancas". La declaración pública recogida por elDiario.es habla en
      cambio de "más de 40 megavatios de potencia" para el conjunto del centro. Se registra como
      lectura rival de los 200 MW, no como una fase que se sume a ellos.
  - tipo: no_especificado
    valor_mw: 40
    ambito: edificio
    referencia: Nueva propuesta de Solaria de septiembre de 2026, primera fase
    estado_asociado: en_tramitacion
    fecha_dato: 2026-09-24
    fuentes:
      - src-ayto-20260924
    nota: El Ayuntamiento no distingue MW IT, conexión o potencia instalada. No se suma a los 40 y 200
      MW del acuerdo de 2024 ni a la ampliación de 100 MW anunciada sin aclarar si es incremental o
      acumulada.

fases:
  - nombre: "Primera fase — reconversión de las salas blancas"
    estado: paralizado
    superficie_m2: 100000
    nota: >-
      Ocuparía la totalidad de las salas blancas y hasta 100.000 m2 de las instalaciones
      industriales de Solaria, con racks de Super Micro y GPU de NVIDIA. A enero de 2026 no se había
      instalado ningún servidor. Corresponde al acuerdo de 2024; no describe el alcance de la
      propuesta de septiembre de 2026.
    fuentes: [src-solaria, src-ser]
  - nombre: Propuesta Solaria de septiembre de 2026, primera fase
    estado: en_tramitacion
    nota: 40 MW sin tipo publicado. Posible inicio de actividad a finales de 2027 según anuncio
      municipal; sin puesta en servicio ni comienzo de obras acreditados.
    fuentes:
      - src-ayto-20260921
      - src-ayto-20260924

superficie_construida_m2: null
inversion_anunciada_eur: 150000000

empleo:
  - tipo: directo
    valor: 100
    referencia: "Primera fase del proyecto"
    fecha_dato: "2024-09-17"
    fuentes: [src-solaria, src-eldiario]
    nota: >-
      La nota de Solaria habla de "la creación de más de 100 empleos" en la primera fase. Es una
      previsión de 2024 sobre un proyecto que en enero de 2026 estaba parado.
  - tipo: directo
    valor: 90
    referencia: Operación de la propuesta municipal de septiembre de 2026
    fecha_dato: 2026-09-24
    fuentes:
      - src-ayto-20260924
    nota: Escenario distinto de los más de 100 empleos del anuncio de 2024. No se suman.

computo:
  - tipo: gpu
    ambito: sistema
    sistema: "Centro de datos de IA de Puertollano (fase 1)"
    operador_computo: "Data Section"
    modelo: "GPU NVIDIA de última generación en racks de Super Micro"
    tipo_unidad: acelerador
    estado: paralizado
    fecha_dato: "2024-09-03"
    fuentes: [src-solaria, src-eldiario]
    nota: >-
      No hay recuento: ni Solaria ni Data Section publican modelo concreto ni número de
      aceleradores. Data Section se encarga de garantizar el suministro de GPU y servidores de IA a
      través de sus socios Foxconn y Super Micro. A enero de 2026 no se había instalado ningún
      servidor en las salas blancas, así que el registro documenta un anuncio, no hardware en
      funcionamiento. Este hardware se anunció para el acuerdo de 2024, no para la propuesta de
      septiembre de 2026. La nueva documentación consultada no publica GPU instaladas.

incertidumbres:
  - campo: estado
    descripcion: >-
      La paralización de Datasection de enero de 2026 y la nueva propuesta municipal de septiembre
      son hechos distintos. Se actualiza el emplazamiento de Solaria en La Nava sin atribuirle un
      operador no publicado. Queda por conciliar la continuidad del alcance físico y contractual de
      ambos proyectos.
    fuentes: [src-ser, src-ayto-20260924]
  - campo: potencia
    descripcion: >-
      Conviven dos cifras que no son la misma magnitud pero que las fuentes usan indistintamente: un
      suministro de hasta 200 MW previsto en el acuerdo y una primera fase de 40 MW. La declaración
      pública citada por elDiario.es dice "más de 40 megavatios" refiriéndose al centro entero, lo
      que confunde la fase con el conjunto. Ninguna fuente distingue carga TI de potencia de
      conexión.
    fuentes: [src-eldiario, src-solaria]
  - campo: operador
    descripcion: >-
      Data Section (Datasection) figura como socio tecnológico del acuerdo de 2024, pero la
      información de enero de 2026 sostiene que abandonó el proyecto. Si así fuera, el operador
      registrado ya no lo sería. Se conserva a falta de confirmación de las partes.
    fuentes: [src-solaria, src-ser]
  - campo: inversion_anunciada_eur
    descripcion: El anuncio municipal de septiembre de 2026 cifra la propuesta en 150 millones de euros,
      frente a 500 millones del acuerdo de 2024. Se conserva el anuncio histórico en sus fuentes,
      sin sumarlo al nuevo.
    fuentes:
      - src-solaria
      - src-ayto-20260924
  - campo: superficie_parcela_m2
    descripcion: Los 41.456 m² aproximados de la propuesta de 2026 no equivalen a superficie construida.
      El anuncio de 2024 hablaba de hasta 100.000 m² de instalaciones y salas blancas, hoy
      conservados solo como alcance histórico de aquella fase.
    fuentes:
      - src-solaria
      - src-ayto-20260924

confianza: baja
ultima_verificacion: "2026-10-14"

