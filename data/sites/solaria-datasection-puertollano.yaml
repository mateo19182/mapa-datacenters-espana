superficie_construida_m2: 100000
inversion_anunciada_eur: 500000000

incertidumbres:
  - campo: estado
    descripcion: >-
      No se ha encontrado información posterior a 2024 que acredite avance del
      proyecto. El estado real a 2026 es desconocido.
    fuentes: [src-eldiario]
  - campo: potencia
    descripcion: >-
      El acuerdo original recogido por prensa económica preveía un suministro de
      hasta 200 MW y una primera fase de 40 MW; la declaración pública citada
      habla de "más de 40 megavatios". Solo se registra la cifra de la fuente
      efectivamente consultada.
    fuentes: [src-eldiario]

