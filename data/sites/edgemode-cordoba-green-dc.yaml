estado: en_tramitacion
estado_detalle: >-
  Uno de los cinco campus del porfolio español que EdgeMode adquirió a Blackberry AIF (junto a
  Torrecampo, Malpica, Cáceres y Vianos). Baxtel indica conexión a red asegurada y licencia
  provisional de construcción obtenida, con estatus ready-to-build previsto para 2026 y desarrollo
  del emplazamiento a partir de 2028 con ampliaciones hasta 2030. En julio de 2026 EdgeMode firmó un
  acuerdo no vinculante (term sheet, con 60 días de exclusividad) para vender a Pure Data Centres
  Group —participada por Oaktree, del grupo Brookfield— sus derechos sobre los suelos que el
  documento presentado a la SEC llama Córdoba, «Palma», Vianos y Cáceres; Pure DC prevé desarrollar
  finalmente solo dos de los cuatro, previsiblemente Cáceres y Vianos. «Palma» no es Palma del Río,
  aunque así lo glosaran Expansión y DCD: es el emplazamiento de Torrecampo, ficha
  `edgemode-torrecampo-green-dc`. A 30 de agosto de 2026 el proyecto no estaba en obras y le
  faltaban permisos y punto de conexión. Cada campus del porfolio se
  proyecta con unos 60 MW de fotovoltaica dedicada y 240 MWh de almacenamiento en baterías, que son
  activos de generación y no potencia del centro de datos.
estado_fuentes: [src-1, src-2, src-6, src-7]

potencia:
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Capacidad atribuida al campus de Córdoba dentro del porfolio de 1,5 GW"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08-30"
    fuentes: [src-3, src-7, src-5]
    nota: >-
      El Conciso dice «Córdoba y Torrecampo, dotadas con 300 MW cada una» sin especificar si son
      MW IT o de conexión. Data Center Dynamics repite en julio de 2026 que «cada uno de los
      proyectos está diseñado para alcanzar 300 MW de capacidad» y Economía Digital lo mantiene a
      30 de agosto de 2026.
  - tipo: no_especificado
    valor_mw: 120
    ambito: campus
    referencia: "Capacidad del centro de Córdoba en el porfolio IberData Hub de Blackberry AIF"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-12-23"
    fuentes: [src-4]
    nota: >-
      Data Center Dynamics, al informar de que EdgeMode y BAIF habían asegurado el suministro de
      1,5 GW, describe el porfolio como «a 120MW data center in Córdoba, Andalusia; 100MW facilities
      in Vianos and Alcaraz, Albacete; and a 100MW facility in Toledo». Es la cifra más baja
      publicada para este emplazamiento y no coincide con el reparto de 300 MW por campus.
  - tipo: generacion_asociada
    valor_mw: 360
    ambito: campus
    referencia: "Pilas de combustible de óxido sólido desplegables en cada uno de los cinco emplazamientos"
    estado_asociado: anunciado
    fecha_dato: "2026-07-14"
    fuentes: [src-6]
    nota: >-
      «Up to 360MW of fuel cell capacity could be deployed at each of the five sites», con gas
      natural como combustible primario y en sustitución de la conexión a red. Es capacidad de
      generación, no capacidad del centro de datos, y no entra en ningún agregado.

conexion_electrica:
  fuentes: [src-1]

enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      Tres lecturas incompatibles y ninguna tipificada: 300 MW por emplazamiento (reparto del
      objetivo agregado de 1,5 GW entre cinco campus, repetido por prensa hasta agosto de 2026),
      120 MW para Córdoba en la descripción del porfolio IberData Hub, y una capacidad combinada de
      1,5 GW atribuida conjuntamente a Córdoba y «Palma» —esto es, Torrecampo— en el term sheet de
      la venta a Pure DC. No hay
      fuente que publique una potencia contratada o concedida específica para Córdoba.
    fuentes: [src-2, src-3, src-4, src-6]
  - campo: propietario
    descripcion: >-
      En julio de 2026 EdgeMode firmó un term sheet no vinculante para vender a Pure Data Centres
      Group (Oaktree / Brookfield) su participación en los suelos de Córdoba, «Palma» (Torrecampo),
      Vianos y Cáceres. No es un cambio de nombre de EdgeMode: son dos compañías distintas y la operación
      estaba pendiente de acuerdo vinculante y de que los proyectos obtuvieran autorizaciones,
      permisos energéticos y un contrato de arrendamiento con un hiperescalar. Pure DC pagaría
      1,5 millones de euros por emplazamiento seleccionado, otros 1,5 millones al alcanzar
      ready-to-build y 325.000 euros por megavatio de capacidad IT arrendada, y prevé desarrollar
      solo dos de los cuatro. Se mantiene EdgeMode como operador y propietario hasta que conste el
      cierre.
    fuentes: [src-6, src-8]
  - campo: ubicacion
    descripcion: >-
      Ninguna fuente da parcela, polígono ni dirección; solo «Córdoba». Coordenadas de municipio.
    fuentes: [src-1, src-2, src-3]
  - campo: estado
    descripcion: >-
      pv-tech sitúa el ready-to-build del porfolio en el primer trimestre de 2026; Baxtel lo sitúa
      en el segundo trimestre de 2026 para Córdoba. La afirmación de «conexión a red asegurada» y
      «licencia provisional de construcción» procede solo de Baxtel y choca con Economía Digital,
      que el 30 de agosto de 2026 escribe que EdgeMode «dispone de sociedades y acuerdos de alquiler
      sobre los terrenos, pero todavía necesita permisos y puntos de conexión» y que ninguno de sus
      dos centros cordobeses está en obras.
    fuentes: [src-1, src-2, src-7]

confianza: baja
ultima_verificacion: "2026-08-31"

