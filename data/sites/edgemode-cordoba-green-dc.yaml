estado: en_tramitacion
estado_detalle: Uno de los cinco campus del porfolio español que EdgeMode adquirió a Blackberry AIF
  (junto a Torrecampo, Malpica, Cáceres y Vianos). Baxtel indica conexión a red asegurada y licencia
  provisional de construcción obtenida, con estatus ready-to-build previsto para 2026 y desarrollo
  del emplazamiento a partir de 2028 con ampliaciones hasta 2030. En julio de 2026 EdgeMode firmó
  un acuerdo no vinculante (term sheet, con 60 días de exclusividad) para vender a Pure Data Centres
  Group —participada por Oaktree, del grupo Brookfield— sus derechos sobre los suelos que el
  documento presentado a la SEC llama Córdoba, «Palma», Vianos y Cáceres; Pure DC prevé desarrollar
  finalmente solo dos de los cuatro, previsiblemente Cáceres y Vianos. No se ha acreditado que
  «Palma» sea Torrecampo o Palma del Río; se mantiene sin resolver esa identidad. A 30 de agosto de
  2026 el proyecto no estaba en obras y le faltaban permisos y punto de conexión. Cada campus del
  porfolio se proyecta con unos 60 MW de fotovoltaica dedicada y 240 MWh de almacenamiento en
  baterías, que son activos de generación y no potencia del centro de datos.
estado_fuentes: [src-1, src-2, src-6, src-7]

potencia:
  - tipo: no_especificado
