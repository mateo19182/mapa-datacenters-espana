    nota: >-
      El Conciso dice «Córdoba y Torrecampo, dotadas con 300 MW cada una» sin especificar si son
      MW IT o de conexión. Data Center Dynamics repite en julio de 2026 que «cada uno de los
      proyectos está diseñado para alcanzar 300 MW de capacidad» y Economía Digital lo mantiene a
      30 de agosto de 2026.
  - tipo: no_especificado
    valor_mw: 120
    ambito: campus
    referencia: "Capacidad del centro de Córdoba en el porfolio IberData Hub de Blackberry AIF"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-12-23"
    fuentes: [src-4]
    nota: Data Center Dynamics, al informar de que EdgeMode y BAIF habían asegurado el suministro de 1,5
      GW, describe el porfolio como «a 120MW data center in Córdoba, Andalusia; 100MW facilities in
      Vianos and Alcaraz, Albacete; and a 100MW facility in Toledo». Es la cifra más baja publicada
      para este emplazamiento y no coincide con el reparto de 300 MW por campus.
  - tipo: generacion_asociada
    valor_mw: 360
    ambito: campus
    referencia: "Pilas de combustible de óxido sólido desplegables en cada uno de los cinco emplazamientos"
    estado_asociado: anunciado
    fecha_dato: "2026-07-14"
    fuentes: [src-6]
    nota: >-
      «Up to 360MW of fuel cell capacity could be deployed at each of the five sites», con gas
      natural como combustible primario y en sustitución de la conexión a red. Es capacidad de
      generación, no capacidad del centro de datos, y no entra en ningún agregado.
  - tipo: no_especificado
    valor_mw: 360
    ambito: campus
    referencia: Capacidad prevista por emplazamiento en el MD&A del 10-Q a 30 de junio de 2026
    estado_asociado: anunciado
    fecha_dato: 2026-06-30
    fuentes:
      - src-sec-10q-20260814
    nota: El MD&A enumera cinco arrendamientos, incluido este emplazamiento, y prevé 360 MW por sitio.
      No tipifica carga IT ni acredita capacidad entregada. Es una lectura distinta de los 300 MW
      del nombre de la sociedad y de la previsión separada de una instalación de generación de 360
      MW.
