incertidumbres:
  - campo: potencia
    descripcion: La SEC identifica explícitamente «DC Estate Córdoba SL 300 MW», sin tipificar esos MW;
      ya no depende de repartir 1,5 GW entre cinco campus. Se conserva la lectura histórica 120 MW
      del porfolio Iber Data Hub y el objetivo agregado de 1,5 GW para Córdoba y «Palma» del term
      sheet. No se ha acreditado que «Palma» sea Torrecampo ni existe una capacidad contratada o
      concedida comprobada para esta parcela.
    fuentes:
      - src-2
      - src-3
      - src-4
      - src-6
      - src-sec-jv-20260630
  - campo: propietario
    descripcion: "En julio de 2026 EdgeMode firmó un term sheet no vinculante para vender a Pure Data
      Centres Group (Oaktree / Brookfield) su participación en los suelos de Córdoba, «Palma»
      (identidad no resuelta), Vianos y Cáceres. No es un cambio de nombre de EdgeMode: son dos
      compañías distintas y la operación estaba pendiente de acuerdo vinculante y de que los
      proyectos obtuvieran autorizaciones, permisos energéticos y un contrato de arrendamiento con
      un hiperescalar. Pure DC pagaría 1,5 millones de euros por emplazamiento seleccionado, otros
      1,5 millones al alcanzar ready-to-build y 325.000 euros por megavatio de capacidad IT
      arrendada, y prevé desarrollar solo dos de los cuatro. Se mantiene EdgeMode como operador y
      propietario hasta que conste el cierre. La nota 1 del 10-Q a 30 de junio de 2026 establece una
      JV 50,1%/49,9% desde el 22 de enero, que sustituye el reparto histórico 75%/25%. Los activos
      documentados son participaciones en sociedades y derechos de arrendamiento, no la adquisición
      de un CPD construido."
    fuentes:
      - src-6
      - src-8
      - src-sec-jv-20260630
  - campo: ubicacion
    descripcion: >-
      Ninguna fuente da parcela, polígono ni dirección; solo «Córdoba». Coordenadas de municipio.
    fuentes: [src-1, src-2, src-3]
  - campo: estado
    descripcion: >-
      pv-tech sitúa el ready-to-build del porfolio en el primer trimestre de 2026; Baxtel lo sitúa
      en el segundo trimestre de 2026 para Córdoba. La afirmación de «conexión a red asegurada» y
      «licencia provisional de construcción» procede solo de Baxtel y choca con Economía Digital,
      que el 30 de agosto de 2026 escribe que EdgeMode «dispone de sociedades y acuerdos de alquiler
      sobre los terrenos, pero todavía necesita permisos y puntos de conexión» y que ninguno de sus
      dos centros cordobeses está en obras.
    fuentes: [src-1, src-2, src-7]
  - campo: potencia
    descripcion: El MD&A del 10-Q prevé 360 MW por cada uno de los cinco sitios, mientras los nombres de
      las sociedades incluyen 300 MW. No explica el cambio ni si se refiere a carga IT o potencia
      eléctrica total. Se conservan ambas lecturas y la generación separada, sin sumarlas ni
      contarlas como operativas.
    fuentes:
      - src-sec-jv-20260630
      - src-sec-10q-20260814
confianza: baja
