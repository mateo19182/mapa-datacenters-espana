id: aws-zaragoza-la-cartuja-car
nombre: "AWS Ampliación Región Aragón — Zaragoza La Cartuja (CAR)"
alias:
  - "CAR"
  - "Zaragoza-La Cartuja"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "Zaragoza"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Paraje «Acampo del Marqués», entorno de La Cartuja Baja"
  lat: 41.65
  lon: -0.883333
  precision: municipio
  fuentes: [src-1, src-3]

estado: en_tramitacion
estado_detalle: >-
  Quinto emplazamiento del PIGA "Expansión de la Región AWS en Aragón". Su proyecto de
  urbanización y el convenio interadministrativo se aprobaron definitivamente el 22 de
  agosto de 2025 y las infraestructuras de agua el 12 de noviembre de 2025, pero a fecha
  de 4 de mayo de 2026 el promotor todavía no había presentado a aprobación definitiva el
  proyecto de edificación y urbanización interior de la parcela. El proyecto de líneas de
  132 kV entre la SE Montetorrero y la parcela CAR quedó excluido de la aprobación
  definitiva de noviembre de 2025 por no estar completo el trazado.
estado_fuentes: [src-1, src-2]

potencia: []

energia:
  - consumo_gwh_ano: 3279.7
    referencia: "Recursos de energía previstos para la actividad del centro de datos «CAR» a plena capacidad"
    fecha_dato: "2025-07-16"
    fuentes: [src-6]
    nota: >-
      La cifra figura en la declaración ambiental estratégica del PIGA, dentro del escrito de
      alegaciones de SEO/BirdLife que la resolución reproduce literalmente y que la atribuye
      a la documentación del proyecto: no la formula INAGA por su cuenta. La misma relación
      suma 10.848,2 GWh/año para los cinco emplazamientos de la ampliación.

fases:
  - nombre: "Urbanización del ámbito"
    estado: permisos_concedidos
    fuentes: [src-2]
    nota: "Proyecto de urbanización ejecutivo público y privado aprobado el 22 de agosto de 2025."

conexion_electrica:
  subestacion: "SE Montetorrero (líneas de 132 kV hasta la parcela CAR)"
  tension_kv: 132
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-2]
  nota: >-
    El proyecto de redes de alta tensión de líneas de 132 kV entre la subestación de
    Montetorrero y la parcela CAR no pudo aprobarse definitivamente en noviembre de 2025
    "debido a que no está completo todo el trazado de la línea (falta de definición técnica
    del mismo)". INAGA formuló el 3 de octubre de 2025 la DIA del proyecto de redes de alta
    tensión y centro de medida asociado para dotar de suministro energético al centro CAR.

agua:
  circuito: desconocido
  sistema: null
  origen: >-
    Tres fuentes de suministro distintas según la declaración de impacto ambiental de las
    infraestructuras hidráulicas exteriores: nueva toma en el Canal Imperial de Aragón, con
    una balsa de almacenamiento y regulación de 190.297 m³ y estación de bombeo propia;
    ampliación de la concesión de Forestalia para captar agua del río Ebro; y nueva toma de
    agua potable de la red municipal de Zaragoza en La Cartuja Baja, sobre una conducción
    existente DN500. El Ayuntamiento limita el caudal detraíble a 11,5 l/s para el uso
    industrial y a 4,3 l/s para el potable.
  consumo_m3_ano: 204700
  nota: >-
    204.700 m³/año es la cifra que da la declaración ambiental estratégica del PIGA, dentro
    del escrito de alegaciones de SEO/BirdLife que reproduce literalmente. El informe de la
    Oficina Técnica del Ciclo Integral del Agua del Ayuntamiento de Zaragoza, recogido en la
    declaración de impacto ambiental de las infraestructuras hidráulicas, precisa la misma
    magnitud sin redondear: "El volumen anual solicitado según se refleja en la memoria es
    de 204.697 m3 anuales" para la toma de agua de uso industrial, más 5.311 m³ anuales para
    la toma de agua potable. Es el segundo mayor consumo de los cinco emplazamientos de la
    ampliación, pese a que CAR es el único que a la fecha de verificación no ha presentado a
    aprobación definitiva su proyecto de edificación. No consta sistema de refrigeración ni
    WUE.
  fuentes: [src-4, src-5]

inversion_anunciada_eur: null
enlaces_proyecto:
  - "https://www.aragon.es/-/piga-aws-ampliacion"

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Las fuentes oficiales sitúan el emplazamiento en el paraje "Acampo del Marqués" del
      término municipal de Zaragoza (referido como "Zaragoza-La Cartuja"), pero no publican
      coordenadas. Las coordenadas registradas son el centroide municipal de Zaragoza y no
      corresponden al emplazamiento real.
    fuentes: [src-2, src-3]
  - campo: potencia
    descripcion: >-
      No se ha localizado ninguna cifra de potencia (TI, conexión a red o instalada) para
      CAR. Su autorización ambiental integrada (expediente INAGA 500301/02/2024/12133) no
      constaba resuelta a la fecha de verificación.
    fuentes: [src-1]

  - campo: agua
    descripcion: >-
      Las dos fuentes oficiales dan la misma magnitud con distinto redondeo: 204.700 m³/año
      en la declaración ambiental estratégica y 204.697 m³ anuales en el informe municipal
      del ciclo integral del agua, este último referido en concreto a la toma de uso
      industrial y acompañado de otros 5.311 m³ anuales de agua potable. Se registra la
      cifra redondeada y se deja constancia de la exacta.
    fuentes: [src-4, src-5]
  - campo: agua
    descripcion: >-
      El Ayuntamiento de Zaragoza advierte de que su informe "no debe suponer una garantía
      estricta de volúmenes y caudales" y se reserva "la potestad de ejercer las acciones
      correctoras pertinentes" si se superan los volúmenes solicitados. El suministro
      depende además de una nueva toma en el Canal Imperial de Aragón y de la ampliación de
      una concesión de Forestalia sobre el río Ebro, ninguna de las dos otorgada a la fecha
      de verificación.
    fuentes: [src-5]

confianza: media
