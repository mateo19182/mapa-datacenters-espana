incertidumbres:
  - campo: potencia
    descripcion: >-
      MAD4: la compañía habla de 32 MW y el directorio OCOLO de 30 MW. MAD5: EjePrime, citando al
      director general de Digital Realty España, da 20-24 MW; Brainsre, citando a Idealista, da
      20-40 MW. Ninguna fuente aclara si son MW TI o de conexión.
    fuentes: [src-6, src-7, src-8]
  - campo: superficie_construida_m2
    descripcion: >-
      La suma de superficies por edificio de las fichas oficiales (8.250 + 3.550 + 8.750 + 21.200
      = 41.750 m²) coincide aproximadamente con los 41,7k m² de colocation que declara la página
      de campus, pero el director general cita "35.000 metros cuadrados" solo para MAD4, frente a
      los 21.200 m² de la ficha del edificio.
    fuentes: [src-5, src-4, src-6]
  - campo: ubicacion
    descripcion: >-
      Los cuatro edificios están en calles distintas del mismo polígono (Albasanz, Emilio Muñoz,
      Alfonso Gómez), separados por unos cientos de metros. Se registran como un único campus
      porque Digital Realty los comercializa como "our Madrid data center campus".
    fuentes: [src-5]

