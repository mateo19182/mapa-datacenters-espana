estado_detalle: >-
  Centro heredado por Equinix con la compra de Itconic en 2017; anteriormente
  identificado como "Itconic Barcelona 1". Sigue en servicio y forma ecosistema
  con BA2, con el que está unido por anillos redundantes de fibra. La ficha del
  IBX declara 22.755 pies cuadrados, redundancia 2N en alimentación y N+1 en
  refrigeración, energía 100 % renovable y más de 60 operadores de
  telecomunicaciones concentrados en el ecosistema.
estado_fuentes: [src-2, src-4, src-5]

