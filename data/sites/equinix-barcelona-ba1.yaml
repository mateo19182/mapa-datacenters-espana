incertidumbres:
  - campo: potencia
    descripcion: >-
      Equinix no publica la potencia de BA1 en la ficha del IBX, que solo da
      superficie y redundancias. Baxtel oculta la cifra tras muro de pago y la
      ficha comercial en PDF («BA1_IBX_Site_Spec_A4-EN.pdf») tampoco es accesible
      sin registro. No se registra ningún valor.
    fuentes: [src-2, src-4]
  - campo: superficie_construida_m2
    descripcion: >-
      La cifra de ~1.500 m² procede de prensa especializada citando "more than
      16,000 sq ft of colocation space"; es superficie de colocation, no
      superficie construida total. La propia Equinix publica en la ficha del IBX
      «22,755 Square feet (ft²)», magnitud mayor que no se convierte ni sustituye
      a la registrada.
    fuentes: [src-3, src-4]

