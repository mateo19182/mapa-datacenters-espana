id: asac-llanera-data-center-1
nombre: "ASAC Comunicaciones — Data Center 1 (Parque Tecnológico de Asturias, Llanera)"
alias:
  - "ASAC 1"
  - "CPD de ASAC en Llanera"
tipo: edificio
operador: "ASAC Comunicaciones"
propietario: "ASAC Comunicaciones"
modelo: colocation

ubicacion:
  municipio: "Llanera"
  provincia: "Asturias"
  ccaa: "Asturias"
  direccion: "Parque Tecnológico de Asturias, Llanera"
  lat: 43.4270
  lon: -5.8340
  precision: aproximada
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Centro de datos propio de ASAC en el Parque Tecnológico de Asturias, con
  certificación oficial Tier III del Uptime Institute. En 2025 se inauguró una
  ampliación que duplica su capacidad de cómputo y almacenamiento y eleva su
  eficiencia energética un 18%. Está organizado en «cubos» de armarios rack de alta
  densidad y la compañía contempla un tercer cubo a medio plazo. La ampliación se
  ejecutó a lo largo de un año sin interrupción de servicio y ASAC anunció en abril
  de 2025 una actuación adicional de unos 1,75 millones de euros para ese mismo año.
  En octubre de 2025 la compañía fue seleccionada por la Consejería de Ciencia,
  Industria y Empleo para recibir financiación del Fondo de Transición Justa
  destinada a ampliar el centro. ASAC opera además un Data Center 2 de respaldo,
  unido al primero por un anillo de fibra óptica, que no se documenta en esta ficha.
  La nota de la compañía que anunció la ampliación preveía «la generación de cinco
  nuevos puestos de trabajo» una vez puesta en funcionamiento; no se registra en el
  campo de empleo porque la fuente da la cifra en letra y no en número.
estado_fuentes: [src-1, src-2, src-3, src-4]

potencia:
  - tipo: instalada_total
    valor_mw: 1
    ambito: edificio
    referencia: "Centro de transformación propio de 1 MVA"
    estado_asociado: operativo
    fecha_dato: "2025-05"
    fuentes: [src-1]
    nota: >-
      La fuente da «1MVA» (potencia aparente del centro de transformación), no MW de
      carga TI. Se registra como potencia instalada por ser lo más próximo, con la
      salvedad de que MVA y MW no son equivalentes.

fases:
  - nombre: "Data Center 1 — instalación original"
    estado: operativo
    fuentes: [src-1]
  - nombre: "Ampliación (segundo cubo)"
    estado: operativo
    fecha_puesta_en_servicio: "2025-04"
    fuentes: [src-1, src-2, src-3]
  - nombre: "Tercer cubo"
    estado: anunciado
    fuentes: [src-2]

inversion_anunciada_eur: 7400000
refrigeracion: >-
  Aire enfriado por chillers de agua/glicol con contención de pasillo caliente, más
  free cooling que aprovecha el aire exterior; enfriadoras redundantes N+1 y extinción
  de incendios por agua nebulizada. Centro de transformación propio alimentado con
  energía 100% renovable.

agua:
  circuito: desconocido
  sistema: >-
    Aire enfriado por equipos chillers de agua/glicol, con contención de pasillo
    caliente, complementado con free cooling que aprovecha las bajas temperaturas
    exteriores de Asturias durante gran parte del año. El glicol circula en un
    circuito de transferencia, no hay torre de refrigeración descrita.
  origen: null
  nota: >-
    Ni ASAC ni el Parque Tecnológico de Asturias publican consumo de agua ni WUE. La
    descripción del sistema procede de la nota de la propia compañía al iniciar la
    ampliación en diciembre de 2023.
  fuentes: [src-2, src-3]

enlaces_proyecto:
  - "https://www.asacti.es/actualidad/asac-inaugura-la-obra-de-ampliacion-de-su-data-center-1/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      El único dato eléctrico absoluto publicado es «1MVA» del centro de
      transformación. No es MW IT ni potencia de conexión concedida; no se convierte.
      La nota de 2023 añade que la ampliación aumentaría «su potencia energética en
      un 50%», un incremento porcentual sin cifra de partida que no permite derivar
      la potencia resultante.
    fuentes: [src-1, src-2]
  - campo: inversion_anunciada_eur
    descripcion: >-
      7,4 M€ es la inversión acumulada en el Data Center 1 desde su inicio; 4,3 M€
      corresponden solo a la ampliación inaugurada en abril de 2025. La nota de la
      propia compañía de diciembre de 2023, al iniciar esa misma obra, la
      presupuestaba en 1,3 M€. No se ha localizado explicación de la diferencia.
    fuentes: [src-1, src-2, src-3]
  - campo: otros
    descripcion: >-
      El número de armarios no está claro. La nota de ASAC dice que «los dos cubos del
      Data Center están equipados con un cerramiento térmico de alta densidad formado
      por 50 armarios rack», que puede leerse como 50 en total o como 50 por cubo; el
      Parque Tecnológico de Asturias habla de «50 armarios rack de alta densidad» sin
      más.
    fuentes: [src-1, src-3]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      No se ha verificado con fuente primaria la fecha de la inauguración original.
      La Nueva España sitúa el inicio de la inversión de ASAC en su Data Center en
      2014; otras piezas de prensa la sitúan en 2015. Campo omitido.
    fuentes: [src-1, src-4]

