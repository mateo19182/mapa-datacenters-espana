id: ingenostrum-badajoz-nostrum-evergreen
nombre: "Nostrum Evergreen — Badajoz (Plataforma Logística del Suroeste Europeo)"
alias:
  - "Data Riocaya Badajoz"
  - "DC Badajoz"
  - "BAZ01"
tipo: campus
operador: "Nostrum Data Centers"
propietario: "Data Riocaya, S.L.U. (Nostrum Group)"
modelo: mayorista

ubicacion:
  municipio: "Badajoz"
  provincia: "Badajoz"
  ccaa: "Extremadura"
  direccion: "Cinco parcelas de la Plataforma Logística del Suroeste Europeo"
  lat: 38.9101139
  lon: -7.0048802
  precision: aproximada
  fuentes: [src-dcm, src-osm]

estado: en_tramitacion
estado_detalle: >-
  Declarado Proyecto Empresarial de Interés Autonómico (PREMIA) por acuerdo del Consejo de
  Gobierno de 11 de noviembre de 2025, publicado en el DOE el 17 de noviembre. El 25 de mayo de
  2026 el DOE sometió a información pública la solicitud de autorización ambiental integrada y el
  estudio de impacto ambiental (expediente AAI25/024, anuncio de 19 de mayo de 2026). El 28 de
  agosto de 2026 la consejera de Industria afirmó que la instalación ya cuenta con la autorización
  de la Junta para la línea eléctrica de 220 kV y que la autorización ambiental fue favorable,
  quedando pendiente el permiso estatal para la línea de 400 kV; la empresa espera empezar a
  construir en octubre de 2026. La declaración PREMIA sitúa el fin de la construcción en 2031.
estado_fuentes: [src-dcm, src-premia, src-eldiario-aai, src-doe-sumario, src-hoy]

potencia:
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Capacidad prevista del campus"
    estado_asociado: anunciado
    fecha_dato: "2026"
    fuentes: [src-dcm, src-dcd-extremadura]
    nota: >-
      Data Center Market da "300MW" y Data Center Dynamics «una capacidad de hasta 300 MW», ninguna
      de las dos distinguiendo carga TI de potencia de conexión.
  - tipo: conexion_red
    valor_mw: 300
    ambito: campus
    referencia: "Capacidad de acceso conectada a la red para la que se diseña el centro"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-11-17"
    fuentes: [src-premia]
    nota: >-
      La nota oficial de la Junta de Extremadura sobre la declaración PREMIA es la única fuente que
      tipifica los 300 MW: los describe como «capacidad de acceso conectada a la red».
  - tipo: no_especificado
    valor_mw: 170
    ambito: campus
    referencia: "Demanda energética total declarada en la autorización ambiental integrada"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-05-25"
    fuentes: [src-eldiario-aai]
    nota: >-
      El expediente sometido a información pública cita 170 MW de demanda total y 110 MW de demanda
      crítica, con funcionamiento de 8.760 horas al año. No es la misma magnitud que la capacidad de
      acceso de 300 MW de la declaración PREMIA.
  - tipo: no_especificado
    valor_mw: 500
    ambito: campus
    referencia: "Capacidad máxima a la que aspira el proyecto"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08-28"
    fuentes: [src-hoy, src-dcd-extremadura]
    nota: >-
      La consejera de Industria y Data Center Dynamics coinciden en que el proyecto arrancaría con
      150 MW y podría alcanzar 500 MW. Ninguna de las dos fuentes precisa el tipo de MW.
  - tipo: no_especificado
    valor_mw: 150
    ambito: fase
    referencia: "Potencia con la que arrancaría el centro"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08-28"
    fuentes: [src-hoy]
    nota: "La consejera dice que «la idea es que arranque con 150 MW, pero alcance los 500 MW»."

fases:
  - nombre: "Ejecución por fases desde 2026"
    estado: anunciado
    fecha_puesta_en_servicio: "2026"
    fuentes: [src-dcm]

conexion_electrica:
  subestacion: "Subestación 220/30 kV adyacente y subestación de enlace 400/220 kV"
  tension_kv: 220
  nota: >-
    La declaración PREMIA describe una subestación 220/30 kV adyacente al centro, una subestación de
    enlace 400/220 kV —excluido el campo de 400 kV, de competencia estatal— y las líneas de alta
    tensión necesarias. En agosto de 2026 la Junta de Extremadura había autorizado la línea de
    220 kV; la de 400 kV seguía en tramitación ante la Administración General del Estado.
  fuentes: [src-premia, src-hoy]

superficie_parcela_m2: 222735
inversion_anunciada_eur: 1913000000

empleo:
  - tipo: no_especificado
    valor: 330
    referencia: "Puestos de trabajo previstos en la declaración PREMIA"
    fecha_dato: "2025-11-17"
    fuentes: [src-premia]
    nota: "La nota oficial no distingue entre empleo directo e indirecto."
  - tipo: construccion
    valor: 2000
    referencia: "Empleos durante la construcción"
    fecha_dato: "2026-05-26"
    fuentes: [src-cronica]
    nota: "La fuente dice «unos 2.000 empleos durante su construcción»."

incertidumbres:
  - campo: potencia
    descripcion: >-
      Conviven cuatro cifras que no son la misma magnitud y no se suman: 300 MW de capacidad de
      acceso a red (declaración PREMIA, noviembre de 2025), 170 MW de demanda energética total y
      110 MW de demanda crítica (autorización ambiental integrada, mayo de 2026), y 150 MW de
      arranque con horizonte de 500 MW (declaraciones de la consejera de Industria, agosto de 2026).
      Un recopilatorio secundario anterior atribuía al proyecto «500 MW escalables en fases».
      Solo la fuente oficial tipifica su cifra.
    fuentes: [src-premia, src-eldiario-aai, src-hoy, src-rankia]
  - campo: operador
    descripcion: >-
      El 7 de mayo de 2026 IREN Limited anunció un acuerdo para adquirir
      Ingenostrum, S.L. (Nostrum Group), pendiente de condiciones de cierre.
    fuentes: [src-iren]
  - campo: superficie_parcela_m2
    descripcion: >-
      La declaración PREMIA recogida por prensa cifra la ocupación en 222.735 m² en la Plataforma
      Logística del Suroeste Europeo; la fuente sectorial habla de «algo más de 22 hectáreas» en
      cinco parcelas. Las dos cifras son compatibles pero proceden de fuentes distintas y no se ha
      consultado el expediente.
    fuentes: [src-dcm, src-hibridos]
  - campo: agua
    descripcion: >-
      No se ha localizado ninguna cifra de consumo de agua del proyecto. La consejera de Industria
      afirmó en agosto de 2026 que «las confederaciones hidrográficas han dado su visto bueno a los
      proyectos», sin publicar volúmenes. Campo agua omitido.
    fuentes: [src-hoy]

