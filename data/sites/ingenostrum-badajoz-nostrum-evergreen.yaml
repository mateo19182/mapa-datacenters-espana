      fases", frente a los 300 MW de la fuente sectorial. Se conservan ambas
      cifras sin elegir entre ellas.
    fuentes: [src-dcm, src-rankia]
  - campo: operador
    descripcion: >-
      El 7 de mayo de 2026 IREN Limited anunció un acuerdo para adquirir
      Ingenostrum, S.L. (Nostrum Group), pendiente de condiciones de cierre.
    fuentes: [src-iren]
  - campo: superficie_parcela_m2
    descripcion: >-
      Se cita que el centro ocupará "algo más de 22 hectáreas" en cinco parcelas
      de la plataforma logística, dato que no se ha podido contrastar con el
      expediente.
    fuentes: [src-dcm]

