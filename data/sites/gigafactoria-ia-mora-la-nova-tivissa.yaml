    editor: "Generalitat de Catalunya — Acords de Govern"
    tipo: oficial
    fecha_publicacion: "2025-06-25"
    fecha_consulta: "2026-08-31"
    cita: >-
      El Govern ha aprovat aquest dimecres una declaració de suport institucional
      a la proposta presentada per un consorci publicoprivat per a la creació
