    editor: "Plan de Recuperación, Transformación y Resiliencia — Gobierno de España"
    tipo: oficial
    fecha_publicacion: "2026-07-22"
    fecha_consulta: "2026-08-31"
    cita: >-
      La diferencia con las fábricas de IA (AI Factories) ya en funcionamiento es, sobre todo,
      de escala. Según el Reglamento EuroHPC modificado, las gigafactorías contarán con más de
      100.000 chips avanzados de IA, frente a los 25.000 de los superordenadores más grandes de
      las fábricas de IA. [...] La candidatura es multisede e incluye las ubicaciones de Móra la
      Nova (Tarragona) y San Fernando de Henares (Madrid) para alojar la infraestructura
      tecnológica.
