      d'Ebre). El projecte ... proposa situar la instal·lació en un solar
      propietat de l'Institut Català del Sòl (Incasòl) ... amb una inversió
      prevista d'entre 3.000 i 5.000 milions d'euros
  - id: src-prtr
    url: "https://planderecuperacion.gob.es/noticias/conoce-proyecto-espanol-acoger-primeras-gigafactorias-IA-europa-prtr"
