    editor: "Diari de Tarragona"
    tipo: prensa_general
    fecha_publicacion: "2026-07-21"
    fecha_consulta: "2026-08-31"
    cita: >-
      El Govern de la Generalitat ha ratificado el acuerdo del Consejo de
      Administración del Institut Català del Sòl (Incasòl) para la adquisición de
      20 MW a la empresa tortosina Cetenis SL ... Según los estudios técnicos
      elaborados por el Incasòl, la implantación inicial de la infraestructura
