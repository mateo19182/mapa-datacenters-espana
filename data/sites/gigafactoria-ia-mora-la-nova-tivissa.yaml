id: gigafactoria-ia-mora-la-nova-tivissa
nombre: "Gigafactoria de IA — polígono El Molló (Móra la Nova y Tivissa)"
alias:
  - "Gigafactoria d'Intel·ligència Artificial de Móra la Nova"
  - "AI Gigafactory InvestAI Ribera d'Ebre"
tipo: campus
modelo: hyperscale

ubicacion:
  municipio: "Móra la Nova"
  provincia: "Tarragona"
  ccaa: "Cataluña"
  direccion: "Sector de actividad El Molló, términos municipales de Móra la Nova y Tivissa (Ribera d'Ebre)"
  precision: municipio
  fuentes: [src-1]

estado: en_tramitacion
estado_detalle: >-
  Candidatura al programa europeo InvestAI presentada por el Gobierno de España
  con sede jurídica en Móra la Nova. La Generalitat ratificó un acuerdo para la
  adquisición de 20 MW de potencia adicional para el sector. Si la candidatura
  prospera, las obras empezarían en 2027 y la puesta en marcha se sitúa a finales
  de 2028. Hay oposición pública organizada (Ecologistes en Acció, CGT) por
  consumo energético e hídrico. El Govern aprobó una declaración de apoyo
  institucional el 25 de junio de 2025 y reconoció el proyecto como proyecto
  estratégico de inversión mediante el Acuerdo GOV/141/2026. El suelo es
  propiedad del Institut Català del Sòl.
estado_fuentes: [src-1, src-5, src-6]

potencia:
  - tipo: no_especificado
    valor_mw: 55
    ambito: campus
    referencia: "Capacidad inicial de la instalación"
    estado_asociado: en_tramitacion
    fecha_dato: "2026"
    fuentes: [src-1]
    nota: >-
      La fuente dice "amb una capacitat inicial de 55 megawatts, ampliable fins
      als 125 megawatts". No precisa si son MW TI o de conexión.
  - tipo: no_especificado
    valor_mw: 125
    ambito: campus
    referencia: "Capacidad máxima ampliable"
    estado_asociado: anunciado
    fecha_dato: "2026"
    fuentes: [src-1]
  - tipo: no_especificado
    valor_mw: 150
    ambito: campus
    referencia: "Potencia atribuida al proyecto por CGT y Ecologistes en Acció"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-07"
    fuentes: [src-2]
    nota: >-
      Cifra procedente de organizaciones opositoras, no de la promotora. Se
      registra por discrepar de las cifras de 55/125 MW.
  - tipo: conexion_red
    valor_mw: 54
    ambito: campus
    referencia: "Potencia eléctrica que requiere la implantación inicial según los estudios técnicos del Incasòl"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-07-21"
    fuentes: [src-5]
    nota: >-
      La fuente dice "la implantación inicial de la infraestructura requiere una
      potencia eléctrica de 54 MW". Es potencia de acceso necesaria, no carga TI.
  - tipo: conexion_red
    valor_mw: 34
    ambito: campus
    referencia: "Potencia disponible en el sector El Molló antes de la compra adicional"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-07-21"
    fuentes: [src-5]
    nota: >-
      Es la potencia de que disponía el polígono, no la contratada por el
      proyecto: "actualmente el sector solo dispone de 34 MW".
  - tipo: conexion_red
    valor_mw: 20
    ambito: campus
    referencia: "Potencia adicional adquirida por el Incasòl a Cetenis SL"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-07-21"
    fuentes: [src-5]
    nota: >-
      Acuerdo del consejo de administración del Incasòl ratificado por el Govern
      el 21 de julio de 2026. No se suma a los 34 MW: la propia fuente explica
      que ambas cifras se agregan para cubrir los 54 MW requeridos.

conexion_electrica:
  subestacion: "Subestación eléctrica dels Aubals"
  mw_solicitados: 54
  nota: >-
    Los estudios técnicos del Incasòl cifran en 54 MW la potencia que necesita la
    implantación inicial. El sector El Molló disponía de 34 MW y el Incasòl
    adquirió 20 MW más a la empresa Cetenis SL, operación ratificada por el
    Govern el 21 de julio de 2026. No consta el titular de la red ni la tensión
    del punto de conexión.
  fuentes: [src-1, src-5]

superficie_parcela_m2: 40000
inversion_anunciada_eur: 719000000
refrigeracion: >-
  Sistema de refrigeración por aire en circuito cerrado con consumo de agua
  próximo a cero, según la información del proyecto.

computo:
  - tipo: no_especificado
    ambito: sistema
    sistema: "Gigafactoría de IA de la candidatura española a InvestAI"
    estado: en_tramitacion
    fecha_dato: "2026-07-22"
    fuentes: [src-prtr]
    nota: >-
      Ninguna fuente publica hardware de este emplazamiento, porque la candidatura no está
      resuelta: el plazo de la convocatoria de EuroHPC cierra el 12 de noviembre de 2026 y los
      proyectos seleccionados se conocerán a comienzos de 2027. La única magnitud de cómputo
      publicada es el umbral del programa, no una cifra de este sitio: el Reglamento EuroHPC
      modificado exige que una gigafactoría cuente con «más de 100.000 chips avanzados de IA»,
      frente a los 25.000 de los mayores superordenadores de las fábricas de IA. Se registra
      como contexto y no como recuento del emplazamiento.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Canal 21 Ebre cita una capacidad inicial de 55 MW ampliable a 125 MW; notas
      del Govern recogidas por otras cabeceras hablan de que el despliegue
      inicial requiere 54 MW frente a los 34 MW disponibles en el sector, lo que
      motivó la compra de 20 MW adicionales; CGT y Ecologistes en Acció hablan de
      150 MW. Las tres cifras no se han podido reconciliar. Los 54 MW quedan
      ahora documentados como potencia de acceso necesaria en los estudios
      técnicos del Incasòl, magnitud distinta de los 55 MW de «capacidad
      inicial» que cita Canal 21 Ebre, sin que ninguna fuente aclare si
      coinciden.
    fuentes: [src-1, src-2, src-5]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Coexisten cifras muy distintas: 719 millones de euros de aportación
      estatal, "más de 4.000 millones" público-privados según La Directa y 5.000
      millones según CGT. El Govern habló en junio de 2025 de «una inversió
      prevista d'entre 3.000 i 5.000 milions d'euros» y el Diari de Tarragona, en
      julio de 2026, de una inversión que «podría alcanzar los 5.000 millones».
      No se suman ni se promedian.
    fuentes: [src-1, src-2, src-3, src-5, src-6]
  - campo: refrigeracion
    descripcion: >-
      La documentación del proyecto habla de refrigeración por aire en circuito
      cerrado con consumo casi nulo; La Directa cita en cambio un consumo
      estimado de 1,3 hm³ anuales y advierte del vertido de agua caliente al
      Ebro. Contradicción sin resolver.
    fuentes: [src-1, src-3]
  - campo: operador
    descripcion: >-
      No consta operador único adjudicado. La candidatura la lidera Telefónica
      junto con la SETT (Sociedad Española para la Transformación Tecnológica),
      ACS, MasOrange, Nvidia, Submer y Multiverse Computing según El Crític y La
      Directa; CGT describe un reparto accionarial de 48% Estado, 1% Generalitat
      y 51% privado (Banco Santander, Telefónica, ACS). Ambas descripciones no
      coinciden.
    fuentes: [src-2, src-3, src-4]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 719 millones de euros se describen como inversión del Estado para
      impulsar el proyecto, no como coste total de la instalación.
    fuentes: [src-1]
  - campo: superficie_parcela_m2
    descripcion: >-
      La fuente habla de "unes quatre hectàrees del polígon del Molló"; se
      registra como 40.000 m² con esa imprecisión.
    fuentes: [src-1]

confianza: media
ultima_verificacion: "2026-08-31"

