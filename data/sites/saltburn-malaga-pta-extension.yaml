  - "Benbros Energy Málaga TechPark"
tipo: campus
operador: "Saltburn Holding, S.L."
propietario: "Saltburn Holding, S.L."
modelo: colocation

ubicacion:
  municipio: "Málaga"
  provincia: "Málaga"
  ccaa: "Andalucía"
