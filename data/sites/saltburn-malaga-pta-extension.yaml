id: saltburn-malaga-pta-extension
nombre: "Centro de Datos en la Extensión del PTA de Málaga — Saltburn Holding"
alias:
  - "Proyecto de Centro de Datos en la Extensión del PTA de Málaga"
  - "Data center de Málaga TechPark"
  - "Meridian Data Centers Málaga"
  - "Benbros Energy Málaga TechPark"
tipo: campus
operador: "Saltburn Holding, S.L."
propietario: "Saltburn Holding, S.L."
modelo: colocation

ubicacion:
  municipio: "Málaga"
  provincia: "Málaga"
  ccaa: "Andalucía"
  direccion: "Parcela C del sector SUS CA-23 «Extensión del PTA», Campanillas, Málaga"
  lat: 36.7386
  lon: -4.5589
  precision: aproximada
  fuentes: [src-1, src-2, src-5]

estado: en_tramitacion
estado_detalle: >-
  Declarado inversión empresarial de interés estratégico para Andalucía por Resolución de la
  Comisión Delegada para Asuntos Económicos de 6 de mayo de 2026, publicada en BOJA nº 104 de 2026.
  Integrado en la Unidad Aceleradora de Proyectos de la Junta. La vigencia de la declaración se
  extiende hasta el 31 de diciembre de 2031. Sin licencia de obra acreditada a
  la fecha de verificación; la prensa especializada sitúa el inicio de obras en 2027 y el 30 de
  agosto de 2026 la prensa económica andaluza seguía sin constatar el inicio de las obras.
estado_fuentes: [src-1, src-2, src-3, src-5, src-7, src-8]

potencia:
  - tipo: it
    valor_mw: 100
    ambito: campus
    referencia: "Potencia IT del centro de datos proyectado"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-05-27"
    fuentes: [src-1, src-2]
    nota: "El BOJA dice literalmente «150 MW de consumo eléctrico y 100 MW de potencia IT»."
  - tipo: instalada_total
    valor_mw: 150
    ambito: campus
    referencia: "Consumo eléctrico previsto del centro de datos"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-05-27"
    fuentes: [src-1, src-2]
    nota: >-
      El BOJA lo denomina «consumo eléctrico» y lo contrapone a los 100 MW de potencia IT: es la
      potencia eléctrica total de la instalación, no la potencia de acceso concedida en el punto
      de conexión, que el boletín no publica. La vinculación con el nudo SET Cártama procede de
      prensa y se registra aparte, en la conexión eléctrica.

conexion_electrica:
  subestacion: "SET Cártama"
  titular_red: "Red Eléctrica de España"
  fuentes: [src-3, src-4, src-6]

superficie_parcela_m2: 71415
superficie_construida_m2: 47629
inversion_anunciada_eur: 1257183288

empleo:
  - tipo: construccion
    valor: 710
    referencia: "Empleos directos durante la fase de construcción"
    fecha_dato: "2026-05-12"
    fuentes: [src-2]
    nota: null
  - tipo: directo
    valor: 254
    referencia: "Puestos de trabajo en la fase de explotación"
    fecha_dato: "2026-05-12"
    fuentes: [src-2]
    nota: null

enlaces_proyecto:
  - "https://www.juntadeandalucia.es/boja/2026/104/37"

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta la potencia de acceso a red. El BOJA solo publica «150 MW de consumo eléctrico y
      100 MW de potencia IT»: la primera cifra describe la instalación completa, no el permiso de
      acceso, que suele ser distinto y no se ha localizado publicado.
    fuentes: [src-1]
  - campo: superficie_parcela_m2
    descripcion: >-
      El BOJA da 71.415,79 m² de superficie ocupada y 47.629,40 m² edificables; las notas del
      PTA redondean a «más de 70.000 m²» y «más de 47.000 m²». Se toma el dato del BOJA.
    fuentes: [src-1, src-3]
  - campo: estado
    descripcion: >-
      La declaración de interés estratégico acelera la tramitación pero no equivale a licencia
      concedida. DCNN Magazine sitúa el inicio de obras en 2027; ninguna fuente consultada
      acredita permisos de construcción otorgados.
    fuentes: [src-1, src-5]
  - campo: conexion_electrica
    descripcion: >-
      El suministro desde el nudo SET Cártama procede de prensa regional y de la nota del PTA;
      no se ha localizado el expediente de acceso y conexión ni una resolución de Red Eléctrica.
      DCNN Magazine señala la restricción de red como «critical dependency» del proyecto.
    fuentes: [src-3, src-4, src-5]

  - campo: agua
    descripcion: >-
      Ni el BOJA ni las notas de la Junta o del parque tecnológico describen el sistema de
      refrigeración ni publican consumo de agua del proyecto. Campo agua omitido.
    fuentes: [src-1, src-2]

confianza: alta
ultima_verificacion: "2026-08-31"

