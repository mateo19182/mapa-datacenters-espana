id: merlin-edged-ribera-baja-arasur
nombre: "MERLIN Edged — Bilbao-Arasur Data Center Campus (Rivabellosa)"
alias:
  - "Bilbao-Arasur Data Center Campus"
  - "Edged Bilbao-Arasur"
  - "BIL01 / BIL02 / BIL03"
  - "Centro de datos de Arasur"
tipo: campus
operador: "MERLIN Edged (MERLIN Properties / Edged Energy)"
propietario: "MERLIN Properties SOCIMI"
modelo: hyperscale

ubicacion:
  municipio: "Ribera Baja/Erribera Beitia"
  provincia: "Álava"
  ccaa: "País Vasco"
  direccion: "Supermanzana 6, Plataforma Logística Arasur, Avenida Ribera Baja s/n, 01213 Rivabellosa"
  lat: 42.7268
  lon: -2.9175
  precision: aproximada
  fuentes: [src-2, src-3]

estado: parcialmente_operativo
estado_detalle: >-
  Primer edificio (DC3 / BIL03) inaugurado el 3 de diciembre de 2024. El campus
  se compone de tres edificios de centro de datos y uno administrativo. En agosto
  de 2026 el operador inició la tramitación del permiso ambiental de un cuarto y
  un quinto edificio, con entrada en operación prevista para 2030 y 2031.
estado_fuentes: [src-1, src-2, src-4, src-5]
fecha_puesta_en_servicio: "2024-12"

potencia:
  - tipo: it
    valor_mw: 300
    ambito: campus
    referencia: "Capacidad potencial del campus una vez completado"
    estado_asociado: anunciado
    fecha_dato: "2024-12-03"
    fuentes: [src-1, src-4]
    nota: "La nota de prensa de MERLIN dice literalmente '300 MW IT'."
  - tipo: it
    valor_mw: 118
    ambito: campus
    referencia: "'118 MW of critical capacity' del campus según la ficha comercial de Edged"
    estado_asociado: en_construccion
    fecha_dato: "2026-08-29"
    fuentes: [src-3, src-6]
    nota: >-
      La ficha de Edged habla de 'critical capacity'. Crónica Vasca (enero de 2026)
      atribuye los 118 MW a la suma de las fases 1 y 2, no al campus final.
  - tipo: it
    valor_mw: 48
    ambito: edificio
    referencia: "BIL01 (build-to-suit)"
    fecha_dato: "2026-08-29"
    fuentes: [src-3]
  - tipo: it
    valor_mw: 48
    ambito: edificio
    referencia: "BIL02 (build-to-suit)"
    fecha_dato: "2026-08-29"
    fuentes: [src-3]
  - tipo: it
    valor_mw: 22
    ambito: edificio
    referencia: "BIL03"
    fecha_dato: "2026-08-29"
    fuentes: [src-3]
  - tipo: it
    valor_mw: 80
    ambito: edificio
    edificio: "BIO-ARA 04"
    referencia: "Cuarto edificio, orientado a cargas de IA"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08-17"
    fuentes: [src-8, src-9]
    nota: "Entrada en servicio prevista en el primer semestre de 2030."
  - tipo: it
    valor_mw: 70
    ambito: edificio
    edificio: "BIO-ARA 05"
    referencia: "Quinto edificio, orientado a cargas de IA"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-08-17"
    fuentes: [src-8, src-9]
    nota: "Entrada en servicio prevista en el primer semestre de 2031."
  - tipo: it
    valor_mw: 12
    ambito: edificio
    edificio: "BIO-ARA 01 (repotenciación)"
    referencia: "Repotenciación del edificio 1 prevista para principios de 2029"
    estado_asociado: anunciado
    fecha_dato: "2026-04-29"
    fuentes: [src-8]
    nota: >-
      Incremento de capacidad sobre un edificio ya proyectado, no un edificio nuevo.
      No se suma a los 48 MW atribuidos a BIL01 por la ficha comercial de Edged
      porque no consta que ambas cifras se refieran a la misma unidad ni al mismo
      momento.
  - tipo: no_especificado
    valor_mw: 100
    ambito: campus
    referencia: "Capacidad final del campus según el proyecto presentado en la primera piedra (2022)"
    estado_asociado: anunciado
    fecha_dato: "2022-07-11"
    fuentes: [src-7]
    nota: >-
      Dato histórico, superado por el anuncio de 300 MW IT de diciembre de 2024. La
      fuente de 2022 hablaba de un suministro inicial de 3 MW y de 22 MW al terminar
      el primer edificio.

fases:
  - nombre: "Fase 1 — edificio DC3 / BIL03"
    estado: operativo
    fecha_puesta_en_servicio: "2024-12"
    superficie_m2: 24000
    fuentes: [src-1, src-4]
  - nombre: "Fase 2 — dos edificios adicionales (BIL01 y BIL02)"
    estado: en_construccion
    fuentes: [src-1, src-5]
  - nombre: "Fase 3 — tres edificios más"
    estado: anunciado
    fuentes: [src-1]
  - nombre: "Edificio 4 — BIO-ARA 04 (80 MW IT)"
    estado: en_tramitacion
    fecha_puesta_en_servicio: "2030"
    fuentes: [src-5, src-8, src-9]
  - nombre: "Edificio 5 — BIO-ARA 05 (70 MW IT)"
    estado: en_tramitacion
    fecha_puesta_en_servicio: "2031"
    fuentes: [src-5, src-8, src-9]

superficie_parcela_m2: 150000
inversion_anunciada_eur: 1700000000
refrigeracion: >-
  Sistema sin consumo de agua ('Advanced Waterless Cooling System', WUE
  0,00 l/kWh según Edged); PUE garantizado de 1,15. Los edificios 4 y 5 se proyectan
  con los mismos objetivos: PUE de hasta 1,15 y WUE de 0,0.

agua:
  circuito: sin_agua
  sistema: >-
    Advanced Waterless Cooling System de Edged (ThermalWorks): transferencia de calor
    por glicol con enfriadoras de aire en cubierta y evaporadores de circuito cerrado
    como refrigeración secundaria, con capacidad de 500 kW por pasillo caliente y
    redundancia N+1. Refrigeración sin consumo de agua según el operador.
  origen: null
  nota: >-
    La ficha de Edged declara «Water Usage Effectiveness (WUE) 0.00 liters/kWh of
    cooling» y MERLIN, un WUE de 0,0 l/kWh, es decir, refrigeración sin consumo
    de agua. No se registra en el campo numérico porque ninguna fuente publica una
    medición, solo un objetivo de diseño. La declaración procede del operador (ficha comercial de Edged y
    planificación presentada por MERLIN a sus inversores), no de una autorización
    ambiental. La documentación del expediente AAI00498 no se ha podido consultar.
  fuentes: [src-3, src-8, src-9]

conexion_electrica:
  subestacion: null
  tension_kv: null
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    MERLIN declara en su Capital Markets Day de 2026 que la fase III de Arasur cuenta
    con «la potencia eléctrica totalmente concedida (Granted)», pero no publica ni el
    nudo, ni la tensión, ni los MW del permiso de acceso. No se ha localizado la
    resolución de acceso y conexión.
  fuentes: [src-8]

empleo:
  - tipo: directo
    valor: 480
    referencia: "Operación de los edificios 4 y 5, a tres turnos de unas 80 personas cada uno"
    fecha_dato: "2026-08-17"
    fuentes: [src-5, src-9]
    nota: >-
      Cifra tomada de la documentación presentada para la autorización ambiental,
      según Crónica Vasca y DataCenterDynamics. No cubre los edificios 1, 2 y 3.

enlaces_proyecto:
  - "https://www.merlinproperties.com/activos/data-center-bilbao-arasur/"
  - "https://www.edged.es/bilbao-arasur"
  - "https://www.euskadi.eus/anuncio-administrativo/aai00498_anuncio-del-director-administracion-ambiental-que-se-somete-informacion-publica-proyecto-tecnico-y-estudio-impacto-ambiental-presentado-empresa-merlin-edged-s-l-actividad-centro-procesamiento-datos-termino-municipal-ribabellosa-ribera-baja-alava/web01-tramite/es/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      Conviven tres cifras: 300 MW IT como capacidad potencial del campus completo
      (MERLIN, 2024), 118 MW de 'critical capacity' en la ficha comercial de Edged
      para los tres edificios actuales, y '300 MW de capacidad repartidos en media
      docena de edificios' en prensa de agosto de 2026, además de los 100 MW del
      proyecto original de 2022. No se suman entre sí. A ello se añade que Material
      Eléctrico, glosando el Capital Markets Day de 2026, eleva el campus «hasta los
      350 MW» si se ejecuta un hipotético sexto edificio (BIO-ARA 06) de otros 70 MW,
      que no se registra por ser una opción y no un proyecto en tramitación. La propia
      ficha comercial de Edged muestra a agosto de 2026 dos rótulos contradictorios en
      la misma página: «118 MW Campus Capacity» y «100 MW Campus Capacity».
    fuentes: [src-1, src-3, src-5, src-6, src-7, src-8]
  - campo: potencia
    descripcion: >-
      Los edificios nuevos se nombran BIO-ARA 04 y BIO-ARA 05 en la documentación de
      inversores, mientras la ficha comercial de Edged nombra BIL01, BIL02 y BIL03 a
      los tres primeros. No se ha podido confirmar si «BIO-ARA 01» y «BIL01» son la
      misma unidad, de modo que los 12 MW de repotenciación y los 48 MW de BIL01 no
      se suman ni se tratan como lecturas rivales del mismo edificio.
    fuentes: [src-3, src-8]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 1.700 M€ citados por Crónica Vasca corresponden solo a los edificios 4 y 5,
      no al conjunto del campus.
    fuentes: [src-5]
  - campo: estado
    descripcion: >-
      La prensa de agosto de 2026 indica que MERLIN descarta destinar el campus a una
      de las gigafactorías europeas de IA, opción que se había planteado en enero de 2026.
    fuentes: [src-5]

confianza: alta
ultima_verificacion: "2026-08-31"

