id: telxius-estepona-estacion-cables-submarinos
nombre: "Estación de amarre de cables submarinos de Estepona — Telxius"
alias:
  - "Estación de amarre de Estepona"
tipo: edificio
operador: "Telxius (Grupo Telefónica)"
modelo: corporativo

ubicacion:
  municipio: "Estepona"
  provincia: "Málaga"
  ccaa: "Andalucía"
  lat: 36.4270
  lon: -5.1450
  precision: municipio
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Estación de amarre de cables submarinos supervisada de forma remota desde el Centro de Operaciones
  de Red de Telxius en Conil. Es el punto de aterraje del enlace Estepona–Tetuán (113 km,
  España–Marruecos, en servicio desde 1994) y uno de los dos aterrajes de la provincia de Málaga
  junto con Manilva. No es un centro de datos de colocation.
estado_fuentes: [src-1, src-2, src-3]

enlaces_proyecto: []

incertidumbres:
  - campo: potencia
    descripcion: "No consta potencia eléctrica. Campo omitido."
    fuentes: [src-1, src-2, src-3]
  - campo: ubicacion
    descripcion: >-
      Ninguna fuente publica dirección ni parcela de la estación. Coordenadas de municipio.
    fuentes: [src-1, src-2]
  - campo: tipo
    descripcion: >-
      Inclusión discutible en un inventario de centros de datos: es infraestructura de aterraje de
      cable submarino. Se incluye por su papel de conexión directa con Marruecos.
    fuentes: [src-1, src-2, src-3]

  - campo: propietario
    descripcion: >-
      El 16 de julio de 2026 Telefónica (70%) y Pontegadea (30%) iniciaron el proceso de venta del
      100% de Telxius, con un precio de salida estimado en 1.200 millones de euros y mandato a
      Guggenheim y JPMorgan. La operación no estaba cerrada a la fecha de verificación, por lo que se
      mantiene la titularidad registrada.
    fuentes: [src-venta]

confianza: baja
ultima_verificacion: "2026-08-31"

