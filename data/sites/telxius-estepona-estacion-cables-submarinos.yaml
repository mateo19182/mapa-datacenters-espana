estado_detalle: >-
  Estación de amarre de cables submarinos supervisada de forma remota desde el Centro de Operaciones
  de Red de Telxius en Conil. Es el punto de aterraje del enlace Estepona–Tetuán (113 km,
  España–Marruecos, en servicio desde 1994) y uno de los dos aterrajes de la provincia de Málaga
  junto con Manilva. No es un centro de datos de colocation.
estado_fuentes: [src-1, src-2, src-3]

