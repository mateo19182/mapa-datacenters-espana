incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Equinix y ACCIÓ describen BA2 como "situado junto al BA1 existente,
      formando un campus", pero las coordenadas publicadas por PeeringDB sitúan
      BA1 (Carrer de l'Acer 30-32, Barcelona) y BA2 (Carretera del Mig 219,
      08907) a unos 3,2 km de distancia y en municipios distintos. Se registran
      como dos emplazamientos separados. PeeringDB anota la ciudad como
      "Barcelona" pese al código postal 08907, que corresponde a L'Hospitalet de
      Llobregat.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      La inversión de 52 M€ que cita ACCIÓ es descrita en otras fuentes como
      inversión total de Equinix en Barcelona (BA1 + BA2), no solo BA2.
    fuentes: [src-2]

