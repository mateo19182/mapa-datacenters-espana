    nota: >-
      La fuente oficial de ACCIÓ dice "a capacity of 3.41 MW" sin precisar si es
      carga TI. Prensa especializada cita "3.4MW across 27,150 sq ft".

superficie_construida_m2: 2500
inversion_anunciada_eur: 52000000
refrigeracion: >-
  Energía 100% renovable; diseño orientado a certificación LEED. El edificio se
  organiza en un bloque técnico de tres plantas con un data hall de unos 1.000 m²
  por planta, cada uno con sistemas propios de energía y climatización, y usa
  confinamiento de pasillo caliente. Redundancia 2N en alimentación y N+1 en
  refrigeración según la ficha del IBX.

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Equinix y ACCIÓ describen BA2 como "situado junto al BA1 existente,
      formando un campus", pero las coordenadas publicadas por PeeringDB sitúan
      BA1 (Carrer de l'Acer 30-32, Barcelona) y BA2 (Carretera del Mig 219,
      08907) a unos 3,2 km de distancia y en municipios distintos. Se registran
      como dos emplazamientos separados. PeeringDB anota la ciudad como
      "Barcelona" pese al código postal 08907, que corresponde a L'Hospitalet de
      Llobregat.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      La inversión de 52 M€ que cita ACCIÓ es descrita en otras fuentes como
      inversión total de Equinix en Barcelona (BA1 + BA2), no solo BA2. El
      Periódico cifró la inversión en «56 millones de dólares (más de 50 millones
      de euros)». Ninguna fuente tipifica los 3,41 MW.
    fuentes: [src-2, src-4]
  - campo: superficie_construida_m2
    descripcion: >-
      ACCIÓ y El Periódico dan 2.500 m²; la ficha del IBX publica «27,147 Square
      feet (ft²)» y el relato de la visita describe tres data halls de unos 1.000
      m² cada uno. Las tres lecturas no se reconcilian y no se convierten
      unidades.
    fuentes: [src-2, src-3, src-4]

