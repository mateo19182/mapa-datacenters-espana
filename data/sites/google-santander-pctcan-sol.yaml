estado_detalle: >-
  La Sociedad Gestora del PCTCAN, dependiente de la Consejería de Industria, Empleo,
  Innovación y Comercio del Gobierno de Cantabria, formalizó en mayo de 2026 la venta
  a Google de una parcela de 5.907,72 m² para instalar una estación de entronque o
  centro de transmisión de datos vinculado al cable submarino de fibra óptica Sol,
  que conectará desde Cantabria Europa con Estados Unidos, las islas Bermudas y las
  Azores, y será el primer cable de fibra óptica con conexión directa en servicio
  entre Europa y Florida. Con esta venta el PCTCAN alcanza el 99% de ocupación de sus
  240.000 m². No es un centro de datos de colocación: es infraestructura de aterraje
  y transmisión.
estado_fuentes: [src-1, src-2]

