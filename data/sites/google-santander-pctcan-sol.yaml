    titulo: "Buruaga anuncia la compra por parte de Google de una parcela en el PCTCAN para construir un centro de transmisión de datos vinculado al cable submarino SOL"
    editor: "Parque Científico y Tecnológico de Cantabria (PCTCAN) — Gobierno de Cantabria"
    tipo: oficial
    fecha_publicacion: "2026-05-06"
    fecha_consulta: "2026-08-31"
    cita: >-
      La Sociedad Gestora del Parque Científico y Tecnológico de Cantabria (PCTCAN),
      dependiente de la Consejería de Industria, Empleo, Innovación y Comercio del
      Gobierno de Cantabria, ha formalizado la venta a Google de una parcela de
      5.907,72 metros cuadrados para la instalación de una estación de entronque o
      centro de transmisión de datos vinculado al proyecto SOL. Se trata de un cable
      submarino transatlántico que conectará, desde Cantabria, Europa con Estados
      Unidos, las islas Bermudas y las Azores [...] Con la venta de esta parcela y de
      sus edificios de oficinas [...] el PCTCAN alcanza una ocupación del 99% de su
      superficie total (240.000 metros cuadrados).
