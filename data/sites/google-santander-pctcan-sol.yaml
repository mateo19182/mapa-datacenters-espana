estado_detalle: >-
  Google adquirió en mayo de 2026 a la Sociedad Gestora del PCTCAN una parcela de
  5.907,72 m² para construir una estación de entronque o centro de transmisión de
  datos vinculado al cable submarino de fibra óptica Sol, que conectará Cantabria
  con Estados Unidos (Florida), Bermudas y Azores. No es un centro de datos de
  colocación: es infraestructura de aterraje y transmisión.
