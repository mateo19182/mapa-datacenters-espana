estado_detalle: >-
  Primer centro de datos propio de Fortinet en España, inaugurado el 29 de enero de 2025 con
  la asistencia del presidente de Castilla-La Mancha. Da servicio de nube y SaaS de
  ciberseguridad —FortiCloud y SASE— a España, Francia, Alemania y Portugal. La compañía
  declara certificación Tier III y categoría alta del Esquema Nacional de Seguridad para los
  servicios prestados desde el centro. Fortinet lo incluye entre sus centros de datos en
  propiedad, junto a los de Atlanta, Chicago, Nueva York, Plano, Fráncfort y Sídney.
