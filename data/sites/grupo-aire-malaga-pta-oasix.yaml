estado_detalle: >-
  Primer centro de proceso de datos de Grupo Aire en Málaga, inaugurado en 2022 en el
  Málaga TechPark con una inversión de 2,5 millones de euros. Se suma a los CPD del grupo en
  Talavera de la Reina y Elche. Ocupa 400 m² con más de 74 racks y opera con energía de origen
  renovable.
