incertidumbres:
  - campo: potencia
    descripcion: >-
      Ninguna fuente primaria publica potencia eléctrica ni carga TI: las notas del propio grupo y
      del parque tecnológico no la citan y Baxtel la oculta tras un muro de pago. El único valor
      localizado, 1,2 MW, procede del directorio DC Atlas, que tampoco tipifica la magnitud ni cita
      su origen.
    fuentes: [src-1, src-2, src-3, src-5]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      La nota del parque tecnológico está fechada el 29 de abril de 2022 y el propio operador escribe
      que «Aire inauguró en abril de 2022 su Centro de datos Málaga»; la prensa económica lo dató el
      2 de mayo de 2022 y de ahí procede el valor registrado. Discrepancia de un mes sin resolver.
    fuentes: [src-1, src-2, src-4]
  - campo: ubicacion
    descripcion: >-
      El propio operador sitúa el CPD en la calle Rosalind Franklin del Málaga TechPark; no publica
      número ni parcela. Las coordenadas corresponden al recinto del parque.
    fuentes: [src-1, src-4]

