    fecha_dato: "2026-08-31"
    fuentes: [src-5]
    nota: >-
      «1.2 MW of live capacity». Es un directorio de terceros: ni el operador ni el parque
      tecnológico publican potencia, y la fuente no distingue carga TI de potencia contratada.

