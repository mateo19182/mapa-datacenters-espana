estado: operativo
estado_detalle: >-
  En funcionamiento desde 2016. Comercializado por el operador como «centro de datos de
  Alicante» pese a estar en término municipal de Elche, junto a las oficinas centrales del
  grupo. No entró en la venta de tres CPD a Templus de enero de 2026: Grupo Aire —hoy
  simplemente Aire— mantiene este centro como propio y en abril de 2026 relanzó su oferta
  de colocation apoyándose en la red de Templus, hasta 26 centros de datos comercializados.
  La ficha del operador lo describe como carrier neutral con conexión a Aire Networks,
  AMS-IX, LINX, DE-CIX, Equinix y Espanix.
estado_fuentes: [src-1, src-2, src-4]
fecha_puesta_en_servicio: "2016"

fases:
  - nombre: "Instalación única"
    estado: operativo
    fecha_puesta_en_servicio: "2016"
    superficie_m2: 500
    fuentes: [src-1]

superficie_construida_m2: 500
refrigeracion: >-
  Proyecto propio de placas solares con orientación este-oeste para autoconsumo, instaladas
  en acuerdo con la startup noruega Over Easy, que usa la sede de Elche como banco de
  pruebas de sus unidades fotovoltaicas premontadas; el resto del suministro se declara de
  origen renovable. No consta la potencia instalada de esas placas.

incertidumbres:
  - campo: potencia
    descripcion: >-
      El operador no publica potencia eléctrica; solo 500 m² y más de 55 racks. El
      directorio del Observatorio Español de Data Centers tampoco asigna MW, ni la ficha
      técnica del propio operador revisada en agosto de 2026, ni el autoconsumo fotovoltaico
      instalado, del que no se publica potencia pico.
    fuentes: [src-1, src-3, src-4, src-5]
  - campo: superficie_construida_m2
    descripcion: >-
      La ficha comercial del operador dice «Más de 500 metros cuadrados» y «Más de 55
      racks»; los 500 m² registrados son por tanto un mínimo, no una medida cerrada.
    fuentes: [src-1, src-4]

confianza: media
