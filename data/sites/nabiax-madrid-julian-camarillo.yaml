    titulo: "Nabiax moderniza el Centro de Datos Julián Camarillo para responder a las nuevas demandas digitales"
    editor: "fibratel"
    tipo: empresa
    fecha_publicacion: "2026-05"
    fecha_consulta: "2026-08-31"
    cita: "El punto de partida era una infraestructura diseñada originalmente para entornos IT de baja densidad, con una capacidad aproximada de 2 kW por rack. El centro contaba con una sala IT de 2,5 MW totalmente operativa, sin posibilidad de ampliación física ni construcción de nuevas áreas ... Todo el proceso debía completarse en un plazo exigente de 12 meses ... La solución contempló el desplazamiento y reorganización de sistemas críticos, como los chillers y los cuadros de climatización, así como la reconfiguración de las alimentaciones eléctricas para soportar mayores densidades de carga. Se incorporaron nuevos sistemas de almacenamiento térmico y se sustituyeron equipos obsoletos, como transformadores ... La nueva configuración ofrece una elevada eficiencia energética y un uso optimizado del agua, apoyándose además en un suministro eléctrico proveniente al 100 % de fuentes renovables."
