id: edgeconnex-sant-boi-bcn01
nombre: "EdgeConneX EDCBCN01 — Carretera de la Santa Creu de Calafell"
alias:
  - "EdgeConneX Barcelona"
  - "EDCBCN01"
tipo: edificio
operador: "EdgeConneX"
propietario: "EdgeConneX"
modelo: colocation

ubicacion:
  municipio: "Sant Boi de Llobregat"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Carretera de la Santa Creu de Calafell 99"
  lat: 41.324942
  lon: 2.032896
  precision: exacta
  fuentes: [src-1]

estado: operativo
estado_detalle: >-
  Primer centro de EdgeConneX en España, en el eje del Baix Llobregat cerca del
  aeropuerto y contiguo a una subestación eléctrica según la propia compañía. La
  ficha técnica vigente describe los 8,4 MW N+1 como «diseño inicial» y sitúa la
  instalación junto a una subestación de la red de transporte. En 2023 la
  compañía anunció la ampliación de la capacidad eléctrica del campus a 8 MW y su
  conexión directa a la Barcelona Cable Landing Station de AFR-IX.
estado_fuentes: [src-2, src-3]

potencia:
  - tipo: no_especificado
    valor_mw: 8.4
    ambito: edificio
    referencia: "Capacidad total N+1 del edificio"
    estado_asociado: operativo
    fuentes: [src-2, src-3]
    nota: >-
      La compañía dice literalmente '8.4 MW N+1 total capacity'; la ficha técnica
      vigente lo formula como «8.4 MW N+1 initial design». No precisa si es carga
      TI o potencia instalada.

superficie_construida_m2: 3000

conexion_electrica:
  nota: >-
    La compañía sitúa el edificio «junto a una subestación de la red de
    transporte» (supergrid substation) y ofrece densidades de 20 kW o más por
    rack. No nombra la subestación ni publica tensión ni potencia de acceso.
  fuentes: [src-2, src-3]

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      PeeringDB sitúa la instalación en Sant Boi de Llobregat (CP 08830);
      directorios como Inflect y notas de prensa la sitúan en Viladecans (CP
      08840). La Carretera de la Santa Creu de Calafell (C-245) atraviesa ambos
      municipios. Se toma la asignación de PeeringDB, que es la que aporta
      coordenadas.
    fuentes: [src-1]
  - campo: superficie_construida_m2
    descripcion: >-
      EdgeConneX publica "Total space: 3000 m2"; una empresa de ingeniería que
      participó en la obra habla de una instalación de 7.600 m². No se ha
      resuelto si se refieren a superficies distintas (sala técnica vs parcela).
    fuentes: [src-2]
  - campo: potencia
    descripcion: >-
      Directorios terceros citan cifras de 2 MW y 3,4 MW para esta instalación,
      frente a los 8,4 MW que publica la compañía. No se ha localizado la fuente
      primaria de las cifras menores. Una reimpresión de S&P Global de julio de
      2023 titulaba que EdgeConneX «amplía la capacidad de potencia de su campus
      en Barcelona a 8 MW», cifra que tampoco coincide exactamente con los 8,4 MW
      de la ficha técnica.
    fuentes: [src-2, src-3, src-4]

confianza: media
ultima_verificacion: "2026-08-31"

