    titulo: "QUETTA DATA CENTERS INICIA LAS OBRAS DE SU DATA CENTER DE MADRID, DUPLICANDO SU CAPACIDAD A 20 MW, E IMPULSA SU EXPANSIÓN CON UN NUEVO PROYECTO EN BARCELONA"
