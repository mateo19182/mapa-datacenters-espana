    tipo: oficial
    fecha_publicacion: "2021-11-05"
    fecha_consulta: "2026-08-31"
    cita: "la instalación está ubicada en la Avenida Punto Com, 23, en el Parque Científico Tecnológico “TecnoAlcalá”, del término municipal de Alcalá de Henares ... Con fecha 30 de diciembre de 2014, se emitió Resolución de la Dirección General del Medio Ambiente de la Comunidad de Madrid por la que se otorga Autorización Ambiental Integrada (AAI) y se emite Declaración de Impacto Ambiental favorable a la empresa TELEFÓNICA GLOBAL TECHNOLOGY, S.A.U. ... Mediante Resolución de la Dirección General de Sostenibilidad y Cambio Climático de fecha 12 de marzo de 2020, se cambia la titularidad de la AAI a favor de DATA HOLDING FUTURE S.L.U. ... el titular remite aclaraciones de los grupos electrógenos de emergencia instalados y los que se van a sumar a la instalación. Siendo la potencia máxima de funcionamiento total con ampliación de 45,08 MWt, inferior a los 50 MWt que marca el límite de las actividades industriales incluidas en epígrafe 1.1 del Anejo I del Real Decreto Legislativo 1/2016 ... La modificación solicitada consiste en la construcción de un nuevo CPD, vinculado al ya existente y operativo (Fase 1), y la instalación de dos nuevos grupos electrógenos de emergencia de potencias 332 kW y 3.240 kW, y dos tanques de gasóleo B ... Segundo. Extinguir la Autorización Ambiental Integrada otorgada a la empresa DATA HOLDING FUTURE, S. L. U. mediante Resolución de 30 de diciembre de 2014, para su centro de proceso de datos, en el término municipal de Arganda del Rey (Madrid)"
  - id: src-6
    url: "https://elcomplutense.com/nabiax-800-millones-data-center-alcala/"
    titulo: "Nabiax prepara cerca de 800 millones para ampliar su campus de Alcalá y prevé más de 200 empleos estables"
    editor: "El Complutense"
    tipo: prensa_general
    fecha_publicacion: "2026-08-16"
    fecha_consulta: "2026-08-31"
    cita: "El proyecto ADC3 añadirá un tercer edificio al campus alcalaíno y elevará el complejo por encima de 100 megavatios de capacidad tecnológica instalada. - La compañía estima alrededor de 1.000 empleos durante las obras y más de 200 puestos directos e indirectos estables en la zona de Alcalá ... Nabiax proyecta una inversión cercana a 800 millones de euros para desarrollar ADC3 ... El edificio ADC2 incorporó seis salas tecnológicas de 1.000 metros cuadrados y una potencia de 14,4 megavatios, dentro de una estrategia que desde sus primeras fases contemplaba superar a largo plazo los 100 megavatios."
  - id: src-7
    url: "https://revistacloud.com/nabiax-prepara-800-millones-para-llevar-su-capacidad-de-centros-de-datos-a-140-mw/"
    titulo: "Nabiax prepara 800 millones para llevar su capacidad de centros de datos a 140 MW"
    editor: "Revista Cloud"
    tipo: prensa_especializada
    fecha_publicacion: "2026-08-17"
    fecha_consulta: "2026-08-31"
    cita: "Nabiax prepara una nueva etapa de crecimiento que contempla unos 800 millones de euros de inversión y el aumento de su capacidad desde los aproximadamente 35 MW actuales hasta 140 MW de potencia IT ... Entre sus características figura la posibilidad de disponer de hasta 100 MW de potencia IT asegurada en el campus, además de otros 110 MW solicitados pensando en necesidades futuras. Esto no significa que ADC3 vaya a incorporar inmediatamente toda esa capacidad ni que los 210 MW estén disponibles ... ADC3 también está diseñado para admitir hasta un 100 % de refrigeración líquida ... ADC3 tiene como objetivo un PUE de diseño de 1,2 ... Nabiax también plantea para el desarrollo electricidad procedente de fuentes renovables y un diseño con consumo de agua nulo para refrigeración."
