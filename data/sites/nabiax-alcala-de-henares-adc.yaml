id: nabiax-alcala-de-henares-adc
nombre: "Nabiax Alcalá Data Center (ADC1, ADC2, ADC3)"
alias:
  - "Alcalá Data Center"
  - "CDG Telefónica Alcalá de Henares"
  - "TecnoAlcalá (Telefónica)"
  - "Data Holding Future, S. L. U."
tipo: campus
operador: "Nabiax"
propietario: "Nabiax (grupo Aermont Capital)"
modelo: colocation

ubicacion:
  municipio: "Alcalá de Henares"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Avenida Punto Com 23, Parque Tecnológico TecnoAlcalá, 28805 Alcalá de Henares"
  lat: 40.519524
  lon: -3.341208
  precision: exacta
  fuentes: [src-3]

estado: ampliacion_en_construccion
estado_detalle: >-
  Dos edificios en servicio (ADC1 desde 2013, con certificación Tier IV de Uptime Institute;
  ADC2 desde 2021, diseñado y construido bajo estándar Tier III). En mayo de 2024 Nabiax anunció
  7,5 MW IT adicionales contratados por hiperescalares en este campus y un tercer edificio (ADC3)
  para llevar el conjunto a más de 100 MW IT.
estado_fuentes: [src-1, src-2]
fecha_puesta_en_servicio: "2013"

potencia:
  - tipo: it
    valor_mw: 22.3
    ambito: campus
    referencia: "Capacidad TI entregada por las dos primeras fases"
    estado_asociado: operativo
    fecha_dato: "2026-08-29"
    fuentes: [src-1]
    nota: "\"it delivers 22,3 MW IT Power, scalable to 100 MW in the medium term\"."
  - tipo: it
    valor_mw: 100
    ambito: campus
    referencia: "Objetivo de capacidad TI a medio plazo"
    estado_asociado: anunciado
    fecha_dato: "2024-05-07"
    fuentes: [src-1, src-2]
  - tipo: instalada_total
    valor_mw: 135
    ambito: campus
    referencia: "Potencia total asociada a los 100 MW IT objetivo"
    estado_asociado: anunciado
    fecha_dato: "2024-05-07"
    fuentes: [src-2]
    nota: "\"este campus de centros de datos alcanzará los 100 MW de potencia IT (135 MW totales)\"."
  - tipo: it
    valor_mw: 7.5
    ambito: fase
    referencia: "Nueva capacidad contratada en Alcalá con hiperescalares (2024)"
    estado_asociado: en_construccion
    fecha_dato: "2024-05-07"
    fuentes: [src-2]
  - tipo: it
    valor_mw: 14.4
    ambito: fase
    referencia: "ADC2, potencia declarada al describir sus seis salas técnicas"
    estado_asociado: operativo
    fecha_dato: "2026-08-16"
    fuentes: [src-6]
    nota: >-
      «El edificio ADC2 incorporó seis salas tecnológicas de 1.000 metros cuadrados y una
      potencia de 14,4 megavatios». No cuadra por sí sola con los 22,3 MW IT que la compañía
      atribuye al conjunto de ADC1 y ADC2, y la fuente no dice si es carga TI o total; se
      registra como carga TI por coherencia con el resto de cifras del campus y se advierte de
      la duda en incertidumbres.
  - tipo: conexion_red
    valor_mw: 110
    ambito: campus
    referencia: "Capacidad adicional solicitada para ampliaciones futuras del campus"
    estado_asociado: anunciado
    fecha_dato: "2026-08-17"
    fuentes: [src-7]
    nota: >-
      La documentación del proyecto ADC3 habla de «hasta 100 MW de potencia IT asegurada en el
      campus, además de otros 110 MW solicitados pensando en necesidades futuras». Los 110 MW se
      registran como potencia de acceso solicitada, que es lo que la fuente da a entender, y no
      se suman a los 100 MW de carga TI.
  - tipo: termica_respaldo
    valor_mw: 45.08
    ambito: campus
    referencia: "Potencia máxima de funcionamiento de los grupos electrógenos con la ampliación"
    estado_asociado: operativo
    fecha_dato: "2021-11-05"
    fuentes: [src-5]
    nota: >-
      Cifra de la resolución que extingue la autorización ambiental integrada: «potencia máxima
      de funcionamiento total con ampliación de 45,08 MWt, inferior a los 50 MWt que marca el
      límite» del epígrafe 1.1 del anejo I del Real Decreto Legislativo 1/2016. Es potencia
      térmica de los grupos diésel de emergencia, no capacidad del centro de datos.

fases:
  - nombre: "ADC1"
    estado: operativo
    fecha_puesta_en_servicio: "2013"
    superficie_m2: 4800
    fuentes: [src-1]
  - nombre: "ADC2"
    estado: operativo
    fecha_puesta_en_servicio: "2021"
    superficie_m2: 6000
    fuentes: [src-1]
  - nombre: "ADC3"
    estado: anunciado
    fuentes: [src-2, src-6, src-7]

superficie_construida_m2: 10800
inversion_anunciada_eur: 800000000
refrigeracion: >-
  ADC1: chillers 2N y UTA N+2. ADC2: chiller N y UTA N+1. Campus alimentado al 100% con energías
  renovables. ADC3 se proyecta con capacidad para hasta un 100% de refrigeración líquida, PUE de
  diseño de 1,2 y, según la compañía, consumo de agua nulo para refrigeración.

agua:
  circuito: desconocido
  sistema: >-
    ADC1 y ADC2 se refrigeran con enfriadoras y unidades de tratamiento de aire redundantes. Para
    ADC3, aún sin construir, Nabiax plantea un diseño con consumo de agua nulo para refrigeración
    y hasta un 100% de refrigeración líquida.
  origen: null
  consumo_m3_ano: null
  wue_l_kwh: null
  nota: >-
    La afirmación de consumo nulo se refiere solo al edificio proyectado ADC3; no hay dato de
    consumo, WUE ni tipo de circuito para los dos edificios en servicio, por lo que el circuito
    del campus se deja como desconocido.
  fuentes: [src-7]

empleo:
  - tipo: construccion
    valor: 1000
    referencia: "Obras de ADC3"
    fecha_dato: "2026-08"
    fuentes: [src-6]
    nota: "«alrededor de 1.000 los puestos vinculados a la fase de construcción»."
  - tipo: total
    valor: 200
    referencia: "Empleo directo e indirecto estable en la zona una vez operativa la ampliación"
    fecha_dato: "2026-08"
    fuentes: [src-6]
    nota: >-
      La fuente dice «más de 200 los empleos directos e indirectos que permanecerían
      posteriormente en la zona», de modo que 200 es un suelo y no una cifra cerrada.
enlaces_proyecto:
  - "https://nabiax.com/en/our-data-centers/spain/alcala-data-center/"

incertidumbres:
  - campo: superficie_construida_m2
    descripcion: >-
      La ficha de Nabiax da 4.800 m² (ADC1) + 6.000 m² (ADC2) y "over 10,000 m² of IT space",
      mientras que la nota de 2024 afirma que al completar la segunda fase el campus tendrá
      22.000 m² dedicados a salas IT. Las dos cifras no son conciliables sin más información.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      Un reportaje de prensa generalista de 2026 atribuye 50 MW a la instalación de Nabiax en
      TecnoAlcalá, cifra que no coincide con los 22,3 MW IT que publica la compañía ni con los
      100 MW objetivo.
    fuentes: [src-1, src-4]
  - campo: estado
    descripcion: >-
      La resolución de extinción de la autorización ambiental integrada, de 5 de noviembre de
      2021, tiene un desajuste interno: el título, la dirección, la baja en el PRTR y todo el
      cuerpo del expediente sitúan la instalación en Alcalá de Henares, pero el punto segundo de
      la parte dispositiva dice extinguir la autorización «para su centro de proceso de datos,
      en el término municipal de Arganda del Rey (Madrid)». Se conserva la lectura de Alcalá de
      Henares, que es la que sostiene el resto del documento, y se deja constancia del choque.
    fuentes: [src-5]

  - campo: potencia
    descripcion: >-
      Los 14,4 MW que la prensa local atribuye a ADC2 no encajan con los 22,3 MW IT que Nabiax
      declara para ADC1 y ADC2 juntos si se toma ADC1 con la capacidad que tenía al inaugurarse;
      ninguna fuente desglosa la capacidad por edificio, y la de ADC2 no dice si es carga TI o
      potencia total.
    fuentes: [src-1, src-6]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 800 millones de euros aparecen con dos alcances distintos en dos crónicas de la misma
      semana: la prensa local los atribuye al desarrollo de ADC3 en Alcalá, mientras que la
      prensa especializada los presenta como la inversión de toda la nueva etapa de crecimiento
      de Nabiax, que incluye Julián Camarillo, Terrassa y posibles proyectos en el extranjero. Se
      registra la cifra en la ficha del campus porque es donde una de las dos fuentes la sitúa,
      pero puede no ser específica de este emplazamiento.
    fuentes: [src-6, src-7]
  - campo: potencia
    descripcion: >-
      La documentación de ADC3 mezcla tres magnitudes en la misma frase: 100 MW de potencia IT
      asegurada para el campus, 110 MW adicionales solicitados y un objetivo global de compañía
      de 140 MW IT. Los 100 MW coinciden con el objetivo de campus que Nabiax publica desde 2024,
      de modo que probablemente sean la misma cifra vista dos veces y no capacidad nueva.
    fuentes: [src-1, src-2, src-7]

confianza: alta
ultima_verificacion: "2026-08-31"

