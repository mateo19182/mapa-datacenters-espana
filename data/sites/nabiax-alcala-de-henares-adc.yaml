estado: ampliacion_en_construccion
estado_detalle: >-
  Dos edificios en servicio (ADC1 desde 2013, con certificación Tier IV de Uptime Institute;
  ADC2 desde 2021, diseñado y construido bajo estándar Tier III). En mayo de 2024 Nabiax anunció
  7,5 MW IT adicionales contratados por hiperescalares en este campus y un tercer edificio (ADC3)
  para llevar el conjunto a más de 100 MW IT.
