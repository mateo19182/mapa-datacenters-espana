estado_detalle: >-
  Se incluye en el mapa por su condición de infraestructura de cómputo público, no como centro
  de datos comercial. La Universitat de València aloja el supercomputador Tirant en el campus
  de Burjassot, gestionado por el Servei d'Informàtica, que declara disponer de un centro de
  procesado de datos «con una gran capacidad eléctrica y frigorífica» sin publicar ninguna
  cifra. Tirant se inauguró en enero de 2008 y va por su cuarta generación; el SIUV construyó
  un nuevo CPD y trasladó la máquina a una nueva ubicación, lo que obligó a cambiar el
  programa de visitas. El 50 % de Tirant 4 se destina a la RES.
estado_fuentes: [src-res, src-mincyt, src-visitas]

