incertidumbres:
  - campo: potencia
    descripcion: >-
      El SIUV afirma que su CPD tiene «una gran capacidad eléctrica y frigorífica», pero ni la
      universidad ni la RES publican ninguna cifra: ni potencia, ni carga TI, ni superficie.
      Campo de potencia vacío pese a ser el único emplazamiento del registro cuya propia fuente
      presume de capacidad eléctrica sin cuantificarla.
    fuentes: [src-res]
  - campo: computo
    descripcion: >-
      La ficha del nodo en la RES da «Main memory 27 648 TB» para Tirant 4, cifra imposible que
      corresponde a 27,648 TB leídos con separador decimal español. No se registra memoria.
    fuentes: [src-res]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas son las del número 50 de la calle Doctor Moliner, dirección postal del
      SIUV. La máquina se trasladó a un CPD de nueva construcción dentro del mismo campus y
      ninguna fuente publica en qué edificio concreto está ahora.
    fuentes: [src-visitas, src-osm]

