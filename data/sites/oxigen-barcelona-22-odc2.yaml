estado: operativo
estado_detalle: >-
  Segundo centro de Oxigen en Barcelona, identificado por la propia compañía como ODC2
  en 22@ y por Uptime Institute como Oxigen Data Center 2, Barcelona. Las entrevistas al
  consejero delegado describen la operación del antiguo espacio MediaCloud de Mediapro,
  distinto del centro de Sant Cugat y del adquirido a Banc Sabadell en Sant Fruitós de
  Bages. Uptime acredita diseño Tier III; esa certificación no se presenta como una
  certificación de instalación construida u operación.
estado_fuentes: [src-oxigen-linkedin, src-viaempresa, src-oneconomia-20260407, src-uptime-odc2, src-uptime-lista]
potencia: []

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      La propia compañía confirma el nombre ODC2 y el distrito 22@. La prensa lo vincula
      con el espacio MediaCloud adquirido a Mediapro. Directorios históricos sitúan
      MediaCloud en Diagonal 177, edificio Imagina, pero no se ha leído una fuente primaria
      que confirme esa dirección para el ODC2 actual. No se fija dirección exacta ni pin.
    fuentes: [src-oxigen-linkedin, src-viaempresa, src-directorio-mediacloud]
  - campo: potencia
    descripcion: >-
      No se publica potencia individual contrastada para ODC2. No se asignan los 10 o
      20 MW agregados de la plataforma ni los 8 MW que el Observatorio atribuye a un ODC2
      situado erróneamente en Sant Fruitós de Bages.
    fuentes: [src-oneconomia-20260407, src-observatorio]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      No se ha localizado fecha propia de apertura de ODC2 bajo Oxigen. La fecha de
      apertura histórica de MediaCloud y la de su compra no se usan como inauguración
      de este centro sin una relación documental completa.
    fuentes: [src-viaempresa, src-directorio-mediacloud]

