id: digital-valley-picassent
nombre: "Digital Valley Comunitat Valenciana — Picassent"
alias:
  - "Digital Valley Picassent"
  - "Valle de los data centers del Mediterráneo"
tipo: campus
operador: "Digital Valley Comunitat Valenciana"
propietario: "Digital Valley Spain (grupo Sales4U / Sales For You Consulting)"
modelo: desconocido

ubicacion:
  municipio: "Picassent"
  provincia: "Valencia"
  ccaa: "Comunitat Valenciana"
  lat: 39.3635
  lon: -0.4612
  precision: municipio
  fuentes: [src-1]

estado: en_tramitacion
estado_detalle: >-
  Acuerdo de intenciones firmado con la Generalitat Valenciana y el Ayuntamiento de
  Picassent el 28/01/2025. A febrero de 2026 el proyecto seguía pendiente del permiso de
  acceso y conexión: el MITECO no había concedido la potencia solicitada y el promotor
  había presentado alegaciones. El plan de urbanización de las parcelas se definirá en la
  fase siguiente. Puesta en servicio prevista por el promotor para 2028. En agosto de 2026,
  al presentar un tercer campus en Salas (Asturias), El Comercio recogía que ninguno de los
  dos proyectos anteriores de la promotora —San Sebastián de los Reyes (Madrid, 2023) y
  Picassent— está aún en marcha.
estado_fuentes: [src-1, src-2, src-6, src-7]

potencia:
  - tipo: no_especificado
    valor_mw: 200
    ambito: campus
    referencia: "Capacidad máxima del campus"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-01-28"
    fuentes: [src-1, src-2, src-3, src-4, src-6]
    nota: >-
      Las fuentes hablan de «instalar una capacidad de 200 MW» / «capacidad máxima de
      200 MW» sin especificar si es carga TI o potencia de conexión.
  - tipo: conexion_red
    valor_mw: 150
    ambito: fase
    referencia: "Primera fase — potencia solicitada al Gobierno (MITECO)"
    estado_asociado: en_tramitacion
    fecha_dato: "2026-02-03"
    fuentes: [src-2]
    nota: >-
      Las Provincias: «La primera fase del mismo requiere algo más de 150 MW de potencia
      [...] Al menos esa es la cantidad solicitada al Gobierno». Es potencia de acceso
      solicitada, no concedida.

fases:
  - nombre: "Fase 1"
    estado: en_tramitacion
    fuentes: [src-2]

conexion_electrica:
  mw_solicitados: 150
  mw_concedidos: null
  fuentes: [src-2]

superficie_parcela_m2: 773000
inversion_anunciada_eur: 2200000000
refrigeracion: >-
  Circuito cerrado de climatización; el promotor prevé recuperar el calor residual para
  alimentar el centro penitenciario de Picassent.

agua:
  circuito: cerrado
  sistema: "Circuito cerrado de climatización, según el promotor."
  origen: null
  nota: >-
    No consta ninguna cifra de consumo de agua ni WUE en las fuentes consultadas, pese a
    que el emplazamiento está a unos 2.800 metros del Parc Natural de l'Albufera y junto a
    la Séquia Reial del Xúquer, y a que las entidades opositoras han hecho del consumo
    hídrico el eje de sus alegaciones.
  fuentes: [src-5, src-8]

empleo:
  - tipo: no_especificado
    valor: 30000
    referencia: "Anuncio del president de la Generalitat en la firma del acuerdo de intenciones"
    fecha_dato: "2025-01-28"
    fuentes: [src-6]
    nota: >-
      Cifra política anunciada sin desglose entre empleo de obra, directo e inducido, y sin
      memoria pública que la sostenga. Se registra como anuncio, no como previsión validada.

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      Levante-EMV y datacentermarket.es citan «más de 2.200 millones» (cifra del anuncio
      oficial de enero de 2025); Las Provincias titula «2.300 millones» en un despiece de
      febrero de 2026. Se registra la cifra del anuncio original.
    fuentes: [src-1, src-2, src-3]
  - campo: potencia
    descripcion: >-
      Los 200 MW se anuncian sin tipo. No consta desglose entre carga TI y potencia de
      conexión, ni cuánta potencia ha sido finalmente otorgada. El promotor declara que
      arrancará con potencia inferior si el MITECO no concede los ~150 MW solicitados.
    fuentes: [src-1, src-2]
  - campo: superficie
    descripcion: >-
      77,3 ha totales, de las que 37 ha se destinan a data centers (29 ha edificables) y
      11,2 ha son dotacionales. No se ha localizado la superficie construida de los CPD.
    fuentes: [src-1, src-5, src-6]
  - campo: empleo
    descripcion: >-
      Los 30.000 empleos proceden de la nota de prensa de la Generalitat de enero de 2025 y
      no se han desglosado nunca. El colectivo vecinal Juntes pel Territori los califica de
      «mentida» comparándolos con la experiencia aragonesa. No hay memoria de empleo
      publicada que permita contrastar la cifra.
    fuentes: [src-6, src-8]
  - campo: estado
    descripcion: >-
      A 31/08/2026 el índice público de Proyectos de Interés Autonómico de la Conselleria de
      Medio Ambiente solo contiene cuatro expedientes (El Plantío Golf en Alicante, Armonia
      Green Castellón, PLD Space en Elche y el data center El Lobo en Monforte del Cid);
      Picassent no figura entre ellos. La ausencia en el índice no equivale a una denegación,
      pero tampoco consta admisión a trámite pública del PIA de Digital Valley.
    fuentes: [src-9]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La cifra de «casi 2.300 millones» reaparece en agosto de 2026 en El Comercio, junto a
      la de 200 MW de capacidad, lo que consolida la existencia de dos cifras de inversión
      en circulación (2.200 y 2.300 millones) sin que el promotor haya publicado una
      memoria económica.
    fuentes: [src-2, src-7]

confianza: media
