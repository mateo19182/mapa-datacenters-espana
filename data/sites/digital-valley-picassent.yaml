    fecha_consulta: "2026-08-29"
    cita: "El proyecto, presentado en 2025 como una inversión de más de 2.200 millones de euros [...] contempla la construcción de un campus tecnológico sobre una superficie de 77 hectáreas, de las cuales cerca de la mitad se destinarán directamente a instalaciones de data center."
  - id: src-5
