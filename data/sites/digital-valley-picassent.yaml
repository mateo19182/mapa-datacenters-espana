    fecha_publicacion: "2026-04-20"
    fecha_consulta: "2026-08-29"
    cita: "Digital Valley Comunitat Valenciana se ubicará, según el proyecto, sobre una superficie de 77,3 hectáreas en el término municipal de Picassent. En la actuación están previstos espacios de data centers para la gestión y almacenamiento de datos que ocuparán 37 hectáreas, de las que 29 serán edificables"
