    cita: "en cuanto a la gestión de los recursos hídricos, se indica que el sistema de climatización de los centros de datos desarrollados por Box2Bit se basa en un modo de enfriamiento mediante circuito cerrado de agua, lo que permite eliminar el consumo directo de agua en el proceso de climatización de sus salas, minimizando el consumo a volúmenes propios de otras industrias como la logística [...] Se incluye en la memoria estimación del consumo de agua en atención a los distintos usos: consumo operacional, consumo no operacional y consumo de las zonas verdes."
