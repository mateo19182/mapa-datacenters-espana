estado_detalle: >-
  Obra licitada por la Agencia Digital de Andalucía y Sandetel en el DOUE; construcción iniciada en
  el segundo semestre de 2024 sobre el solar del antiguo Palenque de la Isla de la Cartuja, con
  finalización prevista en el primer semestre de 2026. No se ha localizado confirmación pública de
  la puesta en servicio a fecha de verificación.
