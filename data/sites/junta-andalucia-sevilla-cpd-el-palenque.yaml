id: junta-andalucia-sevilla-cpd-el-palenque
nombre: "Centro de Proceso de Datos 'El Palenque' — Junta de Andalucía, Isla de la Cartuja"
alias:
  - "CPD El Palenque"
  - "CPD de la Junta de Andalucía en La Cartuja"
tipo: edificio
operador: "Agencia Digital de Andalucía (ADA) / Sandetel"
propietario: "Junta de Andalucía"
modelo: corporativo

ubicacion:
  municipio: "Sevilla"
  provincia: "Sevilla"
  ccaa: "Andalucía"
  direccion: "Calle Camino de los Descubrimientos, 9 (solar del antiguo Palenque), Parque Científico y Tecnológico Cartuja, 41092 Sevilla"
  lat: 37.4083
  lon: -6.0057
  precision: aproximada
  fuentes: [src-1, src-2, src-4]

estado: en_construccion
estado_detalle: >-
  Obra licitada por la Agencia Digital de Andalucía y Sandetel en el DOUE. La primera piedra se
  colocó el 5 de diciembre de 2025 en el solar del antiguo Palenque de la Isla de la Cartuja, con la
  maquinaria entrando en la parcela desde finales de septiembre de 2025. A 30 de agosto de 2026
  seguía en obras: la prensa económica lo cita, junto al SP01 de Escúzar, como uno de los dos únicos
  centros de datos andaluces con obras en marcha. El pliego técnico del equipamiento crítico
  (Sandetel, expediente 24-00025) lo diseña para certificación Tier III del Uptime Institute.
estado_fuentes: [src-1, src-2, src-3, src-5, src-6]

potencia:
  - tipo: it
    valor_mw: 0.85
    ambito: edificio
    referencia: "Carga máxima de salida de los sistemas de SAI destinados a cargas IT"
    estado_asociado: en_construccion
    fecha_dato: "2024-05-24"
    fuentes: [src-4]
    nota: >-
      El pliego de prescripciones técnicas de Sandetel dimensiona los SAI de cargas IT para
      garantizar 850 kW de salida (935 kW con el coeficiente de seguridad del 10%), repartidos en
      cuatro sistemas de dos SAI modulares de 500 kW en paralelo. Es la única cifra de potencia
      publicada del edificio y se refiere a la carga IT, no al suministro contratado.
  - tipo: termica_respaldo
    valor_mw: 1.75
    ambito: edificio
    referencia: "Cada uno de los cuatro grupos electrógenos de emergencia"
    estado_asociado: en_construccion
    fecha_dato: "2024-05-24"
    fuentes: [src-4]
    nota: >-
      Cuatro grupos en contenedor insonorizado sobre cubierta, de 2.250 kVA / 1.750 kW nominales
      cada uno. Es potencia de respaldo, no capacidad del centro de datos, y no se suma a nada.

fases:
  - nombre: "Módulo CPD"
    estado: en_construccion
    superficie_m2: 1900
    fuentes: [src-1, src-3]
  - nombre: "Módulo de Operaciones"
    estado: en_construccion
    fuentes: [src-1, src-3]

superficie_parcela_m2: 5150
superficie_construida_m2: 6240
inversion_anunciada_eur: 34100000
refrigeracion: >-
  Refrigeración por gas mediante expansión directa, en lugar del sistema tradicional basado en agua.
  Autoconsumo con plataforma fotovoltaica de más de 20.000 m².

agua:
  circuito: sin_agua
  sistema: >-
    Climatización de la sala IT con equipos tipo Roof-Top sobre cubierta y refrigeración por gas
    mediante expansión directa, que sustituye al uso de agua.
  origen: null
  nota: >-
    La Junta lo presenta como «una medida pionera» justificada por «el contexto de sequía
    estructural de la región». No se publica ningún consumo de agua residual (servicios sanitarios u
    otros usos), por lo que el circuito se registra como sin_agua solo en cuanto a refrigeración.
  fuentes: [src-1, src-4, src-5]

enlaces_proyecto: []

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      La Junta y Data Center Market cifran el presupuesto en 34,1 millones de euros cofinanciados
      con fondos Next Generation; la nota de Sevilla TechPark y la nota de la Junta del acto de la
      primera piedra hablan de 35 millones, y el subdelegado del Gobierno situó en unos 23 millones
      la aportación del Plan de Recuperación «de los 34 que son necesarios aproximadamente». Se
      mantiene la cifra de 34,1 millones.
    fuentes: [src-1, src-2, src-3, src-5]
  - campo: superficie_construida_m2
    descripcion: >-
      Sevilla TechPark da 5.150 m² de superficie con 6.240 m² de edificabilidad. La nota de la Junta
      y Data Center Market desglosan 1.900 m² de sala de equipos más 2.084 m² de infraestructura en
      el módulo CPD, más un módulo de operaciones de tres plantas para unos 140 puestos. Las cifras
      no son directamente conciliables.
    fuentes: [src-1, src-2, src-3]
  - campo: potencia
    descripcion: >-
      Ninguna nota de prensa de la Junta publica potencia. Los 850 kW de carga IT proceden del
      pliego técnico del equipamiento crítico, que es un requisito mínimo de licitación y puede
      diferir de lo finalmente instalado; el mismo pliego contiene una incoherencia interna en los
      SAI de cargas mecánicas («350 kW (+10% de coeficiente de seguridad 650 kW aprox.)»). No consta
      la potencia contratada en el punto de suministro.
    fuentes: [src-4]
  - campo: empleo
    descripcion: >-
      Ninguna fuente publica empleo creado. Los «140 puestos» que citan la Junta y Data Center Market
      son las plazas de trabajo que alberga el módulo de operaciones, no una cifra de contratación,
      así que no se registran como empleo.
    fuentes: [src-1, src-3]
  - campo: estado
    descripcion: >-
      La nota de licitación de 2024 preveía el arranque de la obra en el segundo semestre de ese año
      y la finalización en el primer semestre de 2026; la obra empezó en realidad a finales de 2025
      y en agosto de 2026 seguía en construcción, sin nota de inauguración ni de puesta en servicio.
    fuentes: [src-1, src-5, src-6]

