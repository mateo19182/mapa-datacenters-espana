incertidumbres:
  - campo: ubicacion
    descripcion: >-
      Ni Iberdrola ni Echelon publican el municipio: sus notas hablan de «Madrid
      Sur» y de «zonas estratégicas cerca de la capital». La atribución más
      concreta y mejor sostenida procede de Cinco Días, que el 26 de noviembre de
      2025 escribió, citando «fuentes del mercado», que el campus «se instalará en
      terrenos de la central de ciclo combinado de Aceca, ubicada en Toledo en el
      límite con Madrid»; El Mundo recogió esa misma atribución el 18 de agosto de
      2026 remitiéndose expresamente a Cinco Días. La central de Aceca está, según
      el BOE, en el término municipal de Villaseca de la Sagra (Toledo). Pero
      ninguna fuente nombra el municipio del centro de datos: llegar a él exige
      encadenar «terrenos de Aceca» con «Aceca está en Villaseca», que es una
      deducción, no un dato publicado. Ambas atribuciones son además de fuentes de
      mercado no identificadas y contradicen el nombre comercial que usan las
      propias compañías. Se conserva la contradicción y el emplazamiento se deja
      sin ubicar: no aparece en el mapa ni en las vistas por región.
    fuentes: [src-1, src-2, src-3, src-4, src-5, src-9]
  - campo: ubicacion
    descripcion: >-
      El proyecto no es el único de la cartera y las fuentes lo mezclan con otros.
      Cinco Días añade que «otro de los centros» de la sociedad conjunta se
      ubicaría «en el norte de Madrid», donde se estarían mirando distintos
      emplazamientos. Un blog financiero atribuye a la empresa conjunta dos
      emplazamientos, «Aceca (Madrid, 144 MW iniciales) y Velilla (Palencia)»,
      situando Aceca en Madrid cuando está en Toledo; no se ha localizado ninguna
      fuente que documente un centro de datos de Echelon o de Iberdrola en Velilla
      del Río Carrión, donde Iberdrola sí desmanteló su central térmica y donde hay
      un complejo fotovoltaico y una central de bombeo de otros promotores.
    fuentes: [src-3, src-4, src-10]
  - campo: potencia
    descripcion: >-
      Los 230 MW de conexión y los 144 MW de procesamiento proceden de la misma
      nota corporativa pero no son la misma magnitud y no se convierten entre sí.
      La nota añade una demanda estimada de 1 TWh anuales (1.000 GWh), que es
      energía y no potencia. No consta la potencia instalada total ni el reparto
      por edificios o fases.
    fuentes: [src-1, src-2, src-6]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 1.200 millones de euros son la cifra que la prensa financiera
      especializada atribuye específicamente a Madrid Sur, citando «una fuente
      próxima al proyecto»; el resto del artículo está tras muro de pago. No es
      una cifra publicada por las compañías. Los más de 2.000 millones que sí
      anuncian Iberdrola y Echelon corresponden a la inversión prevista de toda la
      sociedad conjunta en España, no a este emplazamiento, y la matriz habla
      además de nuevos proyectos que podrían sumar 6.000 millones.
    fuentes: [src-8, src-6, src-4]

confianza: baja
