estado: anunciado
estado_detalle: >-
  Primer proyecto de la empresa conjunta entre Iberdrola (20 %, a través de su
  filial CPD4Green) y Echelon Data Centres (80 %), anunciada en julio de 2025,
  autorizada por la Comisión Europea el 11 de noviembre de 2025 y cerrada el 26 de
  noviembre de 2025. En febrero de 2026 la prensa financiera especializada situaba
  la decisión final de inversión antes de que acabara 2026 y el cierre de la
  financiación a principios de 2027. Echelon anunció en julio de 2025 una entrada
  en servicio prevista para 2030. A 31 de agosto de 2026 no consta inicio de obras
  ni expediente urbanístico o ambiental localizable. Ninguna de las dos compañías
  ha publicado el municipio: hablan de «Madrid Sur» y de «zonas estratégicas cerca
  de la capital».
estado_fuentes: [src-1, src-2, src-4, src-6, src-7, src-8]

