incertidumbres:
  - campo: superficie_parcela_m2
    descripcion: >-
      La superficie total del ámbito del PIGA es de 4.087.850 m², de los que 682.929 m²
      corresponden al sector urbanístico del campus y 3.404.921 m² a las infraestructuras
      energéticas, logísticas y de comunicaciones. Se registra la del sector del campus.
    fuentes: [src-1]
  - campo: agua
    descripcion: >-
      La cifra de 460.000 m³/año es un máximo condicionado, no un consumo previsto: 450.000
      de los 460.000 corresponden a un sistema de pulverización de agua que la memoria
      califica de "optativo y sujeto a la disponibilidad del recurso hídrico" y del que
      afirma poder prescindir sin pérdida operativa. Si no se usa, el consumo declarado baja
      a unos 10.000 m³/año. Las dos lecturas se separan por un factor de 46 y la
      documentación no fija cuál se producirá.
    fuentes: [src-5]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas registradas son el centroide municipal de Luceni (Wikidata); el
      ámbito del PIGA se extiende además a Pedrola, Plasencia de Jalón y Rueda de Jalón.
    fuentes: [src-1, src-3]

