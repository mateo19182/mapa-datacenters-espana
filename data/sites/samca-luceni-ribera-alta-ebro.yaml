    estado_asociado: en_tramitacion
    fecha_dato: "2025-11-21"
    fuentes: [src-1]
    nota: >-
      "siendo la potencia activa máxima que será absorbida de la Red de Transporte por los
      tres edificios, de 300 MW, al tener en consideración la potencia IT indicada, el valor
      de diseño del Peak PUE y los coeficientes de simultaneidad".
  - tipo: termica_respaldo
    valor_mw: 125.5
    ambito: edificio
    referencia: "Potencia eléctrica instalada de la planta de turbinas de gas de emergencia de cada edificio"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-11-21"
    fuentes: [src-1]
    nota: >-
      "una potencia eléctrica instalada del orden de 125,5 MWe por edificio" en tres plantas
      de generación de emergencia con 27 turbinas de gas en total (9 por centro de datos, en
      configuración N+1). Es generación de respaldo, no carga TI.

