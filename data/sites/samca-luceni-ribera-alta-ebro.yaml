    titulo: "Plan de Interés General de Aragón «Green It Aragón». Volumen I — Memoria PIGA, apartados 5.5 Consumo de agua del Campus de Datos, 5.6 Balance hídrico y 5.7 Abastecimiento"
    editor: "Gobierno de Aragón"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: "El consumo total de agua que se estima tendrá el Campus de Datos del PIGA Green IT Aragón, será inferior a 460.000 m³/año incluyendo la eventual reposición anual de los circuitos cerrados de refrigeración y de los tanques contra incendios, que supone aproximadamente 10.000 m³/año [...] así como el consumo de agua para el eventual apoyo de los sistemas de refrigeración mecánicos [...] siendo este último un consumo optativo y sujeto a la disponibilidad del recurso hídrico, y que sería de 450.000 m³/año. [...] El abastecimiento de agua del PIGA Green IT Aragón se realizará íntegramente desde el Canal Imperial de Aragón, a través de la toma única [...] autorizada actualmente a favor del Grupo SAMCA. [...] Los tres centros de datos utilizan un sistema de refrigeración basado en: Enfriadoras con compresores de levitación magnética. Free-cooling indirecto, operativo la mayor parte del año. Sistemas de apoyo puntual a la operación de las enfriadoras, consistente en la pulverización de agua en los radiadores o \"coolers\" de las mismas [...] En esta instalación, el PUE es de 1,25 y el Peak PUE de 1,45"
  - id: src-6
    url: "https://www.aragon.es/documents/d/guest/vol_i_a_memoria_piga"
    titulo: "Plan de Interés General de Aragón «Green It Aragón». Volumen I — Memoria PIGA, impacto laboral"
    editor: "Gobierno de Aragón"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: "Durante el periodo de obras de urbanización e infraestructura (2026–2029), se estiman 800 empleos directos y entre 560 y 1.050 empleos indirectos vinculados a obra civil, ingeniería, sistemas eléctricos, telecomunicaciones y logística especializada. En fase operativa, el Campus consolidará 150 empleos directos permanentes altamente cualificados y entre 90 y 150 empleos indirectos asociados a mantenimiento, supervisión digital, refrigeración industrial, ciberseguridad y servicios auxiliares."
  - id: src-7
    url: "https://www.aragon.es/documents/d/guest/vol_i_a_memoria_piga"
    titulo: "Plan de Interés General de Aragón «Green It Aragón». Volumen I — Memoria PIGA, plantas de generación eléctrica de emergencia"
    editor: "Gobierno de Aragón"
    tipo: oficial
    fecha_consulta: "2026-08-31"
    cita: "el conjunto del Campus dispone de tres plataformas de generación, con un total de 27 turbinas de gas (9 por centro de datos, en configuración N+1: ocho unidades operativas y una de reserva). Cada planta está concebida para garantizar el suministro eléctrico independiente de un centro de datos, con una potencia eléctrica instalada del orden de 125,5 MWe por edificio, lo que permite cubrir su carga crítica en caso de fallo del suministro exterior."
