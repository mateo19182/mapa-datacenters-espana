estado: en_tramitacion
estado_detalle: >-
  Declarado inversión de interés autonómico y de interés general de Aragón el 28 de abril de
  2025, con redelimitación del ámbito acordada el 10 de diciembre de 2025. El PIGA «Green
  It Aragón» se aprobó inicialmente por Orden FOM/1846/2025, de 23 de diciembre, y se
  sometió a información pública junto con su documentación ambiental. El ámbito abarca los
  términos municipales de Luceni, Pedrola, Plasencia de Jalón y Rueda de Jalón; el campus
  se sitúa en Luceni y el resto corresponde a las infraestructuras energéticas y de
  comunicaciones.
estado_fuentes: [src-1, src-2]

