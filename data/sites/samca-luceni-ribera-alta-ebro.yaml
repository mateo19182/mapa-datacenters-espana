conexion_electrica:
  subestacion: "Nueva SE «Ribera Alta del Ebro», conectada por tres líneas subterráneas de 220 kV a las SE «Jalón PRE», «Bayo» y «Camporroyo» (esta última de nueva construcción)"
  tension_kv: 220
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1, src-4]
  nota: >-
    El PIGA incluye la ampliación de tres subestaciones transformadoras ("Cantales", "Jalón
    PRE" y "Bayo"), la construcción de la nueva subestación "Camporroyo", tres líneas
    subterráneas de 220 kV y cinco líneas de fibra óptica, además de actuaciones en la red
    de E-Distribución (variante de la línea aérea de 15 kV "PEDROLA_2" y de la línea de
    45 kV "Borja - Renfe Luceni"). En 2026 se sometieron a información pública las
    autorizaciones administrativas de estas subestaciones, solicitadas por Molinos del Ebro,
    S.A.

superficie_parcela_m2: 682929
inversion_anunciada_eur: 2001800000
refrigeracion: >-
  Enfriadoras con compresores de levitación magnética y free cooling indirecto operativo la
  mayor parte del año, con pulverización opcional de agua sobre los radiadores de las
  enfriadoras. PUE objetivo de 1,25 y Peak PUE de 1,45.

agua:
  circuito: cerrado
  sistema: >-
    Enfriadoras con compresores de levitación magnética y free cooling indirecto operativo la
    mayor parte del año, en circuitos cerrados con reposición mínima. Como apoyo puntual se
    pulveriza agua sobre los radiadores de las enfriadoras en determinadas condiciones
    ambientales; la memoria lo describe como un consumo optativo, sujeto a la disponibilidad
    del recurso hídrico y del que se puede prescindir sin pérdida operativa.
  origen: "Canal Imperial de Aragón, mediante la toma única ya autorizada a favor del Grupo SAMCA"
  consumo_m3_ano: 460000
  nota: >-
    460.000 m³/año es el techo declarado ("será inferior a"), no una previsión de consumo.
    Se descompone en unos 10.000 m³/año de reposición de los circuitos cerrados de
    refrigeración y de los tanques contra incendios, y hasta 450.000 m³/año del apoyo
    evaporativo optativo a las enfriadoras. La memoria estima además que la balsa de
    regulación captará unos 150.000 m³ anuales de escorrentía, con 20.000 m³/año de pérdidas
    por evaporación, y sostiene que el balance hídrico global es excedentario respecto al uso
    agrícola actual. No consta WUE.
  fuentes: [src-5]

