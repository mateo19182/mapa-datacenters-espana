id: adequa-odena-d-hub-can-morera
nombre: "D-hub Òdena — Can Morera (Adequa Real Estate)"
alias:
  - "D-Hub Òdena"
  - "Data Center Hub Can Morera"
  - "Campus D-hub Òdena"
tipo: campus
operador: null
propietario: "Adequa Real Estate (familia Singla)"
modelo: desconocido

ubicacion:
  municipio: "Òdena"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Sector de Can Morera, al norte de la autovía A-2, Conca d'Òdena (Anoia)"
  lat: null
  lon: null
  precision: municipio
  no_derivar: true
  fuentes: [src-1, src-2]

estado: anunciado
estado_detalle: >-
  Campus promovido por Adequa Real Estate sobre la finca privada de Can Morera. El Pla Director
  Urbanístic de l'Activitat Econòmica de la Conca d'Òdena, aprobado inicialmente en 2022, dejó
  fuera el ámbito de la Plataforma Ferroviària Nord donde se sitúa Can Morera, y la promotora
  presentó alegaciones. En marzo de 2026 el proyecto figuraba entre los 26 que la Generalitat
  estudia declarar estratégicos o de interés general superior; según la Cadena SER, Òdena concentra
  tres de esos proyectos. No consta aprobación urbanística ni licencia.
estado_fuentes: [src-3, src-4, src-5]

potencia:
  - tipo: no_especificado
    valor_mw: 200
    ambito: campus
    referencia: "Capacidad prevista según la lista de proyectos de la Generalitat avanzada por la Cadena SER"
    estado_asociado: anunciado
    fecha_dato: "2026-03-25"
    fuentes: [src-3, src-6]
  - tipo: no_especificado
    valor_mw: 150
    ambito: campus
    referencia: "«Potencia estimada superior a los 150 MW» publicada por la propia promotora"
    estado_asociado: anunciado
    fecha_dato: "2023-09-01"
    fuentes: [src-2]

incertidumbres:
  - campo: potencia
    descripcion: >-
      Las dos cifras publicadas no coinciden: Adequa habla en su propia web de «una potencia
      estimada superior a los 150 MW» (2023) y la lista de proyectos estratégicos de la
      Generalitat avanzada por la Cadena SER atribuye a este emplazamiento 200 MW (2026). Se
      registran las dos y no se elige ninguna. Ninguna dice si son MW de carga TI o de acceso a
      red.
    fuentes: [src-2, src-3]
  - campo: superficie_parcela_m2
    descripcion: >-
      La superficie también discrepa dentro del propio material del promotor: la web del proyecto
      dice que la propiedad «té un total de 200 hectàrees»; el artículo de Adequa habla de «unas
      100 hectáreas». No se registra ninguna de las dos como dato.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      El material del promotor accesible es de 2020-2023 y el planeamiento director de la Conca
      d'Òdena excluyó el ámbito de Can Morera. La única señal reciente es la inclusión del
      proyecto en la lista de la Generalitat de marzo de 2026, que es una solicitud en estudio, no
      una autorización.
    fuentes: [src-3, src-4, src-5]
  - campo: ubicacion
    descripcion: >-
      La finca es un ámbito rústico al norte de la A-2, fuera del casco urbano de Òdena. No se
      sitúa el punto en el centroide municipal por no contradecir a la fuente.
    fuentes: [src-1]

enlaces_proyecto:
  - "https://www.d-hubodena.cat/"
  - "https://adequa-re.cat/ca/data-center-hub-can-morera-2/"

confianza: baja
ultima_verificacion: "2026-08-31"

