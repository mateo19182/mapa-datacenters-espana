estado_detalle: >-
  Centro de datos neutro de colocación y, a la vez, estación de amarre de cables submarinos:
  la propia compañía lo presenta como la primera estación de cables submarinos neutra del
  mundo. Está en los terrenos del Instituto Tecnológico y de Energías Renovables (ITER),
  sociedad del Cabildo de Tenerife, junto al Parque Científico y Tecnológico de Granadilla, y
  dentro del parque eólico del propio ITER. Se monta dentro de una nave industrial reforzada
  bajo el concepto de «búnker dentro de búnker», con crecimiento modular en horizontal en vez
  de planta a planta. Ofrece bastidores en sala compartida, jaulas de superficie a medida y
  salas privadas con cuadro eléctrico, refrigeración y control de acceso propios. Da
  conectividad directa con la península a través de los cables de Canalink —con derivación
  hacia Marruecos— y con Gran Canaria y La Palma, más acceso a los sistemas internacionales
  ACE, WACS, MST, SAT-3, Atlantis-2 y SAT-2 de la costa occidental de África. Entra en el
  registro en septiembre de 2026, con el cambio de la regla de alcance peninsular.
estado_fuentes: [src-catalogo, src-iter, src-canalink]

potencia:
  - tipo: no_especificado
    valor_mw: 5
    ambito: edificio
    referencia: "Capacidad atribuida al centro por el directorio Data Center Map"
    estado_asociado: operativo
    fecha_dato: "2026-09-01"
    fuentes: [src-dcmap]
    nota: >-
      No es una cifra del operador: D-ALiX no publica ninguna magnitud eléctrica. La aporta un
      directorio sectorial de terceros, sin decir si son MW TI, de conexión o instalados, así
      que se registra como no especificada y no se compara con las de otros emplazamientos.

superficie_construida_m2: 2000

refrigeracion: >-
  Doble acometida eléctrica, grupos electrógenos redundantes (2N), alimentación ininterrumpida
  (2N+1) y centro de transformación (2N), con 48 horas de autonomía a plena carga. Instalación
  clasificada TIER III+, y TIER IV en la infraestructura eléctrica.

computo: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      El operador describe su infraestructura eléctrica con detalle —redundancias 2N y 2N+1,
      autonomía de 48 horas, clasificación TIER IV— y no publica ni un vatio. La única cifra
      localizada, 5 MW, procede del directorio Data Center Map y no de la compañía; se registra
      como no especificada precisamente por eso. Los 400 kW fotovoltaicos de la cubierta son
      generación propia, no capacidad del centro, y por eso no entran en `potencia[]` como
      carga.
    fuentes: [src-catalogo, src-dcmap]
  - campo: superficie_construida_m2
    descripcion: >-
      Los 2.000 m² son los que Canalink y el catálogo de servicios atribuyen al espacio
      dedicado a alojamiento de alta disponibilidad, no la superficie construida de la nave que
      lo contiene. Se registran como superficie construida a falta de otra cifra, con la
      salvedad anotada.
    fuentes: [src-canalink, src-catalogo]
  - campo: tipo
    descripcion: >-
      La ficha describe a la vez un centro de colocación y una estación de aterraje de cable
      submarino. El registro tiene nueve estaciones de aterraje que no son centros de datos y
      este es el caso inverso: las dos funciones en el mismo edificio. Se clasifica como
      colocation porque el alojamiento de terceros es la actividad que factura, y la condición
      de estación de cables queda en el detalle de estado.
    fuentes: [src-iter, src-canalink]

confianza: media
