    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1419875120606"
    titulo: "RESOLUCIÓN de 6 de octubre de 2025, del Instituto Aragonés de Gestión Ambiental, por la que se formula la declaración de impacto ambiental de las infraestructuras hidráulicas exteriores que darán servicio a los nuevos centros de datos VDG1 y VDG2, en el término municipal de Villanueva de Gállego (Zaragoza) (INAGA 500201/01A/2025/05152)"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-11-11"
    fecha_consulta: "2026-08-31"
    cita: "En el emplazamiento VDG2, el agua pluvial captada se canalizará parcialmente hacia la finca colindante VDG1, después de un primer tratamiento de filtrado en VDG2 y ambas fincas pertenecientes al mismo titular y el resto, se reutilizará en la misma parcela. [...] Para la red de suministro de agua de proceso, se propone construir un nuevo pozo (P1) junto al pozo municipal existente (1+1) [...] Adicionalmente se propone construir dos nuevos pozos P2 y P3 (1+1) como refuerzo del abastecimiento actual"
  - id: src-5
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1406588900808"
    titulo: "RESOLUCIÓN de 16 de julio de 2025, del Instituto Aragonés de Gestión Ambiental, por la que se formula la declaración ambiental estratégica del Plan de Interés General «Expansión Región AWS en Aragón» — recursos de energía por centro de datos"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-08-06"
    fecha_consulta: "2026-08-31"
    cita: "Los recursos de energía para la actividad a desarrollar en los centros de datos ascienden a: VDG1: 756,9 GWh/año, VDG2: 2.775 GWh/año, BDE: 1.766 GWh/año, WQA: 2.270,6 GWh/año y CAR: 3.279,7 GWh/año. Las necesidades de electricidad del conjunto de centros de datos ascenderían a 10.848,2 GWh/año."
