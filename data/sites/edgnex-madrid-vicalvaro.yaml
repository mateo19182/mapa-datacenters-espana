    url: "https://brainsre.news/asg-iberia-edgnex-damac-suelo-madrid-data-center/"
    titulo: "ASG Iberia vende a Edgnex, de Damac Group, un suelo en Madrid para el desarrollo de un data center"
    editor: "Brainsre News"
