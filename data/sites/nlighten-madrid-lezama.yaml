incertidumbres:
  - campo: potencia
    descripcion: >-
      nLighten publica 1.500 kW como capacidad final del emplazamiento; el directorio OCOLO
      atribuye 2,00 MW. No se especifica si es carga TI o total. La diferencia tiene explicación
      documental: la hoja de datos que nLighten publicó en enero de 2025 encabezaba «3,300 m
      2,000 kW» y la de diciembre de 2025 la rebajó a «3,300 m 1,500 kW» para el mismo centro,
      de modo que el directorio parece arrastrar la cifra antigua. La compañía no explica la
      revisión.
    fuentes: [src-1, src-3, src-4, src-5]

