estado_detalle: >-
  MAD01 es el proyecto de Goodman sobre suelo de la antigua fábrica de Iveco-Pegaso, en Madrid Gate.
  La cartera actual mantiene 6 MW IT y la dirección C/Provisional Iveco-Pegaso Cinco,2. El informe
  Q1 FY26 lo incluyó en un conjunto de proyectos en obra o con trabajos previos para iniciarse antes
  de junio 2026, sin individualizar el avance de Madrid. No se ha localizado confirmación de inicio
  de construcción del CPD ni de apertura.
estado_fuentes: [ src-1, src-2, src-cartera-20261017, src-q1-fy26 ]

