incertidumbres:
  - campo: potencia
    descripcion: >-
      Los 9 MW «on site» y los 8,6 MW «secured» adicionales son potencia de acceso y no se
      comparan ni se suman con los 6 + 5,7 MW de carga TI de las dos fases. La ficha de producto
      y la cartera global de Goodman dan cifras coherentes entre sí.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      La dirección publicada por Goodman es una calle provisional del ámbito de la antigua fábrica
      de Iveco-Pegaso; un directorio de mercado sitúa la instalación en la Calle de Lola Flores
      (San Blas-Canillejas). No se ha fijado un punto exacto.
    fuentes: [src-1]
  - campo: estado
    descripcion: La inclusión en una cartera mixta de obra y preconstrucción no permite marcar MAD01
      individualmente comoen_construccion. Tampoco el paso del plazo objetivo de junio 2026 acredita
      inicio o entrega. Se conserva el proyecto anunciado y la capacidad prevista, hasta una
      licencia, parte de obra o comunicación individualizada.
    fuentes: [ src-q1-fy26, src-cartera-20261017 ]
  - campo: potencia
    descripcion: La cartera actual vuelve a publicar 6 MW IT, pero no confirma la entrega de esos MW ni
      las ampliaciones 5,7 MW IT y 8,6 MW eléctricos de la ficha histórica. Los enlaces históricos
      no devolvieron su contenido durante esta revisión; sus lecturas se conservan con su
      procedencia y sin atribuirles operación.
    fuentes: [ src-1, src-2, src-cartera-20261017 ]

