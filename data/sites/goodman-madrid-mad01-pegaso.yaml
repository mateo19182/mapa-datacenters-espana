estado_detalle: >-
  Reconversión de suelo industrial en desuso de la antigua fábrica de Iveco-Pegaso, dentro de la
  operación que Goodman denomina «Madrid Gate». La compañía lo incluye en su cartera de proyectos
  «en construcción o cuyo desarrollo está previsto que comience antes de junio de 2026» y lo
  comercializa como disponible, en el corredor este de la A-2, a unos 7 km del nodo de San Blas.
