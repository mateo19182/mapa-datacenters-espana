      Cifra anterior a la aparición de Apto como promotor. Se conserva porque describe la misma
      parcela.

superficie_parcela_m2: 195000
inversion_anunciada_eur: 2000000000

incertidumbres:
  - campo: operador
    descripcion: >-
      Thor Equities compró la antigua planta de Coca-Cola de Fuenlabrada en octubre de 2022 y en
      julio de 2023 su plataforma Form8tion inició las obras de un campus de cinco edificios
      llamado "Madrid One" en Calle Sauce 20. Desde marzo de 2026 el mismo emplazamiento y el
      mismo nombre comercial aparecen atribuidos a Apto. No se ha localizado ninguna fuente que
      documente el traspaso, así que se registra un único emplazamiento con los dos promotores
      como alias en lugar de dos fichas.
    fuentes: [src-1, src-4, src-5]
  - campo: superficie_parcela_m2
    descripcion: >-
      Apto habla de 195.000 m²; el acuerdo plenario del Ayuntamiento de Fuenlabrada (2023) cifraba
      el campus en "cerca de 225.000 metros cuadrados". No se ha podido determinar si describen el
      mismo perímetro.
    fuentes: [src-1, src-2]
  - campo: inversion_anunciada_eur
    descripcion: >-
      La inversión anunciada pasa de 600 millones de euros en el acuerdo municipal de 2023 a hasta
      2.000 millones en la nota de Apto de 2026. Se registra la más reciente y se deja constancia
      de la anterior.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      Ninguna fuente distingue entre MW de carga TI y MW de acceso a red para los 240 MW del
      campus. Los 40 MW de la subestación sí son potencia de conexión y no se comparan con
      aquella cifra.
    fuentes: [src-1]

