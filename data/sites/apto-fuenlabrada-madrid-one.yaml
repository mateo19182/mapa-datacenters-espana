estado: en_construccion
estado_detalle: >-
  El pleno municipal aprobó en marzo de 2023 el planeamiento que permite urbanizar y construir un
  campus de cinco edificios sobre la parcela industrial en desuso de la antigua embotelladora. En
  marzo de 2026 Apto declaró el emplazamiento completamente despejado, con la subestación in situ
  ejecutada y licencia de obra para la primera fase, y anunció el arranque de una segunda fase de
  122 MW.
