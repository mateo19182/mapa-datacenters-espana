id: rubix-submer-flix
nombre: "Rubix Data Centers (Submer) — Flix, antigua planta de Ercros"
alias:
  - "Submer Flix"
  - "Factoria d'IA de Flix"
tipo: campus
operador: "Rubix Data Centers"
propietario: "Submer Group"
modelo: hyperscale

ubicacion:
  municipio: "Flix"
  provincia: "Tarragona"
  ccaa: "Cataluña"
  direccion: "Terrenos de la antigua planta química de Ercros, junto al Ebro, Flix (Ribera d'Ebre)"
  precision: municipio
  fuentes: [src-1, src-2]

estado: anunciado
estado_detalle: >-
  Anunciado el 11 de julio de 2026 por el president de la Generalitat, Salvador
  Illa, dentro del grupo de trabajo de reindustrialización de la comarca tras el
  cierre de la actividad química de Ercros y en el contexto de la transición
  nuclear (Ascó y Vandellòs). Submer prevé poner en marcha el centro a partir de
  2027 y desplegarlo en dos fases. El centro lo desarrollará y
  operará Rubix Data Centers bajo un modelo «develop and operate» para un
  inquilino externo a largo plazo. Ercros arrienda los terrenos y presta
  servicios necesarios para el proyecto. La compañía prevé pleno funcionamiento
  en 2029.
estado_fuentes: [src-1, src-2, src-4, src-5, src-6]

potencia:
  - tipo: no_especificado
    valor_mw: 20
    ambito: fase
    referencia: "Potencia disponible de forma inmediata procedente de la infraestructura de Ercros"
    estado_asociado: anunciado
    fecha_dato: "2026-07-11"
    fuentes: [src-2]
    nota: >-
      La fuente dice "Més de 20 MW estaran disponibles de manera immediata";
      además menciona "s'hi sumaran 20 MW més" adquiridos a una empresa del
      sector tecnológico. No se suman aquí porque la fuente no da un total.
  - tipo: no_especificado
    valor_mw: 50
    ambito: fase
    referencia: "Potencia de la primera fase"
    estado_asociado: anunciado
    fecha_dato: "2026-07-13"
    fuentes: [src-5]
    nota: >-
      La agencia ACN, recogida por VIA Empresa, dice "En la primera fase, la
      fàbrica tindrà una potència de 50 MW". No precisa si es carga TI o
      potencia de acceso, ni cómo se relaciona con los 20+20 MW de Crónica
      Global.
  - tipo: no_especificado
    valor_mw: 70
    ambito: campus
    referencia: "Capacidad eléctrica total asociada al antiguo complejo de Ercros"
    estado_asociado: anunciado
    fecha_dato: "2026-07-11"
    fuentes: [src-2]
    nota: >-
      La fuente atribuye ~70 MW al complejo industrial de Ercros, no al centro de
      datos en sí.

fases:
  - nombre: "Fase 1"
    estado: anunciado
    fuentes: [src-1, src-2]
  - nombre: "Fase 2"
    estado: anunciado
    fuentes: [src-1]

superficie_parcela_m2: 13000
inversion_anunciada_eur: 1000000000
refrigeracion: >-
  Tecnología de refrigeración de alta eficiencia energética que, según la
  compañía, permitirá operar sin consumo de agua.

agua:
  circuito: sin_agua
  sistema: >-
    Refrigeración líquida de última generación que, según Submer, no consume
    agua durante la operación.
  origen: null
  nota: >-
    La compañía no publica consumo de agua auxiliar ni WUE. El emplazamiento
    está junto al Ebro y esa proximidad se ha señalado en el debate público, sin
    que exista dato de captación.
  fuentes: [src-4]

empleo:
  - tipo: directo
    valor: 150
    referencia: "Puestos permanentes con la instalación terminada"
    fecha_dato: "2026-07"
    fuentes: [src-4, src-5]
    nota: >-
      Submer habla de "up to 150 permanent jobs covering operations &
      maintenance, critical facilities engineering, facilities management,
      security, site services, and operator support". El Ayuntamiento de Flix
      daba una horquilla de 105 a 150.

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      El Ayuntamiento de Flix y Ara cifran la inversión en "más de 1.000 millones
      de euros"; Crónica Global la cifra en 1.500 millones. Se registra la cifra
      menor y se documenta la discrepancia.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      Los 50 MW de la fase 1 quedan confirmados por la agencia ACN, pero no
      cuadran con los «más de 20 MW inmediatos más otros 20 MW» de Crónica
      Global ni con los ~70 MW atribuidos al complejo de Ercros. Las cifras de
      85-90 MW de capacidad instalada que circulan no se han podido confirmar.
      No se suman entre sí.
    fuentes: [src-2, src-5]
  - campo: empleo
    descripcion: >-
      El Ayuntamiento de Flix habla de «entre 105 i 150 llocs de treball
      permanents un cop acabada»; Submer y la ACN dan la cifra de 150. Se
      registra 150 y se deja constancia de la horquilla.
    fuentes: [src-1, src-4, src-5]
  - campo: fecha_puesta_en_servicio
    descripcion: >-
      Ara habla de estar operativo "a finales de 2027"; el Ayuntamiento de Flix
      habla de la fase 1 en dos años desde julio de 2026.
    fuentes: [src-1, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

