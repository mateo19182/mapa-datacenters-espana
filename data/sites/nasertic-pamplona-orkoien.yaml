incertidumbres:
  - campo: potencia
    descripcion: >-
      Nasertic describe la infraestructura eléctrica y de clima pero no publica potencia,
      superficie de sala técnica ni número de racks. La ampliación se anuncia como «doblar la
      capacidad» sin decir capacidad de qué. Campo de potencia vacío.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      Nasertic no publica la dirección de sus centros de proceso de datos. La dirección
      registrada, calle Orkoien s/n de Pamplona, coincide con la sede central de la sociedad y
      procede de la ficha de obra de un proveedor (Legrand), rotulada «SEDE CPDs DEL GOBIERNO DE
      NAVARRA». No se ha localizado la ubicación del segundo CPD, que podría estar en otro
      municipio. No se registran coordenadas.
    fuentes: [src-3, src-4]
  - campo: tipo
    descripcion: >-
      La ficha describe el CPD principal. El Gobierno de Navarra tiene dos y no publica cuál es
      cuál ni dónde está el segundo, así que este registro no cubre el conjunto.
    fuentes: [src-1]

confianza: baja
