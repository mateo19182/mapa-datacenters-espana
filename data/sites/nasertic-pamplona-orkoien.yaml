estado: operativo
estado_detalle: >-
  CPD principal del Gobierno de Navarra en la calle Orkoien, gestionado por Nasertic y sede
  del clúster Urederra. La ampliación inaugurada el 25 de abril de 2025 elevó la potencia
  instalada de 200 a 400 kW y los racks de 48 a 96, con una inversión publicada de 4 millones
  de euros. Tiene un CPD de respaldo distinto en la Comisaría de la Policía Foral en Beloso.
estado_fuentes: [src-1, src-2, src-visitas-2022, src-ampliacion-2023]

