estado_detalle: >-
  Nasertic gestiona y mantiene los dos centros de proceso de datos del Gobierno de Navarra,
  que alojan los sistemas de la Administración foral y de las sociedades públicas de la CPEN:
  historia clínica electrónica, portales educativos, tributos, expedientes policiales y
  servicios sociales, entre otros. Cuentan con certificaciones ISO 27001, ENS y CEEDA,
  alimentación redundante N+1 con transformadores de media tensión, grupos electrógenos y SAI,
  y climatización de precisión con enfriadoras aire-agua y free-cooling. En enero de 2024 el
  Gobierno de Navarra anunció una inversión de 2,6 millones de euros para doblar la capacidad
  del CPD; la ampliación y modernización se inauguró el 25 de abril de 2025 con un coste final
  de 4 millones de euros procedentes del Mecanismo de Recuperación y Resiliencia.
estado_fuentes: [src-1, src-2]

potencia: []

inversion_anunciada_eur: 4000000
refrigeracion: "Climatización de precisión con enfriadoras aire-agua con free-cooling, unidades CRAH o in-row y sistemas de puerta fría."
