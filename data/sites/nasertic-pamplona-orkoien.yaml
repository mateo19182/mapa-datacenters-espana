incertidumbres:
  - campo: potencia
    descripcion: >-
      Los 400 kW publicados son potencia instalada del CPD, sin desglose de carga IT ni
      consumo medido. Los 96 racks no permiten calcular capacidad eléctrica adicional.
    fuentes: [src-2]
  - campo: ubicacion
    descripcion: >-
      Las visitas del operador y el expediente de ampliación sitúan expresamente el CPD
      y Urederra en Orkoien s/n. El punto de Maps corresponde a la sede de esa dirección,
      con precisión aproximada; no identifica la sala del clúster.
    fuentes: [src-3, src-visitas-2022, src-ampliacion-2023, src-mapa-orkoien]
  - campo: tipo
    descripcion: >-
      Esta ficha cubre el CPD principal de Orkoien. Los datos de potencia y cómputo no se
      atribuyen también al centro de respaldo de la Comisaría de la Policía Foral en Beloso.
    fuentes: [src-1, src-2]
  - campo: superficie_construida_m2
    descripcion: >-
      La zona IT pasó de 138 m² a más de 290 m² en 2025. Es superficie técnica con un
      límite inferior, no superficie construida exacta del edificio.
    fuentes: [src-2]

