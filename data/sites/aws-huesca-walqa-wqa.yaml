id: aws-huesca-walqa-wqa
nombre: "AWS Ampliación Región Aragón — Huesca Walqa (WQA)"
alias:
  - "WQA"
  - "ZAZ081"
  - "ZAZ111"
tipo: campus
operador: "Amazon Web Services"
propietario: "Amazon Data Services Spain, S.L."
modelo: hyperscale

ubicacion:
  municipio: "Huesca"
  provincia: "Huesca"
  ccaa: "Aragón"
  direccion: "Polígono industrial Parque Tecnológico Walqa"
  lat: 42.113664
  lon: -0.453433
  precision: exacta
  fuentes: [src-1]

estado: permisos_concedidos
estado_detalle: >-
  Emplazamiento del PIGA "Expansión de la Región AWS en Aragón". DIA y autorización
  ambiental integrada de INAGA de 28 de abril de 2026. Aprobación definitiva del proyecto
  de edificación y urbanización interior Fase 1 y de la subestación WQA1HV 132/20 kV el 4
  de mayo de 2026; la subestación WQA2HV 220/20 kV se aprobó el 10 de junio de 2026. No
  podrán otorgarse licencias de inicio de actividad ni primera ocupación mientras no estén
  en servicio las medidas de reordenación de accesos exigidas por el Ministerio de
  Transportes.
estado_fuentes: [src-1, src-2]

potencia:
  - tipo: termica_respaldo
    valor_mw: 342.08
    ambito: campus
    referencia: "Potencia térmica nominal total de las instalaciones de combustión por motores diésel (MWt)"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-04-28"
    fuentes: [src-1]
    nota: >-
      Dato térmico (MWt) de grupos electrógenos de respaldo. No es carga TI ni potencia de
      conexión a red.

energia:
  - consumo_gwh_ano: 2270.6
    referencia: "Recursos de energía previstos para la actividad del centro de datos «WQA» a plena capacidad"
    fecha_dato: "2025-07-16"
    fuentes: [src-5]
    nota: >-
      La cifra figura en la declaración ambiental estratégica del PIGA, dentro del escrito de
      alegaciones de SEO/BirdLife que la resolución reproduce literalmente y que la atribuye
      a la documentación del proyecto: no la formula INAGA por su cuenta. La misma relación
      suma 10.848,2 GWh/año para los cinco emplazamientos de la ampliación.

fases:
  - nombre: "Fase 1"
    estado: permisos_concedidos
    superficie_m2: 55667
    fuentes: [src-1]
    nota: >-
      Fase 1: 2 edificios de centro de datos de tipología A y 1 de tipología B, planta de
      tratamiento de agua, almacenamiento y bombeo contraincendios, 2 casetas eléctricas FV
      y control de accesos. Ocupación sobre rasante 11,5 % (55.667,06 m²); edificabilidad
      70.449,11 m². 93 trabajadores previstos.
  - nombre: "Campus completo"
    estado: permisos_concedidos
    fuentes: [src-1]
    nota: >-
      Total campus: 4 edificios de tipología A, 1 de tipología B, 2 edificios de archivo de
      datos y 1 edificio administrativo.

conexion_electrica:
  subestacion: "SE WQA1HV 132/20 kV y SE WQA2HV 220/20 kV (propias de AWS), alimentadas desde la SE Esquedas 132 kV"
  tension_kv: 132
  titular_red: "Endesa (E-Distribución) — SE Esquedas 132 kV"
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1, src-2]
  nota: >-
    WQA1HV está formada por tres transformadores 132/20 kV de 50/65 MVA, dos reactores de
    derivación 132 kV y 30 MVAr, un edificio de celdas GIS 132 kV y un edificio de celdas
    20 kV. Se alimenta mediante línea doble desde la SE Esquedas 132 kV (Endesa); la línea
    "LSAT 132 kV SET Esquedas - SET centro de datos WQA" obtuvo autorización administrativa
    previa y de construcción por Resolución de 24 de febrero de 2026 y discurre por Huesca,
    Almudévar, Lupiñén-Ortilla, Chimillas y La Sotonera. Presupuesto de ejecución material
    de la subestación: 22.094.974,35 €. No consta potencia de acceso concedida en MW.

superficie_construida_m2: 70449
inversion_anunciada_eur: null
refrigeracion: >-
  Dos balsas de agua reciclada de proceso y de escorrentías superficiales para refrigeración
  en verano, con dos tanques de tormentas bajo ellas y planta fotovoltaica sobre su superficie.
agua:
  circuito: desconocido
  sistema: >-
    Dos balsas de agua reciclada de proceso y de escorrentías superficiales para la
    refrigeración en verano, con dos tanques de tormentas debajo y planta fotovoltaica sobre
    su superficie, más planta de tratamiento de agua en la parcela.
  origen: >-
    Agua bruta bombeada desde el embalse de Valdabra mediante una tubería de impulsión de
    400 mm y 9 km hasta las balsas del CEEI, con ampliación de la ETAP existente, y tres
    pozos de extracción de agua subterránea dentro del propio emplazamiento. El caudal
    máximo de agua potable que recibe hoy el Parque Tecnológico Walqa, 7,31 l/s, se
    considera insuficiente.
  consumo_m3_ano: 143400
  nota: >-
    La estimación de 143.400 m³/año procede de la declaración ambiental estratégica del
    PIGA. Los sondeos previstos dentro del emplazamiento se dimensionan para un caudal
    estimado de 7-14 l/s. No consta WUE publicado.
  fuentes: [src-3, src-4]

enlaces_proyecto:
  - "https://www.aragon.es/-/piga-aws-ampliacion"

incertidumbres:
  - campo: potencia
    descripcion: >-
      No consta carga TI ni potencia de acceso a red publicada. Solo hay potencia térmica
      de grupos electrógenos.
    fuentes: [src-1]

  - campo: agua
    descripcion: >-
      El consumo de 143.400 m³/año consta en el escrito de alegaciones de SEO/BirdLife que
      la declaración ambiental estratégica reproduce, atribuido a la documentación del
      proyecto. La resolución de impacto ambiental de la infraestructura hidráulica exterior
      de WQA describe cuatro alternativas de suministro de agua industrial —conexión a la
      tubería del Parque Tecnológico Walqa, nueva toma del Canal del Cinca, tres pozos
      subterráneos y plataforma flotante en el embalse de Valdabra— sin que las fuentes
      consultadas permitan fijar cuál es la definitiva.
    fuentes: [src-3, src-4]
  - campo: empleo
    descripcion: >-
      El cuadro de parámetros urbanísticos del Acuerdo de 4 de mayo de 2026 recoge los
      trabajadores previstos en la Fase 1 de VDG1, VDG2 y WQA en una tabla de tres columnas
      cuya correspondencia no se puede reconstruir de forma literal desde el texto
      publicado. No se registra por ello un valor en «empleo»; la cifra que figura en la
      nota de la fase procede de una lectura previa de esa tabla.
    fuentes: [src-1]

confianza: alta
ultima_verificacion: "2026-08-31"

