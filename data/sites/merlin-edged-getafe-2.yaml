incertidumbres:
  - campo: potencia
    descripcion: >-
      La ficha de Edged para Madrid-Getafe 2 muestra "48 MW Critical Load Capacity" en el
      encabezado y "20 MW Critical Load Capacity" en el bloque inferior. La versión en español de
      la misma página, consultada en agosto de 2026, repite las dos cifras, de modo que no es un
      error puntual de una traducción. Se conservan ambos valores sin elegir.
    fuentes: [src-1, src-3]
  - campo: estado
    descripcion: >-
      La nota de prensa de MERLIN de enero de 2025 solo menciona MAD 01 en Getafe (20 MW
      ampliables a 27 MW) y no recoge un segundo edificio, por lo que no se puede datar la
      puesta en servicio de Getafe 2 ni confirmar su capacidad energizada.
    fuentes: [src-1, src-2]

