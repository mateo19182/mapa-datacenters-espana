estado_detalle: >-
  Segundo edificio, MAD-GET 02, previsto en Fundidores 2. MERLIN documentaba en julio de 2026
  demolición preparatoria en curso, evaluación ambiental obtenida y licencia de construcción
  solicitada, con servicio previsto en el segundo semestre de 2029. La web de Edged repite un bloque
  "Now Open" y 20 MW que contradice tanto su ficha técnica como el informe del propietario. No se
  acredita apertura ni capacidad operativa.
estado_fuentes:
  - src-1
  - src-spec-mad02
  - src-merlin-6m26

