refrigeracion: >-
  Sistema ThermalWorks sin consumo de agua (WUE 0,00 l/kWh); PUE de diseño de cartera 1,15;
  transferencia de calor con glicol y enfriadoras de techo refrigeradas por aire; evaporadores de
  circuito cerrado para la refrigeración secundaria; 500 kW por pasillo caliente.

agua:
  circuito: sin_agua
  sistema: >-
    Refrigeración modular ThermalWorks: transferencia de calor con glicol y enfriadoras de techo
    refrigeradas por aire, con evaporadores de circuito cerrado para la refrigeración secundaria.
    Edged declara que el sistema no consume agua.
  origen: null
  consumo_m3_ano: null
  wue_l_kwh: 0
  nota: >-
    Cifra publicada por el operador para toda su cartera y repetida en la ficha de este edificio;
    no hay medición independiente ni consumo declarado en metros cúbicos.
  fuentes: [src-3]
enlaces_proyecto:
  - "https://www.edged.es/madrid-getafe-2"

incertidumbres:
  - campo: potencia
    descripcion: >-
      La ficha de Edged para Madrid-Getafe 2 muestra "48 MW Critical Load Capacity" en el
      encabezado y "20 MW Critical Load Capacity" en el bloque inferior. La versión en español de
      la misma página, consultada en agosto de 2026, repite las dos cifras, de modo que no es un
      error puntual de una traducción. Se conservan ambos valores sin elegir.
    fuentes: [src-1, src-3]
  - campo: estado
    descripcion: >-
      La ficha web de Edged muestra "Now Open", pero la ficha técnica enlazada identifica MAD02 en
      diseño y el informe del propietario de julio de 2026 solo acredita demolición preparatoria,
      con licencia de construcción solicitada. El servicio del CPD figura previsto para el segundo
      semestre de 2029. No se confirma apertura.
    fuentes:
      - src-1
      - src-spec-mad02
      - src-merlin-6m26
  - campo: ubicacion
    descripcion: El pin de Google Maps enlazado por el operador y las coordenadas impresas en su ficha
      MAD02 coinciden. Identifican el emplazamiento previsto, con precisión aproximada, sin
      acreditar el estado de las obras.
    fuentes:
      - src-mapa
      - src-spec-mad02
  - campo: potencia
    descripcion: Los 16 MW IT adicionales que Colliers atribuye a Getafe no identifican MAD02. No se
      usan para acreditar la apertura del segundo edificio.
    fuentes:
      - src-colliers-20261008
      - src-merlin-6m26

confianza: baja
