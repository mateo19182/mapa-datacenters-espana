id: quetta-molins-de-rei
nombre: "Quetta Data Centers — Molins de Rei"
alias:
  - "Quetta DC Molins de Rei"
tipo: edificio
operador: "Quetta Data Centers"
propietario: "Quetta Data Centers (Azora)"
modelo: edge

ubicacion:
  municipio: "Molins de Rei"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  precision: municipio
  fuentes:
    - src-1
    - src-bop-20260313
  direccion: Avinguda Barcelona 243, Polígon Industrial El Pla, Molins de Rei

estado: permisos_concedidos
estado_detalle: >-
  Primer proyecto de Quetta en Barcelona, anunciado en diciembre de 2025 junto
  con la ampliación de su centro de Tres Cantos (Madrid). Forma parte de un plan
  de seis centros edge en España y Portugal, con 500 millones de euros para el
  conjunto. El 2 de septiembre de 2026 la compañía declaró a Viu Molins de Rei
  que disponía de permisos municipales y esperaba iniciar las obras, sin fecha
  concretada. Estimaba 18 meses de construcción y seis de pruebas. Esa información
  posterior contradice el inicio anunciado por Azora en diciembre de 2025.
estado_fuentes: [src-1, src-2, src-viu-20260902]

potencia:
  - tipo: it
    valor_mw: 7.2
    ambito: edificio
    referencia: "Capacidad de procesamiento del centro"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-04-14"
    fuentes: [src-2]
    nota: >-
      La fuente dice "tendrá una capacidad de procesamiento de 7,2 megavatios",
      magnitud que contrapone explícitamente al consumo eléctrico total.
  - tipo: no_especificado
    valor_mw: 10
    ambito: edificio
    referencia: "Consumo eléctrico máximo de la instalación"
    estado_asociado: permisos_concedidos
    fecha_dato: "2026-04-14"
    fuentes: [src-2]
    nota: >-
      La fuente dice "consumirá hasta 10 megavatios de energía eléctrica". No se
      tipifica como potencia instalada ni como potencia de acceso porque la
      fuente no lo precisa.

conexion_electrica:
  nota: >-
    La compañía indica que la instalación se construirá al lado de una
    subestación eléctrica para garantizar el suministro, sin nombrarla ni dar
    tensión ni potencia de acceso.
  fuentes: [src-2]

refrigeracion: >-
  Refrigeración líquida directa en circuito cerrado (DLC), consumo nulo de agua
  (WUE 0) y PUE declarado inferior a 1,15.

agua:
  circuito: cerrado
  sistema: >-
    Refrigeración líquida directa (direct liquid cooling) mediante un circuito
    cerrado de agua por tuberías que, según la compañía, no requiere absorción
    de agua del entorno.
  origen: null
  wue_l_kwh: 0
  nota: >-
    La gestora publica «WUE 0» para el modelo de la plataforma; El Periódico
    describe el sistema como circuito cerrado de agua, no como ausencia total de
    agua en la instalación.
  fuentes: [src-1, src-2]

incertidumbres:
  - campo: potencia
    descripcion: >-
      La gestora publica un agregado de cartera de 30 MW que suma Molins de Rei y la ampliación de
      Madrid, sin reparto en esa nota. Los 7,2 MW IT y hasta 10 MW eléctricos de Molins proceden de
      las declaraciones recogidas en abril de 2026. No se asignan los 30 MW del conjunto a este
      edificio.
    fuentes: [src-1]
  - campo: potencia
    descripcion: >-
      Prensa especializada atribuía 10 MW al centro de Molins de Rei frente a la
      cifra agregada de 30 MW de la gestora. En abril de 2026 la propia compañía
      precisó a El Periódico dos magnitudes distintas para este centro: 7,2 MW de
      capacidad de procesamiento y hasta 10 MW de consumo eléctrico. Los «10 MW»
      que circulaban parecen corresponder al consumo, no a la capacidad, pero
      ninguna fuente lo afirma.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: "El anuncio de licencia ambiental de marzo de 2026 identifica Avinguda Barcelona 243,
      polígono El Pla. No se han fijado coordenadas a partir de la dirección ni confirmado una
      parcela catastral."
    fuentes:
      - src-bop-20260313
  - campo: estado
    descripcion: Azora anunció en diciembre de 2025 construcción iniciada en Molins; la información
      pública ambiental de marzo de 2026 no es una licencia concedida y las declaraciones de abril
      aún esperaban licencia de obra. En septiembre la compañía declaró permisos disponibles y
      obras pendientes. Se adopta ese último estado declarado, sin acta municipal de concesión
      localizada ni confirmación de obras posteriores.
    fuentes:
      - src-1
      - src-2
      - src-bop-20260313
      - src-viu-20260902

