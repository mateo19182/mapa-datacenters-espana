    fecha_consulta: "2026-08-31"
    cita: "Activo desde hace más de 20 años, el Data Center ahora tiene 1 MW de capacidad con sus dos nuevas salas IT, que totalizan 600 metros cuadrados y se incorporan a los más de mil metros cuadrados de las instalaciones anteriores. [...] El Data Center ahora cuenta con respaldo de dos generadores de 1 MW y un depósito de 12 mil litros cada uno [...] las nuevas zonas cuentan con climatización por refrigeración por agua, lo que mejora la eficiencia, especialmente para altas cargas. Se trata de un circuito cerrado que no tiene ningún consumo de agua."
