    titulo: "JLL asesorará a Nostrum Data Centers en el desarrollo de seis centros de datos en España con una potencia combinada de 800 MW"
    editor: "JLL"
    tipo: consultora
    fecha_publicacion: "2026-01-27"
    fecha_consulta: "2026-08-31"
    cita: >-
      Asesoramos a Nostrum Data Centers, un promotor líder de centros de datos de alto rendimiento
      sostenibles, en el desarrollo de seis activos en España en ubicaciones estratégicas:
      Badajoz, Cáceres, Guadalajara, Pinto, Zamudio y Galicia ... Todos los activos cuentan con
      potencia eléctrica y suelo asegurados y suman 500 MW de capacidad TI segura y sostenible,
      con otros 300 MW disponibles para futuras ampliaciones de capacidad.
