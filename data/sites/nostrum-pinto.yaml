id: nostrum-pinto
nombre: "Nostrum Data Centers — Pinto"
alias:
  - "Nostrum Pinto"
tipo: edificio
operador: "Nostrum Data Centers"
propietario: Nostrum Group / IREN Limited

modelo: desconocido

ubicacion:
  municipio: "Pinto"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  lat: null
  lon: null
  precision: municipio
  fuentes: [src-1, src-2]

estado: anunciado
estado_detalle: Pinto es uno de los seis emplazamientos de la cartera española que Nostrum Data
  Centers, división de infraestructura digital de Nostrum Group, encargó comercializar a JLL en
  enero de 2026. La consultora declara que los seis activos tienen potencia eléctrica y suelo
  asegurados y prevé que estén operativos a lo largo de 2027. No consta ningún trámite urbanístico
  ni ambiental identificable para el emplazamiento de Pinto. El Form 20-F de IREN fecha la compra de
  Nostrum el 12 de junio de 2026; DCD la sitúa el 15. La cobertura del cierre atribuye 21 MW al
  proyecto de Pinto, sin precisar su tipo ni aportar parcela o nueva licencia.

estado_fuentes:
  - src-1
  - src-2
  - src-iren-cierre
  - src-iren-fy2026

potencia:
  - tipo: no_especificado
    valor_mw: 21
    ambito: campus
    referencia: Capacidad del proyecto de Pinto en la cobertura del cierre de la compra por IREN
    estado_asociado: anunciado
    fecha_dato: 2026-06-16
    fuentes:
      - src-iren-cierre
    nota: Cifra periodística por emplazamiento; el comunicado de JLL no publica este reparto ni tipifica
      estos 21 MW.

incertidumbres:
  - campo: potencia
    descripcion: "DCD atribuye 21 MW a Pinto en junio de 2026, sin tipificar la magnitud. El comunicado
      de JLL solo publica la cartera agregada: falta respaldo primario de capacidad para este
      emplazamiento."
    fuentes:
      - src-1
      - src-2
      - src-iren-cierre
  - campo: ubicacion
    descripcion: >-
      No consta dirección, polígono ni parcela: las fuentes solo nombran el municipio dentro de
      una lista de seis ubicaciones.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      Que «la potencia eléctrica y el suelo estén asegurados» es una afirmación de la consultora
      que asesora la operación; no se ha localizado ningún permiso ni contrato de acceso público
      que la respalde para Pinto.
    fuentes: [src-1]

confianza: baja
ultima_verificacion: 2026-10-17

