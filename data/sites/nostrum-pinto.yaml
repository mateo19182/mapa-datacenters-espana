id: nostrum-pinto
nombre: "Nostrum Data Centers — Pinto"
alias:
  - "Nostrum Pinto"
tipo: edificio
operador: "Nostrum Data Centers"
propietario: "Nostrum Group"
modelo: desconocido

ubicacion:
  municipio: "Pinto"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  lat: null
  lon: null
  precision: municipio
  fuentes: [src-1, src-2]

estado: anunciado
estado_detalle: >-
  Pinto es uno de los seis emplazamientos de la cartera española que Nostrum Data Centers, división
  de infraestructura digital de Nostrum Group, encargó comercializar a JLL en enero de 2026. La
  consultora declara que los seis activos tienen potencia eléctrica y suelo asegurados y prevé que
  estén operativos a lo largo de 2027. No consta ningún trámite urbanístico ni ambiental
  identificable para el emplazamiento de Pinto.
estado_fuentes: [src-1, src-2]

potencia: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      La única cifra publicada es la de la cartera: 500 MW de capacidad TI en los seis
      emplazamientos, con otros 300 MW para futuras ampliaciones. No hay reparto por
      emplazamiento, y dividirlo o restarlo de los ya fichados sería inventar la cifra de Pinto.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      No consta dirección, polígono ni parcela: las fuentes solo nombran el municipio dentro de
      una lista de seis ubicaciones.
    fuentes: [src-1, src-2]
  - campo: estado
    descripcion: >-
      Que «la potencia eléctrica y el suelo estén asegurados» es una afirmación de la consultora
      que asesora la operación; no se ha localizado ningún permiso ni contrato de acceso público
      que la respalde para Pinto.
    fuentes: [src-1]

confianza: baja
ultima_verificacion: "2026-08-31"

fuentes:
