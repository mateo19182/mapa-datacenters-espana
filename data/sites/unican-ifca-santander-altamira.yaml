estado_detalle: >-
  Nodo Altamira de la Red Española de Supercomputación (RES), alojado por la
  Universidad de Cantabria en el IFCA. Es uno de los 14 nodos de la RES y presta
  servicio exclusivamente de HPC. La infraestructura del IFCA incluye además varios
  clústeres, un sistema de almacenamiento de más de 1 petabyte y un sistema de
  archivo de capacidad equivalente. En febrero de 2025 recibió 760.000 euros para
  la mejora de sus infraestructuras. Según la ficha del nodo en la RES, Altamira
  aporta 325 TFlop/s de rendimiento máximo con 69 nodos (3.312 cores) de Intel Xeon
  Platinum 8160 y 8 nodos (1.024 cores) de AMD EPYC 9554, 500 TB de almacenamiento
  GPFS e interconexión OmniPath e Infiniband; el 62% de la máquina está destinado a
  la RES. La primera versión del nodo se instaló en 2007 con hardware procedente de
  MareNostrum I y el sistema se renovó en 2012 y 2017. Es una Infraestructura
  Científico Técnica Singular (ICTS).
estado_fuentes: [src-1, src-2, src-3, src-4]

enlaces_proyecto:
