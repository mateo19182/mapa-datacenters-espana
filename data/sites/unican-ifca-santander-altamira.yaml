estado_detalle: >-
  Nodo Altamira de la Red Española de Supercomputación (RES), alojado por la
  Universidad de Cantabria en el IFCA. Es uno de los 14 nodos de la RES y presta
  servicio exclusivamente de HPC. La infraestructura del IFCA incluye además varios
  clústeres, un sistema de almacenamiento de más de 1 petabyte y un sistema de
  archivo de capacidad equivalente. En febrero de 2025 recibió 760.000 euros para
  la mejora de sus infraestructuras.
estado_fuentes: [src-1, src-2]

enlaces_proyecto:
  - "https://www.res.es/es/sobre-la-res/nodos"

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES ni el IFCA publican potencia eléctrica ni carga TI de la sala.
      Campo potencia omitido.
    fuentes: [src-1, src-2]
  - campo: nombre
    descripcion: >-
      No confundir con el «Campus Tecnológico de Datos Altamira» de Piélagos y
      Villaescusa (ficha stoneshield-pielagos-altamira): son instalaciones distintas
      que comparten nombre comercial.
    fuentes: [src-1]

