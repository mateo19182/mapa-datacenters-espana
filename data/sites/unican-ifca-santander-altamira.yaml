incertidumbres:
  - campo: potencia
    descripcion: >-
      Ni la RES, ni el IFCA, ni el Servicio Santander de Supercomputación de la
      Universidad de Cantabria publican potencia eléctrica ni carga TI de la sala.
      La ficha del nodo detalla cores, memoria, almacenamiento y rendimiento, pero
      ninguna magnitud eléctrica. Campo potencia omitido.
    fuentes: [src-1, src-3, src-4]
  - campo: nombre
    descripcion: >-
      No confundir con el «Campus Tecnológico de Datos Altamira» de Piélagos y
      Villaescusa (ficha stoneshield-pielagos-altamira): son instalaciones distintas
      que comparten nombre comercial.
    fuentes: [src-1]

