id: dayone-escatron-peaker
nombre: "DayOne — campus de centros de datos de IA de Escatrón (junto a la central Peaker)"
alias:
  - "DayOne Aragón"
  - "Campus DayOne Escatrón"
  - "Ignis Escatrón data center"
tipo: campus
operador: "DayOne"
propietario: "IGNIS (titular del suelo y promotor del desarrollo)"
cliente_ancla: null
modelo: hyperscale

ubicacion:
  municipio: "Escatrón"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Suelo industrial contiguo a la central de ciclo combinado «Peaker Escatrón», a unos siete kilómetros del casco urbano"
  lat: 41.2870705
  lon: -0.3249532
  precision: municipio
  fuentes: [src-1, src-2, src-osm]

estado: anunciado
estado_detalle: >-
  Proyecto anunciado en junio de 2026. DayOne, filial internacional del grupo chino GDS
  independizada en 2025, se alía con IGNIS para levantar un campus de centros de datos de
  inteligencia artificial junto a la central de ciclo combinado «Peaker Escatrón», propiedad
  de IGNIS desde 2016. IGNIS aporta el suelo, el acceso a la red y el respaldo del ciclo de
  gas; DayOne operará las instalaciones. El 25 de junio de 2026 el Ayuntamiento de Escatrón
  aprobó la segregación de las 78 hectáreas que ocupará el complejo, primer trámite
  urbanístico del proyecto. No se ha publicado calendario de obras ni tamaño de la primera
  fase.
estado_fuentes: [src-1, src-2, src-3]

potencia:
  - tipo: conexion_red
    valor_mw: 444
    ambito: campus
    referencia: "Acceso a la red eléctrica que IGNIS garantiza al campus"
    estado_asociado: anunciado
    fecha_dato: "2026-06-07"
    fuentes: [src-1]
    nota: >-
      La fuente habla de un «enchufe de 444 megavatios a la red eléctrica»: es potencia en el
      punto de conexión, no carga TI.
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Capacidad a la que está diseñado para escalar el campus"
    estado_asociado: anunciado
    fecha_dato: "2026-06-10"
    fuentes: [src-3]
    nota: >-
      DCD dice «designed to scale to 300MW» sin precisar si son MW IT o de conexión. No se
      suma ni se compara con los 444 MW de acceso a red.

conexion_electrica:
  subestacion: null
  tension_kv: null
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1, src-5]
  nota: >-
    El suministro se apoya en la central de ciclo combinado «Peaker Escatrón» (285 MW),
    adquirida por IGNIS en 2016, que se hibrida con generación renovable. La potencia del
    ciclo combinado es capacidad de generación y no capacidad del centro de datos.

superficie_parcela_m2: 785000
inversion_anunciada_eur: 3000000000
enlaces_proyecto: []

empleo:
  - tipo: no_especificado
    valor: 250
    referencia: "Trabajadores previstos en el complejo"
    fecha_dato: "2026-06"
    fuentes: [src-1]
    nota: "La fuente dice «superará los 250 trabajadores» sin distinguir obra y explotación."

incertidumbres:
  - campo: potencia
    descripcion: >-
      Conviven dos cifras que no miden lo mismo: 444 MW de acceso a la red (Heraldo) y 300 MW
      de capacidad de diseño del campus (DCD). Se registran por separado y no se suman.
    fuentes: [src-1, src-3]
  - campo: superficie_parcela_m2
    descripcion: >-
      Heraldo cifra la parcela en 78,5 hectáreas y el Ayuntamiento segregó 78 hectáreas,
      mientras que DCD habla de «a plot of around 900 hectares». Se registra la cifra
      respaldada por el trámite urbanístico local.
    fuentes: [src-1, src-2, src-3]
  - campo: ubicacion
    descripcion: >-
      En Escatrón hay dos proyectos de centro de datos distintos, en dos centrales de ciclo
      combinado distintas: este, junto a la planta «Peaker» de IGNIS, y el de Repsol, junto a
      su ciclo combinado de más de 800 MW (ficha «repsol-escatron-campus-ia»). No son el mismo
      emplazamiento y sus potencias no deben sumarse como si fueran fases de un mismo campus.
    fuentes: [src-1, src-4, src-6]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Las fuentes dicen «más de 3.000 millones de euros». Se registra el umbral citado, no una
      cifra cerrada.
    fuentes: [src-1, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

