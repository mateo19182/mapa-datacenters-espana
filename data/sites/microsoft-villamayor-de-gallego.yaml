  - id: src-5
    url: "https://www.elespanol.com/aragon/economia/20251119/centros-datos-microsoft-aragon-consumiran-energia-toda-comunidad/1003744019227_0.html"
    titulo: "Los centros de datos de Microsoft en Aragón consumirán más energía que toda la Comunidad"
    editor: "El Español — Aragón"
    tipo: prensa_general
    fecha_publicacion: "2025-11-19"
    fecha_consulta: "2026-08-29"
    cita: "el centro de Villamayor de Gállego se extenderá por 81 hectáreas, en una parcela situada entre el núcleo de la población y el polígono industrial Malpica. Microsoft estima que necesitará una demanda de consumo eléctrico máximo anual estimada en aproximadamente 3.777 GWh al año."
  - id: src-6
    url: "https://www.elperiodicodearagon.com/aragon/2025/11/14/microsoft-asegura-centros-datos-aragon-123735748.html"
    titulo: "La 'nube' de Microsoft apenas tiene sed: el consumo de sus centros de datos equivaldrá al de 90 personas"
    editor: "El Periódico de Aragón"
    tipo: prensa_general
    fecha_publicacion: "2025-11-14"
    fecha_consulta: "2026-08-31"
    cita: "La compañía asegura que sus tres campus de infraestructuras tecnológicas, que se levantarán en La Muela, Villamayor de Gállego y Zaragoza, funcionarán con un sistema de refrigeración líquida en circuito cerrado [...] La demanda industrial de sus instalaciones a plena capacidad a partir del segundo año de operación será de 3.975 metros cúbicos [...] El único momento en el que se requiere una cantidad significativa de agua es el inicial. En concreto, 27.717 m³ el primer año, destinados exclusivamente al llenado del circuito cerrado, según la información facilitada desde la empresa."
  - id: src-7
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1343967440606"
    titulo: "ORDEN EEI/785/2024, de 11 de julio [...] «Campus de Centros de Datos Microsoft» en el término municipal de Villamayor de Gállego (Zaragoza) — empleo"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2024-07-22"
    fecha_consulta: "2026-08-31"
    cita: "Durante la fase de construcción, además de los futuros empleos directos creados, se estiman unas necesidades de contratación de entre 1.000 y 2.000 trabajadores (una media anual aproximada de 300-400 empleos) para completar el desarrollo del Campus en su totalidad. [...] Una vez concluida la fase de construcción, se espera poder generar hasta 300 empleos fijos en la fase operativa del Campus."
  - id: src-8
    url: "https://www.eldiario.es/aragon/sociedad/microsoft-avanza-red-centros-datos-zaragoza-proyecta-mayores-regiones-europa_1_12768636.html"
    titulo: "Microsoft avanza con su red de centros de datos en Zaragoza, donde proyecta una de sus mayores regiones en Europa — potencia asegurada por instalación"
    editor: "elDiario.es Aragón"
    tipo: prensa_general
    fecha_consulta: "2026-08-31"
    cita: "Por ahora, la multinacional estadounidense tiene asegurados 50 megavatios de 'enchufe' para cada instalación; el resto, hasta 300 MW por planta, está previsto para una segunda fase."
