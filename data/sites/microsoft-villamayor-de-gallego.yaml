  - id: src-3
    url: "https://www.eldiario.es/aragon/sociedad/microsoft-avanza-red-centros-datos-zaragoza-proyecta-mayores-regiones-europa_1_12768636.html"
    titulo: "Microsoft avanza con su red de centros de datos en Zaragoza, donde proyecta una de sus mayores regiones en Europa"
    editor: "elDiario.es Aragón"
    tipo: prensa_general
    fecha_consulta: "2026-08-29"
    cita: "Cada centro de datos contará asimismo con dos conexiones a las subestaciones de Plaza (La Muela), Malpica (Villamayor) y Torrero-Valdeconsejo (Zaragoza)."
  - id: src-4
    url: "https://query.wikidata.org/sparql"
    titulo: "Wikidata Query Service — coordenadas del municipio de Villamayor de Gállego (propiedad P625)"
    editor: "Wikidata"
