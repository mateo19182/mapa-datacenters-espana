    titulo: "ORDEN FOM/1520/2025, de 14 de noviembre, por el que se aprueba inicialmente el Plan de Interés General «Implantación de la Región Microsoft en Aragón»"
    editor: "Boletín Oficial de Aragón"
    tipo: oficial
    fecha_publicacion: "2025-11-18"
    fecha_consulta: "2026-08-29"
    cita: "se delimita un nuevo Sector de planeamiento urbanístico con una superficie total de unas 74,16 ha [...] el Campus ocupará una única parcela de uso productivo con una superficie neta de 54,89 ha [...] ordenará una superficie total de 80,67 ha."
  - id: src-2
    url: "https://www.boa.aragon.es/cgi-bin/EBOA/BRSCGI?CMD=VEROBJ&MLKOB=1343967440606"
    titulo: "ORDEN EEI/785/2024, de 11 de julio, por la que se da publicidad al Acuerdo de 3 de julio de 2024, del Gobierno de Aragón, por el que se declara como inversión de interés autonómico con interés general de Aragón el Proyecto «Campus de Centros de Datos Microsoft» en el término municipal de Villamayor de Gállego"
    editor: "Boletín Oficial de Aragón"
