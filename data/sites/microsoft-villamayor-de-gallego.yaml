id: microsoft-villamayor-de-gallego
nombre: "Microsoft Región Aragón — Campus Villamayor de Gállego"
alias:
  - "Campus de Centros de Datos Microsoft Villamayor de Gállego"
  - "PIGA Región MSFT — ámbito Villamayor de Gállego"
tipo: campus
operador: "Microsoft"
propietario: "Microsoft 7724 Spain, S.L.U."
modelo: hyperscale

ubicacion:
  municipio: "Villamayor de Gállego"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Nuevo sector urbanístico delimitado sobre el Área 84/2 de Suelo Urbanizable No Delimitado, entre el núcleo urbano y el polígono industrial Malpica"
  lat: 41.685556
  lon: -0.773889
  precision: municipio
  fuentes: [src-1, src-4]

estado: en_tramitacion
estado_detalle: >-
  Declarado inversión de interés autonómico con interés general de Aragón el 3 de julio de 2024, con
  modificación de la delimitación del ámbito aprobada el 14 de mayo de 2025 y una redelimitación
  posterior publicada el 10 de marzo de 2026. Integrado en el PIGA "Implantación de la Región
  Microsoft en Aragón", aprobado inicialmente el 14 de noviembre de 2025 y modificado el 24 de julio
  de 2026 para incorporar el estudio de impacto ambiental. La documentación de urbanización de julio
  2026 describe seis edificios de 57,6 MW y 345,6 MW por emplazamiento, sin tipificar. El
  procedimiento sigue siendo de aprobación inicial e información pública; no se ha localizado
  autorización ambiental definitiva ni inicio de obra del CPD.
estado_fuentes: [ src-1, src-2, src-esia-urbanizacion-202607, src-piga-actual-20261017 ]

potencia:
  - tipo: conexion_red
    valor_mw: 50
    ambito: campus
    referencia: "Potencia de acceso a red asegurada para la primera fase"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-11-19"
    fuentes: [src-3, src-8]
    nota: "Dato de prensa; no confirmado por fuente oficial."
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: Objetivo histórico de segunda fase publicado en prensa en noviembre 2025
    estado_asociado: anunciado
    fecha_dato: "2025-11-19"
    fuentes: [src-3, src-8]
    nota: Dato de prensa, sin precisar tipo de potencia. La documentación ambiental de urbanización de
      julio 2026 publica posteriormente 345,6 MW sin tipificar; no son cifras adicionales.
  - tipo: no_especificado
    valor_mw: 345.6
    ambito: campus
    referencia: Capacidad prevista del emplazamiento en el EsIA de urbanización
    estado_asociado: en_tramitacion
    fecha_dato: 2026-07
    fuentes:
      - src-esia-urbanizacion-202607
    nota: PDF, página 52. Seis edificios de 57,6 MW. El párrafo no etiqueta los MW como carga IT,
      potencia total o permiso de acceso; no se asigna una tipificación por analogía ni se considera
      capacidad construida.

fases:
  - nombre: "Fase 1"
    estado: en_tramitacion
    fuentes: [src-3]

conexion_electrica:
  subestacion: "Subestación propia en el campus (132 kV, previsto paso a 220 kV en segunda fase); dos conexiones a la subestación de Malpica"
  tension_kv: 132
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1, src-5]
  nota: >-
    El PIGA prevé la conexión de infraestructura eléctrica exterior de alta tensión
    subterránea con dos líneas de 4.370 m y 4.442 m que discurren por los términos
    municipales de Villamayor de Gállego y La Puebla de Alfindén.

superficie_parcela_m2: 806700
inversion_anunciada_eur: 1733577386
refrigeracion: >-
  Refrigeración líquida recirculada en circuito cerrado, sin torres de evaporación.

agua:
  circuito: cerrado
  sistema: >-
    Refrigeración líquida recirculada en circuito cerrado que enfría directamente los chips.
    Según la compañía, no depende de torres de evaporación ni de aportes continuos de agua:
    "una vez que el sistema se llena durante la construcción, el agua circula de manera
    continua entre los servidores y los equipos de refrigeración sin necesidad de suministro
    adicional". El agua de lluvia de las cubiertas se recoge para usos no potables.
  origen: null
  nota: La documentación del PIGA cifra en 3.975 m³/año la demanda industrial a plena capacidad a
    partir del segundo año de operación y en 27.717 m³ el llenado inicial del circuito el primer
    año, pero lo hace para los TRES campus de Microsoft en Aragón conjuntamente. No se registra
    consumo por emplazamiento porque repartir esa cifra exigiría una clave de reparto que no consta.
    El Acuerdo de declaración de interés autonómico recoge además el compromiso corporativo de
    "Impacto positivo en Agua (Water positive)" para 2030. El EsIA de urbanización localizado en
    octubre 2026 no permite interpretar el riego de viarios o el consumo de obra como consumo
    operativo del CPD.
  fuentes:
    - src-6
    - src-7
    - src-esia-urbanizacion-202607

energia:
  - consumo_gwh_ano: 3777
    referencia: "Consumo eléctrico máximo anual previsto para el campus de Villamayor de Gállego"
    fecha_dato: "2025-11-19"
    fuentes: [src-5]
    nota: >-
      Cifra de la documentación del PIGA conocida a través de prensa. Es un máximo, no una
      previsión central. Sumada a las de La Muela (3.700 GWh/año) y Zaragoza (3.100 GWh/año),
      la misma fuente da más de 10.500 GWh/año para los tres campus.

empleo:
  - tipo: construccion
    valor: 2000
    referencia: "Extremo superior de la horquilla de trabajadores necesarios para completar el desarrollo del campus (entre 1.000 y 2.000, con una media anual aproximada de 300-400)"
    fecha_dato: "2024-07-22"
    fuentes: [src-7]
    nota: >-
      La memoria da una horquilla de 1.000 a 2.000 trabajadores; se registra el extremo
      superior y se advierte del rango en lugar de promediarlo. La media anual estimada es de
      300 a 400 empleos.
  - tipo: directo
    valor: 300
    referencia: "Empleos fijos previstos en la fase operativa del campus"
    fecha_dato: "2024-07-22"
    fuentes: [src-7]
    nota: "La memoria dice «hasta 300», es decir, un techo, no una previsión central."
enlaces_proyecto:
  - "https://www.aragon.es/-/piga-microsoft"

incertidumbres:
  - campo: superficie_parcela_m2
    descripcion: >-
      El PIGA distingue tres cifras: 74,16 ha del nuevo sector, 54,89 ha de parcela neta de
      uso productivo del campus y 80,67 ha del subámbito Sector-SG. Se registra la mayor
      (80,67 ha) como ámbito ordenado.
    fuentes: [src-1]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Suma de los dos conceptos que el PIGA desglosa para Villamayor de Gállego
      (1.700.093.540,63 € de obras en el campus y 33.483.845,89 € de urbanización).
    fuentes: [src-1]
  - campo: potencia
    descripcion: El EsIA de urbanización de julio 2026 publica 345,6 MW previstos, sin tipificación.
      Sustituye como objetivo documental más reciente a los 300 MW de prensa de 2025. Los 50 MW de
      acceso de la primera fase siguen siendo una afirmación de prensa, sin resolución de acceso
      contrastada.
    fuentes:
      - src-1
      - src-3
      - src-esia-urbanizacion-202607
  - campo: energia
    descripcion: Las cifras anuales de energía proceden de prensa que cita el PIGA. El EsIA localizado
      corresponde a urbanización exterior y no concilia esos consumos con la capacidad del CPD. Al
      no estar tipificados los MW, no se deduce una potencia media ni se afirma una imposibilidad
      física entre ámbitos que pueden ser distintos.
    fuentes:
      - src-5
      - src-3
      - src-piga-hoyaragon
      - src-esia-urbanizacion-202607

confianza: media
