  fuentes: [src-1, src-2]

inversion_anunciada_eur: 1150000000

incertidumbres:
  - campo: conexion_electrica
    descripcion: >-
      El coste de la subestación asociada se cifra en 15 millones de euros por
      DatacenterDynamics y en 20 millones por Murcia Plaza. Ambas coinciden en más de
      5 millones en garantías para la reserva de capacidad.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      A junio de 2026 no había emplazamiento cerrado: dos opciones alternativas en el
      entorno de Espinardo. Coordenadas a nivel de municipio.
    fuentes: [src-2]
  - campo: potencia
    descripcion: >-
      Los 140 MW se citan como «capacidad» sin distinguir carga TI de potencia de acceso.
      Como contexto, la Región de Murcia tenía 1 MW de potencia IT instalada al cierre de
      2025 según Spain DC.
    fuentes: [src-1, src-4]

confianza: media
ultima_verificacion: "2026-08-29"

