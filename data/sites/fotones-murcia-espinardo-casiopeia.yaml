conexion_electrica:
  subestacion: "Subestación propia a construir por el promotor"
  titular_red: "Iberdrola"
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1, src-2, src-5]
  nota: >-
    Iberdrola ha concedido el acceso a la red para la primera fase y la segunda sigue en
    tramitación, pero ninguna fuente publica los MW concedidos ni el nudo. El promotor ha
    depositado más de 5 millones de euros en garantías ante Red Eléctrica y prevé destinar
    otros 15 millones a construir la subestación.

inversion_anunciada_eur: 1150000000

incertidumbres:
  - campo: conexion_electrica
    descripcion: >-
      El coste de la subestación asociada se cifra en 15 millones de euros por
      DatacenterDynamics y en 20 millones por Murcia Plaza. Ambas coinciden en más de
      5 millones en garantías para la reserva de capacidad.
    fuentes: [src-1, src-2]
  - campo: ubicacion
    descripcion: >-
      A junio de 2026 no había emplazamiento cerrado: el centro comercial Myrtea, con más de
      20.000 m² y un coste de unos 20 millones de euros, o una parcela vecina de 70.000 m²
      de la empresa yeclana Inurban por 7,4 millones, esta última sin urbanizar y de
      desarrollo más lento. Coordenadas a nivel de municipio.
    fuentes: [src-2, src-5]
  - campo: potencia
    descripcion: >-
      Los 140 MW se citan como «capacidad» sin distinguir carga TI de potencia de acceso.
      Como contexto, la Región de Murcia tenía 1 MW de potencia IT instalada al cierre de
      2025 según Spain DC. Ninguna de las fuentes localizadas hasta agosto de 2026 tipifica
      la cifra, y Grupo Fotones no pertenece a Spain DC, por lo que el proyecto no figura en
      las previsiones sectoriales de la asociación hasta 2030.
    fuentes: [src-1, src-4, src-5]
  - campo: inversion_anunciada_eur
    descripcion: >-
      Los 1.150 millones son la cifra comunicada al INFO. La misma fuente advierte de que
      aplicando el coste habitual de entre 10 y 12 millones de euros por MW el total podría
      elevarse hasta unos 1.680 millones si se desarrollan los 140 MW completos: es una
      estimación derivada, no una cifra del promotor, y no se registra.
    fuentes: [src-5]

confianza: media
ultima_verificacion: "2026-08-31"

