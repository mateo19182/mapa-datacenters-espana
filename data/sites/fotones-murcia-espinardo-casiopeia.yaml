estado: anunciado
estado_detalle: >-
  Proyecto anunciado en junio de 2026. Iberdrola ha concedido el acceso a la red para la
  primera fase; la segunda está en tramitación (el promotor esperaba resolución a finales
  de 2026 o principios de 2027). El emplazamiento concreto no está cerrado: se barajan el
  centro comercial Myrtea (>20.000 m²) y una parcela de Inurban (70.000 m²). Inicio de
  construcción previsto para finales de 2027 y finalización en 2028. El promotor no
  pretende necesariamente explotar el centro: ha contratado a Deloitte para buscar un
  operador especializado al que vender el proyecto, con la opción de permanecer en el
  capital. La cifra de 1.150 millones es la comunicada al acelerador de inversiones del
  Instituto de Fomento de la Región de Murcia (INFO).
estado_fuentes: [src-1, src-2, src-5]

