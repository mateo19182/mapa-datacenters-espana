incertidumbres:
  - campo: potencia
    descripcion: >-
      No se especifica si los 120 MW son carga TI, potencia de conexión o potencia
      instalada. Se registran como no especificado.
    fuentes: [src-1]
  - campo: conexion_electrica
    descripcion: >-
      El proyecto incluye una subestación eléctrica propia, pero no consta su tensión,
      titular de red ni el punto de conexión.
    fuentes: [src-1]
  - campo: estado
    descripcion: >-
      A agosto de 2026 el proyecto debe completar su tramitación y obtener la
      consideración de proyecto de interés estratégico regional. No se han
      identificado públicamente el operador final, los clientes ni la estructura
      financiera, ni se concreta el sistema de refrigeración ni el consumo de agua.
    fuentes: [src-1, src-3]
  - campo: empleo
    descripcion: >-
      Las cifras no cuadran entre sí: la nota oficial habla de «1.318 empleos
      anuales, entre directos, indirectos e inducidos», mientras la prensa que cubrió
      la presentación desglosa 120 directos y unos 960 indirectos, que suman 1.080.
      La diferencia serían los inducidos, pero ninguna fuente lo dice. Se registran
      las tres cifras por separado y no se suman.
    fuentes: [src-4, src-5]

