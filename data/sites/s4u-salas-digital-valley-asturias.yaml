estado: anunciado
estado_detalle: >-
  Anunciado por el Gobierno del Principado de Asturias el 3 de agosto de 2026.
  Campus de diez módulos de centro de datos para procesamiento, almacenamiento y
  gestión de datos e IA. Incluye subestación eléctrica propia e instalación
  fotovoltaica. Tramitación administrativa prevista para 2026-2027, urbanización
  entre el segundo semestre de 2027 y el primero de 2028, y construcción de
  infraestructuras del tercer trimestre de 2027 al cuarto de 2030. El recinto reserva
  un 28% del espacio para zonas verdes, contará con 375 plazas de aparcamiento y una
  instalación fotovoltaica de 350 paneles. Aspira a la calificación de proyecto de
  interés estratégico regional (PIER). Un informe de PwC estima una aportación
  acumulada de 4.177 millones al PIB regional en veinte años. El proyecto está
  financiado por un fondo de inversión estadounidense.
estado_fuentes: [src-1, src-4, src-5]

potencia:
