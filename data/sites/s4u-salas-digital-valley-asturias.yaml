superficie_parcela_m2: 154584
superficie_construida_m2: 46865
inversion_anunciada_eur: 1226300000

agua:
  circuito: desconocido
  sistema: >-
    Sin describir en la documentación difundida del proyecto. Promotor y Principado
    lo han equiparado verbalmente a un circuito cerrado de refrigeración que se llena
    una vez y no repone agua de forma continua.
  origen: null
  nota: >-
    Ninguna fuente cifra el consumo. El socio director de la promotora afirmó en la
    presentación que «consumimos lo mismo que cualquier circuito cerrado de
    refrigeración», y el presidente del Principado describió después un sistema en el
    que «la misma agua se está utilizando una y otra vez [...] no hay reposición
    continua de agua, se llena una vez y se mantiene». Son declaraciones públicas, no
    documentación técnica: la documentación difundida del proyecto no concreta el
    sistema de refrigeración ni el consumo de agua, de modo que el circuito se deja
    como desconocido.
  fuentes: [src-3, src-5, src-6]

