estado: operativo
estado_detalle: >-
  Inaugurado el 07/07/2026 tras siete meses de renovación de la instalación existente.
  Certificación Tier III y ENS categoría Alta. No es una construcción nueva: se trata de la
  ampliación del CPD que Nunsys adquirió en 2018 y que en su día perteneció a Tissat,
  empresa creada por la Generalitat, Iberdrola y Telefónica y vendida después a Wahala. El
  plan de la compañía prevé inyecciones económicas adicionales durante los cinco años
  siguientes; el centro presta servicio a 1.500 clientes y factura cerca de 3 millones de
  euros anuales, con el objetivo de llegar a 10 millones en un lustro.
