    nota: >-
      Expansión lo presenta como plantilla ya existente («La filial emplea actualmente a
      unas 500 personas, de las que 120 se dedican al centro de datos»); Las Provincias
      titula el mismo día que la compañía «prevé crear 120 empleos». Se registra la lectura
      de plantilla actual y se anota la divergencia.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Ninguna de las fuentes consultadas publica potencia eléctrica (ni MW IT ni de
      conexión). Solo constan 450 m², 150 racks y capacidad para 5.000 servidores. La
      cobertura de la inauguración de julio de 2026 —Expansión, DatacenterDynamics, Europa
      Press, Las Provincias, Valencia Plaza— repite los mismos tres datos sin añadir MW.
    fuentes: [src-1, src-2, src-3, src-4]
  - campo: empleo
    descripcion: >-
      Dos lecturas del mismo dato el mismo día: Expansión atribuye 120 personas ya
      dedicadas al centro de datos y Las Provincias titula que la compañía «prevé crear 120
      empleos». Ninguna fuente desglosa cuánto es plantilla nueva.
    fuentes: [src-2, src-3]

