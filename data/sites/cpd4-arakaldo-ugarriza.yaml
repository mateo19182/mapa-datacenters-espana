estado: en_tramitacion
estado_detalle: >-
  Ekin Inbertsioak, propietaria del suelo desde 2019, trabaja en el proyecto desde 2021 y ha
  constituido para ejecutarlo la sociedad CPD 4 Arakaldo, S.L. Presentó la solicitud de Plan
  Especial en marzo de 2025, la retiró en mayo y volvió a presentarla en septiembre. El pleno
  municipal de marzo de 2026 le dio la aprobación inicial, con el informe urbanístico
  favorable del arquitecto municipal y el visto bueno de la Diputación Foral de Bizkaia y de
  la agencia URA. El alcalde, Humberto Perea, se declara escéptico sobre la viabilidad: calcula
  que los trámites pueden alargarse otros dos años, la aprobación definitiva corresponde a la
  Diputación Foral por tener Arakaldo menos de 1.000 habitantes, y advierte de que el
  emplazamiento no está preparado hoy para el consumo eléctrico de un centro de datos. Según el
  alcalde, Ekin Inbertsioak se limitaría a gestionar el suelo y dejaría después el proyecto en
  manos de otra empresa. La compañía declinó hacer declaraciones al medio que publicó la
  información. El terreno se usa entretanto como depósito de residuos.
estado_fuentes: [src-1]

