  - campo: estado
    descripcion: >-
      Solo hay aprobación inicial de un Plan Especial municipal. Faltan la aprobación definitiva
      foral, la tramitación ambiental y la licencia de obras. El Ayuntamiento estima dos años más
      de trámites y no descarta recursos.
    fuentes: [src-1]
