estado: ampliacion_en_construccion
estado_detalle: >-
  Instalación de 16.000 m² con dos CPD simétricos, operativa desde 2024. En septiembre de 2025
  Templus declaró 10 MW en servicio y el objetivo de duplicar hasta 20 MW a medio plazo.
estado_fuentes: [src-2]
fecha_puesta_en_servicio: "2024"

potencia:
  - tipo: no_especificado
    valor_mw: 20
    ambito: edificio
    referencia: "Total power (ficha de Templus)"
    estado_asociado: desconocido
    fecha_dato: "2026-08-29"
    fuentes: [src-1]
  - tipo: no_especificado
    valor_mw: 10
    ambito: edificio
    referencia: "Potencia en servicio en septiembre de 2025"
    estado_asociado: operativo
    fecha_dato: "2025-09-18"
    fuentes: [src-2]

fases:
  - nombre: "Dos CPD simétricos"
    estado: operativo
    superficie_m2: 16000
    fuentes: [src-2]

superficie_construida_m2: 16000
refrigeracion: "PUE declarado de 1,3; estación solar fotovoltaica propia; objetivo de cero emisiones netas."
enlaces_proyecto:
  - "https://templus.com/data-centers/madrid-mad01/"

incertidumbres:
  - campo: ubicacion
    descripcion: >-
      La ficha del centro en la web de Templus no da dirección postal y MAD01 no figura en
      PeeringDB. La dirección registrada, calle Tales de Mileto 1, es el domicilio que la propia
      Templus declara en su aviso de privacidad y la que usan los directorios sectoriales; un
      directorio la sitúa en el número 21 de la misma calle. Las coordenadas son el centroide de
      la calle, no del edificio, y por eso la precisión es aproximada.
    fuentes: [src-1, src-3, src-4, src-5]
  - campo: superficie_construida_m2
    descripcion: >-
      La prensa especializada da dos superficies para el mismo centro en la misma semana de
      septiembre de 2025: 16.000 m² «de superficie» y 32.000 m² «construidos entre zonas técnicas
      y oficinas». Se conserva la primera, que es la del registro, y se deja constancia de la
      segunda.
    fuentes: [src-2, src-5]
  - campo: potencia
    descripcion: >-
      La ficha de Templus etiqueta los 20 MW como "Total power" pero la nota de prensa habla de
      "20 MW de potencia" como objetivo a medio plazo partiendo de 10 MW. No se aclara si son
      MW TI o totales.
    fuentes: [src-1, src-2]

