estado: ampliacion_en_construccion
estado_detalle: >-
  Centro operativo desde 2024. En septiembre de 2025 Templus declaró 10 MW en servicio,
  32.000 m² construidos entre zonas técnicas y oficinas y una nueva sala IT en construcción
  para duplicar hasta 20 MW. La ficha comercial actual anuncia 20 MW sin acreditar su entrega.
  En octubre de 2025 el operador documentó un rack Lenovo con NVIDIA B200 instalado para
  GPU Solutions; no publica número de aceleradores.
estado_fuentes: [src-2, src-ampliacion-20250917, src-gpu-solutions-20251009]
fecha_puesta_en_servicio: "2024"

potencia:
  - tipo: no_especificado
    valor_mw: 20
    ambito: edificio
    referencia: "Objetivo completo tras construir una nueva sala IT, anunciado en septiembre de 2025"
    estado_asociado: en_construccion
    fecha_dato: "2025-09-17"
    fuentes: [src-ampliacion-20250917]
    nota: >-
      La nota primaria confirma nueva sala en construcción para pasar de 10 a 20 MW.
      Los 20 MW incluyen los 10 existentes; no son un incremento de 20 MW ni se suman a
      ellos. El objetivo fechado no acredita entrega posterior de toda la capacidad.
  - tipo: no_especificado
    valor_mw: 20
    ambito: edificio
    referencia: "Total power (ficha de Templus)"
    estado_asociado: desconocido
    fecha_dato: "2026-08-29"
    fuentes: [src-1]
    nota: "Valor comercial sin fecha de entrega. La página de red también lo etiqueta como potencia IT, en otro bloque; no se normaliza esa contradicción."
  - tipo: no_especificado
    valor_mw: 10
    ambito: edificio
    referencia: "Potencia en servicio en septiembre de 2025"
    estado_asociado: operativo
    fecha_dato: "2025-09-18"
    fuentes: [src-2]

fases:
  - nombre: "Dos CPD simétricos"
    estado: operativo
    fuentes: [src-2]

superficie_construida_m2: 32000
refrigeracion: "PUE declarado de 1,3; estación solar fotovoltaica propia; objetivo de cero emisiones netas."
enlaces_proyecto:
  - "https://templus.com/data-centers/madrid-mad01/"

computo:
  - tipo: gpu
    modalidad: instalado
    ambito: particion
    sistema: "Rack de IA de GPU Solutions en Templus Alcalá de Henares"
    operador_computo: "GPU Solutions"
    modelo: "NVIDIA B200 en infraestructura Lenovo con refrigeración líquida Neptune"
    unidades: null
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2025-10-09"
    fuentes: [src-gpu-solutions-20251009, src-pin-mad01]
    nota: >-
      Templus documenta un primer rack instalado en su CPD de Alcalá. No publica cantidad de
      GPU ni nodos. Los hasta 60 kW son la capacidad del rack, no potencia TI medida del CPD;
      la posibilidad de cuadruplicar capacidad es una ampliación futura. La atribución a
      MAD01 identifica el centro de Alcalá, sin asignar una sala o edificio interno concreto.

incertidumbres:
  - campo: ubicacion
    descripcion: El pin nominal Templus MAD01 en Google Maps identifica Tales de Mileto 1 y enlaza
      templus.com, coincidiendo con la dirección documental. Se usa su marcador del lugar con
      precisión aproximada, sin situar una sala de GPU ni cada uno de los dos CPD internos. La
      referencia de un directorio al número 21 se conserva como discrepancia de dirección.
    fuentes:
      - src-1
      - src-3
      - src-4
      - src-5
      - src-pin-mad01
      - src-mapa-mad01
  - campo: superficie_construida_m2
    descripcion: La prensa especializada da 16.000 m² de superficie y 32.000 m² construidos entre zonas
      técnicas y oficinas para el mismo centro. La nota primaria de Templus confirma 32.000 m²
      construidos; se adopta esa magnitud sin equipararla con los 2.600 m² de superficie IT de la
      ficha comercial ni sumarla a los 16.000 m² de la otra noticia.
    fuentes:
      - src-1
      - src-2
      - src-5
      - src-ampliacion-20250917
  - campo: potencia
    descripcion: La ficha de Templus etiqueta los 20 MW como "Total power" pero la nota de prensa habla
      de "20 MW de potencia" como objetivo a medio plazo partiendo de 10 MW. No se aclara si son MW
      TI o totales. La página de red contiene además otro bloque que llama a los mismos 20 MW
      potencia IT, sin fecha ni confirmación de entrega. Se mantiene el tipo desconocido.
    fuentes:
      - src-1
      - src-2
      - src-red-actual

