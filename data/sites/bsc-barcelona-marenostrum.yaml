id: bsc-barcelona-marenostrum
nombre: "Barcelona Supercomputing Center — MareNostrum (Campus Nord UPC)"
alias:
  - "BSC-CNS"
  - "MareNostrum 5"
  - "Torre Girona"
tipo: edificio
operador: "Barcelona Supercomputing Center – Centro Nacional de Supercomputación"
propietario: "Barcelona Supercomputing Center – Centro Nacional de Supercomputación"
modelo: corporativo

ubicacion:
  municipio: "Barcelona"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Plaça Eusebi Güell, 1-3, 08034 Barcelona (Campus Nord UPC)"
  lat: 41.3897809
  lon: 2.1163849
  precision: exacta
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Instalación pública de computación de altas prestaciones. MareNostrum 5 se
  reparte entre la capilla de Torre Girona (donde estuvo MareNostrum 4) y las
  plantas inferiores del edificio del BSC, a corta distancia. Se incluye en el
  mapa por su consumo eléctrico y su papel en la infraestructura de cómputo
  catalana, no como centro de datos comercial.
  El emplazamiento aloja además **tres ordenadores cuánticos**, que no generan ficha propia
  por la regla del esquema para instalaciones cuánticas: los dos instalados por la iniciativa
  Quantum Spain y la SEDIA, entre ellos MareNostrum Ona, ampliado con un procesador de 35
  cúbits; y el EuroQCS-Spain, inaugurado el 28 de mayo de 2026 en la renovada capilla de Torre
  Girona, cofinanciado por la Comisión Europea y el Gobierno de España con 9,8 millones y
  construido por Qilimanjaro Quantum Tech. Con ellos MareNostrum 5 es uno de los primeros
  superordenadores del mundo que combina computación clásica con cuántica digital y analógica.
  Ninguna fuente publica el consumo eléctrico de estos sistemas por separado, así que no
  aportan ninguna cifra a `potencia[]`.
estado_fuentes: [src-1, src-4, src-5]

potencia: []

computo:
  - tipo: cpu_hpc
    sistema: "MareNostrum 5 GPP (partición de propósito general)"
    modelo: "Intel Xeon Platinum 8480+ (56 núcleos cada uno)"
    unidades: 12960
    tipo_unidad: procesador
    rendimiento: 54
    rendimiento_unidad: pflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-6]
    nota: >-
      La ficha técnica de MareNostrum 5 da 45,9 PFlops de pico para esta misma partición
      (6.480 nodos). La discrepancia queda anotada en `incertidumbres[]` y no se resuelve.
  - tipo: gpu
    sistema: "MareNostrum 5 ACC (partición acelerada)"
    modelo: "NVIDIA H100 de 64 GB HBM2 (Hopper), 4 por nodo"
    unidades: 4480
    tipo_unidad: acelerador
    nodos: 1120
    rendimiento: 260
    rendimiento_unidad: pflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-6]
    nota: >-
      Medida con Linpack, la misma partición da 175,30 PFlop/s (Rmax) frente a 249,44 PFlop/s
      de pico según TOP500, con 663.040 núcleos. Pico y medida no se comparan ni se sustituyen:
      la cifra medida se deja aquí y no genera un segundo registro para no duplicar el
      recuento de aceleradores.
  - tipo: cpu_hpc
    sistema: "MareNostrum 5 GPP-NextGen (partición de nueva generación)"
    modelo: "NVIDIA Grace CPU"
    unidades: 802
    tipo_unidad: procesador
    rendimiento: 5.7
    rendimiento_unidad: pflops
    rendimiento_tipo: pico
    rendimiento_precision: fp64
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-6]
    nota: null
  - tipo: gpu
    sistema: "MareNostrum 5 AI Upgrade (partición de IA, BSC AI Factory)"
    modelo: "NVIDIA Blackwell y Blackwell Ultra"
    unidades: 1920
    tipo_unidad: acelerador
    rendimiento: 19
    rendimiento_unidad: eflops
    rendimiento_tipo: pico
    rendimiento_precision: fp4
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-6, src-8]
    nota: >-
      Los 19 EFlop/s son en FP4 y no se comparan con los PFlops en FP64 de las otras
      particiones: son precisiones distintas. La ampliación se adjudicó en enero de 2026 al
      consorcio liderado por Fsas Technologies (Fujitsu) y Telefónica por 129 millones de euros
      y se reparte entre el centro de datos del BSC y la capilla de Torre Girona.
  - tipo: qpu
    sistema: "MareNostrum Ona (partición cuántica, digital)"
    modelo: "Procesador de cúbits superconductores tipo transmon, de Qilimanjaro y GMV"
    unidades: 35
    tipo_unidad: qubit
    estado: operativo
    fecha_dato: "2026-08-31"
    fuentes: [src-5]
    nota: >-
      Es el último de los procesadores incorporados: el sistema pasó de 5 a 35 cúbits. No es
      capacidad de centro de datos y no aporta ninguna cifra a `potencia[]`.
  - tipo: qpu
    sistema: "EuroQCS-Spain (cuántico analógico)"
    modelo: "Cúbits superconductores tipo fluxonium, de Qilimanjaro Quantum Tech"
    estado: operativo
    fecha_dato: "2026-05-28"
    fuentes: [src-4]
    nota: >-
      Ninguna fuente publica el número de cúbits de este sistema, así que el recuento queda
      vacío. Codificación analógica de la información, complementaria a los dos sistemas
      digitales del mismo emplazamiento.

incertidumbres:
  - campo: potencia
    descripcion: >-
      Sí existen cifras publicadas, pero no son capacidad del centro y por eso no
      se registran en `potencia[]`. Una presentación del director de operaciones
      del BSC de octubre de 2024 da consumos medidos durante la ejecución del
      benchmark Linpack por partición: «5.7 MW under HPL» para la partición de
      propósito general y «2.5 MW under HPL» / «4.1 MW under HPL (175 PF/s)» para
      la acelerada, más 400-550 kW del almacenamiento en disco y menos de 10 kW
      de las librerías de cinta. Son potencias instantáneas en una prueba de
      carga máxima, no potencia instalada ni contratada, y sumarlas o compararlas
      con los MW de un CPD comercial daría una cifra falsa. Las cifras de 1,3 MW
      que circulan corresponden a MareNostrum 4, no al sistema actual.
    fuentes: [src-1, src-3]
  - campo: computo
    descripcion: >-
      Las dos páginas del propio BSC discrepan sobre el pico de la partición de propósito
      general: la ficha general de MareNostrum habla de 54 PFlop/s y la ficha técnica de
      MareNostrum 5 de «45,9 PFlops peak» para 6.480 nodos. Se registra la primera y se
      conserva el choque. La ficha técnica describe además la partición acelerada de nueva
      generación como «not fully defined», anterior a que se concretara como la partición de IA
      con aceleradores Blackwell.
    fuentes: [src-1, src-6]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas corresponden al edificio principal del BSC. La capilla de
      Torre Girona, que aloja parte del sistema, está a pocos metros y no tiene
      coordenadas propias registradas aquí.
    fuentes: [src-2]

