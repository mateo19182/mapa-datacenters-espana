estado: operativo
estado_detalle: >-
  Instalación pública de computación de altas prestaciones. MareNostrum 5 se
  reparte entre la capilla de Torre Girona (donde estuvo MareNostrum 4) y las
  plantas inferiores del edificio del BSC, a corta distancia. Se incluye en el
  mapa por su consumo eléctrico y su papel en la infraestructura de cómputo
  catalana, no como centro de datos comercial.
estado_fuentes: [src-1]

potencia: []

incertidumbres:
  - campo: potencia
    descripcion: >-
      No se ha localizado una cifra publicada del consumo eléctrico de
      MareNostrum 5 en fuente primaria. Las cifras de 1,3 MW que circulan
      corresponden a MareNostrum 4, no al sistema actual, y no se registran aquí.
    fuentes: [src-1]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas corresponden al edificio principal del BSC. La capilla de
      Torre Girona, que aloja parte del sistema, está a pocos metros y no tiene
      coordenadas propias registradas aquí.
    fuentes: [src-2]

