incertidumbres:
  - campo: potencia
    descripcion: >-
      Global Switch publica 14 MW (Madrid 1) y 56 MW (Madrid 2), 70 MW en conjunto, sin decir si es
      potencia TI o total. El directorio OCOLO atribuye 18 MW al conjunto. Contradicción sin
      resolver.
    fuentes: [ src-1, src-3 ]
  - campo: estado
    descripcion: >-
      La web de Global Switch presenta Madrid 1 y Madrid 2 en el mismo listado, sin decir que el
      segundo está por construir. La cronología quedó clara en agosto de 2026 con el inicio de las
      obras: los 56 MW de Madrid 2 son capacidad de diseño y no capacidad energizada, y no llegarán
      completos hasta 2032.
    fuentes: [ src-1, src-4 ]
  - campo: potencia
    descripcion: >-
      La cifra de 18 MW del directorio comercial no lleva fecha propia, de modo que no se puede
      saber si es una lectura antigua de Madrid 1 o una atribución errónea al conjunto. Al
      registrarse con la fecha de consulta, es la lectura de ámbito campus más reciente y domina la
      agregación por delante de los 70 MW que declara el operador.
    fuentes: [ src-1, src-3, src-4 ]
  - campo: conexion_electrica
    descripcion: Las cifras 14 MW y 56 MW publicadas por el operador no identifican un permiso de
      acceso. No consta potencia de acceso otorgada, tensión ni volumen de agua del campus.
    fuentes: [ src-listado-operador-20261014, src-icex-20260909 ]

confianza: media
ultima_verificacion: "2026-10-17"

