  fuentes: [ src-1, src-2 ]

estado: ampliacion_en_construccion
estado_detalle: >-
  Madrid 1 está en servicio: se construyó en el año 2000, tiene 12.000 m² y 14 MW, y arrastra
  ampliaciones con mejoras previstas hasta 2027. Madrid 2 no está construido: las obras arrancaron
  en agosto de 2026, con 24.000 m² y 56 MW, entrada en funcionamiento prevista en 2029 y plena
  capacidad en 2032, a cargo de la constructora EIGO Construcciones. Con los dos edificios el campus
  declara 70 MW.
estado_fuentes: [ src-1, src-4, src-icex-20260909 ]

potencia:
  - tipo: no_especificado
    valor_mw: 14
    ambito: edificio
    edificio: "Madrid 1"
    referencia: "Madrid 1"
    estado_asociado: operativo
    fecha_dato: "2026-08-17"
    fuentes:
      - src-1
      - src-4
      - src-listado-operador-20261014
  - tipo: no_especificado
    valor_mw: 56
    ambito: edificio
    edificio: "Madrid 2"
    referencia: "Madrid 2"
    estado_asociado: en_construccion
    fecha_dato: "2026-08-17"
    fuentes:
      - src-1
      - src-4
      - src-listado-operador-20261014
    nota: >-
      La ficha comercial de Global Switch lista Madrid 2 junto a Madrid 1 sin distinguir su estado;
      la crónica del inicio de obras, de agosto de 2026, aclara que el edificio está por construir y
      prevé su entrada en servicio en 2029 y la plena capacidad en 2032.
  - tipo: no_especificado
    valor_mw: 18
    ambito: campus
    referencia: "Instalación de Madrid según directorio comercial"
    estado_asociado: desconocido
    fuentes: [ src-3 ]
    nota: El directorio no fecha ni tipifica estos 18 MW y no acredita que estén entregados. Se conserva
      la discrepancia documental, separada de los 14 MW actuales de Madrid 1 publicados por el
      operador y de los 56 MW previstos para Madrid 2.

fases:
  - nombre: "Madrid 1"
    estado: operativo
    fecha_puesta_en_servicio: "2000"
    superficie_m2: 12000
    fuentes: [ src-1, src-4 ]
  - nombre: "Madrid 2"
    estado: en_construccion
    fecha_puesta_en_servicio: "2029"
    superficie_m2: 24000
    fuentes: [ src-4 ]

refrigeracion: "Global Switch destaca 'low water consumption rates' y ofrece refrigeración líquida en su cartera."
enlaces_proyecto:
