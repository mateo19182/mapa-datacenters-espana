    titulo: "Global Switch inicia las obras de su segundo centro de datos en Madrid"
    editor: "DatacenterDynamics"
    tipo: prensa_especializada
    fecha_publicacion: "2026-08-17"
    fecha_consulta: "2026-08-31"
    cita: "Han comenzado las obras del segundo centro de datos de Global Switch en Madrid, España ... La instalación de coubicación, de 24 000 m² (258 335 pies cuadrados), tendrá una capacidad de 56 MW ... Está previsto que el centro de datos entre en funcionamiento en 2029 y alcance su plena capacidad en 2032. La empresa constructora encargada del edificio es la española EIGO Construcciones. Las instalaciones existentes en el campus de centros de datos de Global Switch en Madrid, «Madrid 1», se construyeron en el año 2000 y, desde entonces, han sido objeto de ampliaciones, con mejoras previstas hasta 2027. Este centro de datos de coubicación, de 12 000 m² (129 165 pies cuadrados), tiene una capacidad de 14 MW ... el complejo de centros de datos de Global Switch en Madrid contará con una capacidad total de 70 MW."
