    cita: >-
      ESpanix, el nodo neutro de referencia nacional, nació el 13 de mayo de 1997, pero el centro
      de datos donde se constituyó es de unos años antes, 1988 para ser exactos. Desde su
      construcción el centro ha estado funcionando sin interrupciones ... El edificio que lo
      contiene es parte de un campus que en aquel entonces pertenecía al Banco Español de Crédito
