incertidumbres:
  - campo: potencia
    descripcion: >-
      La ficha técnica de ESpanix da 8 MW sin decir si son de carga TI o de potencia total del
      edificio, y los 2.000 m² que publica son «metros cuadrados IT», no superficie construida
      del inmueble.
    fuentes: [src-3]
  - campo: tipo
    descripcion: >-
      Duplicado con `espanix-madrid-gran-via-hortaleza`: la documentación reunida el 31 de agosto
      de 2026 indica que se trata del mismo emplazamiento y que los dos ficheros deberían ser uno.
      Cuatro pruebas concurrentes: (1) la propia PeeringDB agrupa sus tres registros —fac/121
      «Espanix Datacenter» en Mesena 80, fac/15526 «Magdalena Datacenter» en Gran Vía de Hortaleza
      3 y fac/15527 «Cantabria Datacenter» en Gran Vía de Hortaleza 1— dentro de un único objeto
      de campus, el campus/93 «Acciona Campus», propiedad de la Asociación ESpanix; (2) «Magdalena»
      y «Cantabria» no son instalaciones independientes sino dos de los tres edificios del Campus
      Acciona Mesena —Magdalena, Cantabria y Pedreña—, el antiguo complejo de Banesto y luego del
      Banco Santander, de 104.000 m²; (3) ESpanix explica que «el campus tiene dos entradas por dos
      calles que lindan con el recinto y cuenta con un túnel de 400 m que acerca las fibras al
      centro de datos», que es exactamente el «doble acceso desde la Calle Mesena y desde la Gran
      Vía de Hortaleza» de su ficha técnica; (4) la página de acceso de ESpanix, que enumera todos
      los centros donde se puede conectar con su nodo, lista un solo centro propio, «ESpanix
      Datacenter, C/Mesena 80», y ninguno en Gran Vía de Hortaleza. El Catastro lo respalda: Mesena
      80, Gran Vía de Hortaleza 1 y Gran Vía de Hortaleza 3 son parcelas contiguas de la misma
      manzana catastral 42000 y de la misma unidad de planeamiento APE 16.01 (parcelas III, IV y V).
      No se fusionan ni se borran ficheros por decisión propia: la fusión queda propuesta y
      pendiente de decisión humana.
    fuentes: [src-2, src-3, src-4, src-5, src-6, src-7, src-8]

