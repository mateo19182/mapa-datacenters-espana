  direccion: "Calle Mesena 80, 28033 Madrid (distrito de Hortaleza)"
  lat: 40.466022
  lon: -3.660963
  precision: exacta
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Sede del principal punto neutro de interconexión IP del sur de Europa. El edificio es el
  antiguo CPD de Banesto, en funcionamiento sin interrupción desde 1988 y remodelado después.
  Tiene doble acceso, desde la calle Mesena y desde la Gran Vía de Hortaleza. ESpanix registra
  además otros dos nodos en Madrid con dirección en Gran Vía de Hortaleza 1 y 3.
estado_fuentes: [src-1, src-2, src-3, src-4]
fecha_puesta_en_servicio: "1988"

potencia:
  - tipo: no_especificado
    valor_mw: 8
    ambito: edificio
    referencia: "Potencia del centro de datos según la ficha técnica de ESpanix"
    estado_asociado: operativo
    fecha_dato: "2026-05-11"
    fuentes: [src-3]
    nota: >-
      La ficha dice «Potencia: 8 MW. Redundancia: N+N», con capacidad del 100% de la potencia del
      centro en cada uno de los dos circuitos. No indica si es carga TI o potencia total.

conexion_electrica:
  subestacion: "Dos subestaciones distintas (no identificadas)"
  tension_kv: null
  titular_red: null
  mw_solicitados: null
  mw_concedidos: null
  nota: >-
    ESpanix declara doble acometida desde dos subestaciones distintas, con UPS y generadores en
    dos circuitos separados y capacidad del 100% de la potencia del centro en cada circuito. No
    nombra las subestaciones ni da tensión.
  fuentes: [src-3]

superficie_construida_m2: 2000
refrigeracion: "Redundancia de climatización N+1. Dos depósitos de 25.000 litros de gasóleo con contrato de suministro ininterrumpido."
enlaces_proyecto:
  - "https://www.espanix.net/en/"
  - "https://www.espanix.net/es/datacenter/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      La ficha técnica de ESpanix da 8 MW sin decir si son de carga TI o de potencia total del
      edificio, y los 2.000 m² que publica son «metros cuadrados IT», no superficie construida
      del inmueble.
    fuentes: [src-3]
  - campo: tipo
    descripcion: >-
      ESpanix registra en PeeringDB tres instalaciones en Madrid (Mesena 80, Gran Vía de
      Hortaleza 1 y Gran Vía de Hortaleza 3) y aquí solo se ficha la de Mesena. La ficha técnica
      de ESpanix describe su centro de Mesena 80 con «doble acceso desde la Calle Mesena y desde
      la Gran Vía de Hortaleza», lo que abre la posibilidad de que los tres registros de
      PeeringDB sean accesos del mismo edificio y no tres emplazamientos. No hay fuente que lo
      confirme ni que lo descarte, y los dos ficheros se mantienen separados hasta poder
      resolverlo.
    fuentes: [src-2, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

