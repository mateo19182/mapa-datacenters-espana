estado: operativo
estado_detalle: >-
  Sede del principal punto neutro de interconexión IP del sur de Europa. El edificio es el
  antiguo CPD de Banesto, en funcionamiento sin interrupción desde 1988 y remodelado después.
  Tiene doble acceso, desde la calle Mesena y desde la Gran Vía de Hortaleza. El inmueble forma
  parte del Campus Acciona Mesena, el antiguo complejo de Banesto y después del Banco Santander:
  104.000 m² con tres edificios —Magdalena, Cantabria y Pedreña— entre la calle Mesena y la Gran
  Vía de Hortaleza. ESpanix registra en PeeringDB otros dos nodos con dirección en Gran Vía de
  Hortaleza 1 y 3, agrupados por la propia PeeringDB en el mismo campus que este (véase
  `incertidumbres`).
