ubicacion:
  municipio: "Getafe"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Calle Fundidores 40, Polígono Industrial Los Ángeles, 28906 Getafe"
  lat: 40.310814
  lon: -3.692923
  precision: exacta
  fuentes: [src-1, src-2, src-4]

estado: operativo
estado_detalle: >-
  Edificio de nueva planta de tres alturas con dos muelles de carga. Edged lo marca como
  "Now Open". MERLIN declaró 20 MW en operación ampliables a 27 MW en enero de 2025.
estado_fuentes: [src-1, src-3]

potencia:
  - tipo: no_especificado
    valor_mw: 20
    ambito: edificio
    referencia: "Critical Load Capacity"
    estado_asociado: operativo
    fecha_dato: "2026-08-29"
    fuentes: [src-1]
    nota: "Edged lo denomina \"Critical Load Capacity\", sin equipararlo explícitamente a carga TI."
  - tipo: no_especificado
    valor_mw: 20
    ambito: edificio
    referencia: "Capacidad en operación (MERLIN, enero 2025)"
    estado_asociado: operativo
    fecha_dato: "2025-01-14"
    fuentes: [src-3]
  - tipo: no_especificado
    valor_mw: 27
    ambito: edificio
    referencia: "Capacidad ampliable"
    estado_asociado: anunciado
    fecha_dato: "2025-01-14"
    fuentes: [src-3]
  - tipo: it
    valor_mw: 20
    ambito: edificio
    referencia: "Potencia eléctrica instalada para uso IT según la ingeniería del proyecto"
    estado_asociado: operativo
    fecha_dato: "2024-10"
    fuentes: [src-7]
    nota: >-
      JG Ingenieros, autora del diseño y de la dirección de obra, dice «La potencia eléctrica
      total instalada es de 20 MW para uso IT». Es la única fuente que tipifica los 20 MW como
      carga TI; Edged y MERLIN los publican sin tipo. Se registra como lectura tipificada de la
      misma cifra, no como capacidad adicional.

refrigeracion: >-
  Sistema ThermalWorks sin consumo de agua (WUE 0,00 l/kWh); PUE anualizado de 1,15; plantas
  enfriadoras condensadas por aire con distribución de agua fría glicolada y evaporadores de
  circuito cerrado; 500 kW por pasillo caliente, hasta 70 kW por rack en refrigeración por aire
  y hasta 200 kW por rack si se pasa a refrigeración líquida.

agua:
  circuito: sin_agua
  sistema: >-
    Refrigeración ThermalWorks con plantas enfriadoras condensadas por aire y distribución de
    agua fría glicolada en circuito cerrado; los evaporadores de circuito cerrado dan la
    refrigeración secundaria. La ingeniería del proyecto declara que el consumo de agua para
    refrigeración es nulo.
  origen: null
  consumo_m3_ano: null
  wue_l_kwh: 0
  nota: >-
    JG Ingenieros cifra en unos 290 millones de litros al año el agua que se ahorra respecto a
    una solución con torres de refrigeración; es un ahorro estimado frente a una alternativa, no
    un consumo, y por eso no se registra como cifra de consumo.
  fuentes: [src-7, src-8]
enlaces_proyecto:
  - "https://www.edged.es/madrid-getafe"
  - "https://www.merlinproperties.com/en/assets/data-center-madrid-getafe/"

computo:
  - tipo: gpu
    ambito: sistema
    sistema: "Infraestructura de IA de Nebius en Madrid"
    operador_computo: "Nebius"
    tipo_unidad: acelerador
    estado: operativo
    fecha_dato: "2026-08-11"
    fuentes: [src-nebius]
    nota: >-
      Nebius contrató 18 MW de capacidad en este edificio —la mayor parte de sus 20 MW— para
      despliegues de GPU de alta densidad, su primera instalación en España. Ni Nebius ni Edged
      publican modelo ni número de aceleradores, así que el registro consta sin recuento: lo
      documentado es la contratación de potencia para cómputo de IA, no el hardware.

incertidumbres:
  - campo: cliente_ancla
    descripcion: >-
      La prensa especializada inmobiliaria atribuye a Meta la condición de cliente principal de
      los tres centros españoles de MERLIN (Madrid, Barcelona y Álava). MERLIN no ha confirmado
      públicamente la identidad del inquilino; en 2022 declinó revelarla.
    fuentes: [src-5, src-6]
  - campo: potencia
    descripcion: >-
      Ni Edged ni MERLIN precisan si los 20 MW son carga TI o potencia total, por lo que sus
      cifras se registran como no_especificado. La ingeniería del proyecto sí los llama «20 MW
      para uso IT», de modo que hay una lectura tipificada y dos sin tipificar del mismo número.
    fuentes: [src-1, src-3, src-7]

confianza: alta
ultima_verificacion: "2026-08-31"

