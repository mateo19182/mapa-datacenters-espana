id: qts-calatorao-rhodes
nombre: "QTS/Blackstone — Campus data center «Proyecto Rhodes» (Calatorao)"
alias:
  - "Proyecto Rhodes"
  - "Campus Data Center SUI-4 Calatorao"
  - "QTS Calatorao"
tipo: campus
operador: "QTS Data Centers"
propietario: "Calanza Inmuebles, S.L. (participada por fondos gestionados por Blackstone)"
modelo: hyperscale

ubicacion:
  municipio: "Calatorao"
  provincia: "Zaragoza"
  ccaa: "Aragón"
  direccion: "Sector de suelo urbanizable industrial SUI-4 «Campus Data Center», margen derecha de la autovía A-2 entre los pk 281,00 y 284,50"
  lat: 41.522175
  lon: -1.346577
  precision: municipio
  fuentes: [src-1, src-4]

estado: en_tramitacion
estado_detalle: >-
  Declarado inversión de interés autonómico con interés general de Aragón el 14 de octubre
  de 2024; redelimitación del ámbito el 27 de junio de 2025 y de nuevo el 29 de julio de
  2026. El PIGA "Proyecto Rhodes" se aprobó inicialmente por Orden FOM/1039/2025, de 19 de
  agosto. INAGA inició en diciembre de 2025 el trámite de información pública del estudio
  de impacto ambiental y del proyecto básico de autorización ambiental integrada
  (expediente INAGA 500301/02/2025/08352) y el 23 de julio de 2026 resolvió no someter el
  PIGA a evaluación ambiental estratégica ordinaria, emitiendo informe ambiental
  estratégico y el informe de impacto ambiental del proyecto de urbanización.
estado_fuentes: [src-1, src-2, src-3, src-5]

potencia:
  - tipo: conexion_red
    valor_mw: 650
    ambito: campus
    referencia: "Capacidad de la nueva subestación Rhodes alimentada con cuatro líneas subterráneas desde la SE Calatorao 220 kV (REE)"
    estado_asociado: en_tramitacion
    fecha_dato: "2025-08-25"
    fuentes: [src-1]
    nota: >-
      La fuente oficial dice literalmente "proporcionando hasta 650 MW de capacidad",
      referido a la subestación de conexión, no a la carga TI.

fases:
  - nombre: "Fase 1"
    estado: en_tramitacion
    fuentes: [src-1]
    nota: >-
      Urbanización completa del sector SUI-4 y ejecución del proyecto en parte de la parcela
      ILT 1. Inicio previsto en el segundo trimestre de 2026 y conclusión a finales de 2035.
      Obras interiores presupuestadas en 5.319.782.645 €.
  - nombre: "Fase 2"
    estado: anunciado
    fuentes: [src-1]
    nota: >-
      No forma parte del PIGA. Ampliación en el resto de la parcela ILT 1 y en la parcela
      IL 1, donde también podrían implantarse usos logísticos. Plazo estimado de 7 años.

conexion_electrica:
  subestacion: "SE Rhodes (nueva), alimentada desde la SE Calatorao 220 kV de Red Eléctrica de España mediante cuatro líneas subterráneas"
  tension_kv: 220
  titular_red: "Red Eléctrica de España — SE Calatorao 220 kV"
  mw_solicitados: null
  mw_concedidos: null
  fuentes: [src-1]
  nota: >-
    Además de la línea aéreo-subterránea de 220 kV entre la SE Calatorao 220 kV (REE) y la
    SE Rhodes, con centro de medida junto a la subestación, el PIGA incluye una línea
    subterránea de 15 kV desde la SE La Almunia hasta el ámbito urbanizado (excluida la
    demanda del centro de datos), que discurre por La Almunia de Doña Godina, Alfamén y
    Calatorao.

superficie_parcela_m2: 2234088
inversion_anunciada_eur: 11805195141
refrigeracion: >-
  Refrigeración por aire según la documentación ambiental publicada en julio de 2026. La
  promotora sostiene que las necesidades de suministro de agua son "sólo una fracción del
  consumo de agua previsto en el Plan Parcial aprobado".

agua:
  circuito: desconocido
  sistema: >-
    Refrigeración por aire según el estudio de impacto ambiental. El abastecimiento se
    resuelve desde la red municipal de Calatorao, con una nueva estación de bombeo y
    depósitos de regulación en la parte alta de la parcela dimensionados para cinco días de
    autonomía del centro de datos.
  origen: "Red municipal de Calatorao, aguas abajo de la planta, mediante nueva estación de bombeo"
  consumo_m3_dia: 204.4
  nota: >-
    204,40 m³/día es el máximo atribuido a la parcela de centros de datos (81,8 m³/día de
    media) en la documentación del PIGA sometida a información pública en agosto de 2025. El
    conjunto del complejo, incluida la zona industrial y logística, la limpieza de viales y
    el sistema contra incendios, suma 707,4 m³/día y 258.201 m³/año en la horquilla más
    elevada. Esa cifra anual choca frontalmente con los 4.782 m³/año que la prensa atribuye
    al estudio de impacto ambiental de julio de 2026; véase la incertidumbre registrada. No
    se convierte el dato diario en anual.
  fuentes: [src-6, src-7]

energia:
  - consumo_gwh_ano: 4745
    referencia: "Consumo medio anual estimado en el estudio de impacto ambiental del campus"
    fecha_dato: "2026-07-08"
    fuentes: [src-9]
    nota: >-
      Cifra del estudio de impacto ambiental publicado en julio de 2026, conocida a través
      de prensa; no se ha podido leer el documento original. Es el mayor consumo eléctrico
      anual de todos los proyectos de centros de datos registrados en Aragón.

empleo:
  - tipo: directo
    valor: 1400
    referencia: "Empleos anuales directos estimados por la promotora (unos 1.200 en construcción y hasta unos 200 en explotación)"
    fecha_dato: "2024-10-14"
    fuentes: [src-8]
    nota: >-
      El Acuerdo añade entre 1.100 y 2.000 empleos anuales indirectos, de los que entre 920
      y 1.700 serían de construcción y entre 180 y 300 de explotación.
  - tipo: construccion
    valor: 1200
    referencia: "Parte de los empleos anuales directos que se generarían durante la construcción"
    fecha_dato: "2024-10-14"
    fuentes: [src-8]
    nota: "Subconjunto de los 1.400 directos; no se suma con ellos."
  - tipo: directo
    valor: 200
    referencia: "Parte de los empleos anuales directos correspondiente a la fase de explotación"
    fecha_dato: "2024-10-14"
    fuentes: [src-8]
    nota: "Subconjunto de los 1.400 directos; no se suma con ellos."
enlaces_proyecto:
  - "https://www.aragon.es/-/proyecto-rhodes"
  - "https://www.aragon.es/-/rhodes-proy-reparcelacion"

incertidumbres:
  - campo: potencia
    descripcion: >-
      La única cifra de potencia con fuente verificada es la capacidad de la subestación
      Rhodes (hasta 650 MW). No consta carga TI del campus. Circula además en prensa
      especializada una cifra de 300 MW para la subestación de red, que no ha podido
      contrastarse porque la publicación bloquea el acceso automatizado.
    fuentes: [src-1]
  - campo: inversion_anunciada_eur
    descripcion: >-
      El mismo documento del PIGA afirma en texto que "la inversión total del PIGA asciende
      a 11.728 millones de euros" y en la tabla económica que la inversión total (fases 1 y
      2) es de 11.805.195.141 €. Se registra la cifra de la tabla.
    fuentes: [src-1]
  - campo: agua
    descripcion: >-
      Dos fuentes dan cifras que difieren en un factor de 54. La documentación del PIGA
      sometida a información pública en agosto de 2025 arroja 707,4 m³/día para el conjunto
      del complejo y 258.201 m³/año "siempre en la horquilla más elevada"; el estudio de
      impacto ambiental publicado en julio de 2026 estima, según la prensa, 4.782 m³/año.
      No se ha podido leer ninguno de los dos documentos originales para determinar si miden
      lo mismo (el dato de 2025 incluye la zona industrial y logística, riego de viales y
      protección contra incendios, y el de 2026 podría referirse solo al agua de proceso de
      los centros de datos) o si el proyecto ha cambiado de sistema de refrigeración. Se
      registra el dato diario de la parcela de centros de datos y se conservan ambas
      lecturas anuales sin elegir entre ellas.
    fuentes: [src-6, src-7, src-9]
  - campo: inversion_anunciada_eur
    descripcion: >-
      A la discrepancia ya registrada entre el texto del PIGA (11.728 millones) y su tabla
      económica (11.805.195.141 €) se suma que el Acuerdo de 14 de octubre de 2024, que
      declaró el proyecto de interés autonómico, hablaba de "una inversión potencial de
      hasta 7.500 millones de euros".
    fuentes: [src-1, src-8]
  - campo: ubicacion
    descripcion: >-
      Las coordenadas registradas son el centroide municipal de Calatorao (Wikidata); el
      sector SUI-4 está al sur de la A-2, entre los pk 281 y 284,5.
    fuentes: [src-4]

