id: data4-alcobendas-mad01
nombre: "DATA4 Madrid MAD01 — Alcobendas"
alias:
  - "DATA4 Madrid-Alcobendas"
  - "DATA4 MAD1"
tipo: campus
operador: "DATA4"
propietario: "DATA4"
modelo: colocation

ubicacion:
  municipio: "Alcobendas"
  provincia: "Madrid"
  ccaa: "Comunidad de Madrid"
  direccion: "Avenida de la Industria 15, 28108 Alcobendas"
  lat: 40.536383
  lon: -3.63809
  precision: aproximada
  fuentes:
    - src-1
    - src-plano-acceso
    - src-2

estado: operativo
estado_detalle: >-
  Campus lanzado en 2020, en crecimiento; en 2023 DATA4 declaraba estar construyendo un nuevo
  edificio y orientaba MAD01 al colocation empresarial frente al perfil hiperescalar de MAD02.
estado_fuentes: [ src-1, src-3 ]

potencia:
  - tipo: no_especificado
    valor_mw: 50
    ambito: campus
    referencia: "MAD01 (capacidad del campus)"
    estado_asociado: desconocido
    fecha_dato: "2026-08-29"
    fuentes: [ src-1 ]
    nota: "La ficha de DATA4 indica '50 MW' para MAD01 sin especificar si es carga TI o potencia total."
  - tipo: it
    valor_mw: 50
    ambito: campus
    referencia: "Potencia IT de MAD01 según la ingeniería que ejecutó las instalaciones"
    estado_asociado: desconocido
    fecha_dato: "2024"
    fuentes: [ src-4 ]
    nota: >-
      DConcept, que hizo la dirección técnica y las instalaciones MEP del proyecto en 2024, encabeza
      su ficha con «Potencia IT: 50 MW». Es la misma cifra que DATA4 publica sin tipificar, ahora
      atribuida a carga TI por un tercero que trabajó en la obra. Se registra como lectura
      tipificada del mismo número, no como capacidad adicional. La ficha de ingeniería describe
      capacidad del proyecto, sin confirmar cuánto está entregado por edificio. Se conserva el tipo
      IT, pero no se afirma que los 50 MW completos estén operativos.
  - tipo: conexion_red
    valor_mw: 20
    ambito: campus
    referencia: "Acometida principal desde la subestación de Sanchinarro"
    estado_asociado: operativo
    fecha_dato: "2026-08-29"
    fuentes: [ src-1 ]
  - tipo: it
    valor_mw: 12
    ambito: edificio
    edificio: DC03
    referencia: DC03, capacidad de diseño de seis salas según la constructora
    estado_asociado: desconocido
    fuentes:
      - src-capingelec-dc03
    nota: Cap Ingelec identifica el tercer edificio del campus Alcobendas y 12 MW IT, con dos entregas
      previstas de 6 MW en julio de 2024 y marzo de 2025. La página no publica fecha editorial ni
      confirma recepción. No se suman a los 50 MW del campus ni se identifican con el incremento
      operativo de Colliers.

conexion_electrica:
  subestacion: Sanchinarro
  mw_solicitados: null
  mw_concedidos: null
  nota: DATA4 publica una acometida principal de 20 MW desde Sanchinarro y dos líneas de respaldo de
    10 MW, una desde Alcobendas y otra desde Arroyo de la Vega. Los respaldos no son dos lecturas
    rivales de la acometida principal ni 20 MW adicionales útiles. No se ha localizado una
    resolución que permita rellenar los MW concedidos.
  fuentes: [ src-1 ]

computo:
  - tipo: gpu
    modalidad: acceso
    ambito: sistema
    sistema: "EasyDataHost, servicio de servidores GPU Blackwell"
    operador_computo: "EasyDataHost"
    modelo: "NVIDIA RTX 6000 Server Edition, 96 GB GDDR7 ECC, arquitectura Blackwell"
    unidades: null
    tipo_unidad: acelerador
    estado: operativo
    fuentes: [ src-edh-gpu, src-edh-facility ]
    nota: >-
      Oferta comercial publicada por EasyDataHost, que identifica el campus DATA4 Alcobendas
      como alojamiento de sus servicios. Se conserva la denominación del proveedor. Las opciones
      de dos, cuatro u ocho tarjetas son configuraciones de contratación, sin recuento de flota
      instalada ni edificio o sala identificados dentro del campus. La página no fecha el dato.
  - tipo: gpu
    modalidad: acceso
    ambito: sistema
    sistema: "EasyDataHost, servicio de servidores NVIDIA H200"
    operador_computo: "EasyDataHost"
    modelo: "NVIDIA H200, 141 GB HBM3e, arquitectura Hopper"
    unidades: null
    tipo_unidad: acelerador
    estado: operativo
    fuentes: [ src-edh-gpu, src-edh-facility ]
    nota: >-
      La oferta enterprise anuncia acceso a H200, con precio a consultar. EasyDataHost sitúa sus
      servidores GPU en su centro madrileño y sus servicios en el campus DATA4 Alcobendas. No
      publica cantidad instalada, fecha de entrega ni edificio o sala dentro del campus; se
      registra acceso comercial, sin inventario físico acreditado.
  - tipo: gpu
    modalidad: acceso
    ambito: sistema
    sistema: "EasyDataHost, servicio NVIDIA DGX Spark hospedado"
    operador_computo: "EasyDataHost"
    modelo: "NVIDIA DGX Spark, superchip Grace Blackwell GB10"
    unidades: null
    tipo_unidad: nodo
    estado: operativo
    fuentes: [ src-edh-spark, src-edh-facility ]
    nota: >-
      Servicio hospedado con acceso remoto que el proveedor ubica en su centro madrileño y,
      mediante su página de instalaciones, en el campus DATA4 Alcobendas. GB10 integra CPU y GPU;
      los 128 GB anunciados son memoria unificada, no memoria exclusiva de GPU. Los paquetes de
      uno, dos o tres nodos no publican la flota instalada. Sin fecha del dato ni edificio o sala.

superficie_parcela_m2: 40000
enlaces_proyecto:
  - "https://www.data4group.com/es/centros-de-datos-en-espana-2/"

incertidumbres:
  - campo: potencia
    descripcion: >-
      DATA4 anuncia "Importantes reservas eléctricas (100 MW)" para España y 50 MW para MAD01, pero
      simultáneamente describe una acometida de 20 MW más dos respaldos de 10 MW. La ingeniería que
      ejecutó las instalaciones llama a esos 50 MW «Potencia IT», lo que agrava la distancia con los
      20 MW de acometida: no hay fuente que explique cómo se sirven 50 MW de carga TI con una
      acometida principal de 20 MW y dos respaldos de 10 MW.
    fuentes: [ src-1, src-4 ]
  - campo: potencia
    descripcion: >-
      La misma ingeniería publica dos fichas con idéntico título, «DATA4 – MAD01, Alcobendas,
      Madrid»: una atribuye 50 MW de potencia IT con DATA4 como promotor, y otra 14 MW de potencia
      IT con Digital Realty como promotor. Podría tratarse de dos encargos distintos mal etiquetados
      —Digital Realty no opera en Alcobendas sino en Julián Camarillo— pero no hay forma de
      resolverlo con lo publicado, así que la cifra de 14 MW no se registra.
    fuentes: [ src-4, src-5 ]
  - campo: fases
    descripcion: >-
      Prensa especializada indicó en 2023 que el campus de Alcobendas albergaría seis edificios
      sobre ocho hectáreas; la ficha actual de DATA4 declara 4 hectáreas para MAD01. No se ha podido
      reconciliar.
    fuentes: [ src-1, src-3 ]
  - campo: potencia.estado_asociado
    descripcion: La web actual de DATA4 publica 50 MW de campus sin desglose de capacidad entregada. La
      referencia de ingeniería a 50 MW IT no acredita el estado operativo de toda esa potencia.
      La capacidad IT operativa permanece desconocida.
    fuentes:
      - src-1
      - src-4
  - campo: computo
    descripcion: >-
      EasyDataHost vincula sus servicios al campus DATA4 Alcobendas, sin edificio o sala ni
      cantidades instaladas. Su expresión "centro de datos propio" no acredita propiedad del
      campus. Las páginas carecen de fecha editorial; la consulta no fecha instalación o apertura.
    fuentes: [ src-edh-gpu, src-edh-spark, src-edh-facility ]
  - campo: ubicacion
    descripcion: Se sustituye el punto previo por las coordenadas GPS del plano de acceso publicado y
      enlazado por DATA4 para MAD1. El plano representa el campus y su acceso, no una sala técnica
      ni un levantamiento de la parcela; precisión aproximada.
    fuentes:
      - src-plano-acceso
      - src-1
  - campo: potencia
    descripcion: Colliers atribuye 12 MW IT adicionales a Alcobendas, sin edificio ni total operativo de
      MAD01. No se asigna esa ampliación a los 50 MW de diseño.
    fuentes:
      - src-colliers-20261008
      - src-1
      - src-4
  - campo: potencia.estado_asociado
    descripcion: Cap Ingelec identifica DC03 con 12 MW IT de diseño, inicio de obra en marzo de 2023 y
      cierre estructural en diciembre de 2023. Las entregas de 6 MW previstas para julio de 2024 y
      marzo de 2025 no están confirmadas en la página. No acredita que los 12 MW adicionales de
      Colliers correspondan a este edificio ni que estén entregados.
    fuentes:
      - src-capingelec-dc03
      - src-colliers-20261008

