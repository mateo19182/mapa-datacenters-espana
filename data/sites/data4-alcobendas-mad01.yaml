incertidumbres:
  - campo: potencia
    descripcion: >-
      DATA4 anuncia "Importantes reservas eléctricas (100 MW)" para España y 50 MW para MAD01,
      pero simultáneamente describe una acometida de 20 MW más dos respaldos de 10 MW. La
      ingeniería que ejecutó las instalaciones llama a esos 50 MW «Potencia IT», lo que agrava la
      distancia con los 20 MW de acometida: no hay fuente que explique cómo se sirven 50 MW de
      carga TI con una acometida principal de 20 MW y dos respaldos de 10 MW.
    fuentes: [src-1, src-4]
  - campo: potencia
    descripcion: >-
      La misma ingeniería publica dos fichas con idéntico título, «DATA4 – MAD01, Alcobendas,
      Madrid»: una atribuye 50 MW de potencia IT con DATA4 como promotor, y otra 14 MW de
      potencia IT con Digital Realty como promotor. Podría tratarse de dos encargos distintos mal
      etiquetados —Digital Realty no opera en Alcobendas sino en Julián Camarillo— pero no hay
      forma de resolverlo con lo publicado, así que la cifra de 14 MW no se registra.
    fuentes: [src-4, src-5]
  - campo: fases
    descripcion: >-
      Prensa especializada indicó en 2023 que el campus de Alcobendas albergaría seis edificios
      sobre ocho hectáreas; la ficha actual de DATA4 declara 4 hectáreas para MAD01. No se ha
      podido reconciliar.
    fuentes: [src-1, src-3]

confianza: media
ultima_verificacion: "2026-08-31"

