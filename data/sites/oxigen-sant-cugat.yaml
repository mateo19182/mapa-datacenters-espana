id: oxigen-sant-cugat
nombre: "Oxigen Data Center — Sant Cugat del Vallès"
alias:
  - "Oxigen DC Sant Cugat del Vallès"
tipo: edificio
operador: "Oxigen Data Center"
propietario: "Oxigen Data Center (Benjamín Rovira y la familia Salicrú)"
modelo: colocation

ubicacion:
  municipio: "Sant Cugat del Vallès"
  provincia: "Barcelona"
  ccaa: "Cataluña"
  direccion: "Avinguda de la Generalitat 163-167, Sant Cugat del Vallès"
  lat: 41.4926186
  lon: 2.0552643
  precision: exacta
  fuentes: [src-2, src-3, src-6]

estado: operativo
estado_detalle: >-
  Centro de datos de capital catalán levantado sobre el antiguo CPD que
  CaixaBank tenía en Sant Cugat y que llevaba tiempo en desuso. Entró en
  funcionamiento en 2023 tras dos años de obras y celebró su inauguración
  oficial el 5 de abril de 2024. La parcela cuenta con dos subestaciones
  eléctricas propias, según el fundador de la compañía.
estado_fuentes: [src-1, src-3, src-4, src-5]
fecha_puesta_en_servicio: "2023"

potencia:
  - tipo: no_especificado
    valor_mw: 6
    ambito: edificio
    referencia: "Potencia total del centro según la propia compañía"
    estado_asociado: operativo
    fuentes: [src-2]
    nota: >-
      La web publica "6MW de potencia total" y una densidad máxima de 20 kW por
      rack sobre 700 racks. No precisa si es carga TI o potencia instalada.

conexion_electrica:
  nota: >-
    El fundador de la compañía afirma que la parcela heredada de CaixaBank
    dispone de dos subestaciones eléctricas propias. No consta su titular, su
    tensión ni la potencia de acceso contratada.
  fuentes: [src-3]

superficie_construida_m2: 6000
inversion_anunciada_eur: 15000000
refrigeracion: >-
  La compañía declara eficiencia energética, placas solares propias y suministro
  procedente de renovables. No publica el sistema de refrigeración ni consumos
  de agua.

incertidumbres:
  - campo: superficie_construida_m2
    descripcion: >-
      La web de Oxigen habla de "6000 m² de espacio" y de "hasta 3.000 m² de
      operación de salas blancas". VIA Empresa describe 2.500 m² de salas
      blancas más de 5.000 m² de oficinas y salas técnicas, y Data Center
      Dynamics da 6.000 m² totales con 2.500 m² de sala blanca. Se registra el
      total de 6.000 m² y se conservan las lecturas parciales.
    fuentes: [src-2, src-3, src-5]
  - campo: potencia
    descripcion: >-
      Los 6 MW son la cifra que la compañía publica para este centro. Data
      Center Dynamics informó en febrero de 2026 de que Oxigen «duplicaba su
      capacidad operativa hasta 20 MW» al poner en producción un centro de 10 MW
      en Sant Fruitós de Bages comprado a Banc Sabadell; ese agregado incluye
      otras instalaciones del grupo y no se reparte aquí por emplazamiento.
    fuentes: [src-2, src-5]
  - campo: propietario
    descripcion: >-
      VIA Empresa describe el edificio como el antiguo centro de datos de
      CaixaBank y Data Center Dynamics lo confirma («previously operated by
      CaixaBank»). No se ha localizado documento registral sobre la titularidad
      actual del inmueble.
    fuentes: [src-3, src-5]
  - campo: ubicacion
    descripcion: >-
      La dirección procede de directorios sectoriales (la guía de Data Center
      Market y datacenterHawk), no de la propia compañía, que no la publica en su
      web. Nominatim resuelve el número 163-167 de la Avinguda de la Generalitat
      con código postal 08172, mientras que los directorios indican 08174.
    fuentes: [src-4, src-6, src-7]

