id: ingenostrum-caceres-ccgreen
nombre: "Campus Data Center CC Green — Cáceres (ecopolígono Las Capellanías)"
alias:
  - "CCGreen"
  - "Ecopolígono CCGreen"
tipo: campus
operador: "Ingenostrum"
propietario: "Ingenostrum, S.L. (Nostrum Group)"
modelo: mayorista

ubicacion:
  municipio: "Cáceres"
  provincia: "Cáceres"
  ccaa: "Extremadura"
  direccion: "Polígono industrial Las Capellanías / ampliación Capellanías II"
  lat: 39.4862979
  lon: -6.419025
  precision: aproximada
  fuentes: [src-regiondigital, src-osm]

estado: en_tramitacion
estado_detalle: >-
  Declarado Proyecto Empresarial de Interés Autonómico (PREMIA) por el Consejo de
  Gobierno de Extremadura en agosto de 2024 y con visto bueno ambiental de la
  Dirección General de Sostenibilidad en octubre de 2024. El 30 de junio de 2025 el Ayuntamiento de
  Cáceres, la Junta de Extremadura e Ingenostrum firmaron un protocolo general de actuación. El
  proyecto se integra en la ampliación Capellanías II: en marzo de 2026 el Ayuntamiento tenía
  asegurado en torno al 85% del suelo y el 29 de julio de 2026 aprobó la delimitación de las áreas
  de Capellanías II y Montebola para expropiar el resto. El calendario de la promotora mantiene la
  urbanización y el inicio de obras en 2026 y la operación en torno a 2028, a la espera de que Red
  Eléctrica confirme la potencia: a esa fecha tenía adjudicados 34 MW frente a los 300 MW que
  necesita. El 28 de agosto de 2026 la consejera de Industria afirmó que el proyecto «avanzará más
  ahora con el polígono desbloqueado».
estado_fuentes: [src-regiondigital, src-dcd-feb, src-dcd-mar, src-hoy]

potencia:
  - tipo: it
    valor_mw: 70
    ambito: fase
    referencia: "Primera fase del Campus Data Center CCGreen"
    estado_asociado: en_tramitacion
    fecha_dato: "2023"
    fuentes: [src-ti, src-dcd-feb]
    nota: "La fuente dice literalmente \"un centro de datos de 70 MW IT\"."
  - tipo: no_especificado
    valor_mw: 300
    ambito: campus
    referencia: "Potencia que necesita el centro de proceso de datos a pleno desarrollo"
    estado_asociado: en_tramitacion
    fecha_dato: "2026"
    fuentes: [src-regiondigital, src-dcd-feb]
    nota: >-
      La fuente dice "este centro de procesamiento de datos necesita unos 300 MW"
      sin precisar el tipo. Data Center Dynamics los llama «300 MW eléctricos».
  - tipo: conexion_red
    valor_mw: 34
    ambito: campus
    referencia: "Potencia adjudicada"
    estado_asociado: en_tramitacion
    fecha_dato: "2026"
    fuentes: [src-regiondigital]
    nota: "La fuente dice \"tienen adjudicados 34 megavatios (MW)\"."

fases:
  - nombre: "Fase 1 — 70 MW IT"
    estado: en_tramitacion
    nota: "Prevista inicialmente entre 2023 y 2025 según la memoria del proyecto."
    fuentes: [src-ti]
  - nombre: "Fase 2 — 40 MW"
    estado: anunciado
    fecha_puesta_en_servicio: "2027"
    fuentes: [src-ti]
  - nombre: "Fase posterior — 40 MW"
    estado: anunciado
    fecha_puesta_en_servicio: "2028"
    fuentes: [src-ti]

superficie_parcela_m2: 2000000

empleo:
  - tipo: construccion
    valor: 1500
    referencia: "Fase de construcción"
    fecha_dato: "2026-02-16"
    fuentes: [src-dcd-feb]
    nota: "La fuente dice «alrededor de 1.500 puestos durante la fase de construcción»."
  - tipo: directo
    valor: 200
    referencia: "Empleos estables una vez en operación"
    fecha_dato: "2026-02-16"
    fuentes: [src-dcd-feb]
    nota: "La fuente los describe como «unos 200 empleos estables una vez en operación»."

incertidumbres:
  - campo: inversion_anunciada_eur
    descripcion: >-
      Las cifras publicadas discrepan: 850 millones de euros en presentaciones
      iniciales, 1.300 millones "a lo largo de varias fases, que se desarrollarán
      desde 2023 hasta 2030" y unos 1.000 millones en 2026. Data Center Dynamics recoge en 2026 una
      horquilla de 1.000 a 1.300 millones. No se registra ninguna como dato firme.
    fuentes: [src-ti, src-regiondigital, src-dcd-feb]
  - campo: potencia
    descripcion: >-
      Coexisten 70 MW IT (primera fase), 300 MW de necesidad total sin tipificar
      y 34 MW efectivamente adjudicados. El desfase entre lo adjudicado y lo
      necesario es el principal riesgo del proyecto, y la propia promotora vincula el inicio de
      obras a que Red Eléctrica confirme la potencia.
    fuentes: [src-ti, src-regiondigital, src-dcd-feb]
  - campo: superficie_parcela_m2
    descripcion: >-
      La superficie del ecopolígono se cita entre 200 y 300 hectáreas según la
      fuente y el año; se registra la cifra de 200 hectáreas de la memoria más
      reciente consultada. La delimitación municipal aprobada en julio de 2026 para expropiar en
      Capellanías II y Montebola suma más de 548.000 m², que no son los mismos terrenos.
    fuentes: [src-ti, src-pex-expropiaciones]
  - campo: operador
    descripcion: >-
      El 7 de mayo de 2026 IREN Limited anunció un acuerdo para adquirir
      Ingenostrum, S.L. (Nostrum Group), pendiente de condiciones de cierre.
    fuentes: [src-iren]
  - campo: agua
    descripcion: >-
      No se ha localizado ninguna cifra de consumo de agua ni descripción del circuito de
      refrigeración del campus. Las fuentes solo hablan de «sistemas avanzados de refrigeración».
      Campo agua omitido.
    fuentes: [src-dcd-feb]

confianza: media
ultima_verificacion: "2026-08-31"

