estado: en_tramitacion
estado_detalle: >-
  Anunciado en febrero de 2025 por el Gobierno de Cantabria y Stoneshield Capital.
  Declarado Proyecto Empresarial Estratégico por el Consejo de Gobierno de Cantabria
  el 19 de junio de 2025, el primero en obtener esa figura. La primera fase de
  terrenos se vendió a la promotora en mayo de 2025. El desarrollo se articula
  mediante Proyectos Singulares de Interés Regional (PSIR) en tres fases; el inicio
  de obras de la fase 1 estaba previsto para enero de 2026 y la plena operación
  para 2032. La presentación del proyecto describe un campus modular de 12 módulos
  de centro de datos adyacentes de 40 MW cada uno, con 75.000 m² de paneles
  fotovoltaicos en el propio recinto y certificaciones LEED y BREEAM como objetivo.
  En junio de 2025 el consejero de Industria detalló en el Parlamento de Cantabria
  que el PSIR de la fase 1 se aprobaría previsiblemente en diciembre de 2025, con
  obras desde enero de 2026, y las fases 2 y 3 a partir de noviembre de 2028. A
  agosto de 2026 el debate público en Cantabria gira en torno al acceso a la red
  eléctrica: el proyecto necesita que el Ministerio para la Transición Ecológica
  incluya dos nuevas posiciones en la subestación de Penagos en la planificación de
  la red de transporte, y las obras previstas para enero de 2026 no habían comenzado.
