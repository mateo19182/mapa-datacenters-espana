incertidumbres:
  - campo: potencia
    descripcion: >-
      Conviven cuatro descripciones que no encajan. La presentación del promotor
      (febrero de 2025) da 162 + 81 + 81 MW de «carga de IT» por fase, describe el
      pilar del campus como «un centro de datos de 500MW» y a la vez lo compone de
      «12 módulos de centros de datos adyacentes de 40 MW cada uno». Invest in
      Cantabria y Data Center Market hablan de 100 MW en 2028 y 500 en 2030 sin
      tipificar. El consejero de Industria, en junio de 2025, cifra la necesidad de
      las dos primeras fases en 100 y 200 MW y el total en 500. Solo las cifras por
      fase de la presentación están tipificadas como carga IT; el resto se conserva
      sin tipificar y no se suma con ellas.
    fuentes: [src-1, src-3, src-4, src-5]
  - campo: superficie_parcela_m2
    descripcion: >-
      Data Center Market da dos cifras en la misma pieza: «637.000 metros cuadrados»
      y «636.432 metros cuadrados». Invest in Cantabria dice «637,000 square meters».
      La presentación del promotor desglosa los tres ámbitos en 374.572, 131.200 y
      130.660 m², que coinciden con la cifra menor. Se mantiene el valor registrado.
    fuentes: [src-1, src-3, src-4]
  - campo: conexion_electrica
    descripcion: >-
      Data Center Market cita la subestación de Penagos (220.000 voltios) como punto
      de conexión, pero en junio de 2025 el consejero ya explicaba que hacían falta
      dos nuevas posiciones en esa subestación, en noviembre de 2025 la Consejería
      seguía reclamando el acceso al Ministerio y en mayo de 2026 el propio consejero
      condicionaba la ejecución del proyecto a esa decisión. La capacidad no consta
      concedida a agosto de 2026.
    fuentes: [src-3, src-5]
  - campo: estado
    descripcion: >-
      El calendario ha resbalado. En junio de 2025 el consejero situaba la aprobación
      del PSIR de la fase 1 en diciembre de 2025 y el inicio de obras en enero de
      2026. No se ha localizado ni la aprobación del PSIR ni el inicio de las obras.
    fuentes: [src-5]
  - campo: otros
    descripcion: >-
      Data Center Market afirma que el campus se conecta al «cable submarino MAREA que
      conecta Santander con Carolina del Sur». Marea amarra en Sopelana (Bizkaia); el
      cable que une Santander con Myrtle Beach (Carolina del Sur) es Anjana. Se
      considera un error de la fuente y no se registra como dato.
    fuentes: [src-3]

