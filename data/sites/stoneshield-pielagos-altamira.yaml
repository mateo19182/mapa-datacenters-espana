    la presentación del promotor. El consejero de Industria afirma, en cambio, que la
    instalación «no gastará agua para su refrigeración» por las condiciones
    climáticas de la región.
  origen: "Recolección de agua de lluvia en el propio campus (según el promotor)"
  nota: >-
    Las dos descripciones disponibles no son compatibles y ninguna cifra el consumo.
    No se declara circuito cerrado ni sin_agua: la afirmación de que no consume agua
    procede de una comparecencia parlamentaria, no de documentación técnica, y el
    propio promotor describe un aprovechamiento de pluviales para refrigerar.
