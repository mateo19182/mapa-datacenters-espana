  - "CPD Inditex Laracha"
tipo: edificio
operador: "Inditex"
propietario: "Inditex"
modelo: corporativo

ubicacion:
  municipio: A Laracha
  provincia: A Coruña
  ccaa: Galicia
  lat: null
  lon: null
  precision: municipio
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Segundo centro de proceso de datos de Inditex, en el polígono industrial de A Laracha, junto a
  la plataforma logística del grupo. Anunciado en 2019 con una inversión superior a ocho millones
  de euros. El Uptime Institute lo registra como «Data Center 2, Phase 1» con certificación Tier IV
  de diseño y de instalación construida. Ninguna fuente publica una fecha de puesta en servicio.
estado_fuentes: [src-1, src-2]

potencia: []

superficie_construida_m2: 3800
inversion_anunciada_eur: 8000000

incertidumbres:
  - campo: estado
    descripcion: >-
      La certificación de instalación construida acredita que el edificio existe y se ha probado,
      no que esté prestando servicio. Ninguna fuente publica fecha de puesta en servicio, de modo
      que el estado operativo se apoya en la certificación y en el anuncio de 2019, no en una
      declaración expresa.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      No consta potencia de ningún tipo. La inversión y la superficie no permiten derivarla.
    fuentes: [src-1]
  - campo: fases
    descripcion: >-
      El Uptime Institute lo nombra «Phase 1», lo que sugiere fases posteriores previstas. No se ha
      localizado ninguna fuente que las describa.
    fuentes: [src-2]

confianza: baja
ultima_verificacion: "2026-08-31"

