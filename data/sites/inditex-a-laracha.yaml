    titulo: "Inditex invertirá ocho millones de euros en un centro para procesar datos en A Laracha"
    editor: "La Opinión A Coruña"
    tipo: prensa_general
    fecha_publicacion: "2019-06-27"
    fecha_consulta: "2026-08-31"
    cita: >-
      El Concello de A Laracha ha concedido a Inditex una licencia urbanística para la construcción
      de un centro de procesamiento de datos complementario a los edificios que ya posee en el
      polígono. Este nuevo inmueble contará con dos plantas (baja y primera) y una superficie total
      de 3.800 metros cuadrados. El proyecto que promueve la multinacional tiene un presupuesto
      superior a los ocho millones euros.
