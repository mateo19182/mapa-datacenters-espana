id: inditex-a-laracha
nombre: "Inditex — CPD de A Laracha"
alias:
  - "Inditex Data Center 2"
  - "CPD Inditex Laracha"
tipo: edificio
operador: "Inditex"
propietario: "Inditex"
modelo: corporativo

ubicacion:
  municipio: A Laracha
  provincia: A Coruña
  ccaa: Galicia
  lat: null
  lon: null
  precision: municipio
  fuentes: [src-1, src-2]

estado: operativo
estado_detalle: >-
  Segundo centro de proceso de datos de Inditex, en el polígono industrial de A Laracha, junto a
  la plataforma logística del grupo. El Concello de A Laracha concedió la licencia urbanística en
  la primera Junta de Gobierno Local del mandato, en junio de 2019, para un inmueble de dos
  plantas (baja y primera) y 3.800 m², con un presupuesto superior a ocho millones de euros. El
  Uptime Institute lo registra como «Data Center 2, Phase 1» con certificación Tier IV de diseño y
  de instalación construida. Ninguna fuente publica una fecha de puesta en servicio.
estado_fuentes: [src-1, src-2, src-3]

potencia: []

superficie_construida_m2: 3800
inversion_anunciada_eur: 8000000

incertidumbres:
  - campo: estado
    descripcion: >-
      La certificación de instalación construida acredita que el edificio existe y se ha probado,
      no que esté prestando servicio. Ninguna fuente publica fecha de puesta en servicio, de modo
      que el estado operativo se apoya en la certificación y en el anuncio de 2019, no en una
      declaración expresa.
    fuentes: [src-1, src-2]
  - campo: potencia
    descripcion: >-
      No consta potencia de ningún tipo. La inversión y la superficie no permiten derivarla. A
      diferencia del CPD de Arteixo, del que el instalador eléctrico publicó las acometidas, no se
      ha localizado ninguna empresa proveedora que describa la instalación de A Laracha.
    fuentes: [src-1, src-3]
  - campo: fases
    descripcion: >-
      El Uptime Institute lo nombra «Phase 1», lo que sugiere fases posteriores previstas. No se ha
      localizado ninguna fuente que las describa.
    fuentes: [src-2]

confianza: baja
ultima_verificacion: "2026-08-31"

