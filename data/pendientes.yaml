# Pistas de cobertura sin ficha física suficiente. No forman parte de los totales.
# La revisión de 17/10/2026 conserva los límites de las fuentes y documenta
# las tres altas resueltas en research/revisiones/2026-10-17-lagunas-cobertura-normativa.md.
fecha: "2026-10-17"
origen: "Auditoría original de agosto y revisión completa de las 17 pistas el 17 de octubre de 2026"

proyectos:
  - municipio: Granada
    provincia: Granada
    ccaa: Andalucía
    compania: DataRush IT
    potencia_citada: null
    prioridad: baja
    nota: >-
      La nota de DataRush publicada el 17/07/2024 preveía abrir Granada a finales de ese año.
      No se ha localizado confirmación posterior de apertura, dirección ni instalación nombrada.
      Baxtel describe tres centros pero enumera los dos de Málaga ya registrados; no basta para
      dar el objetivo por cumplido. Fuente primaria:
      https://www.datarush.es/inauguracion_del_segundo_centro_de_datarush_en_malaga/
  - municipio: Velilla del Río Carrión
    provincia: Palencia
    ccaa: Castilla y León
    compania: Echelon Iberdrola Digital Infra
    potencia_citada: null
    prioridad: media
    nota: >-
      No se ha localizado proyecto físico confirmado en las búsquedas de Iberdrola, Echelon
      y fuentes públicas. La nota de la empresa conjunta de 26/11/2025 identifica Madrid Sur;
      los más de 700 MW que cita están cerca de Madrid y no se asignan a Velilla. Las menciones
      secundarias y la existencia de la antigua central no identifican un CPD. Fuente primaria:
      https://www.iberdrolaespana.com/sala-comunicacion/noticias/joint-venture-echelon-iberdrola-digital-centros-datos-espana
  - municipio: Madrid
    provincia: Madrid
    ccaa: Comunidad de Madrid
    compania: Unicaja
    potencia_citada: null
    prioridad: baja
    nota: >-
      Unicaja confirmó el 04/06/2026 un nuevo CPD en Madrid para ATLAS, cuyo despliegue prevé
      desde 2026 hasta mediados de 2028. No publica anfitrión, edificio ni capacidad. Es distinto
      del hub de oficinas de Málaga TechPark, previsto para 2027; el presupuesto del plan
      tecnológico tampoco es inversión aislada del CPD. Fuente:
      https://www.unicajabanco.com/es/sala-de-comunicacion/buscador-noticias/2026/06/refuerzo-de-la-seguridad-tecnologica-e-incremento-de-las-capacid
  - municipio: Cifuentes
    provincia: Guadalajara
    ccaa: Castilla-La Mancha
    compania: Solaria
    potencia_citada: "50-100 MW, mención secundaria sin tipo ni confirmación"
    prioridad: media
    nota: >-
      Las búsquedas nuevas no han localizado expediente técnico del CPD ni confirmación del
      promotor. Las alertas vecinales de agosto de 2026 sobre unas 20 hectáreas siguen siendo
      pistas, no permisos. Las autorizaciones fotovoltaicas de Trillo/Cifuentes no prueban un
      centro de datos ni su potencia. Referencia de la denuncia:
      https://www.guadapress.es/noticia/58050/guadalajara/un-cetro-de-datos-en-cifuentes.html
  - municipio: A Coruña
    provincia: A Coruña
    ccaa: Galicia
    compania: ABANCA
    potencia_citada: null
    prioridad: media
    nota: >-
      La propia ABANCA confirma el 30/04/2026 un segundo CPD en su sede de A Coruña, de su
      propiedad y operativo en paralelo con Pocomaco. La existencia ya tiene respaldo primario;
      falta identificar sin ambigüedad el edificio anfitrión. No se le asigna la dirección de
      una oficina o sede legal ni la superficie reformada de Pocomaco. Fuente:
      https://comunicacion.abanca.com/es/noticias/abanca-transforma-el-edificio-de-su-principal-centro-de-datos-en-un-espacio-mas-funcional-eficiente-y-sostenible/
  - municipio: Méntrida
    provincia: Toledo
    ccaa: Castilla-La Mancha
    compania: Operador del CPD sin identificar; Solaria es la peticionaria eléctrica
    potencia_citada: null
    prioridad: alta
    nota: >-
      BOE-B-2026-32678, publicado el 08/10/2026, abre información pública de la línea directa y
      SE Venero 220/20 kV, Con-09, para un CPD nuevo. Las parcelas 57 y 58 del polígono 17 y
      5.745,2 m² corresponden a la subestación. La conexión restante a Villaviciosa 400 kV
      pertenece a PFot-417AC. El proyecto eléctrico, plano VENE-SOL-SE-PE-DRW-0021, dibuja
      edificios, límite y acceso del CPD junto a la SE desde CM-5007; ya existe emplazamiento
      gráfico. La memoria de línea cita 213 MW del CPD sin tipo IT, distintos de 311,29 MW
      de transporte, sin permiso o entrega acreditados. Faltan identidad, parcela propia, titular
      y operador; los MVA y las coordenadas de la SE no son MW TI ni un pin del centro. No es
      licencia del CPD. Fuentes: https://www.boe.es/diario_boe/txt.php?id=BOE-B-2026-32678
      y https://almacen.redsara.es/sending/public/d082558d-91ae-4e49-86e0-d5b14713e429

pistas:
  - >-
    L14 REIS / Villena, Casa del Padre: sigue siendo oferta de suelo industrial para un campus,
    sin operador ni edificio técnico identificado. El Ayuntamiento presentó el ámbito de
    332.000 m² el 23/09/2025. La asesora Pygmalion habla de solicitudes de potencia de hasta
    100 MW a 132 kV, no de 100 MW TI ni acceso concedido. Fuentes:
    https://www.villena.es/noticia/villena-desarrollara-el-primer-campus-logistico-de-datos-de-la-provincia-en-el-suelo-industrial-casa-del-padre/
    y https://pygmalionspain.com/campus-data-center-villena/
  - >-
    Ponentia comercializa actualmente tres suelos: Lleida Nord, L'Hospitalet de l'Infant y
    La Melusa, Tamarite de Litera. L'Espluga de Francolí constaba en la pista histórica, pero no
    aparece en la oferta actual; no se deduce retirada definitiva. No se identifica operador
    de CPD. En La Melusa, la modificación inicial VFL/907/2026 trata de una línea de 132 kV y
    la VFL/1319/2026, publicada en el portal el 11/09/2026, de una planta fotovoltaica de
    47,5 MW; ninguna acredita construcción de un CPD. Fuentes:
    https://ponentia.eu/data-centers/ y https://www.aragon.es/-/modif2-piga-melusa-tamarite
  - >-
    Ribera de Navarra: el desglose publicado en noviembre de 2025 recogía Peralta 132 MW y
    cinco solicitudes de 50 MW en Valtierra I/II, Tudela, Arguedas y Ribaforada; no describe por
    sí solo su situación actual. Peralta ya tiene ficha como CPD4GREEN: la CNMC documenta la
    cancelación de su primera solicitud y otra alternativa suspendida durante el conflicto.
    Los demás promotores y desenlaces requieren expedientes individualizados; no se suman
    estos 382 MW de solicitudes históricas como capacidad vigente. Fuentes:
    https://www.diariodenavarra.es/noticias/navarra/2025/11/15/dos-seis-centros-datos-proyectados-ribera-siguen-tramite-dnexclusivo-800176-15.html
    y https://www.cnmc.es/sites/default/files/6289701.pdf
  - >-
    Aprisco Group / Asturias: la propuesta de marzo de 2026 buscaba 100.000 m² en la zona
    central. No se ha localizado selección de parcela, proyecto técnico ni desenlace oficial.
    Las ubicaciones candidatas y el plazo de siete días de su oferta no prueban implantación
    ni cancelación. Referencia:
    https://www.datacenterdynamics.com/es/noticias/aprisco-group-tienta-a-asturias-con-un-data-center-y-1000-millones-de-euros-de-inversi%C3%B3n/
  - >-
    Madrid Digital / Telefónica: recuperado el expediente ECON/000145/2024 de arrendamiento,
    adjudicado por acuerdo de 30/05/2025 y formalizado el 14/06/2025 por un máximo de
    24.559.881,88 euros con IVA. El contrato y los anexos publicados consultados no identifican
    el edificio adjudicado. No es un nuevo CPD propio ni ese importe un CAPEX de construcción.
    El pliego exige 400 m² y 500 kW para el inquilino; no son capacidad total del anfitrión.
    La modificación de noviembre reduce temporalmente la sala a 200 m² por retrasos de
    migraciones. Falta identificar el anfitrión y comprobar la recepción efectiva. Fuente:
    https://www.contratos-publicos.comunidad.madrid/contrato-publico/contrato-arrendamiento-espacios-tecnicos-necesarios-albergar-centro-proceso-0
  - >-
    MasOrange: el Informe de Sostenibilidad 2025 recuperado desde el portal ESG oficial no
    aporta un inventario de CPD con nombre y dirección. Las noticias sobre una posible venta
    de cerca de doce centros no acreditan su cierre ni doce instalaciones identificables.
    Se conserva la búsqueda de inventario y de una comunicación oficial de operación, sin
    asignar ubicaciones ni comprador. Informe vigente:
    https://www.orange.es/static/pdf/ES_2025-Informe-de-Sostenibilidad-MasOrange_vdef.pdf
  - >-
    Quetta / Azora: la cartera objetivo sigue siendo seis centros en España y Portugal;
    Tres Cantos y Molins de Rei son los dos emplazamientos españoles identificados. La
    mención de Lisboa entre ciudades objetivo no identifica un tercer edificio y no permite
    calcular que solo quedan tres centros por anunciar. Faltan nombres y ubicaciones de los
    demás proyectos, sin convertir el objetivo de cartera en seis compromisos firmes. Fuente:
    https://www.azora.com/en/blog/azora-in-collaboration-with-core-capital-launches-quetta-platform-to-invest-more-than-e500m-into-iberian-data-centers/
  - >-
    Google europe-southwest1: Compute Engine enumera tres zonas con ubicación genérica Madrid,
    sin correspondencia física publicada. El identificador mad-zone1-99037 de Cloud Interconnect
    en Nabiax Alcalá no es europe-southwest1-a y no permite asignar una zona de cómputo al
    edificio. Siguen pendientes las relaciones físicas de las tres zonas, sin multiplicar
    capacidad ni confundir un punto de interconexión con servidores. Fuentes:
    https://docs.cloud.google.com/compute/docs/regions-zones?hl=es
    y https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/choosing-colocation-facilities
