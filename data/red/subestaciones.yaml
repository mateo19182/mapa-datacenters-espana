# Subestaciones de 400/220 kV relevantes para los clusters de centros de datos
# ---------------------------------------------------------------------------
# Alcance: nudos de la RED DE TRANSPORTE peninsular que aparecen en el fichero
# de capacidad de acceso de DEMANDA publicado por Red Eléctrica (gestor de la red
# de transporte, GRT). No es un inventario completo de subestaciones de España.
#
# Un registro = un emplazamiento físico. Los "nudos" de Red Eléctrica se
# identifican por nombre + tensión (p. ej. "ANCHUELO 400" y "ANCHUELO 220" son
# dos nudos del mismo emplazamiento). Las capacidades de acceso se publican POR
# NUDO, no por subestación: el detalle está en data/red/capacidad.yaml.
#
# ATENCIÓN — distinción crítica: todos los datos de capacidad de este directorio
# se refieren a capacidad de acceso para DEMANDA (consumo). La capacidad de
# acceso para GENERACIÓN es un dato distinto y no se recoge aquí.
#
# Coordenadas: proceden de OpenStreetMap (ODbL). Se han validado exigiendo que
# la comunidad autónoma obtenida por geocodificación inversa coincida con la que
# Red Eléctrica asigna al nudo. Precisión declarada "aproximada": es el centroide
# del recinto mapeado en OSM, no un levantamiento topográfico. Cuando no se ha
# podido validar una correspondencia, lat/lon van a null y precision: desconocida.
#
# "titular" recoge la etiqueta operator de OSM cuando existe; es indicativa y NO
# es fuente oficial de titularidad. "gestor_red" sí es firme: todos estos nudos
# son nudos de la red de transporte gestionada por Red Eléctrica.

ultima_verificacion: "2026-08-29"

