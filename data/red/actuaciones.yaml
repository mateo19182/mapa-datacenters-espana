# Actuaciones de red de transporte relevantes para los clusters de centros de datos
# ================================================================================
# Qué es esto: obras de la red de transporte (nuevas subestaciones, ampliaciones,
# nuevas líneas y ejes de 400/220 kV) que afectan a las zonas donde se concentran
# los proyectos de CPD. Se recogen tal y como aparecen en los instrumentos de
# planificación vinculante y en la propuesta en tramitación.
#
# CUÁL ES EL DOCUMENTO VIGENTE A 29-08-2026
# -----------------------------------------
# Vigente y vinculante para Red Eléctrica: la "Planificación de la Red de
# Transporte de Energía Eléctrica. Horizonte 2026" (periodo 2021-2026), aprobada
# por Acuerdo de Consejo de Ministros de 22 de marzo de 2022, con TRES
# modificaciones de aspectos puntuales (MAPs) ya aprobadas:
#   - MAP 1: abril de 2024   (+489 M€) — incluye el capítulo MAP_CONSUM de nuevos
#            consumidores conectados a la red de transporte.
#   - MAP 2: julio de 2025   (+750 M€) — compensación de reactiva y control de
#            tensión tras el cero del 28 de abril de 2025.
#   - MAP 3: julio de 2026   (+615 M€) — 51 actuaciones de resiliencia
#            (e-STATCOM, reactancias, MCSR). Acuerdo de Consejo de Ministros de
#            28 de julio de 2026, publicado por Resolución de 3 de agosto de 2026.
#   Inversión total de la planificación H2026 tras la tercera MAP: 8.818 M€.
#
# NO vigente todavía: la "Planificación de la Red de Transporte 2025-2030"
# (horizonte 2030). Su Propuesta se sometió a audiencia e información pública del
# 10 de octubre al 16 de diciembre de 2025. A 29-08-2026 el proceso está en la
# FASE 4 (Estudios) de las seis fases del procedimiento: Red Eléctrica analiza las
# alegaciones y elabora la Propuesta de Desarrollo de la Red de Transporte. No hay
# aprobación por Consejo de Ministros y, por tanto, sus actuaciones NO son
# vinculantes ni ejecutables. Cualquier cifra de la propuesta es indicativa.
#
# Vocabulario de los anexos de Red Eléctrica:
#   E/S ......... entrada-salida (se abre una línea existente para entrar en una
#                 subestación nueva o ampliada).
#   DC / cto .... doble circuito / circuito.
#   Motiv. ...... motivación de la actuación en el anexo:
#                 Consum. = nuevo consumidor conectado a la red de transporte;
#                 RdT = necesidad de la propia red de transporte;
#                 ApD = apoyo a la red de distribución;
#                 EjeFerr. = eje ferroviario.
#   Prev. ....... año previsto de puesta en servicio (">2026" = fuera del horizonte
#                 de la planificación vigente).
#
# ADVERTENCIA SOBRE LA MOTIVACIÓN: los anexos de planificación NO nombran empresas
# ni tipos de instalación concretos. Donde abajo se dice que una actuación está
# motivada por "nuevos consumidores", es literalmente lo que dice el documento; no
# implica que el consumidor sea un centro de datos. Solo se afirma vínculo con CPD
# cuando la fuente lo dice.

ultima_verificacion: "2026-08-29"

