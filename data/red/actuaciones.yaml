    tipo: plan
    tension_kv: [400, 220]
    municipios: null
    ccaa: [nacional]
    horizonte: "2030"
    estado_tramitacion: en_tramitacion
    estado_detalle: "Procedimiento iniciado por la Orden TED/1375/2023. Propuesta inicial presentada el 12 de septiembre de 2025 y sometida a audiencia e información pública (también ambiental) desde el 10 de octubre hasta el 16 de diciembre de 2025 (BOE-B-2025-36444). A 29-08-2026 el proceso está en la fase 4 de 6 (Estudios): Red Eléctrica analiza las alegaciones y elabora la Propuesta de Desarrollo. NO aprobada; NO vinculante."
    motivacion: >-
      La demanda es el principal motor de la propuesta. Según la nota de La Moncloa
      de 12-09-2025, la propuesta destina 13.590 M€ hasta 2030 para incorporar 27,7 GW
      de nueva capacidad en la red de transporte y 5,3 GW en distribución, con un reparto
      funcional que asigna 13,1 GW a hidrógeno verde, 9 GW a industria, 3,8 GW a CENTROS
      DE DATOS, 1,8 GW a vivienda, 1,2 GW a puertos y 560 MW a ferrocarril, a través de
      422 ampliaciones de conexión. El sumario ejecutivo añade que solo se ha incorporado
      al escenario "aproximadamente un 25% de las propuestas de demanda recibidas".
    inversion_eur: 13590000000
    inversion_nota: "13.590 M€ es la cifra de la Propuesta (no aprobada). La planificación vigente H2026 asciende a 8.818 M€ tras la tercera MAP."
    cpd_explicito: true
    clusters_relacionados: [nacional, madrid, aragon, cataluna, valencia-sagunto, pais-vasco, andalucia, guadalajara-toledo]
    incertidumbres:
      - campo: actuaciones_detalladas
        descripcion: "El listado individualizado de actuaciones de la Propuesta H2030 no se ha podido localizar en formato público accesible: solo se ha localizado el sumario ejecutivo. Las cifras funcionales (3,8 GW para centros de datos) proceden de la nota de prensa de La Moncloa y de la cobertura de la audiencia pública, no de un anexo tabulado consultado directamente."
        fuentes: [src-moncloa-h2030, src-h2030-sumario]
