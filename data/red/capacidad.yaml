# Capacidad de acceso para DEMANDA en los nudos de la red de transporte
# =====================================================================
# Fuente: fichero oficial publicado por Red Eléctrica en su condición de gestor
# de la red de transporte (GRT).
#
#   fecha_publicacion_dato: 2026-08-03
#   url_csv:  https://www.ree.es/sites/default/files/12_CLIENTES/Documentos/2026_08_03_GRT_demanda.csv
#   url_xlsx: https://www.ree.es/sites/default/files/12_CLIENTES/Documentos/2026_08_03_GRT_demanda.xlsx
#   url_pdf:  https://www.ree.es/sites/default/files/12_CLIENTES/Documentos/2026_08_03_GRT_demanda.pdf
#   pagina:   https://www.ree.es/es/clientes/consumidor/acceso-conexion/conoce-la-capacidad-de-acceso
#
# ESTE DATO CADUCA. Red Eléctrica publicó estas capacidades por primera vez el
# 20 de febrero de 2026 y debe actualizarlas MENSUALMENTE (Resolución de la CNMC
# de 1 de diciembre de 2025, BOE-A-2025-25253). El nombre del fichero incorpora la
# fecha: para refrescar, sustituir "2026_08_03" por la fecha de la última versión
# enlazada en la página anterior. No extrapolar estas cifras a otra fecha.
#
# DEMANDA, NO GENERACIÓN. Todo lo que hay aquí es capacidad de acceso para
# consumo. La capacidad de acceso para generación se publica en ficheros y mapas
# distintos y no es comparable ni sumable con esta.
#
# Glosario de las columnas del fichero de REE:
#   RdT / RdD .............. red de transporte / red de distribución.
#   CEP .................... consumo conectado mediante electrónica de potencia.
#                            Es el caso habitual de un centro de datos (rectificadores,
#                            SAI/UPS). REE evalúa estos consumos también con el criterio
#                            de potencia de cortocircuito (índice WSCR).
#   NO CEP ................. consumo sin electrónica de potencia en la interfaz.
#   CH / SH ................ "con hueco" / "sin hueco": si la instalación soporta o no
#                            huecos de tensión. REE avisa de que los futuros requisitos
#                            de robustez (soporte de huecos) elevarán la capacidad
#                            otorgable en muchos nudos hoy limitados por criterio dinámico.
#   valor de referencia .... capacidad del nudo de transporte reservada para alimentar
#                            consumos que se conectan a la red de DISTRIBUCIÓN aguas abajo.
#                            "no acordado" = REE y la distribuidora aún no lo han pactado,
#                            por lo que en ese nudo no se publica capacidad otorgable.
#   criterio limitante ..... qué criterio restringe la capacidad: WSCR_Nudo (cortocircuito),
#                            Est_Dem_Nudo / Est_Dem_Zona (estático), Din1_Zona / Din2_Zona
#                            (dinámico), Est_Alm_* (estático de almacenamiento).
#   nudo_de_concurso ....... el nudo está reservado para un concurso de capacidad de
#                            acceso de demanda (art. 20 bis y ss. del RD 1183/2020).
#
# Alcance de este fichero: nudos de 220 kV y 400 kV de las CCAA con clusters de CPD
# (Madrid, Aragón, Cataluña, Castilla-La Mancha, País Vasco, Comunidad Valenciana,
# Andalucía y Extremadura). No incluye 132/66 kV ni sistemas no peninsulares.

