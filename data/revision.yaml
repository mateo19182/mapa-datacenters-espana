  - id: mentrida-venero-con09
    titulo: Identificar el CPD de Méntrida asociado a SE Venero
    tipo: proyecto
    estado: awaiting_primary
    prioridad: alta
    detectado: 2026-10-12
    revisado: 2026-10-17
    revisar_antes: 2026-10-21
    motivo: Los proyectos de SE y línea sitúan gráficamente el CPD junto a Venero. La memoria de línea, página 8
      del PDF, cita 213 MW del centro sin tipo IT ni permiso acreditado, distintos de los 311,29 MW de
      transporte. Los cuatro adjuntos públicos, incluidos los ZIP GIS, no identifican operador, titular o
      parcelario propios del CPD. Las coordenadas de SE y servidumbres eléctricas no son un pin del centro.
    siguiente_paso: Contrastar nombre, titular y parcelas del CPD dibujado con su proyecto y permisos propios; no
      asignarle las coordenadas de SE Venero ni convertir sus MVA a MW IT.
