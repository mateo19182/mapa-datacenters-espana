name: Validación y construcción

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true  # astro exige >= 22.23.4; la caché del runner puede ir por detrás
          cache: npm
      - run: npm ci
      - name: Comprobar vulnerabilidades altas o críticas
        run: node scripts/check-npm-audit.mjs
      - run: npm test

      # El esquema es la primera línea de defensa: un error bloquea la fusión.
      - name: Validar el conjunto de datos
        run: npm run validate:strict

      - name: Construir el sitio
        run: npm run build

      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Comprobar navegación e interacción
        run: npm run test:ui

      - name: Publicar pruebas de interfaz
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pruebas-de-interfaz
          path: build/ui/

      - name: Publicar el parte de validación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parte-de-validacion
          path: research/informe-validacion.md

      - name: Conservar auditoría de dependencias
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditoria-dependencias
          path: build/seguridad/
          if-no-files-found: ignore
          retention-days: 30

      - name: Resumen
        if: always()
        run: |
          if [ -f research/informe-validacion.md ]; then cat research/informe-validacion.md >> "$GITHUB_STEP_SUMMARY"; fi
