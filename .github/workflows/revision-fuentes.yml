name: Revisión periódica de fuentes

on:
  schedule:
    # Lunes a las 05:20 UTC. Semanal basta: estos proyectos se mueven en meses.
    - cron: '20 5 * * 1'
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Conservar observaciones del PR semanal pendiente
        run: |
          referencia=$(git ls-remote --heads origin refs/heads/revision/fuentes)
          if [ -n "$referencia" ]; then
            git fetch --no-tags origin refs/heads/revision/fuentes
            git show FETCH_HEAD:data/huellas.json > "$RUNNER_TEMP/huellas-pendientes.json"
            node scripts/check-updates.mjs --fusionar "$RUNNER_TEMP/huellas-pendientes.json" --informe
          fi

      # Nunca modifica datos: solo recalcula huellas y arma la cola de revisión.
      - name: Comprobar las fuentes registradas
        id: revision
        continue-on-error: true
        run: |
          resultado=0
          node scripts/check-updates.mjs || resultado=$?
          if [ "$resultado" -ne 0 ] && [ "$resultado" -ne 10 ]; then
            exit "$resultado"
          fi

      - name: Comprobar publicación de REE
        id: ree
        continue-on-error: true
        run: |
          resultado=0
          npm run refresh:ree || resultado=$?
          if [ "$resultado" -ne 0 ] && [ "$resultado" -ne 10 ]; then
            exit "$resultado"
          fi

      # Integra adiciones y conserva los valores que requieren decisión.
      - name: Integrar propuestas sin conflicto
        id: propuestas
        continue-on-error: true
        run: |
          resultado=0
          node scripts/apply-proposals.mjs --aplicar || resultado=$?
          if [ "$resultado" -ne 0 ] && [ "$resultado" -ne 11 ]; then
            exit "$resultado"
          fi

      - name: Generar datos e informe desde la misma instantánea
        run: npm run data

      - name: Informar de fallos del comprobador
        if: always()
        env:
          RESULTADO_FUENTES: ${{ steps.revision.outcome }}
          RESULTADO_REE: ${{ steps.ree.outcome }}
          RESULTADO_PROPUESTAS: ${{ steps.propuestas.outcome }}
        run: |
          if [ "$RESULTADO_FUENTES" = failure ]; then
            echo 'El comprobador de fuentes falló. Las observaciones conservan su fecha anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$RESULTADO_REE" = failure ]; then
            echo 'No se pudo comprobar la publicación de REE. Consultar el informe antes de afirmar que no hay novedades.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$RESULTADO_PROPUESTAS" = failure ]; then
            echo 'La integración de propuestas falló. Revisar el error y el diff antes de fusionar.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Abrir propuesta de actualización
        uses: peter-evans/create-pull-request@v6
        with:
          branch: revision/fuentes
          title: 'Revisión de fuentes — ${{ github.run_id }}'
          commit-message: 'Actualizar huellas de fuentes y cola de revisión'
          labels: datos, revisión
          body: |
            Revisión automática de las fuentes registradas.

            **No se ha sobrescrito ningún dato existente.** Las adiciones sin conflicto
            se han aplicado; los conflictos quedan listados para decidirlos a mano.

            - `research/informe-actualizacion.md` — fuentes cambiadas, enlaces rotos y fichas caducadas
            - `research/informe-propuestas.md` — adiciones aplicadas y conflictos pendientes
            - `research/informe-validacion.md` — estado del esquema tras los cambios
            - `research/informe-ree.md` — si REE ha publicado una edición posterior de capacidad de demanda

            Antes de fusionar: revisar los conflictos, editar los YAML afectados y actualizar
            su `ultima_verificacion`.
          add-paths: |
            data/**
            research/**

      - name: Señalar comprobaciones incompletas
        if: always()
        env:
          RESULTADO_FUENTES: ${{ steps.revision.outcome }}
          RESULTADO_REE: ${{ steps.ree.outcome }}
          RESULTADO_PROPUESTAS: ${{ steps.propuestas.outcome }}
        run: |
          if [ "$RESULTADO_FUENTES" = failure ] || [ "$RESULTADO_REE" = failure ] || [ "$RESULTADO_PROPUESTAS" = failure ]; then
            exit 1
          fi
