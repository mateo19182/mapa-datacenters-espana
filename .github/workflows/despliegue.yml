name: Despliegue en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Alternativa al conector Git de Cloudflare Pages: útil si se prefiere que la
# construcción ocurra aquí, con la misma validación que el resto del flujo.
concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:strict
      - run: npm run build

      - name: Subir a Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mapa-datacenters-espana --branch=${{ github.ref_name }}
