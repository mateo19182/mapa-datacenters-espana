name: Despliegue en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Alternativa al conector Git de Cloudflare Pages: útil si se prefiere que la
# construcción ocurra aquí, con la misma validación que el resto del flujo.
jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:strict
      - run: npm run build

      - name: Subir a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mapa-datacenters-espana
