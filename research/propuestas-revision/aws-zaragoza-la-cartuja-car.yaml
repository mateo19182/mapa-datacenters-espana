id: aws-zaragoza-la-cartuja-car
estado_detalle: Quinto emplazamiento del PIGA "Expansión de la Región AWS en Aragón". Su proyecto
  de urbanización y el convenio interadministrativo se aprobaron definitivamente el 22 de agosto
  de 2025 y las infraestructuras de agua el 12 de noviembre de 2025, pero a fecha de 4 de mayo de
  2026 el promotor todavía no había presentado a aprobación definitiva el proyecto de edificación
  y urbanización interior de la parcela. El proyecto de líneas de 132 kV entre la SE Montetorrero
  y la parcela CAR quedó excluido de la aprobación definitiva de noviembre de 2025 por no estar completo
  el trazado. La Orden VFL/1438/2026, de 5 de octubre, publicada el 8 de octubre de 2026, aprueba
  inicialmente la nueva documentación del proyecto de reparcelación del sector Acampo del Marqués
  y de la interconexión por fibra óptica con El Burgo de Ebro, rutas 8 y 9. El anuncio BOA20261008021
  somete ambos proyectos y su documentación ambiental a información y participación pública durante
  un mes desde el día siguiente a su publicación. Este trámite corresponde a reparcelación y fibra;
  no acredita aprobación definitiva de la edificación ni inicio de obras del campus.
