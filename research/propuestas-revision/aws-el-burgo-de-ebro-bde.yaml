id: aws-el-burgo-de-ebro-bde
estado_detalle: Emplazamiento del PIGA "Expansión de la Región AWS en Aragón". Fue el único de los
  cinco cuya aprobación definitiva quedó en suspenso el 4 de mayo de 2026 por faltar la resolución
  ambiental. Notificada la resolución de INAGA de 21 de mayo de 2026 (DIA y autorización ambiental
  integrada), el Gobierno de Aragón aprobó definitivamente el 10 de junio de 2026 el proyecto de
  edificación y urbanización interior Fase 1 y la subestación BDE1HV 220/20 kV. La Orden VFL/1438/2026,
  de 5 de octubre, publicada el 8 de octubre de 2026, incorpora la nueva aprobación inicial del proyecto
  de interconexión por fibra óptica entre los centros de datos de El Burgo de Ebro y La Cartuja,
  rutas 8 y 9. El anuncio BOA20261008021 abre información y participación pública durante un mes
  desde el día siguiente a su publicación. El trámite de fibra no acredita comienzo de las obras
  del campus.
